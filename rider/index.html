function sbHeaders(token){
  const h = {apikey:SB.KEY, 'Content-Type':'application/json'};
  if(token) h.Authorization = 'Bearer '+token;
  return h;
}
async function sbAuth(path, body){
  const r = await fetch(SB.URL+'/auth/v1/'+path, {method:'POST', headers:sbHeaders(), body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const data = await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return ({})});
  if(!r.ok) throw new Error(data.error_description || data.msg || data.message || 'AUTH_ERROR');
  return data;
}
async function sbTable(path, options={}){
  const headers = sbHeaders(options.token);
  if(options.method && options.method!=='GET') headers.Prefer = 'return=representation';
  const r = await fetch(SB.URL+'/rest/v1/'+path, {
    method: options.method||'GET', headers, body: options.body?JSON.stringify(options.body):undefined,signal:AbortSignal.timeout(15000)
  });
  const data = await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok) throw new Error((data&&data.message) || 'DB_ERROR_'+r.status);
  return data;
}
function authEmailFromPhone(phone){ return String(phone||'').replace(/\D/g,'')+'@auth.queuetech.local'; }
function jwtExpiryMs(token){
  try{
    const part = String(token||'').split('.')[1];
    const b64 = part.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((part.length+3)%4);
    return Number(JSON.parse(atob(b64)).exp||0)*1000;
  }catch(e){ return 0; }
}
function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } }
function writeSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
let riderTokenRefresh=null;
async function getAccessToken(){
  const s=readSession();if(!s)return '';
  const rawExp=Number(s.expiresAt||0),exp=rawExp?(rawExp<1e12?rawExp*1000:rawExp):jwtExpiryMs(s.accessToken);
  if(exp-Date.now()>60000||!s.refreshToken)return s.accessToken;
  const key=JSON.stringify([s.authUserId,s.sessionId,s.refreshToken]);if(riderTokenRefresh?.key===key)return riderTokenRefresh.task;
  const sameActor=current=>!!current&&current.authUserId===s.authUserId&&current.sessionId===s.sessionId;
  const task=(async()=>{
    try{
      const r=await fetch(SB.URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:sbHeaders(),body:JSON.stringify({refresh_token:s.refreshToken}),signal:AbortSignal.timeout(15000)});
      const data=await r.json().catch(()=>({}));const current=readSession();if(!sameActor(current))return '';
      if(current.refreshToken!==s.refreshToken)return current.accessToken;
      if(!r.ok||!data.access_token)throw Error('SESSION_REFRESH_FAILED');
      const next={...s,accessToken:data.access_token,refreshToken:data.refresh_token||s.refreshToken,expiresAt:data.expires_at?data.expires_at*1000:jwtExpiryMs(data.access_token)};
      writeSession(next);if(sameActor(S.session))S.session=next;return next.accessToken;
    }catch(e){const current=readSession();if(!sameActor(current))return '';if(current.refreshToken!==s.refreshToken)return current.accessToken;if(exp>Date.now())return s.accessToken;throw e}
  })().finally(()=>{if(riderTokenRefresh?.task===task)riderTokenRefresh=null});riderTokenRefresh={key,task};return task;
}

function esc(v){ return String(v??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function haversineKm(lat1,lon1,lat2,lon2){
  if([lat1,lon1,lat2,lon2].some(v=>!Number.isFinite(Number(v)))) return Infinity;
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function mapsLink(lat,lng,address){
  if(Number.isFinite(Number(lat)) && Number.isFinite(Number(lng))) return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng);
  return address ? 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address) : 'https://www.google.com/maps/';
}

const DEVICE_ID_KEY='qtr_device_id_v1';
const SESSION_GUARD_MS=25000;
let sessionGuardTimer=null;
function getDeviceId(){
  try{let id=localStorage.getItem(DEVICE_ID_KEY);if(!id){id=crypto.randomUUID();localStorage.setItem(DEVICE_ID_KEY,id);}return id;}catch(e){return crypto.randomUUID();}
}
async function sbRpc(fn,body,token){
  const r=await fetch(SB.URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:sbHeaders(token),body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok)throw new Error((data&&data.message)||'RPC_ERROR_'+r.status);
  return data;
}
async function claimActiveSession(sessionId,authUserId,token){
  if(!sessionId||!authUserId||!token)throw new Error('ไม่สามารถยืนยันอุปกรณ์ที่ใช้งานได้');
  const result=await sbRpc('claim_active_session',{p_session_id:sessionId,p_device_id:getDeviceId()},token);
  if(Array.isArray(result)&&result[0]&&result[0].success===false)throw new Error('ไม่สามารถเปิด Session นี้ได้');
  return result;
}
function riderSessionMatches(session){
  const stored=readSession();
  return !!session&&!!stored&&!!S.session&&stored.authUserId===session.authUserId&&stored.sessionId===session.sessionId&&S.session.authUserId===session.authUserId&&S.session.sessionId===session.sessionId;
}
let riderSessionCheck=null;
function checkActiveSession(){
  const session=readSession();
  if(!session?.sessionId||!session.accessToken||!session.authUserId)return Promise.resolve(true);
  const key=JSON.stringify([session.authUserId,session.sessionId]);
  if(riderSessionCheck?.key===key)return riderSessionCheck.task;
  const task=(async()=>{
    try{
      const token=await getAccessToken();if(!riderSessionMatches(session))return false;
      const result=await sbRpc('check_active_session',{p_session_id:session.sessionId},token);
      if(!riderSessionMatches(session))return false;
      const ok=result===true||(Array.isArray(result)&&result[0]===true)||(result&&result.check_active_session===true);
      if(!ok){forceSessionLogout('บัญชีนี้ถูกเข้าสู่ระบบจากอุปกรณ์อื่น');return false}
      await sbRpc('touch_active_session',{p_session_id:session.sessionId},token);
      return riderSessionMatches(session);
    }catch(e){console.warn('Rider session check unavailable');return riderSessionMatches(session)}
  })().finally(()=>{if(riderSessionCheck?.task===task)riderSessionCheck=null});
  riderSessionCheck={key,task};return task;
}
function startSessionGuard(){
  stopSessionGuard();
  sessionGuardTimer=setInterval(()=>{if(S.session&&S.session.sessionId)checkActiveSession();},SESSION_GUARD_MS);
}
function stopSessionGuard(){if(sessionGuardTimer){clearInterval(sessionGuardTimer);sessionGuardTimer=null;}}
function forceSessionLogout(msg){
  stopSessionGuard();stopPolling();stopRiderChatWatch();window.qgClearRiderInbox?.();window.qtStopNewJobAlert?.();
  disposeRiderMap();
  clearSession();
  Object.assign(S,{session:null,user:null,riderProfile:null,online:false,activeOrder:null,openJobs:[],history:[],bundleOrders:[],bundleCandidates:[],laundryMode:false,laundryInvites:[],laundryJob:null,laundryPool:[],chatOrder:null});
  renderLogin(msg||'เซสชันนี้ถูกยกเลิก');
}
window.addEventListener('focus',()=>{if(S.session&&S.session.sessionId)checkActiveSession();});

/* ---------- boot ---------- */
function boot(){
  const s = readSession();
  if(s){ S.session = s; startSessionGuard(); resumeSession(); }
  else renderLogin();
}
let riderResumeTask=null;
function resumeSession(){
  const session=S.session;if(!session)return Promise.resolve();
  const key=JSON.stringify([session.authUserId,session.sessionId]);
  if(riderResumeTask?.key===key)return riderResumeTask.task;
  const task=(async()=>{
    try{
      if(session.sessionId&&!await checkActiveSession())return;
      if(!riderSessionMatches(session))return;
      const token=await getAccessToken();if(!riderSessionMatches(session))return;
      const rows=await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(session.authUserId),{token});
      if(!riderSessionMatches(session))return;
      const user=Array.isArray(rows)?rows[0]:null;
      if(!user||user.role!=='rider'){forceSessionLogout('บัญชีนี้ไม่ใช่บัญชีไรเดอร์');return}
      S.user=user;
      if(user.status==='suspended'){renderPending(user,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ');return}
      if(user.status!=='active'){renderPending(user,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ');return}
      if(await loadRiderProfile())renderStage();
    }catch(e){
      if(!riderSessionMatches(session))return;
      console.error('Rider session restore failed');
      document.getElementById('app').innerHTML='<main class="qg-pending"><section class="qg-pending-card"><div class="qg-pending-mark">Q</div><h1>เชื่อมต่อไม่ได้</h1><p>บัญชียังอยู่ในเครื่อง กรุณาต่ออินเทอร์เน็ตแล้วลองใหม่</p><button type="button" class="qg-btn qg-btn-primary" id="qg-rider-retry">ลองใหม่</button></section></main>';
      document.getElementById('qg-rider-retry').onclick=()=>resumeSession();
    }
  })().finally(()=>{if(riderResumeTask?.task===task)riderResumeTask=null});
  riderResumeTask={key,task};return task;
}
async function loadRiderProfile(){
  const session=S.session,userId=S.user?.id;if(!userId)return false;
  const current=()=>riderSessionMatches(session)&&S.user?.id===userId;
  const token=await getAccessToken();if(!current())return false;
  const rows=await sbTable('rider_profiles?select=*&user_id=eq.'+encodeURIComponent(userId),{token});
  if(!current())return false;
  S.riderProfile=Array.isArray(rows)&&rows[0]?rows[0]:null;
  S.online=!!S.riderProfile?.metadata?.online;
  try{const cached=JSON.parse(localStorage.getItem(qgRiderHistoryKey())||'null');if(cached&&Date.now()-cached.at<7*86400000&&Array.isArray(cached.history))S.history=cached.history}catch(e){}
  return true;
}

async function compressRiderImage(file,maxSize=1400,quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(im.width,im.height));
        const w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      im.onerror=reject; im.src=reader.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
const RIDER_DRAFT_DB='qt_rider_draft_v1';
function riderDraftOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(RIDER_DRAFT_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function saveRiderDraftFile(id,data,name){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({data,name,at:Date.now()},id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){console.warn('draft save failed',e);}}
async function loadRiderDraftFile(id){try{const db=await riderDraftOpen();const v=await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});db.close();return v;}catch(e){return null;}}
async function clearRiderDraft(){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){}}
async function riderFilePreview(inputId,previewId){
  const input=document.getElementById(inputId),img=document.getElementById(previewId);
  if(!input||!input.files[0]) return;
  const file=input.files[0];
  if(file.size>8*1024*1024){input.value='';toast('ไฟล์ต้องมีขนาดไม่เกิน 8 MB');return;}
  const nameEl=document.getElementById(inputId+'-name');
  if(nameEl) nameEl.textContent=file.name||'เลือกไฟล์แล้ว';
  try{
    let data='';
    if(file.type.startsWith('image/')){data=await compressRiderImage(file);if(img){img.src=data;img.style.display='block';}}
    else data=await readFileAsDataURL(file);
    await saveRiderDraftFile(inputId,data,file.name||inputId);
    if(inputId==='rr-photo') try{sessionStorage.setItem('qt_rider_profile_draft',JSON.stringify({data,name:file.name||'profile.jpg',at:Date.now()}));}catch(e){}
  }catch(err){console.error(err);toast('ไม่สามารถอ่านไฟล์ได้ กรุณาเลือกไฟล์ใหม่');}
}
function readFileAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
function riderUploadCard(id,label,required=true,accept='image/*'){
  return `<div class="rider-upload-item"><label>${label} ${required?'<span class="req">(บังคับ)</span>':''}</label><button type="button" class="qg-btn qg-btn-secondary rider-file-btn" onclick="openRiderFilePicker('${id}')">เลือกไฟล์</button><input id="${id}" class="rider-file-input" type="file" accept="${accept}" data-required="${required?'1':'0'}" onchange="riderFilePreview('${id}','${id}-preview'); event.stopPropagation();"><div id="${id}-name" class="qg-file-name">ยังไม่ได้เลือกไฟล์</div><img id="${id}-preview" class="rider-doc-preview" style="display:none"></div>`;
}

    source:'rider-registration',

    serviceProvince:form.province||null,
    serviceDistrict:form.district||null,
    vehicleType:form.vehicle||null,
    vehiclePlate:form.plate||null,
    vehicleMake:form.make||null,
    vehicleModel:form.model||null,
    requestedCapacityKg:form.capacity||null,
    profileImage:data['rr-photo']||null,
    idCardFrontImage:data['rr-id-front']||null,
    idCardBackImage:data['rr-id-back']||null,

function riderStepGo(step){
  const all=[...document.querySelectorAll('.rider-panel')];
  const target=Math.max(0,Math.min(3,step));
  const groups=[[all[0],all[1]],[all[2],all[3]],[all[4]],[all[5]]];
  all.forEach(p=>p.style.display='none');
  (groups[target]||groups[0]).forEach(p=>{if(p)p.style.display='block';});
  const steps=document.querySelectorAll('.rider-step');steps.forEach((x,i)=>{x.classList.toggle('active',i===target);x.classList.toggle('done',i<target);});
  window.__qtRiderStep=target;
  const submit=document.querySelector('.rider-submit');if(submit)submit.textContent=target===3?'ส่งใบสมัคร  →':'ถัดไป  →';
  const wizard=document.querySelector('.rider-wizard');if(wizard)wizard.scrollIntoView({behavior:'smooth',block:'start'});
}
async function riderStepNext(){
  if(window.__qtRiderAdvancing)return;
  window.__qtRiderAdvancing=true;
  try{
    const s=window.__qtRiderStep||0;
    const f=id=>document.getElementById(id);
    const hasFile=async id=>!!(f(id)?.files?.[0] || (await loadRiderDraftFile(id))?.data);
    if(s===0){
      if(!f('rr-name').value.trim()||!f('rr-phone').value.trim()||!f('rr-password').value){toast('กรุณากรอกข้อมูลส่วนตัวให้ครบ');return;}
      if(!/^0[0-9]{9}$/.test(f('rr-phone').value.replace(/[-\s]/g,''))){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก');return;}
      if(f('rr-password').value.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return;}
      if(f('rr-email').value&&!f('rr-email').checkValidity()){toast('กรุณากรอกอีเมลให้ถูกต้อง');return;}
      if(!(await hasFile('rr-photo'))){toast('กรุณาอัปโหลดรูปถ่ายหน้าตรง');return;}
    }
    if(s===1&&(!f('rr-plate').value.trim()||!f('rr-province').value||!f('rr-district').value.trim())){
      toast('กรุณากรอกทะเบียนรถ จังหวัด และอำเภอ/เขต');return;
    }
    if(s===2){
      for(const id of ['rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo']){
        if(!(await hasFile(id))){toast('กรุณาอัปโหลดเอกสารบังคับให้ครบ');return;}
      }
    }
    if(s<3)riderStepGo(s+1);
    else document.querySelector('form[onsubmit*=handleRiderRegistration]')?.requestSubmit();
  }catch(err){toast('ตรวจข้อมูลสมัครไม่สำเร็จ: '+err.message)}
  finally{window.__qtRiderAdvancing=false;}
}
function riderStepBack(){const s=window.__qtRiderStep||0;if(s>0)riderStepGo(s-1);else renderLogin();}
async function handleRiderRegistration(e){
  e.preventDefault();
  const f=id=>document.getElementById(id);
  const name=String(f('rr-name').value||'').trim(),phone=f('rr-phone').value.trim().replace(/[-\s]/g,''),password=f('rr-password').value;
  const email=String(f('rr-email').value||'').trim().toLowerCase();
  const form={email,area:String(f('rr-area').value||'').trim(),province:f('rr-province').value,district:String(f('rr-district').value||'').trim(),vehicle:f('rr-vehicle').value,plate:String(f('rr-plate').value||'').trim(),make:String(f('rr-make').value||'').trim(),model:String(f('rr-model').value||'').trim(),capacity:Number(f('rr-capacity').value||0)};
  if(!name||!phone||!password){toast('กรุณากรอกข้อมูลส่วนตัวให้ครบ');return false;}
  if(!/^0[0-9]{9}$/.test(phone)){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678');return false;}
  if(password.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return false;}
  if(!f('rr-province').value||!f('rr-district').value){toast('กรุณาเลือกจังหวัดและอำเภอ/เขต');return false;}
  if(form.capacity<0||form.capacity>1000){toast('ความจุรถไม่ถูกต้อง');riderStepGo(1);return false;}
  if(!form.plate){toast('กรุณากรอกทะเบียนรถ');riderStepGo(1);return false;}
  const agree=document.querySelector('.rider-confirm input[type=checkbox]'); const betaAgree=document.getElementById('rr-beta-accept');
  if(!agree||!agree.checked||!betaAgree||!betaAgree.checked){toast('กรุณายืนยันข้อมูลและยอมรับข้อตกลง Beta ก่อนส่งใบสมัคร');riderStepGo(3);return false;}
  const files=['rr-photo','rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo'];const data={};
  for(const id of files){const input=f(id);if(input&&input.files&&input.files[0]){const file=input.files[0];data[id]=file.type.startsWith('image/')?await compressRiderImage(file):await readFileAsDataURL(file);}else{const draft=await loadRiderDraftFile(id);if(draft&&draft.data)data[id]=draft.data;}}
  const requiredDocs=files;const labels={'rr-photo':'รูปถ่ายหน้าตรง','rr-id-front':'บัตรประชาชนด้านหน้า','rr-id-back':'บัตรประชาชนด้านหลัง','rr-license':'ใบขับขี่','rr-prb':'พ.ร.บ. รถ','rr-vehicle-photo':'รูปถ่ายคู่กับรถ'};const missing=requiredDocs.filter(id=>!data[id]);
  if(missing.length){toast('กรุณาอัปโหลด: '+missing.map(x=>labels[x]).join(', '));return false;}
  const submitBtn=e.submitter||document.querySelector('.rider-submit');if(submitBtn)submitBtn.disabled=true;
  try{
    toast('กำลังสร้างบัญชีและส่งใบสมัคร...');
    const authEmail=email||authEmailFromPhone(phone);
    const auth=await sbAuth('signup',{email:authEmail,password,data:{name,phone,role:'rider'}});
    if(!auth.user||!auth.user.id)throw new Error('สร้างบัญชี Supabase Authentication ไม่สำเร็จ');
    let session=auth.session;
    if(!session||!session.access_token){
      try{session=await sbAuth('token?grant_type=password',{email:authEmail,password});}
      catch(err){throw new Error(email?'บัญชีถูกสร้างแล้ว แต่ยังไม่ได้ยืนยันอีเมลใน Supabase':'บัญชี Auth ถูกสร้างแล้ว แต่ Supabase ยังไม่อนุญาตให้เข้าสู่ระบบทันที กรุณาปิด Email Confirmation ใน Supabase Authentication Settings แล้วสมัครใหม่');}
    }
    if(!session||!session.access_token)throw new Error('ไม่สามารถสร้าง Session ของบัญชีได้');
    const existing=await sbTable('users?select=id,auth_user_id,role,name,phone,status,created_at&auth_user_id=eq.'+encodeURIComponent(auth.user.id)+'&limit=1',{token:session.access_token});
    let profile=Array.isArray(existing)&&existing[0]?existing[0]:null;
    if(!profile){
      const created=await sbTable('users?select=id,auth_user_id,role,name,phone,status,created_at',{method:'POST',token:session.access_token,body:{auth_user_id:auth.user.id,role:'rider',name,phone,status:'pending'}});
      profile=Array.isArray(created)&&created[0]?created[0]:created;
    }
    if(!profile||!profile.id||String(profile.auth_user_id)!==String(auth.user.id))throw new Error('สร้างข้อมูลสมาชิกใน public.users ไม่สำเร็จ');
    const metadata=riderRegistrationMetadata(profile,data,form);
    const riderBody={user_id:profile.id,rider_name:name,phone,vehicle_type:form.vehicle,vehicle_plate:form.plate,address:form.area||null,latitude:null,longitude:null,status:'pending',metadata};
    const riderRows=await sbTable('rider_profiles?on_conflict=user_id',{method:'POST',token:session.access_token,body:riderBody});
    if(!riderRows) throw new Error('สร้างโปรไฟล์ไรเดอร์ไม่สำเร็จ');
    const sessionId=crypto.randomUUID();
    await claimActiveSession(sessionId,auth.user.id,session.access_token);
    S.session={authUserId:auth.user.id,accessToken:session.access_token,refreshToken:session.refresh_token||null,expiresAt:auth.expires_at?auth.expires_at*1000:(session.expires_at?session.expires_at*1000:jwtExpiryMs(session.access_token)),sessionId};
    writeSession(S.session);S.user=profile;S.riderProfile=Array.isArray(riderRows)?riderRows[0]:riderRows;S.online=false;
    startSessionGuard();
    await clearRiderDraft();try{sessionStorage.removeItem('qt_rider_profile_draft');sessionStorage.removeItem('qt_rider_register_hash');}catch(err){}
    toast('ส่งใบสมัครสำเร็จ รอ Admin ตรวจสอบ');
    renderPending(profile,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ');
  }catch(err){
    console.error('QueueGo rider registration error',err);
    const m=String(err&&err.message||'');
    toast(/already registered|User already registered|duplicate key/i.test(m)?'สมัครไม่สำเร็จ: เบอร์หรืออีเมลนี้ถูกใช้สมัครแล้ว':m||'สมัครสมาชิกไม่สำเร็จ');
  }finally{if(submitBtn)submitBtn.disabled=false;}
  return false;
}

async function doLogin(){
  const btn = document.getElementById('li-btn');
  if(!btn||btn.disabled)return;
  const current=()=>btn.isConnected&&document.getElementById('li-btn')===btn;
  const errBox = document.getElementById('li-err');
  const phone = document.getElementById('li-phone').value.trim();
  const pass = document.getElementById('li-pass').value;
  errBox.classList.remove('show');
  if(!phone || !pass){ errBox.textContent='กรุณากรอกอีเมลหรือเบอร์โทรและรหัสผ่าน'; errBox.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const email = phone.includes('@') ? phone : authEmailFromPhone(phone);
    const auth = await sbAuth('token?grant_type=password', {email, password:pass});
    if(!current())return;
    const rows = await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(auth.user.id), {token:auth.access_token});
    if(!current())return;
    const u = Array.isArray(rows) ? rows[0] : null;
    if(!u || u.role!=='rider'){ throw new Error('บัญชีนี้ไม่ใช่บัญชีไรเดอร์'); }
    const sessionId=crypto.randomUUID();
    await claimActiveSession(sessionId,auth.user.id,auth.access_token);
    if(!current())return;
    S.session = {authUserId:auth.user.id, accessToken:auth.access_token, refreshToken:auth.refresh_token||null, expiresAt:auth.expires_at?auth.expires_at*1000:jwtExpiryMs(auth.access_token), sessionId};
    writeSession(S.session);
    startSessionGuard();
    S.user = u;
    if(u.status==='suspended'){ renderPending(u,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return; }
    if(u.status!=='active'){ renderPending(u,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ'); return; }
    if(await loadRiderProfile())renderStage();
  }catch(e){
    console.error(e);
    errBox.textContent = /invalid/i.test(e.message) ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง หากสมัครด้วยอีเมลให้ใช้อีเมลนั้นเข้าสู่ระบบ' : e.message;
    errBox.classList.add('show');
  }finally{ btn.disabled=false; btn.textContent='เข้าสู่ระบบ'; }
}

function startGeolocation(){

let riderLocationWrite=null,riderLocationQueued=false;
function pushLocation(){
  if(!S.pos||!S.riderProfile||!S.user||!S.online||!navigator.onLine)return Promise.resolve();
  if(riderLocationWrite){riderLocationQueued=true;return riderLocationWrite}
  const task=(async()=>{
    do{
      riderLocationQueued=false;
      const session=S.session,userId=S.user.id,profileId=S.riderProfile.id,pos={...S.pos},epoch=riderLocationEpoch;
      const current=()=>riderSessionMatches(session)&&S.user?.id===userId&&S.riderProfile?.id===profileId&&S.online&&epoch===riderLocationEpoch;
      try{const token=await getAccessToken();if(current())await sbTable('rider_profiles?user_id=eq.'+encodeURIComponent(userId),{method:'PATCH',token,body:{latitude:pos.lat,longitude:pos.lng}})}catch(e){}
    }while(riderLocationQueued&&S.user&&S.pos&&S.riderProfile&&S.online&&navigator.onLine)
  })().finally(()=>{if(riderLocationWrite===task)riderLocationWrite=null});
  riderLocationWrite=task;return task;
}
let riderRefreshTask=null,riderRefreshQueued=false;
function refreshData(background=false){
  if(!S.user||!S.riderProfile||!navigator.onLine||(background&&document.hidden))return Promise.resolve();
  if(riderRefreshTask){if(!background)riderRefreshQueued=true;return riderRefreshTask}
  const task=(async()=>{do{riderRefreshQueued=false;await readRiderSnapshot()}while(riderRefreshQueued&&S.user&&S.riderProfile&&navigator.onLine)})().finally(()=>{if(riderRefreshTask===task)riderRefreshTask=null});
  riderRefreshTask=task;return task;
}
async function enrichMarketTripRiderOrder(o,token){
  if(!o?.market_order_id)return o;
  const [parents,pickups]=await Promise.all([
    sbTable('market_orders?select=id,delivery_fee,rider_bonus,shop_count,total_amount,status&id=eq.'+encodeURIComponent(o.market_order_id)+'&limit=1',{token}).catch(()=>[]),
    sbTable('rpc/market_pickup_route_summary',{method:'POST',token,body:{p_market_order_id:o.market_order_id}}).catch(()=>[])
  ]);
  const parent=Array.isArray(parents)?parents[0]:null;
  if(parent){
    o._marketRiderEarning=(Number(parent.delivery_fee)||0)+(Number(parent.rider_bonus)||0);
    o._marketShopCount=Number(parent.shop_count)||0;
    o._marketParentStatus=parent.status||'';
    o._marketTripTotal=Number(parent.total_amount)||0;
  }
  o._marketPickups=Array.isArray(pickups)?pickups:[];
  return o;
}

async function enrichRouteBundleRiderState(activeOrder,token){
  S.bundleOrders=[];S.bundleCandidates=[];
  if(!activeOrder||activeOrder.market_order_id)return activeOrder;
  try{
    if(activeOrder.route_bundle_id){
      const summary=await sbTable('rpc/queuego_route_bundle_active_orders',{method:'POST',token,body:{}}).catch(()=>[]);
      const list=Array.isArray(summary)?summary:[];
      const ids=list.map(x=>x.order_id).filter(Boolean);
      if(ids.length){
        const rows=await sbTable('orders?select=*&id=in.('+ids.map(encodeURIComponent).join(',')+')',{token});
        const meta=new Map(list.map(x=>[String(x.order_id),x]));
        S.bundleOrders=(Array.isArray(rows)?rows:[]).map(o=>{
          const m=meta.get(String(o.id))||{};
          o._bundleDropRank=Number(m.drop_rank)||Number(o.route_bundle_sequence)||99;
          o._bundleShopName=m.shop_name||'ร้านค้า';
          o._bundleDetourKm=Number(m.detour_km)||0;
          o._bundleAddedMinutes=Number(m.added_minutes)||0;
          o._bundleCustomerSavings=Number(m.customer_savings)||0;
          o._bundleOriginalDeliveryFee=Number(m.original_delivery_fee)||Number(o.bundle_original_delivery_fee)||Number(o.delivery_fee)||0;
          return o;
        }).sort((a,b)=>(Number(a.route_bundle_sequence)||99)-(Number(b.route_bundle_sequence)||99));
        await enrichRiderOrders(S.bundleOrders,token);
        activeOrder=S.bundleOrders.find(x=>Number(x.route_bundle_sequence)===1)||S.bundleOrders[0]||activeOrder;
      }
    }
    const offers=await sbTable('rpc/queuego_route_bundle_candidates',{method:'POST',token,body:{}}).catch(()=>[]);
    S.bundleCandidates=Array.isArray(offers)?offers:[];
  }catch(e){
    console.warn('route bundle state unavailable',e);
    S.bundleCandidates=[];
  }
  return activeOrder;
}
function qgBundleNextOrder(){
  const rows=(S.bundleOrders||[]).filter(o=>o&&o.status!=='cancelled'&&o.status!=='completed');
  if(!rows.length)return null;
  const inProgress=rows.find(o=>['delivering','arrived'].includes(statusFromRow(o)));
  if(inProgress)return inProgress;
  const pickup=rows.filter(o=>['rider_assigned','preparing','ready','assigned'].includes(statusFromRow(o)))
    .sort((a,b)=>(Number(a.route_bundle_sequence)||99)-(Number(b.route_bundle_sequence)||99))[0];
  if(pickup)return pickup;
  return rows.filter(o=>statusFromRow(o)==='picked_up')
    .sort((a,b)=>(Number(a._bundleDropRank)||99)-(Number(b._bundleDropRank)||99))[0]||rows[0];
}

async function readRiderSnapshot(){
  const userId=S.user.id,profileId=S.riderProfile.id,sessionId=S.session?.sessionId,online=S.online;
  const current=()=>S.user?.id===userId&&S.riderProfile?.id===profileId&&S.session?.sessionId===sessionId&&S.online===online;
  try{
    const token=await getAccessToken();if(!current())return;if(!token)throw Error('Session unavailable');
    const mine=await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(profileId)+'&status=in.(rider_assigned,preparing,ready,assigned,picked_up,in_progress)&order=created_at.desc&limit=1',{token});if(!current())return;
    let activeOrder=Array.isArray(mine)&&mine[0]?mine[0]:null;let openJobs=[];
    if(!activeOrder&&online&&S.riderProfile?.metadata?.online===true&&S.riderProfile.metadata.available!==true){
      const metadata={...S.riderProfile.metadata,available:true};
      await sbTable('rider_profiles?user_id=eq.'+encodeURIComponent(userId),{method:'PATCH',token,body:{metadata}});
      if(!current())return;
      S.riderProfile={...S.riderProfile,metadata};
    }
    // Laundry is isolated in rider/laundry.js and loads only when its panel is opened.
    // Keep the normal delivery snapshot single-flight and free of Laundry transport calls.
    const previousOpenJobIds=new Set((S.openJobs||[]).map(x=>x?.order?.id).filter(Boolean).map(String));
    if(activeOrder){
      if(['market','grocery'].includes(activeOrder.fulfillment_vertical)){const weights=await sbRpc('market_rider_job_weights',{},token);if(!current())return;activeOrder._marketWeight=(weights||[]).find(x=>x.order_id===activeOrder.id)?.weight_kg}
      if(activeOrder.market_order_id){await enrichMarketTripRiderOrder(activeOrder,token);if(!current())return}
      if(!activeOrder.market_order_id){activeOrder=await enrichRouteBundleRiderState(activeOrder,token);if(!current())return}
      await enrichRiderOrders([activeOrder],token);if(!current())return;
    }else if(online){
      S.bundleOrders=[];S.bundleCandidates=[];
      const eligible=await sbRpc('get_rider_delivery_pool',{},token);if(!current())return;
      const ids=(Array.isArray(eligible)?eligible:[]).map(x=>x.order_id).filter(Boolean);
      const open=ids.length?await sbTable('orders?select=*&id=in.('+ids.join(',')+')&order=created_at.asc&limit=25',{token}):[];if(!current())return;
      const list=Array.isArray(open)?open:[];
      const poolByOrder=new Map((Array.isArray(eligible)?eligible:[]).map(x=>[String(x.order_id),x]));
      for(const o of list){const quoted=poolByOrder.get(String(o.id));if(quoted&&Number.isFinite(Number(quoted.delivery_fee)))o._poolDeliveryFee=Number(quoted.delivery_fee)}
      if(list.some(o=>['market','grocery'].includes(o.fulfillment_vertical))){const weights=await sbRpc('market_rider_job_weights',{},token);if(!current())return;for(const o of list)o._marketWeight=(weights||[]).find(x=>x.order_id===o.id)?.weight_kg}
      await enrichRiderOrders(list,token);if(!current())return;
      const candidates=list.map(o=>({order:o,distanceKm:haversineKm(S.pos?.lat,S.pos?.lng,o.pickup_latitude,o.pickup_longitude)})).filter(x=>Number.isFinite(x.distanceKm)).sort((a,b)=>a.distanceKm-b.distanceKm);
      const nearby=candidates.filter(x=>x.distanceKm<=NEARBY_RADIUS_KM);
      // Server eligibility/claim remains authoritative; display the nearest eligible job when none is within 2 km.
      openJobs=(nearby.length?nearby:candidates.slice(0,1)).filter(x=>!qgOfferDeclined(x.order?.id));
    }
    if(!current())return;if(!activeOrder){S.bundleOrders=[];S.bundleCandidates=[]}S.activeOrder=activeOrder;S.openJobs=openJobs;
    window.qtCheckNewJobs?.(previousOpenJobIds,openJobs.map(x=>x.order));if(S.activeTab==='home')renderSheet();placeJobMarkers();
    const hist=await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(profileId)+'&status=eq.completed&order=updated_at.desc&limit=200',{token});if(!current())return;

function drawLaundryRoute(){

  function beep(){try{const c=ctx();if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{});const now=c.currentTime;[880,1175].forEach((freq,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now+i*.13);g.gain.exponentialRampToValueAtTime(.16,now+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.24);o.connect(g);g.connect(c.destination);o.start(now+i*.13);o.stop(now+i*.13+.25)})}catch(_){}}
  function speak(){try{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('มีงานใหม่ใกล้คุณ');u.lang='th-TH';u.rate=.95;u.volume=1;window.speechSynthesis.speak(u)}catch(_){}}
  function vibrate(){try{navigator.vibrate?.([300,120,500])}catch(_){}}
  function show(job){
    if(!job?.id||qgOfferDeclined(job.id))return;
    const id=String(job.id);if(alertJobId===id)return;alertJobId=id;S.newJobAlert={active:true,jobId:id};
    unlockAudio();beep();speak();vibrate();qgSetSheetLevel(2);if(S.activeTab==='home')renderSheet();
    clearInterval(repeatTimer);repeatTimer=setInterval(()=>{if(alertJobId&&!S.activeOrder){beep();vibrate()}},12000);
  }
  function acknowledge(){
    clearInterval(repeatTimer);repeatTimer=null;alertJobId=null;S.newJobAlert={active:false,jobId:null};
    try{navigator.vibrate?.(0)}catch(_){}try{window.speechSynthesis?.cancel()}catch(_){}
  }
  function checkNewJobs(previousIds,jobs){if(!S.online||S.activeOrder)return;const fresh=jobs.find(o=>o?.id&&!previousIds.has(String(o.id))&&!qgOfferDeclined(o.id));if(fresh)show(fresh)}
  ['click','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
  window.qtStartNewJobAlert=show;window.qtCheckNewJobs=checkNewJobs;window.qtStopNewJobAlert=acknowledge;
})();

function qgShortOrder(o){
  const raw=String((o&&o.order_number)||(o&&o.id)||'')
    .replace(/^QT[-_\s]*/i,'')
    .replace(/[^A-Za-z0-9]/g,'');
  return 'QT-' + (raw.slice(-4)||'----').toUpperCase();
}

function qgBindSheetToolbar(sheet){

  if(!toggle)return;
  let startY=null,dragged=false;
  toggle.onpointerdown=e=>{startY=e.clientY;dragged=false;try{toggle.setPointerCapture(e.pointerId)}catch(_){}};
  toggle.onpointermove=e=>{if(startY!==null&&Math.abs(e.clientY-startY)>8)dragged=true};
  toggle.onpointerup=e=>{
    if(startY===null)return;
    const delta=e.clientY-startY;startY=null;
    if(Math.abs(delta)>28){qgSetSheetLevel(qgSheetLevel+(delta<0?1:-1));renderSheet();dragged=true}
  };
  toggle.onpointercancel=()=>{startY=null};
  toggle.onclick=()=>{if(dragged){dragged=false;return}qgSetSheetLevel(qgSheetLevel===0?1:qgSheetLevel===1?2:1);renderSheet()};
}

function bindJobCardEvents(o){

  const d=by('decline-'+o.id);if(d)d.onclick=()=>qgDeclineOffer(o.id);

function qgOfferDeclined(orderId){
  if(!orderId)return false;
  try{
    const key='qg-rider-declined-offers',cache=JSON.parse(sessionStorage.getItem(key)||'{}'),now=Date.now();
    let changed=false;
    for(const [id,until] of Object.entries(cache)){if(Number(until)<=now){delete cache[id];changed=true}}
    if(changed)sessionStorage.setItem(key,JSON.stringify(cache));
    return Number(cache[String(orderId)]||0)>now;
  }catch(_){return false}
}
function qgDeclineOffer(orderId){
  try{
    const key='qg-rider-declined-offers',cache=JSON.parse(sessionStorage.getItem(key)||'{}');
    cache[String(orderId)]=Date.now()+5*60*1000;
    sessionStorage.setItem(key,JSON.stringify(cache));
  }catch(_){}
  S.openJobs=(S.openJobs||[]).filter(x=>String(x.order?.id)!==String(orderId));
  toast('ซ่อนงานนี้ 5 นาทีแล้ว');
  renderSheet();
}
function qgAdvanceFromPrimary(o){
  const st=statusFromRow(o);
  if(st==='delivering'||st==='arrived')return qgConfirmArrival(o);
  return advanceOrder(o);
}
function qgArrivalDistanceKm(o){
 const lat=Number(S.pos?.lat),lng=Number(S.pos?.lng),dlat=Number(o?.delivery_latitude),dlng=Number(o?.delivery_longitude);
 if(![lat,lng,dlat,dlng].every(Number.isFinite))return NaN;
 return haversineKm(lat,lng,dlat,dlng);
}
async function qgConfirmArrival(o){
 document.getElementById('qg-arrival-guard')?.remove();
 const st=statusFromRow(o);
 if(st==='arrived'){o._arrivalConfirmed=true;qgOpenOrderChecklist(o);return}

  const ok=await advanceOrder(o);if(!ok)return false;

  o.note='__QT_ORDER_STATUS__=arrived\n'+qgCleanOrderNote(o.note);

 };
 if(Number.isFinite(km)&&km<=QG_ARRIVAL_GUARD_KM){await markArrived();return}

   <div class="qg-arrival-distance"><span>${QTICON.loc}</span><small>${meters!==null?'คุณยังห่างจากจุดส่งประมาณ':'ยังตรวจสอบระยะจาก GPS ไม่ได้'}</small>${meters!==null?`<b>${meters.toLocaleString('th-TH')} ม.</b>`:''}</div>
   <div class="qg-dual-actions"><button type="button" class="qg-btn qg-btn-primary" id="qg-arrival-proceed">ดำเนินการ</button><button type="button" class="qg-btn qg-btn-secondary" id="qg-arrival-cancel">ย้อนกลับ</button></div>
  </div>`;
 document.body.appendChild(overlay);
 const close=()=>overlay.remove();
 overlay.querySelector('.qg-arrival-backdrop').onclick=close;

 overlay.querySelector('#qg-arrival-cancel').onclick=close;

    <div class="qg-chat-box" id="chat-box"><div class="qg-loading">กำลังโหลดข้อความ...</div></div>
    ${quickMessagesHTML()}

      <button class="photo-btn" type="button" id="chat-photo" aria-label="ส่งรูป"></button>
      <input type="file" id="chat-photo-input" accept="image/*" hidden>
      <input id="chat-input" maxlength="500" autocomplete="off" placeholder="พิมพ์ข้อความ..." required>
      <button type="submit" aria-label="ส่ง">➤</button>

  document.getElementById('chat-back').onclick=closeChat;

    try{const data=await compressRiderImage(file,1000,.7);await sendRiderChat(o,'__IMG__'+data)}catch(_){toast('ส่งรูปไม่สำเร็จ')}
  };

}

function qgUpdateBadge(){const b=document.getElementById('qg-nav-badge');if(!b)return;b.textContent=qgUnread>9?'9+':qgUnread;b.style.display=qgUnread?'block':'none'
const el=document.getElementById('qg-nav-badge');if(el&&qgCompletedUnread()){el.textContent=String(Math.min(9,qgUnread+qgCompletedUnread()))+(qgUnread+qgCompletedUnread()>9?'+':'');el.style.display='block'}
}
function qgShowMessage(t){const box=document.getElementById('qg-message'),tx=document.getElementById('qg-message-text');if(!box)return;if(tx)tx.textContent=t||'ลูกค้าส่งข้อความถึงคุณ';box.classList.add('show');clearTimeout(qgMsgTimer);qgMsgTimer=setTimeout(()=>box.classList.remove('show'),3800)}
let riderChatRead=null,riderChatQueued=false,qgLastChatScope=null;
function refreshRiderChat(background=false){
  if(!S.user||!navigator.onLine||document.hidden)return Promise.resolve();
  if(riderChatRead){if(!background)riderChatQueued=true;return riderChatRead}
  const task=(async()=>{do{riderChatQueued=false;await readRiderChat()}while(riderChatQueued&&S.user&&navigator.onLine&&!document.hidden)})().finally(()=>{if(riderChatRead===task)riderChatRead=null});
  riderChatRead=task;return task;
}
async function readRiderChat(){
  const order=S.chatOrder||S.activeOrder;if(!order||!S.user)return;
  const session=S.session,userId=S.user.id,chat=!!S.chatOrder,screen=document.getElementById('chat-screen');
  const current=()=>riderSessionMatches(session)&&S.user?.id===userId&&(chat?S.chatOrder?.id===order.id&&screen?.isConnected:!S.chatOrder&&S.activeOrder?.id===order.id);
  try{
    const token=await getAccessToken();if(!current())return;
    const rows=await loadChatMessages(order.id,token);if(!current())return;
    if(chat){
      const box=screen.querySelector('#chat-box'),signature=JSON.stringify(rows);
      if(box&&box.dataset.messages!==signature){const top=box.scrollTop,stick=!box.dataset.messages||box.scrollHeight-box.clientHeight-top<80;renderChatMessages(rows);if(!stick)box.scrollTop=top;box.dataset.messages=signature}
      qgUnread=0;qgUpdateBadge();
    }
    const scope=JSON.stringify([userId,session.sessionId,order.id]),last=rows[rows.length-1];
    if(qgLastChatScope!==scope){qgLastChatScope=scope;qgLastMsg=last?.id||null;return}
    if(last&&last.id!==qgLastMsg){qgLastMsg=last.id;if(!chat&&String(last.sender_id)!==String(userId)){qgUnread++;qgUpdateBadge();qgShowMessage(String(last.message||'ข้อความใหม่').startsWith('__IMG__')?'ส่งรูปภาพ':last.message)}}
  }catch(e){if(current()&&chat){const box=screen.querySelector('#chat-box');if(box&&!box.dataset.messages)box.textContent='โหลดข้อความไม่สำเร็จ ระบบจะลองใหม่เมื่อเชื่อมต่อได้'}}
}
function stopRiderChatWatch(){
  if(window.qgMessagePoll)clearInterval(window.qgMessagePoll);window.qgMessagePoll=null;riderChatQueued=false;qgLastChatScope=null;qgLastMsg=null;qgUnread=0;
}
function qgStartMessageWatch(){
  stopRiderChatWatch();window.qgMessagePoll=setInterval(()=>refreshRiderChat(true),4000);
}

boot();

window.statusFromRow=function(row){

const riderActionInFlight=new Set();
window.advanceOrder=async function(o){
 if(o?.market_order_id){
   const st=statusFromRow(o);
   try{
     const token=await getAccessToken();
     if(st==='assigned'||st==='ready'){toast('กรุณารับสินค้าให้ครบทุกจุด');return false}
     if(st==='picked_up'){await sbTable('rpc/market_rider_group_action',{method:'POST',token,body:{p_market_order_id:o.market_order_id,p_action:'deliver'}});toast('กำลังไปส่งลูกค้า');await refreshData();return true}
     if(st==='delivering'){await sbTable('rpc/market_rider_group_action',{method:'POST',token,body:{p_market_order_id:o.market_order_id,p_action:'arrive'}});toast('ถึงจุดส่งแล้ว');await refreshData();return true}
   }catch(e){toast('อัปเดตงานตลาดไม่สำเร็จ: '+e.message);return false}

 }

 riderActionInFlight.add(o.id);
 try{

   await refreshData().catch(()=>{});return true;
 }catch(e){toast('อัปเดตไม่สำเร็จ: '+e.message);return false}
 finally{riderActionInFlight.delete(o.id)}
};

<script id="qg-rider-inbox">
(function(){
 const key=()=>S.user?.id?'qg-rider-history:'+S.user.id:null;
 const seenKey=()=>S.user?.id?'qg-rider-chat-seen:'+S.user.id:null;
 let completedUnread=0,inboxRead=null,inboxSnapshot=null;
 window.qgRiderHistoryKey=key;
 window.qgCompletedUnread=()=>completedUnread;
 window.qgMarkInboxSeen=markInboxSeen;
 window.qgWatchCompletedChat=watchCompletedChat;
 window.qgClearRiderInbox=()=>{completedUnread=0;inboxSnapshot=null};
 function markInboxSeen(){const k=seenKey();if(k)try{localStorage.setItem(k,String(Date.now()))}catch(e){}completedUnread=0;qgUpdateBadge()}
 function readInbox(){
   if(!S.user||!navigator.onLine||document.hidden)return Promise.resolve(null);
   const session=S.session,userId=S.user.id;
   const orders=[...new Map([S.activeOrder,...(S.history||[])].filter(Boolean).map(o=>[o.id,{...o}])).values()].slice(0,100);
   const scope=JSON.stringify([session?.authUserId,session?.sessionId,userId,orders.map(o=>[o.id,o.status,o.updated_at])]);
   const current=()=>riderSessionMatches(session)&&S.user?.id===userId;
   if(inboxSnapshot?.scope===scope&&Date.now()-inboxSnapshot.at<5000)return Promise.resolve(inboxSnapshot.data);
   if(inboxRead?.scope===scope)return inboxRead.task;
   const task=(async()=>{
     const ids=orders.map(o=>o.id),token=await getAccessToken();if(!current())return null;
     const [messages,deliveries]=ids.length?await Promise.all([
       sbTable('order_chat_messages?select=order_id,sender_id,message,created_at&order_id=in.('+ids.join(',')+')&order=created_at.desc&limit=500',{token}),
       sbTable('deliveries?select=order_id,delivered_at&order_id=in.('+ids.join(',')+')',{token})]):[[],[]];
     if(!current())return null;
     const data={orders,messages:messages||[],deliveries:deliveries||[],current};inboxSnapshot={scope,at:Date.now(),data};return data;
   })().finally(()=>{if(inboxRead?.task===task)inboxRead=null});inboxRead={scope,task};return task;
 }
 async function watchCompletedChat(){
   try{
     const data=await readInbox();if(!data||!data.current())return;
     const byOrder=new Map(data.orders.filter(o=>o.status==='completed').map(o=>[String(o.id),o]));
     const delivered=new Map(data.deliveries.map(d=>[String(d.order_id),Date.parse(d.delivered_at)]));
     const seen=Number(localStorage.getItem(seenKey())||0);
     completedUnread=data.messages.filter(m=>{const o=byOrder.get(String(m.order_id)),time=Date.parse(m.created_at),at=delivered.get(String(m.order_id));return o&&String(m.sender_id)===String(o.customer_id)&&Number.isFinite(at)&&time>at&&time>seen}).length;
     if(S.activeTab==='chat')markInboxSeen();else qgUpdateBadge();
   }catch(e){console.warn('Rider inbox refresh unavailable')}
 }

 window.qgOpenInboxChat=function(id){const o=[S.activeOrder,...(S.history||[])].filter(Boolean).find(x=>String(x.id)===String(id));if(o){document.getElementById('qg-rider-inbox')?.remove();openChat(o)}};
 window.qgRenderMessageInbox=async function(){
   if(S.activeTab!=='chat'||S.chatOrder||!S.user)return;
   const stage=document.querySelector('.stage');if(!stage)return;
   let box=document.getElementById('qg-rider-inbox');if(!box){box=document.createElement('section');box.id='qg-rider-inbox';box.className='qg-inbox';box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">กำลังโหลดข้อความ...</div>';stage.appendChild(box)}
   const request={};box._request=request;
   const current=()=>box.isConnected&&box._request===request&&S.activeTab==='chat'&&!S.chatOrder;
   try{
     const data=await readInbox();if(!data||!data.current()||!current())return;
     const delivered=new Map(data.deliveries.map(x=>[String(x.order_id),x.delivered_at]));
     const rows=data.orders.map(o=>{const messages=data.messages.filter(m=>String(m.order_id)===String(o.id)),at=delivered.get(String(o.id));return{o,last:messages[0],initiated:o.status!=='completed'||Boolean(at&&messages.some(m=>String(m.sender_id)===String(o.customer_id)&&new Date(m.created_at)>new Date(at)))}}).filter(x=>x.initiated).sort((a,b)=>new Date(b.last?.created_at||b.o.updated_at)-new Date(a.last?.created_at||a.o.updated_at));
     box.innerHTML='<h2>ข้อความ</h2>'+(rows.length?rows.map(({o,last})=>'<button class="qg-inbox-item" type="button" onclick="qgOpenInboxChat(\''+esc(o.id)+'\')"><strong>ออเดอร์ '+esc(qgShortOrder(o))+'</strong><small>'+esc(last?(String(last.message).startsWith('__IMG__')?'รูปภาพ':String(last.message).slice(0,85)):'เปิดแชตระหว่างจัดส่ง')+'</small></button>').join(''):'<div class="qg-inbox-empty">ยังไม่มีการสนทนา</div>');
   }catch(e){if(current()){box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">โหลดข้อความไม่สำเร็จ <button type="button">ลองใหม่</button></div>';box.querySelector('button').onclick=()=>qgRenderMessageInbox()}}
 };
 setInterval(()=>{watchCompletedChat();if(S.activeTab==='chat'&&!S.chatOrder)qgRenderMessageInbox()},15000);
})();
</script>

   panel.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{
     panel.querySelectorAll('[data-days]').forEach(x=>x.classList.toggle('active',x===b));
     const days=Number(b.dataset.days);qgLoadRiderPeriod(days);qgLoadRiderLedger(days);
   });
   qgLoadRiderPeriod(1);qgLoadRiderLedger(1);
 };
 const day=d=>{const x=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(p=>[p.type,p.value]));return x.year+'-'+x.month+'-'+x.day};
 const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
 window.qgLoadRiderPeriod=async function(days){
   const box=document.getElementById('qg-period-summary');if(!box)return;
   box.className='qg-loading-card';box.textContent='กำลังโหลดสรุปงาน...';
   try{
     const token=await getAccessToken(),s=await sbTable('rpc/qg_rider_period_summary',{method:'POST',token,body:{p_days:days}});
     if(!box.isConnected)return;
     box.className='qg-earn-summary';
     box.innerHTML=`<div class="qg-stat qg-stat-red"><span>รายได้จากค่าส่ง</span><b>${baht(s.income)}</b></div><div class="qg-stat qg-stat-green"><span>งานสำเร็จ</span><b>${Number(s.jobs||0)} งาน</b></div><div class="qg-stat qg-stat-blue"><span>ออนไลน์</span><b>${Number(s.online_hours||0)} ชม.</b></div><div class="qg-stat qg-stat-amber"><span>เฉลี่ย/ชม.</span><b>${s.income_per_hour===null?'—':baht(s.income_per_hour)}</b></div>`;
   }catch(e){box.className='qg-error-state';box.textContent='โหลดสรุปงานไม่สำเร็จ: '+e.message}
 };
 window.qgLoadRiderLedger=async function(days){
   const box=document.getElementById('qg-ledger-body');if(!box)return;
   box.className='qg-loading-card';box.textContent='กำลังโหลดบัญชีเงินสด...';
   try{
     const to=new Date(),from=new Date(to.getTime()-(days-1)*86400000),token=await getAccessToken();
     const rows=await sbTable('rpc/qg_rider_cash_ledger',{method:'POST',token,body:{p_from:day(from),p_to:day(to)}});
     if(!box.isConnected)return;
     const list=Array.isArray(rows)?rows:[],sum=k=>list.reduce((a,o)=>a+Number(o[k]||0),0),paid=sum('cash_paid_merchant'),collected=sum('cash_collected_customer'),fees=list.reduce((a,o)=>a+Number(o.delivery_fee||0),0);
     box.className='qg-ledger';
     box.innerHTML=`<section class="qg-cash-card"><div class="qg-section-title"><b>บัญชีเงินสด</b><span>${days===1?'วันนี้':days+' วัน'}</span></div><div class="qg-cash-grid"><div><span>จ่ายร้าน</span><b>${baht(paid)}</b></div><div><span>เก็บลูกค้า</span><b>${baht(collected)}</b></div><div><span>ค่าส่งที่ได้รับ</span><b>${baht(fees)}</b></div><div><span>สุทธิรับ-จ่าย</span><b class="qg-red">${baht(collected-paid)}</b></div></div></section><section class="qg-recent"><div class="qg-section-title"><b>รายการงานล่าสุด</b><span>${list.length} งาน</span></div>${list.length?list.slice(0,30).map(o=>`<article><div><b>${esc(String(o.order_number||o.order_id||''))}</b><small>${esc(String(o.status||''))}</small></div><div><span>${o.status==='completed'?'สำเร็จ':'กำลังดำเนินการ'}</span><b>${baht(o.delivery_fee||0)}</b></div></article>`).join(''):'<div class="qg-empty">ยังไม่มีรายการ</div>'}</section>`;
   }catch(e){box.className='qg-error-state';box.textContent='โหลดบัญชีเงินสดไม่สำเร็จ: '+e.message}
 };
})();
</script></script>
<script id="qg-rider-market-pickups">
(function(){
 async function loadPickups(o){
  if(!o||!o.market_order_id)return [];
  try{const token=await getAccessToken();const x=await sbTable('rpc/market_pickup_route_summary',{method:'POST',token,body:{p_market_order_id:o.market_order_id}});return Array.isArray(x)?x:[]}catch(e){console.warn('market pickups',e);return []}
 }
 function html(rows){
  if(!rows.length)return '';
  const paid=rows.filter(x=>x.status==='PICKED_UP'||Number(x.cash_paid_amount)>0).length,total=rows.reduce((a,x)=>a+Number(x.shop_amount||0),0);
  return '<section class="qg-mp"><div class="qg-mp-head"><b>รับของหลายร้าน</b><small>รับแล้ว '+paid+'/'+rows.length+' จุด</small></div>'+rows.map((x,i)=>{const done=x.status==='PICKED_UP'||x.status==='CANCELLED';return '<div class="qg-mp-row"><div class="qg-mp-top"><div><b>จุดรับ '+(i+1)+' · '+esc(x.shop_name||'ร้านค้า')+'</b><br><small>'+esc(x.shop_address||'')+'</small></div><strong class="'+(done?'qg-mp-paid':'')+'">฿'+Number(x.shop_amount||0).toLocaleString('th-TH')+'</strong></div><button class="qg-mp-btn" data-pickup="'+esc(x.pickup_id)+'" data-amount="'+Number(x.shop_amount||0)+'" '+(done?'disabled':'')+'>'+(x.status==='CANCELLED'?'ยกเลิกจุดรับนี้':done?'✓ รับสินค้าแล้ว':'รับสินค้าจุดนี้')+'</button></div>'}).join('')+'<div class="qg-mp-total"><span>เงินที่ต้องจ่ายร้านรวม</span><span>฿'+total.toLocaleString('th-TH')+'</span></div></section>';
 }
 window.qgMountMarketPickups=mount;
 async function mount(o){
  if(!o||!o.market_order_id)return;
  const sheet=document.getElementById('sheet');if(!sheet)return;
  const rows=await loadPickups(o);if(!rows.length)return;
  sheet.querySelector('.qg-mp')?.remove();
  const host=sheet.querySelector('.qg-active-card')||sheet.querySelector('.qg-sheet-body')||sheet,anchor=host.querySelector('.qg-main-action'),box=document.createElement('div');box.innerHTML=html(rows);const node=box.firstElementChild;
  if(anchor)host.insertBefore(node,anchor);else host.appendChild(node);
  sheet.querySelectorAll('[data-pickup]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;const amount=Number(b.dataset.amount||0);b.disabled=true;try{const token=await getAccessToken();const r=await sbTable('rpc/market_rider_confirm_pickup_cash',{method:'POST',token,body:{p_pickup_id:b.dataset.pickup,p_amount:amount}});toast(r?.all_picked_up?'รับของครบทุกจุดแล้ว — ไปส่งลูกค้าได้':'บันทึกจุดรับแล้ว');await refreshData();}catch(e){toast('บันทึกจุดรับไม่สำเร็จ: '+e.message);b.disabled=false;}});
  const next=document.getElementById('next-'+o.id);if(next){const all=rows.every(x=>x.status==='PICKED_UP'||x.status==='CANCELLED');if(!all){next.disabled=true;next.textContent='รับของให้ครบทุกจุดก่อน';}}
 }


})();
</script>
