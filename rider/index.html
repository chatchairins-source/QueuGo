:root{--mint:#08bd78;--mint2:#54dca5;--ink:#11231e;--muted:#70807a;--line:#e5eee9;--glass:rgba(255,255,255,.92);--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#f5faf7;color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Noto Sans Thai",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}.toast{position:fixed;z-index:99999;left:50%;bottom:calc(76px + var(--safeB));transform:translate(-50%,20px);opacity:0;background:#14231f;color:white;padding:10px 14px;border-radius:14px;font-size:12px;transition:.22s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
svg{display:block}.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Auth — completely new composition */
.screen-center{height:100dvh;overflow:auto;background:#f7fbf9}.auth-shell{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr)}
.auth-side{position:relative;min-height:100%;padding:calc(32px + var(--safeT)) 34px 34px;background:linear-gradient(180deg,rgba(3,35,26,.05),rgba(3,35,26,.58)),var(--login) center/cover no-repeat;color:white;display:flex;flex-direction:column;justify-content:space-between}
.auth-mark{display:flex;gap:9px;align-items:center;font-size:12px;letter-spacing:.12em}.auth-mark .dot{width:9px;height:9px;border-radius:50%;background:#45efad}.auth-side-copy h2{font-size:clamp(30px,4vw,54px);line-height:1.02;max-width:580px;margin:0 0 14px}.auth-side-copy p{max-width:500px;opacity:.85;line-height:1.6}.auth-stats{display:flex;gap:28px}.auth-stats div{display:grid}.auth-stats b{font-size:18px}.auth-stats span{font-size:11px;opacity:.7}
.auth-main{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 20% 10%,#e4fff3,transparent 35%),#fbfdfc}.auth-card{width:min(420px,100%);padding:28px;border:1px solid var(--line);border-radius:30px;background:rgba(255,255,255,.86);box-shadow:0 24px 70px rgba(18,55,45,.10);backdrop-filter:blur(30px)}.auth-card h1{font-size:29px;line-height:1.08;margin:0 0 10px}.sub{color:var(--muted);font-size:13px;line-height:1.55}.field{margin:15px 0}.field label{display:block;font-size:11px;font-weight:750;margin:0 0 7px}.field input{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;padding:0 15px;background:#f9fcfa;outline:none}.field input:focus{border-color:#72dcb1;box-shadow:0 0 0 4px #e7faf2}.btn{border:0;border-radius:16px;height:48px;padding:0 16px;font-weight:800}.btn-brand{width:100%;background:linear-gradient(135deg,var(--mint),var(--mint2));color:white}.btn-signup{width:100%;background:#edf8f3;color:#08784f}.auth-divider{text-align:center;color:#91a09b;font-size:10px;margin:14px}.auth-err{display:none;color:#c62828;font-size:11px;margin-top:8px}.auth-err.show{display:block}.auth-foot,.v4-version{font-size:9px;text-align:center;color:#9aa7a2;margin-top:10px}
@media(max-width:760px){.auth-shell{grid-template-columns:1fr}.auth-side{min-height:32dvh;padding:calc(18px + var(--safeT)) 20px 18px}.auth-side-copy h2{font-size:28px}.auth-side-copy p,.auth-stats{display:none}.auth-main{padding:14px 14px calc(18px + var(--safeB))}.auth-card{padding:22px;border-radius:26px}}

/* Main operating shell */
.stage{position:relative;height:100dvh;overflow:hidden;background:#e9f0ed}.map{position:absolute;inset:0}.leaflet-container{background:#e8efec}
.qt-top{position:absolute;z-index:700;top:calc(10px + var(--safeT));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.qt-brand,.qt-status{pointer-events:auto;height:42px;border:1px solid rgba(255,255,255,.7);border-radius:22px;background:rgba(255,255,255,.88);box-shadow:0 10px 28px rgba(20,55,45,.10);backdrop-filter:blur(22px);display:flex;align-items:center}.qt-brand{padding:0 13px;gap:8px;font-size:12px;font-weight:900}.qt-brand i{width:8px;height:8px;border-radius:50%;background:var(--mint)}.qt-status{padding:4px 5px 4px 12px;gap:9px;border:0}.qt-status span{font-size:11px;font-weight:850}.qt-switch{width:34px;height:24px;border:0;border-radius:13px;background:#dce6e2;padding:3px}.qt-switch:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:white;box-shadow:0 2px 7px #0002;transition:.2s}.qt-status.on .qt-switch{background:var(--mint)}.qt-status.on .qt-switch:after{transform:translateX(10px)}

/* ---------- full-screen lock + responsive resize (all screens, incl. rider page) ---------- */
(function(){
  function setVH(){
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  let resizeRaf = null;
  function onViewportChange(){
    setVH();
    if(resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(()=>{
      if(S.map){ try{ S.map.invalidateSize({animate:false}); }catch(e){} }
    });
  }
  setVH();
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', onViewportChange);
  }
  document.addEventListener('DOMContentLoaded', setVH);

  /* hard-stop page drag/bounce: fully lock touch movement unless inside an approved
     scroll box AND that box actually has overflow content to scroll — and even then,
     stop the drag dead at the top/bottom edge instead of letting it rubber-band. */
  const SCROLLABLE_SEL = '.screen-center,.sheet,.chat-box,.chat-screen,.summary-screen,.panel-screen,.rider-steps,.qt-alert-card,.rider-doc-preview,#map';
  let touchStartX = 0, touchStartY = 0, touchEl = null;
  document.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchEl = e.target.closest(SCROLLABLE_SEL);
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(e.touches.length !== 1) return;
    if(e.target.closest('.slide-wrap')) return; // let the "slide to confirm delivery" drag control work
    const el = touchEl;
    if(!el){ e.preventDefault(); return; } // not inside any scroll box at all -> fully locked
    if(el.id === 'map') return; // let Leaflet handle its own pan/zoom
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    const canScrollY = el.scrollHeight > el.clientHeight + 1;
    const canScrollX = el.scrollWidth > el.clientWidth + 1;
    if(canScrollY){
      const atTop = el.scrollTop <= 0;
      const atBottom = Math.ceil(el.scrollTop + el.clientHeight) >= el.scrollHeight;
      if((atTop && dy > 0) || (atBottom && dy < 0)) e.preventDefault();
    } else if(canScrollX){
      const atLeft = el.scrollLeft <= 0;
      const atRight = Math.ceil(el.scrollLeft + el.clientWidth) >= el.scrollWidth;
      if((atLeft && dx > 0) || (atRight && dx < 0)) e.preventDefault();
    } else {
      e.preventDefault(); // nothing to scroll here -> lock it completely, no bounce
    }
  }, {passive:false});
})();

function sbHeaders(token){
  const h = {apikey:SB.KEY, 'Content-Type':'application/json'};
  if(token) h.Authorization = 'Bearer '+token;
  return h;
}
async function sbAuth(path, body){
  const r = await fetch(SB.URL+'/auth/v1/'+path, {method:'POST', headers:sbHeaders(), body:JSON.stringify(body)});
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error_description || data.msg || data.message || 'AUTH_ERROR');
  return data;
}
async function sbTable(path, options={}){
  const headers = sbHeaders(options.token);
  if(options.method && options.method!=='GET') headers.Prefer = 'return=representation';
  const r = await fetch(SB.URL+'/rest/v1/'+path, {
    method: options.method||'GET', headers, body: options.body?JSON.stringify(options.body):undefined
  });
  const data = await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.message) || 'DB_ERROR_'+r.status);
  return data;
}
function authEmailFromPhone(phone){ return String(phone||'').replace(/\D/g,'')+'@auth.queuetech.local'; }
function jwtExpiryMs(token){
  try{
    const part = String(token||'').split('.')[1];
    const b64 = part.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((part.length+3)%4);
    return Number(JSON.parse(atob(b64)).exp||0)*1000;
  }catch(e){ return 0; }
}
function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } }
function writeSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
async function getAccessToken(){
  const s = readSession(); if(!s) return '';
  const exp = Number(s.expiresAt||0) || jwtExpiryMs(s.accessToken);
  if(exp - Date.now() > 60000) return s.accessToken;
  if(!s.refreshToken) return s.accessToken;
  try{
    const r = await fetch(SB.URL+'/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:sbHeaders(), body:JSON.stringify({refresh_token:s.refreshToken})
    });
    const data = await r.json().catch(()=>({}));
    if(!r.ok || !data.access_token) return s.accessToken;
    const next = {...s, accessToken:data.access_token, refreshToken:data.refresh_token||s.refreshToken, expiresAt:(data.expires_at?data.expires_at*1000:0)};
    writeSession(next);
    return next.accessToken;
  }catch(e){ return s.accessToken; }
}
function esc(v){ return String(v??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }

function haversineKm(lat1,lon1,lat2,lon2){
  if([lat1,lon1,lat2,lon2].some(v=>!Number.isFinite(Number(v)))) return Infinity;
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

}

async function claimActiveSession(sessionId,authUserId,token){
  if(!sessionId||!authUserId||!token)throw new Error('ไม่สามารถยืนยันอุปกรณ์ที่ใช้งานได้');
  const result=await sbRpc('claim_active_session',{p_session_id:sessionId,p_device_id:getDeviceId()},token);
  if(Array.isArray(result)&&result[0]&&result[0].success===false)throw new Error('ไม่สามารถเปิด Session นี้ได้');
  return result;
}
async function checkActiveSession(){
  const s=readSession();
  if(!s||!s.sessionId||!s.accessToken||!s.authUserId)return true;
  try{
    const token=await getAccessToken();
    const latest=readSession();
    const result=await sbRpc('check_active_session',{p_session_id:latest.sessionId},token);
    const ok=result===true || (Array.isArray(result)&&result[0]===true) || (result&&result.check_active_session===true);
    if(!ok){forceSessionLogout('บัญชีนี้ถูกเข้าสู่ระบบจากอุปกรณ์อื่น');return false;}
    await sbRpc('touch_active_session',{p_session_id:latest.sessionId},token);
    return true;
  }catch(e){
    console.warn('active session check failed',e);
    return true;
  }
}
function startSessionGuard(){
  stopSessionGuard();
  sessionGuardTimer=setInterval(()=>{if(S.session&&S.session.sessionId)checkActiveSession();},SESSION_GUARD_MS);
}
function stopSessionGuard(){if(sessionGuardTimer){clearInterval(sessionGuardTimer);sessionGuardTimer=null;}}
function forceSessionLogout(msg){
  stopSessionGuard();stopPolling();
  try{if(S.watchId)navigator.geolocation.clearWatch(S.watchId);}catch(e){}
  clearSession();
  Object.assign(S,{session:null,user:null,riderProfile:null,online:false,activeOrder:null,openJobs:[],history:[]});
  renderLogin(msg||'เซสชันนี้ถูกยกเลิก');
}
window.addEventListener('focus',()=>{if(S.session&&S.session.sessionId)checkActiveSession();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.session&&S.session.sessionId)checkActiveSession();});

/* ---------- boot ---------- */
function boot(){
  const s = readSession();
  if(s){ S.session = s; startSessionGuard(); resumeSession(); }
  else renderLogin();
}
async function resumeSession(){
  try{
    if(S.session&&S.session.sessionId){
      const ok=await checkActiveSession();
      if(!ok)return;
    }
    const token = await getAccessToken();
    const rows = await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(S.session.authUserId), {token});
    const u = Array.isArray(rows) ? rows[0] : null;
    if(!u || u.role!=='rider'){ clearSession(); renderLogin('บัญชีนี้ไม่ใช่บัญชีไรเดอร์'); return; }
    S.user = u;
    if(u.status==='suspended'){ renderPending(u,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return; }
    if(u.status!=='active'){ renderPending(u,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ'); return; }
    await loadRiderProfile();
    renderStage();
  }catch(e){ console.error(e); clearSession(); renderLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'); }
}
async function loadRiderProfile(){
  const token = await getAccessToken();
  const rows = await sbTable('rider_profiles?select=*&user_id=eq.'+encodeURIComponent(S.user.id), {token});
  S.riderProfile = Array.isArray(rows) && rows[0] ? rows[0] : null;
  S.online = !!(S.riderProfile && S.riderProfile.metadata && S.riderProfile.metadata.online);
}

async function compressRiderImage(file,maxSize=1400,quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(im.width,im.height));
        const w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      im.onerror=reject; im.src=reader.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
const RIDER_DRAFT_DB='qt_rider_draft_v1';
function riderDraftOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(RIDER_DRAFT_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function saveRiderDraftFile(id,data,name){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({data,name,at:Date.now()},id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){console.warn('draft save failed',e);}}
async function loadRiderDraftFile(id){try{const db=await riderDraftOpen();const v=await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});db.close();return v;}catch(e){return null;}}
async function clearRiderDraft(){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){}}
async function riderFilePreview(inputId,previewId){
  const input=document.getElementById(inputId),img=document.getElementById(previewId);
  if(!input||!input.files[0]) return;
  const file=input.files[0];
  if(file.size>8*1024*1024){input.value='';toast('ไฟล์ต้องมีขนาดไม่เกิน 8 MB');return;}
  const nameEl=document.getElementById(inputId+'-name');
  if(nameEl) nameEl.textContent=file.name||'เลือกไฟล์แล้ว';
  try{
    let data='';
    if(file.type.startsWith('image/')){data=await compressRiderImage(file);if(img){img.src=data;img.style.display='block';}}
    else data=await readFileAsDataURL(file);
    await saveRiderDraftFile(inputId,data,file.name||inputId);
    if(inputId==='rr-photo') try{sessionStorage.setItem('qt_rider_profile_draft',JSON.stringify({data,name:file.name||'profile.jpg',at:Date.now()}));}catch(e){}
  }catch(err){console.error(err);toast('ไม่สามารถอ่านไฟล์ได้ กรุณาเลือกไฟล์ใหม่');}
}
function readFileAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

function riderStepGo(step){
  const all=[...document.querySelectorAll('.rider-panel')];
  const target=Math.max(0,Math.min(3,step));
  const groups=[[all[0],all[1]],[all[2],all[3]],[all[4]],[all[5]]];
  all.forEach(p=>p.style.display='none');
  (groups[target]||groups[0]).forEach(p=>{if(p)p.style.display='block';});
  const steps=document.querySelectorAll('.rider-step');steps.forEach((x,i)=>{x.classList.toggle('active',i===target);x.classList.toggle('done',i<target);});
  window.__qtRiderStep=target;
  const submit=document.querySelector('.rider-submit');if(submit)submit.textContent=target===3?'ส่งใบสมัคร  →':'ถัดไป  →';
  const wizard=document.querySelector('.rider-wizard');if(wizard)wizard.scrollIntoView({behavior:'smooth',block:'start'});
}
function riderStepNext(){
  const s=window.__qtRiderStep||0;
  if(s<3){riderStepGo(s+1);}else{document.querySelector('.rider-submit')?.click();}
}
function riderStepBack(){const s=window.__qtRiderStep||0;if(s>0)riderStepGo(s-1);else renderLogin();}
async function handleRiderRegistration(e){
  e.preventDefault();
  const f=id=>document.getElementById(id);
  const name=String(f('rr-name').value||'').trim(),phone=f('rr-phone').value.trim().replace(/[-\s]/g,''),password=f('rr-password').value;
  const email=String(f('rr-email').value||'').trim().toLowerCase();
  const form={email,area:String(f('rr-area').value||'').trim(),province:f('rr-province').value,district:String(f('rr-district').value||'').trim(),vehicle:f('rr-vehicle').value,plate:String(f('rr-plate').value||'').trim(),make:String(f('rr-make').value||'').trim(),model:String(f('rr-model').value||'').trim()};
  if(!name||!phone||!password){toast('กรุณากรอกข้อมูลส่วนตัวให้ครบ');return false;}
  if(!/^0[0-9]{9}$/.test(phone)){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678');return false;}
  if(password.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return false;}
  if(!f('rr-province').value||!f('rr-district').value){toast('กรุณาเลือกจังหวัดและอำเภอ/เขต');return false;}
  if(!form.plate){toast('กรุณากรอกทะเบียนรถ');riderStepGo(1);return false;}
  const agree=document.querySelector('.rider-confirm input[type=checkbox]');
  if(!agree||!agree.checked){toast('กรุณายืนยันข้อมูลและข้อตกลงก่อนส่งใบสมัคร');riderStepGo(3);return false;}
  const files=['rr-photo','rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo'];const data={};
  for(const id of files){const input=f(id);if(input&&input.files&&input.files[0]){const file=input.files[0];data[id]=file.type.startsWith('image/')?await compressRiderImage(file):await readFileAsDataURL(file);}else{const draft=await loadRiderDraftFile(id);if(draft&&draft.data)data[id]=draft.data;}}
  const requiredDocs=files;const labels={'rr-photo':'รูปถ่ายหน้าตรง','rr-id-front':'บัตรประชาชนด้านหน้า','rr-id-back':'บัตรประชาชนด้านหลัง','rr-license':'ใบขับขี่','rr-prb':'พ.ร.บ. รถ','rr-vehicle-photo':'รูปถ่ายคู่กับรถ'};const missing=requiredDocs.filter(id=>!data[id]);
  if(missing.length){toast('กรุณาอัปโหลด: '+missing.map(x=>labels[x]).join(', '));return false;}
  const submitBtn=e.submitter||document.querySelector('.rider-submit');if(submitBtn)submitBtn.disabled=true;
  try{
    toast('กำลังสร้างบัญชีและส่งใบสมัคร...');
    const authEmail=email||authEmailFromPhone(phone);
    const auth=await sbAuth('signup',{email:authEmail,password,data:{name,phone,role:'rider'}});
    if(!auth.user||!auth.user.id)throw new Error('สร้างบัญชี Supabase Authentication ไม่สำเร็จ');
    let session=auth.session;
    if(!session||!session.access_token){
      try{session=await sbAuth('token?grant_type=password',{email:authEmail,password});}
      catch(err){throw new Error(email?'บัญชีถูกสร้างแล้ว แต่ยังไม่ได้ยืนยันอีเมลใน Supabase':'บัญชี Auth ถูกสร้างแล้ว แต่ Supabase ยังไม่อนุญาตให้เข้าสู่ระบบทันที กรุณาปิด Email Confirmation ใน Supabase Authentication Settings แล้วสมัครใหม่');}
    }
    if(!session||!session.access_token)throw new Error('ไม่สามารถสร้าง Session ของบัญชีได้');
    const existing=await sbTable('users?select=id,auth_user_id,role,name,phone,status,created_at&auth_user_id=eq.'+encodeURIComponent(auth.user.id)+'&limit=1',{token:session.access_token});
    let profile=Array.isArray(existing)&&existing[0]?existing[0]:null;
    if(!profile){
      const created=await sbTable('users?select=id,auth_user_id,role,name,phone,status,created_at',{method:'POST',token:session.access_token,body:{auth_user_id:auth.user.id,role:'rider',name,phone,status:'pending'}});
      profile=Array.isArray(created)&&created[0]?created[0]:created;
    }
    if(!profile||!profile.id||String(profile.auth_user_id)!==String(auth.user.id))throw new Error('สร้างข้อมูลสมาชิกใน public.users ไม่สำเร็จ');
    const metadata=riderRegistrationMetadata(profile,data,form);
    const riderBody={user_id:profile.id,rider_name:name,phone,vehicle_type:form.vehicle,vehicle_plate:form.plate,address:form.area||null,latitude:null,longitude:null,status:'pending',metadata};
    const riderRows=await sbTable('rider_profiles?on_conflict=user_id',{method:'POST',token:session.access_token,body:riderBody});
    if(!riderRows) throw new Error('สร้างโปรไฟล์ไรเดอร์ไม่สำเร็จ');
    const sessionId=crypto.randomUUID();
    await claimActiveSession(sessionId,auth.user.id,session.access_token);
    S.session={authUserId:auth.user.id,accessToken:session.access_token,refreshToken:session.refresh_token||null,expiresAt:auth.expires_at?auth.expires_at*1000:(session.expires_at?session.expires_at*1000:jwtExpiryMs(session.access_token)),sessionId};
    writeSession(S.session);S.user=profile;S.riderProfile=Array.isArray(riderRows)?riderRows[0]:riderRows;S.online=false;
    startSessionGuard();
    await clearRiderDraft();try{sessionStorage.removeItem('qt_rider_profile_draft');sessionStorage.removeItem('qt_rider_register_hash');}catch(err){}
    toast('ส่งใบสมัครสำเร็จ รอ Admin ตรวจสอบ');
    renderPending(profile,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ');
  }catch(err){
    console.error('QueueGo rider registration error',err);
    const m=String(err&&err.message||'');
    toast(/already registered|User already registered|duplicate key/i.test(m)?'สมัครไม่สำเร็จ: เบอร์หรืออีเมลนี้ถูกใช้สมัครแล้ว':m||'สมัครสมาชิกไม่สำเร็จ');
  }finally{if(submitBtn)submitBtn.disabled=false;}
  return false;
}

async function doLogin(){
  const btn = document.getElementById('li-btn');
  const errBox = document.getElementById('li-err');
  const phone = document.getElementById('li-phone').value.trim();
  const pass = document.getElementById('li-pass').value;
  errBox.classList.remove('show');
  if(!phone || !pass){ errBox.textContent='กรุณากรอกเบอร์โทรและรหัสผ่าน'; errBox.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const email = phone.includes('@') ? phone : authEmailFromPhone(phone);
    const auth = await sbAuth('token?grant_type=password', {email, password:pass});
    const rows = await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(auth.user.id), {token:auth.access_token});
    const u = Array.isArray(rows) ? rows[0] : null;
    if(!u || u.role!=='rider'){ throw new Error('บัญชีนี้ไม่ใช่บัญชีไรเดอร์'); }
    const sessionId=crypto.randomUUID();
    await claimActiveSession(sessionId,auth.user.id,auth.access_token);
    S.session = {authUserId:auth.user.id, accessToken:auth.access_token, refreshToken:auth.refresh_token||null, expiresAt:auth.expires_at?auth.expires_at*1000:jwtExpiryMs(auth.access_token), sessionId};
    writeSession(S.session);
    startSessionGuard();
    S.user = u;
    if(u.status==='suspended'){ renderPending(u,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return; }
    if(u.status!=='active'){ renderPending(u,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ'); return; }
    await loadRiderProfile();
    renderStage();
  }catch(e){
    console.error(e);
    errBox.textContent = /invalid/i.test(e.message) ? 'เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง' : e.message;
    errBox.classList.add('show');
  }finally{ btn.disabled=false; btn.textContent='เข้าสู่ระบบ'; }
}

async function doLogout(){
  const s=readSession();
  stopSessionGuard();
  try{if(s&&s.sessionId&&s.accessToken)await sbRpc('revoke_active_session',{p_session_id:s.sessionId},s.accessToken);}catch(e){console.warn('revoke active session failed',e);}
  clearSession();stopPolling();
  if(S.watchId) navigator.geolocation.clearWatch(S.watchId);
  Object.assign(S,{session:null,user:null,riderProfile:null,online:false,activeOrder:null,openJobs:[],history:[]});
  renderLogin();
}

function startGeolocation(){
  if(!navigator.geolocation){ toast('อุปกรณ์นี้ไม่รองรับ GPS'); return; }
  S.watchId = navigator.geolocation.watchPosition(pos=>{
    S.pos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    placeRiderMarker();
    if(!S._centeredOnce&&S.map){ S.map.setView([S.pos.lat,S.pos.lng], 15); S._centeredOnce = true; }
    if(S.online) pushLocation();
    if(S.activeTab==='home') renderSheet();

async function toggleOnline(){
  const next = !S.online;
  S.online = next;
  updateStatusUI();
  try{
    const token = await getAccessToken();
    const meta = Object.assign({}, (S.riderProfile&&S.riderProfile.metadata)||{}, {online:next});
    const body = {user_id:S.user.id, rider_name:S.user.name||'ไรเดอร์', phone:S.user.phone||null,
      vehicle_type:(S.riderProfile&&S.riderProfile.vehicle_type)||null, vehicle_plate:(S.riderProfile&&S.riderProfile.vehicle_plate)||null,
      latitude:S.pos?S.pos.lat:null, longitude:S.pos?S.pos.lng:null, metadata:meta};
    let rows;
    if(S.riderProfile && S.riderProfile.user_id){
      rows = await sbTable('rider_profiles?user_id=eq.'+encodeURIComponent(S.user.id), {method:'PATCH', token, body});
    }else{
      rows = await sbTable('rider_profiles', {method:'POST', token, body:{...body,status:'active'}});
    }
    S.riderProfile = Array.isArray(rows)?rows[0]:rows;
    toast(next ? '🟢 เปิดรับงานแล้ว' : '⚪ ปิดรับงานแล้ว');
    refreshData();
  }catch(e){
    console.error(e); S.online = !next; updateStatusUI();

  }
}

/* QueueGo v21: superseded updateStatusUI presentation removed. */
async function refreshData(){
  try{
    const token = await getAccessToken();
    const mine = await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(S.riderProfile.id)+'&status=in.(assigned,picked_up,in_progress)&order=created_at.desc&limit=1', {token});
    S.activeOrder = Array.isArray(mine) && mine[0] ? mine[0] : null;

    const previousOpenJobIds = new Set((S.openJobs||[]).map(x=>x&&x.order&&x.order.id ? String(x.order.id) : null).filter(Boolean));
    if(S.activeOrder){
      await enrichOrder(S.activeOrder);
      S.openJobs = [];
    } else if(S.online){
      const open = await sbTable('orders?select=*&order_type=eq.shopping&status=eq.ready&rider_id=is.null&order=created_at.asc&limit=25', {token});
      const list = Array.isArray(open) ? open : [];
      for(const o of list) await enrichOrder(o);
      const candidates = list
        .map(o=>({order:o, distanceKm: haversineKm(S.pos&&S.pos.lat, S.pos&&S.pos.lng, o.pickup_latitude, o.pickup_longitude)}))
        .filter(x=>Number.isFinite(x.distanceKm))
        .sort((a,b)=>a.distanceKm-b.distanceKm);
      const nearby = candidates.filter(x=>x.distanceKm <= NEARBY_RADIUS_KM);
      // Rider-side fallback: if there is no job within 2 km, keep the nearest open job visible.
      // Final nearest-Rider assignment must be enforced server-side/RPC to prevent two riders claiming the same fallback job.
      S.openJobs = nearby.length ? nearby : (candidates.length ? [{...candidates[0], fallback:true}] : []);
    } else {
      S.openJobs = [];
    }
    if(window.qtCheckNewJobs){
      const currentOpenOrders = S.openJobs.map(x=>x.order).filter(Boolean);
      window.qtCheckNewJobs(previousOpenJobIds, currentOpenOrders);
    }
    if(S.activeTab==='home') renderSheet();
    placeJobMarkers();

    const hist = await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(S.riderProfile.id)+'&status=eq.completed&order=updated_at.desc&limit=200', {token});
    S.history = Array.isArray(hist) ? hist : [];
    if(S.activeTab==='jobs') renderHistoryPanel();
  }catch(e){ console.error('refreshData failed', e);const now=Date.now();if(!refreshData.lastErrorAt||now-refreshData.lastErrorAt>30000){refreshData.lastErrorAt=now;toast('โหลดงานจากฐานข้อมูลไม่สำเร็จ: '+(e.message||e));} }
}
async function enrichOrder(o){
  const token = await getAccessToken();
  if(o.shop_id && !o._shop){
    try{ const rows = await sbTable('shop_profiles?select=shop_name,phone,address&id=eq.'+encodeURIComponent(o.shop_id), {token}); o._shop = Array.isArray(rows)&&rows[0] ? rows[0] : null; }
    catch(e){ o._shop = null; }
  }
  if(o.customer_id && !o._customer){
    try{ const rows = await sbTable('users?select=name,phone&id=eq.'+encodeURIComponent(o.customer_id), {token}); o._customer = Array.isArray(rows)&&rows[0] ? rows[0] : null; }
    catch(e){ o._customer = null; }
  }
}
function placeJobMarkers(){
  if(!S.map)return;
  S.jobMarkers.forEach(m=>S.map.removeLayer(m)); S.jobMarkers = [];
  const list = S.activeOrder ? [S.activeOrder] : S.openJobs.map(x=>x.order);
  const bounds = [];
  list.forEach(o=>{
    const plat=Number(o.pickup_latitude), plng=Number(o.pickup_longitude);
    const dlat=Number(o.delivery_latitude), dlng=Number(o.delivery_longitude);
    if(Number.isFinite(plat)&&Number.isFinite(plng)){
      const m=L.marker([plat,plng],{icon:L.divIcon({html:'<div style="width:18px;height:18px;border-radius:50%;background:#16a34a;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',className:'',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(S.map);
      m.bindPopup('<b style="color:#15803d">จุดรับ</b><br>'+esc(o.pickup_address||'ร้านค้า'));
      S.jobMarkers.push(m); bounds.push([plat,plng]);
    }
    if(Number.isFinite(dlat)&&Number.isFinite(dlng)){
      const m=L.marker([dlat,dlng],{icon:L.divIcon({html:'<div style="width:18px;height:18px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',className:'',iconSize:[24,24],iconAnchor:[12,12]})}).addTo(S.map);
      m.bindPopup('<b style="color:#b91c1c">จุดส่ง</b><br>'+esc(o.delivery_address||'บ้านลูกค้า'));
      S.jobMarkers.push(m); bounds.push([dlat,dlng]);
    }
  });
  if(bounds.length && S.activeTab==='home' && !S.pos){
    try{ S.map.fitBounds(bounds,{padding:[45,45],maxZoom:16}); }catch(e){}
  }
  drawActiveRoute();
}
function drawActiveRoute(){
  if(!S.map)return; if(S.routeLine){try{S.map.removeLayer(S.routeLine)}catch(e){} S.routeLine=null;}
  const badge=document.getElementById('route-badge'),txt=document.getElementById('route-text');
  if(!S.activeOrder||!S.pos){if(badge)badge.style.display='none';return;}
  const o=S.activeOrder, st=statusFromRow(o); const toShop=st==='assigned';
  const lat=Number(toShop?o.pickup_latitude:o.delivery_latitude),lng=Number(toShop?o.pickup_longitude:o.delivery_longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)){if(badge)badge.style.display='none';return;}
  S.routeLine=L.polyline([[S.pos.lat,S.pos.lng],[lat,lng]],{color:'#08b887',weight:6,opacity:.9,dashArray:'12 8'}).addTo(S.map);
  const km=haversineKm(S.pos.lat,S.pos.lng,lat,lng); if(badge){badge.style.display='block';if(txt)txt.textContent=(toShop?'ไปร้าน • ':'ไปหาลูกค้า • ')+(Number.isFinite(km)?km.toFixed(1)+' กม.':'');}
}

/* QueueGo v21: superseded bindJobCardEvents presentation removed. */
function bindDeliverySlide(track,thumb,onDone){
  let startX=0,current=0,drag=false,finished=false;
  const max=()=>Math.max(0,track.clientWidth-thumb.offsetWidth-6);
  const move=x=>{ current=Math.max(0,Math.min(max(),x-startX)); thumb.style.transform=`translateX(${current}px)`; };
  const end=()=>{ if(!drag||finished)return; drag=false; if(current>=max()*0.82){ finished=true; current=max(); thumb.style.transform=`translateX(${current}px)`; track.classList.add('done'); thumb.textContent='✓'; onDone(); } else { current=0; thumb.style.transform='translateX(0)'; } };
  thumb.addEventListener('pointerdown',e=>{ if(finished)return; drag=true; startX=e.clientX-current; thumb.setPointerCapture?.(e.pointerId); });
  thumb.addEventListener('pointermove',e=>{ if(drag)move(e.clientX); });
  thumb.addEventListener('pointerup',end);
  thumb.addEventListener('pointercancel',end);
}

async function acceptJob(orderId){
  const btn=document.getElementById('accept-'+orderId);
  if(btn){ btn.disabled=true; btn.textContent='กำลังรับงาน...'; }
  try{
    const token = await getAccessToken();
    if(!token) throw new Error('ไม่พบเซสชันเข้าสู่ระบบ');
    if(!S.riderProfile || !S.riderProfile.id) throw new Error('ไม่พบ rider_profiles.id ของไรเดอร์');
    const currentRows = await sbTable('orders?id=eq.'+encodeURIComponent(orderId), {token});
    const current = Array.isArray(currentRows) ? currentRows[0] : null;
    if(!current){ throw new Error('ไม่พบออเดอร์ในฐานข้อมูล'); }
    if(current.rider_id){ toast('งานนี้มีไรเดอร์รับไปแล้ว'); refreshData(); return; }
    const updated = await sbTable('orders?id=eq.'+encodeURIComponent(orderId)+'&rider_id=is.null', {method:'PATCH', token, body:{
      rider_id:S.riderProfile.id, status:statusToDb('assigned'), note:noteWithTag(current,'assigned'), updated_at:new Date().toISOString()
    }});
    if(!Array.isArray(updated) || !updated.length){
      const verify=await sbTable('orders?id=eq.'+encodeURIComponent(orderId)+'&select=id,rider_id,status,order_number', {token});
      const row=Array.isArray(verify)?verify[0]:null;
      if(!row || row.rider_id!==S.riderProfile.id) throw new Error('เซิร์ฟเวอร์ไม่ยืนยันการรับงาน');
    }
    toast('รับงานสำเร็จ');
    await refreshData();
  }catch(e){
    console.error('acceptJob failed',e);
    toast('รับงานไม่สำเร็จ: '+String(e.message||e));
    if(btn){ btn.disabled=false; btn.textContent='รับงานนี้'; }
  }
}

(function(){
  let audioCtx=null, repeatTimer=null, alertJobId=null, alertJob=null, alertBusy=false;
  function ctx(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}return audioCtx;}catch(e){return null;}}
  function unlockAudio(){try{const c=ctx();if(c&&c.state==='suspended')c.resume().catch(()=>{});}catch(e){}}
  function beep(){try{const c=ctx();if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{});const now=c.currentTime;[880,1175].forEach((freq,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now+i*.13);g.gain.exponentialRampToValueAtTime(.20,now+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.30);o.connect(g);g.connect(c.destination);o.start(now+i*.13);o.stop(now+i*.13+.31);});}catch(e){}}
  function speak(){try{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('มีออเดอร์ใหม่เข้ามา กรุณาตรวจสอบและรับออเดอร์');u.lang='th-TH';u.rate=.92;u.pitch=1;u.volume=1;window.speechSynthesis.speak(u);}catch(e){}}
  function vibrate(){try{if(navigator.vibrate)navigator.vibrate([450,180,450,180,750]);}catch(e){}}
  function ensureUI(){
    let el=document.getElementById('qt-new-order-alert');if(el)return el;
    el=document.createElement('div');el.id='qt-new-order-alert';el.className='qt-alert-backdrop';el.setAttribute('role','alertdialog');el.setAttribute('aria-modal','true');
    el.innerHTML='<div class="qt-alert-card"><div class="qt-alert-icon">🔔</div><div class="qt-alert-title">มีออเดอร์ใหม่</div><div class="qt-alert-sub">มีงานใหม่เข้ามาสำหรับไรเดอร์</div><div class="qt-alert-order"><b id="qt-alert-order-no">ออเดอร์ใหม่</b><span id="qt-alert-order-detail">กรุณากดรับทราบเพื่อดูรายละเอียดออเดอร์</span></div><button type="button" class="qt-alert-btn" id="qt-alert-ack">รับทราบ</button></div>';
    document.body.appendChild(el);document.getElementById('qt-alert-ack').addEventListener('click',acknowledge);return el;
  }
  function show(job){
    if(!job||!job.id)return;const id=String(job.id);if(alertJobId===id)return;alertJobId=id;alertJob=job;const el=ensureUI();
    const no=document.getElementById('qt-alert-order-no'),detail=document.getElementById('qt-alert-order-detail');

    el.classList.add('show');document.body.style.overflow='hidden';unlockAudio();beep();speak();vibrate();
    clearInterval(repeatTimer);repeatTimer=setInterval(()=>{if(alertJobId){beep();speak();vibrate();}},7000);S.newJobAlert={active:true,jobId:id};
  }
  function acknowledge(){
    if(alertBusy)return;alertBusy=true;clearInterval(repeatTimer);repeatTimer=null;try{if(navigator.vibrate)navigator.vibrate(0);}catch(e){}try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}
    alertJobId=null;alertJob=null;S.newJobAlert={active:false,jobId:null};const el=document.getElementById('qt-new-order-alert');if(el)el.classList.remove('show');document.body.style.overflow='';alertBusy=false;
  }
  function checkNewJobs(previousIds,jobs){if(!S.online||S.activeOrder)return;const fresh=jobs.find(o=>o&&o.id&&!previousIds.has(String(o.id)));if(fresh)show(fresh);}
  ['click','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
  window.qtStartNewJobAlert=show;window.qtCheckNewJobs=checkNewJobs;window.qtStopNewJobAlert=function(){clearInterval(repeatTimer);repeatTimer=null;try{if(navigator.vibrate)navigator.vibrate(0);}catch(e){}try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}alertJobId=null;alertJob=null;const el=document.getElementById('qt-new-order-alert');if(el)el.classList.remove('show');document.body.style.overflow='';S.newJobAlert={active:false,jobId:null};};
})();

window.statusFromRow=function(row){

    const token=await getAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
    if(action==='pickup_cash'){
      const rows=await sbTable('orders?select=subtotal,status&id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token});
      if(rows?.[0]?.status!=='assigned')throw Error('สถานะงานเปลี่ยนแล้ว กรุณาโหลดใหม่');

    }
    await sbTable('rpc/rider_order_action',{method:'POST',token,body:{p_order_id:o.id,p_action:action}});
    toast(action==='pickup_cash'?'บันทึกเงินสดที่จ่ายให้ร้านแล้ว':'อัปเดตสถานะแล้ว');await refreshData();
  }catch(e){toast('อัปเดตไม่สำเร็จ: '+e.message);}

window.finishOrder=async function(o){

  try{const token=await getAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');

    renderPaymentSummary(rows?.[0]||{...o,status:'completed'},true);

};

     const token=await getAccessToken(),d=await sbTable('deliveries?select=delivered_at&order_id=eq.'+encodeURIComponent(order.id)+'&limit=1',{token});
     const at=d?.[0]?.delivered_at,rows=await loadChatMessages(order.id);
     if(!at||!rows.some(m=>String(m.sender_id)===String(order.customer_id)&&new Date(m.created_at)>new Date(at))){toast('หลังจบงาน รอลูกค้าส่งข้อความมาก่อน');return}
   }catch(e){toast('ตรวจสอบข้อความลูกค้าไม่สำเร็จ');return}}
   return send(order,message);
 };
 const switchOld=window.switchTab;
 window.switchTab=function(tab){
   document.getElementById('qg-rider-inbox')?.remove();
   if(tab!=='chat')return switchOld(tab);
   markInboxSeen();
   S.activeTab='chat';document.querySelectorAll('.qt-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab==='chat'));
   document.querySelectorAll('.qt-panel').forEach(p=>p.classList.remove('show'));
   for(const sel of ['#map','#sheet','.qt-fabs','#route-badge']){const el=document.querySelector(sel);if(el)el.style.display='none'}
   qgRenderMessageInbox();
 };
 const closeOld=window.closeChat;
 window.closeChat=function(){closeOld();if(S.user)window.switchTab('chat')};
 window.qgOpenInboxChat=function(id){const o=[S.activeOrder,...(S.history||[])].filter(Boolean).find(x=>String(x.id)===String(id));if(o){document.getElementById('qg-rider-inbox')?.remove();openChat(o)}};
 window.qgRenderMessageInbox=async function(){
   if(S.activeTab!=='chat'||S.chatOrder||!S.user)return;
   const stage=document.querySelector('.stage');if(!stage)return;
   let box=document.getElementById('qg-rider-inbox');if(!box){box=document.createElement('section');box.id='qg-rider-inbox';box.className='qg-inbox';stage.appendChild(box)}
   box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">กำลังโหลดข้อความ...</div>';
   try{const token=await getAccessToken(),orders=[S.activeOrder,...(S.history||[])].filter(Boolean).slice(0,100);
     if(!orders.length){box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">ยังไม่มีการสนทนา</div>';return}
     const ids=orders.map(o=>o.id).filter(Boolean);
     const [msgs,deliveries]=await Promise.all([
       sbTable('order_chat_messages?select=order_id,sender_id,message,created_at&order_id=in.('+ids.join(',')+')&order=created_at.desc&limit=500',{token}),
       sbTable('deliveries?select=order_id,delivered_at&order_id=in.('+ids.join(',')+')',{token})]);
     if(!box.isConnected||S.activeTab!=='chat'||S.chatOrder)return;
     const delivered=new Map((deliveries||[]).map(x=>[String(x.order_id),x.delivered_at]));
     const rows=orders.map(o=>{const messages=(msgs||[]).filter(m=>String(m.order_id)===String(o.id)),at=delivered.get(String(o.id));return{o,last:messages[0],initiated:o.status!=='completed'||Boolean(at&&messages.some(m=>String(m.sender_id)===String(o.customer_id)&&new Date(m.created_at)>new Date(at)))}}).filter(x=>x.initiated).sort((a,b)=>new Date(b.last?.created_at||b.o.updated_at)-new Date(a.last?.created_at||a.o.updated_at));
     box.innerHTML='<h2>ข้อความ</h2>'+(rows.length?rows.map(({o,last})=>'<button class="qg-inbox-item" type="button" onclick="qgOpenInboxChat(\''+esc(o.id)+'\')"><strong>ออเดอร์ '+esc(qtShortOrder(o))+'</strong><small>'+esc(last?(String(last.message).startsWith('__IMG__')?'รูปภาพ':String(last.message).slice(0,85)):'เปิดแชตระหว่างจัดส่ง')+'</small></button>').join(''):'<div class="qg-inbox-empty">ยังไม่มีข้อความจากลูกค้าหลังจบงาน</div>');
   }catch(e){if(box.isConnected)box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">โหลดข้อความไม่สำเร็จ กรุณาลองอีกครั้ง</div>'}
 };
 setInterval(()=>{if(S.activeTab==='chat'&&!S.chatOrder)qgRenderMessageInbox()},15000);
 setInterval(watchCompletedChat,30000);
})();
</script>
<script id="qg-v22-ticket-client">
(function(){
 const rider=typeof S!=='undefined'&&typeof sbTable==='function';
 const escText=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const token=()=>rider?getAccessToken():qtGetAccessToken();
 const request=async(path,method='GET',body=null)=>{const t=await token();if(!t)throw Error('กรุณาเข้าสู่ระบบ');return rider?sbTable(path,{method,token:t,body}):qtSupabaseTable(path,{method,accessToken:t,body})};
 const config=()=>rider?{url:SB.URL,key:SB.KEY}:{url:QT_SUPABASE_CONFIG.URL,key:QT_SUPABASE_CONFIG.KEY};
 const authSub=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}};
 const names={missing_item:'สินค้าไม่ครบ',wrong_item:'สินค้าไม่ตรง',damaged_food:'อาหารเสียหาย',rider:'ปัญหาไรเดอร์',merchant:'ปัญหาร้านค้า',payment:'การชำระเงิน',cash:'เงินสด',gp:'GP',other:'อื่น ๆ'};
 async function upload(file){if(!file)return null;
   if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('หลักฐานต้องเป็น JPG, PNG หรือ WebP ขนาดไม่เกิน 5 MB');
   const t=await token(),uid=authSub(t),c=config();if(!uid)throw Error('เซสชันไม่ถูกต้อง');
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type],path=uid+'/'+crypto.randomUUID()+'.'+ext;
   const response=await fetch(c.url+'/storage/v1/object/qg-evidence/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':file.type,'x-upsert':'false'},body:file});
   if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.message||'อัปโหลดหลักฐานไม่สำเร็จ')}
   return path;
 }
 window.qgUploadEvidence=upload;
 window.qgOpenEvidence=async function(path){try{const t=await token(),c=config();const response=await fetch(c.url+'/storage/v1/object/sign/qg-evidence/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const data=await response.json();if(!response.ok)throw Error(data.message||'เปิดหลักฐานไม่สำเร็จ');window.open(c.url+'/storage/v1'+data.signedURL,'_blank','noopener')}catch(e){alert(e.message)}};
 window.qgOpenTicketPanel=function(orderId=''){
   if(!(rider?S.user:currentUser())){if(!rider)navigate('login');else alert('กรุณาเข้าสู่ระบบ');return}
   document.getElementById('qg-v22-ticket')?.remove();const panel=document.createElement('section');panel.id='qg-v22-ticket';panel.className='qg-v22-overlay';
   panel.innerHTML='<div class="qg-v22-dialog"><header><b>ติดต่อฝ่ายดูแล</b><button type="button" id="qg-ticket-close" aria-label="ปิด">✕</button></header><p>แจ้งปัญหาและติดตามสถานะจากระบบ</p><form id="qg-ticket-form"><label>ออเดอร์ที่เกี่ยวข้อง (ถ้ามี)<select name="order"><option value="">ไม่ระบุออเดอร์</option></select></label><label>ประเภทปัญหา<select name="category"></select></label><label>รายละเอียด<textarea name="details" minlength="10" maxlength="2000" required placeholder="อธิบายปัญหาอย่างน้อย 10 ตัวอักษร"></textarea></label><label>รูปหลักฐาน (ถ้ามี)<input name="evidence" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="submit">ส่งเรื่อง</button></form><h3>เรื่องที่แจ้งไว้</h3><div id="qg-ticket-list">กำลังโหลด...</div></div>';
   document.body.appendChild(panel);panel.querySelector('#qg-ticket-close').onclick=()=>panel.remove();panel.onclick=e=>{if(e.target===panel)panel.remove()};
   panel.querySelector('[name=category]').innerHTML=Object.entries(names).map(([key,label])=>'<option value="'+key+'">'+label+'</option>').join('');
   request('orders?select=id,order_number&order_type=eq.shopping&order=created_at.desc&limit=50').then(rows=>{if(!panel.isConnected)return;const select=panel.querySelector('[name=order]');select.insertAdjacentHTML('beforeend',(rows||[]).map(o=>'<option value="'+escText(o.id)+'">'+escText(o.order_number||o.id)+'</option>').join(''));if(orderId)select.value=orderId}).catch(e=>{panel.querySelector('#qg-ticket-list').textContent='โหลดออเดอร์ไม่สำเร็จ: '+e.message});
   qgLoadTickets();
   panel.querySelector('#qg-ticket-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type=submit]');button.disabled=true;try{const path=await upload(form.evidence.files[0]),details=form.details.value.trim();await request('rpc/qg_create_ticket','POST',{p_ticket_id:crypto.randomUUID(),p_order_id:form.order.value||null,p_category:form.category.value,p_details:details,p_evidence_path:path});form.reset();await qgLoadTickets();alert('ส่งเรื่องให้ฝ่ายดูแลแล้ว')}catch(err){alert('ส่งเรื่องไม่สำเร็จ: '+err.message)}finally{button.disabled=false}};
 };
 window.qgLoadTickets=async function(){const box=document.getElementById('qg-ticket-list');if(!box)return;try{const rows=await request('qg_support_tickets?select=id,category,details,status,order_id,created_at,admin_note,evidence_path&order=created_at.desc&limit=50');if(!box.isConnected)return;box.innerHTML=rows?.length?rows.map(t=>'<article><b>'+escText(names[t.category]||t.category)+'</b><span>'+escText(t.status)+'</span><p>'+escText(t.details)+'</p><small>'+new Date(t.created_at).toLocaleString('th-TH')+(t.admin_note?' · ฝ่ายดูแล: '+escText(t.admin_note):'')+'</small>'+(t.evidence_path?'<button type="button" data-path="'+escText(t.evidence_path)+'" onclick="qgOpenEvidence(this.dataset.path)">ดูหลักฐาน</button>':'')+'</article>').join(''):'ยังไม่มีเรื่องที่แจ้ง'}catch(e){box.textContent='โหลดเรื่องที่แจ้งไม่สำเร็จ: '+e.message}};
})();
</script>

.qg-v22-overlay{position:fixed;inset:0;z-index:100000;background:#0b24239c;display:grid;place-items:center;padding:16px;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.qg-v22-dialog{width:min(100%,520px);max-height:92dvh;overflow:auto;background:white;border-radius:20px;padding:18px;color:#193b32;box-shadow:0 22px 60px #0b262842}.qg-v22-dialog header{display:flex;justify-content:space-between;align-items:center;font-size:19px}.qg-v22-dialog header button{border:0;background:#eef6f1;border-radius:10px;padding:8px 12px}.qg-v22-dialog p{line-height:1.5}.qg-v22-dialog form{display:grid;gap:11px}.qg-v22-dialog label{display:grid;gap:5px;font-size:13px;font-weight:650}.qg-v22-dialog select,.qg-v22-dialog textarea,.qg-v22-dialog input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cee6d9;border-radius:11px;background:#fff;font:inherit;color:#193b32}.qg-v22-dialog textarea{min-height:95px;resize:vertical}.qg-v22-dialog form button{border:0;border-radius:12px;background:#0d9f73;color:white;padding:13px;font-weight:750}.qg-v22-dialog article{border:1px solid #dcebe3;border-radius:12px;padding:11px;margin:8px 0;overflow-wrap:anywhere}.qg-v22-dialog article span{float:right;color:#0b9269}.qg-v22-dialog article small{color:#73887c}.qg-v22-dialog article button{display:block;margin-top:7px;border:0;background:#e5f7ee;color:#087556;border-radius:9px;padding:8px}

<script id="qg-v22-rider-operations">
(function(){
 const paymentSummary=window.renderPaymentSummary;
 window.renderPaymentSummary=function(o,completed=false){paymentSummary(o,completed);if(completed)return;const card=document.querySelector('#summary-screen .qt-summarycard');if(card&&!card.querySelector('#qg-v22-delivery-photo')){const label=document.createElement('label');label.className='qg-v22-photo-label';label.textContent='รูปหลักฐานการส่งมอบ (ถ้ามี)';const input=document.createElement('input');input.id='qg-v22-delivery-photo';input.type='file';input.accept='image/jpeg,image/png,image/webp';label.appendChild(input);card.insertBefore(label,card.querySelector('#finish-order-btn'))}};
 const profile=window.renderProfilePanel;
 window.renderProfilePanel=function(){profile();const host=document.querySelector('#panel-profile .qt-settings');if(host&&!host.querySelector('#qg-v22-rider-support')){const b=document.createElement('button');b.id='qg-v22-rider-support';b.className='qt-setting';b.innerHTML='<span>แจ้งปัญหา / ติดตามเรื่อง</span><span>›</span>';b.onclick=()=>qgOpenTicketPanel();host.appendChild(b)}};
 const finish=window.finishOrder;
 window.finishOrder=async function(o){
   try{const t=await getAccessToken(),rows=await sbTable('orders?select=total_amount,status&id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token:t});
     if(rows?.[0]?.status!=='in_progress')throw Error('สถานะออเดอร์เปลี่ยนแล้ว กรุณาโหลดใหม่');
     if(!confirm('ยืนยันว่าได้รับเงินสดจากลูกค้า ฿'+Number(rows[0].total_amount).toLocaleString('th-TH')+' แล้ว?'))return;
   }catch(e){toast('ตรวจยอดรับเงินไม่สำเร็จ: '+e.message);return}
   const pin=prompt('กรอกรหัส PIN 6 หลักจากลูกค้าเพื่อยืนยันการส่งมอบ');if(pin===null)return;
   if(!/^\d{6}$/.test(pin.trim())){toast('PIN ต้องเป็นตัวเลข 6 หลัก');return}
   const button=document.getElementById('finish-order-btn');if(button)button.disabled=true;
   let lat=null,lng=null;
   if(navigator.geolocation)try{const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:5000,maximumAge:10000}));lat=p.coords.latitude;lng=p.coords.longitude}catch(e){}
   try{const token=await getAccessToken(),file=document.getElementById('qg-v22-delivery-photo')?.files?.[0],photoPath=file?await qgUploadEvidence(file):null;await sbTable('rpc/qg_complete_with_proof',{method:'POST',token,body:{p_order_id:o.id,p_pin:pin.trim(),p_lat:lat,p_lng:lng,p_photo_path:photoPath}});
     const rows=await sbTable('orders?select=*&id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token});renderPaymentSummary(rows?.[0]||{...o,status:'completed'},true);
   }catch(e){toast('จบงานไม่สำเร็จ: '+e.message);if(button)button.disabled=false}
 };
 window.qtRenderEarnings=function(){const panel=document.getElementById('panel-earn');if(!panel)return;panel.innerHTML='<div class="qt-panelhead"><h1>รายได้</h1></div>';let box=document.getElementById('qg-v22-cash-ledger');if(!box){box=document.createElement('section');box.id='qg-v22-cash-ledger';box.className='qg-v22-ledger';panel.appendChild(box)}
   box.innerHTML='<h2>สรุปงานและบัญชีเงินสด</h2><div class="qg-v22-period"><button data-days="1">วันนี้</button><button data-days="7">7 วัน</button><button data-days="30">30 วัน</button></div><div id="qg-v22-period-summary">กำลังโหลดสรุปงาน...</div><div id="qg-v22-ledger-body">กำลังโหลดจากฐานข้อมูล...</div>';
   box.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{const days=Number(b.dataset.days);qgLoadRiderLedger(days);qgLoadRiderPeriod(days)});qgLoadRiderLedger(1);qgLoadRiderPeriod(1);
 };
 const day=d=>{const x=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(p=>[p.type,p.value]));return x.year+'-'+x.month+'-'+x.day};
 const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
 window.qgLoadRiderPeriod=async function(days){const box=document.getElementById('qg-v22-period-summary');if(!box)return;box.textContent='กำลังโหลดสรุปงาน...';try{const token=await getAccessToken(),s=await sbTable('rpc/qg_rider_period_summary',{method:'POST',token,body:{p_days:days}});if(!box.isConnected)return;box.innerHTML='<div class="qg-v22-ledger-grid"><div>งานสำเร็จ<b>'+Number(s.jobs||0)+' งาน</b></div><div>รายได้จากค่าส่ง<b>'+baht(s.income)+'</b></div><div>ชั่วโมงออนไลน์ที่บันทึก<b>'+Number(s.online_hours||0)+' ชม.</b></div><div>เฉลี่ยต่อชั่วโมง<b>'+(s.income_per_hour===null?'ยังไม่มีข้อมูล':baht(s.income_per_hour))+'</b></div></div><small>บันทึกเวลาออนไลน์ตั้งแต่ '+(s.tracked_since?new Date(s.tracked_since).toLocaleString('th-TH'):'เริ่มใช้ระบบครั้งแรก')+'</small>'}catch(e){box.textContent='โหลดสรุปงานไม่สำเร็จ: '+e.message}};
 window.qgLoadRiderLedger=async function(days){const box=document.getElementById('qg-v22-ledger-body');if(!box)return;box.textContent='กำลังโหลดจากฐานข้อมูล...';try{
   const to=new Date(),from=new Date(to.getTime()-(days-1)*86400000),token=await getAccessToken();const rows=await sbTable('rpc/qg_rider_cash_ledger',{method:'POST',token,body:{p_from:day(from),p_to:day(to)}});
   if(!box.isConnected)return;const sum=k=>(rows||[]).reduce((a,o)=>a+Number(o[k]||0),0),paid=sum('cash_paid_merchant'),collected=sum('cash_collected_customer'),fees=(rows||[]).filter(o=>o.payment_status==='paid').reduce((a,o)=>a+Number(o.delivery_fee||0),0),outstanding=(rows||[]).filter(o=>o.cash_paid_merchant&&!o.cash_collected_customer).reduce((a,o)=>a+Number(o.total||0),0);
   box.innerHTML='<div class="qg-v22-ledger-grid"><div>จ่ายร้าน<b>'+baht(paid)+'</b></div><div>เก็บลูกค้า<b>'+baht(collected)+'</b></div><div>ค่าส่งที่ได้รับ<b>'+baht(fees)+'</b></div><div>รอเก็บลูกค้า<b>'+baht(outstanding)+'</b></div><div>สุทธิรับ-จ่าย<b>'+baht(collected-paid)+'</b></div><div>งานสำเร็จ<b>'+(rows||[]).filter(o=>o.status==='completed').length+'</b></div></div>'+
     (rows||[]).map(o=>'<article><b>'+String(o.order_number||o.order_id)+'</b><small>'+String(o.status)+' · '+(o.merchant_confirmed?'ร้านยืนยันรับเงิน':'ร้านยังไม่ยืนยัน')+' · '+String(o.payment_status||'รอชำระ')+'</small><span>จ่าย '+baht(o.cash_paid_merchant)+' / เก็บ '+baht(o.cash_collected_customer)+'</span></article>').join('');
 }catch(e){box.textContent='โหลดบัญชีเงินสดไม่สำเร็จ: '+e.message}};
 const card=window.jobCardHTML;
 window.jobCardHTML=function(o,x){const html=card(o,x),toShop=x?.distanceKm??haversineKm(S.pos?.lat,S.pos?.lng,o.pickup_latitude,o.pickup_longitude),toCustomer=haversineKm(o.pickup_latitude,o.pickup_longitude,o.delivery_latitude,o.delivery_longitude),all=toShop+toCustomer;
   if(!Number.isFinite(all))return html;return html.replace(/(<div class="qt-metrics">)/,'<div class="qg-v22-job-metrics">ไปร้าน '+toShop.toFixed(1)+' กม. · ไปหาลูกค้า '+toCustomer.toFixed(1)+' กม. · รวม '+all.toFixed(1)+' กม. · ประมาณ '+Math.ceil(all/25*60)+' นาที · ค่าส่งประมาณ '+baht(o.delivery_fee)+'</div>$1')};
})();
</script>
