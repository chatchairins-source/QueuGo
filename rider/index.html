<script>/* =========================================================================
   QueueGo Rider — Supabase-connected rider interface.
   Includes registration, delivery workflow, messages and earnings.
   ========================================================================= */
const SB = {
  URL: 'https://pkypiqhlrmzocysgeqew.supabase.co',
  KEY: 'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
const SESSION_KEY = 'qtr_session_v1';
const NEARBY_RADIUS_KM = 2;
const APP_VERSION='4.0.0';
const POLL_MS = 60000;

/* ---------- full-screen lock + responsive resize (all screens, incl. rider page) ---------- */
(function(){
  function setVH(){
    const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight) * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  let resizeRaf = null;
  function onViewportChange(){
    setVH();
    if(resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(()=>{
      if(S.map){ try{ S.map.invalidateSize({animate:false}); }catch(e){} }
    });
  }
  setVH();
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', onViewportChange);
  }
  document.addEventListener('DOMContentLoaded', setVH);

  /* QueueGo 2026-10-02: native document scrolling is the default.
     Do not cancel global touchmove events; interactive controls and the map
     keep their own local gesture handling. */
})();

function sbHeaders(token){
  const h = {apikey:SB.KEY, 'Content-Type':'application/json'};
  if(token) h.Authorization = 'Bearer '+token;
  return h;
}
async function sbAuth(path, body){
  const r = await fetch(SB.URL+'/auth/v1/'+path, {method:'POST', headers:sbHeaders(), body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const data = await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return ({})});
  if(!r.ok) throw new Error(data.error_description || data.msg || data.message || 'AUTH_ERROR');
  return data;
}
async function sbTable(path, options={}){
  const headers = sbHeaders(options.token);
  if(options.method && options.method!=='GET') headers.Prefer = 'return=representation';
  const r = await fetch(SB.URL+'/rest/v1/'+path, {
    method: options.method||'GET', headers, body: options.body?JSON.stringify(options.body):undefined,signal:AbortSignal.timeout(15000)
  });
  const data = await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok) throw new Error((data&&data.message) || 'DB_ERROR_'+r.status);
  return data;
}
function authEmailFromPhone(phone){ return String(phone||'').replace(/\D/g,'')+'@auth.queuetech.local'; }
function jwtExpiryMs(token){
  try{
    const part = String(token||'').split('.')[1];
    const b64 = part.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((part.length+3)%4);
    return Number(JSON.parse(atob(b64)).exp||0)*1000;
  }catch(e){ return 0; }
}
function readSession(){ try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){ return null; } }
function writeSession(s){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
let riderTokenRefresh=null;
async function getAccessToken(){
  const s=readSession();if(!s)return '';
  const rawExp=Number(s.expiresAt||0),exp=rawExp?(rawExp<1e12?rawExp*1000:rawExp):jwtExpiryMs(s.accessToken);
  if(exp-Date.now()>60000||!s.refreshToken)return s.accessToken;
  const key=JSON.stringify([s.authUserId,s.sessionId,s.refreshToken]);if(riderTokenRefresh?.key===key)return riderTokenRefresh.task;
  const sameActor=current=>!!current&&current.authUserId===s.authUserId&&current.sessionId===s.sessionId;
  const task=(async()=>{
    try{
      const r=await fetch(SB.URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:sbHeaders(),body:JSON.stringify({refresh_token:s.refreshToken}),signal:AbortSignal.timeout(15000)});
      const data=await r.json().catch(()=>({}));const current=readSession();if(!sameActor(current))return '';
      if(current.refreshToken!==s.refreshToken)return current.accessToken;
      if(!r.ok||!data.access_token)throw Error('SESSION_REFRESH_FAILED');
      const next={...s,accessToken:data.access_token,refreshToken:data.refresh_token||s.refreshToken,expiresAt:data.expires_at?data.expires_at*1000:jwtExpiryMs(data.access_token)};
      writeSession(next);if(sameActor(S.session))S.session=next;return next.accessToken;
    }catch(e){const current=readSession();if(!sameActor(current))return '';if(current.refreshToken!==s.refreshToken)return current.accessToken;if(exp>Date.now())return s.accessToken;throw e}
  })().finally(()=>{if(riderTokenRefresh?.task===task)riderTokenRefresh=null});riderTokenRefresh={key,task};return task;
}

function esc(v){ return String(v??'').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
function haversineKm(lat1,lon1,lat2,lon2){
  if([lat1,lon1,lat2,lon2].some(v=>!Number.isFinite(Number(v)))) return Infinity;
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function mapsLink(lat,lng,address){
  if(Number.isFinite(Number(lat)) && Number.isFinite(Number(lng))) return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(lat+','+lng);
  return address ? 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(address) : 'https://www.google.com/maps/';
}

/* ---------- ONE ACCOUNT / ONE ACTIVE DEVICE ---------- */
const DEVICE_ID_KEY='qtr_device_id_v1';
const SESSION_GUARD_MS=25000;
let sessionGuardTimer=null;
function getDeviceId(){
  try{let id=localStorage.getItem(DEVICE_ID_KEY);if(!id){id=crypto.randomUUID();localStorage.setItem(DEVICE_ID_KEY,id);}return id;}catch(e){return crypto.randomUUID();}
}
async function sbRpc(fn,body,token){
  const r=await fetch(SB.URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:sbHeaders(token),body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok)throw new Error((data&&data.message)||'RPC_ERROR_'+r.status);
  return data;
}
async function claimActiveSession(sessionId,authUserId,token){
  if(!sessionId||!authUserId||!token)throw new Error('ไม่สามารถยืนยันอุปกรณ์ที่ใช้งานได้');
  const result=await sbRpc('claim_active_session',{p_session_id:sessionId,p_device_id:getDeviceId()},token);
  if(Array.isArray(result)&&result[0]&&result[0].success===false)throw new Error('ไม่สามารถเปิด Session นี้ได้');
  return result;
}
function riderSessionMatches(session){
  const stored=readSession();
  return !!session&&!!stored&&!!S.session&&stored.authUserId===session.authUserId&&stored.sessionId===session.sessionId&&S.session.authUserId===session.authUserId&&S.session.sessionId===session.sessionId;
}
let riderSessionCheck=null;
function checkActiveSession(){
  const session=readSession();
  if(!session?.sessionId||!session.accessToken||!session.authUserId)return Promise.resolve(true);
  const key=JSON.stringify([session.authUserId,session.sessionId]);
  if(riderSessionCheck?.key===key)return riderSessionCheck.task;
  const task=(async()=>{
    try{
      const token=await getAccessToken();if(!riderSessionMatches(session))return false;
      const result=await sbRpc('check_active_session',{p_session_id:session.sessionId},token);
      if(!riderSessionMatches(session))return false;
      const ok=result===true||(Array.isArray(result)&&result[0]===true)||(result&&result.check_active_session===true);
      if(!ok){forceSessionLogout('บัญชีนี้ถูกเข้าสู่ระบบจากอุปกรณ์อื่น');return false}
      await sbRpc('touch_active_session',{p_session_id:session.sessionId},token);
      return riderSessionMatches(session);
    }catch(e){console.warn('Rider session check unavailable');return riderSessionMatches(session)}
  })().finally(()=>{if(riderSessionCheck?.task===task)riderSessionCheck=null});
  riderSessionCheck={key,task};return task;
}
function startSessionGuard(){
  stopSessionGuard();
  sessionGuardTimer=setInterval(()=>{if(S.session&&S.session.sessionId)checkActiveSession();},SESSION_GUARD_MS);
}
function stopSessionGuard(){if(sessionGuardTimer){clearInterval(sessionGuardTimer);sessionGuardTimer=null;}}
function forceSessionLogout(msg){
  stopSessionGuard();stopPolling();stopRiderChatWatch();window.qgClearRiderInbox?.();window.qtStopNewJobAlert?.();
  try{if(S.watchId)navigator.geolocation.clearWatch(S.watchId);}catch(e){}
  clearSession();
  Object.assign(S,{session:null,user:null,riderProfile:null,online:false,activeOrder:null,openJobs:[],history:[],chatOrder:null});
  renderLogin(msg||'เซสชันนี้ถูกยกเลิก');
}
window.addEventListener('focus',()=>{if(S.session&&S.session.sessionId)checkActiveSession();});

/* ---------- boot ---------- */
function boot(){
  const s = readSession();
  if(s){ S.session = s; startSessionGuard(); resumeSession(); }
  else renderLogin();
}
let riderResumeTask=null;
function resumeSession(){
  const session=S.session;if(!session)return Promise.resolve();
  const key=JSON.stringify([session.authUserId,session.sessionId]);
  if(riderResumeTask?.key===key)return riderResumeTask.task;
  const task=(async()=>{
    try{
      if(session.sessionId&&!await checkActiveSession())return;
      if(!riderSessionMatches(session))return;
      const token=await getAccessToken();if(!riderSessionMatches(session))return;
      const rows=await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(session.authUserId),{token});
      if(!riderSessionMatches(session))return;
      const user=Array.isArray(rows)?rows[0]:null;
      if(!user||user.role!=='rider'){forceSessionLogout('บัญชีนี้ไม่ใช่บัญชีไรเดอร์');return}
      S.user=user;
      if(user.status==='suspended'){renderPending(user,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ');return}
      if(user.status!=='active'){renderPending(user,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ');return}
      if(await loadRiderProfile())renderStage();
    }catch(e){
      if(!riderSessionMatches(session))return;
      console.error('Rider session restore failed');
      document.getElementById('app').innerHTML='<div class="screen-center"><div class="pending-card"><h1>เชื่อมต่อไม่ได้</h1><p>บัญชียังอยู่ในเครื่อง กรุณาต่ออินเทอร์เน็ตแล้วลองใหม่</p><button type="button" class="btn btn-brand" id="qg-rider-retry">ลองใหม่</button></div></div>';
      document.getElementById('qg-rider-retry').onclick=()=>resumeSession();
    }
  })().finally(()=>{if(riderResumeTask?.task===task)riderResumeTask=null});
  riderResumeTask={key,task};return task;
}
async function loadRiderProfile(){
  const session=S.session,userId=S.user?.id;if(!userId)return false;
  const current=()=>riderSessionMatches(session)&&S.user?.id===userId;
  const token=await getAccessToken();if(!current())return false;
  const rows=await sbTable('rider_profiles?select=*&user_id=eq.'+encodeURIComponent(userId),{token});
  if(!current())return false;
  S.riderProfile=Array.isArray(rows)&&rows[0]?rows[0]:null;
  S.online=!!S.riderProfile?.metadata?.online;
  try{const cached=JSON.parse(localStorage.getItem(qgRiderHistoryKey())||'null');if(cached&&Date.now()-cached.at<7*86400000&&Array.isArray(cached.history))S.history=cached.history}catch(e){}
  return true;
}

async function compressRiderImage(file,maxSize=1400,quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(im.width,im.height));
        const w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      im.onerror=reject; im.src=reader.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}
const RIDER_DRAFT_DB='qt_rider_draft_v1';
function riderDraftOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(RIDER_DRAFT_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function saveRiderDraftFile(id,data,name){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({data,name,at:Date.now()},id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){console.warn('draft save failed',e);}}
async function loadRiderDraftFile(id){try{const db=await riderDraftOpen();const v=await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});db.close();return v;}catch(e){return null;}}
async function clearRiderDraft(){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){}}
async function riderFilePreview(inputId,previewId){
  const input=document.getElementById(inputId),img=document.getElementById(previewId);
  if(!input||!input.files[0]) return;
  const file=input.files[0];
  if(file.size>8*1024*1024){input.value='';toast('ไฟล์ต้องมีขนาดไม่เกิน 8 MB');return;}
  const nameEl=document.getElementById(inputId+'-name');
  if(nameEl) nameEl.textContent=file.name||'เลือกไฟล์แล้ว';
  try{
    let data='';
    if(file.type.startsWith('image/')){data=await compressRiderImage(file);if(img){img.src=data;img.style.display='block';}}
    else data=await readFileAsDataURL(file);
    await saveRiderDraftFile(inputId,data,file.name||inputId);
    if(inputId==='rr-photo') try{sessionStorage.setItem('qt_rider_profile_draft',JSON.stringify({data,name:file.name||'profile.jpg',at:Date.now()}));}catch(e){}
  }catch(err){console.error(err);toast('ไม่สามารถอ่านไฟล์ได้ กรุณาเลือกไฟล์ใหม่');}
}
function readFileAsDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}

function riderStepGo(step){
  const all=[...document.querySelectorAll('.rider-panel')];
  const target=Math.max(0,Math.min(3,step));
  const groups=[[all[0],all[1]],[all[2],all[3]],[all[4]],[all[5]]];
  all.forEach(p=>p.style.display='none');
  (groups[target]||groups[0]).forEach(p=>{if(p)p.style.display='block';});
  const steps=document.querySelectorAll('.rider-step');steps.forEach((x,i)=>{x.classList.toggle('active',i===target);x.classList.toggle('done',i<target);});
  window.__qtRiderStep=target;
  const submit=document.querySelector('.rider-submit');if(submit)submit.textContent=target===3?'ส่งใบสมัคร  →':'ถัดไป  →';
  const wizard=document.querySelector('.rider-wizard');if(wizard)wizard.scrollIntoView({behavior:'smooth',block:'start'});
}
async function riderStepNext(){
  if(window.__qtRiderAdvancing)return;
  window.__qtRiderAdvancing=true;
  try{
    const s=window.__qtRiderStep||0;
    const f=id=>document.getElementById(id);
    const hasFile=async id=>!!(f(id)?.files?.[0] || (await loadRiderDraftFile(id))?.data);
    if(s===0){
      if(!f('rr-name').value.trim()||!f('rr-phone').value.trim()||!f('rr-password').value){toast('กรุณากรอกข้อมูลส่วนตัวให้ครบ');return;}
      if(!/^0[0-9]{9}$/.test(f('rr-phone').value.replace(/[-\s]/g,''))){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก');return;}
      if(f('rr-password').value.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return;}
      if(f('rr-email').value&&!f('rr-email').checkValidity()){toast('กรุณากรอกอีเมลให้ถูกต้อง');return;}
      if(!(await hasFile('rr-photo'))){toast('กรุณาอัปโหลดรูปถ่ายหน้าตรง');return;}
    }
    if(s===1&&(!f('rr-plate').value.trim()||!f('rr-province').value||!f('rr-district').value.trim())){
      toast('กรุณากรอกทะเบียนรถ จังหวัด และอำเภอ/เขต');return;
    }
    if(s===2){
      for(const id of ['rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo']){
        if(!(await hasFile(id))){toast('กรุณาอัปโหลดเอกสารบังคับให้ครบ');return;}
      }
    }
    if(s<3)riderStepGo(s+1);
    else document.querySelector('form[onsubmit*=handleRiderRegistration]')?.requestSubmit();
  }catch(err){toast('ตรวจข้อมูลสมัครไม่สำเร็จ: '+err.message)}
  finally{window.__qtRiderAdvancing=false;}
}
function riderStepBack(){const s=window.__qtRiderStep||0;if(s>0)riderStepGo(s-1);else renderLogin();}
async function handleRiderRegistration(e){
  e.preventDefault();
  const f=id=>document.getElementById(id);
  const name=String(f('rr-name').value||'').trim(),phone=f('rr-phone').value.trim().replace(/[-\s]/g,''),password=f('rr-password').value;
  const email=String(f('rr-email').value||'').trim().toLowerCase();
  const form={email,area:String(f('rr-area').value||'').trim(),province:f('rr-province').value,district:String(f('rr-district').value||'').trim(),vehicle:f('rr-vehicle').value,plate:String(f('rr-plate').value||'').trim(),make:String(f('rr-make').value||'').trim(),model:String(f('rr-model').value||'').trim(),capacity:Number(f('rr-capacity').value||0)};
  if(!name||!phone||!password){toast('กรุณากรอกข้อมูลส่วนตัวให้ครบ');return false;}
  if(!/^0[0-9]{9}$/.test(phone)){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678');return false;}
  if(password.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return false;}
  if(!f('rr-province').value||!f('rr-district').value){toast('กรุณาเลือกจังหวัดและอำเภอ/เขต');return false;}
  if(form.capacity<0||form.capacity>1000){toast('ความจุรถไม่ถูกต้อง');riderStepGo(1);return false;}
  if(!form.plate){toast('กรุณากรอกทะเบียนรถ');riderStepGo(1);return false;}
  const agree=document.querySelector('.rider-confirm input[type=checkbox]'); const betaAgree=document.getElementById('rr-beta-accept');
  if(!agree||!agree.checked||!betaAgree||!betaAgree.checked){toast('กรุณายืนยันข้อมูลและยอมรับข้อตกลง Beta ก่อนส่งใบสมัคร');riderStepGo(3);return false;}
  const files=['rr-photo','rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo'];const data={};
  for(const id of files){const input=f(id);if(input&&input.files&&input.files[0]){const file=input.files[0];data[id]=file.type.startsWith('image/')?await compressRiderImage(file):await readFileAsDataURL(file);}else{const draft=await loadRiderDraftFile(id);if(draft&&draft.data)data[id]=draft.data;}}
  const requiredDocs=files;const labels={'rr-photo':'รูปถ่ายหน้าตรง','rr-id-front':'บัตรประชาชนด้านหน้า','rr-id-back':'บัตรประชาชนด้านหลัง','rr-license':'ใบขับขี่','rr-prb':'พ.ร.บ. รถ','rr-vehicle-photo':'รูปถ่ายคู่กับรถ'};const missing=requiredDocs.filter(id=>!data[id]);
  if(missing.length){toast('กรุณาอัปโหลด: '+missing.map(x=>labels[x]).join(', '));return false;}
  const submitBtn=e.submitter||document.querySelector('.rider-submit');if(submitBtn)submitBtn.disabled=true;
  try{
    toast('กำลังสร้างบัญชีและส่งใบสมัคร...');
    const authEmail=email||authEmailFromPhone(phone);
    const auth=await sbAuth('signup',{email:authEmail,password,data:{name,phone,role:'rider'}});
    if(!auth.user||!auth.user.id)throw new Error('สร้างบัญชี Supabase Authentication ไม่สำเร็จ');
    let session=auth.session;
    if(!session||!session.access_token){
      try{session=await sbAuth('token?grant_type=password',{email:authEmail,password});}
      catch(err){throw new Error(email?'บัญชีถูกสร้างแล้ว แต่ยังไม่ได้ยืนยันอีเมลใน Supabase':'บัญชี Auth ถูกสร้างแล้ว แต่ Supabase ยังไม่อนุญาตให้เข้าสู่ระบบทันที กรุณาปิด Email Confirmation ใน Supabase Authentication Settings แล้วสมัครใหม่');}
    }
    if(!session||!session.access_token)throw new Error('ไม่สามารถสร้าง Session ของบัญชีได้');
    const existing=await sbTable('users?select=id,auth_user_id,role,name,phone,status,created_at&auth_user_id=eq.'+encodeURIComponent(auth.user.id)+'&limit=1',{token:session.access_token});
    let profile=Array.isArray(existing)&&existing[0]?existing[0]:null;
    if(!profile){
      const created=await sbTable('users?select=id,auth_user_id,role,name,phone,status,created_at',{method:'POST',token:session.access_token,body:{auth_user_id:auth.user.id,role:'rider',name,phone,status:'pending'}});
      profile=Array.isArray(created)&&created[0]?created[0]:created;
    }
    if(!profile||!profile.id||String(profile.auth_user_id)!==String(auth.user.id))throw new Error('สร้างข้อมูลสมาชิกใน public.users ไม่สำเร็จ');
    const metadata=riderRegistrationMetadata(profile,data,form);
    const riderBody={user_id:profile.id,rider_name:name,phone,vehicle_type:form.vehicle,vehicle_plate:form.plate,address:form.area||null,latitude:null,longitude:null,status:'pending',metadata};
    const riderRows=await sbTable('rider_profiles?on_conflict=user_id',{method:'POST',token:session.access_token,body:riderBody});
    if(!riderRows) throw new Error('สร้างโปรไฟล์ไรเดอร์ไม่สำเร็จ');
    const sessionId=crypto.randomUUID();
    await claimActiveSession(sessionId,auth.user.id,session.access_token);
    S.session={authUserId:auth.user.id,accessToken:session.access_token,refreshToken:session.refresh_token||null,expiresAt:auth.expires_at?auth.expires_at*1000:(session.expires_at?session.expires_at*1000:jwtExpiryMs(session.access_token)),sessionId};
    writeSession(S.session);S.user=profile;S.riderProfile=Array.isArray(riderRows)?riderRows[0]:riderRows;S.online=false;
    startSessionGuard();
    await clearRiderDraft();try{sessionStorage.removeItem('qt_rider_profile_draft');sessionStorage.removeItem('qt_rider_register_hash');}catch(err){}
    toast('ส่งใบสมัครสำเร็จ รอ Admin ตรวจสอบ');
    renderPending(profile,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ');
  }catch(err){
    console.error('QueueGo rider registration error',err);
    const m=String(err&&err.message||'');
    toast(/already registered|User already registered|duplicate key/i.test(m)?'สมัครไม่สำเร็จ: เบอร์หรืออีเมลนี้ถูกใช้สมัครแล้ว':m||'สมัครสมาชิกไม่สำเร็จ');
  }finally{if(submitBtn)submitBtn.disabled=false;}
  return false;
}

async function doLogin(){
  const btn = document.getElementById('li-btn');
  if(!btn||btn.disabled)return;
  const current=()=>btn.isConnected&&document.getElementById('li-btn')===btn;
  const errBox = document.getElementById('li-err');
  const phone = document.getElementById('li-phone').value.trim();
  const pass = document.getElementById('li-pass').value;
  errBox.classList.remove('show');
  if(!phone || !pass){ errBox.textContent='กรุณากรอกอีเมลหรือเบอร์โทรและรหัสผ่าน'; errBox.classList.add('show'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try{
    const email = phone.includes('@') ? phone : authEmailFromPhone(phone);
    const auth = await sbAuth('token?grant_type=password', {email, password:pass});
    if(!current())return;
    const rows = await sbTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(auth.user.id), {token:auth.access_token});
    if(!current())return;
    const u = Array.isArray(rows) ? rows[0] : null;
    if(!u || u.role!=='rider'){ throw new Error('บัญชีนี้ไม่ใช่บัญชีไรเดอร์'); }
    const sessionId=crypto.randomUUID();
    await claimActiveSession(sessionId,auth.user.id,auth.access_token);
    if(!current())return;
    S.session = {authUserId:auth.user.id, accessToken:auth.access_token, refreshToken:auth.refresh_token||null, expiresAt:auth.expires_at?auth.expires_at*1000:jwtExpiryMs(auth.access_token), sessionId};
    writeSession(S.session);
    startSessionGuard();
    S.user = u;
    if(u.status==='suspended'){ renderPending(u,'บัญชีถูกระงับการใช้งาน กรุณาติดต่อผู้ดูแลระบบ'); return; }
    if(u.status!=='active'){ renderPending(u,'ใบสมัครของคุณอยู่ระหว่างตรวจสอบ'); return; }
    if(await loadRiderProfile())renderStage();
  }catch(e){
    console.error(e);
    errBox.textContent = /invalid/i.test(e.message) ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง หากสมัครด้วยอีเมลให้ใช้อีเมลนั้นเข้าสู่ระบบ' : e.message;
    errBox.classList.add('show');
  }finally{ btn.disabled=false; btn.textContent='เข้าสู่ระบบ'; }
}

async function toggleOnline(){

    const token = await getAccessToken();
    const meta = Object.assign({}, (S.riderProfile&&S.riderProfile.metadata)||{}, {online:next});
    const body = {user_id:S.user.id, rider_name:S.user.name||'ไรเดอร์', phone:S.user.phone||null,
      vehicle_type:(S.riderProfile&&S.riderProfile.vehicle_type)||null, vehicle_plate:(S.riderProfile&&S.riderProfile.vehicle_plate)||null,

let riderRefreshTask=null,riderRefreshQueued=false;
function refreshData(background=false){
  if(!S.user||!S.riderProfile||!navigator.onLine||(background&&document.hidden))return Promise.resolve();
  if(riderRefreshTask){if(!background)riderRefreshQueued=true;return riderRefreshTask}
  const task=(async()=>{do{riderRefreshQueued=false;await readRiderSnapshot()}while(riderRefreshQueued&&S.user&&S.riderProfile&&navigator.onLine)})().finally(()=>{if(riderRefreshTask===task)riderRefreshTask=null});
  riderRefreshTask=task;return task;
}
async function readRiderSnapshot(){
  const userId=S.user.id,profileId=S.riderProfile.id,sessionId=S.session?.sessionId,online=S.online;
  const current=()=>S.user?.id===userId&&S.riderProfile?.id===profileId&&S.session?.sessionId===sessionId&&S.online===online;
  try{
    const token=await getAccessToken();if(!current())return;if(!token)throw Error('Session unavailable');
    const mine=await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(profileId)+'&status=in.(rider_assigned,preparing,ready,assigned,picked_up,in_progress)&order=created_at.desc&limit=1',{token});if(!current())return;
    const activeOrder=Array.isArray(mine)&&mine[0]?mine[0]:null;let openJobs=[];
    const previousOpenJobIds=new Set((S.openJobs||[]).map(x=>x?.order?.id).filter(Boolean).map(String));
    if(activeOrder){
      if(['market','grocery'].includes(activeOrder.fulfillment_vertical)){const weights=await sbRpc('market_rider_job_weights',{},token);if(!current())return;activeOrder._marketWeight=(weights||[]).find(x=>x.order_id===activeOrder.id)?.weight_kg}
      await enrichRiderOrders([activeOrder],token);if(!current())return;
    }else if(online){
      const eligible=await sbRpc('get_rider_delivery_pool',{},token);if(!current())return;
      const ids=(Array.isArray(eligible)?eligible:[]).map(x=>x.order_id).filter(Boolean);
      const open=ids.length?await sbTable('orders?select=*&id=in.('+ids.join(',')+')&order=created_at.asc&limit=25',{token}):[];if(!current())return;
      const list=Array.isArray(open)?open:[];
      if(list.some(o=>['market','grocery'].includes(o.fulfillment_vertical))){const weights=await sbRpc('market_rider_job_weights',{},token);if(!current())return;for(const o of list)o._marketWeight=(weights||[]).find(x=>x.order_id===o.id)?.weight_kg}
      await enrichRiderOrders(list,token);if(!current())return;
      const candidates=list.map(o=>({order:o,distanceKm:haversineKm(S.pos?.lat,S.pos?.lng,o.pickup_latitude,o.pickup_longitude)})).filter(x=>Number.isFinite(x.distanceKm)).sort((a,b)=>a.distanceKm-b.distanceKm);
      const nearby=candidates.filter(x=>x.distanceKm<=NEARBY_RADIUS_KM);
      // Server eligibility/claim remains authoritative; display the nearest eligible job when none is within 2 km.
      openJobs=nearby.length?nearby:candidates.slice(0,1);
    }
    if(!current())return;S.activeOrder=activeOrder;S.openJobs=openJobs;
    window.qtCheckNewJobs?.(previousOpenJobIds,openJobs.map(x=>x.order));if(S.activeTab==='home')renderSheet();placeJobMarkers();
    const hist=await sbTable('orders?select=*&order_type=eq.shopping&rider_id=eq.'+encodeURIComponent(profileId)+'&status=eq.completed&order=updated_at.desc&limit=200',{token});if(!current())return;
    S.history=Array.isArray(hist)?hist:[];if(S.activeTab==='jobs')renderHistoryPanel();
    try{const k=qgRiderHistoryKey(),history=S.history.slice(0,100);if(k){const json=JSON.stringify({at:Date.now(),history});if(json.length<800000)localStorage.setItem(k,json)}}catch(e){}
    if(S.activeTab==='chat'&&!S.chatOrder)qgRenderMessageInbox();qgWatchCompletedChat();
  }catch(e){if(!current())return;console.error('Rider job refresh failed');const now=Date.now();if(!refreshData.lastErrorAt||now-refreshData.lastErrorAt>30000){refreshData.lastErrorAt=now;toast('โหลดงานไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองใหม่')}}
}
async function enrichRiderOrders(orders,token){
  const shops=[...new Set(orders.filter(o=>o.shop_id&&!o._shop).map(o=>o.shop_id))],customers=[...new Set(orders.filter(o=>o.customer_id&&!o._customer).map(o=>o.customer_id))];
  const [shopRows,customerRows]=await Promise.all([
    shops.length?sbTable('shop_profiles?select=id,shop_name,phone,address&id=in.('+shops.map(encodeURIComponent).join(',')+')',{token}).catch(()=>[]):[],
    customers.length?sbTable('users?select=id,name,phone&id=in.('+customers.map(encodeURIComponent).join(',')+')',{token}).catch(()=>[]):[]
  ]);
  const shopById=new Map((shopRows||[]).map(x=>[x.id,x])),customerById=new Map((customerRows||[]).map(x=>[x.id,x]));
  for(const o of orders){if(o.shop_id&&!o._shop)o._shop=shopById.get(o.shop_id)||null;if(o.customer_id&&!o._customer)o._customer=customerById.get(o.customer_id)||null}
}
function qgRemoveOverlay(o){if(o&&S.map){try{S.map.Overlays.remove(o)}catch(e){}}}
function qgMarker(loc,html,title){
  return new longdo.Marker(loc,{title:title||'',icon:{html:'<div style="transform:translate(-50%,-50%)">'+html+'</div>',offset:{x:0,y:0}},weight:longdo.OverlayWeight.Top});
}
function placeJobMarkers(){
  if(!S.map||typeof longdo==='undefined')return;
  (S.jobMarkers||[]).forEach(qgRemoveOverlay);S.jobMarkers=[];
  const list=S.activeOrder?[S.activeOrder]:S.openJobs.map(x=>x.order);
  list.forEach(o=>{
    const plat=Number(o.pickup_latitude),plng=Number(o.pickup_longitude),dlat=Number(o.delivery_latitude),dlng=Number(o.delivery_longitude);
    if(Number.isFinite(plat)&&Number.isFinite(plng)){const m=qgMarker({lat:plat,lon:plng},'<div style="width:20px;height:20px;border-radius:50%;background:#16a34a;border:4px solid #fff;box-shadow:0 2px 8px #0004"></div>','จุดรับ · '+(o.pickup_address||'ร้านค้า'));S.map.Overlays.add(m);S.jobMarkers.push(m)}
    if(Number.isFinite(dlat)&&Number.isFinite(dlng)){const m=qgMarker({lat:dlat,lon:dlng},'<div style="width:20px;height:20px;border-radius:50%;background:#e6002d;border:4px solid #fff;box-shadow:0 2px 8px #0004"></div>','จุดส่ง · '+(o.delivery_address||'บ้านลูกค้า'));S.map.Overlays.add(m);S.jobMarkers.push(m)}
  });
  drawActiveRoute();
}
async function drawActiveRoute(){
  if(!S.map)return;
  (S.routeOverlays||[]).forEach(qgRemoveOverlay);S.routeOverlays=[];S.routeLine=null;
  const badge=document.getElementById('route-badge'),txt=document.getElementById('route-text');
  if(!S.activeOrder||!S.pos){if(badge)badge.style.display='none';return}
  const o=S.activeOrder,st=statusFromRow(o),toShop=['rider_assigned','preparing','ready','assigned'].includes(st);
  const lat=Number(toShop?o.pickup_latitude:o.delivery_latitude),lon=Number(toShop?o.pickup_longitude:o.delivery_longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lon)){if(badge)badge.style.display='none';return}
  if(badge)badge.style.display='block';if(txt)txt.textContent=(toShop?'ไปร้าน':'ไปหาลูกค้า')+' • กำลังคำนวณเส้นทาง';
  const seq=++longdoRouteSeq;
  try{
    const url='https://api.longdo.com/RouteService/geojson/route?flon='+encodeURIComponent(S.pos.lng)+'&flat='+encodeURIComponent(S.pos.lat)+'&tlon='+encodeURIComponent(lon)+'&tlat='+encodeURIComponent(lat)+'&type=1&key='+encodeURIComponent(LONGDO_API_KEY);
    const res=await fetch(url);if(!res.ok)throw Error('route '+res.status);const geo=await res.json();if(seq!==longdoRouteSeq)return;
    let dist=0,time=0;
    for(const f of (geo.features||[])){
      const p=f.properties||{};dist+=Number(p.distance)||0;time+=Number(p.interval)||0;
      const g=f.geometry||{},parts=g.type==='LineString'?[g.coordinates]:g.type==='MultiLineString'?g.coordinates:[];
      for(const coords of parts){const locs=(coords||[]).map(x=>({lon:Number(x[0]),lat:Number(x[1])})).filter(x=>Number.isFinite(x.lon)&&Number.isFinite(x.lat));if(locs.length>1){const line=new longdo.Polyline(locs,{lineColor:'#e6002d',lineWidth:6});S.map.Overlays.add(line);S.routeOverlays.push(line)}}
    }
    const km=dist>0?dist/1000:haversineKm(S.pos.lat,S.pos.lng,lat,lon),mins=time>0?Math.max(1,Math.ceil(time/60)):null;
    if(txt)txt.textContent=(toShop?'ไปร้าน • ':'ไปหาลูกค้า • ')+(Number.isFinite(km)?km.toFixed(1)+' กม.':'')+(mins?' • '+mins+' นาที':'');
  }catch(e){
    const km=haversineKm(S.pos.lat,S.pos.lng,lat,lon);if(txt)txt.textContent=(toShop?'ไปร้าน • ':'ไปหาลูกค้า • ')+(Number.isFinite(km)?km.toFixed(1)+' กม.':'')+' • เส้นทางชั่วคราว';
  }
}

let riderChatSend=null;
async function sendRiderChat(o,override){
  const session=S.session,userId=S.user?.id,screen=document.getElementById('chat-screen'),input=document.getElementById('chat-input');
  const current=()=>riderSessionMatches(session)&&S.user?.id===userId&&S.chatOrder?.id===o?.id&&screen?.isConnected;
  const message=override||(input?.value||'').trim();if(!message||!current())return;
  const key=JSON.stringify([session.authUserId,session.sessionId,o.id]);if(riderChatSend?.key===key)return;
  const sending={key};riderChatSend=sending;
  const buttons=[...screen.querySelectorAll('button[type="submit"],.quick-chip')];buttons.forEach(b=>b.disabled=true);
  try{
    const token=await getAccessToken();if(!current())return;
    if(o.status==='completed'){
      const [deliveries,rows]=await Promise.all([
        sbTable('deliveries?select=delivered_at&order_id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token}),
        loadChatMessages(o.id,token)
      ]);if(!current())return;
      const at=deliveries?.[0]?.delivered_at;
      if(!at||!rows.some(m=>String(m.sender_id)===String(o.customer_id)&&new Date(m.created_at)>new Date(at))){toast('หลังจบงาน รอลูกค้าส่งข้อความมาก่อน');return}
    }
    await sbTable('order_chat_messages',{method:'POST',token,body:{order_id:o.id,sender_id:userId,message}});
    if(!current())return;
    if(input&&!override&&input.value.trim()===message)input.value='';
    await refreshRiderChat();
  }catch(e){if(current())toast('ส่งข้อความไม่สำเร็จ กรุณาตรวจการเชื่อมต่อและข้อความล่าสุดก่อนลองอีกครั้ง')}
  finally{if(riderChatSend===sending)riderChatSend=null;buttons.forEach(b=>{if(b.isConnected)b.disabled=false})}
}

function riderEarning(o){

  return Number(o.delivery_fee ?? o.rider_fee ?? 0) || 0;
}

/* v6 dynamic viewport lock for iOS Safari / Android browser chrome / keyboard */
(function(){
  const root=document.documentElement;
  function lockViewport(){
    const vv=window.visualViewport;
    const h=vv?vv.height:window.innerHeight;
    const w=vv?vv.width:window.innerWidth;
    root.style.setProperty('--qt-real-h',h+'px');
    root.style.setProperty('--qt-real-w',w+'px');
    root.style.height=h+'px';
    document.body.style.height=h+'px';
  }
  lockViewport();
  addEventListener('resize',lockViewport,{passive:true});
  addEventListener('orientationchange',()=>setTimeout(lockViewport,120),{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',lockViewport,{passive:true});
    visualViewport.addEventListener('scroll',lockViewport,{passive:true});
  }
})();

(function(){
  let audioCtx=null, repeatTimer=null, alertJobId=null, alertJob=null, alertBusy=false;
  function ctx(){try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}return audioCtx;}catch(e){return null;}}
  function unlockAudio(){try{const c=ctx();if(c&&c.state==='suspended')c.resume().catch(()=>{});}catch(e){}}
  function beep(){try{const c=ctx();if(!c)return;if(c.state==='suspended')c.resume().catch(()=>{});const now=c.currentTime;[880,1175].forEach((freq,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.0001,now+i*.13);g.gain.exponentialRampToValueAtTime(.20,now+i*.13+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.13+.30);o.connect(g);g.connect(c.destination);o.start(now+i*.13);o.stop(now+i*.13+.31);});}catch(e){}}
  function speak(){try{if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('มีออเดอร์ใหม่เข้ามา กรุณาตรวจสอบและรับออเดอร์');u.lang='th-TH';u.rate=.92;u.pitch=1;u.volume=1;window.speechSynthesis.speak(u);}catch(e){}}
  function vibrate(){try{if(navigator.vibrate)navigator.vibrate([450,180,450,180,750]);}catch(e){}}
  function ensureUI(){
    let el=document.getElementById('qt-new-order-alert');if(el)return el;
    el=document.createElement('div');el.id='qt-new-order-alert';el.className='qt-alert-backdrop';el.setAttribute('role','alertdialog');el.setAttribute('aria-modal','true');
    el.innerHTML='<div class="qt-alert-card"><div class="qt-alert-icon">🔔</div><div class="qt-alert-title">มีออเดอร์ใหม่</div><div class="qt-alert-sub">มีงานใหม่เข้ามาสำหรับไรเดอร์</div><div class="qt-alert-order"><b id="qt-alert-order-no">ออเดอร์ใหม่</b><span id="qt-alert-order-detail">กรุณากดรับทราบเพื่อดูรายละเอียดออเดอร์</span></div><button type="button" class="qt-alert-btn" id="qt-alert-ack">รับทราบ</button></div>';
    document.body.appendChild(el);document.getElementById('qt-alert-ack').addEventListener('click',acknowledge);return el;
  }
  function show(job){
    if(!job||!job.id)return;const id=String(job.id);if(alertJobId===id)return;alertJobId=id;alertJob=job;const el=ensureUI();
    const no=document.getElementById('qt-alert-order-no'),detail=document.getElementById('qt-alert-order-detail');
    if(no)no.textContent='ออเดอร์ '+(job.order_number||id.slice(0,8));
    if(detail){const shop=(job._shop&&job._shop.shop_name)||'ร้านค้า';detail.textContent=shop+' • '+(job.pickup_address||'จุดรับสินค้า');}
    el.classList.add('show');document.body.style.overflow='hidden';unlockAudio();beep();speak();vibrate();
    clearInterval(repeatTimer);repeatTimer=setInterval(()=>{if(alertJobId){beep();speak();vibrate();}},7000);S.newJobAlert={active:true,jobId:id};
  }
  function acknowledge(){
    if(alertBusy)return;alertBusy=true;clearInterval(repeatTimer);repeatTimer=null;try{if(navigator.vibrate)navigator.vibrate(0);}catch(e){}try{if('speechSynthesis'in window)window.speechSynthesis.cancel();}catch(e){}
    alertJobId=null;alertJob=null;S.newJobAlert={active:false,jobId:null};const el=document.getElementById('qt-new-order-alert');if(el)el.classList.remove('show');document.body.style.overflow='';alertBusy=false;
  }
  function checkNewJobs(previousIds,jobs){if(!S.online||S.activeOrder)return;const fresh=jobs.find(o=>o&&o.id&&!previousIds.has(String(o.id)));if(fresh)show(fresh);}
  ['click','touchstart','pointerdown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
  window.qtStartNewJobAlert=show;window.qtCheckNewJobs=checkNewJobs;window.qtStopNewJobAlert=acknowledge;
})();


function qtShortOrder(o){
  const raw=String((o&&o.order_number)||(o&&o.id)||'')
    .replace(/^QT[-_\s]*/i,'')
    .replace(/[^A-Za-z0-9]/g,'');
  return 'QT-' + (raw.slice(-4)||'----').toUpperCase();
}

function closeChat(){
 S.chatOrder=null;
 const screen=document.getElementById('chat-screen');if(screen)screen.remove();

async function openChat(o){
 document.getElementById('chat-screen')?.remove();
 S.chatOrder=o;const stage=document.querySelector('.stage');if(stage)stage.style.display='none';
 let screen=document.createElement('section');screen.id='chat-screen';screen.className='qt-chatpage show';document.getElementById('app').appendChild(screen);
 const cust=o._customer||{};screen.innerHTML=`<header class="qt-subhead"><button class="qt-back" id="chat-back" aria-label="ย้อนกลับ">${QTICON.back}</button><div class="qt-subtitle"><b>${esc(cust.name||'ลูกค้า')}</b><small>ออเดอร์ #${esc(qtShortOrder(o))}</small></div><div></div></header><div class="chat-box" id="chat-box"><div class="empty-note">กำลังโหลดข้อความ...</div></div>${quickMessagesHTML()}<form class="chat-compose-rider" id="chat-form"><button class="photo-btn" type="button" id="chat-photo" aria-label="ส่งรูป"></button><input type="file" id="chat-photo-input" accept="image/*" hidden><input id="chat-input" maxlength="500" autocomplete="off" placeholder="ข้อความ..." required><button type="submit" aria-label="ส่ง">↑</button></form>`;
 document.getElementById('chat-back').onclick=closeChat;
 document.getElementById('chat-form').onsubmit=async e=>{e.preventDefault();await sendRiderChat(o)};
 document.getElementById('chat-photo').onclick=()=>document.getElementById('chat-photo-input').click();

 bindQuickMessages(o);await refreshRiderChat();
 qtUnread=0;qtBadge();
}
function renderPaymentSummary(o,completed=false){
 const stage=document.querySelector('.stage');if(stage)stage.style.display='none';
 let s=document.getElementById('summary-screen');if(s)s.remove();s=document.createElement('section');s.id='summary-screen';s.className='qt-summary show';document.getElementById('app').appendChild(s);
 s.innerHTML=`<button class="qt-back qt-summaryback" id="summary-back">${QTICON.back}</button><div class="qt-summarycard"><div class="qt-check">${completed?'✓':'฿'}</div><h2>${completed?'ส่งสำเร็จ':'ตรวจสอบยอดก่อนจบงาน'}</h2><p class="qt-sub">#${esc(qtShortOrder(o))}</p><div class="qt-total">฿${Number(o.total_amount||0).toLocaleString('th-TH')}</div><p class="qt-sub">${completed?'งานนี้ถูกปิดเรียบร้อยแล้ว':'ตรวจสอบยอดกับลูกค้าก่อนยืนยันจบงาน'}</p>${completed?'<button class="qt-primary" id="summary-home">กลับหน้าหลัก</button>':'<button class="qt-primary" id="finish-order-btn">ยืนยันส่งสำเร็จ</button>'}</div>`;
 const back=()=>{s.remove();if(stage)stage.style.display='block';renderSheet();startPolling()};
 document.getElementById('summary-back').onclick=back;
 if(completed)document.getElementById('summary-home').onclick=()=>{S.activeOrder=null;back();refreshData()};
 else document.getElementById('finish-order-btn').onclick=()=>finishOrder(o);

if(completed)return;const card=document.querySelector('#summary-screen .qt-summarycard');if(card&&!card.querySelector('#qg-v22-delivery-photo')){const label=document.createElement('label');label.className='qg-v22-photo-label';label.textContent='รูปหลักฐานการส่งมอบ (ถ้ามี)';const input=document.createElement('input');input.id='qg-v22-delivery-photo';input.type='file';input.accept='image/jpeg,image/png,image/webp';label.appendChild(input);card.insertBefore(label,card.querySelector('#finish-order-btn'))}
}
function qtBadge(){const b=document.getElementById('qt-badge');if(!b)return;b.textContent=qtUnread>9?'9+':qtUnread;b.style.display=qtUnread?'block':'none'
const el=document.getElementById('qt-badge');if(el&&qgCompletedUnread()){el.textContent=String(Math.min(9,qtUnread+qgCompletedUnread()))+(qtUnread+qgCompletedUnread()>9?'+':'');el.style.display='block'}
}
function qtShowMessage(t){const box=document.getElementById('qt-message'),tx=document.getElementById('qt-message-text');if(!box)return;if(tx)tx.textContent=t||'ลูกค้าส่งข้อความถึงคุณ';box.classList.add('show');clearTimeout(qtMsgTimer);qtMsgTimer=setTimeout(()=>box.classList.remove('show'),3800)}
let riderChatRead=null,riderChatQueued=false,qtLastChatScope=null;
function refreshRiderChat(background=false){
  if(!S.user||!navigator.onLine||document.hidden)return Promise.resolve();
  if(riderChatRead){if(!background)riderChatQueued=true;return riderChatRead}
  const task=(async()=>{do{riderChatQueued=false;await readRiderChat()}while(riderChatQueued&&S.user&&navigator.onLine&&!document.hidden)})().finally(()=>{if(riderChatRead===task)riderChatRead=null});
  riderChatRead=task;return task;
}
async function readRiderChat(){
  const order=S.chatOrder||S.activeOrder;if(!order||!S.user)return;
  const session=S.session,userId=S.user.id,chat=!!S.chatOrder,screen=document.getElementById('chat-screen');
  const current=()=>riderSessionMatches(session)&&S.user?.id===userId&&(chat?S.chatOrder?.id===order.id&&screen?.isConnected:!S.chatOrder&&S.activeOrder?.id===order.id);
  try{
    const token=await getAccessToken();if(!current())return;
    const rows=await loadChatMessages(order.id,token);if(!current())return;
    if(chat){
      const box=screen.querySelector('#chat-box'),signature=JSON.stringify(rows);
      if(box&&box.dataset.messages!==signature){const top=box.scrollTop,stick=!box.dataset.messages||box.scrollHeight-box.clientHeight-top<80;renderChatMessages(rows);if(!stick)box.scrollTop=top;box.dataset.messages=signature}
      qtUnread=0;qtBadge();
    }
    const scope=JSON.stringify([userId,session.sessionId,order.id]),last=rows[rows.length-1];
    if(qtLastChatScope!==scope){qtLastChatScope=scope;qtLastMsg=last?.id||null;return}
    if(last&&last.id!==qtLastMsg){qtLastMsg=last.id;if(!chat&&String(last.sender_id)!==String(userId)){qtUnread++;qtBadge();qtShowMessage(String(last.message||'ข้อความใหม่').startsWith('__IMG__')?'ส่งรูปภาพ':last.message)}}
  }catch(e){if(current()&&chat){const box=screen.querySelector('#chat-box');if(box&&!box.dataset.messages)box.textContent='โหลดข้อความไม่สำเร็จ ระบบจะลองใหม่เมื่อเชื่อมต่อได้'}}
}
function stopRiderChatWatch(){
  if(window.qtMessagePoll)clearInterval(window.qtMessagePoll);window.qtMessagePoll=null;riderChatQueued=false;qtLastChatScope=null;qtLastMsg=null;qtUnread=0;
}
function qtStartMessageWatch(){
  stopRiderChatWatch();window.qtMessagePoll=setInterval(()=>refreshRiderChat(true),4000);
}

boot();

/* Cash order transitions use server transactions so the merchant receipt and COD payment stay consistent. */
window.statusFromRow=function(row){
  if(row.status==='in_progress') return /^__QT_ORDER_STATUS__=arrived(?:\n|$)/.test(row.note||'')?'arrived':'delivering';
  return {ready:'ready',assigned:'assigned',picked_up:'picked_up',completed:'completed'}[row.status]||row.status;
};

window.acceptJob=async function(orderId){
   let token,rows;try{token=await getAccessToken();rows=await sbTable('orders?select=id,market_order_id&order_type=eq.shopping&id=eq.'+encodeURIComponent(orderId)+'&limit=1',{token})}catch(e){toast('ตรวจสอบงานไม่สำเร็จ: '+e.message);return}
   const o=rows?.[0];if(o?.market_order_id){
   const btn=document.getElementById('accept-'+orderId);if(btn)btn.disabled=true;
   try{await sbTable('rpc/market_rider_claim_group',{method:'POST',token,body:{p_order_id:orderId}});toast('รับงานตลาดหลายร้านสำเร็จ');await refreshData()}catch(e){toast('รับงานไม่สำเร็จ: '+e.message);if(btn)btn.disabled=false}
 return;}

  const btn=document.getElementById('accept-'+orderId);if(btn)btn.disabled=true;
  try{const token=await getAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
    await sbTable('rpc/rider_claim_order',{method:'POST',token,body:{p_order_id:orderId}});
    toast('รับงานสำเร็จ');await refreshData();
  }catch(e){toast('รับงานไม่สำเร็จ: '+e.message);if(btn)btn.disabled=false;}
};
window.advanceOrder=async function(o){
   if(o?.market_order_id){
   const st=statusFromRow(o);try{const token=await getAccessToken();
     if(st==='assigned'||st==='ready'){toast('กรุณารับของและยืนยันยอดเงินให้ครบทุกจุด');return}
     if(st==='picked_up'){await sbTable('rpc/market_rider_group_action',{method:'POST',token,body:{p_market_order_id:o.market_order_id,p_action:'deliver'}});toast('รับของครบแล้ว กำลังไปส่งลูกค้า');await refreshData();return}
     if(st==='delivering'){await sbTable('rpc/market_rider_group_action',{method:'POST',token,body:{p_market_order_id:o.market_order_id,p_action:'arrive'}});toast('ถึงจุดส่งแล้ว');await refreshData();return}
   }catch(e){toast('อัปเดตงานตลาดไม่สำเร็จ: '+e.message)}
 return;}

  const st=statusFromRow(o),action={ready:'pickup_cash',picked_up:'deliver',delivering:'arrive'}[st];
  if(!action)return;
  try{
    const token=await getAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
    if(action==='pickup_cash'){
      const rows=await sbTable('orders?select=subtotal,status&id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token});
      if(rows?.[0]?.status!=='ready')throw Error('สถานะงานเปลี่ยนแล้ว กรุณาโหลดใหม่');
      if(!confirm('ยืนยันว่าจ่ายเงินสดให้ร้าน ฿'+Number(rows[0].subtotal).toLocaleString('th-TH')+' และรับสินค้าแล้ว?'))return;
    }
    await sbTable('rpc/rider_order_action',{method:'POST',token,body:{p_order_id:o.id,p_action:action}});
    toast(action==='pickup_cash'?'บันทึกเงินสดที่จ่ายให้ร้านแล้ว':'อัปเดตสถานะแล้ว');await refreshData();
  }catch(e){toast('อัปเดตไม่สำเร็จ: '+e.message);}
};

<script id="qg-rider-v21-integration">
(function(){
 const key=()=>S.user?.id?'qg-rider-history-v21:'+S.user.id:null;
 const seenKey=()=>S.user?.id?'qg-rider-chat-seen-v21:'+S.user.id:null;
 let completedUnread=0,inboxRead=null,inboxSnapshot=null;
 window.qgRiderHistoryKey=key;
 window.qgCompletedUnread=()=>completedUnread;
 window.qgMarkInboxSeen=markInboxSeen;
 window.qgWatchCompletedChat=watchCompletedChat;
 window.qgClearRiderInbox=()=>{completedUnread=0;inboxSnapshot=null};
 function markInboxSeen(){const k=seenKey();if(k)try{localStorage.setItem(k,String(Date.now()))}catch(e){}completedUnread=0;qtBadge()}
 function readInbox(){
   if(!S.user||!navigator.onLine||document.hidden)return Promise.resolve(null);
   const session=S.session,userId=S.user.id;
   const orders=[...new Map([S.activeOrder,...(S.history||[])].filter(Boolean).map(o=>[o.id,{...o}])).values()].slice(0,100);
   const scope=JSON.stringify([session?.authUserId,session?.sessionId,userId,orders.map(o=>[o.id,o.status,o.updated_at])]);
   const current=()=>riderSessionMatches(session)&&S.user?.id===userId;
   if(inboxSnapshot?.scope===scope&&Date.now()-inboxSnapshot.at<5000)return Promise.resolve(inboxSnapshot.data);
   if(inboxRead?.scope===scope)return inboxRead.task;
   const task=(async()=>{
     const ids=orders.map(o=>o.id),token=await getAccessToken();if(!current())return null;
     const [messages,deliveries]=ids.length?await Promise.all([
       sbTable('order_chat_messages?select=order_id,sender_id,message,created_at&order_id=in.('+ids.join(',')+')&order=created_at.desc&limit=500',{token}),
       sbTable('deliveries?select=order_id,delivered_at&order_id=in.('+ids.join(',')+')',{token})]):[[],[]];
     if(!current())return null;
     const data={orders,messages:messages||[],deliveries:deliveries||[],current};inboxSnapshot={scope,at:Date.now(),data};return data;
   })().finally(()=>{if(inboxRead?.task===task)inboxRead=null});inboxRead={scope,task};return task;
 }
 async function watchCompletedChat(){
   try{
     const data=await readInbox();if(!data||!data.current())return;
     const byOrder=new Map(data.orders.filter(o=>o.status==='completed').map(o=>[String(o.id),o]));
     const delivered=new Map(data.deliveries.map(d=>[String(d.order_id),Date.parse(d.delivered_at)]));
     const seen=Number(localStorage.getItem(seenKey())||0);
     completedUnread=data.messages.filter(m=>{const o=byOrder.get(String(m.order_id)),time=Date.parse(m.created_at),at=delivered.get(String(m.order_id));return o&&String(m.sender_id)===String(o.customer_id)&&Number.isFinite(at)&&time>at&&time>seen}).length;
     if(S.activeTab==='chat')markInboxSeen();else qtBadge();
   }catch(e){console.warn('Rider inbox refresh unavailable')}
 }

 window.qgOpenInboxChat=function(id){const o=[S.activeOrder,...(S.history||[])].filter(Boolean).find(x=>String(x.id)===String(id));if(o){document.getElementById('qg-rider-inbox')?.remove();openChat(o)}};
 window.qgRenderMessageInbox=async function(){
   if(S.activeTab!=='chat'||S.chatOrder||!S.user)return;
   const stage=document.querySelector('.stage');if(!stage)return;
   let box=document.getElementById('qg-rider-inbox');if(!box){box=document.createElement('section');box.id='qg-rider-inbox';box.className='qg-inbox';box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">กำลังโหลดข้อความ...</div>';stage.appendChild(box)}
   const request={};box._request=request;
   const current=()=>box.isConnected&&box._request===request&&S.activeTab==='chat'&&!S.chatOrder;
   try{
     const data=await readInbox();if(!data||!data.current()||!current())return;
     const delivered=new Map(data.deliveries.map(x=>[String(x.order_id),x.delivered_at]));
     const rows=data.orders.map(o=>{const messages=data.messages.filter(m=>String(m.order_id)===String(o.id)),at=delivered.get(String(o.id));return{o,last:messages[0],initiated:o.status!=='completed'||Boolean(at&&messages.some(m=>String(m.sender_id)===String(o.customer_id)&&new Date(m.created_at)>new Date(at)))}}).filter(x=>x.initiated).sort((a,b)=>new Date(b.last?.created_at||b.o.updated_at)-new Date(a.last?.created_at||a.o.updated_at));
     box.innerHTML='<h2>ข้อความ</h2>'+(rows.length?rows.map(({o,last})=>'<button class="qg-inbox-item" type="button" onclick="qgOpenInboxChat(\''+esc(o.id)+'\')"><strong>ออเดอร์ '+esc(qtShortOrder(o))+'</strong><small>'+esc(last?(String(last.message).startsWith('__IMG__')?'รูปภาพ':String(last.message).slice(0,85)):'เปิดแชตระหว่างจัดส่ง')+'</small></button>').join(''):'<div class="qg-inbox-empty">ยังไม่มีการสนทนา</div>');
   }catch(e){if(current()){box.innerHTML='<h2>ข้อความ</h2><div class="qg-inbox-empty">โหลดข้อความไม่สำเร็จ <button type="button">ลองใหม่</button></div>';box.querySelector('button').onclick=()=>qgRenderMessageInbox()}}
 };
 setInterval(()=>{watchCompletedChat();if(S.activeTab==='chat'&&!S.chatOrder)qgRenderMessageInbox()},15000);
})();
</script>
<script id="qg-v22-ticket-client">
(function(){
 const rider=typeof S!=='undefined'&&typeof sbTable==='function';
 const escText=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const token=()=>rider?getAccessToken():qtGetAccessToken();
 const request=async(path,method='GET',body=null)=>{const t=await token();if(!t)throw Error('กรุณาเข้าสู่ระบบ');return rider?sbTable(path,{method,token:t,body}):qtSupabaseTable(path,{method,accessToken:t,body})};
 const config=()=>rider?{url:SB.URL,key:SB.KEY}:{url:QT_SUPABASE_CONFIG.URL,key:QT_SUPABASE_CONFIG.KEY};
 const authSub=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}};
 const names={missing_item:'สินค้าไม่ครบ',wrong_item:'สินค้าไม่ตรง',damaged_food:'อาหารเสียหาย',rider:'ปัญหาไรเดอร์',merchant:'ปัญหาร้านค้า',payment:'การชำระเงิน',cash:'เงินสด',gp:'GP',other:'อื่น ๆ'};
 async function upload(file){if(!file)return null;
   if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('หลักฐานต้องเป็น JPG, PNG หรือ WebP ขนาดไม่เกิน 5 MB');
   const t=await token(),uid=authSub(t),c=config();if(!uid)throw Error('เซสชันไม่ถูกต้อง');
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type],path=uid+'/'+crypto.randomUUID()+'.'+ext;
   const response=await fetch(c.url+'/storage/v1/object/qg-evidence/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':file.type,'x-upsert':'false'},body:file});
   if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.message||'อัปโหลดหลักฐานไม่สำเร็จ')}
   return path;
 }
 window.qgUploadEvidence=upload;
 window.qgOpenEvidence=async function(path){try{const t=await token(),c=config();const response=await fetch(c.url+'/storage/v1/object/sign/qg-evidence/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const data=await response.json();if(!response.ok)throw Error(data.message||'เปิดหลักฐานไม่สำเร็จ');window.open(c.url+'/storage/v1'+data.signedURL,'_blank','noopener')}catch(e){alert(e.message)}};
 window.qgOpenTicketPanel=function(orderId=''){
   if(!(rider?S.user:currentUser())){if(!rider)navigate('login');else alert('กรุณาเข้าสู่ระบบ');return}
   document.getElementById('qg-v22-ticket')?.remove();const panel=document.createElement('section');panel.id='qg-v22-ticket';panel.className='qg-v22-overlay';
   panel.innerHTML='<div class="qg-v22-dialog"><header><b>ติดต่อฝ่ายดูแล</b><button type="button" id="qg-ticket-close" aria-label="ปิด">✕</button></header><p>แจ้งปัญหาและติดตามสถานะจากระบบ</p><form id="qg-ticket-form"><label>ออเดอร์ที่เกี่ยวข้อง (ถ้ามี)<select name="order"><option value="">ไม่ระบุออเดอร์</option></select></label><label>ประเภทปัญหา<select name="category"></select></label><label>รายละเอียด<textarea name="details" minlength="10" maxlength="2000" required placeholder="อธิบายปัญหาอย่างน้อย 10 ตัวอักษร"></textarea></label><label>รูปหลักฐาน (ถ้ามี)<input name="evidence" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="submit">ส่งเรื่อง</button></form><h3>เรื่องที่แจ้งไว้</h3><div id="qg-ticket-list">กำลังโหลด...</div></div>';
   document.body.appendChild(panel);panel.querySelector('#qg-ticket-close').onclick=()=>panel.remove();panel.onclick=e=>{if(e.target===panel)panel.remove()};

<script id="qg-v22-rider-operations">
(function(){




 window.finishOrder=async function(o){
   if(o?.market_order_id){
   try{
     const token=await getAccessToken(),m=await sbTable('market_orders?select=total_amount,status&id=eq.'+encodeURIComponent(o.market_order_id)+'&limit=1',{token});

     const pin=(document.getElementById('delivery-pin')?.value||document.getElementById('qg-delivery-pin')?.value||prompt('กรอกรหัส PIN 6 หลักจากลูกค้า')||'').trim();
     if(!/^\d{6}$/.test(pin)){toast('กรุณากรอก PIN 6 หลัก');return}
     let lat=null,lng=null;if(navigator.geolocation)try{const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:5000,maximumAge:10000}));lat=p.coords.latitude;lng=p.coords.longitude}catch(e){}
     const file=document.getElementById('qg-v22-delivery-photo')?.files?.[0],photoPath=file&&typeof qgUploadEvidence==='function'?await qgUploadEvidence(file):null;
     await sbTable('rpc/qg_complete_market_with_proof',{method:'POST',token,body:{p_market_order_id:o.market_order_id,p_pin:pin,p_lat:lat,p_lng:lng,p_photo_path:photoPath}});
     toast('ส่งออเดอร์ตลาดสำเร็จ');await refreshData();
   }catch(e){toast('จบงานไม่สำเร็จ: '+e.message)}
 return;}

   try{const t=await getAccessToken(),rows=await sbTable('orders?select=total_amount,status&id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token:t});
     if(rows?.[0]?.status!=='in_progress')throw Error('สถานะออเดอร์เปลี่ยนแล้ว กรุณาโหลดใหม่');
     if(!confirm('ยืนยันว่าได้รับเงินสดจากลูกค้า ฿'+Number(rows[0].total_amount).toLocaleString('th-TH')+' แล้ว?'))return;
   }catch(e){toast('ตรวจยอดรับเงินไม่สำเร็จ: '+e.message);return}
   const pin=prompt('กรอกรหัส PIN 6 หลักจากลูกค้าเพื่อยืนยันการส่งมอบ');if(pin===null)return;
   if(!/^\d{6}$/.test(pin.trim())){toast('PIN ต้องเป็นตัวเลข 6 หลัก');return}
   const button=document.getElementById('finish-order-btn');if(button)button.disabled=true;
   let lat=null,lng=null;
   if(navigator.geolocation)try{const p=await new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:5000,maximumAge:10000}));lat=p.coords.latitude;lng=p.coords.longitude}catch(e){}
   try{const token=await getAccessToken(),file=document.getElementById('qg-v22-delivery-photo')?.files?.[0],photoPath=file?await qgUploadEvidence(file):null;await sbTable('rpc/qg_complete_with_proof',{method:'POST',token,body:{p_order_id:o.id,p_pin:pin.trim(),p_lat:lat,p_lng:lng,p_photo_path:photoPath}});
     const rows=await sbTable('orders?select=*&id=eq.'+encodeURIComponent(o.id)+'&limit=1',{token});renderPaymentSummary(rows?.[0]||{...o,status:'completed'},true);
   }catch(e){toast('จบงานไม่สำเร็จ: '+e.message);if(button)button.disabled=false}
 };
 window.qtRenderEarnings=function(){const panel=document.getElementById('panel-earn');if(!panel)return;panel.innerHTML='<div class="qt-panelhead"><h1>รายได้</h1></div>';let box=document.getElementById('qg-v22-cash-ledger');if(!box){box=document.createElement('section');box.id='qg-v22-cash-ledger';box.className='qg-v22-ledger';panel.appendChild(box)}
   box.innerHTML='<h2>สรุปงานและบัญชีเงินสด</h2><div class="qg-v22-period"><button data-days="1">วันนี้</button><button data-days="7">7 วัน</button><button data-days="30">30 วัน</button></div><div id="qg-v22-period-summary">กำลังโหลดสรุปงาน...</div><div id="qg-v22-ledger-body">กำลังโหลดจากฐานข้อมูล...</div>';
   box.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{const days=Number(b.dataset.days);qgLoadRiderLedger(days);qgLoadRiderPeriod(days)});qgLoadRiderLedger(1);qgLoadRiderPeriod(1);
 };
 const day=d=>{const x=Object.fromEntries(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d).map(p=>[p.type,p.value]));return x.year+'-'+x.month+'-'+x.day};
 const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
 window.qgLoadRiderPeriod=async function(days){const box=document.getElementById('qg-v22-period-summary');if(!box)return;box.textContent='กำลังโหลดสรุปงาน...';try{const token=await getAccessToken(),s=await sbTable('rpc/qg_rider_period_summary',{method:'POST',token,body:{p_days:days}});if(!box.isConnected)return;box.innerHTML='<div class="qg-v22-ledger-grid"><div>งานสำเร็จ<b>'+Number(s.jobs||0)+' งาน</b></div><div>รายได้จากค่าส่ง<b>'+baht(s.income)+'</b></div><div>ชั่วโมงออนไลน์ที่บันทึก<b>'+Number(s.online_hours||0)+' ชม.</b></div><div>เฉลี่ยต่อชั่วโมง<b>'+(s.income_per_hour===null?'ยังไม่มีข้อมูล':baht(s.income_per_hour))+'</b></div></div><small>บันทึกเวลาออนไลน์ตั้งแต่ '+(s.tracked_since?new Date(s.tracked_since).toLocaleString('th-TH'):'เริ่มใช้ระบบครั้งแรก')+'</small>'}catch(e){box.textContent='โหลดสรุปงานไม่สำเร็จ: '+e.message}};
 window.qgLoadRiderLedger=async function(days){const box=document.getElementById('qg-v22-ledger-body');if(!box)return;box.textContent='กำลังโหลดจากฐานข้อมูล...';try{
   const to=new Date(),from=new Date(to.getTime()-(days-1)*86400000),token=await getAccessToken();const rows=await sbTable('rpc/qg_rider_cash_ledger',{method:'POST',token,body:{p_from:day(from),p_to:day(to)}});
   if(!box.isConnected)return;const sum=k=>(rows||[]).reduce((a,o)=>a+Number(o[k]||0),0),paid=sum('cash_paid_merchant'),collected=sum('cash_collected_customer'),fees=(rows||[]).filter(o=>o.payment_status==='paid').reduce((a,o)=>a+Number(o.delivery_fee||0),0),outstanding=(rows||[]).filter(o=>o.cash_paid_merchant&&!o.cash_collected_customer).reduce((a,o)=>a+Number(o.total||0),0);
   box.innerHTML='<div class="qg-v22-ledger-grid"><div>จ่ายร้าน<b>'+baht(paid)+'</b></div><div>เก็บลูกค้า<b>'+baht(collected)+'</b></div><div>ค่าส่งที่ได้รับ<b>'+baht(fees)+'</b></div><div>รอเก็บลูกค้า<b>'+baht(outstanding)+'</b></div><div>สุทธิรับ-จ่าย<b>'+baht(collected-paid)+'</b></div><div>งานสำเร็จ<b>'+(rows||[]).filter(o=>o.status==='completed').length+'</b></div></div>'+
     (rows||[]).map(o=>'<article><b>'+String(o.order_number||o.order_id)+'</b><small>'+String(o.status)+' · '+(o.merchant_confirmed?'ร้านยืนยันรับเงิน':'ร้านยังไม่ยืนยัน')+' · '+String(o.payment_status||'รอชำระ')+'</small><span>จ่าย '+baht(o.cash_paid_merchant)+' / เก็บ '+baht(o.cash_collected_customer)+'</span></article>').join('');
 }catch(e){box.textContent='โหลดบัญชีเงินสดไม่สำเร็จ: '+e.message}};


})();

<script id="qg-market-multipickup-v1">
(function(){
 async function loadPickups(o){
  if(!o||!o.market_order_id)return [];
  try{const token=await getAccessToken();const x=await sbTable('rpc/market_pickup_cash_summary',{method:'POST',token,body:{p_market_order_id:o.market_order_id}});return Array.isArray(x)?x:[]}catch(e){console.warn('market pickups',e);return []}
 }
 function html(rows){
  if(!rows.length)return '';
  const paid=rows.filter(x=>x.status==='PICKED_UP'||Number(x.cash_paid_amount)>0).length,total=rows.reduce((a,x)=>a+Number(x.shop_amount||0),0);
  return '<section class="qg-mp"><div class="qg-mp-head"><b>รับของหลายร้าน</b><small>รับแล้ว '+paid+'/'+rows.length+' จุด</small></div>'+rows.map((x,i)=>{const done=x.status==='PICKED_UP';return '<div class="qg-mp-row"><div class="qg-mp-top"><div><b>จุดรับ '+(i+1)+'</b><br><small>'+esc(x.shop_name||'ร้านค้า')+'</small></div><strong class="'+(done?'qg-mp-paid':'')+'">฿'+Number(x.shop_amount||0).toLocaleString('th-TH')+'</strong></div><button class="qg-mp-btn" data-pickup="'+esc(x.pickup_id)+'" data-amount="'+Number(x.shop_amount||0)+'" '+(done?'disabled':'')+'>'+(done?'✓ จ่ายและรับของแล้ว':'จ่าย ฿'+Number(x.shop_amount||0).toLocaleString('th-TH')+' และรับของ')+'</button></div>'}).join('')+'<div class="qg-mp-total"><span>เงินที่ต้องจ่ายร้านรวม</span><span>฿'+total.toLocaleString('th-TH')+'</span></div></section>';
 }
 window.qgMountMarketPickups=mount;
 async function mount(o){
  if(!o||!o.market_order_id)return;
  const sheet=document.getElementById('sheet');if(!sheet)return;
  const rows=await loadPickups(o);if(!rows.length)return;
  sheet.querySelector('.qg-mp')?.remove();
  const actions=sheet.querySelector('.qt-actions'),box=document.createElement('div');box.innerHTML=html(rows);const node=box.firstElementChild;
  if(actions)sheet.insertBefore(node,actions);else sheet.appendChild(node);
  sheet.querySelectorAll('[data-pickup]').forEach(b=>b.onclick=async()=>{if(b.disabled)return;const amount=Number(b.dataset.amount||0);if(!confirm('ยืนยันว่าจ่ายเงินให้ร้าน ฿'+amount.toLocaleString('th-TH')+' และรับของแล้ว?'))return;b.disabled=true;try{const token=await getAccessToken();const r=await sbTable('rpc/market_rider_confirm_pickup_cash',{method:'POST',token,body:{p_pickup_id:b.dataset.pickup,p_amount:amount}});toast(r?.all_picked_up?'รับของครบทุกจุดแล้ว — ไปส่งลูกค้าได้':'บันทึกจุดรับแล้ว');await refreshData();}catch(e){toast('บันทึกจุดรับไม่สำเร็จ: '+e.message);b.disabled=false;}});
  const next=document.getElementById('next-'+o.id);if(next){const all=rows.every(x=>x.status==='PICKED_UP'||x.status==='CANCELLED');if(!all){next.disabled=true;next.textContent='รับของให้ครบทุกจุดก่อน';}}
 }


})();
