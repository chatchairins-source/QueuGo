/* ===== QueueGo Modern UI Refresh v2 ===== */
:root{
  --primary:#1d4ed8;--primary-dark:#1e40af;--accent:#0ea5e9;
  --danger:#dc2626;--bg:#f6f8fb;--surface:#fff;--text:#172033;
  --muted:#64748b;--line:#e2e8f0;--radius:18px;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 0% 0%,rgba(59,130,246,.10),transparent 28rem),
    radial-gradient(circle at 100% 10%,rgba(56,189,248,.10),transparent 24rem),
    var(--bg);color:var(--text);letter-spacing:.05px;
}
.qt-banner{background:#172033;color:#e2e8f0;padding:8px 14px;font-size:11px;letter-spacing:.15px}
.qt-header{
  padding:14px 18px;background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(226,232,240,.8);box-shadow:0 4px 20px rgba(15,23,42,.04)
}
.qt-logo{font-size:20px;letter-spacing:-.4px;color:var(--primary-dark)}
.qt-logo span{color:var(--accent)}
.qt-auth-links a{font-weight:600;color:var(--primary-dark)}
.qt-user-chip{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;padding:8px 12px;font-weight:600}
.qt-main{max-width:720px;padding:22px 16px 90px}
h1,h2,h3{color:var(--text);letter-spacing:-.4px}
h1{font-size:clamp(25px,6vw,36px);line-height:1.2}
h2{font-size:24px;margin:10px 0 16px}
h3{font-size:18px;margin:20px 0 10px}
.hero{
  position:relative;overflow:hidden;text-align:left;margin:4px 0 22px;
  padding:28px 24px;border-radius:24px;color:#fff;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#3b82f6 100%);
  box-shadow:0 14px 30px rgba(37,99,235,.20)
}
.hero:after{content:"";position:absolute;width:180px;height:180px;border:28px solid rgba(255,255,255,.10);border-radius:50%;right:-55px;top:-65px}
.hero h1,.hero p{position:relative;z-index:1;color:#fff}
.hero p{opacity:.88;margin:8px 0 0}
.grid-menu{gap:12px;margin:18px 0 26px}
.menu-card{
  min-height:112px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid rgba(226,232,240,.9);border-radius:18px;padding:14px 8px;
  background:rgba(255,255,255,.92);box-shadow:0 6px 18px rgba(15,23,42,.05);
  transition:transform .2s,box-shadow .2s,border-color .2s
}
.menu-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(15,23,42,.10);border-color:#bfdbfe}
.menu-card div{font-weight:600;color:#334155}
.menu-card.danger{background:linear-gradient(145deg,#fff1f2,#fff);border-color:#fecdd3;color:#dc2626}
.btn-primary,.btn-secondary,.btn-danger{
  min-height:44px;border-radius:12px;font-family:inherit;font-weight:700;
  transition:transform .15s,box-shadow .15s,filter .15s
}
.btn-primary{background:linear-gradient(135deg,#1d4ed8,#2563eb);box-shadow:0 6px 14px rgba(37,99,235,.18)}
.btn-primary:hover,.btn-secondary:hover,.btn-danger:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn-secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444)}
form,.inline-form,.order-detail-card,.order-summary,.notif-panel{
  background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.045)
}
form label{color:#475569;margin-top:14px}
form input,form select,form textarea{
  padding:12px 13px;border:1px solid #dbe3ec;border-radius:11px;background:#fbfdff;
  color:var(--text);outline:none;transition:border .15s,box-shadow .15s
}
form input:focus,form select:focus,form textarea:focus{
  border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13);background:#fff
}
.map-box{height:300px;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.tabs{gap:8px}
.tab{border:1px solid #dbe3ec;background:#fff;color:#475569;border-radius:999px;padding:9px 14px;font-weight:600}
.tab.active{background:#1d4ed8;border-color:#1d4ed8;box-shadow:0 5px 12px rgba(29,78,216,.16)}
.demo-accounts{border:1px solid #bfdbfe;border-radius:14px;background:#eff6ff;color:#1e40af}
.shop-list{gap:12px}
.shop-card,.order-card,.tech-card,.module-card,.status-toggle,.stat-card,.cart-item,.product-card{
  border:1px solid var(--line);box-shadow:0 7px 20px rgba(15,23,42,.045)
}
.shop-card{padding:13px;border-radius:16px;transition:transform .18s,box-shadow .18s}
.shop-card:hover,.order-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,23,42,.09)}
.shop-logo{width:64px;height:64px;border-radius:14px}
.shop-info{color:#64748b}
.shop-info b,.product-info b{color:var(--text);font-size:14px}
.product-grid{gap:14px}
.product-card{border-radius:16px;background:#fff}
.product-img{height:135px;background:#f1f5f9}
.product-info{padding:12px}
.product-info button{border-radius:10px;padding:9px;background:#1d4ed8;font-weight:700}
.row-btns{gap:8px}
.row-btns button,.row-btns a{border-radius:10px;padding:9px;font-weight:600}
.badge{padding:5px 9px;font-weight:600}
.stat-cards{gap:10px}
.stat-card{border-radius:16px;padding:14px;background:linear-gradient(145deg,#fff,#f8fafc)}
.stat-card b{display:block;font-size:24px;color:#1d4ed8;margin-top:4px}
.status-toggle{border-radius:16px;padding:14px}
.shop-header{height:190px;border-radius:20px;box-shadow:0 8px 20px rgba(15,23,42,.08)}
.shop-logo-lg{width:76px;height:76px;border-radius:18px}
.shop-summary{padding:8px 0}
.promo-banner,.promo-card{border-radius:16px;border:1px solid #fde68a;box-shadow:0 5px 14px rgba(245,158,11,.06)}
.warn-text{border:1px solid #fecaca;border-radius:12px}
.qt-bottomnav{
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(226,232,240,.9);box-shadow:0 -6px 20px rgba(15,23,42,.06);
  padding-top:5px
}
.qt-bottomnav a{color:#64748b;padding:9px 2px 8px;transition:color .15s}
.qt-bottomnav a span{font-size:11px;margin-top:3px}
.qt-bottomnav a.active{color:#1d4ed8}
.qt-bottomnav a.active span{font-weight:700}
.customer-order-lock{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:12px;margin:10px 0;line-height:1.6;font-size:13px;}.qt-toast{bottom:92px;border-radius:14px;box-shadow:0 10px 25px rgba(15,23,42,.2)}
.notif-toast{border-radius:14px;box-shadow:0 10px 25px rgba(15,23,42,.18)}
.notif-item{padding:14px;border-radius:10px;margin:3px 0;border-bottom:0}
.notif-item.unread{background:#eff6ff}
@media(max-width:520px){
  .qt-main{padding:16px 12px 88px}
  .hero{padding:24px 20px;border-radius:20px}
  .grid-menu{gap:9px}
  .menu-card{min-height:100px;font-size:25px}
  .product-img{height:115px}
  .qt-header{padding:12px}
  .qt-logo{font-size:18px}
  .qt-user-chip{max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(min-width:700px){
  .qt-main{padding-top:28px}
  .grid-menu{gap:16px}
  .menu-card{min-height:125px}
}


/* QueueGo: lock viewport scale and keep layout fitted to device width */
html {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
  touch-action: manipulation;
}
input, select, textarea, button {
  font-size: 16px;
}

/* Quote form: simple, spacious and easy to use on mobile */
.quote-submit-box{
  margin-top:16px;
  padding:18px;
  background:#fff;
  border:1px solid #dbe5e7;
  border-radius:18px;
  box-shadow:0 8px 24px rgba(15,23,42,.06);
}
.quote-submit-box label{
  display:block;
  margin-bottom:9px;
  font-size:15px;
  font-weight:700;
  color:#1f2937;
}
.quote-price-input{
  width:100% !important;
  min-height:54px;
  padding:13px 15px !important;
  font-size:20px !important;
  font-weight:700;
  border:2px solid #cbd5e1 !important;
  border-radius:14px !important;
  box-sizing:border-box;
}
.quote-price-input:focus{
  border-color:var(--primary) !important;
  box-shadow:0 0 0 4px rgba(37,99,235,.14) !important;
}
.quote-submit-btn{
  min-height:54px;
  margin-top:14px;
  font-size:17px;
  border-radius:14px;
}
@media(max-width:520px){
  .quote-submit-box{padding:15px;margin-top:14px}
  .quote-price-input{min-height:58px;font-size:22px !important}

}

/* ---------- Order chat ---------- */

.order-chat h3{margin:0 0 10px}
.chat-messages{height:280px;overflow-y:auto;background:#f8fafc;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.chat-empty{text-align:center;color:#64748b;font-size:13px;margin:auto}
.chat-bubble{max-width:82%;padding:9px 12px;border-radius:15px;line-height:1.4;font-size:14px;word-break:break-word}

<script id="qt-v532-helpers">
/* V5.32 helpers — defined first so every later script can use them */
function escapeHtml(value){ return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function qtCleanText(v){ return String(v==null?'':v).replace(/[<>]/g,'').replace(/\s+/g,' ').trim(); }
function qtCssUrl(u){ try{ return encodeURI(String(u||'')).replace(/'/g,'%27').replace(/"/g,'%22').replace(/\(/g,'%28').replace(/\)/g,'%29'); }catch(e){ return ''; } }
/* Sync state: in-flight writes, per-row "last persisted" hashes, polling bookkeeping */
const QT_SYNC={pending:0,lastWrite:0,busy:false,dirty:{},hash:{},profileMaps:null,tick:0,lastErrorToast:0,timer:null};
const QT_RIDER_IMAGE_FIELDS=['profileImage','idCardFrontImage','idCardBackImage','driverLicenseImage','compulsoryInsuranceImage','vehiclePhoto'];
function qtTrackPersist(p){
  QT_SYNC.pending++; QT_SYNC.lastWrite=Date.now();
  return Promise.resolve(p).finally(()=>{ QT_SYNC.pending=Math.max(0,QT_SYNC.pending-1); QT_SYNC.lastWrite=Date.now(); });
}
function qtSyncFailed(key,err){
  console.warn('Supabase sync failed:',key,err);
  /* Notifications are auxiliary. A notification RLS failure must never make an
     order, cancellation, assignment, payment, or other business action look
     like it failed. The notification remains in the current session and will
     be retried by the normal sync cycle after the DB policy is corrected. */
  if(key==='qt_notifications'){ console.warn('QueueGo notification sync failed; auth/session may need refresh.', {hasSession:!!qtSessionRead(), hasAccessToken:!!qtAccessToken(), hasRefreshToken:!!qtSessionRead()?.refreshToken}); return; }
  if(Date.now()-QT_SYNC.lastErrorToast<15000) return;
  QT_SYNC.lastErrorToast=Date.now();
  try{ toast('บันทึกข้อมูลขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ('+String((err&&err.message)||'unknown').slice(0,80)+')'); }catch(e){}
}
/* notifications: in-app objects use {body, link}; the table has {message, type, reference_id} */
function qtNotifDbParts(n){
  const m=String(n.link||'').match(/^(order|technician-job)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {type:m[1]==='order'?'order':'quotation',ref:m[2]};
  return {type:['order','quotation','delivery','payment','complaint','system'].includes(n.type)?n.type:'system',ref:(n.referenceId&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(n.referenceId))?n.referenceId:null};
}
function qtNotifLinkFromRow(n){ if(!n.reference_id) return undefined; if(n.type==='order') return 'order/'+n.reference_id; if(n.type==='quotation') return 'technician-job/'+n.reference_id; return undefined; }
/* never send the password (or other secrets) to the database inside metadata */
function qtUserMetadata(u){
  const m=Object.assign({},u);
  delete m.password;
  /* Batch 3: account status/identity stay in users columns; profile metadata is
     only for rider/shop/technician profile details and documents. */
  delete m.status;
  delete m.applicationStatus;
  delete m.authUserId;
  delete m.type;
  delete m.id;
  return m;
}
function qtRiderProfileRow(u){
  const status = u.status==='suspended' ? 'suspended'
    : u.status==='approved' ? 'active'
    : 'pending';
  return {
    user_id:u.id,
    rider_name:u.name||'ไรเดอร์',
    phone:u.phone||null,
    vehicle_type:u.vehicleType||null,
    vehicle_plate:u.vehiclePlate||null,
    address:u.address||null,
    latitude:u.lat??null,
    longitude:u.lng??null,
    status,
    metadata:qtUserMetadata(u)
  };
}
</script>

<script id="qt-supabase-client">
/* QueueGo Supabase connection — public publishable key only */
window.QT_SUPABASE_CONFIG = {
  URL: 'https://pkypiqhlrmzocysgeqew.supabase.co',
  KEY: 'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
function qtSupabaseHeaders(accessToken){
  const h={apikey:QT_SUPABASE_CONFIG.KEY,'Content-Type':'application/json'};
  if(accessToken) h.Authorization='Bearer '+accessToken;
  return h;
}
async function qtSupabaseAuth(path, body){
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/'+path,{method:'POST',headers:qtSupabaseHeaders(),body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error_description||data.msg||data.message||'AUTH_ERROR');
  return data;
}
async function qtSupabaseRpc(fn,args={}){
  const token=await qtGetAccessToken();
  const headers=qtSupabaseHeaders(token);
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/rpc/'+fn,{method:'POST',headers,body:JSON.stringify(args)});
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.message)||'RPC_ERROR_'+r.status);
  return data;
}
async function qtSupabaseTable(path, options={}){
  const headers=qtSupabaseHeaders(options.accessToken);
  const isNotif=String(path).startsWith('notifications');
  const rep=isNotif ? 'return=minimal' : 'return=representation';
  if(['POST','PATCH','PUT'].includes(String(options.method||'GET').toUpperCase())){
    headers.Prefer=String(path).includes('on_conflict=') && String(options.method||'').toUpperCase()==='POST'
      ? rep+',resolution=merge-duplicates' : rep;
  }
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):undefined});
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.message)||((data&&data.hint)?data.hint:'DB_ERROR_'+r.status));
  return data;
}
function qtAuthEmailFromPhone(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  return digits+'@auth.queuetech.local';
}
async function qtCreateSupabaseUser({type,name,phone,password,email}){
  const cleanEmail=String(email||'').trim().toLowerCase();
  const cleanPhone=String(phone||'').trim();
  const authEmail=cleanEmail || qtAuthEmailFromPhone(cleanPhone);
  const auth=await qtSupabaseAuth('signup',{
    email:authEmail,
    password,
    data:{name,phone:cleanPhone||null,role:type}
  });
  let session=auth.session;
  if(!auth.user) throw new Error('สร้างบัญชี Auth ไม่สำเร็จ');
  if(!session || !session.access_token){
    if(cleanEmail){
      return {auth,session:null,profile:null,needsEmailConfirmation:true,authEmail};
    }
    try{
      session=await qtSupabaseAuth('token?grant_type=password',{email:authEmail,password});
    }catch(loginErr){
      throw new Error('AUTH_CONFIRMATION_REQUIRED');
    }
  }
  /* V5.37 FIX:
     The users table flow already uses auth_user_id as the conflict identity
     elsewhere in QueueGo. Use that same database-backed identity here.
     Do not use phone as the conflict target because the earlier V5.32 target
     was not backed by a matching UNIQUE/EXCLUSION constraint. */
  const row={
    auth_user_id:auth.user.id,
    role:type,
    name,
    phone:cleanPhone||null,
    status:type==='customer'?'active':'pending'
  };
  const rows=await qtSupabaseTable('users?select=id,auth_user_id,role,name,phone,status,created_at&on_conflict=auth_user_id',{method:'POST',accessToken:session.access_token,body:row});
  const profile=Array.isArray(rows)?rows[0]:rows;
  if(!profile) throw new Error('สร้างข้อมูลผู้ใช้ในฐานข้อมูลไม่สำเร็จ');
  return {auth,session,profile,needsEmailConfirmation:false,authEmail};
}
async function qtLoadOwnSupabaseUser(accessToken, authUserId){
  const rows=await qtSupabaseTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(authUserId),{accessToken});
  return Array.isArray(rows)?rows[0]:null;
}
</script>

<script id="qt-v527-online-ready-core">
/*
 QueueGo V5.30 — Online-ready architecture.
 IMPORTANT: ONLINE_MODE is intentionally false. No network connection is made
 until the owner explicitly enables it and supplies a backend/API endpoint.
 Existing QT order-number allocation logic is not changed by this layer.
*/
window.QT_ONLINE_CONFIG = Object.assign({
  ONLINE_MODE:false,
  API_BASE_URL:"",
  WS_URL:"",
  APP_VERSION:"V5.32",
  HEARTBEAT_MS:15000,
  PRESENCE_TIMEOUT_MS:45000,
  LOCATION_INTERVAL_MS:10000,
  SYNC_INTERVAL_MS:5000,
  MAX_OUTBOX_RETRY:10
}, window.QT_ONLINE_CONFIG||{});

const QT_NET_STATE_KEY='qt_online_net_state_v527';
const QT_OUTBOX_KEY='qt_online_outbox_v527';
const QT_DEVICE_KEY='qt_online_device_id_v527';
const QT_LAST_SYNC_KEY='qt_online_last_sync_v527';

function qtDeviceId(){
  let id=sessionStorage.getItem(QT_DEVICE_KEY);
  if(!id){id='qtdev_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);sessionStorage.setItem(QT_DEVICE_KEY,id);}

}
function qtSession(){
  try{return qtSessionRead()}catch(e){return null}
}
function qtCurrentUserId(){
  const s=qtSession(); return s&&(s.userId||s.id||s.uid||null);
}
function qtNetState(state, detail){
  sessionStorage.setItem(QT_NET_STATE_KEY,JSON.stringify({state,detail:detail||'',at:new Date().toISOString()}));
}
function qtReadNetState(){
  try{return JSON.parse(sessionStorage.getItem(QT_NET_STATE_KEY)||'{}')}catch(e){return {}}
}
function qtEnqueueEvent(type,payload){
  if(!QT_ONLINE_CONFIG.ONLINE_MODE) return; /* V5.32: nothing consumes the outbox while ONLINE_MODE is off */
  const q=JSON.parse(sessionStorage.getItem(QT_OUTBOX_KEY)||'[]');
  q.push({eventId:'evt_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9),
    type,payload,deviceId:qtDeviceId(),createdAt:new Date().toISOString(),attempts:0});
  sessionStorage.setItem(QT_OUTBOX_KEY,JSON.stringify(q.slice(-1000)));
}
function qtOutboxSize(){try{return JSON.parse(sessionStorage.getItem(QT_OUTBOX_KEY)||'[]').length}catch(e){return 0}}
async function qtApi(path, options={}){
  if(!QT_ONLINE_CONFIG.ONLINE_MODE || !QT_ONLINE_CONFIG.API_BASE_URL) throw new Error('ONLINE_DISABLED');
  const ctrl=new AbortController(), timer=setTimeout(()=>ctrl.abort(),options.timeout||12000);
  try{
    const headers=Object.assign({'Content-Type':'application/json','X-QueueTech-App':QT_ONLINE_CONFIG.APP_VERSION},options.headers||{});
    const s=qtSession(); if(s && s.token) headers.Authorization='Bearer '+s.token;
    const r=await fetch(QT_ONLINE_CONFIG.API_BASE_URL.replace(/\/$/,'')+path,
      Object.assign({},options,{headers,signal:ctrl.signal}));
    if(!r.ok) throw new Error('HTTP_'+r.status);
    const ct=r.headers.get('content-type')||'';
    return ct.includes('application/json')?await r.json():await r.text();
  }finally{clearTimeout(timer)}
}
async function qtSyncOutbox(){
  if(!QT_ONLINE_CONFIG.ONLINE_MODE || !QT_ONLINE_CONFIG.API_BASE_URL) return;
  let q=JSON.parse(sessionStorage.getItem(QT_OUTBOX_KEY)||'[]');
  if(!q.length){qtNetState('ready','ไม่มีข้อมูลรอซิงก์');return}
  const next=[];
  for(const e of q){
    try{await qtApi('/api/sync/events',{method:'POST',body:JSON.stringify(e)});}
    catch(err){e.attempts=(e.attempts||0)+1;if(e.attempts<QT_ONLINE_CONFIG.MAX_OUTBOX_RETRY) next.push(e);}
  }
  sessionStorage.setItem(QT_OUTBOX_KEY,JSON.stringify(next));
  sessionStorage.setItem(QT_LAST_SYNC_KEY,new Date().toISOString());
  qtNetState(next.length?'pending':'ready',next.length?'มีข้อมูลรอซิงก์':'ซิงก์ล่าสุดสำเร็จ');
}
function qtPresencePayload(status,coords){
  return {userId:qtCurrentUserId(),role:qtSession()?.role||null,status,
    available:status==='online',deviceId:qtDeviceId(),
    lat:coords?.lat??null,lng:coords?.lng??null,accuracy:coords?.accuracy??null,
    clientAt:new Date().toISOString()};
}
function qtSendPresence(status,coords){
  const p=qtPresencePayload(status,coords);
  qtEnqueueEvent('presence.update',p);
  if(QT_ONLINE_CONFIG.ONLINE_MODE) qtSyncOutbox();
}
function qtStartOnlinePresence(){
  const s=qtSession(); if(!s) return;
  const role=s.role;
  let watch=null, lastCoords=null;
  const send=()=>qtSendPresence(role==='rider'?'online':'online',lastCoords);
  send();
  const heartbeat=setInterval(send,QT_ONLINE_CONFIG.HEARTBEAT_MS);
  if(role==='rider' && navigator.geolocation){
    try{watch=navigator.geolocation.watchPosition(pos=>{
      lastCoords={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
      qtSendPresence('online',lastCoords);
    },()=>{}, {enableHighAccuracy:true,maximumAge:5000,timeout:10000});}catch(e){}
  }
  window.addEventListener('beforeunload',()=>{clearInterval(heartbeat);if(watch!==null)navigator.geolocation.clearWatch(watch);qtSendPresence('offline',lastCoords);},{once:true});
}
function qtMarkOffline(){
  if(qtSession()) qtSendPresence('offline');
}
window.addEventListener('online',()=>{qtNetState('ready','อุปกรณ์ออนไลน์');qtSyncOutbox()});
window.addEventListener('offline',()=>qtNetState('pending','ไม่มีอินเทอร์เน็ต ข้อมูลจะรอซิงก์'));
setInterval(()=>{if(navigator.onLine)qtSyncOutbox()},QT_ONLINE_CONFIG.SYNC_INTERVAL_MS);
setTimeout(()=>{qtNetState(navigator.onLine?'ready':'pending',navigator.onLine?'พร้อมเชื่อมต่อ':'ออฟไลน์');qtStartOnlinePresence()},1000);

window.QTOnline={
  config:QT_ONLINE_CONFIG, api:qtApi, enqueue:qtEnqueueEvent, sync:qtSyncOutbox,
  setOnlineMode:(v)=>{QT_ONLINE_CONFIG.ONLINE_MODE=!!v;qtNetState(v?'ready':'pending',v?'เปิดโหมดออนไลน์':'ปิดโหมดออนไลน์')},
  status:qtReadNetState, outboxSize:qtOutboxSize, logout:qtMarkOffline
};
</script>

<script id="v526-rider-online-status">
/* QueueGo V5.30 — Rider online presence for Admin monitoring.
   Session-only implementation: updates are visible across tabs
   on the same browser/profile. Real cross-device presence requires backend/WebSocket.
*/
const QT_RIDER_PRESENCE_KEY = 'qt_rider_presence_v526';

function qtGetRiderPresence(){
  try { return JSON.parse(sessionStorage.getItem(QT_RIDER_PRESENCE_KEY) || '{}'); }
  catch(e){ return {}; }
}
function qtSetRiderPresence(riderId, status, extra={}){
  if(!riderId) return;
  const all = qtGetRiderPresence();
  all[riderId] = Object.assign({}, all[riderId]||{}, {
    riderId, status,
    lastSeenAt: new Date().toISOString()
  }, extra);
  sessionStorage.setItem(QT_RIDER_PRESENCE_KEY, JSON.stringify(all));
}
function qtClearRiderPresence(riderId){
  if(!riderId) return;
  const all=qtGetRiderPresence();
  delete all[riderId];
  sessionStorage.setItem(QT_RIDER_PRESENCE_KEY, JSON.stringify(all));
}
function qtPresenceLabel(status){
  return status==='online'?'ออนไลน์':status==='busy'?'กำลังรับงาน':'ออฟไลน์';
}
function qtPresenceClass(status){
  return status==='online'?'online':status==='busy'?'busy':'offline';
}
function qtRiderIsAvailableForDispatch(rider){
  const p=qtGetRiderPresence()[rider.id]||{};
  return rider.status==='approved' && p.status==='online' && rider.available!==false;
}
function qtAdminRiderPresenceHTML(riders){
  const p=qtGetRiderPresence();
  const arr=(riders||[]).filter(r=>r && r.role==='rider');
  if(!arr.length) return '<div class="qt-rider-online-card">ยังไม่มีข้อมูลไรเดอร์</div>';
  return arr.map(r=>{
    const x=p[r.id]||{};
    /* Batch 4: fall back to the persisted user state when the local
       sessionStorage presence is unavailable (for example after refresh). */
    const status=x.status || (r.online ? (r.available===false?'busy':'online') : 'offline');
    const last=x.lastSeenAt?new Date(x.lastSeenAt).toLocaleString('th-TH'):'จากสถานะบัญชี';

    return `<div class="qt-rider-online-card">
      <div><span class="qt-online-dot ${qtPresenceClass(status)}"></span><strong>${escapeHtml(r.name||r.fullName||'ไรเดอร์')}</strong>
      <span style="float:right">${qtPresenceLabel(status)}</span></div>
      <div style="font-size:12px;color:#6b7280;margin-top:5px">ล่าสุด: ${last}</div>
    </div>`;
  }).join('');
}
async function qtRenderAdminRiderPresence(){
  const el=document.getElementById('qt-admin-rider-online-panel');
  if(!el)return;
  el.textContent='กำลังโหลดสถานะไรเดอร์…';
  try{
    const token=await qtGetAccessToken();
    if(!token)throw Error('กรุณาเข้าสู่ระบบ Admin');
    const [users,profiles]=await Promise.all([
      qtSupabaseTable('users?select=id,name,role,status&role=eq.rider',{accessToken:token}),
      qtSupabaseTable('rider_profiles?select=user_id,status,metadata,updated_at',{accessToken:token})
    ]);
    if(!Array.isArray(users)||!Array.isArray(profiles))throw Error('ข้อมูลไรเดอร์ไม่ครบ');
    const byUser=new Map(profiles.map(p=>[String(p.user_id),p]));
    if(!el.isConnected)return;
    el.innerHTML=users.length?users.map(u=>{
      const p=byUser.get(String(u.id));
      const fresh=p?.updated_at&&Date.now()-new Date(p.updated_at).getTime()<180000;
      const online=u.status==='active'&&p?.status==='active'&&p?.metadata?.online===true&&fresh;
      const state=u.status==='suspended'?'พักสิทธิ์':u.status!=='active'?'รออนุมัติ':online?'ออนไลน์':'ออฟไลน์';
      return '<div class="qt-rider-online-card"><strong>'+escapeHtml(u.name||'ไรเดอร์')+'</strong><span style="float:right">'+state+'</span></div>';
    }).join(''):'<div class="qt-rider-online-card">ยังไม่มีข้อมูลไรเดอร์</div>';
  }catch(err){if(el.isConnected)el.textContent='โหลดสถานะไรเดอร์ไม่สำเร็จ: '+err.message;}
}
function qtSyncRiderPresenceToUser(riderId, status){
  /* Batch 4: keep the legacy rider online/available fields synchronized with
     the presence state. This makes the existing dispatch engine use the same
     state that the Admin presence panel sees. The database write is only made
     when the value actually changes. */
  if(!riderId) return;
  try{
    const users=dbGet('qt_users',[]);
    const idx=users.findIndex(u=>String(u.id)===String(riderId));
    if(idx<0 || users[idx].type!=='rider') return;
    const nextOnline=status==='online'||status==='busy';
    const nextAvailable=status==='online';
    if(users[idx].online===nextOnline && users[idx].available===nextAvailable) return;
    users[idx].online=nextOnline;
    users[idx].available=nextAvailable;
    dbSet('qt_users',users);
  }catch(e){}
}
function qtRiderPresenceHeartbeat(){
  try{
    const s=qtSessionRead();
    if(!s || s.role!=='rider') return;
    const riderId=s.userId||s.id||s.uid;
    if(!riderId) return;
    const users=dbGet('qt_users',[]);
    const rider=users.find(u=>String(u.id)===String(riderId));
    if(rider && rider.status==='approved' && rider.suspended!==true){
      const busy = rider.available===false;
      const presenceStatus=busy?'busy':'online';
      qtSetRiderPresence(riderId,presenceStatus);
      qtSyncRiderPresenceToUser(riderId,presenceStatus);
    } else {
      qtSetRiderPresence(riderId,'offline');
      qtSyncRiderPresenceToUser(riderId,'offline');
    }
  }catch(e){}
}
function qtMarkRiderOfflineOnExit(){
  try{
    const s=qtSessionRead();
    if(s && s.role==='rider'){
      const id=s.userId||s.id||s.uid;
      if(id){
        qtSetRiderPresence(id,'offline');
        qtSyncRiderPresenceToUser(id,'offline');
      }
    }
  }catch(e){}
}
window.addEventListener('storage', e=>{
  if(e.key===QT_RIDER_PRESENCE_KEY || e.key==='qt_users' || e.key==='users'){
    const el=document.getElementById('qt-admin-rider-presence-list');
    if(el){
      try{
        const users=dbGet('qt_users',[]);
        qtRenderAdminRiderPresence(users);
      }catch(_){}
    }
  }
});
window.addEventListener('beforeunload', qtMarkRiderOfflineOnExit);
setInterval(qtRiderPresenceHeartbeat, 15000);
setTimeout(qtRiderPresenceHeartbeat, 1000);
</script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* =========================================================================
   QueueGo V5.51 — Single File Application
   Notification RLS resilience: notification sync failures are non-blocking.
   Based on V5.50 search-location build.
   ========================================================================= */
/* =========================================================================
   QueueGo V5.8 — Single File Application
   Vanilla JS + Supabase + Leaflet/OSM
   ⚠️ ระบบนี้ยังมีส่วนที่อยู่ระหว่างพัฒนา — ข้อมูลระบบบันทึกใน Supabase; Session ชั่วคราวเก็บใน sessionStorage
   ห้ามใช้ข้อมูลจริงหรือนำขึ้น Production โดยไม่ปรับปรุงระบบความปลอดภัยก่อน
   ========================================================================= */

/* ---------- Supabase-backed application data layer ----------
   Business data is kept in memory and persisted to Supabase.
   LocalStorage is NOT used for users/orders/technician jobs/quotes/notifications/audit/finance.
   sessionStorage is used only for the current browser session token. */
const QT_DB_CACHE = Object.create(null);
const QT_DB_KEYS = new Set(['qt_users','qt_orders','qt_techjobs','qt_notifications','qt_audit_log','qt_finance_ledger','qt_promotions','qt_products','qt_settlements','qt_order_audit']);
const QT_DB_READY = {value:false};
function dbGet(key, def){
  if(Object.prototype.hasOwnProperty.call(QT_DB_CACHE,key)) return QT_DB_CACHE[key];
  if(String(key).startsWith('qt_cart_')){
    try{
      const raw=sessionStorage.getItem(key);
      if(raw!==null){
        const parsed=JSON.parse(raw);
        QT_DB_CACHE[key]=parsed;
        return parsed;
      }
    }catch(e){}
  }
  return def!==undefined ? def : [];
}
function dbSet(key, val){
  QT_DB_CACHE[key]=val;
  if(String(key).startsWith('qt_cart_')){
    try{ sessionStorage.setItem(key,JSON.stringify(val)); }catch(e){}
    try{ updateCartCountUI(); }catch(e){}
    return;
  }
  if(QT_SYNC.busy) QT_SYNC.dirty[key]=val; /* a poll is in flight: re-apply this local write after it finishes */
  if(QT_DB_KEYS.has(key)) qtTrackPersist(qtPersistKey(key,val)).catch(err=>qtSyncFailed(key,err));
  else if(String(key).startsWith('qt_order_chat_') && !String(key).endsWith('_deleteAt')) qtTrackPersist(qtPersistChat(String(key).replace('qt_order_chat_',''),val)).catch(err=>qtSyncFailed(key,err));
}

async function qtPersistChat(orderId,messages){
  const token=await qtGetAccessToken(); if(!token||!qtUuidLike(orderId)) return;
  const rows=Array.isArray(messages)?messages:[];
  for(const m of rows){ if(!qtUuidLike(m.id)||!qtUuidLike(m.senderId)) continue; await qtSupabaseTable('order_chat_messages?on_conflict=id',{method:'POST',accessToken:token,body:{id:m.id,order_id:orderId,sender_id:m.senderId,message:m.text||'',created_at:qtIso(m.createdAt)}}); }
}
function uid(){ return (window.crypto&&crypto.randomUUID) ? crypto.randomUUID() : ('00000000-0000-4000-8000-'+Math.random().toString(16).slice(2,14).padEnd(12,'0')); }

function qtSessionRead(){ try{return JSON.parse(sessionStorage.getItem('qt_session')||'null')}catch(e){return null} }
function qtSessionWrite(s){ try{sessionStorage.setItem('qt_session',JSON.stringify(s));}catch(e){} }
function qtSessionClear(){ try{sessionStorage.removeItem('qt_session');}catch(e){} }
function qtAccessToken(){ return qtSessionRead()?.accessToken || ''; }
function qtJwtExpiryMs(token){
  try{
    const part=String(token||'').split('.')[1];
    if(!part) return 0;
    const b64=part.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((part.length+3)%4);
    const payload=JSON.parse(atob(b64));
    return Number(payload.exp||0)*1000;
  }catch(e){ return 0; }
}
let QT_AUTH_REFRESH_PROMISE=null;
async function qtGetAccessToken(forceRefresh=false){
  const s=qtSessionRead();
  if(!s?.accessToken) return '';
  const stored=Number(s.expiresAt||0);
  const exp=stored>0?(stored<1e12?stored*1000:stored):qtJwtExpiryMs(s.accessToken);
  const needsRefresh=forceRefresh || (exp>0 && exp-Date.now()<60000);
  if(!needsRefresh || !s.refreshToken) return s.accessToken;
  if(QT_AUTH_REFRESH_PROMISE) return QT_AUTH_REFRESH_PROMISE;
  QT_AUTH_REFRESH_PROMISE=(async()=>{
    try{
      const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',headers:qtSupabaseHeaders(),
        body:JSON.stringify({refresh_token:s.refreshToken})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok || !data.access_token) throw new Error(data.error_description||data.msg||data.message||'SESSION_REFRESH_FAILED');
      const next={...s,accessToken:data.access_token,refreshToken:data.refresh_token||s.refreshToken,expiresAt:data.expires_at||Math.floor(qtJwtExpiryMs(data.access_token)/1000)||null};
      qtSessionWrite(next);
      return next.accessToken;
    }finally{ QT_AUTH_REFRESH_PROMISE=null; }
  })();
  return QT_AUTH_REFRESH_PROMISE;
}
function qtIso(ts){ return new Date(ts||Date.now()).toISOString(); }
function qtUuidLike(id){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(id||'')); }

function qtOrderStatusToDb(s){
  const m={pending_shop:'pending',shop_accepted:'accepted',preparing:'preparing',waiting_rider:'ready',rider_to_shop:'assigned',picked_up:'picked_up',delivering:'in_progress',arrived:'in_progress',delivered:'completed',completed:'completed',cancelled:'cancelled'};
  return m[s]||(['pending','accepted','preparing','ready','assigned','picked_up','in_progress','completed','cancelled'].includes(s)?s:'pending');
}
function qtOrderStatusFromDb(s,note=''){ if(s==='in_progress')return /^__QT_ORDER_STATUS__=arrived(?:\n|$)/.test(note)?'arrived':'delivering';const map={pending:'pending_shop',accepted:'shop_accepted',ready:'waiting_rider',assigned:'rider_to_shop',picked_up:'picked_up',completed:'completed',cancelled:'cancelled'};return map[s]||s; }
function qtServiceStatusToDb(s){
  const m={open_for_quotes:'pending',requested:'requested',quote_selected:'accepted',technician_confirmed:'accepted',accepted:'accepted',heading:'in_progress',arrived:'in_progress',working:'in_progress',completed:'completed',rejected:'cancelled',cancelled:'cancelled'};
  return m[s]||'pending';
}
function qtServiceStatusFromDb(s, row){
  if(row?.note && /__QT_TECH_STATUS__=([^\\n]+)/.test(row.note)) return RegExp.$1;
  return s==='completed'?'completed':s==='cancelled'?'cancelled':s==='accepted'?'quote_selected':s==='in_progress'?'working':'open_for_quotes';
}
function qtUserToRow(u, includeStatus=true){
  const meta=qtUserMetadata(u);
  /* V5.42: database now supports rejected as a first-class account status. */
  delete meta.accountDecision;
  /* rider documents live in rider_profiles.metadata only (avoid storing every image twice) */
  if(u.type==='rider') QT_RIDER_IMAGE_FIELDS.forEach(k=>{ delete meta[k]; });
  const row={id:qtUuidLike(u.id)?u.id:undefined,auth_user_id:u.authUserId||null,role:u.type,name:u.name||'',phone:u.phone||'',
    metadata:meta,created_at:qtIso(u.createdAt),updated_at:qtIso(Date.now())};
  /* the column is the source of truth: pending stays pending until an admin approves ('active') */
  if(includeStatus) row.status = u.status==='suspended' ? 'suspended'
    : u.status==='deleted' ? 'deleted'
    : u.status==='rejected' ? 'rejected'
    : (u.type==='customer'||u.type==='admin'||u.status==='approved') ? 'active' : 'pending';
  return row;
}
function qtUserFromRow(r){
  const meta=(r.metadata&&typeof r.metadata==='object'&&!Array.isArray(r.metadata))?r.metadata:{};
  const u=Object.assign({createdAt:new Date(r.created_at).getTime(),supabase:true},meta);

  /*
   * V5.40 BATCH 2 — Account status comes ONLY from users.status.
   *
   * Before this fix, an old metadata.status='pending' or 'rejected' could
   * override a real users.status='active'. That could make an already
   * approved Rider appear pending again after refresh/background hydrate.
   */
  let status;
  if(r.status==='suspended'||r.status==='deleted') status=r.status;
  else if(r.role==='customer'||r.role==='admin') status='approved';
  else if(r.status==='active') status='approved';
  else if(r.status==='rejected') status='rejected';
  else status='pending';

  /* identity/role/status always come from real columns, never metadata */
  u.id=r.id;
  u.authUserId=r.auth_user_id;
  u.type=r.role;
  u.name=r.name;
  u.phone=r.phone;
  u.status=status;

  /* Keep legacy/UI fields synchronized with the authoritative status. */
  if(u.type==='rider'){
    u.applicationStatus=status;
    if(status!=='approved'){
      u.available=false;
      u.online=false;
    }
  }

  delete u.password;
  return u;
}

function qtOrderToRow(o){
  const pickup=o.pickup||{};
  const delivery=o.delivery||{};
  return {id:qtUuidLike(o.id)?o.id:undefined,order_number:String(o.orderNumber||o.orderNo||o.id||uid()),customer_id:o.customerId||null,shop_id:o.shopProfileId||null,technician_id:o.technicianProfileId||null,rider_id:o.riderProfileId||null,order_type:o.orderType==='service'?'service':'shopping',status:qtOrderStatusToDb(o.status),subtotal:Number(o.subtotal||0),delivery_fee:Number(o.deliveryFee||0),total_amount:Number(o.total||o.totalAmount||0),pickup_address:o.pickupAddress??pickup.address??null,pickup_latitude:o.pickupLat??pickup.lat??null,pickup_longitude:o.pickupLng??pickup.lng??null,delivery_address:o.deliveryAddress??delivery.address??null,delivery_latitude:o.deliveryLat??delivery.lat??null,delivery_longitude:o.deliveryLng??delivery.lng??null,note:(`__QT_ORDER_STATUS__=${o.status}
`+(o.note||'')).trim()||null,created_at:qtIso(o.createdAt),updated_at:qtIso(Date.now())};

/* V5.33 performance: hydrate runs in the background — it must never block first paint or login.

let QT_DB_HYDRATING=false, QT_DB_HYDRATE_QUEUED=null, QT_DB_FULL_TRIED=false;
async function qtBackgroundHydrate(opts){
  opts=opts||{light:false};
  if(!qtAccessToken()){ QT_DB_READY.value=true; return; }
  if(QT_DB_HYDRATING){ /* already loading: remember one follow-up run instead of running two loads at once */
    if(!QT_DB_HYDRATE_QUEUED || !opts.light) QT_DB_HYDRATE_QUEUED=opts;
    return;
  }
  if(QT_SYNC.busy){ setTimeout(()=>qtBackgroundHydrate(opts),1000); return; } /* a sync poll is in flight; try again shortly */

  if(!token){ QT_DB_READY.value=true; return; }

  try{
    await qtHydrateDatabase(opts);
    try{ if(typeof qtPullSystemSettings==='function') await qtPullSystemSettings(); }catch(e){ console.warn('system settings pull failed',e); }
    try{ if(typeof qtPullGpRates==='function') await qtPullGpRates(); }catch(e){ console.warn('gp rates pull failed',e); }

  }catch(err){
    console.error('Background hydrate failed:',err);

    QT_SYNC.dirty={}; QT_SYNC.busy=false; QT_DB_HYDRATING=false;
  }
  const now=qtAccessToken();
  if(!now){ qtResetCache(); QT_DB_HYDRATE_QUEUED=null; return; } /* logged out while loading */
  if(now!==token) QT_DB_HYDRATE_QUEUED={light:false}; /* another account signed in while loading: load again for it */
  else if(ok) qtRerenderAfterHydrate();

  if(q) setTimeout(()=>qtBackgroundHydrate(q),0);

  const hasCoords=Number.isFinite(Number(lat))&&Number.isFinite(Number(lng));

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ---------- Central Notification Engine ----------
   General notifications: vibration once.
   Important notifications: vibration pattern once.
   Action-required notifications:
   - Rider new job: voice + repeating vibration until Accept
   - Customer rider arrival: voice + repeating vibration until Acknowledge
   Shop/Admin/Technician: visual + vibration only; no voice.
*/
const QT_NOTIFY_VIBRATION = {
  normal: [180],
  important: [260,120,260],
  critical: [500,160,500,160,900]
};
const qtNotificationVibrationTimers = {};

function qtVibrate(pattern){
  try{
    if(navigator && typeof navigator.vibrate === 'function'){
      navigator.vibrate(pattern);
      return true;
    }
  }catch(e){}
  return false;
}
function qtNotificationPriority(n){
  if(!n) return 'normal';
  const t=String(n.type||'').toLowerCase();
  if(['rider_arrived','rider_job','rider_job_offer'].includes(t)) return 'critical';
  if(['new_order','order_update','dispatch','support','approval','admin_alert'].includes(t)) return 'important';
  if(String(n.title||'').includes('มีงานจัดส่งใหม่') || String(n.title||'').includes('ไรเดอร์ของคุณมาถึงแล้ว')) return 'critical';
  return 'normal';
}
function qtStartNotificationVibration(n){
  if(!n || n.read || n.dismissed) return;
  const key=String(n.id||uid());
  qtStopNotificationVibration(key);
  const priority=qtNotificationPriority(n);
  if(priority==='critical'){
    const run=()=>qtVibrate(QT_NOTIFY_VIBRATION.critical);
    run();
    qtNotificationVibrationTimers[key]=setInterval(run,2200);
  }else{
    qtVibrate(priority==='important' ? QT_NOTIFY_VIBRATION.important : QT_NOTIFY_VIBRATION.normal);
  }
}
function qtStopNotificationVibration(key){
  if(key && qtNotificationVibrationTimers[key]){
    clearInterval(qtNotificationVibrationTimers[key]);
    delete qtNotificationVibrationTimers[key];
  }
  try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(0); }catch(e){}
}
function qtHandleNewNotification(n){
  const cur=currentUser();
  if(!cur || !n || n.userId!==cur.id) return;
  qtStartNotificationVibration(n);
  showLiveToast((n.title||'การแจ้งเตือน')+': '+(n.body||n.message||''), n.link);
}

function pushNotification(userId, title, body, link, type, referenceId){
  let all = dbGet('qt_notifications',[]);
  const now=Date.now();
  const safeLink=link||undefined;
  const inferred=qtNotifDbParts({link:safeLink,type,referenceId});
  /* Batch 5: prevent duplicate notifications caused by overlapping polling/monitors.
     The same user + title + body + link within a short window is one event. */
  const duplicate=all.find(n=>
    n.userId===userId &&
    String(n.title||'')===String(title||'') &&
    String(n.body||n.message||'')===String(body||'') &&
    String(n.link||'')===String(safeLink||'') &&
    now-Number(n.createdAt||0)<4000
  );
  if(duplicate){
    if(!duplicate.read) qtHandleNewNotification(duplicate);
    return duplicate;
  }
  const n={
    id:uid(),
    userId,
    title:title||'การแจ้งเตือน',
    body:body||'',
    link:safeLink,
    type:inferred.type,
    referenceId:referenceId || inferred.ref || null,
    read:false,
    createdAt:now
  };
  all.push(n);
  dbSet('qt_notifications', all);
  qtHandleNewNotification(n);
  return n;
}

function customerOrderLockRoute(user, page, param){
  if(!user || user.type!=='customer') return false;

  if(page !== 'order' || param !== active.id){

function acknowledgeRiderArrival(){

let qtAudioUnlocked=false;

function qtUnlockAudio(){
  qtAudioUnlocked=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      if(!qtArrivalAudioContext) qtArrivalAudioContext=new AC();
      if(qtArrivalAudioContext.state==='suspended') qtArrivalAudioContext.resume();
    }
  }catch(e){}
  // SpeechSynthesis on iOS is more reliable after a user gesture.
  try{

      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(' ');
      u.lang='th-TH'; u.volume=0;

    }
  }catch(e){}
}

function checkRiderPendingOffer(){
  const user=currentUser();
  if(!user || user.type!=='rider') return;
  const order=getRiderPendingOffer(user.id);

    if(qtRiderJobAlertActive) stopRiderJobAlert();
    return;
  }

  // Hard-lock the rider to the assigned order. Even direct hash navigation
  // cannot open another page while the offer is waiting.
  const current=(location.hash||'').replace('#','');
  if(current!=='order/'+order.id){
    location.hash='order/'+order.id;
  }
  if(!qtRiderJobAlertActive || qtRiderJobAlertOrderId!==order.id){
    startRiderJobAlert(order);
  }

function riderOfferRouteLock(user,page,param){
  if(!user || user.type!=='rider') return false;
  const offer=getRiderPendingOffer(user.id);
  if(!offer) return false;
  if(page!=='order' || param!==offer.id){
    navigate('order/'+offer.id);
    return true;
  }
  return false;
}

function qtAdminOnly(){

function qtAudit(action, data={}){
  const u=currentUser();
  const logs=dbGet('qt_audit_log',[]);
  const d=(data&&typeof data==='object')?data:{};
  /* V5.53: audit_logs.entity_type is NOT NULL in Supabase. Many callers only
     supplied orderId/promotionId/etc., so infer a stable entity type/id before
     the row is persisted. */
  let entityType=d.entityType||d.entity_type||null;
  let entityId=d.entityId||d.entity_id||null;
  if(!entityType){
    const pairs=[
      ['orderId','order'],['order_id','order'],
      ['promotionId','promotion'],['promotion_id','promotion'],
      ['shopId','shop'],['shop_id','shop'],
      ['userId','user'],['user_id','user'],
      ['riderId','rider'],['rider_id','rider'],
      ['technicianId','technician'],['technician_id','technician'],
      ['productId','product'],['product_id','product'],
      ['customerId','customer'],['customer_id','customer']
    ];
    for(const [k,t] of pairs){
      if(d[k]!==undefined && d[k]!==null && String(d[k]).trim()!==''){ entityType=t; entityId=d[k]; break; }
    }
  }
  if(!entityType) entityType='system';
  if(!entityId || !qtUuidLike(entityId)) entityId=null;
  logs.push({id:uid(), action, actorId:u?.id||null, actorRole:u?.type||null, entityType, entityId, at:Date.now(), ...d});
  dbSet('qt_audit_log',logs);
}

async function adminDeleteUser(id){
  const admin=qtAdminOnly(); if(!admin)return; const users=dbGet('qt_users',[]); const u=users.find(x=>x.id===id);
  if(!u){toast('ไม่พบผู้ใช้');return;} if(u.type==='admin'){toast('ไม่สามารถลบบัญชี Admin ได้');return;}
  if(!confirm(`ยืนยันลบ ${roleLabel(u.type)} “${u.name||u.phone}” หรือไม่?`))return;
  try{await qtDeleteUserFromDatabase(u);QT_DB_CACHE.qt_users=users.filter(x=>x.id!==id);qtAudit('user_delete',{userId:id,role:u.type,name:u.name});toast('ลบผู้ใช้งานออกจากฐานข้อมูลแล้ว');renderAdminGovernance();}catch(e){console.error(e);toast('ลบไม่สำเร็จ: '+e.message);}
}
async function adminDeleteOrder(orderId){
  const admin=qtAdminOnly(); if(!admin)return;
  const orders=dbGet('qt_orders',[]); const o=orders.find(x=>x.id===orderId);
  if(!o){toast('ไม่พบออเดอร์');return;}
  if(!confirm(`ยืนยันลบออเดอร์ ${displayOrderNumber(o)} หรือไม่?\n\nAdmin สามารถลบได้ทุกสถานะ การลบนี้ถาวร`))return;
  try{
    await qtDeleteOrderFromDatabase(orderId);
    [o.customerId,o.shopId,o.riderId].filter(Boolean).forEach(id=>pushNotification(id,'🗑️ ออเดอร์ถูกลบโดย Admin',`เลขออเดอร์ ${displayOrderNumber(o)} ถูกลบออกจากระบบ`,'home'));
    QT_DB_CACHE.qt_orders=orders.filter(x=>x.id!==orderId);
    delete QT_DB_CACHE[chatKey(orderId)]; delete QT_DB_CACHE[chatKey(orderId)+'_deleteAt'];
    qtAudit('order_delete',{orderId,orderNumber:displayOrderNumber(o),status:o.status,force:true});
    toast('ลบออเดอร์ออกจากฐานข้อมูลแล้ว');
    renderAdminOrderCenter(admin);
  }catch(e){console.error(e);toast('ลบออเดอร์ไม่สำเร็จ: '+e.message);}
}

window.qtUserCategory=function(type){
  document.querySelectorAll('.qt-user-category-btn').forEach(b=>b.classList.toggle('active',b.dataset.userCategory===type));
  document.querySelectorAll('.qt-user-category-panel').forEach(p=>p.classList.toggle('active',p.dataset.userPanel===type));

/* ---------- Router ---------- */
function navigate(hash){
  const target=String(hash||'home').replace(/^#/,'');
  const current=(location.hash||'#home').replace(/^#/,'');
  if(current===target){ router(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  location.hash = target;
}
function qtGoBack(){
  if(history.length>1){ history.back(); return; }
  const u=currentUser(); navigate(!u?'login':(u.type==='customer'?'home':(u.type==='admin'?'admin':'dashboard')));
}
function qtLandingPage(user){ return !user?'login':(user.type==='customer'?'home':(user.type==='admin'?'admin':'dashboard')); }
window.addEventListener('hashchange', router);
window.addEventListener('pageshow', ()=>{
  const saved=sessionStorage.getItem('qt_rider_register_hash');
  if(saved && (location.hash==='' || location.hash==='#home')){
    sessionStorage.removeItem('qt_rider_register_hash');
    history.replaceState(null,'',saved);
    router();
  }
});

function qtSyncHash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return h; }
function qtSyncSignature(){
  const me=currentUser();
  const main=qtSyncHash(JSON.stringify([me&&me.status,dbGet('qt_orders',[]),dbGet('qt_techjobs',[]),dbGet('qt_notifications',[])]));
  const chat=qtSyncHash(JSON.stringify(Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&!k.endsWith('_deleteAt')).sort().map(k=>[k,(QT_DB_CACHE[k]||[]).length])));
  return {main,chat};
}
function qtSyncRerender(before,after){
  const user=currentUser(); if(!user) return;
  const parts=(location.hash.replace('#','')||'home').split('/'); const name=parts[0], param=parts[1];
  if(name==='approval-pending' && isApproved(user)){ toast('บัญชีของคุณได้รับการอนุมัติแล้ว'); navigate('dashboard'); return; }
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; /* never interrupt typing */
  if(name==='order' && before.main===after.main && after.chat!==before.chat){ try{ renderOrderChatArea(param); }catch(e){} return; }
  if(before.main===after.main) return;
  const safe=['dashboard','orders','shop-orders','order','rider-jobs','technician-jobs','technician-job','notifications','admin','admin-orders','admin-gp','admin-cash','admin-support','admin-gp-rates','shop-settlement'];
  if(!safe.includes(name)) return;
  const typed=[].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typed) return;
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}
async function qtSyncTick(force){
  if(QT_SYNC.busy || QT_DB_HYDRATING) return;
  if(document.hidden && !force) return;
  if(!qtAccessToken()) return;
  if(QT_SYNC.pending>0 || Date.now()-QT_SYNC.lastWrite<2500) return; /* let our own writes land first */
  QT_SYNC.busy=true; QT_SYNC.dirty={};
  try{
    QT_SYNC.tick++;
    const me=currentUser();
    const full=(QT_SYNC.tick%8===0)||(me&&!isApproved(me))||!QT_DB_FULL_TRIED; /* light poll every 8s, full refresh about once a minute */
    const before=qtSyncSignature();
    const seenNotifs=new Set(dbGet('qt_notifications',[]).map(n=>n.id));
    await qtHydrateDatabase({light:!full});
    if(!qtAccessToken()){ qtResetCache(); return; } /* logged out while fetching */
    Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
    if(me){ dbGet('qt_notifications',[]).forEach(n=>{ if(n.userId===me.id && !n.read && !seenNotifs.has(n.id)){ try{ qtHandleNewNotification(n); }catch(e){} } }); }
    const after=qtSyncSignature();
    if(after.main!==before.main||after.chat!==before.chat) qtSyncRerender(before,after);
  }catch(e){ console.warn('sync tick failed',e); }
  finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
}
function qtStartSyncLoop(){
  if(QT_SYNC.timer) return;
  QT_SYNC.timer=setInterval(()=>qtSyncTick(),8000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) qtSyncTick(); });
}
window.addEventListener('DOMContentLoaded', async ()=>{
  /* V5.33: show the page first, load Supabase data in the background */
  const hadSession=!!qtAccessToken();
  if(hadSession) await qtRestoreOwnUser(); /* one small request (own account row) so a refresh keeps the signed-in user */
  router();
  qtStartSyncLoop(); /* does not block the UI */
  setTimeout(()=>{ qtBackgroundHydrate({light:false}); },0);
});

/* V5.33: a page that throws while rendering used to leave the previous screen frozen with dead buttons and no clue why. Now the error is logged and shown. */
function router(){
  try{ qtRouteRender(); }
  catch(err){ console.error('router error',err); try{ toast('แสดงหน้านี้ไม่สำเร็จ: '+String((err&&err.message)||err).slice(0,90)); }catch(e){} }
}
function qtRouteRender(){
  destroyMaps();
  const hash = location.hash.replace('#','') || 'home';
  const [page, param] = hash.split('/');
  const user = currentUser();

  /* Login-only entry: signed-out visitors can only see login / register pages */
  if(!user && !['login','register','rider-register'].includes(page)){ navigate('login'); return; }
  /* Non-customer roles have no customer home page: send them to their own landing page */
  if(user && user.status==='suspended' && !['approval-pending','login'].includes(page)){ navigate('approval-pending'); return; }
  if(user && page==='home' && user.type!=='customer'){ navigate(user.type==='admin'?'admin':'dashboard'); return; }

  /* V5.39 BATCH 1 — Rider registration/approval route guard.
     A pending/rejected/suspended rider must never be sent back to rider-setup.
     rider-setup is reserved for an approved rider's profile management.
     This also protects against a stale browser hash such as #rider-setup
     after a successful registration or after a background Supabase hydrate. */
  if(user && user.type==='rider' && page==='rider-setup' && user.status!=='approved'){
    navigate('approval-pending');
    return;
  }

  if(riderOfferRouteLock(user,page,param)) return;


  // Customer rule: after placing an order, the customer is automatically
  // kept on that order's status/chat page until the order is completed
  // (or cancelled). This prevents starting another order while one is active.
  /* V5.33: customers are no longer locked onto the order status page; they can browse freely while an order is active */

  switch(page){
    case 'home': renderHome(); break;
    case 'register': renderRegister(); break;
    case 'rider-register': renderRiderRegistration(); break;
    case 'login': renderLogin(); break;
    case 'dashboard': renderDashboard(); break;
    case 'admin': renderAdminDashboard(currentUser()); break;
    case 'admin-governance': renderAdminGovernance(); break;
    case 'admin-orders': renderAdminOrderCenter(currentUser()); break;
    case 'admin-gp': renderAdminGpSettlement(); break; /* V5.31 addition */
    case 'admin-cash': renderAdminCash(); break;
    case 'admin-support': renderAdminSupportInbox(); break;
    case 'admin-gp-rates': renderAdminGpRates(); break;
    case 'shop-settlement': renderShopSettlement(); break; /* V5.31 addition */
    case 'approval-pending': renderApprovalPending(currentUser()); break;
    case 'shop-setup': renderShopSetup(); break;
    case 'shop-products': renderShopProducts(); break;
    case 'shop-orders': renderOrders(); break;
    case 'shop-modules': renderShopModules(); break;
    case 'shop-promote': renderShopPromote(); break;
    case 'promote-board': renderPromoteBoard(); break;
    case 'search': renderSearch(); break;
    case 'shop-view': renderShopView(param); break;
    case 'cart': renderCart(); break;
    case 'checkout': renderCheckout(); break;
    case 'orders': renderOrders(); break;
    case 'order': renderOrderDetail(param); break;
    case 'rider-setup': renderRiderSetup(); break;
    case 'rider-jobs': renderRiderJobs(); break;
    case 'technician-setup': renderTechnicianSetup(); break;
    case 'technician-jobs': renderTechnicianJobs(); break;
    case 'technician-job': renderTechnicianJobDetail(param); break;
    case 'call-technician': renderCallTechnician(); break;
    case 'request-quote': renderRequestQuote(); break;
    case 'emergency': renderEmergency(); break;
    case 'notifications': renderNotifications(); break;
    default: renderHome();
  }
  window.scrollTo(0,0);
}

async function compressRiderImage(file, maxSize=1400, quality=0.78){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const scale=Math.min(1, maxSize/Math.max(im.width,im.height));
        const w=Math.max(1,Math.round(im.width*scale)), h=Math.max(1,Math.round(im.height*scale));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,w,h);
        resolve(c.toDataURL('image/jpeg',quality));
      };
      im.onerror=reject; im.src=reader.result;
    };
    reader.onerror=reject; reader.readAsDataURL(file);
  });
}

const RIDER_DRAFT_DB='qt_rider_draft_v522';
function riderDraftOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(RIDER_DRAFT_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function saveRiderDraftFile(id,data,name){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({data,name,at:Date.now()},id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){console.warn('draft save failed',e);}}
async function loadRiderDraftFile(id){try{const db=await riderDraftOpen();const v=await new Promise((res,rej)=>{const tx=db.transaction('files','readonly');const r=tx.objectStore('files').get(id);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});db.close();return v;}catch(e){return null;}}
async function clearRiderDraft(){try{const db=await riderDraftOpen();await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error);});db.close();}catch(e){}}
async function riderFilePreview(inputId, previewId){
  const input=document.getElementById(inputId), img=document.getElementById(previewId);
  if(!input || !input.files[0]) return;
  const file=input.files[0];
  if(file.size > 8*1024*1024){ input.value=''; toast('ไฟล์ต้องมีขนาดไม่เกิน 8 MB'); return; }
  const nameEl=document.getElementById(inputId+'-name');
  if(nameEl) nameEl.textContent=file.name || 'เลือกไฟล์แล้ว';
  try{
    let data='';
    if(file.type.startsWith('image/')){
      data=await compressRiderImage(file);
      if(img){ img.src=data; img.style.display='block'; }
    }else{
      data=await readFileAsDataURL(file);
    }
    // เก็บเอกสารทุกชิ้นไว้ใน IndexedDB ชั่วคราว เพื่อไม่ให้ iPhone/Safari ทำไฟล์หาย
    await saveRiderDraftFile(inputId,data,file.name||inputId);
    if(inputId==='rr-photo'){
      try{ sessionStorage.setItem('qt_rider_profile_draft',JSON.stringify({data,name:file.name||'profile.jpg',at:Date.now()})); }catch(err){}
    }
  }catch(err){ console.error(err); toast('ไม่สามารถอ่านไฟล์ได้ กรุณาเลือกไฟล์ใหม่'); }
}

async function handleRiderRegistration(e){
  e.preventDefault();
  const f=id=>document.getElementById(id);
  const name=qtCleanText(f('rr-name').value), phone=f('rr-phone').value.trim().replace(/[-\s]/g,''), password=f('rr-password').value;
  if(!name || !phone || !password){ toast('กรุณากรอกข้อมูลส่วนตัวให้ครบ'); return false; }
  if(!/^0[0-9]{9}$/.test(phone)){ toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678'); return false; }
  if(password.length < 6){ toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร'); return false; }
  if(!f('rr-province').value || !f('rr-district').value){ toast('กรุณาเลือกจังหวัดและอำเภอ/เขต'); return false; }
  const files=['rr-photo','rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo'];
  const data={};
  for(const id of files){
    const el=f(id);
    if(el && el.files && el.files[0]){
      const file=el.files[0];
      data[id]=file.type.startsWith('image/') ? await compressRiderImage(file) : await readFileAsDataURL(file);
    }else{
      const draft=await loadRiderDraftFile(id);
      if(draft&&draft.data) data[id]=draft.data;
    }
  }
  const requiredDocs=['rr-photo','rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo'];
  const missing=requiredDocs.filter(id=>!data[id]);
  if(missing.length){
    const labels={'rr-photo':'รูปถ่ายหน้าตรง','rr-id-front':'บัตรประชาชนด้านหน้า','rr-id-back':'บัตรประชาชนด้านหลัง','rr-license':'ใบขับขี่','rr-prb':'พ.ร.บ. รถ','rr-vehicle-photo':'รูปถ่ายคู่กับรถ'};
    toast('กรุณาอัปโหลด: '+missing.map(x=>labels[x]).join(', ')); return false;
  }
  const submitBtn=e.submitter||document.querySelector('.rider-submit'); if(submitBtn) submitBtn.disabled=true;
  try{
    toast('กำลังสร้างบัญชีและส่งใบสมัคร...');
    /* V5.32: riders now get a real Supabase Auth account (same as every other role) so they can log in later.
       The password is sent to Supabase Auth only — it is never stored in the user object or in the database rows. */
    const result=await qtCreateSupabaseUser({type:'rider',name,phone,password,email:''});
    const p=result.profile;
    const user=Object.assign(qtUserFromRow(p),{
      email:qtCleanText(f('rr-email').value), serviceArea:qtCleanText(f('rr-area').value),
      serviceProvince:f('rr-province').value, serviceDistrict:f('rr-district').value,
      vehicleType:f('rr-vehicle').value, vehiclePlate:qtCleanText(f('rr-plate').value),
      vehicleMake:qtCleanText(f('rr-make').value), vehicleModel:qtCleanText(f('rr-model').value),
      profileImage:data['rr-photo'], idCardFrontImage:data['rr-id-front'], idCardBackImage:data['rr-id-back'],
      driverLicenseImage:data['rr-license'], compulsoryInsuranceImage:data['rr-prb'], vehiclePhoto:data['rr-vehicle-photo'],
      status:'pending', applicationStatus:'pending', applicationSubmittedAt:Date.now(), available:false, online:false
    });
    QT_DB_CACHE.qt_users=[user];
    setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:result.session.access_token,refreshToken:result.session.refresh_token||null,expiresAt:result.session.expires_at||Math.floor(qtJwtExpiryMs(result.session.access_token)/1000)||null,role:p.role});
    /* V5.38: registration success must not be routed back to rider-setup.
       The Auth account + users row have already been created by qtCreateSupabaseUser().
       Persist the completed rider application in the background; if a secondary profile/document
       sync fails, keep the applicant on approval-pending instead of making them re-enter everything. */
    let persistError=null;
    try{
      await qtTrackPersist(qtPersistKey('qt_users',[user]));
    }catch(err){
      persistError=err;
      console.error('QueueGo rider application sync failed after successful registration:',err);
      qtSyncFailed('qt_users',err);
    }
    await clearRiderDraft();
    try{ sessionStorage.removeItem('qt_rider_profile_draft'); sessionStorage.removeItem('qt_rider_register_hash'); }catch(err){}
    pushNotification(user.id,'📄 ส่งใบสมัครไรเดอร์แล้ว','ใบสมัครและเอกสารของคุณอยู่ระหว่างการตรวจสอบโดย Admin','approval-pending');
    if(persistError){
      toast('สมัครไรเดอร์สำเร็จแล้ว และกำลังซิงก์เอกสารกับระบบ');
    }else{
      toast('ส่งใบสมัครสำเร็จ รอ Admin ตรวจสอบ');
    }
    navigate('approval-pending');
  }catch(err){
    console.error('QueueGo rider registration error',err);
    qtRegisterErrorToast(err);
  }finally{ if(submitBtn) submitBtn.disabled=false; }
  return false;
}

function qtRegisterErrorToast(err){
  if(err&&err.message==='AUTH_CONFIRMATION_REQUIRED') toast('สมัครไม่สำเร็จ: Supabase ยังเปิดการยืนยันอีเมล ทำให้ยังไม่มี Session สำหรับสร้างข้อมูลสมาชิก');
  else if(/already registered|User already registered|duplicate key|users_phone_key|users_auth_user_id_key/i.test((err&&err.message)||'')) toast('สมัครไม่สำเร็จ: เบอร์นี้ถูกใช้สมัครแล้ว หรือมีข้อมูลซ้ำในฐานข้อมูล');
  else if(/^DB_ERROR_/.test((err&&err.message)||'') || /row-level security|permission denied|violates row-level security/i.test((err&&err.message)||'')) toast('สมัครไม่สำเร็จ: Supabase ปฏิเสธการบันทึกข้อมูล (RLS/สิทธิ์ตาราง users)');
  else toast('สมัครสมาชิกไม่สำเร็จ: '+((err&&err.message)||'ไม่ทราบสาเหตุ'));
}

async function handleRegister(e){
  e.preventDefault();
  const type=document.getElementById('reg-type').value;
  const mode=document.getElementById('reg-contact-mode')?.value||'phone';
  const name=qtCleanText(document.getElementById('reg-name').value);
  const phone=document.getElementById('reg-phone').value.trim().replace(/[-\s]/g,'');
  const email=document.getElementById('reg-email')?.value.trim().toLowerCase()||'';
  const password=document.getElementById('reg-password').value;
  const passwordConfirm=document.getElementById('reg-password-confirm')?.value||'';
  if(password.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return false;}
  if(password!==passwordConfirm){toast('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');return false;}
  if(!name){toast('กรุณากรอกชื่อ');return false;}
  if(mode==='phone'&&!/^0[0-9]{9}$/.test(phone)){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678');return false;}
  if(mode==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('กรุณากรอกอีเมลให้ถูกต้อง');return false;}
  const submitBtn=e.submitter||null;if(submitBtn)submitBtn.disabled=true;
  try{
    toast('กำลังสร้างบัญชีและบันทึกข้อมูล...');
    const result=await qtCreateSupabaseUser({
      type,name,phone:mode==='phone'?phone:'',password,email:mode==='email'?email:''
    });
    if(result.needsEmailConfirmation){
      await renderRegistrationSuccess(null,{needsEmailConfirmation:true,email});
      return false;
    }
    const p=result.profile;
    const user={
      id:p.id,authUserId:p.auth_user_id,type:p.role,name:p.name,phone:p.phone||'',
      email:mode==='email'?email:'',
      status:p.status==='active'?(type==='customer'?'approved':'pending'):p.status,
      createdAt:new Date(p.created_at||Date.now()).getTime(),supabase:true
    };
    const nextUsers=dbGet('qt_users',[]).filter(u=>
      String(u.id)!==String(user.id)&&(!user.phone||String(u.phone||'').trim()!==user.phone)
    );
    nextUsers.push(user);QT_DB_CACHE.qt_users=nextUsers;
    setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:result.session.access_token,refreshToken:result.session.refresh_token||null,expiresAt:result.session.expires_at||Math.floor(qtJwtExpiryMs(result.session.access_token)/1000)||null,role:p.role});

    /* V5.33 FIX: once Auth + users profile are both successful, registration is complete.
       Do not let the success-page renderer/background UI throw and turn a successful
       registration into a false "สมัครไม่สำเร็จ" message. Pending non-customer accounts
       go directly to the existing approval-pending page. */
    const pendingApproval = user.type!=='customer' && user.type!=='admin' && user.status!=='approved';
    if(pendingApproval){
      if(window.__qtRegistrationTimer) clearTimeout(window.__qtRegistrationTimer);
      navigate('approval-pending');
      setTimeout(()=>{ try{ qtBackgroundHydrate({light:false}); }catch(bgErr){ console.warn('QueueGo background hydrate after registration:',bgErr); } },0);
      return false;
    }

    try{
      await renderRegistrationSuccess(user);
    }catch(renderErr){
      console.warn('QueueGo registration success-page render failed; keeping successful session:',renderErr);
      navigate(user.type==='customer'?'dashboard':'home');
    }
  }catch(err){
    console.error('QueueGo Supabase registration error',err);
    qtRegisterErrorToast(err);
  }finally{if(submitBtn)submitBtn.disabled=false;}
  return false;
}

async function handleLogin(e){
  e.preventDefault();
  const loginValue = document.getElementById('login-phone').value.trim();
  const password = document.getElementById('login-password').value;
  if(password.length < 1){ toast('กรุณากรอกรหัสผ่าน'); return false; }
  const submitBtn=e.submitter||(e.target&&e.target.querySelector?e.target.querySelector('button[type=submit]'):null)||null;
  if(submitBtn&&submitBtn.disabled) return false; /* already signing in */
  const submitLabel=submitBtn?submitBtn.textContent:'';
  if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent='กำลังเข้าสู่ระบบ...'; }
  try{
    // รองรับทั้งบัญชีที่ใช้เบอร์โทรเป็นตัวระบุ และบัญชี Supabase Auth ที่มีอีเมลจริง เช่นบัญชี Admin
    const authEmail = loginValue.includes('@') ? loginValue : qtAuthEmailFromPhone(loginValue);
    const auth=await qtSupabaseAuth('token?grant_type=password',{email:authEmail,password});
    let p=await qtLoadOwnSupabaseUser(auth.access_token,auth.user.id);
    if(!p){
      const meta=auth.user?.user_metadata||{};
      const role=['customer','shop','technician','rider','admin'].includes(meta.role)?meta.role:'customer';
      const name=qtCleanText(meta.name||'ผู้ใช้');
      const phone=String(meta.phone||'').trim()||null;
      try{
        const rows=await qtSupabaseTable('users?select=id,auth_user_id,role,name,phone,status,created_at&on_conflict=auth_user_id',{
          method:'POST',accessToken:auth.access_token,
          body:{auth_user_id:auth.user.id,role,name,phone,status:role==='customer'?'active':'pending'}
        });
        p=Array.isArray(rows)?rows[0]:rows;
      }catch(createErr){
        throw new Error('เข้าสู่ระบบสำเร็จ แต่ยังสร้างข้อมูลสมาชิกในฐานข้อมูลไม่ได้: '+createErr.message);
      }
    }
    /* V5.32: status is derived from the real row (column + admin-approved metadata), not guessed from the role */
    const user=qtUserFromRow(p);
    QT_DB_CACHE.qt_users=[user]; qtMarkClean('qt_users');
    setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:auth.access_token,refreshToken:auth.refresh_token||null,expiresAt:auth.expires_at||Math.floor(qtJwtExpiryMs(auth.access_token)/1000)||null,role:p.role});
    if(user.status==='suspended'){ toast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อ Admin'); navigate('approval-pending'); return false; }
    /* V5.33: the critical path ends here (Auth + own profile). Orders/shops/products/chat/etc. load in the background after the page is shown. */
    const kickHydrate=()=>{ setTimeout(()=>{ qtBackgroundHydrate({light:false}); },0); };
    if(user.type!=='customer' && user.type!=='admin' && user.status!=='approved'){ toast('บัญชีนี้ยังรอแอดมินอนุมัติ'); navigate('approval-pending'); kickHydrate(); return false; }
    toast('เข้าสู่ระบบสำเร็จ'); navigate(user.type==='admin'?'admin':(user.type==='customer'?'home':'dashboard'));
    kickHydrate();
  }catch(err){
    console.error('login failed',err);
    if(err && err.name==='TypeError') toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
    else toast('เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง หรือยังไม่ได้เปิดใช้งานบัญชี Supabase');
  }finally{ if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent=submitLabel; } }
  return false;
}

function adminApproveUser(id){
  const admin=currentUser(); if(!admin||admin.type!=='admin'){toast('ไม่มีสิทธิ์');return;}
  let users=dbGet('qt_users',[]); const u=users.find(x=>x.id===id); if(!u){toast('ไม่พบผู้ใช้');return;}
  u.status='approved'; u.approvedAt=Date.now(); u.approvedBy=admin.id;
  if(u.type==='rider'){ u.applicationStatus='approved'; u.available=false; u.online=false; }
  dbSet('qt_users',users); qtAudit('user_approve',{userId:id,role:u.type});
  pushNotification(u.id,'✅ บัญชีได้รับการอนุมัติ','คุณสามารถเริ่มใช้งาน QueueGo ได้แล้ว','dashboard');
  toast('อนุมัติบัญชีแล้ว'); qtAdminStayAfterMutation('qt-sec-approval');
}
function adminRejectUser(id){
  const admin=currentUser(); if(!admin||admin.type!=='admin'){toast('ไม่มีสิทธิ์');return;}
  let users=dbGet('qt_users',[]); const u=users.find(x=>x.id===id); if(!u){toast('ไม่พบผู้ใช้');return;}
  u.status='rejected'; u.rejectedAt=Date.now(); u.rejectedBy=admin.id;
  if(u.type==='rider'){ u.applicationStatus='rejected'; u.available=false; u.online=false; }

function adminSuspendUser(id){
  const admin=currentUser(); if(!admin||admin.type!=='admin'){toast('ไม่มีสิทธิ์');return;}
  let users=dbGet('qt_users',[]); const u=users.find(x=>x.id===id); if(!u){toast('ไม่พบผู้ใช้');return;}
  if(u.type==='admin'){toast('ไม่สามารถระงับบัญชี Admin ได้');return;}
  u.status='suspended'; u.suspendedAt=Date.now(); u.suspendedBy=admin.id; u.available=false; u.online=false;
  if(u.type==='rider') u.applicationStatus='suspended';
  dbSet('qt_users',users);
  pushNotification(u.id,'⛔ บัญชีถูกระงับ','บัญชีของคุณถูกระงับการใช้งานโดย Admin','approval-pending');

function adminUnsuspendUser(id){
  const admin=currentUser(); if(!admin||admin.type!=='admin'){toast('ไม่มีสิทธิ์');return;}
  let users=dbGet('qt_users',[]); const u=users.find(x=>x.id===id); if(!u){toast('ไม่พบผู้ใช้');return;}
  if(u.status!=='suspended'){toast('บัญชีนี้ไม่ได้ถูกระงับ');return;}
  u.status='approved'; u.approvedAt=Date.now(); u.approvedBy=admin.id;
  if(u.type==='rider') u.applicationStatus='approved';
  u.unsuspendedAt=Date.now(); u.unsuspendedBy=admin.id;
  u.suspendedAt=null; u.suspendedBy=null; u.suspendedReason=null;
  u.available=false; u.online=false;
  dbSet('qt_users',users);
  pushNotification(u.id,'🔓 ปลดระงับบัญชีแล้ว','Admin ปลดระงับบัญชีของคุณแล้ว คุณสามารถเข้าสู่ระบบและเปิดรับงานได้อีกครั้ง','dashboard');

}

async function handleShopSetup(e){
  e.preventDefault();
  const users = dbGet('qt_users',[]);
  const user = currentUser();
  const idx = users.findIndex(u=>u.id===user.id);
  const loc = window.__pickedLoc();
  const logoFile = document.getElementById('s-logo').files[0];
  const coverFile = document.getElementById('s-cover').files[0];
  const logo = logoFile ? await readFileAsDataURL(logoFile) : (users[idx].logo||'');
  const cover = coverFile ? await readFileAsDataURL(coverFile) : (users[idx].cover||'');
  Object.assign(users[idx], {
    shopName: document.getElementById('s-name').value,
    name: document.getElementById('s-contact').value,
    phone: document.getElementById('s-phone').value,
    category: document.getElementById('s-category').value,
    address: document.getElementById('s-address').value,
    openTime: document.getElementById('s-open').value,
    closeTime: document.getElementById('s-close').value,
    description: document.getElementById('s-desc').value,
    logo, cover,
    lat: loc.lat, lng: loc.lng,
    modules: users[idx].modules || defaultModules(),
  });
  /* Save the shop profile directly and wait for Supabase to confirm it.
     The old dbSet-only path showed a success toast even when the shop_profiles
     UPDATE was rejected by RLS, leaving customers with the old/missing shop. */
  try{
    const token=await qtGetAccessToken();
    if(!token) throw new Error('ยังไม่ได้เข้าสู่ระบบ');
    const userRow=qtUserToRow(users[idx], true);
    await qtSupabaseTable('users?id=eq.'+encodeURIComponent(users[idx].id),{method:'PATCH',accessToken:token,body:userRow});

    const profileRows=await qtSupabaseTable('shop_profiles?select=id&user_id=eq.'+encodeURIComponent(users[idx].id)+'&limit=1',{accessToken:token});
    const profileBody={shop_name:users[idx].shopName||users[idx].name||'ร้านค้า',phone:users[idx].phone||null,address:users[idx].address||null,latitude:users[idx].lat??null,longitude:users[idx].lng??null,status:users[idx].status==='suspended'?'suspended':'active',metadata:qtUserMetadata(users[idx])};
    if(Array.isArray(profileRows) && profileRows[0]?.id){
      await qtSupabaseTable('shop_profiles?id=eq.'+encodeURIComponent(profileRows[0].id),{method:'PATCH',accessToken:token,body:profileBody});
    }else{
      await qtSupabaseTable('shop_profiles?on_conflict=user_id',{method:'POST',accessToken:token,body:{user_id:users[idx].id,...profileBody}});
    }

    /* Verify the coordinates actually landed in the database before saying success. */
    const verify=await qtSupabaseTable('shop_profiles?select=id,shop_name,status,latitude,longitude&user_id=eq.'+encodeURIComponent(users[idx].id)+'&limit=1',{accessToken:token});
    const saved=Array.isArray(verify)?verify[0]:null;
    if(!saved) throw new Error('ไม่พบข้อมูลร้านในฐานข้อมูลหลังบันทึก');
    if(Number(saved.latitude)!==Number(users[idx].lat) || Number(saved.longitude)!==Number(users[idx].lng)){
      throw new Error('พิกัดร้านในฐานข้อมูลไม่ตรงกับพิกัดที่บันทึก');
    }

    QT_DB_CACHE.qt_users=users;
    try{ qtMarkClean('qt_users'); }catch(e){}
    toast('บันทึกข้อมูลร้านสำเร็จ — ยืนยันพิกัดกับฐานข้อมูลแล้ว');
    navigate('dashboard');
  }catch(err){
    console.error('Shop profile save failed:',err);
    toast('บันทึกข้อมูลร้านไม่สำเร็จ: '+String(err?.message||err).slice(0,140));
  }
  return false;
}

async function handleSaveProduct(e, id){
  e.preventDefault();

  const image = file ? await readFileAsDataURL(file) : (id ? products.find(x=>x.id===id).image : '');
