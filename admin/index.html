/* =========================================================================

/* ---------- Supabase-backed application data layer ----------

      const raw=sessionStorage.getItem(key);
      if(raw!==null){
        const parsed=JSON.parse(raw);
        QT_DB_CACHE[key]=parsed;

<script id="qg-admin-control-restore">
(function(){

  };

    }catch(e){toast('บันทึกสถานะไม่สำเร็จ: '+e.message);return}
    finally{busy.delete(id)}
    toast(({approve:'อนุมัติ',reject:'ไม่อนุมัติ',suspend:'ระงับ',restore:'ปลดระงับ'})[action]+'บัญชีแล้ว');

      if(location.hash==='#admin-governance'){try{renderAdminGovernance();setTimeout(()=>qtAdminTab(action==='approve'||action==='reject'?'qt-sec-approval':'qt-sec-security'),0)}catch(e){console.warn('admin account post-commit render failed',e)}}

    }).catch(e=>console.warn('admin account post-commit hydrate failed',e));
  }

    catch(e){toast('ดำเนินการไม่สำเร็จ: '+(e.message||e))}
    finally{busy.delete(id)}

  window.adminRejectUser=async id=>{
    const local=dbGet('qt_users',[]).find(x=>String(x.id)===String(id));

    catch(e){toast('ปฏิเสธร้านไม่สำเร็จ: '+(e.message||e))}
    finally{busy.delete(id)}
  };
  window.adminSecurityAction=(action,id)=>accountAction(action,id);
  window.adminSuspendUser=id=>accountAction('suspend',id);
  window.adminUnsuspendUser=id=>accountAction('restore',id);

      '<h3>🎛️ เปิด/ปิดฟีเจอร์และราคา</h3>'+
      '<p class="qt-admin-note">ค่าด้านล่างเป็นค่าที่มีผลกับออเดอร์ใหม่เท่านั้น ออเดอร์ที่สร้างแล้วใช้ราคาที่บันทึกไว้เดิม</p>'+
      '<div class="qt-settings-grid">'+
        '<label class="qt-settings-toggle">ตลาดสดซื้อหลายร้าน <input id="qg-feature-market" type="checkbox" '+(getActive('feature.market_multi_shop')?'checked':'')+'></label>'+
        '<label class="qt-settings-toggle">งานพ่วง Route Bundle <input id="qg-feature-bundle" type="checkbox" '+(getActive('feature.route_bundle')?'checked':'')+'></label>'+
        '<label class="qt-settings-toggle">ฝากซัก <input id="qg-feature-laundry" type="checkbox" '+(getActive('feature.laundry')?'checked':'')+'></label>'+
        '<label class="qt-settings-toggle">คิด GP <input id="qg-feature-gp" type="checkbox" '+(getActive('feature.gp')?'checked':'')+'></label>'+
        '<label>GP มาตรฐาน (%)<input id="qg-price-gp" type="number" min="0" max="100" step="0.1" value="'+getActive('pricing.gp_default_rate')+'"></label>'+
        '<label>ค่ารอบพื้นฐานตลาดสด (บาท)<input id="qg-price-market-base" type="number" min="0" step="1" value="'+getActive('pricing.market_base_fee')+'"></label>'+
        '<label>ร้านที่ 2 เพิ่ม (บาท)<input id="qg-price-market-second" type="number" min="0" step="1" value="'+getActive('pricing.market_second_shop_fee')+'"></label>'+
        '<label>ร้านที่ 3 เป็นต้นไป / ร้าน (บาท)<input id="qg-price-market-next" type="number" min="0" step="1" value="'+getActive('pricing.market_additional_shop_fee')+'"></label>'+
        '<label>งานพ่วง: อ้อมได้สูงสุด (กม.)<input id="qg-bundle-detour" type="number" min="0" max="50" step="0.1" value="'+getActive('route_bundle.max_detour_km')+'"></label>'+
        '<label>งานพ่วง: ช้าเพิ่มสูงสุด (นาที)<input id="qg-bundle-delay" type="number" min="0" max="240" step="1" value="'+getActive('route_bundle.max_delay_minutes')+'"></label>'+
        '<label>งานพ่วงพร้อมกันสูงสุด<input id="qg-bundle-max" type="number" min="1" max="5" step="1" value="'+getActive('route_bundle.max_orders')+'"></label>'+
        '<label>รายรับ Rider เพิ่มขั้นต่ำ (บาท)<input id="qg-bundle-rider-min" type="number" min="0" max="5000" step="1" value="'+getActive('route_bundle.min_rider_extra_fee')+'"></label>'+
        '<label>แบ่งส่วนประหยัดให้ลูกค้าคนแรก (%)<input id="qg-bundle-primary-share" type="number" min="1" max="99" step="1" value="'+getActive('route_bundle.primary_savings_percent')+'"></label>'+
        '<label>เริ่มมีผล (เวลาไทย)<input id="qg-platform-effective" type="datetime-local" value="'+bangkokNowInput()+'"></label>'+
      '</div>'+
      '<div class="row-btns" style="margin-top:14px"><button class="btn-primary" type="button" onclick="qgSavePlatformRules()">💾 บันทึก / ตั้งเวลามีผล</button><button class="btn-secondary" type="button" onclick="qgRenderPlatformControls(true)">🔄 โหลดค่าล่าสุด</button></div>'+
      '<p class="qt-admin-note">'+(next?'มีค่าที่ตั้งล่วงหน้า เริ่ม '+new Date(next.effective_from).toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})+' เป็นต้นไป':'ยังไม่มีค่าที่ตั้งล่วงหน้า')+'</p>';
  };

  window.qgSavePlatformRules=async function(){
    const admin=typeof qtAdminOnly==='function'?qtAdminOnly():null;if(!admin)return;
    try{
      const effective=bangkokLocalToIso(document.getElementById('qg-platform-effective')?.value);
      const rows=[
        {rule_key:'feature.market_multi_shop',value:checked('qg-feature-market')},
        {rule_key:'feature.route_bundle',value:checked('qg-feature-bundle')},
        {rule_key:'feature.laundry',value:checked('qg-feature-laundry')},
        {rule_key:'feature.gp',value:checked('qg-feature-gp')},
        {rule_key:'pricing.gp_default_rate',value:num('qg-price-gp',0,100)},
        {rule_key:'pricing.market_base_fee',value:num('qg-price-market-base',0,5000)},
        {rule_key:'pricing.market_second_shop_fee',value:num('qg-price-market-second',0,5000)},
        {rule_key:'pricing.market_additional_shop_fee',value:num('qg-price-market-next',0,5000)},
        {rule_key:'route_bundle.max_detour_km',value:num('qg-bundle-detour',0,50)},
        {rule_key:'route_bundle.max_delay_minutes',value:num('qg-bundle-delay',0,240)},
        {rule_key:'route_bundle.max_orders',value:num('qg-bundle-max',1,5)},
        {rule_key:'route_bundle.min_rider_extra_fee',value:num('qg-bundle-rider-min',0,5000)},
        {rule_key:'route_bundle.primary_savings_percent',value:num('qg-bundle-primary-share',1,99)}
      ].map(r=>({...r,effective_from:effective,note:'Admin platform control'}));
      if(!Number.isInteger(rows.find(r=>r.rule_key==='route_bundle.max_orders').value))throw Error('จำนวนงานพ่วงสูงสุดต้องเป็นจำนวนเต็ม');
      const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
      await qtSupabaseTable('queuego_platform_rules?on_conflict=rule_key,effective_from',{method:'POST',accessToken:token,body:rows});
      try{qtAudit('platform_rules_update',{entityType:'system_settings',entityId:'queuego_platform_rules',effectiveFrom:effective,rules:rows.map(r=>({key:r.rule_key,value:r.value}))})}catch(e){}
      toast(new Date(effective).getTime()>Date.now()+30000?'ตั้งค่าล่วงหน้าแล้ว':'บันทึกการตั้งค่าแล้ว');
      Promise.resolve().then(()=>qgPullPlatformRules()).then(()=>qgRenderPlatformControls(false)).catch(refreshErr=>console.warn('admin platform post-commit refresh failed',refreshErr));
    }catch(e){console.error(e);toast('บันทึกไม่สำเร็จ: '+String(e.message||e).slice(0,100))}
  };
})();
</script>


<script id="qg-admin-home-banner-manager">
(function(){
  const KEY='home_service_banner',BUCKET='queuego-banners';
  const h=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const normalize=config=>{
    const cfg=config&&typeof config==='object'?JSON.parse(JSON.stringify(config)):{};
    const source=Array.isArray(cfg.slides)?cfg.slides:[];
    cfg.display='home';cfg.version='2';cfg.rotation_ms=Math.max(3000,Math.min(15000,Number(cfg.rotation_ms)||5000));
    cfg.slides=[1,2,3].map(slot=>{
      const found=source.find(item=>Number(item?.slot)===slot)||source[slot-1]||{};
      return Object.assign({slot,active:false},found,{slot});
    });
    return cfg;
  };
  const sourceOf=(slide,cfg)=>String(slide?.image_url||slide?.image_data||(Number(slide?.slot)===1?cfg?.default_image_data:'')||'');
  const encodePath=path=>String(path||'').split('/').map(encodeURIComponent).join('/');
  async function readConfig(){
    const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
    const rows=await qtSupabaseTable('system_settings?select=value&key=eq.'+KEY+'&limit=1',{accessToken:token});
    return normalize(Array.isArray(rows)&&rows[0]?.value||{});
  }
  async function writeConfig(cfg){
    const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
    cfg=normalize(cfg);
    await qtSupabaseTable('system_settings?on_conflict=key',{method:'POST',accessToken:token,body:{key:KEY,value:cfg,updated_at:new Date().toISOString()}});
    window.QG_ADMIN_HOME_BANNER_CONFIG=cfg;
    return cfg;
  }
  function safeLink(value){
    const link=String(value||'').trim();
    if(!link)return '';
    if(link.startsWith('#')||/^https:\/\//i.test(link)||/^http:\/\//i.test(link))return link;
    throw Error('ลิงก์ต้องขึ้นต้นด้วย # หรือ https://');
  }
  async function removeObject(path){
    if(!path)return;
    try{
      const token=await qtGetAccessToken();if(!token)return;
      await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/'+BUCKET+'/'+encodePath(path),{method:'DELETE',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token}});
    }catch(e){console.warn('old banner cleanup failed',e)}
  }
  function render(cfg){
    const root=document.getElementById('qg-home-banner-manager');if(!root)return;
    const cards=cfg.slides.map(slide=>{
      const slot=Number(slide.slot),src=sourceOf(slide,cfg),active=slide.active!==false&&!!src,link=String(slide.link||slide.link_target||'');
      return `<article class="qg-banner-slot" data-slot="${slot}">
        <div class="qg-banner-slot-title"><b>แบนเนอร์ ${slot}</b><span>${active?'เปิดใช้งาน':'ปิดใช้งาน'}</span></div>
        <div class="qg-banner-preview">${src?`<img src="${h(src)}" alt="ตัวอย่างแบนเนอร์ ${slot}">`:'<div>ยังไม่มีรูป</div>'}</div>
        <label class="qg-banner-file">เลือกรูปใหม่<input type="file" accept="image/jpeg,image/png,image/webp" onchange="qgAdminUploadHomeBanner(${slot},this)"></label>
        <label>ลิงก์เมื่อกด (ไม่บังคับ)<input id="qg-banner-link-${slot}" type="text" value="${h(link)}" placeholder="#shopping หรือ https://..."></label>
        <label class="qg-banner-active"><span>เปิดใช้งานช่องนี้</span><input id="qg-banner-active-${slot}" type="checkbox" ${active?'checked':''} ${src?'':'disabled'}></label>
        <div class="qg-banner-actions"><button type="button" class="btn-primary" onclick="qgAdminSaveHomeBannerSlot(${slot})">บันทึก</button><button type="button" class="btn-secondary" onclick="qgAdminClearHomeBanner(${slot})">${slot===1&&cfg.default_image_data?'กลับภาพเริ่มต้น':'ล้างช่อง'}</button></div>
      </article>`;
    }).join('');
    root.innerHTML=`<div class="qg-banner-manager-note">ภาพจะเปลี่ยนอัตโนมัติทุก ${Math.round(cfg.rotation_ms/1000)} วินาที · รองรับ JPG, PNG, WebP ไม่เกิน 5 MB</div><div class="qg-banner-slots">${cards}</div>`;
  }
  window.qgAdminLoadHomeBanners=async function(){
    const root=document.getElementById('qg-home-banner-manager');if(!root)return;
    root.innerHTML='กำลังโหลดแบนเนอร์…';
    try{const cfg=await readConfig();window.QG_ADMIN_HOME_BANNER_CONFIG=cfg;render(cfg)}
    catch(e){root.innerHTML='<p class="qg-banner-error">โหลดแบนเนอร์ไม่สำเร็จ: '+h(e.message||e)+'</p>'}
  };
  window.qgAdminUploadHomeBanner=async function(slot,input){
    const file=input?.files?.[0];if(!file)return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('รองรับเฉพาะ JPG, PNG และ WebP');input.value='';return}
    if(file.size>5*1024*1024){toast('รูปต้องมีขนาดไม่เกิน 5 MB');input.value='';return}
    input.disabled=true;
    let path='',oldPath='';
    try{
      const cfg=normalize(window.QG_ADMIN_HOME_BANNER_CONFIG||await readConfig()),slide=cfg.slides[slot-1];
      oldPath=String(slide.storage_path||'');
      const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
      path='home/slot-'+slot+'/'+Date.now()+'-'+crypto.randomUUID().slice(0,8)+'.'+ext;
      const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
      const response=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/'+BUCKET+'/'+encodePath(path),{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token,'Content-Type':file.type,'x-upsert':'false'},body:file});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw Error(data.message||'อัปโหลดรูปไม่สำเร็จ');
      const publicUrl=QT_SUPABASE_CONFIG.URL+'/storage/v1/object/public/'+BUCKET+'/'+encodePath(path);
      cfg.slides[slot-1]=Object.assign({},slide,{slot,image_url:publicUrl,storage_path:path,active:true,alt:'QueueGo แบนเนอร์หน้าแรก '+slot});
      delete cfg.slides[slot-1].image_data;
      await writeConfig(cfg);
      if(oldPath&&oldPath!==path)removeObject(oldPath);
      render(cfg);toast('อัปโหลดแบนเนอร์ '+slot+' แล้ว');
    }catch(e){
      if(path)removeObject(path);
      toast('อัปโหลดไม่สำเร็จ: '+String(e.message||e).slice(0,90));
    }finally{input.disabled=false;input.value=''}
  };
  window.qgAdminSaveHomeBannerSlot=async function(slot){
    try{
      const cfg=normalize(window.QG_ADMIN_HOME_BANNER_CONFIG||await readConfig()),slide=cfg.slides[slot-1],src=sourceOf(slide,cfg);
      slide.link=safeLink(document.getElementById('qg-banner-link-'+slot)?.value||'');
      slide.active=!!src&&!!document.getElementById('qg-banner-active-'+slot)?.checked;
      cfg.slides[slot-1]=slide;
      await writeConfig(cfg);render(cfg);toast('บันทึกแบนเนอร์ '+slot+' แล้ว');
    }catch(e){toast('บันทึกไม่สำเร็จ: '+String(e.message||e).slice(0,90))}
  };
  window.qgAdminClearHomeBanner=async function(slot){
    if(!confirm(slot===1?'กลับไปใช้ภาพเริ่มต้นของ QueueGo?':'ล้างแบนเนอร์ช่องนี้?'))return;
    try{
      const cfg=normalize(window.QG_ADMIN_HOME_BANNER_CONFIG||await readConfig()),old=cfg.slides[slot-1],oldPath=String(old.storage_path||'');
      if(slot===1&&cfg.default_image_data){
        cfg.slides[0]={slot:1,image_data:cfg.default_image_data,alt:'QueueGo delivery service',active:true,link:''};
      }else cfg.slides[slot-1]={slot,active:false};
      await writeConfig(cfg);if(oldPath)removeObject(oldPath);render(cfg);toast('อัปเดตแบนเนอร์แล้ว');
    }catch(e){toast('ล้างแบนเนอร์ไม่สำเร็จ: '+String(e.message||e).slice(0,90))}
  };
})();
</script>
