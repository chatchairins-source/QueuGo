  function readSettings(){
    try{const raw=localStorage.getItem(SETTINGS_KEY); const v=raw?JSON.parse(raw):{}; return Object.assign({},DEFAULTS,v||{});}catch(e){return Object.assign({},DEFAULTS);}
  }
  window.qtGetSystemSettings=function(){return readSettings();};
  /* pull the admin's settings from the database so every device uses the same fees */
  window.qtPullSystemSettings=async function(){
    const t=await qtGetAccessToken(); if(!t) return;
    const rows=await qtSupabaseTable('system_settings?select=value&key=eq.app&limit=1',{accessToken:t});
    const v=Array.isArray(rows)&&rows[0]&&rows[0].value;
    if(v&&typeof v==='object'){ try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(v));}catch(e){} }
  };
  window.qtSaveSystemSettings=async function(){
    const admin=typeof qtAdminOnly==='function'?qtAdminOnly():null; if(!admin)return;
    const val=(id,fallback)=>{const el=document.getElementById(id); const n=Number(el?.value); return Number.isFinite(n)?n:fallback;};
    const cfg={delivery5:val('qt-set-delivery5',40),delivery10:val('qt-set-delivery10',60),riderRadius:val('qt-set-riderRadius',10),techRadius:val('qt-set-techRadius',30),orderTimeout:val('qt-set-orderTimeout',30),systemFee:val('qt-set-systemFee',0),notifications:!!document.getElementById('qt-set-notifications')?.checked};
    cfg.delivery5=Math.max(0,cfg.delivery5); cfg.delivery10=Math.max(cfg.delivery5,cfg.delivery10); cfg.riderRadius=Math.max(0,cfg.riderRadius); cfg.techRadius=Math.max(0,cfg.techRadius); cfg.orderTimeout=Math.max(1,cfg.orderTimeout); cfg.systemFee=Math.min(100,Math.max(0,cfg.systemFee));
    try{const t=await qtGetAccessToken();if(!t)throw Error('กรุณาเข้าสู่ระบบใหม่');
      await qtSupabaseTable('system_settings?on_conflict=key',{method:'POST',accessToken:t,body:{key:'app',value:cfg,updated_at:new Date().toISOString()}});
      try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(cfg))}catch(e){}
    }catch(err){toast('บันทึกการตั้งค่าไม่สำเร็จ: '+String(err.message||err).slice(0,70));return}
    try{qtAudit('system_settings_update',{entityType:'system_settings',entityId:'system',settings:cfg});}catch(e){}
    toast('💾 บันทึกการตั้งค่าแล้ว');
  };
  window.qtAdminViewUser=function(id){
    const admin=typeof qtAdminOnly==='function'?qtAdminOnly():null; if(!admin)return;
    const users=typeof dbGet==='function'?dbGet('qt_users',[]):[]; const u=users.find(x=>x.id===id); if(!u){toast('ไม่พบผู้ใช้');return;}

    const status=typeof accountStatusLabel==='function'?accountStatusLabel(u.status):u.status||'-';
    const text=['ข้อมูลบัญชี',`ชื่อ: ${u.name||'-'}`,`โทรศัพท์: ${u.phone||'-'}`,`ประเภท: ${role}`,`สถานะ: ${status}`,`ID: ${u.id||'-'}`,`สมัครเมื่อ: ${u.createdAt?new Date(u.createdAt).toLocaleString('th-TH'):'-'}`];
    if(u.type==='admin') text.push('สิทธิ์: Admin ไม่สามารถระงับหรือลบผ่านระบบนี้');
    else if(u.suspendedAt) text.push(`ระงับเมื่อ: ${new Date(u.suspendedAt).toLocaleString('th-TH')}`,`เหตุผล: ${u.suspendedReason||'-'}`);
    alert(text.join('\n'));

  };
  window.qtAdminRefreshAuditLog=function(){
    const admin=typeof qtAdminOnly==='function'?qtAdminOnly():null; if(!admin)return;
    try{if(typeof qtHydrateDatabase==='function'){Promise.resolve(qtHydrateDatabase({light:false})).then(()=>{toast('🔄 รีเฟรช Audit Log แล้ว');renderAdminGovernance();}).catch(()=>{toast('รีเฟรชจากฐานข้อมูลไม่สำเร็จ');renderAdminGovernance();});return;}}catch(e){}

    layout('GP ร้านค้า',`<div class="qg-live-gp"><h2>GP ร้านค้า</h2><p>GP คือค่าบริการร้านค้า ไรเดอร์จ่ายเงินสดค่าสินค้าให้ร้าน และเก็บเงินจากลูกค้าเอง</p>
      <label>เลือกวันที่ <input id="qg-gp-date" type="date" value="${escapeHtml(window.qgGpDay)}" onchange="qgGpDay=this.value;qgLoadAdminGp()"></label>
      <div id="qg-gp-live">กำลังดึงข้อมูลจากฐานข้อมูล...</div></div>`);
    qgLoadAdminGp();
  };
  window.qgLoadAdminGp=async function(){
    const box=document.getElementById('qg-gp-live');if(!box)return;
    try{
      const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
      const date=window.qgGpDay;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('วันที่ไม่ถูกต้อง');
      const from=new Date(date+'T00:00:00+07:00'),to=new Date(from.getTime()+86400000);
      const [orders,shops,settlements]=await Promise.all([
        qtSupabaseTable('orders?select=id,shop_id,subtotal,gp_amount,gp_rate,status&created_at=gte.'+encodeURIComponent(from.toISOString())+'&created_at=lt.'+encodeURIComponent(to.toISOString())+'&status=in.(picked_up,in_progress,completed)',{accessToken:token}),
        qtSupabaseTable('shop_profiles?select=id,shop_name',{accessToken:token}),
        qtSupabaseTable('settlements?select=id,shop_id,date_key,status,amount,metadata&date_key=eq.'+date,{accessToken:token})
      ]);
      const names=new Map(shops.map(s=>[s.id,s.shop_name]));const per=new Map();
      for(const o of orders){const x=per.get(o.shop_id)||{sales:0,gp:0,count:0};x.sales+=Number(o.subtotal||0);x.gp+=Number(o.gp_amount??Math.round(Number(o.subtotal||0)*Number(o.gp_rate??10))/100);x.count++;per.set(o.shop_id,x);}
      const totals=[...per.values()].reduce((a,x)=>({sales:a.sales+x.sales,gp:a.gp+x.gp,count:a.count+x.count}),{sales:0,gp:0,count:0});
      box.innerHTML=`<div class="qg-live-gp-card"><b>รายได้ทั้งหมด ฿${money(totals.sales)}</b><br>ออเดอร์ ${totals.count} · GP ที่เกิดขึ้นจริง ฿${money(totals.gp)}<br><small>นับเฉพาะออเดอร์ที่ไรเดอร์รับสินค้าแล้ว โดยจัดวันตามวันที่สั่งซื้อ</small></div>`;
      for(const [id,x] of per){const settlement=settlements.find(s=>s.shop_id===id);const div=document.createElement('div');div.className='qg-live-gp-card';
        div.innerHTML='<b>'+escapeHtml(names.get(id)||'ร้านค้า')+'</b><br>รายได้ทั้งหมด ฿'+money(x.sales)+' · GP ฿'+money(x.gp)+' · '+x.count+' ออเดอร์<br><small>สถานะ GP: '+escapeHtml(settlement?.status||'ยังไม่แจ้งโอน')+'</small>';
        if(settlement?.status==='processing'){
          const actions=document.createElement('div');actions.className='qg-live-gp-actions';
          if(settlement.metadata?.slip_path){const a=document.createElement('button');a.className='btn-secondary';a.textContent='ดูสลิป';a.onclick=()=>qgOpenAdminGpSlip(settlement.metadata.slip_path);actions.appendChild(a);}
          for(const [label,yes] of [['ยืนยันรับ GP',true],['ไม่ผ่าน',false]]){const b=document.createElement('button');b.className=yes?'btn-primary':'btn-secondary';b.textContent=label;b.onclick=()=>qgReviewAdminGp(settlement.id,yes,b);actions.appendChild(b);}
          div.appendChild(actions);
        }box.appendChild(div);
      }
      if(!per.size)box.insertAdjacentHTML('beforeend','<div class="qg-live-gp-card">ไม่มีรายได้ในวันที่เลือก</div>');
    }catch(e){box.innerHTML='<div class="qg-live-gp-card">โหลด GP ไม่สำเร็จ: '+escapeHtml(e.message||e)+'</div>';}
  };
  window.qgOpenAdminGpSlip=async function(path){
    try{const token=await qtGetAccessToken();const r=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/sign/gp-slips/'+path,{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const d=await r.json();if(!r.ok)throw Error(d.message||'เปิดสลิปไม่สำเร็จ');window.open(QT_SUPABASE_CONFIG.URL+'/storage/v1'+d.signedURL,'_blank','noopener');}catch(e){toast(e.message||'เปิดสลิปไม่สำเร็จ');}
  };
  window.qgReviewAdminGp=async function(id,approve,button){
    let reason=null;if(approve){if(!confirm('ยืนยันว่าได้รับ GP ตามสลิปแล้ว?'))return;}else{reason=prompt('เหตุผลที่สลิปไม่ผ่าน');if(reason===null)return;if(!reason.trim()){toast('กรุณาระบุเหตุผล');return;}}
    button.disabled=true;try{const t=await qtGetAccessToken();await qtSupabaseTable('rpc/admin_review_gp',{method:'POST',accessToken:t,body:{p_settlement_id:id,p_approve:approve,p_reason:reason}});toast('บันทึกผลแล้ว');qgLoadAdminGp();}catch(e){toast(e.message||'บันทึกไม่สำเร็จ');button.disabled=false;}
  };
})();
</script>
<script id="qg-admin-cash-report-v1">
window.qtDeleteOrderFromDatabase=async function(orderId){
  const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
  const deleted=await qtSupabaseTable('rpc/admin_delete_order_cash_safe',{method:'POST',accessToken:token,
    body:{p_order_id:orderId}});

function qgAdminToday(){const f=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(f.map(p=>[p.type,p.value]));return x.year+'-'+x.month+'-'+x.day;}
function renderAdminCash(){
 const u=currentUser();if(!u||u.type!=='admin'){navigate('login');return;}
 const day=window.qgAdminCashDay||qgAdminToday();
 layout('เส้นทางเงินสด',`<div class="qt-gp-shell"><div class="qt-gp-hero"><h2>เส้นทางเงินสด</h2><p>ไรเดอร์จ่ายค่าสินค้าให้ร้าน แล้วเก็บยอดรวมจากลูกค้า • GP เป็นค่าบริการร้านค้า</p></div><div class="order-detail-card"><label>เลือกวันที่ <input id="qg-admin-cash-day" type="date" max="${qgAdminToday()}" value="${escapeHtml(day)}"></label><div id="qg-admin-cash-results" style="margin-top:14px">กำลังโหลดข้อมูล...</div></div><button class="btn-secondary btn-block" onclick="navigate('admin-gp')">จัดการ GP และตรวจสลิป</button><button class="btn-secondary btn-block" onclick="navigate('admin')">กลับหน้าแอดมิน</button></div>`);
 const input=document.getElementById('qg-admin-cash-day');input.onchange=()=>{window.qgAdminCashDay=input.value;renderAdminCash()};
 qgLoadAdminCash(day);
}
async function qgLoadAdminCash(day){
 const el=document.getElementById('qg-admin-cash-results');
 try{
   const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
   const rows=await qtSupabaseTable('rpc/admin_cash_report',{method:'POST',accessToken:token,body:{p_from:day,p_to:day}});
   if(!Array.isArray(rows))throw Error('ข้อมูลรายงานไม่ถูกต้อง');
   if(location.hash.replace('#','').split('/')[0]!=='admin-cash')return;
   const money=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
   const total=(key)=>rows.reduce((a,x)=>a+Number(x[key]||0),0);
   const live=rows.filter(x=>x.order_status!=='cancelled');
   const issues=live.filter(x=>['picked_up','in_progress','completed'].includes(x.order_status)&&(
     x.rider_advance==null||x.merchant_receipt==null||Number(x.rider_advance)!==Number(x.subtotal)||
     Number(x.merchant_receipt||0)!==Number(x.subtotal)||
     (x.order_status==='completed'&&x.customer_payment_status!=='paid')));
   const body=`<p>ออเดอร์ ${rows.length} • ตรวจสอบเพิ่มเติม ${issues.length}</p>
     <p>ค่าสินค้าที่ไรเดอร์สำรอง: <b>฿${money(total('rider_advance'))}</b></p>
     <p>เงินสดที่ร้านยืนยันรับ: <b>฿${money(total('merchant_receipt'))}</b></p>
     <p>GP ของออเดอร์: <b>฿${money(live.reduce((a,x)=>a+Number(x.gp_amount||0),0))}</b></p>
     <p>ยอดรวมออเดอร์ส่งสำเร็จ: <b>฿${money(rows.filter(x=>x.order_status==='completed').reduce((a,x)=>a+Number(x.total_amount||0),0))}</b></p>`
     +rows.map(x=>`<div style="padding:12px 0;border-top:1px solid #e5e7eb"><b>${escapeHtml(x.order_number||'')}</b> · ${escapeHtml(x.shop_name||'ร้านค้า')}<br><small>สถานะ ${escapeHtml(x.order_status||'-')} • ไรเดอร์ ${escapeHtml(x.rider_name||'-')}</small><br><small>ค่าสินค้า ฿${money(x.subtotal)} • ไรเดอร์สำรอง ฿${money(x.rider_advance)} • ร้านยืนยัน ฿${money(x.merchant_receipt)}</small><br><small>ลูกค้าชำระ ${escapeHtml(x.customer_payment_status||'-')} • GP ฿${money(x.gp_amount)} (${escapeHtml(x.gp_status||'-')})</small>${issues.includes(x)?'<br><strong style="color:#b91c1c">ต้องตรวจสอบยอดหรือสถานะ</strong>':''}</div>`).join('');
   if(el)el.innerHTML=body;
 }catch(e){if(el)el.textContent='โหลดข้อมูลไม่สำเร็จ: '+e.message;}
}
</script>

<script id="qg-v22-admin-operations">
(function(){
 const adminPages=new Set(['admin','admin-governance','admin-orders','admin-gp','admin-cash','admin-support','admin-gp-rates','notifications']);
 window.qtRouteRender=function(){const page=(location.hash.replace('#','')||'login').split('/')[0],u=currentUser();
   if(!u){if(page!=='login'&&location.hash!=='#login'){location.hash='#login';return}renderLogin();return}
   if(u.type!=='admin'||u.status!=='approved'){document.getElementById('app').innerHTML='<main class="qg-v23-admin-denied"><h1>เฉพาะบัญชีผู้ดูแล QueueGo</h1><p>มีบัญชีบทบาทอื่นค้างอยู่ในแท็บนี้</p><button type="button" onclick="qgAdminSwitchAccount()">เข้าสู่ระบบผู้ดูแล</button></main>';return}

 };

 window.renderLogin=function(){document.title='เข้าสู่ระบบ Admin - QueueGo';document.getElementById('app').innerHTML='<main class="qg-v23-admin-login"><div class="qg-v23-admin-card"><div class="qg-v23-admin-mark">Q</div><h1>QueueGo</h1><p>เข้าสู่ระบบผู้ดูแล</p><form onsubmit="return handleLogin(event)"><label>เบอร์โทรศัพท์หรืออีเมล<input id="login-phone" required autocomplete="username" inputmode="email"></label><label>รหัสผ่าน<input id="login-password" required type="password" autocomplete="current-password"></label><button type="submit">เข้าสู่ระบบ</button></form></div></main>'};
 window.handleLogin=async function(e){e.preventDefault();const button=e.submitter||e.target.querySelector('button'),login=document.getElementById('login-phone').value.trim(),password=document.getElementById('login-password').value;if(button.disabled)return false;button.disabled=true;try{
   const auth=await qtSupabaseAuth('token?grant_type=password',{email:login.includes('@')?login.toLowerCase():qtAuthEmailFromPhone(login),password});if(!auth.access_token||!auth.user?.id)throw Error('ไม่สามารถรับเซสชันจากระบบได้');const p=await qtLoadOwnSupabaseUser(auth.access_token,auth.user.id);
   if(!p||p.role!=='admin'||p.status!=='active')throw Error('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลที่ใช้งานได้');
   const user=qtUserFromRow(p);QT_DB_CACHE.qt_users=[user];qtMarkClean('qt_users');setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:auth.access_token,refreshToken:auth.refresh_token||null,expiresAt:auth.expires_at||Math.floor(qtJwtExpiryMs(auth.access_token)/1000)||null,role:'admin'});
   navigate('admin');setTimeout(()=>qtBackgroundHydrate({light:false}),0);
 }catch(err){toast('เข้าสู่ระบบ Admin ไม่สำเร็จ: '+err.message)}finally{button.disabled=false}return false};
 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const token=()=>qtGetAccessToken();
 const req=async(path,method='GET',body=null)=>{const t=await token();if(!t)throw Error('กรุณาเข้าสู่ระบบ');return qtSupabaseTable(path,{method,accessToken:t,body})};
 const active=()=>currentUser()?.type==='admin';
 const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
 const dashboard=window.renderAdminDashboard;
 window.renderAdminDashboard=function(...args){dashboard(...args);if(!active())return;const host=document.querySelector('.qt-admin-home-actions');if(!host)return;
   host.insertAdjacentHTML('beforeend','<button type="button" onclick="qgAdminTickets()"><span>เรื่องร้องเรียน</span><small>หลักฐานและการตัดสิน</small></button>');
   const box=document.createElement('section');box.className='qg-v22-admin-live';box.innerHTML='<h3>สถานะระบบจากฐานข้อมูล</h3><p>กำลังโหลด...</p>';host.before(box);
   req('rpc/qg_admin_live_counts','POST',{}).then(summary=>{if(!box.isConnected)return;const count=s=>Number(summary.orders?.[s]||0),online=Number(summary.riders_online||0),open=Number(summary.shops_open||0);
     box.innerHTML='<h3>สถานะระบบจากฐานข้อมูล</h3><div class="qg-v22-admin-grid">'+[['รอร้าน',count('pending')],['รับแล้ว',count('accepted')],['กำลังเตรียม',count('preparing')],['รอไรเดอร์',count('ready')],['ไรเดอร์รับ',count('assigned')],['รับสินค้าแล้ว',count('picked_up')],['กำลังส่ง',count('in_progress')],['สำเร็จ',count('completed')],['ยกเลิก',count('cancelled')],['ไรเดอร์ออนไลน์',online],['ร้านเปิด',open]].map(([name,n])=>'<button type="button" onclick="navigate(\'admin-orders\')">'+name+'<b>'+n+'</b></button>').join('')+'</div>';}).catch(e=>{box.querySelector('p').textContent='โหลดสถานะไม่สำเร็จ: '+e.message});
 };
 const states={pending:'รอร้าน',accepted:'รับแล้ว',preparing:'กำลังเตรียม',ready:'รอไรเดอร์',assigned:'ไรเดอร์รับงาน',picked_up:'รับสินค้าแล้ว',in_progress:'กำลังส่ง',completed:'สำเร็จ',cancelled:'ยกเลิก'};
 window.qgAdminOrderFilter='all';
 window.renderAdminOrderCenter=function(){if(!active())return navigate('login');layout('ศูนย์ออเดอร์','<div class="qg-v22-admin-orders"><h2>ออเดอร์จริง</h2><div id="qg-v22-order-filters"></div><div id="qg-v22-order-list">กำลังโหลดจากฐานข้อมูล...</div></div>');qgLoadAdminOrders()};
 window.qgLoadAdminOrders=async function(){const list=document.getElementById('qg-v22-order-list'),tabs=document.getElementById('qg-v22-order-filters');if(!list)return;
   try{const rows=await req('orders?select=id,order_number,status,subtotal,delivery_fee,gp_amount,total_amount,customer_id,shop_id,rider_id,created_at&order=created_at.desc&limit=500');if(!list.isConnected)return;
     tabs.innerHTML='<button type="button" data-status="all">ทั้งหมด '+rows.length+'</button>'+Object.entries(states).map(([key,label])=>'<button type="button" data-status="'+key+'">'+label+' '+rows.filter(o=>o.status===key).length+'</button>').join('');
     tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{qgAdminOrderFilter=b.dataset.status;paint()});
     function paint(){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.status===qgAdminOrderFilter));const shown=rows.filter(o=>qgAdminOrderFilter==='all'||o.status===qgAdminOrderFilter);
       list.innerHTML=shown.map(o=>'<article><strong>'+safe(o.order_number)+'</strong><span>'+safe(states[o.status]||o.status)+'</span><p>สินค้า '+money(o.subtotal)+' · ค่าส่ง '+money(o.delivery_fee)+' · GP '+money(o.gp_amount)+' · รวม '+money(o.total_amount)+'</p><small>'+new Date(o.created_at).toLocaleString('th-TH')+'</small><div><button type="button" data-id="'+safe(o.id)+'" data-op="trace">ตรวจเส้นทางเงิน</button><button type="button" data-id="'+safe(o.id)+'" data-op="delete">ลบพร้อมเก็บหลักฐาน</button></div></article>').join('')||'<p>ไม่มีออเดอร์สถานะนี้</p>';
       list.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>b.dataset.op==='trace'?qgAdminTrace(b.dataset.id):qgAdminDeleteReviewed(b.dataset.id));}
     paint();
   }catch(e){list.textContent='โหลดออเดอร์ไม่สำเร็จ: '+e.message}
 };
 window.qgAdminDeleteReviewed=async function(id){if(!active()||!confirm('ลบออเดอร์นี้โดยเก็บภาพรวมการเงินและหลักฐานไว้ในคลังตรวจสอบ?'))return;try{await qtDeleteOrderFromDatabase(id);await qgLoadAdminOrders();toast('ลบออเดอร์และเก็บหลักฐานแล้ว')}catch(e){toast('ลบออเดอร์ไม่สำเร็จ: '+e.message)}};
 window.qgAdminTrace=async function(id){if(!active())return;const box=document.createElement('section');box.className='qg-v22-admin-modal';box.innerHTML='<div class="qg-v22-admin-sheet"><button type="button" class="qg-close">✕</button><h2>เส้นทางออเดอร์และเงินสด</h2><div class="qg-content">กำลังโหลด...</div></div>';document.body.appendChild(box);box.querySelector('.qg-close').onclick=()=>box.remove();box.onclick=e=>{if(e.target===box)box.remove()};
   try{const x=await req('rpc/qg_admin_order_trace','POST',{p_order_id:id}),o=x.order||x.archived?.order||{},pay=x.payment||x.archived?.payments?.[0],advance=x.rider_cash||x.archived?.cash_advance,receipt=x.merchant_receipt||x.archived?.merchant_receipt,delivery=x.delivery||x.archived?.deliveries?.[0],proof=x.proof||x.archived?.proof;
     box.querySelector('.qg-content').innerHTML='<p><b>'+safe(o.order_number||id)+'</b> · '+safe(states[o.status]||o.status||'ข้อมูลในคลัง')+'</p><div class="qg-v22-trace-grid">'+[['ลูกค้า',o.customer_id],['ร้าน',o.shop_id],['ไรเดอร์',o.rider_id],['ค่าสินค้า',money(o.subtotal)],['ค่าส่ง',money(o.delivery_fee)],['GP',money(o.gp_amount)],['ยอดรวม',money(o.total_amount)],['ไรเดอร์จ่ายร้าน',advance?money(advance.amount)+' · '+new Date(advance.paid_at).toLocaleString('th-TH'):'ยังไม่บันทึก'],['ร้านยืนยันรับ',receipt?money(receipt.amount)+' · '+new Date(receipt.received_at).toLocaleString('th-TH'):'ยังไม่ยืนยัน'],['ลูกค้าจ่ายไรเดอร์',pay?.status==='paid'?money(pay.amount)+' · '+new Date(pay.paid_at).toLocaleString('th-TH'):'ยังไม่บันทึก'],['ส่งมอบ',delivery?.delivered_at?new Date(delivery.delivered_at).toLocaleString('th-TH'):'ยังไม่ส่งสำเร็จ'],['ยืนยัน PIN',proof?.otp_verified?'ยืนยันแล้ว':'ยังไม่มีหลักฐาน']].map(([label,value])=>'<div><small>'+label+'</small><b>'+safe(value||'-')+'</b></div>').join('')+'</div>'+(proof?.photo_path?'<button type="button" data-evidence="'+safe(proof.photo_path)+'" onclick="qgAdminOpenEvidence(this.dataset.evidence)">ดูรูปส่งมอบ</button>':'')+'<h3>Audit Trail</h3>'+(x.audit||[]).map(a=>'<p>'+new Date(a.created_at).toLocaleString('th-TH')+' · '+safe(a.action)+' · '+safe(a.user_id||'ระบบ')+'</p>').join('');
   }catch(e){box.querySelector('.qg-content').textContent='ตรวจสอบไม่สำเร็จ: '+e.message}
 };
 window.qgAdminOpenEvidence=async function(path){try{const t=await token(),r=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/sign/qg-evidence/'+path,{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const d=await r.json();if(!r.ok)throw Error(d.message);window.open(QT_SUPABASE_CONFIG.URL+'/storage/v1'+d.signedURL,'_blank','noopener')}catch(e){toast('เปิดหลักฐานไม่สำเร็จ: '+e.message)}};
 const category={missing_item:'สินค้าไม่ครบ',wrong_item:'สินค้าไม่ตรง',damaged_food:'อาหารเสียหาย',rider:'ไรเดอร์',merchant:'ร้านค้า',payment:'ชำระเงิน',cash:'เงินสด',gp:'GP',other:'อื่น ๆ'};
 window.qgAdminTickets=function(){if(!active())return;const box=document.createElement('section');box.className='qg-v22-admin-modal';box.id='qg-v22-admin-tickets';box.innerHTML='<div class="qg-v22-admin-sheet"><button type="button" class="qg-close">✕</button><h2>เรื่องร้องเรียน</h2><div class="qg-content">กำลังโหลด...</div></div>';document.body.appendChild(box);box.querySelector('.qg-close').onclick=()=>box.remove();box.onclick=e=>{if(e.target===box)box.remove()};qgAdminLoadTickets()};
 window.qgAdminLoadTickets=async function(){const body=document.querySelector('#qg-v22-admin-tickets .qg-content');if(!body)return;try{const tickets=await req('qg_support_tickets?select=id,user_id,role,order_id,original_order_id,category,details,status,admin_id,admin_note,evidence_path,created_at&order=created_at.desc&limit=200');if(!body.isConnected)return;
   body.innerHTML=tickets.length?tickets.map(t=>'<article><b>'+safe(category[t.category]||t.category)+'</b><span>'+safe(t.status)+'</span><small>'+safe(t.role)+' · '+new Date(t.created_at).toLocaleString('th-TH')+' · '+safe(t.user_id)+'</small><p>'+safe(t.details)+'</p>'+(t.order_id||t.original_order_id?'<button type="button" data-order="'+safe(t.order_id||t.original_order_id)+'" onclick="qgAdminTrace(this.dataset.order)">ตรวจออเดอร์</button>':'')+(t.evidence_path?'<button type="button" data-path="'+safe(t.evidence_path)+'" onclick="qgAdminOpenEvidence(this.dataset.path)">ดูหลักฐาน</button>':'')+'<div><select data-ticket="'+safe(t.id)+'"><option value="OPEN">OPEN</option><option value="IN_REVIEW">IN_REVIEW</option><option value="WAITING_USER">WAITING_USER</option><option value="RESOLVED">RESOLVED</option><option value="REJECTED">REJECTED</option><option value="CLOSED">CLOSED</option></select><input data-note="'+safe(t.id)+'" placeholder="บันทึกผลการตรวจสอบ" maxlength="2000"><button type="button" data-action="'+safe(t.id)+'">บันทึกสถานะ</button></div></article>').join(''):'ยังไม่มีเรื่องร้องเรียน';
   for(const t of tickets){const sel=body.querySelector('select[data-ticket="'+t.id+'"]');if(sel)sel.value=t.status;const btn=body.querySelector('button[data-action="'+t.id+'"]');if(btn)btn.onclick=async()=>{btn.disabled=true;try{await req('rpc/qg_admin_ticket_action','POST',{p_ticket_id:t.id,p_status:sel.value,p_note:body.querySelector('input[data-note="'+t.id+'"]').value||null,p_admin_id:null});await qgAdminLoadTickets()}catch(e){toast('บันทึก Ticket ไม่สำเร็จ: '+e.message);btn.disabled=false}}}
 }catch(e){body.textContent='โหลดเรื่องร้องเรียนไม่สำเร็จ: '+e.message}};
})();

<script id="qg-admin-control-restore">
(function(){
  const allowed=new Set(['qt-sec-overview','qt-sec-approval','qt-sec-security','qt-sec-delivery','qt-sec-shops']);
  window.qgAdminApprovalRole=function(role){
    if(!['shop','rider','all'].includes(role))role='all';
    window.QG_ADMIN_APPROVAL_ROLE=role;
    document.querySelectorAll('[data-approval-filter]').forEach(b=>b.classList.toggle('active',b.dataset.approvalFilter===role));
    let count=0;
    document.querySelectorAll('.qg-approval-card').forEach(card=>{const show=role==='all'||card.dataset.approvalRole===role;card.hidden=!show;if(show)count++});
    const empty=document.getElementById('qg-approval-filter-empty');if(empty)empty.hidden=count>0;
  };
  let controlRefresh=null;
  function refreshControls(){
    if(controlRefresh)return controlRefresh;
    const note=document.getElementById('qg-admin-refresh-note');if(note)note.textContent='กำลังอัปเดตข้อมูลจากฐานข้อมูล…';
    controlRefresh=qtHydrateDatabase({light:false}).then(()=>{
      if(location.hash!=='#admin-governance')return;
      const field=document.activeElement;
      if(field&&/^(INPUT|TEXTAREA|SELECT)$/.test(field.tagName)){const n=document.getElementById('qg-admin-refresh-note');if(n)n.textContent='ข้อมูลใหม่พร้อมแล้ว กดรีเฟรชเมื่อกรอกข้อมูลเสร็จ';return}
      const section=sessionStorage.getItem('qt_admin_active_tab')||'qt-sec-overview';
      renderAdminGovernance();qtAdminTab(section);
      if(section==='qt-sec-approval')qgAdminApprovalRole(window.QG_ADMIN_APPROVAL_ROLE||'all');
      const updated=document.getElementById('qg-admin-refresh-note');if(updated)updated.textContent='อัปเดตข้อมูลล่าสุดจากฐานข้อมูลแล้ว';
    }).catch(e=>{const n=document.getElementById('qg-admin-refresh-note');if(n)n.textContent='อัปเดตข้อมูลไม่สำเร็จ: '+e.message;else toast('อัปเดตข้อมูลไม่สำเร็จ: '+e.message)}).finally(()=>{controlRefresh=null});
    return controlRefresh;
  }
  window.qgAdminOpenControl=function(section,role){
    if(!allowed.has(section)||currentUser()?.type!=='admin')return;
    try{sessionStorage.setItem('qt_admin_active_tab',section)}catch(e){}
    if(section==='qt-sec-approval')window.QG_ADMIN_APPROVAL_ROLE=role||'all';
    if(location.hash!=='#admin-governance')navigate('admin-governance');else renderAdminGovernance();
    setTimeout(()=>{
      qtAdminTab(section);
      if(section==='qt-sec-approval')qgAdminApprovalRole(role||window.QG_ADMIN_APPROVAL_ROLE||'all');
      if(section==='qt-sec-security'&&role)qtSecurityRole(role);
      refreshControls();
    },0);
  };
  const oldDashboard=window.renderAdminDashboard;
  window.renderAdminDashboard=function(...args){
    oldDashboard.apply(this,args);
    if(currentUser()?.type!=='admin')return;
    const shop=document.getElementById('qg-home-pending-shops'),rider=document.getElementById('qg-home-pending-riders');
    if(!shop||!rider)return;
    qtGetAccessToken().then(token=>qtSupabaseTable('users?select=role,status&role=in.(shop,rider)&status=eq.pending',{accessToken:token}))
      .then(rows=>{if(shop.isConnected)shop.textContent=String(rows.filter(x=>x.role==='shop').length);if(rider.isConnected)rider.textContent=String(rows.filter(x=>x.role==='rider').length)})
      .catch(e=>{if(shop.isConnected)shop.textContent='โหลดไม่สำเร็จ';if(rider.isConnected)rider.textContent='โหลดไม่สำเร็จ';console.warn('Admin pending accounts:',e)});
  };
  const oldGovernance=window.renderAdminGovernance;
  window.renderAdminGovernance=function(...args){
    const result=oldGovernance.apply(this,args);
    qgAdminApprovalRole(window.QG_ADMIN_APPROVAL_ROLE||'all');
    const title=document.querySelector('.qt-admin-head');
    if(title&&!document.getElementById('qg-admin-refresh-note'))title.insertAdjacentHTML('afterend','<p id="qg-admin-refresh-note" role="status">ข้อมูลที่แสดงอยู่ · กำลังตรวจข้อมูลล่าสุด</p>');
    return result;
  };
  const busy=new Set();
  async function accountAction(action,id){
    const admin=currentUser();if(!admin||admin.type!=='admin'||busy.has(id))return;
    const transitions={approve:{from:['pending','rejected'],to:'active'},reject:{from:['pending'],to:'rejected'},suspend:{from:['active'],to:'suspended'},restore:{from:['suspended'],to:'active'}};
    const transition=transitions[action];if(!transition)return;
    let reason=null;
    if(action==='suspend'){reason=prompt('เหตุผลระงับบัญชี:');if(reason===null)return;reason=reason.trim()||'ตามการตรวจสอบของ Admin'}
    busy.add(id);
    try{
      const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบ Admin ใหม่');
      const rows=await qtSupabaseTable('users?select=id,role,status&id=eq.'+encodeURIComponent(id)+'&limit=1',{accessToken:token});
      const target=rows?.[0];if(!target||target.role==='admin'||!['shop','rider','customer'].includes(target.role))throw Error('ไม่พบบัญชีที่จัดการได้');
      if(!transition.from.includes(target.status))throw Error('สถานะบัญชีเปลี่ยนไปแล้ว กรุณารีเฟรช');
      const path='users?id=eq.'+encodeURIComponent(id)+'&status=eq.'+encodeURIComponent(target.status)+'&role=eq.'+encodeURIComponent(target.role)+'&select=id,role,status';
      const saved=await qtSupabaseTable(path,{method:'PATCH',accessToken:token,body:{status:transition.to,updated_at:new Date().toISOString(),...(action==='suspend'?{suspension_reason:reason}:{})}});
      if(!Array.isArray(saved)||saved.length!==1)throw Error('ไม่ได้บันทึกสถานะ กรุณารีเฟรช');
      await qtHydrateDatabase({light:false});
      toast(({approve:'อนุมัติ',reject:'ไม่อนุมัติ',suspend:'ระงับ',restore:'ปลดระงับ'})[action]+'บัญชีแล้ว');
      if(location.hash==='#admin-governance'){renderAdminGovernance();setTimeout(()=>qtAdminTab(action==='approve'||action==='reject'?'qt-sec-approval':'qt-sec-security'),0)}
      else renderAdminDashboard(currentUser());
    }catch(e){toast('บันทึกสถานะไม่สำเร็จ: '+e.message)}finally{busy.delete(id)}
  }
  window.adminApproveUser=id=>accountAction('approve',id);
  window.adminRejectUser=id=>accountAction('reject',id);
  window.adminSecurityAction=(action,id)=>accountAction(action,id);
  window.adminSuspendUser=id=>accountAction('suspend',id);
  window.adminUnsuspendUser=id=>accountAction('restore',id);
})();
</script>
