function renderSearch(){
  layout('ค้นหาร้าน/บริการ', `
    <h2>🔎 ค้นหาร้านใกล้ฉัน</h2>
    <div>
      <input id="search-keyword" placeholder="ค้นหาชื่อร้าน...">
      <select id="search-category">
        <option value="">ทุกหมวดหมู่</option>
        <option value="food">🍜 ร้านอาหาร</option>
        <option value="grocery">🛒 ของชำ</option>
        <option value="cafe">☕ คาเฟ่</option>
        <option value="other">📦 อื่นๆ</option>
      </select>
      <button class="btn-secondary btn-block" onclick="getMyLocationForSearch()">📍 กลับตำแหน่งปัจจุบัน</button>
      <div class="search-location-hint">🗺️ ลากแผนที่เพื่อเปลี่ยนพื้นที่ค้นหา หรือแตะตำแหน่งบนแผนที่</div>
    </div>
    <div id="search-map" class="map-box"></div>
    <div id="search-location-status" class="search-location-status">📍 กำลังหาตำแหน่งปัจจุบัน...</div>
    <div id="promote-banner"></div>
    <div id="search-results" class="shop-list"></div>
  `);
  window.__searchLoc = window.__searchLoc || {lat:13.7563, lng:100.5018};
  const map = L.map('search-map').setView([window.__searchLoc.lat, window.__searchLoc.lng], 14);
  tileLayer(map);
  registerMap(map);
  window.__searchMap = map;

  // The map is the search-location selector. Moving the map changes the
  // center used for distance calculations; GPS is only used to reset it.
  map.on('moveend', ()=>{
    const c = map.getCenter();
    window.__searchLoc = {lat:c.lat, lng:c.lng};
    updateSearchLocationStatus(false);
    runSearch();
  });
  map.on('click', e=>{
    map.panTo(e.latlng);
  });

  document.getElementById('search-keyword').addEventListener('input', runSearch);
  document.getElementById('search-category').addEventListener('change', runSearch);
  runSearch().catch(e=>console.warn('[QueueGo] initial shop search failed:',e));

  // Try the device location on first entry, but never lock the user to it.
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      window.__searchLoc = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      window.__searchMap.setView([pos.coords.latitude, pos.coords.longitude], 14);
      updateSearchLocationStatus(true);
      runSearch();
    }, ()=>{
      updateSearchLocationStatus(false, 'ใช้ตำแหน่งจากแผนที่');
    }, {enableHighAccuracy:true, maximumAge:30000, timeout:10000});
  }else{
    updateSearchLocationStatus(false, 'อุปกรณ์ไม่รองรับ GPS — เลือกตำแหน่งจากแผนที่ได้');
  }
}
function updateSearchLocationStatus(isGps, note){
  const el=document.getElementById('search-location-status');
  if(!el) return;
  const loc=window.__searchLoc;
  el.innerHTML = isGps
    ? '📍 <b>ตำแหน่งปัจจุบัน</b> — เลื่อนแผนที่เพื่อเปลี่ยนตำแหน่งค้นหา'
    : '🗺️ <b>ตำแหน่งค้นหา</b> — ลากแผนที่เพื่อเปลี่ยนพื้นที่' + (note ? ' • '+escapeHtml(note) : '');
}
function getMyLocationForSearch(){
  if(!navigator.geolocation){ toast('ไม่รองรับ GPS'); return; }
  toast('กำลังหาตำแหน่งปัจจุบัน...');
  navigator.geolocation.getCurrentPosition(pos=>{
    window.__searchLoc = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    window.__searchMap.setView([pos.coords.latitude, pos.coords.longitude], 14);
    updateSearchLocationStatus(true);
    runSearch();
  }, ()=> toast('ไม่สามารถขอตำแหน่งได้'));
}
function isPromoted(shopId){ return dbGet('qt_promotions',[]).some(p=>p.shopId===shopId && p.status==='active'); }
async function qtEnsurePublicShopsLoaded(){
  const token=await qtGetAccessToken();
  if(!token) return false;
  try{
    const rows=await qtSupabaseTable('shop_profiles?select=*',{accessToken:token});
    if(!Array.isArray(rows)) return false;
    const current=dbGet('qt_users',[]).filter(u=>u.type!=='shop');
    const shops=rows.filter(x=>x && String(x.status||'').toLowerCase()==='active').map(x=>{
      const meta=(x.metadata&&typeof x.metadata==='object')?x.metadata:{};
      return Object.assign({},meta,{id:x.user_id,type:'shop',status:'approved',shopName:x.shop_name,name:meta.name||x.shop_name,phone:x.phone,address:x.address,lat:x.latitude,lng:x.longitude,supabase:true,_profileOnly:true});
    });
    QT_DB_CACHE.qt_users=current.concat(shops);
    return shops.length>0;
  }catch(e){
    console.warn('[QueueGo] public shop load failed:',e);
    return false;
  }
}
async function runSearch(){
  const kw = (document.getElementById('search-keyword')?.value||'').toLowerCase();
  const cat = document.getElementById('search-category')?.value||'';
  const loc = window.__searchLoc || {lat:13.7563,lng:100.5018};
  let shops = dbGet('qt_users',[]).filter(u=>u.type==='shop' && u.shopName)
    .map(s=>{
      const hasCoords=Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng));
      return {...s, distance:hasCoords ? distanceKm(Number(loc.lat),Number(loc.lng),Number(s.lat),Number(s.lng)) : Infinity, _hasCoords:hasCoords};
    });
  if(!shops.length){
    const loaded=await qtEnsurePublicShopsLoaded();
    if(loaded){
      shops=dbGet('qt_users',[]).filter(u=>u.type==='shop' && u.shopName).map(s=>{
        const hasCoords=Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng));
        return {...s,distance:hasCoords?distanceKm(Number(loc.lat),Number(loc.lng),Number(s.lat),Number(s.lng)):Infinity,_hasCoords:hasCoords};
      });
    }
  }
  if(kw) shops = shops.filter(s=>s.shopName.toLowerCase().includes(kw));
  if(cat) shops = shops.filter(s=>s.category===cat);
  shops.sort((a,b)=> (Number(isPromoted(b.id)) - Number(isPromoted(a.id))) || (a.distance-b.distance));

  window.__searchMap.eachLayer(l=>{ if(l instanceof L.Marker) window.__searchMap.removeLayer(l); });
  L.marker([loc.lat,loc.lng], {keyboard:false, interactive:false})
    .addTo(window.__searchMap);
  shops.filter(s=>s._hasCoords).forEach(s=> L.marker([Number(s.lat),Number(s.lng)]).addTo(window.__searchMap).bindPopup(`<b>${escapeHtml(s.shopName)}</b><br>${Number.isFinite(s.distance)?s.distance.toFixed(2):'-'} กม.`));

  const promos = dbGet('qt_promotions',[]).filter(p=>p.status==='active' && (!cat || p.category===cat)).sort((a,b)=>b.bidPrice-a.bidPrice);
  document.getElementById('promote-banner').innerHTML = promos.length ? `
    <div class="promo-banner"><span class="ad-tag">โฆษณา/โปรโมต</span>⭐ ร้านแนะนำ: <b>${escapeHtml(promos[0].shopName)}</b> (พื้นที่: ${escapeHtml(promos[0].area)})</div>` : '';

  document.getElementById('search-results').innerHTML = shops.length ? shops.map(s=>shopCard(s)).join('') : '<p>ไม่พบร้านค้า</p>';
}
function shopCard(s){
  return `<div class="shop-card" onclick="navigate('shop-view/${s.id}')">
    <img src="${escapeHtml(s.logo||placeholderImg())}" class="shop-logo">
    <div class="shop-info">
      <b>${escapeHtml(s.shopName)}</b> ${isPromoted(s.id)?'<span class="ad-tag-sm">โปรโมต</span>':''}
      <div>${categoryLabel(s.category)}</div>
      <div>📍 ${Number.isFinite(s.distance)?s.distance.toFixed(2):'ไม่ระบุ'} กม. • ⏰ ${escapeHtml(s.openTime||'09:00')}-${escapeHtml(s.closeTime||'20:00')}</div>
    </div>
  </div>`;
}

      <b>${escapeHtml(p.name)}</b>

function cartCount(){
  const user=currentUser();if(!user)return 0;
  const cart=dbGet('qt_cart_'+user.id,{items:[]});
  return (cart.items||[]).reduce((s,i)=>s+Number(i.qty||0),0);
}
function updateCartCountUI(){
  const count=cartCount();
  document.querySelectorAll('#qt-cart-count').forEach(el=>el.textContent=String(count));
  document.querySelectorAll('.cart-count-badge').forEach(el=>{
    if(count>0){el.textContent=count>99?'99+':String(count);el.style.display='';}
    else el.style.display='none';
  });
}
function addToCart(productId){
  const user = currentUser();
  if(!user || user.type!=='customer'){ toast('กรุณาเข้าสู่ระบบด้วยบัญชีลูกค้าก่อน'); navigate('login'); return; }
  const product = dbGet('qt_products',[]).find(p=>p.id===productId);
  let cart = dbGet('qt_cart_'+user.id, {shopId:null, items:[]});
  if(cart.shopId && cart.shopId!==product.shopId){
    if(!confirm('ตะกร้าปัจจุบันเป็นของร้านอื่น ต้องการล้างตะกร้าและเริ่มใหม่หรือไม่?')) return;
    cart = {shopId:product.shopId, items:[]};
  }
  cart.shopId = product.shopId;
  const existing = cart.items.find(i=>i.productId===productId);
  if(existing) existing.qty++;
  else cart.items.push({productId, name:product.name, price:product.price, image:product.image, qty:1});
  dbSet('qt_cart_'+user.id, cart);
  toast('เพิ่มลงตะกร้าแล้ว');
}
function renderCart(){
  const user = currentUser(); if(!user||user.type!=='customer'){ navigate('login'); return; }
  const cart = dbGet('qt_cart_'+user.id, {shopId:null, items:[]});
  const shop = cart.shopId ? dbGet('qt_users',[]).find(u=>u.id===cart.shopId) : null;
  const total = cart.items.reduce((s,i)=>s+i.price*i.qty,0);
  layout('ตะกร้าสินค้า', `
    <h2>🛒 ตะกร้าสินค้า</h2>
    ${shop?`<p>ร้าน: <b>${escapeHtml(shop.shopName)}</b></p>`:''}
    ${cart.items.length ? cart.items.map(i=>`
      <div class="cart-item">
        <img src="${escapeHtml(i.image||placeholderImg())}" class="cart-item-img">
        <div class="cart-item-info">
          <b>${escapeHtml(i.name)}</b>
          <div>${escapeHtml(i.price)} บาท x <button onclick="changeQty('${i.productId}',-1)">-</button> ${escapeHtml(i.qty)} <button onclick="changeQty('${i.productId}',1)">+</button></div>
        </div>
        <button class="btn-danger" onclick="removeFromCart('${i.productId}')">ลบ</button>
      </div>`).join('') : '<p>ตะกร้าว่างเปล่า</p>'}
    ${cart.items.length ? `<div class="cart-total">รวม: ${total} บาท</div>
      <button class="btn-primary btn-block" onclick="navigate('checkout')">ดำเนินการสั่งซื้อ →</button>` : ''}
  `);
}
function changeQty(productId, delta){
  const user = currentUser();
  let cart = dbGet('qt_cart_'+user.id, {items:[]});
  const item = cart.items.find(i=>i.productId===productId);
  item.qty += delta;
  if(item.qty<=0) cart.items = cart.items.filter(i=>i.productId!==productId);
  dbSet('qt_cart_'+user.id, cart);
  updateCartCountUI();
  renderCart();
}
function removeFromCart(productId){
  const user = currentUser();
  let cart = dbGet('qt_cart_'+user.id, {items:[]});
  cart.items = cart.items.filter(i=>i.productId!==productId);
  dbSet('qt_cart_'+user.id, cart);
  updateCartCountUI();
  renderCart();
}

/* ---------- QT Order Number ---------- */
/* Customer-facing order number: QT-001, QT-002, ... (3 digits).
   Numbering is GLOBAL across all shops and resets each calendar day.
   Therefore no two shops can receive the same QT number on the same day.
   The internal id remains unchanged for routing/storage compatibility. */
function qtLocalDateKey(ts){
  const d = new Date(ts || Date.now());
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function nextQTOrderNumber(){
  const orders = dbGet('qt_orders',[]);
  const today = qtLocalDateKey();
  let max = 0;
  orders.forEach(o=>{
    const orderDate = o.orderDate || qtLocalDateKey(o.createdAt);
    if(orderDate !== today) return;
    const m = String(o.orderNumber||'').match(/^QT-(\d{3})$/);
    if(m) max = Math.max(max, Number(m[1]));
  });
  const next = max + 1;
  if(next > 999){
    throw new Error('เลขออเดอร์ของวันนี้ครบ 999 รายการแล้ว');
  }
  return 'QT-' + String(next).padStart(3,'0');
}
function displayOrderNumber(order){
  const raw = String(order?.orderNumber || order?.order_number || '').trim();
  /* รูปแบบใหม่ QT-YYYYMMDD-xxxx (ฝังวันที่เพื่อความ unique ในฐานข้อมูล) -> แสดงเฉพาะ QT-xxxx */
  const dated = raw.match(/^QT-\d{8}-(\d{3,4})$/i);
  if(dated) return 'QT-'+dated[1];
  if(raw) return raw; /* เลขออเดอร์รูปแบบเดิม (เช่น QT-001) ยังแสดงตามเดิมเพื่อความเข้ากันได้กับข้อมูลเก่า */
  return 'QT-'+String(ordersFallbackNumber(order)).padStart(3,'0');
}
function ordersFallbackNumber(order){
  const orders=dbGet('qt_orders',[]);
  const idx=orders.findIndex(o=>o.id===order?.id);
  return idx>=0 ? idx+1 : 1;
}

function qtGenerateOrderNumber(){
  /* ผู้ใช้ต้องการเลขที่แสดงผลรูปแบบ QT-xxxx (สุ่ม 4 หลัก) และสุ่มใหม่ทุกวัน
     แต่ฐานข้อมูลมี unique constraint "orders_order_number_key" แบบ global (ไม่ได้แยกตามวัน)
     จึงต้องเก็บค่าจริงใน order_number แบบฝังวันที่ไว้ด้วย (QT-YYYYMMDD-xxxx) เพื่อไม่ให้ชนกับ
     ออเดอร์ของวันก่อน ๆ ส่วน UI จะตัดมาแสดงเฉพาะ QT-xxxx ผ่าน displayOrderNumber() */
  const orders = dbGet('qt_orders', []);
  const dateKey = qtLocalDateKey().replace(/-/g,'');
  const used = new Set(
    (Array.isArray(orders) ? orders : [])
      .map(o => String(o?.orderNumber || o?.order_number || '').trim().toUpperCase())
      .filter(Boolean)
  );
  for(let i=0;i<200;i++){
    const n = Math.floor(Math.random()*10000).toString().padStart(4,'0');
    const candidate = `QT-${dateKey}-${n}`;
    if(!used.has(candidate)) return candidate;
  }
  /* กรณีที่แทบเป็นไปไม่ได้ (สุ่มชนกันครบ 200 ครั้ง): ต่อท้ายด้วยเลขจาก timestamp เพื่อลดโอกาสชนกับ
     unique constraint ให้เหลือน้อยที่สุด ระบบ retry ใน confirmOrder() จะสุ่มใหม่อีกครั้งถ้ายังชนอยู่ */
  return `QT-${dateKey}-${Date.now().toString().slice(-4)}`;
}

async function confirmOrder(){
  const user=currentUser();
  if(!user){navigate('login');return;}
  const existingActive=getCustomerActiveOrder(user.id);
  if(existingActive){toast('มีออเดอร์ที่กำลังดำเนินการอยู่ ไม่สามารถสั่งซ้ำได้');navigate('order/'+existingActive.id);return;}
  const cart=dbGet('qt_cart_'+user.id,{items:[]});
  if(!cart.items.length){toast('ตะกร้าว่างเปล่า');navigate('cart');return;}
  const shop=dbGet('qt_users',[]).find(u=>u.id===cart.shopId);
  if(!shop){toast('ไม่พบข้อมูลร้านค้า กรุณากลับไปเลือกสินค้าใหม่');return;}
  const loc=window.__pickedLoc?window.__pickedLoc():{lat:shop.lat,lng:shop.lng};
  const addressEl=document.getElementById('delivery-address');
  const address=addressEl?addressEl.value.trim():'';
  const subtotal=cart.items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
  const deliveryFee=computeDeliveryFee(distanceKm(shop.lat,shop.lng,loc.lat,loc.lng));
  const gp=gpAmount(subtotal,shop.id),total=subtotal+deliveryFee;
  const order={
    id:uid(),orderNumber: qtGenerateOrderNumber(),orderDate:qtLocalDateKey(),
    customerId:user.id,customerName:user.name,customerPhone:user.phone,
    shopId:shop.id,shopName:shop.shopName,riderId:null,riderName:null,
    items:cart.items.map(i=>Object.assign({},i)),subtotal,deliveryFee,gpAmount:gp,total,
    pickup:{lat:shop.lat,lng:shop.lng,address:shop.address},
    delivery:{lat:loc.lat,lng:loc.lng,address},
    status:'pending_shop',statusLog:[{status:'pending_shop',time:Date.now()}],createdAt:Date.now()
  };
  const orders=dbGet('qt_orders',[]);
  orders.push(order);
  QT_DB_CACHE.qt_orders=orders;

  let saved=false,lastErr=null;
  for(let attempt=1;attempt<=5&&!saved;attempt++){
    try{
      await qtTrackPersist(qtPersistKey('qt_orders',orders));
      saved=true;
    }catch(err){
      lastErr=err;
      const errMsg=String((err&&err.message)||'');
      /* root cause ของ "duplicate key value violates unique constraint orders_order_number_key":
         เลขออเดอร์ที่สุ่มไว้ชนกับ order_number ที่มีอยู่แล้วในฐานข้อมูล (เช่น ของลูกค้า/ร้านอื่นที่
         เครื่องนี้มองไม่เห็นในแคชท้องถิ่น) ห้ามปิด/ลบ constraint — ให้สุ่มเลขออเดอร์ใหม่แล้วลองบันทึกซ้ำแทน */
      if(/order_number|orders_order_number_key/i.test(errMsg)){
        order.orderNumber=qtGenerateOrderNumber();
      }
      if(attempt<5)await new Promise(r=>setTimeout(r,500*attempt));
    }
  }
  if(!saved){
    const msg=String((lastErr&&lastErr.message)||'ไม่ทราบสาเหตุ');
    qtSyncFailed('qt_orders',lastErr||new Error('บันทึกออเดอร์ไม่สำเร็จ'));
    console.error('QueueGo confirmOrder save failed:',lastErr);
    toast('บันทึกออเดอร์ไม่สำเร็จ: '+msg.slice(0,120));
    return;
  }
  dbSet('qt_cart_'+user.id,{shopId:null,items:[]});
  pushNotification(shop.id,'📦 มีคำสั่งซื้อใหม่',`กรุณากด “รับงาน” เพื่อเริ่มดำเนินการ • จาก ${user.name} ยอด ฿${total}`,'order/'+order.id);
  toast('สั่งซื้อสำเร็จ! บันทึกออเดอร์แล้ว');
  navigate('order/'+order.id);
}

const ORDER_STATUSES = [
  {key:'pending_shop', label:'รอร้านรับงาน', icon:'⏳'},
  {key:'shop_accepted', label:'ร้านรับงานแล้ว', icon:'✅'},
  {key:'preparing', label:'กำลังเตรียมสินค้า', icon:'👨‍🍳'},
  {key:'waiting_rider', label:'รอไรเดอร์รับงาน', icon:'🔍'},
  {key:'rider_to_shop', label:'ไรเดอร์กำลังไปร้าน', icon:'🔵'},
  {key:'picked_up', label:'รับสินค้าแล้ว', icon:'📦'},
  {key:'delivering', label:'กำลังไปหาลูกค้า', icon:'🟠'},
  {key:'arrived', label:'ถึงลูกค้าแล้ว', icon:'🟡'},
  {key:'completed', label:'ส่งสำเร็จ', icon:'⚫'},
  {key:'cancelled', label:'ยกเลิก', icon:'❌'},
];
function statusLabel(key){ const s = ORDER_STATUSES.find(x=>x.key===key); return s ? s.icon+' '+s.label : key; }
function statusIndex(key){ return ORDER_STATUSES.findIndex(x=>x.key===key); }

function orderStatusTimelineHTML(o){
  const current=statusIndex(o.status);
  const cancelled=o.status==='cancelled';
  const steps=ORDER_STATUSES.filter(s=>s.key!=='cancelled');
  const log=Array.isArray(o.statusLog)?o.statusLog:[];
  return `<div class="qt-order-progress">
    <div class="qt-order-progress-title">สถานะออเดอร์</div>
    <div class="qt-order-progress-list">${steps.map((st,i)=>{
      const done=!cancelled && current>=i;
      const active=!cancelled && st.key===o.status;
      const entry=[...log].reverse().find(x=>x&&x.status===st.key);
      const when=entry&&entry.time?new Date(entry.time).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';

/* ---------- 11. ORDER CHAT ---------- */
function chatKey(orderId){ return 'qt_order_chat_'+orderId; }
function isOrderParticipant(order,user){
  return !!user && (user.id===order.customerId || user.id===order.riderId);
}
function chatIsClosed(order){
  return ['completed','cancelled'].includes(order.status);
}
function cleanupExpiredChats(){
  const now=Date.now();
  Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&k.endsWith('_deleteAt')).forEach(k=>{
    const deleteAt=Number(QT_DB_CACHE[k]||0);
    if(deleteAt&&now>=deleteAt){ delete QT_DB_CACHE[k.replace(/_deleteAt$/,'')]; delete QT_DB_CACHE[k]; }
  });
}
function getOrderChat(order){ cleanupExpiredChats(); return dbGet(chatKey(order.id),[]); }
function formatChatTime(ts){ return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function renderOrderChat(order,user){
  /* V5.33: the customer sees the chat box on the status page even before a rider accepts, so it is clear where the chat will appear */
  if(!order.riderId && user && user.id===order.customerId && !chatIsClosed(order)) return `<section class="order-chat"><h3>💬 แชทระหว่างลูกค้ากับไรเดอร์</h3><div class="chat-empty">แชทจะเปิดให้ใช้งานเมื่อไรเดอร์รับงานแล้ว</div></section>`;
  if(!order.riderId || !isOrderParticipant(order,user)) return '';
  const closed=chatIsClosed(order); const messages=getOrderChat(order);
  const body=messages.length ? messages.map(m=>`<div class="chat-bubble ${m.senderId===user.id?'mine':'theirs'}"><div>${escapeHtml(m.text)}</div><div class="chat-meta">${escapeHtml(m.senderName||'ผู้ใช้งาน')} • ${formatChatTime(m.createdAt)}</div></div>`).join('') : '<div class="chat-empty">ยังไม่มีข้อความ เริ่มพูดคุยกันได้เลย</div>';
  return `<section class="order-chat"><h3>💬 แชทระหว่างลูกค้ากับไรเดอร์</h3><div id="chat-messages-${order.id}" class="chat-messages">${body}</div>${closed?'<div class="chat-closed">ออเดอร์จบแล้ว ระบบจะล้างประวัติแชทอัตโนมัติภายใน 20 นาที</div>':`<form class="chat-compose" onsubmit="return sendOrderChat(event,'${order.id}')"><input id="chat-input-${order.id}" maxlength="500" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button class="btn-primary" type="submit">ส่ง</button></form>`}</section>`;
}
/* escapeHtml() now lives in the qt-v532-helpers script */
function sendOrderChat(event,orderId){
  event.preventDefault(); const user=currentUser(); const order=dbGet('qt_orders',[]).find(o=>o.id===orderId);
  if(!user||!order||!isOrderParticipant(order,user)||chatIsClosed(order)){toast('แชทนี้ปิดแล้ว');return false;}
  const input=document.getElementById('chat-input-'+orderId); const message=(input?.value||'').trim(); if(!message)return false;
  const messages=getOrderChat(order); messages.push({id:uid(),senderId:user.id,senderName:user.name,text:message,createdAt:Date.now()}); dbSet(chatKey(orderId),messages); input.value=''; renderOrderChatArea(orderId); return false;
}
function renderOrderChatArea(orderId){ const order=dbGet('qt_orders',[]).find(o=>o.id===orderId), user=currentUser(); const host=document.querySelector('.order-chat'); if(!order||!host||!user)return; const fresh=document.createElement('div'); fresh.innerHTML=renderOrderChat(order,user); host.replaceWith(fresh.firstElementChild); const box=document.getElementById('chat-messages-'+orderId); if(box)box.scrollTop=box.scrollHeight; }
function markChatForDeletion(order){ if(!['completed','cancelled'].includes(order.status))return; const key=chatKey(order.id), messages=getOrderChat(order); if(!messages.length)return; dbSet(key,messages); QT_DB_CACHE[key+'_deleteAt']=Date.now()+20*60*1000; }

function requestOrderRefund(orderId){

function orderActionButtons(order, user){
  if(!user) return '';
  let btns = [];
  const b = (label,newStatus,danger)=>`<button class="btn-block" style="background:${danger?'var(--danger)':'var(--primary)'};color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;cursor:pointer;" onclick="updateOrderStatus('${order.id}','${newStatus}')">${label}</button>`;
  if(user.type==='shop'){
    const mappedShopUserId = order.shopProfileId && QT_SYNC.profileMaps?.shopById?.get(order.shopProfileId);
    const isThisShopOrder = String(user.id)===String(order.shopId) || String(user.id)===String(mappedShopUserId);
    if(isThisShopOrder){
      if(order.status==='pending_shop'){ btns.push(b('รับออเดอร์','shop_accepted')); }
      else if(order.status==='shop_accepted'){ btns.push(b('เริ่มเตรียมสินค้า','preparing')); }
      else if(order.status==='preparing'){ btns.push(b('สินค้าพร้อม รอไรเดอร์','waiting_rider')); }
    }
  }
  if(user.type==='rider'){
    if(order.status==='waiting_rider' && !order.riderId && order.dispatchRiderId===user.id){
      btns.push(`<button class="btn-block" style="background:var(--primary);color:#fff;border:none;padding:12px;border-radius:10px;cursor:pointer;" onclick="acceptRiderJob('${order.id}')">🛵 รับงานนี้</button>`);
    }
    if(order.riderId===user.id){
      if(order.status==='rider_to_shop') btns.push(b('ถึงร้านแล้ว/รับสินค้า','picked_up'));
      if(order.status==='picked_up') btns.push(b('เริ่มจัดส่ง','delivering'));
      if(order.status==='delivering') btns.push(b('ถึงลูกค้าแล้ว','arrived'));
      if(order.status==='arrived') btns.push(b('ยืนยันส่งสำเร็จ','completed'));
    }
  }
  if(user.type==='customer' && user.id===order.customerId && order.status==='pending_shop'){
    btns.push(b('ยกเลิกคำสั่งซื้อ','cancelled',true));
  }
  if(user.type==='admin'){
    if(order.status!=='cancelled' && order.status!=='completed') btns.push(`<button class="btn-block" style="background:var(--danger);color:#fff;border:none;padding:12px;border-radius:10px;cursor:pointer;" onclick="adminCancelOrder('${order.id}')">❌ ยกเลิกออเดอร์โดย Admin</button>`);
    if(order.status==='waiting_rider' && !order.riderId) btns.push(`<button class="btn-block" style="background:#6b46c1;color:#fff;border:none;padding:12px;border-radius:10px;cursor:pointer;" onclick="adminRedispatchOrder('${order.id}')">⚙️ จ่ายงานไรเดอร์ใหม่</button>`);
    btns.push(`<button class="btn-block" style="background:#475569;color:#fff;border:none;padding:12px;border-radius:10px;cursor:pointer;" onclick="adminDeleteOrder('${order.id}')">🗑️ ลบออเดอร์</button>`);
  }
  return btns.join('') || '<p>รอการดำเนินการ...</p>';
}

function adminCancelOrder(orderId){
  const admin=currentUser();
  if(!admin||admin.type!=='admin'){toast('ไม่มีสิทธิ์');return;}
  const reason=prompt('ระบุเหตุผลการยกเลิกออเดอร์ (อย่างน้อย 1 ข้อ)');
  if(reason===null) return;
  if(!reason.trim()){toast('กรุณาระบุเหตุผล');return;}
  const orders=dbGet('qt_orders',[]), o=orders.find(x=>x.id===orderId);
  if(!o){toast('ไม่พบออเดอร์');return;}
  if(['completed','cancelled'].includes(o.status)){toast('ออเดอร์นี้จบหรือยกเลิกแล้ว');return;}
  o.status='cancelled';
  o.cancelledAt=Date.now(); o.cancelledBy=admin.id; o.cancelledByRole='admin'; o.cancelReason=reason.trim();
  o.statusLog=Array.isArray(o.statusLog)?o.statusLog:[];
  o.statusLog.push({status:'cancelled',time:Date.now(),by:admin.id,byRole:'admin',reason:reason.trim()});
  dbSet('qt_orders',orders);
  adminOrderAudit(orderId,'cancel',admin.id,{reason:reason.trim()});
  [o.customerId,o.shopId,o.riderId].filter(Boolean).forEach(id=>pushNotification(id,'❌ ออเดอร์ถูกยกเลิกโดย Admin',`เลขออเดอร์ ${displayOrderNumber(o)} • ${reason.trim()}`,'order/'+orderId));

}

function updateOrderStatus(orderId, newStatus){
  let orders = dbGet('qt_orders',[]);
  const order = orders.find(o=>o.id===orderId);
  if(!order){ toast('ไม่พบออเดอร์'); return; }
  const actor=currentUser();
  /* V5.33: a customer may only cancel while the shop has not accepted yet (the button is hidden afterwards, but the screen can be stale) */
  if(newStatus==='cancelled' && actor && actor.type==='customer'){
    if(order.customerId!==actor.id){ toast('ไม่มีสิทธิ์ยกเลิกออเดอร์นี้'); return; }
    if(order.status!=='pending_shop'){ toast('ร้านรับออเดอร์แล้ว ไม่สามารถยกเลิกได้'); renderOrderDetail(orderId); return; }
    if(!confirm('ยืนยันยกเลิกออเดอร์นี้?')) return;
  }
  const previousStatus=order.status;
  order.status = newStatus;
  /* orders loaded from Supabase have no statusLog yet — without this the status buttons (incl. cancel) threw and did nothing */
  order.statusLog = Array.isArray(order.statusLog) ? order.statusLog : [];
  order.statusLog.push({status:newStatus, time:Date.now()});
  qtAudit('order_status_change',{orderId:order.id,orderNumber:displayOrderNumber(order),from:previousStatus,to:newStatus});
  if(newStatus==='completed' && order.settlementStatus!=='recorded'){ qtFinanceEntry('order_settlement',{orderId:order.id,orderNumber:displayOrderNumber(order),customerId:order.customerId,shopId:order.shopId,riderId:order.riderId,amount:Number(order.total||0),status:'recorded'}); order.settlementStatus='recorded'; }
  if(['completed','cancelled'].includes(newStatus)){
    QT_DB_CACHE[chatKey(order.id)+'_deleteAt']=Date.now()+20*60*1000;
    if(order.customerId===currentUser()?.id){
      order.customerUnlockedAt = Date.now();
    }
  }
  dbSet('qt_orders', orders);
  pushNotification(order.customerId, 'อัปเดตสถานะคำสั่งซื้อ', statusLabel(newStatus), 'order/'+orderId);
  if(newStatus === 'waiting_rider'){
    dispatchOrder(orderId);
  }
  toast('อัปเดตสถานะ: '+statusLabel(newStatus));
  renderOrderDetail(orderId);
}
function acceptRiderJob(orderId){
  if(qtRiderJobAlertOrderId===orderId) stopRiderJobAlert();

  const user = currentUser();
  if(!user || user.type!=='rider' || user.status!=='approved'){
    toast('บัญชีไรเดอร์นี้ยังไม่พร้อมรับงาน');
    return;
  }

  let orders = dbGet('qt_orders',[]);
  const order = orders.find(o=>o.id===orderId);
  if(!order){ toast('ไม่พบออร์เดอร์'); return; }

  // IMPORTANT: A rider can only accept an order specifically dispatched to them.
  if(order.status!=='waiting_rider' || order.riderId){
    toast('งานนี้ไม่อยู่ในสถานะที่รับได้');
    renderOrderDetail(orderId); return;
  }
  if(order.dispatchRiderId !== user.id){
    toast('งานนี้ไม่ได้ถูกระบบจ่ายให้คุณ');
    renderRiderJobs(); return;
  }

  order.riderId = user.id;
  order.riderName = user.name;
  order.status = 'rider_to_shop';
  order.statusLog.push({status:'rider_to_shop', time:Date.now()});
  order.dispatchState = 'accepted';
  order.dispatchAcceptedAt = Date.now();
  order.dispatchExpiresAt = null;

  dbSet('qt_orders', orders);
  pushNotification(order.customerId, '🛵 ไรเดอร์รับงานแล้ว',
    user.name+' กำลังไปที่ร้าน', 'order/'+orderId);
  toast('รับงานสำเร็จ! กำลังไปที่ร้าน');
  renderOrderDetail(orderId);
}



function adminRedispatchOrder(orderId){
  const user = currentUser();
  if(!user || user.type!=='admin'){ toast('เฉพาะ Admin เท่านั้น'); return; }
  let orders = dbGet('qt_orders',[]);
  const o = orders.find(x=>x.id===orderId);

  renderOrderDetail(orderId);
}

/* ---------- 10. LIVE TRACKING ---------- */
/*
  V5.44 Batch 6:
  - Removed the old simulated rider movement.
  - The customer map must never invent a rider GPS position.
  - If a real last-known rider location exists, show it.
  - If no real location exists yet, show only pickup/delivery points.
  This remains incomplete until cross-device Realtime/API is enabled.
*/
function initTrackingMap(order){
  if(typeof L==='undefined' || !order || !order.pickup || !order.delivery ||
     order.pickup.lat==null || order.pickup.lng==null ||
     order.delivery.lat==null || order.delivery.lng==null) return;

  const map = L.map('tracking-map').setView([order.pickup.lat, order.pickup.lng], 14);
  tileLayer(map);
  registerMap(map);

  L.marker([order.pickup.lat, order.pickup.lng])
    .addTo(map).bindPopup('🏪 ร้านค้า: '+escapeHtml(order.shopName||'ร้านค้า'));
  L.marker([order.delivery.lat, order.delivery.lng])
    .addTo(map).bindPopup('👤 ลูกค้า: '+escapeHtml(order.customerName||'ลูกค้า'));

  const riderIcon = L.divIcon({html:'🛵', className:'emoji-icon'});
  const latest = LiveTracking.getLatestLocation(order.id);
  let riderMarker = null;

  if(latest && Number.isFinite(Number(latest.lat)) && Number.isFinite(Number(latest.lng))){
    riderMarker = L.marker([Number(latest.lat),Number(latest.lng)], {icon:riderIcon})
      .addTo(map).bindPopup('🛵 ตำแหน่งล่าสุดของไรเดอร์');
  }

  map.fitBounds([
    [order.pickup.lat,order.pickup.lng],
    [order.delivery.lat,order.delivery.lng]
  ], {padding:[30,30]});

  /*
    Refresh only from the current application's stored last-known location.
    No artificial movement is generated. When Realtime/API is enabled later,
    LiveTracking.getLatestLocation() can read the server-synced position.
  */
  const refresh = setInterval(()=>{
    const current = LiveTracking.getLatestLocation(order.id);
    if(!current || !Number.isFinite(Number(current.lat)) || !Number.isFinite(Number(current.lng))) return;
    const point=[Number(current.lat),Number(current.lng)];
    if(riderMarker) riderMarker.setLatLng(point);
    else riderMarker=L.marker(point,{icon:riderIcon}).addTo(map).bindPopup('🛵 ตำแหน่งล่าสุดของไรเดอร์');
  },5000);
  activeIntervals.push(refresh);
}

async function loadThaiRiderGeo(){
  if(window.__thaiRiderGeo) return window.__thaiRiderGeo;
  if(window.__thaiRiderGeoPromise) return window.__thaiRiderGeoPromise;
  window.__thaiRiderGeoPromise = fetch(THAI_GEO_URL, {cache:'no-cache'})
    .then(r=>{ if(!r.ok) throw new Error('โหลดฐานข้อมูลพื้นที่ไม่สำเร็จ'); return r.json(); })
    .then(data=>{ window.__thaiRiderGeo=data; return data; })
    .finally(()=>{ window.__thaiRiderGeoPromise=null; });
  return window.__thaiRiderGeoPromise;
}

function riderGeoOptionText(name, prefix){
  const n=String(name||'');
  if(prefix==='district' && n.startsWith('เขต')) return n;
  return n;
}

function fillRiderProvinceOptions(data, selected){
  const el=document.getElementById('r-province'); if(!el) return;
  const list=(Array.isArray(data)&&data.length?data.map(p=>({id:p.id,name_th:p.name_th})):EMBEDDED_THAI_PROVINCES.map((name,i)=>({id:i+1,name_th:name})));
  el.innerHTML='<option value="">-- เลือกจังหวัด --</option>'+list.map(p=>`<option value="${p.id}" ${String(p.id)===String(selected)?'selected':''}>${p.name_th}</option>`).join('');
}

function fillRiderDistrictOptions(data, provinceId, selected){
  const el=document.getElementById('r-district'); if(!el) return;
  const p=data.find(x=>String(x.id)===String(provinceId));
  const list=p ? (p.districts||[]) : [];
  el.innerHTML='<option value="">-- เลือกอำเภอ/เขต --</option>'+list.map(d=>`<option value="${d.id}" ${String(d.id)===String(selected)?'selected':''}>${riderGeoOptionText(d.name_th,'district')}</option>`).join('');
  el.disabled=!list.length;
}

function fillRiderSubdistrictOptions(data, districtId, selected){
  const el=document.getElementById('r-subdistrict'); if(!el) return;
  let list=[];
  for(const p of data){ const d=(p.districts||[]).find(x=>String(x.id)===String(districtId)); if(d){ list=d.sub_districts||[]; break; } }
  el.innerHTML='<option value="">-- เลือกตำบล/แขวง --</option>'+list.map(s=>`<option value="${s.id}" data-zip="${s.zip_code||''}" ${String(s.id)===String(selected)?'selected':''}>${s.name_th}</option>`).join('');
  el.disabled=!list.length;
}

async function initRiderThaiAddress(user){
  const status=document.getElementById('r-geo-status');
  try{
    const data=await loadThaiRiderGeo();
    fillRiderProvinceOptions(data, user.serviceProvinceId||'');
    fillRiderDistrictOptions(data, user.serviceProvinceId||'', user.serviceDistrictId||'');
    fillRiderSubdistrictOptions(data, user.serviceDistrictId||'', user.serviceSubdistrictId||'');
    const p=document.getElementById('r-province'), d=document.getElementById('r-district'), s=document.getElementById('r-subdistrict');
    p&&p.addEventListener('change',()=>{ fillRiderDistrictOptions(data,p.value,''); fillRiderSubdistrictOptions(data,'',''); });
    d&&d.addEventListener('change',()=>{ fillRiderSubdistrictOptions(data,d.value,''); });
    s&&s.addEventListener('change',()=>{
      const opt=s.options[s.selectedIndex];

    });
    if(status) status.textContent='โหลดข้อมูลจังหวัด/อำเภอ/ตำบลครบแล้ว';

}

/* ---------- V5.2 AUTO DISPATCH / FAIR RIDER DISPATCH ---------- */
/*
 Rules:
 1) Only approved + online + available riders are candidates.
 2) Rider must be within 1 km of the pickup point.
 3) Prefer riders with fewer active/assigned jobs.
 4) If workload is tied, nearest rider wins.
 5) A job is assigned privately to one rider; other riders do not see it.
 6) If the assigned rider declines/times out, call dispatchNextRider().
*/
const DISPATCH_CONFIG = {
  maxRadiusKm: 1,
  responseTimeoutMs: 60 * 1000
};

function riderActiveJobCount(riderId){
  const active = new Set(['rider_to_shop','picked_up','delivering','arrived']);
  return dbGet('qt_orders',[]).filter(o => o.riderId===riderId && active.has(o.status)).length;
}

function riderDispatchEligible(rider){
  if(!rider ||
     rider.type !== 'rider' ||
     rider.status !== 'approved' ||
     rider.online !== true ||
     rider.available === false ||
     !Number.isFinite(Number(rider.lat)) ||
     !Number.isFinite(Number(rider.lng))) return false;

  /* Batch 4: when a local presence record exists, it must agree with the
     persisted user state before the rider can receive a new job. */
  const presence=qtGetRiderPresence()[rider.id];
  if(presence && !['online'].includes(presence.status)) return false;
  return true;
}

function dispatchDistanceKm(order, rider){
  if(!order || !order.pickup || !Number.isFinite(Number(order.pickup.lat)) ||
     !Number.isFinite(Number(order.pickup.lng))) return Infinity;
  return calculateDistance(
    Number(order.pickup.lat), Number(order.pickup.lng),
    Number(rider.lat), Number(rider.lng)
  );
}

function getDispatchCandidates(order){
  return dbGet('qt_users',[])
    .filter(riderDispatchEligible)
    .map(r => ({
      rider:r,
      distanceKm:dispatchDistanceKm(order,r),
      activeJobs:riderActiveJobCount(r.id)
    }))
    .filter(x => x.distanceKm <= DISPATCH_CONFIG.maxRadiusKm)
    .sort((a,b) =>
      (a.activeJobs - b.activeJobs) ||
      (a.distanceKm - b.distanceKm)
    );
}

function dispatchOrder(orderId){
  let orders = dbGet('qt_orders',[]);
  const order = orders.find(o=>o.id===orderId);
  if(!order || order.status!=='waiting_rider' || order.riderId) return null;

  const candidates = getDispatchCandidates(order);
  if(!candidates.length){
    order.dispatchState = 'no_candidate';
    order.dispatchLastAt = Date.now();
    dbSet('qt_orders',orders);
    pushNotification(order.shopId, '⚠️ ยังหาไรเดอร์ไม่ได้',
      'ยังไม่มีไรเดอร์ที่พร้อมรับงานในรัศมี 1 กม.', 'order/'+orderId);
    return null;
  }

  const chosen = candidates[0];
  order.dispatchState = 'offered';
  order.dispatchRiderId = chosen.rider.id;
  order.dispatchDistanceKm = Number(chosen.distanceKm.toFixed(3));
  order.dispatchOfferedAt = Date.now();
  order.dispatchExpiresAt = Date.now() + DISPATCH_CONFIG.responseTimeoutMs;
  order.dispatchAttempts = (order.dispatchAttempts||0) + 1;
  dbSet('qt_orders',orders);

  pushNotification(chosen.rider.id, '🛵 มีงานจัดส่งใหม่',
    `${order.shopName} • ระยะ ${chosen.distanceKm.toFixed(2)} กม.`, 'order/'+orderId);

  return chosen;
}

function dispatchNextRider(orderId){
  let orders = dbGet('qt_orders',[]);
  const order = orders.find(o=>o.id===orderId);
  if(!order || order.status!=='waiting_rider' || order.riderId) return null;

  // Exclude riders already offered this order.
  const tried = new Set(order.dispatchTriedRiderIds || []);
  if(order.dispatchRiderId) tried.add(order.dispatchRiderId);

  const candidates = getDispatchCandidates(order)
    .filter(x => !tried.has(x.rider.id));

  if(!candidates.length){
    order.dispatchState = 'no_candidate';
    order.dispatchRiderId = null;
    order.dispatchExpiresAt = null;
    dbSet('qt_orders',orders);
    pushNotification(order.shopId, '⚠️ ยังไม่มีไรเดอร์รับงาน',
      'ระบบลองส่งงานให้ไรเดอร์ที่เข้าเงื่อนไขครบแล้ว', 'order/'+orderId);
    return null;
  }

  order.dispatchTriedRiderIds = [...tried];
  order.dispatchRiderId = null;
  order.dispatchState = 'queued';
  order.dispatchExpiresAt = null;
  dbSet('qt_orders',orders);
  return dispatchOrder(orderId);
}

function expireDispatchOffers(){
  let orders = dbGet('qt_orders',[]);
  let changed = false;
  orders.forEach(order=>{
    if(order.status==='waiting_rider' &&
       order.dispatchState==='offered' &&
       order.dispatchExpiresAt &&
       Date.now() > order.dispatchExpiresAt){
      order.dispatchTriedRiderIds = [
        ...(order.dispatchTriedRiderIds||[]),
        order.dispatchRiderId
      ].filter(Boolean);
      order.dispatchRiderId = null;
      order.dispatchState = 'expired';
      order.dispatchExpiresAt = null;
      changed = true;
    }
  });
  if(changed) dbSet('qt_orders',orders);

  // Dispatch expired offers one-by-one after releasing them.
  orders.filter(o=>o.status==='waiting_rider' && o.dispatchState==='expired')
    .forEach(o=>dispatchNextRider(o.id));
}

setInterval(expireDispatchOffers, 5000);


/* ---- Rider route/distance ---- */
function calculateDistance(lat1,lon1,lat2,lon2){ return distanceKm(lat1,lon1,lat2,lon2); } /* was missing: auto-dispatch called it and crashed */
function qtKmText(k){ if(k==null||!Number.isFinite(k)) return '-'; return k<1?(Math.round(k*100)*10)+' ม.':k.toFixed(1)+' กม.'; }
function qtRouteInfo(order,rider){
  const n=v=>Number(v), ok=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&(a!==0||b!==0);
  const p=(order&&order.pickup)||{}, d=(order&&order.delivery)||{};
  const pl=n(p.lat),pg=n(p.lng),dl=n(d.lat),dg=n(d.lng);
  const hasP=ok(pl,pg), hasD=ok(dl,dg);
  let toShop=null;
  if(rider&&hasP&&ok(n(rider.lat),n(rider.lng))) toShop=distanceKm(n(rider.lat),n(rider.lng),pl,pg);
  else if(order&&Number(order.dispatchDistanceKm)>0) toShop=Number(order.dispatchDistanceKm);
  const shopToCust=(hasP&&hasD)?distanceKm(pl,pg,dl,dg):null;
  const total=(toShop==null&&shopToCust==null)?null:(toShop||0)+(shopToCust||0);
  const eta=total==null?null:Math.max(5,Math.round(total/25*60)+5); /* ~25 km/h average + 5 min handling */
  return {toShop,shopToCust,total,eta,fee:Number((order&&order.deliveryFee)||0)};
}

const TECH_STATUSES=[{key:'open_for_quotes',label:'รอช่างเสนอราคา'},{key:'requested',label:'รอช่างรับงาน'},{key:'quote_selected',label:'ลูกค้าเลือกช่างแล้ว รอช่างยืนยัน'},{key:'technician_confirmed',label:'ช่างยืนยันรับงานแล้ว'},{key:'accepted',label:'ช่างรับงานแล้ว'},{key:'heading',label:'กำลังเดินทางไปหาลูกค้า'},{key:'arrived',label:'ถึงลูกค้าแล้ว'},{key:'working',label:'กำลังดำเนินงาน'},{key:'completed',label:'งานเสร็จสิ้น'},{key:'rejected',label:'ช่างปฏิเสธ'},{key:'cancelled',label:'ยกเลิก'}];
function techStatusLabel(k){ const s=TECH_STATUSES.find(x=>x.key===k); return s?s.label:k; }

    <h2 style="margin-top:20px;">🧰 งานของฉัน</h2>

function quoteListForCustomer(job){
  const quotes = (job.quotes||[]).slice().sort((a,b)=>a.price-b.price);
  return `<h3>💰 ใบเสนอราคาที่ได้รับ (${quotes.length})</h3>

      <div class="tech-card">

        <button class="btn-primary btn-block" style="margin-top:6px;" onclick="selectTechQuote('${job.id}','${q.id}')">✅ เลือกช่างคนนี้</button>
      </div>`).join('') : '<p>ยังไม่มีช่างเสนอราคาเข้ามา รอสักครู่</p>'}`;

function techJobActionButtons(job, user){
  if(!user) return '';
  let btns = [];
  if(user.type==='technician' && job.status==='open_for_quotes' && (user.jobTypes||[]).includes(job.serviceType)){
    const myQuote = (job.quotes||[]).find(q=>q.technicianId===user.id);
    if(myQuote){
      return `<div class="badge badge-green">✅ คุณเสนอราคาไปแล้ว: ${escapeHtml(myQuote.price)} บาท — รอลูกค้าตัดสินใจ</div>`;
    }
    return `<div class="quote-submit-box">
      <label for="quote-price-input">เสนอราคาค่าบริการ (บาท)</label>
      <input class="quote-price-input" type="number" id="quote-price-input" min="1" inputmode="numeric" placeholder="กรอกราคา เช่น 500">
      <label for="quote-note-input" style="display:block;margin-top:10px;">หมายเหตุ / รายละเอียดเพิ่มเติม (ถ้ามี)</label>
      <textarea id="quote-note-input" rows="2" placeholder="เช่น รวมค่าอะไหล่ / ค่าเดินทางแล้ว"></textarea>
      <button type="button" class="btn-primary btn-block quote-submit-btn" onclick="submitTechQuote('${job.id}')">📤 ส่งราคาเสนอ</button>
    </div>`;
  }
  if(user.type==='technician' && user.id===job.technicianId){
    if(job.status==='requested'){
      btns.push(qtSlideConfirm('slide-accept-'+job.id, '➡️ เลื่อนเพื่อรับงาน', `updateTechJob('${job.id}','accepted')`));
      btns.push(`<button class="btn-danger btn-block" onclick="updateTechJob('${job.id}','rejected')">❌ ปฏิเสธ</button>`);
    }
    if(job.status==='quote_selected'){ /* V5.31: technician must explicitly confirm a customer-selected quote */
      btns.push(qtSlideConfirm('slide-confirm-'+job.id, '➡️ เลื่อนเพื่อยืนยันรับงาน', `updateTechJob('${job.id}','technician_confirmed')`));
      btns.push(`<button class="btn-danger btn-block" onclick="updateTechJob('${job.id}','rejected')">❌ ปฏิเสธ</button>`);
    }
    if(job.status==='technician_confirmed' || job.status==='accepted') btns.push(`<button class="btn-primary btn-block" onclick="updateTechJob('${job.id}','heading')">🚗 เริ่มเดินทาง</button>`);
    if(job.status==='heading') btns.push(`<button class="btn-primary btn-block" onclick="updateTechJob('${job.id}','arrived')">📍 ถึงแล้ว</button>`);
    if(job.status==='arrived') btns.push(`<button class="btn-primary btn-block" onclick="updateTechJob('${job.id}','working')">🔧 เริ่มดำเนินงาน</button>`);
    if(job.status==='working') btns.push(qtSlideConfirm('slide-complete-'+job.id, '➡️ เลื่อนเพื่อยืนยันงานเสร็จสิ้น', `updateTechJob('${job.id}','completed')`));
  }
  if(user.type==='customer' && user.id===job.customerId && ['requested','open_for_quotes','quote_selected'].includes(job.status)){
    btns.push(`<button class="btn-danger btn-block" onclick="updateTechJob('${job.id}','cancelled')">ยกเลิก</button>`);
  }
  return btns.join('') || '<p>รอดำเนินการ...</p>';
}
/* V5.31: who is allowed to move a job from which status to which next status.
   NOTE per spec §21 — this is a client-side check only. In production this
   exact table must be re-verified on the Backend before writing any status change;
   the frontend must never be the only place that enforces this. */
const TECH_JOB_TRANSITIONS = {
  requested:          { accepted:'technician', rejected:'technician', cancelled:'customer' },
  quote_selected:     { technician_confirmed:'technician', rejected:'technician', cancelled:'customer' },
  technician_confirmed:{ heading:'technician' },
  accepted:           { heading:'technician' },
  heading:            { arrived:'technician' },
  arrived:            { working:'technician' },
  working:            { completed:'technician' },
  open_for_quotes:    { cancelled:'customer' },
};
function updateTechJob(id, status){
  const user = currentUser();
  if(!user){ toast('กรุณาเข้าสู่ระบบ'); return; }
  let jobs = dbGet('qt_techjobs',[]);
  const job = jobs.find(j=>j.id===id);
  if(!job){ toast('ไม่พบงานนี้'); return; }
  const allowed = TECH_JOB_TRANSITIONS[job.status];
  const requiredRole = allowed ? allowed[status] : undefined;
  if(!requiredRole){ toast('ไม่สามารถเปลี่ยนสถานะนี้ได้จากสถานะปัจจุบัน'); return; }
  if(requiredRole==='technician' && user.id!==job.technicianId){ toast('เฉพาะช่างของงานนี้เท่านั้นที่ทำรายการนี้ได้'); return; }
  if(requiredRole==='customer' && user.id!==job.customerId){ toast('เฉพาะเจ้าของงานเท่านั้นที่ทำรายการนี้ได้'); return; }
  job.status = status;
  dbSet('qt_techjobs', jobs);
  pushNotification(job.customerId, 'อัปเดตงานช่าง', techStatusLabel(status), 'technician-job/'+id);
  toast('อัปเดตสถานะ: '+techStatusLabel(status));
  renderTechnicianJobDetail(id);
}

function submitTechQuote(jobId){
  const user = currentUser();
  if(!user || user.type!=='technician'){ toast('เฉพาะบัญชีช่างเท่านั้นที่สามารถเสนอราคาได้'); return; }
  const priceEl = document.getElementById('quote-price-input');
  const noteEl = document.getElementById('quote-note-input');
  if(!priceEl){ toast('ไม่พบช่องกรอกราคา กรุณาเปิดหน้างานใหม่อีกครั้ง'); return; }
  const price = parseFloat(priceEl.value);
  if(!price || price<=0){ toast('กรุณาระบุราคาที่ต้องการเสนอ'); priceEl.focus(); return; }
  let jobs = dbGet('qt_techjobs',[]);
  const job = jobs.find(j=>j.id===jobId);
  if(!job){ toast('ไม่พบงานนี้'); return; }
  if(job.status!=='open_for_quotes'){ toast('งานนี้ปิดรับเสนอราคาแล้ว'); renderTechnicianJobDetail(jobId); return; }
  if(!(user.jobTypes||[]).includes(job.serviceType)){ toast('ช่างของคุณไม่ได้เปิดรับงานประเภทนี้'); return; }
  if((job.quotes||[]).find(q=>q.technicianId===user.id)){ toast('คุณเสนอราคางานนี้ไปแล้ว'); return; }
  job.quotes = job.quotes || [];
  job.quotes.push({ id:uid(), technicianId:user.id, technicianName:user.name, price, note:(noteEl?.value||'').trim(), createdAt:Date.now() });
  dbSet('qt_techjobs', jobs);
  pushNotification(job.customerId, '💰 มีช่างเสนอราคาใหม่', user.name+' เสนอราคา '+price+' บาท', 'technician-job/'+jobId);
  toast('ส่งราคาเสนอแล้ว รอลูกค้าเลือก');
  renderTechnicianJobDetail(jobId);
}
function selectTechQuote(jobId, quoteId){
  const user = currentUser();
  if(!user || user.type!=='customer'){ toast('เฉพาะลูกค้าเท่านั้นที่เลือกใบเสนอราคาได้'); return; }
  let jobs = dbGet('qt_techjobs',[]);
  const job = jobs.find(j=>j.id===jobId);
  if(!job){ toast('ไม่พบงานนี้'); return; }
  if(job.customerId!==user.id){ toast('คุณไม่มีสิทธิ์เลือกช่างของงานนี้'); return; }
  if(job.status!=='open_for_quotes'){ toast('งานนี้ปิดรับเสนอราคาแล้ว'); return; }
  const quote = (job.quotes||[]).find(q=>q.id===quoteId);
  if(!quote){ toast('ไม่พบใบเสนอราคานี้'); return; }
  job.technicianId = quote.technicianId;
  job.technicianName = quote.technicianName;
  job.agreedPrice = quote.price;
  job.selectedQuoteId = quote.id;
  job.status = 'quote_selected'; /* V5.31: was 'requested' — selecting a quote must wait for the technician to confirm, not skip straight to a requested/accepted state */
  job.selectedAt = Date.now();
  dbSet('qt_techjobs', jobs);
  pushNotification(quote.technicianId, '🎉 ลูกค้าเลือกใบเสนอราคาของคุณ', 'งาน '+serviceTypeLabel(job.serviceType)+' ราคา '+quote.price+' บาท กรุณายืนยันรับงาน', 'technician-job/'+jobId);
  (job.quotes||[]).filter(q=>q.technicianId!==quote.technicianId).forEach(q=>{
    pushNotification(q.technicianId, 'ลูกค้าเลือกช่างท่านอื่นแล้ว', serviceTypeLabel(job.serviceType), 'technician-jobs');
  });
  toast('เลือกช่างเรียบร้อย รอช่างกดยืนยันรับงาน');
  renderTechnicianJobDetail(jobId);
}

function renderShopModules(){
  const user = currentUser(); if(!user||user.type!=='shop'){ navigate('login'); return; }
  const modules = user.modules || defaultModules();
  layout('แพ็กเกจและโมดูลของร้าน', `
    <h2>⚙️ แพ็กเกจและโมดูลของร้าน</h2>
    <p class="warn-text">ยังไม่มีการเรียกเก็บเงินจริง การเปิด/ปิดโมดูลเป็นเพียงการจำลอง</p>
    ${modules.map(m=>`
      <div class="module-card">
        <div><b>${m.label}</b><br>
          <span class="badge ${m.status==='enabled'?'badge-green':m.status==='trial'?'badge-yellow':'badge-gray'}">
            ${m.status==='enabled'?'เปิดใช้งาน':m.status==='trial'?'ทดลองใช้':'ไม่ได้เปิดใช้งาน'}
          </span>
        </div>
        <button class="btn-secondary" onclick="cycleModule('${m.module}')">เปลี่ยนสถานะ</button>
      </div>`).join('')}
  `);
}
function cycleModule(moduleKey){
  const users = dbGet('qt_users',[]); const user = currentUser();
  const idx = users.findIndex(u=>u.id===user.id);
  const modules = users[idx].modules || defaultModules();
  const m = modules.find(x=>x.module===moduleKey);
  const order = ['disabled','trial','enabled'];
  m.status = order[(order.indexOf(m.status)+1)%order.length];
  users[idx].modules = modules;
  dbSet('qt_users', users);
  toast(`โมดูล "${m.label}" เปลี่ยนเป็น: ${m.status==='enabled'?'เปิดใช้งาน':m.status==='trial'?'ทดลองใช้':'ไม่ได้เปิดใช้งาน'}`);
  renderShopModules();
}

<script>
/* =====================================================================
   V5.31 ADDITIONS — appended only, nothing above this block was removed.
   Covers: delivery-fee formula, GP 10% formula, Slide-to-Confirm engine,
   daily settlement + GP payment status screens (shop + admin).
   ===================================================================== */

/* ---------- 12. ค่าจัดส่งตามระยะทางจริง (GPS-based, ห้ามให้ผู้ใช้กรอกระยะทางเอง) ---------- */
function computeDeliveryFee(km){
  if(km<=5) return 30;
  if(km<=6) return 40;
  if(km<=7) return 50;
  return 50 + Math.ceil(km-7)*10;
}

/* ---------- 13/14. GP 10% + สูตรตั้งราคาขาย ---------- */
const QT_GP_RATE = 0.10; // ค่ามาตรฐานสำรอง — อัตราจริงมาจากฐานข้อมูล (มาตรฐาน + อัตราพิเศษรายร้านที่ Admin ตั้ง)
window.QT_GP_RATES = window.QT_GP_RATES || {};       // { shopUserId: {rate, promoUntil, note} }
window.QT_GP_DEFAULT_RATE = window.QT_GP_DEFAULT_RATE ?? 10;
function qtGpRatePercent(shopId){
  const r=(window.QT_GP_RATES||{})[shopId];
  if(r && Number.isFinite(r.rate) && (!r.promoUntil || r.promoUntil>=qtLocalDateKey())) return r.rate;
  const d=Number(window.QT_GP_DEFAULT_RATE); return Number.isFinite(d)?d:QT_GP_RATE*100;
}
function gpAmount(saleAmount, shopId){ return Math.round((Number(saleAmount)||0)*qtGpRatePercent(shopId))/100; }
function computeSellingPrice(cost, desiredProfit){
  const netWanted = (Number(cost)||0) + (Number(desiredProfit)||0);
  const u=(typeof currentUser==='function')?currentUser():null;
  const rate=Math.min(0.95,qtGpRatePercent(u&&u.type==='shop'?u.id:null)/100);
  return Math.ceil(netWanted / (1-rate));
}
function qtCalcSellingPrice(){
  const cost = parseFloat(document.getElementById('p-cost').value)||0;
  const profit = parseFloat(document.getElementById('p-profit').value)||0;
  if(!cost && !profit){ toast('กรอกต้นทุนหรือกำไรที่ต้องการก่อน'); return; }
  const sellPrice = computeSellingPrice(cost, profit);
  const _u=currentUser(); const gp = gpAmount(sellPrice,_u&&_u.type==='shop'?_u.id:null);
  const netReceived = sellPrice - gp;
  document.getElementById('p-price').value = sellPrice;
  document.getElementById('p-gp-preview').innerHTML =
    `ราคาขายที่แนะนำ: <b>${sellPrice} บาท</b><br>หัก GP ${qtGpRatePercent(_u&&_u.type==='shop'?_u.id:null)}% (${gp.toFixed(2)} บาท) → ร้านได้รับประมาณ <b>${netReceived.toFixed(2)} บาท</b>`;
}

/* ---------- 7. Slide to Confirm (ใช้แทนปุ่มยืนยันสำหรับการกระทำสำคัญ) ---------- */
function qtSlideConfirm(id, label, actionExpr, danger){
  return `<div class="qt-slide-confirm" id="${id}" data-qt-action="${escapeHtml(actionExpr)}">
    <div class="qt-slide-track ${danger?'qt-slide-danger':''}">
      <span class="qt-slide-label">${label}</span>
      <div class="qt-slide-thumb">➡️</div>
    </div>
  </div>`;
}
(function qtInitSlideEngine(){
  let dragging = null; // {el, track, thumb, maxX, action}
  function startDrag(el, clientX, pointerId){
    const track = el.querySelector('.qt-slide-track');
    const thumb = el.querySelector('.qt-slide-thumb');
    if(!track || !thumb || el.classList.contains('qt-slide-done')) return;
    const maxX = track.clientWidth - thumb.clientWidth - 6;
    dragging = { el, track, thumb, maxX, startX:clientX, thumbStartLeft:3,
                 action: el.getAttribute('data-qt-action'), pointerId };
    try{ thumb.setPointerCapture?.(pointerId); }catch(e){}
    el.classList.add('qt-sliding');
  }
  function moveDrag(clientX){
    if(!dragging) return;
    const delta = clientX - dragging.startX;
    let left = Math.min(Math.max(3, dragging.thumbStartLeft+delta), dragging.maxX);
    dragging.thumb.style.left = left+'px';
  }
  function endDrag(){
    if(!dragging) return;
    const { el, thumb, maxX, action } = dragging;
    const left = parseFloat(thumb.style.left||'3');
    el.classList.remove('qt-sliding');
    if(maxX>0 && left >= maxX*0.82){
      thumb.style.left = maxX+'px';
      el.classList.add('qt-slide-done');
      try{ (new Function(action))(); }catch(e){ console.error('slide action failed', e); }
    } else {
      thumb.style.left = '3px';
    }
    dragging = null;
  }
  document.addEventListener('pointerdown', e=>{
    const thumb = e.target.closest('.qt-slide-thumb');
    if(!thumb) return;
    const el = thumb.closest('.qt-slide-confirm');
    e.preventDefault();
    startDrag(el, e.clientX, e.pointerId);
  });
  document.addEventListener('pointermove', e=>{ if(dragging && (dragging.pointerId===undefined || dragging.pointerId===e.pointerId)){ e.preventDefault(); moveDrag(e.clientX); } });
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
})();

/* ---------- 16/17/18. สรุปยอดขายรายวัน + สถานะชำระ GP ---------- */
// สถานะการชำระ GP: pending_payment(รอชำระ) -> shop_reported(ร้านแจ้งโอน) -> under_review(รอตรวจสอบ) -> paid(ชำระแล้ว)
const GP_SETTLEMENT_STATUSES = {pending_payment:'รอชำระ', shop_reported:'ร้านแจ้งโอน', under_review:'รอตรวจสอบ', paid:'ชำระแล้ว'};
function computeDailySettlement(shopId, dateKey){
  const orders = dbGet('qt_orders',[]).filter(o=>o.shopId===shopId && (o.orderDate||qtLocalDateKey(o.createdAt))===dateKey);
  let grossSales=0, cancelledTotal=0, gp=0;
  orders.forEach(o=>{
    const sub = (typeof o.subtotal==='number') ? o.subtotal : o.total; // orders created before V5.31 have no subtotal field
    if(o.status==='cancelled'){ cancelledTotal += sub; return; } // ยกเลิก -> ไม่คิด GP
    grossSales += sub;
    gp += (typeof o.gpAmount==='number') ? o.gpAmount : gpAmount(sub,shopId);
  });
  const netSales = grossSales; // ยอดขายสุทธิ = ยอดขายที่ไม่ถูกยกเลิก (คืนเงินบางส่วนยังไม่รองรับข้อมูลในต้นฉบับ V5.30)
  return { dateKey, grossSales: grossSales+cancelledTotal, cancelledTotal, netSales, gp, amountDue: gp };
}
function getSettlementRecord(shopId, dateKey){
  const all = dbGet('qt_settlements',[]);
  return all.find(s=>s.shopId===shopId && s.dateKey===dateKey) || null;
}
function ensureSettlementRecord(shopId, dateKey){
  let all = dbGet('qt_settlements',[]);
  let rec = all.find(s=>s.shopId===shopId && s.dateKey===dateKey);
  if(!rec){
    rec = {id:uid(), shopId, dateKey, status:'pending_payment', createdAt:Date.now()};
    all.push(rec); dbSet('qt_settlements', all);
  }
  return rec;
}
function shopReportGpPayment(dateKey){
  const user = currentUser(); if(!user||user.type!=='shop'){ toast('ไม่มีสิทธิ์'); return; }
  let all = dbGet('qt_settlements',[]);
  let rec = all.find(s=>s.shopId===user.id && s.dateKey===dateKey);
  if(!rec) rec = ensureSettlementRecord(user.id, dateKey), all = dbGet('qt_settlements',[]);
  const target = all.find(s=>s.shopId===user.id && s.dateKey===dateKey);
  if(target.status!=='pending_payment'){ toast('รายการนี้แจ้งโอนไปแล้ว'); return; }
  target.status = 'shop_reported'; target.reportedAt = Date.now();
  dbSet('qt_settlements', all);
  toast('แจ้งโอนแล้ว รอแอดมินตรวจสอบ');
  renderShopSettlement();
}
function adminConfirmGpPayment(shopId, dateKey){
  const admin = currentUser(); if(!admin||admin.type!=='admin'){ toast('ไม่มีสิทธิ์'); return; }
  let all = dbGet('qt_settlements',[]);
  const rec = all.find(s=>s.shopId===shopId && s.dateKey===dateKey);
  if(!rec){ toast('ไม่พบรายการ'); return; }
  rec.status = 'paid'; rec.confirmedAt = Date.now(); rec.confirmedBy = admin.id;
  dbSet('qt_settlements', all);
  pushNotification(shopId, '✅ ยืนยันรับชำระ GP แล้ว', 'วันที่ '+dateKey, 'shop-settlement');
  toast('ยืนยันรับชำระแล้ว');
  renderAdminGpSettlement();
}
function renderShopSettlement(){
  const user = currentUser(); if(!user||user.type!=='shop'){ navigate('login'); return; }
  const today = qtLocalDateKey();
  const dates = [...new Set(dbGet('qt_orders',[]).filter(o=>o.shopId===user.id).map(o=>o.orderDate||qtLocalDateKey(o.createdAt)))]
    .sort((a,b)=>b.localeCompare(a));
  if(!dates.includes(today)) dates.unshift(today);
  layout('สรุปยอด/ชำระ GP', `
    <h2>💰 สรุปยอดขายรายวัน</h2>
    <p style="font-size:12px;color:#6b7280;">คิด GP ${qtGpRatePercent(user.id)}% จากยอดขายสุทธิ (ไม่รวมออเดอร์ที่ยกเลิก) — ร้านค้าไม่สามารถแก้ยอด GP เองได้</p>
    ${dates.map(d=>{
      const s = computeDailySettlement(user.id, d);
      const rec = getSettlementRecord(user.id, d);
      const status = rec ? rec.status : 'pending_payment';
      return `<div class="order-detail-card">
        <b>${d}</b><br>
        ยอดขายรวม: ${s.grossSales.toFixed(2)} บาท<br>
        ยอดยกเลิก: ${s.cancelledTotal.toFixed(2)} บาท<br>
        ยอดขายสุทธิ: ${s.netSales.toFixed(2)} บาท<br>
        GP: <b>${s.gp.toFixed(2)} บาท</b><br>
        สถานะการชำระ: <span class="badge ${status==='paid'?'badge-green':'badge-yellow'}">${GP_SETTLEMENT_STATUSES[status]}</span>
        ${status==='pending_payment' && s.gp>0 ? `<button class="btn-primary btn-block" onclick="shopReportGpPayment('${d}')">แจ้งโอนแล้ว</button>` : ''}
      </div>`;
    }).join('') || '<p>ยังไม่มีข้อมูลยอดขาย</p>'}
  `);
}
/* ---- Admin GP summary: daily view + whole-month view ---- */
window.__qtGpMode=window.__qtGpMode||'day';
function qtGpMonthKey(){ return window.__qtGpMonth||qtLocalDateKey().slice(0,7); }
function qtGpSetMode(m){ window.__qtGpMode=m; renderAdminGpSettlement(); }
function qtGpSetMonth(v){ if(/^\d{4}-\d{2}$/.test(String(v||''))){ window.__qtGpMonth=v; window.__qtGpMode='month'; renderAdminGpSettlement(); } }
function qtGpShiftMonth(delta){ const [y,m]=qtGpMonthKey().split('-').map(Number); const d=new Date(y,m-1+delta,1); qtGpSetMonth(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
function qtGpFmt(n){ return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function computeMonthlySettlement(shopId, monthKey){
  const orders=dbGet('qt_orders',[]).filter(o=>o.shopId===shopId && String(o.orderDate||qtLocalDateKey(o.createdAt)).startsWith(monthKey));
  const dates=[...new Set(orders.map(o=>o.orderDate||qtLocalDateKey(o.createdAt)))].sort();
  const t={shopId,monthKey,days:dates.length,orders:orders.filter(o=>o.status!=='cancelled').length,cancelledOrders:orders.filter(o=>o.status==='cancelled').length,gross:0,cancelled:0,net:0,gp:0,paidGp:0,unpaidGp:0,daily:[]};
  dates.forEach(d=>{
    const s=computeDailySettlement(shopId,d); const rec=getSettlementRecord(shopId,d); const status=rec?rec.status:'pending_payment';
    t.gross+=s.grossSales; t.cancelled+=s.cancelledTotal; t.net+=s.netSales; t.gp+=s.gp;
    if(status==='paid') t.paidGp+=s.gp; else t.unpaidGp+=s.gp;
    t.daily.push({dateKey:d,net:s.netSales,gp:s.gp,status});
  });
  return t;
}
function qtGpExportCsv(){
  const admin=currentUser(); if(!admin||admin.type!=='admin') return;
  const mk=qtGpMonthKey(); const rows=[['เดือน','ร้านค้า','วันที่','ยอดขายสุทธิ','GP','สถานะ']];

  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='gp-'+mk+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---- GP rate management (Admin): default rate + special rate per shop ---- */
window.qtPullGpRates=async function(){

};
function qtGpNudge(shopId,delta){ const el=document.getElementById('gp-rate-'+shopId); if(!el) return; const v=Math.min(100,Math.max(0,(Number(el.value)||0)+delta)); el.value=Math.round(v*100)/100; }

async function qtGpResetRate(shopId){

function qtGpRateCards(){

function renderAdminGpSettlement(){
  const admin = currentUser(); if(!admin||admin.type!=='admin'){ navigate('login'); return; }
  const shops = dbGet('qt_users',[]).filter(u=>u.type==='shop');
  const today = qtLocalDateKey(); const mode=window.__qtGpMode; const mk=qtGpMonthKey();

  else if(mode==='month'){
    const rowsData=shops.map(sh=>({sh,m:computeMonthlySettlement(sh.id,mk)}));
    const sum=rowsData.reduce((a,x)=>({net:a.net+x.m.net,gp:a.gp+x.m.gp,paid:a.paid+x.m.paidGp,unpaid:a.unpaid+x.m.unpaidGp,orders:a.orders+x.m.orders}),{net:0,gp:0,paid:0,unpaid:0,orders:0});
    body=`<div class="row-btns" style="margin:8px 0;align-items:center"><button class="btn-secondary" onclick="qtGpShiftMonth(-1)">◀</button><input type="month" value="${mk}" onchange="qtGpSetMonth(this.value)" style="flex:1;min-width:0"><button class="btn-secondary" onclick="qtGpShiftMonth(1)">▶</button><button class="btn-secondary" onclick="qtGpSetMonth(qtLocalDateKey().slice(0,7))">เดือนนี้</button></div>
      <div class="order-detail-card"><b>รวมทุกร้าน เดือน ${mk}</b><br>ออเดอร์ (ไม่รวมยกเลิก): ${sum.orders}<br>ยอดขายสุทธิ: ${qtGpFmt(sum.net)} บาท<br>GP รวม: <b>${qtGpFmt(sum.gp)} บาท</b><br>ชำระแล้ว: ${qtGpFmt(sum.paid)} บาท • ค้างชำระ: <b>${qtGpFmt(sum.unpaid)} บาท</b><button class="btn-secondary btn-block" style="margin-top:8px" onclick="qtGpExportCsv()">⬇️ ดาวน์โหลด CSV</button></div>`
      + (rowsData.map(({sh,m})=>`<div class="order-detail-card"><b>${escapeHtml(sh.shopName||sh.name)}</b><br>ออเดอร์ ${m.orders} (ยกเลิก ${m.cancelledOrders}) • ยอดขายสุทธิ ${qtGpFmt(m.net)} บาท<br>GP: <b>${qtGpFmt(m.gp)} บาท</b> • ชำระแล้ว ${qtGpFmt(m.paidGp)} • ค้าง <b>${qtGpFmt(m.unpaidGp)}</b>
        <details style="margin-top:6px"><summary>ดูรายวัน (${m.days} วัน)</summary>${m.daily.map(d=>`<div style="padding:6px 0;border-bottom:1px solid #eef2f7">${d.dateKey} • ขาย ${qtGpFmt(d.net)} • GP ${qtGpFmt(d.gp)} • <span class="badge ${d.status==='paid'?'badge-green':(d.status==='shop_reported'?'badge-yellow':'')}">${GP_SETTLEMENT_STATUSES[d.status]||d.status}</span>${d.status==='shop_reported'?` <button class="btn-primary" onclick="adminConfirmGpPayment('${sh.id}','${d.dateKey}')">✅ ยืนยันรับชำระ</button>`:''}</div>`).join('')||'<p>ไม่มีรายการในเดือนนี้</p>'}</details></div>`).join('')||'<p>ยังไม่มีร้านค้าในระบบ</p>');
  } else {
    body=shops.map(sh=>{
      const s = computeDailySettlement(sh.id, today);
      const rec = getSettlementRecord(sh.id, today);
      const status = rec ? rec.status : 'pending_payment';
      return `<div class="order-detail-card">
        <b>${escapeHtml(sh.shopName||sh.name)}</b><br>
        ยอดขายสุทธิวันนี้: ${s.netSales.toFixed(2)} บาท • GP: <b>${s.gp.toFixed(2)} บาท</b><br>
        สถานะ: <span class="badge ${status==='paid'?'badge-green':(status==='shop_reported'?'badge-yellow':'')}">${GP_SETTLEMENT_STATUSES[status]}</span>
        ${status==='shop_reported' ? `<button class="btn-primary btn-block" onclick="adminConfirmGpPayment('${sh.id}','${today}')">✅ ยืนยันรับชำระ</button>` : ''}
      </div>`;
    }).join('') || '<p>ยังไม่มีร้านค้าในระบบ</p>';
  }
  layout('สรุปยอด GP ร้านค้า', `<div class="qt-gp-shell"><div class="qt-gp-hero"><h2>💰 จัดการราคาและ GP ร้านค้า</h2><p>ดูยอดรายวัน/รายเดือน และปรับอัตราแต่ละร้านจากหน้าเดียว ออกแบบให้พอดีกับมือถือโดยไม่ต้องเลื่อนซ้าย–ขวา</p></div>${tabs}${body}</div>`);
}
</script>

<script id="qt-v547-batch7-security-hardening">
/* QueueGo Batch 7 — client-side security/authorization hardening.
   This is an additional client guard only; Supabase RLS/Server must remain the
   authoritative enforcement layer in Production. */
(function(){
  const QT_ROLE_PAGES={
    admin:new Set(['admin','admin-governance','admin-orders','admin-gp','admin-cash','admin-support','admin-gp-rates']),
    rider:new Set(['rider-setup','rider-jobs']),
    shop:new Set(['shop-setup','shop-products','shop-orders','shop-modules','shop-promote','shop-settlement']),
    technician:new Set(['technician-setup','technician-jobs','technician-job'])
  };
  function qtRouteAllowed(user,page){
    if(!user) return !QT_ROLE_PAGES.admin.has(page) && !QT_ROLE_PAGES.rider.has(page) &&
      !QT_ROLE_PAGES.shop.has(page) && !QT_ROLE_PAGES.technician.has(page);
    for(const [role,pages] of Object.entries(QT_ROLE_PAGES)){
      if(pages.has(page)) return user.type===role;
    }
    return true;
  }
  const oldQtRouteRender=window.qtRouteRender;
  window.qtRouteRender=function(){
    const hash=location.hash.replace('#','')||'home';
    const page=hash.split('/')[0];
    const user=currentUser();
    if(!qtRouteAllowed(user,page)){
      if(!user){ navigate('login'); return; }
      if(user.type==='rider' && !qtRiderCanUseApp(user)){ navigate('approval-pending'); return; }
      toast('คุณไม่มีสิทธิ์เข้าหน้านี้');
      navigate(user.type==='admin'?'admin':'dashboard');
      return;
    }
    return oldQtRouteRender();
  };

  function qtAdminGuard(){
    const u=currentUser();
    if(!u || u.type!=='admin' || u.status==='suspended' || u.status==='deleted'){
      toast('ไม่มีสิทธิ์ Admin');
      return null;
    }
    return u;
  }
  window.qtAdminGuard=qtAdminGuard;

  /* Re-check critical Admin mutations immediately before they write. */
  const oldApprove=window.adminApproveUser;
  window.adminApproveUser=function(id){
    const admin=qtAdminGuard(); if(!admin)return;
    const target=dbGet('qt_users',[]).find(u=>String(u.id)===String(id));
    if(!target || target.type==='admin'){ toast('ไม่สามารถอนุมัติบัญชีนี้ได้'); return; }
    if(!['pending','rejected'].includes(target.status)){ toast('สถานะบัญชีไม่อยู่ในขั้นตอนที่อนุมัติได้'); return; }
    return oldApprove(id);
  };
  const oldReject=window.adminRejectUser;
  window.adminRejectUser=function(id){
    const admin=qtAdminGuard(); if(!admin)return;
    const target=dbGet('qt_users',[]).find(u=>String(u.id)===String(id));
    if(!target || target.type==='admin'){ toast('ไม่สามารถเปลี่ยนสถานะบัญชีนี้ได้'); return; }
    if(target.status!=='pending'){ toast('บัญชีนี้ไม่ได้อยู่ในสถานะรออนุมัติ'); return; }
    return oldReject(id);
  };
  const oldSuspend=window.adminSuspendUser;
  window.adminSuspendUser=function(id){
    const admin=qtAdminGuard(); if(!admin)return;
    const target=dbGet('qt_users',[]).find(u=>String(u.id)===String(id));
    if(!target || target.type==='admin' || target.id===admin.id){ toast('ไม่สามารถระงับบัญชีนี้ได้'); return; }
    if(target.status!=='approved'){ toast('ระงับได้เฉพาะบัญชีที่อนุมัติแล้ว'); return; }
    return oldSuspend(id);
  };
  const oldUnsuspend=window.adminUnsuspendUser;
  window.adminUnsuspendUser=function(id){
    const admin=qtAdminGuard(); if(!admin)return;
    const target=dbGet('qt_users',[]).find(u=>String(u.id)===String(id));
    if(!target || target.type==='admin'){ toast('ไม่สามารถปลดระงับบัญชีนี้ได้'); return; }
    if(target.status!=='suspended'){ toast('บัญชีนี้ไม่ได้ถูกระงับ'); return; }
    return oldUnsuspend(id);
  };
})();
</script>


<script id="qt-v548-batch8-rider-documents-hardening">
/* QueueGo Batch 8 — Rider document validation and safer temporary storage.
   Documents are still client-side in this HTML application. Production should
   upload them to Supabase Storage and keep only storage paths in the profile. */
(function(){
  const MAX_FILE_BYTES=8*1024*1024;
  const MAX_IMAGE_BYTES=6*1024*1024;
  const ALLOWED_IMAGE=['image/jpeg','image/png','image/webp'];
  const ALLOWED_DOC=['image/jpeg','image/png','image/webp','application/pdf'];
  const DOC_INPUTS=['rr-photo','rr-id-front','rr-id-back','rr-license','rr-prb','rr-vehicle-photo'];

  function validRiderFile(file,inputId){
    if(!file) return {ok:false,message:'ไม่พบไฟล์'};
    if(file.size>MAX_FILE_BYTES) return {ok:false,message:'ไฟล์ต้องมีขนาดไม่เกิน 8 MB'};
    const isImage=file.type.startsWith('image/');
    if(isImage && file.size>MAX_IMAGE_BYTES) return {ok:false,message:'รูปภาพต้องมีขนาดไม่เกิน 6 MB'};
    if(!ALLOWED_DOC.includes(file.type)) return {ok:false,message:'รองรับเฉพาะ JPG, PNG, WebP หรือ PDF'};
    if(inputId==='rr-photo' && file.type==='application/pdf') return {ok:false,message:'รูปหน้าตรงต้องเป็นไฟล์รูปภาพ'};
    return {ok:true};
  }
  window.qtValidateRiderFile=validRiderFile;

  const oldPreview=window.riderFilePreview;
  window.riderFilePreview=async function(inputId,previewId){
    const input=document.getElementById(inputId);
    const file=input?.files?.[0];
    const check=validRiderFile(file,inputId);
    if(!check.ok){
      if(input) input.value='';
      toast(check.message);
      return;
    }
    return oldPreview(inputId,previewId);
  };

  /* Validate again immediately before registration, including draft files. */
  const oldRegister=window.handleRiderRegistration;
  window.handleRiderRegistration=async function(e){
    const files=DOC_INPUTS;
    for(const id of files){
      const input=document.getElementById(id);
      if(input?.files?.[0]){
        const check=validRiderFile(input.files[0],id);
        if(!check.ok){ input.value=''; toast(check.message); return false; }
      }
    }
    return oldRegister(e);
  };

  /* Prevent accidental external navigation from a data URL being treated as a document URL. */
  window.qtIsSafeRiderDocument=function(value){
    const s=String(value||'');
    return /^data:image\/(?:jpeg|png|webp);base64,/i.test(s) ||
           /^data:application\/pdf;base64,/i.test(s) ||
           /^https:\/\//i.test(s);
  };

  /* Make the temporary draft database easier to clean after long-lived sessions. */
  window.addEventListener('beforeunload',()=>{ try{
    const raw=sessionStorage.getItem('qt_rider_profile_draft');
    if(raw){
      const v=JSON.parse(raw);
      if(v?.at && Date.now()-v.at>24*60*60*1000) sessionStorage.removeItem('qt_rider_profile_draft');
    }
  }catch(e){} });
})();
</script>


<script id="qt-v549-batch9-online-consistency">
/* QueueGo Batch 9 — offline/online consistency and realtime-ready safeguards.
   This does not pretend to provide native push/background GPS; those require the
   mobile app/backend layer. */
(function(){
  const OLD_APP_VERSION=window.QT_ONLINE_CONFIG?.APP_VERSION;
  if(window.QT_ONLINE_CONFIG) window.QT_ONLINE_CONFIG.APP_VERSION='V5.50';

  function riderPresenceEligible(){
    const u=currentUser();
    return !!(u && u.type==='rider' && u.status==='approved' && u.suspended!==true);
  }

  /* Never publish an online Rider state for an account that is not approved. */
  const originalSendPresence=window.qtSendPresence;
  window.qtSendPresence=function(status,coords){
    if(!riderPresenceEligible() && qtSession()?.role==='rider'){
      status='offline';
      coords=null;
    }
    return originalSendPresence(status,coords);
  };

  /* Clear local presence immediately when the account becomes unavailable. */
  function reconcileRiderPresence(){
    try{
      const u=currentUser();
      if(u?.type==='rider' && !qtRiderCanUseApp(u)){
        qtSetRiderPresence(u.id,'offline',{reason:'account_not_approved'});
        qtSyncRiderPresenceToUser(u.id,'offline');
      }
    }catch(e){}
  }

  /* Network transitions: mark local state clearly and attempt the existing outbox
     only when the configured backend is actually enabled. */
  window.addEventListener('online',()=>{
    try{ qtNetState('ready','อุปกรณ์ออนไลน์ — พร้อมซิงก์ข้อมูล'); }catch(e){}
    try{ reconcileRiderPresence(); }catch(e){}
  });
  window.addEventListener('offline',()=>{
    try{ qtNetState('pending','ออฟไลน์ — รอซิงก์เมื่อกลับมาออนไลน์'); }catch(e){}
  });

  /* Avoid duplicate native/browser alerts caused by the same notification id. */
  const handled=new Map();
  window.qtShouldHandleNotification=function(n){
    if(!n?.id) return true;
    const now=Date.now(), key=String(n.id);
    for(const [k,t] of handled) if(now-t>10*60*1000) handled.delete(k);
    if(handled.has(key)) return false;
    handled.set(key,now);
    return true;
  };

  /* Add a last-known timestamp to the diagnostic state without changing business data. */
  window.qtOnlineDiagnostics=function(){
    const cfg=window.QT_ONLINE_CONFIG||{};
    const state=typeof qtReadNetState==='function'?qtReadNetState():{};
    return {
      appVersion:cfg.APP_VERSION||OLD_APP_VERSION||'unknown',
      onlineMode:!!cfg.ONLINE_MODE,
      backendConfigured:!!cfg.API_BASE_URL,
      network:navigator.onLine?'online':'offline',
      lastStateAt:state.at||null,
      lastState:state.state||'unknown',
      outbox:typeof qtOutboxSize==='function'?qtOutboxSize():0,
      realtimeBackendRequired:true,
      nativePushRequired:true,
      backgroundGpsRequired:true
    };
  };

  /* Clean up old session-only presence entries in the current browser session. */
  setInterval(()=>{
    try{
      const all=qtGetRiderPresence(), now=Date.now(), changed=[];
      Object.keys(all).forEach(id=>{
        const t=Date.parse(all[id]?.lastSeenAt||'');
        if(t && now-t>QT_ONLINE_CONFIG.PRESENCE_TIMEOUT_MS*2){
          delete all[id]; changed.push(id);
        }
      });
      if(changed.length) sessionStorage.setItem(QT_RIDER_PRESENCE_KEY,JSON.stringify(all));
    }catch(e){}
  },30000);

  window.addEventListener('unhandledrejection',e=>{
    console.warn('QueueGo unhandled promise rejection:',e.reason);
  });
})();
</script>


<script id="qt-real-time-v1">
/* QueueGo Real-time v1
   - Uses Supabase Realtime (WebSocket) instead of page refresh/polling.
   - Rehydrates only after database events; the page itself is never refreshed.
   - If Realtime is unavailable, the existing background sync remains as fallback.
*/
(function(){
  let client=null, channel=null, loading=false, queued=false, retry=0;
  const TABLES=['users','shop_profiles','technician_profiles','rider_profiles','products','orders','order_items','deliveries','payments','notifications','order_chat_messages','quotations','promotions','settlements','audit_logs','order_audit'];

  function currentPageNeedsRender(){
    try{
      const p=(location.hash||'').replace(/^#/, '').split('/')[0];
      return ['home','search','shop-view','cart','checkout','orders','order','shop-orders','shop-products','dashboard','admin','admin-orders','admin-gp','admin-cash','admin-support','admin-gp-rates','shop-settlement','rider-jobs','technician-jobs','technician-job','notifications'].includes(p);
    }catch(e){ return true; }
  }

  async function refreshFromRealtime(reason){
    if(loading){ queued=true; return; }
    loading=true;
    try{
      if(typeof qtHydrateDatabase==='function') await qtHydrateDatabase({light:false});
      if(typeof router==='function' && currentPageNeedsRender()){
        const y=window.scrollY;
        router();
        requestAnimationFrame(()=>window.scrollTo(0,y));
      }
      window.dispatchEvent(new CustomEvent('qt:realtime-update',{detail:{reason}}));
    }catch(e){ console.warn('[QueueGo Realtime] hydrate failed:',e); }
    finally{
      loading=false;
      if(queued){ queued=false; setTimeout(()=>refreshFromRealtime('queued'),300); }
    }
  }

  function subscribe(){
    if(!client) return;
    if(channel){ try{client.removeChannel(channel);}catch(e){} }
    channel=client.channel('qt-live-data-v1');
    TABLES.forEach(table=>{
      channel.on('postgres_changes',{event:'*',schema:'public',table},payload=>{
        refreshFromRealtime(table+':'+payload.eventType);
      });
    });
    channel.subscribe(status=>{
      window.QT_REALTIME_STATUS=status;
      document.documentElement.dataset.qtRealtime=String(status||'').toLowerCase();
      if(status==='SUBSCRIBED'){
        retry=0;
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status:'SUBSCRIBED'}}));
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status}}));
        retry=Math.min(retry+1,6);
        setTimeout(()=>{ try{subscribe();}catch(e){} }, Math.min(30000,1000*Math.pow(2,retry)));
      }
    });
  }

  function loadClient(){
    if(window.supabase?.createClient){
      try{ client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}}); subscribe(); return; }catch(e){console.warn('[QueueGo Realtime] init failed',e);}
    }
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    sc.async=true;
    sc.onload=()=>{
      try{
        client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}});
        subscribe();
      }catch(e){console.warn('[QueueGo Realtime] client init failed',e);}
    };
    sc.onerror=()=>console.warn('[QueueGo Realtime] CDN unavailable; fallback sync remains active');
    document.head.appendChild(sc);
  }

  window.addEventListener('online',()=>{ if(client) subscribe(); });
  window.addEventListener('hashchange',()=>{ if(client && window.QT_REALTIME_STATUS!=='SUBSCRIBED') subscribe(); });

})();

<script id="qt-admin-governance-v560">
