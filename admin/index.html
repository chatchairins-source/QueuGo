/* ===== QueueGo Modern UI Refresh v2 ===== */

<script id="qt-v532-helpers">
/* V5.32 helpers — defined first so every later script can use them */
function escapeHtml(value){ return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }


/* Sync state: in-flight writes, per-row "last persisted" hashes, polling bookkeeping */
const QT_SYNC={pending:0,lastWrite:0,busy:false,dirty:{},hash:{},profileMaps:null,tick:0,lastErrorToast:0,timer:null};
const QT_RIDER_IMAGE_FIELDS=['profileImage','idCardFrontImage','idCardBackImage','driverLicenseImage','compulsoryInsuranceImage','vehiclePhoto'];
function qtTrackPersist(p){
  QT_SYNC.pending++; QT_SYNC.lastWrite=Date.now();
  return Promise.resolve(p).finally(()=>{ QT_SYNC.pending=Math.max(0,QT_SYNC.pending-1); QT_SYNC.lastWrite=Date.now(); });
}
function qtSyncFailed(key,err){
  console.warn('Supabase sync failed:',key,err);
  /* Notifications are auxiliary. A notification RLS failure must never make an
     order, cancellation, assignment, payment, or other business action look
     like it failed. The notification remains in the current session and will
     be retried by the normal sync cycle after the DB policy is corrected. */
  if(key==='qt_notifications'){ console.warn('QueueGo notification sync failed; auth/session may need refresh.', {hasSession:!!qtSessionRead(), hasAccessToken:!!qtAccessToken(), hasRefreshToken:!!qtSessionRead()?.refreshToken}); return; }
  if(Date.now()-QT_SYNC.lastErrorToast<15000) return;
  QT_SYNC.lastErrorToast=Date.now();
  try{ toast('บันทึกข้อมูลขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ('+String((err&&err.message)||'unknown').slice(0,80)+')'); }catch(e){}
}
/* notifications: in-app objects use {body, link}; the table has {message, type, reference_id} */
function qtNotifDbParts(n){
  const m=String(n.link||'').match(/^(order|technician-job)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {type:m[1]==='order'?'order':'quotation',ref:m[2]};
  return {type:['order','quotation','delivery','payment','complaint','system'].includes(n.type)?n.type:'system',ref:(n.referenceId&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(n.referenceId))?n.referenceId:null};
}
function qtNotifLinkFromRow(n){ if(!n.reference_id) return undefined; if(n.type==='order') return 'order/'+n.reference_id; if(n.type==='quotation') return 'technician-job/'+n.reference_id; return undefined; }
/* never send the password (or other secrets) to the database inside metadata */
function qtUserMetadata(u){
  const m=Object.assign({},u);
  delete m.password;
  /* Batch 3: account status/identity stay in users columns; profile metadata is
     only for rider/shop/technician profile details and documents. */
  delete m.status;
  delete m.applicationStatus;
  delete m.authUserId;
  delete m.type;
  delete m.id;
  return m;
}
function qtRiderProfileRow(u){
  const status = u.status==='suspended' ? 'suspended'
    : u.status==='approved' ? 'active'
    : 'pending';
  return {
    user_id:u.id,
    rider_name:u.name||'ไรเดอร์',
    phone:u.phone||null,
    vehicle_type:u.vehicleType||null,
    vehicle_plate:u.vehiclePlate||null,
    address:u.address||null,
    latitude:u.lat??null,
    longitude:u.lng??null,
    status,
    metadata:qtUserMetadata(u)
  };
}
</script>

<script id="qt-supabase-client">
/* QueueGo Supabase connection — public publishable key only */
window.QT_SUPABASE_CONFIG = {
  URL: 'https://pkypiqhlrmzocysgeqew.supabase.co',
  KEY: 'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
function qtSupabaseHeaders(accessToken){
  const h={apikey:QT_SUPABASE_CONFIG.KEY,'Content-Type':'application/json'};
  if(accessToken) h.Authorization='Bearer '+accessToken;
  return h;
}
async function qtSupabaseAuth(path, body){
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/'+path,{method:'POST',headers:qtSupabaseHeaders(),body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return ({})});
  if(!r.ok) throw new Error(data.error_description||data.msg||data.message||'AUTH_ERROR');
  return data;
}
async function qtSupabaseRpc(fn,args={}){
  const token=await qtGetAccessToken();
  const headers=qtSupabaseHeaders(token);
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/rpc/'+fn,{method:'POST',headers,body:JSON.stringify(args),signal:AbortSignal.timeout(15000)});
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok) throw new Error((data&&data.message)||'RPC_ERROR_'+r.status);
  return data;
}
async function qtSupabaseTable(path, options={}){
  const headers=qtSupabaseHeaders(options.accessToken);
  const isNotif=String(path).startsWith('notifications');
  const rep=isNotif ? 'return=minimal' : 'return=representation';
  if(['POST','PATCH','PUT'].includes(String(options.method||'GET').toUpperCase())){
    headers.Prefer=String(path).includes('on_conflict=') && String(options.method||'').toUpperCase()==='POST'
      ? rep+',resolution=merge-duplicates' : rep;
  }
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):undefined,signal:AbortSignal.timeout(15000)});
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok) throw new Error((data&&data.message)||((data&&data.hint)?data.hint:'DB_ERROR_'+r.status));
  return data;
}

  return digits+'@auth.queuetech.local';
}

}

async function qtRenderAdminRiderPresence(){

  if(!el)return;
  el.textContent='กำลังโหลดสถานะไรเดอร์…';

    if(!token)throw Error('กรุณาเข้าสู่ระบบ Admin');
    const [users,profiles]=await Promise.all([
      qtSupabaseTable('users?select=id,name,role,status&role=eq.rider',{accessToken:token}),
      qtSupabaseTable('rider_profiles?select=user_id,status,metadata,updated_at',{accessToken:token})

      return '<div class="qt-rider-online-card"><strong>'+escapeHtml(u.name||'ไรเดอร์')+'</strong><span style="float:right">'+state+'</span></div>';

<script>
/* =========================================================================
   QueueGo V5.51 — Single File Application
   Notification RLS resilience: notification sync failures are non-blocking.
   Based on V5.50 search-location build.
   ========================================================================= */
/* =========================================================================
   QueueGo V5.8 — Single File Application
   Vanilla JS + Supabase + Leaflet/OSM
   ⚠️ ระบบนี้ยังมีส่วนที่อยู่ระหว่างพัฒนา — ข้อมูลระบบบันทึกใน Supabase; Session ชั่วคราวเก็บใน sessionStorage
   ห้ามใช้ข้อมูลจริงหรือนำขึ้น Production โดยไม่ปรับปรุงระบบความปลอดภัยก่อน
   ========================================================================= */

/* ---------- Supabase-backed application data layer ----------
   Business data is kept in memory and persisted to Supabase.
   LocalStorage is NOT used for users/orders/technician jobs/quotes/notifications/audit/finance.
   sessionStorage is used only for the current browser session token. */
const QT_DB_CACHE = Object.create(null);
const QT_DB_KEYS = new Set(['qt_users','qt_orders','qt_techjobs','qt_notifications','qt_audit_log','qt_finance_ledger','qt_promotions','qt_products','qt_settlements','qt_order_audit']);
const QT_DB_READY = {value:false};
function dbGet(key, def){
  if(Object.prototype.hasOwnProperty.call(QT_DB_CACHE,key)) return QT_DB_CACHE[key];
  if(String(key).startsWith('qt_cart_')){
    try{
      const raw=sessionStorage.getItem(key);
      if(raw!==null){
        const parsed=JSON.parse(raw);
        QT_DB_CACHE[key]=parsed;
        return parsed;
      }
    }catch(e){}
  }
  return def!==undefined ? def : [];
}
function dbSet(key, val){
  QT_DB_CACHE[key]=val;
  if(String(key).startsWith('qt_cart_')){
    try{ sessionStorage.setItem(key,JSON.stringify(val)); }catch(e){}
    try{ updateCartCountUI(); }catch(e){}
    return;
  }
  if(QT_SYNC.busy) QT_SYNC.dirty[key]=val; /* a poll is in flight: re-apply this local write after it finishes */
  if(QT_DB_KEYS.has(key)) qtTrackPersist(qtPersistKey(key,val)).catch(err=>qtSyncFailed(key,err));
  else if(String(key).startsWith('qt_order_chat_') && !String(key).endsWith('_deleteAt')) qtTrackPersist(qtPersistChat(String(key).replace('qt_order_chat_',''),val)).catch(err=>qtSyncFailed(key,err));
}

async function qtPersistChat(orderId,messages){

    if(!QT_DB_HYDRATE_QUEUED || !opts.light) QT_DB_HYDRATE_QUEUED=opts;
    return;
  }
  if(QT_SYNC.busy){ setTimeout(()=>qtBackgroundHydrate(opts),1000); return; } /* a sync poll is in flight; try again shortly */
  const token=await qtGetAccessToken();
  if(!token){ QT_DB_READY.value=true; return; }
  QT_DB_HYDRATING=true; QT_SYNC.busy=true; QT_SYNC.dirty={}; /* busy also pauses the sync loop and records local writes made meanwhile */
  let ok=false;
  try{
    await qtHydrateDatabase(opts);
    try{ if(typeof qtPullSystemSettings==='function') await qtPullSystemSettings(); }catch(e){ console.warn('system settings pull failed',e); }
    try{ if(typeof qtPullGpRates==='function') await qtPullGpRates(); }catch(e){ console.warn('gp rates pull failed',e); }
    ok=true;
  }catch(err){
    console.error('Background hydrate failed:',err);
    try{ if(qtSessionRead()?.role==='admin') toast('โหลดข้อมูลสมาชิกจากฐานข้อมูลไม่สำเร็จ'); }catch(e){}
  }finally{
    if(!opts.light) QT_DB_FULL_TRIED=true;
    if(qtAccessToken()===token) Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; }); /* keep local writes made during the load */
    QT_SYNC.dirty={}; QT_SYNC.busy=false; QT_DB_HYDRATING=false;
  }
  const now=qtAccessToken();
  if(!now){ qtResetCache(); QT_DB_HYDRATE_QUEUED=null; return; } /* logged out while loading */
  if(now!==token) QT_DB_HYDRATE_QUEUED={light:false}; /* another account signed in while loading: load again for it */
  else if(ok) qtRerenderAfterHydrate();
  const q=QT_DB_HYDRATE_QUEUED; QT_DB_HYDRATE_QUEUED=null;
  if(q) setTimeout(()=>qtBackgroundHydrate(q),0);
}
/* After the background load lands, refresh the page the person is looking at (never while they are typing). */
function qtRerenderAfterHydrate(tries){
  tries=tries||0;
  if(!currentUser()) return;
  const name=(location.hash.replace('#','')||'home').split('/')[0];
  if(['login','register','rider-register'].includes(name)) return; /* these pages do not depend on loaded data */
  const a=document.activeElement;
  const typing=(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) ||
    [].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typing){ if(tries<6) setTimeout(()=>qtRerenderAfterHydrate(tries+1),1500); return; }
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ---------- Central Notification Engine ----------
   General notifications: vibration once.
   Important notifications: vibration pattern once.
   Action-required notifications:
   - Rider new job: voice + repeating vibration until Accept
   - Customer rider arrival: voice + repeating vibration until Acknowledge
   Shop/Admin/Technician: visual + vibration only; no voice.
*/
const QT_NOTIFY_VIBRATION = {
  normal: [180],
  important: [260,120,260],
  critical: [500,160,500,160,900]
};
const qtNotificationVibrationTimers = {};

function qtVibrate(pattern){
  try{
    if(navigator && typeof navigator.vibrate === 'function'){
      navigator.vibrate(pattern);
      return true;
    }
  }catch(e){}
  return false;
}
function qtNotificationPriority(n){
  if(!n) return 'normal';
  const t=String(n.type||'').toLowerCase();
  if(['rider_arrived','rider_job','rider_job_offer'].includes(t)) return 'critical';
  if(['new_order','order_update','dispatch','support','approval','admin_alert'].includes(t)) return 'important';
  if(String(n.title||'').includes('มีงานจัดส่งใหม่') || String(n.title||'').includes('ไรเดอร์ของคุณมาถึงแล้ว')) return 'critical';
  return 'normal';
}
function qtStartNotificationVibration(n){
  if(!n || n.read || n.dismissed) return;
  const key=String(n.id||uid());
  qtStopNotificationVibration(key);
  const priority=qtNotificationPriority(n);
  if(priority==='critical'){
    const run=()=>qtVibrate(QT_NOTIFY_VIBRATION.critical);
    run();
    qtNotificationVibrationTimers[key]=setInterval(run,2200);
  }else{
    qtVibrate(priority==='important' ? QT_NOTIFY_VIBRATION.important : QT_NOTIFY_VIBRATION.normal);
  }
}
function qtStopNotificationVibration(key){
  if(key && qtNotificationVibrationTimers[key]){
    clearInterval(qtNotificationVibrationTimers[key]);
    delete qtNotificationVibrationTimers[key];
  }
  try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(0); }catch(e){}
}
function qtHandleNewNotification(n){
  const cur=currentUser();
  if(!cur || !n || n.userId!==cur.id) return;
  qtStartNotificationVibration(n);
  showLiveToast((n.title||'การแจ้งเตือน')+': '+(n.body||n.message||''), n.link);
}

function pushNotification(userId, title, body, link, type, referenceId){
  let all = dbGet('qt_notifications',[]);
  const now=Date.now();
  const safeLink=link||undefined;
  const inferred=qtNotifDbParts({link:safeLink,type,referenceId});
  /* Batch 5: prevent duplicate notifications caused by overlapping polling/monitors.
     The same user + title + body + link within a short window is one event. */
  const duplicate=all.find(n=>
    n.userId===userId &&
    String(n.title||'')===String(title||'') &&
    String(n.body||n.message||'')===String(body||'') &&
    String(n.link||'')===String(safeLink||'') &&
    now-Number(n.createdAt||0)<4000
  );
  if(duplicate){
    if(!duplicate.read) qtHandleNewNotification(duplicate);
    return duplicate;
  }
  const n={
    id:uid(),
    userId,
    title:title||'การแจ้งเตือน',
    body:body||'',
    link:safeLink,
    type:inferred.type,
    referenceId:referenceId || inferred.ref || null,
    read:false,
    createdAt:now
  };
  all.push(n);
  dbSet('qt_notifications', all);
  qtHandleNewNotification(n);
  return n;
}
function showLiveToast(text, link){
  const box = document.getElementById('notif-toast-box');
  if(!box) return;
  const el = document.createElement('div');
  el.className = 'notif-toast';
  el.textContent = '🔔 ' + text;
  if(link) el.onclick = ()=>navigate(link);
  box.appendChild(el);
  setTimeout(()=>el.remove(), 5000);
}
function markAllNotifRead(userId){
  let all = dbGet('qt_notifications',[]).map(n=> n.userId===userId ? {...n, read:true, readAt:n.readAt||Date.now()} : n);

  dbSet('qt_notifications', all);
}

          <b>${escapeHtml(n.title)}</b><small>${escapeHtml(n.body)} • ${new Date(n.createdAt).toLocaleString('th-TH')}</small>
        </div>`).join('') : '<p style="padding:10px;">ยังไม่มีการแจ้งเตือน</p>'}

let qtAudioUnlocked=false;
let qtArrivalAudioContext=null;

function qtUnlockAudio(){
  qtAudioUnlocked=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC){
      if(!qtArrivalAudioContext) qtArrivalAudioContext=new AC();
      if(qtArrivalAudioContext.state==='suspended') qtArrivalAudioContext.resume();
    }
  }catch(e){}
  // SpeechSynthesis on iOS is more reliable after a user gesture.
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(' ');
      u.lang='th-TH'; u.volume=0;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}
document.addEventListener('click',qtUnlockAudio,{passive:true});
document.addEventListener('touchend',qtUnlockAudio,{passive:true});
document.addEventListener('pointerup',qtUnlockAudio,{passive:true});

function qtAdminOnly(){
  const u=currentUser();
  if(!u || u.type!=='admin'){ toast('เฉพาะ Admin เท่านั้น'); navigate('login'); return null; }
  return u;
}
function qtAudit(action, data={}){
  const u=currentUser();
  const logs=dbGet('qt_audit_log',[]);
  const d=(data&&typeof data==='object')?data:{};
  /* V5.53: audit_logs.entity_type is NOT NULL in Supabase. Many callers only
     supplied orderId/promotionId/etc., so infer a stable entity type/id before
     the row is persisted. */
  let entityType=d.entityType||d.entity_type||null;
  let entityId=d.entityId||d.entity_id||null;
  if(!entityType){
    const pairs=[
      ['orderId','order'],['order_id','order'],
      ['promotionId','promotion'],['promotion_id','promotion'],
      ['shopId','shop'],['shop_id','shop'],
      ['userId','user'],['user_id','user'],
      ['riderId','rider'],['rider_id','rider'],
      ['technicianId','technician'],['technician_id','technician'],
      ['productId','product'],['product_id','product'],
      ['customerId','customer'],['customer_id','customer']
    ];
    for(const [k,t] of pairs){
      if(d[k]!==undefined && d[k]!==null && String(d[k]).trim()!==''){ entityType=t; entityId=d[k]; break; }
    }
  }
  if(!entityType) entityType='system';
  if(!entityId || !qtUuidLike(entityId)) entityId=null;
  logs.push({id:uid(), action, actorId:u?.id||null, actorRole:u?.type||null, entityType, entityId, at:Date.now(), ...d});
  dbSet('qt_audit_log',logs);
}
function qtFinanceEntry(type, data={}){
  const entries=dbGet('qt_finance_ledger',[]);
  entries.push({id:uid(), type, createdAt:Date.now(), ...data});
  dbSet('qt_finance_ledger',entries);
}
function qtPromoStatusLabel(s){

function adminApprovePromotion(id){
  const admin=qtAdminOnly(); if(!admin)return;
  let promos=dbGet('qt_promotions',[]); const p=promos.find(x=>x.id===id);

  if(p.status!=='pending'){toast('รายการนี้ไม่ได้อยู่ในสถานะรออนุมัติ');return;}
  p.status='approved'; p.approvedBy=admin.id; p.approvedAt=Date.now(); p.rejectedBy=null; p.rejectedAt=null; p.rejectedReason=null;
  dbSet('qt_promotions',promos); qtAudit('promotion_approve',{promotionId:id,shopId:p.shopId,bidPrice:p.bidPrice});
  pushNotification(p.shopId,'✅ Promote ได้รับอนุมัติ','Admin อนุมัติคำขอแล้ว กรุณาดำเนินการชำระเงินก่อนเปิดใช้งาน','shop-promote');

function adminRejectPromotion(id){
  const admin=qtAdminOnly(); if(!admin)return;

  let promos=dbGet('qt_promotions',[]); const p=promos.find(x=>x.id===id);
  if(!p){toast('ไม่พบคำขอ Promote');return;}
  p.status='rejected'; p.rejectedBy=admin.id; p.rejectedAt=Date.now(); p.rejectedReason=reason.trim()||'ไม่ผ่านการตรวจสอบ';
  dbSet('qt_promotions',promos); qtAudit('promotion_reject',{promotionId:id,shopId:p.shopId,reason:p.rejectedReason});
  pushNotification(p.shopId,'❌ Promote ไม่ได้รับอนุมัติ',p.rejectedReason,'shop-promote');
  toast('ไม่อนุมัติ Promote แล้ว'); renderAdminGovernance();
}

/* ---------- V5.32 polling sync (there was no way for one device to see another's changes) ---------- */
function qtSyncHash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return h; }
function qtSyncSignature(){
  const me=currentUser();
  const main=qtSyncHash(JSON.stringify([me&&me.status,...['qt_users','qt_orders','qt_techjobs','qt_notifications','qt_products','qt_promotions','qt_settlements','qt_order_audit'].map(key=>dbGet(key,[]))]));
  const chat=qtSyncHash(JSON.stringify(Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&!k.endsWith('_deleteAt')).sort().map(k=>[k,(QT_DB_CACHE[k]||[]).length])));
  return {main,chat};
}
function qtSyncRerender(before,after){
  const user=currentUser(); if(!user) return;
  const name=(location.hash.replace('#','')||'home').split('/')[0];
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; /* never interrupt typing */
  if(before.main===after.main) return;
  const safe=['notifications','admin','admin-orders','admin-gp','admin-cash','admin-support','admin-gp-rates'];
  if(!safe.includes(name)) return;
  const typed=[].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typed) return;
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}
async function qtSyncTick(force){
  if(QT_SYNC.busy || QT_DB_HYDRATING) return;
  if(document.hidden && !force) return;
  if(!qtAccessToken()) return;
  if(QT_SYNC.pending>0 || Date.now()-QT_SYNC.lastWrite<2500) return; /* let our own writes land first */
  QT_SYNC.busy=true; QT_SYNC.dirty={};
  try{
    QT_SYNC.tick++;
    const me=currentUser();
    const full=(QT_SYNC.tick%8===0)||(me&&!isApproved(me))||!QT_DB_FULL_TRIED; /* light poll every 8s, full refresh about once a minute */
    const before=qtSyncSignature();
    const seenNotifs=new Set(dbGet('qt_notifications',[]).map(n=>n.id));
    await qtHydrateDatabase({light:!full});
    if(!qtAccessToken()){ qtResetCache(); return; } /* logged out while fetching */
    Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
    if(me){ dbGet('qt_notifications',[]).forEach(n=>{ if(n.userId===me.id && !n.read && !seenNotifs.has(n.id)){ try{ qtHandleNewNotification(n); }catch(e){} } }); }
    const after=qtSyncSignature();
    if(after.main!==before.main||after.chat!==before.chat) qtSyncRerender(before,after);
  }catch(e){ console.warn('sync tick failed',e); }
  finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
}
function qtStartSyncLoop(){
  if(QT_SYNC.timer) return;
  QT_SYNC.timer=setInterval(()=>qtSyncTick(),8000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) qtSyncTick(); });
}
window.addEventListener('DOMContentLoaded', async ()=>{
  /* V5.33: show the page first, load Supabase data in the background */
  const hadSession=!!qtAccessToken();
  if(hadSession) await qtRestoreOwnUser(); /* one small request (own account row) so a refresh keeps the signed-in user */
  router();
  qtStartSyncLoop(); /* does not block the UI */
  setTimeout(()=>{ qtBackgroundHydrate({light:false}); },0);
});

/* ---------- QT Order Number ---------- */
/* Customer-facing order number: QT-001, QT-002, ... (3 digits).
   Numbering is GLOBAL across all shops and resets each calendar day.
   Therefore no two shops can receive the same QT number on the same day.
   The internal id remains unchanged for routing/storage compatibility. */
function qtLocalDateKey(ts){
  const d = new Date(ts || Date.now());
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function displayOrderNumber(order){
  const raw = String(order?.orderNumber || order?.order_number || '').trim();
  /* รูปแบบใหม่ QT-YYYYMMDD-xxxx (ฝังวันที่เพื่อความ unique ในฐานข้อมูล) -> แสดงเฉพาะ QT-xxxx */
  const dated = raw.match(/^QT-\d{8}-(\d{3,4})$/i);
  if(dated) return 'QT-'+dated[1];
  if(raw) return raw; /* เลขออเดอร์รูปแบบเดิม (เช่น QT-001) ยังแสดงตามเดิมเพื่อความเข้ากันได้กับข้อมูลเก่า */
  return 'QT-'+String(ordersFallbackNumber(order)).padStart(3,'0');
}
function ordersFallbackNumber(order){
  const orders=dbGet('qt_orders',[]);
  const idx=orders.findIndex(o=>o.id===order?.id);
  return idx>=0 ? idx+1 : 1;
}

(function qtInitSlideEngine(){
  let dragging = null; // {el, track, thumb, maxX, action}
  function startDrag(el, clientX, pointerId){
    const track = el.querySelector('.qt-slide-track');
    const thumb = el.querySelector('.qt-slide-thumb');
    if(!track || !thumb || el.classList.contains('qt-slide-done')) return;
    const maxX = track.clientWidth - thumb.clientWidth - 6;
    dragging = { el, track, thumb, maxX, startX:clientX, thumbStartLeft:3,
                 action: el.getAttribute('data-qt-action'), pointerId };
    try{ thumb.setPointerCapture?.(pointerId); }catch(e){}
    el.classList.add('qt-sliding');
  }
  function moveDrag(clientX){
    if(!dragging) return;
    const delta = clientX - dragging.startX;
    let left = Math.min(Math.max(3, dragging.thumbStartLeft+delta), dragging.maxX);
    dragging.thumb.style.left = left+'px';
  }
  function endDrag(){
    if(!dragging) return;
    const { el, thumb, maxX, action } = dragging;
    const left = parseFloat(thumb.style.left||'3');
    el.classList.remove('qt-sliding');
    if(maxX>0 && left >= maxX*0.82){
      thumb.style.left = maxX+'px';
      el.classList.add('qt-slide-done');
      try{ (new Function(action))(); }catch(e){ console.error('slide action failed', e); }
    } else {
      thumb.style.left = '3px';
    }
    dragging = null;
  }
  document.addEventListener('pointerdown', e=>{
    const thumb = e.target.closest('.qt-slide-thumb');
    if(!thumb) return;
    const el = thumb.closest('.qt-slide-confirm');
    e.preventDefault();
    startDrag(el, e.clientX, e.pointerId);
  });
  document.addEventListener('pointermove', e=>{ if(dragging && (dragging.pointerId===undefined || dragging.pointerId===e.pointerId)){ e.preventDefault(); moveDrag(e.clientX); } });
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
})();

  if(!confirm('ยกเลิกอัตราพิเศษของร้านนี้และกลับไปใช้อัตรามาตรฐาน?')) return;
  try{
    await qtDeleteRows('shop_gp_rates','shop_user_id=eq.'+encodeURIComponent(shopId));
    if(window.QT_GP_RATES) delete window.QT_GP_RATES[shopId];
    try{ qtAudit('gp_rate_reset',{entityType:'user',entityId:shopId,userId:shopId}); }catch(e){}
    toast('กลับไปใช้อัตรามาตรฐานแล้ว'); renderAdminGpSettlement();
  }catch(e){ console.error(e); toast('ไม่สำเร็จ: '+String((e&&e.message)||e).slice(0,70)); }
}
async function qtGpSaveDefault(){
  const admin=qtAdminOnly(); if(!admin) return;
  const rate=Number((document.getElementById('gp-default-rate')||{}).value);
  if(!Number.isFinite(rate)||rate<0||rate>100){ toast('อัตรา GP ต้องอยู่ระหว่าง 0-100%'); return; }
  try{
    const t=await qtGetAccessToken();
    await qtSupabaseTable('system_settings?on_conflict=key',{method:'POST',accessToken:t,body:{key:'gp',value:{default_rate:rate},updated_at:new Date().toISOString()}});
    window.QT_GP_DEFAULT_RATE=rate;
    try{ qtAudit('gp_default_update',{entityType:'system_settings',entityId:'gp',rate}); }catch(e){}
    toast('บันทึกอัตรา GP มาตรฐานแล้ว'); renderAdminGpSettlement();
  }catch(e){ console.error(e); toast('บันทึกไม่สำเร็จ: '+String((e&&e.message)||e).slice(0,70)); }
}
function qtGpRateCards(){
  const shops=dbGet('qt_users',[]).filter(u=>u.type==='shop'); const def=Number(window.QT_GP_DEFAULT_RATE); const today=qtLocalDateKey();
  const head=`<div class="qt-gp-card"><div class="qt-gp-card-head"><div><b>⚙️ อัตรา GP มาตรฐาน</b><div class="qt-admin-note">ค่าเริ่มต้นสำหรับร้านที่ไม่ได้กำหนดอัตราพิเศษ</div></div><span class="badge">ค่าเริ่มต้น</span></div><div class="qt-gp-ratebox"><button class="btn-secondary" onclick="document.getElementById('gp-default-rate').stepDown();">−</button><input id="gp-default-rate" type="number" min="0" max="100" step="0.5" value="${def}"><span class="qt-gp-percent">%</span><button class="btn-secondary" onclick="document.getElementById('gp-default-rate').stepUp();">+</button></div><button class="btn-primary btn-block" onclick="qtGpSaveDefault()">💾 บันทึกอัตรามาตรฐาน</button><small class="qt-gp-help">มีผลกับออเดอร์ใหม่เท่านั้น • ออเดอร์เก่ายังคงอัตราเดิม</small></div>`;
  return head+(shops.map(sh=>{
    const ov=(window.QT_GP_RATES||{})[sh.id]; const active=!!ov&&(!ov.promoUntil||ov.promoUntil>=today); const eff=active?ov.rate:def;
    const tag=active?`<span class="badge badge-green">🎯 อัตราพิเศษ ${eff}%${ov.promoUntil?' ถึง '+ov.promoUntil:''}</span>`:(ov?`<span class="badge">โปรหมดอายุแล้ว (ใช้ ${def}%)</span>`:`<span class="badge">มาตรฐาน ${def}%</span>`);
    return `<div class="qt-gp-card"><div class="qt-gp-card-head"><b>🏪 ${escapeHtml(sh.shopName||sh.name)}</b>${tag}</div><div class="qt-gp-ratebox"><button class="btn-secondary" onclick="qtGpNudge('${sh.id}',-1)">−</button><input id="gp-rate-${sh.id}" type="number" min="0" max="100" step="0.5" value="${eff}"><span class="qt-gp-percent">%</span><button class="btn-secondary" onclick="qtGpNudge('${sh.id}',1)">+</button></div><div class="qt-gp-date"><label>ใช้ถึงวันที่ • เว้นว่างหากไม่กำหนดวันสิ้นสุด</label><input id="gp-until-${sh.id}" type="date" value="${ov&&ov.promoUntil?ov.promoUntil:''}"></div><div class="row-btns"><button class="btn-primary" onclick="qtGpSaveRate('${sh.id}')">💾 บันทึกอัตรา</button>${ov?`<button class="btn-secondary" onclick="qtGpResetRate('${sh.id}')">↩️ ใช้ค่ามาตรฐาน</button>`:''}</div></div>`;
  }).join('')||'<p>ยังไม่มีร้านค้าในระบบ</p>');
}

  const DEFAULTS={delivery5:40,delivery10:60,riderRadius:10,techRadius:30,orderTimeout:30,systemFee:0,notifications:true};
  function readSettings(){
    try{const raw=localStorage.getItem(SETTINGS_KEY); const v=raw?JSON.parse(raw):{}; return Object.assign({},DEFAULTS,v||{});}catch(e){return Object.assign({},DEFAULTS);}
  }
  window.qtGetSystemSettings=function(){return readSettings();};
  /* pull the admin's settings from the database so every device uses the same fees */
  window.qtPullSystemSettings=async function(){
    const t=await qtGetAccessToken(); if(!t) return;
    const rows=await qtSupabaseTable('system_settings?select=value&key=eq.app&limit=1',{accessToken:t});
    const v=Array.isArray(rows)&&rows[0]&&rows[0].value;
    if(v&&typeof v==='object'){ try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(v));}catch(e){} }
  };
  window.qtSaveSystemSettings=async function(){
    const admin=typeof qtAdminOnly==='function'?qtAdminOnly():null; if(!admin)return;
    const val=(id,fallback)=>{const el=document.getElementById(id); const n=Number(el?.value); return Number.isFinite(n)?n:fallback;};
    const cfg={delivery5:val('qt-set-delivery5',40),delivery10:val('qt-set-delivery10',60),riderRadius:val('qt-set-riderRadius',10),techRadius:val('qt-set-techRadius',30),orderTimeout:val('qt-set-orderTimeout',30),systemFee:val('qt-set-systemFee',0),notifications:!!document.getElementById('qt-set-notifications')?.checked};
    cfg.delivery5=Math.max(0,cfg.delivery5); cfg.delivery10=Math.max(cfg.delivery5,cfg.delivery10); cfg.riderRadius=Math.max(0,cfg.riderRadius); cfg.techRadius=Math.max(0,cfg.techRadius); cfg.orderTimeout=Math.max(1,cfg.orderTimeout); cfg.systemFee=Math.min(100,Math.max(0,cfg.systemFee));
    try{const t=await qtGetAccessToken();if(!t)throw Error('กรุณาเข้าสู่ระบบใหม่');
      await qtSupabaseTable('system_settings?on_conflict=key',{method:'POST',accessToken:t,body:{key:'app',value:cfg,updated_at:new Date().toISOString()}});
      try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(cfg))}catch(e){}
    }catch(err){toast('บันทึกการตั้งค่าไม่สำเร็จ: '+String(err.message||err).slice(0,70));return}
    try{qtAudit('system_settings_update',{entityType:'system_settings',entityId:'system',settings:cfg});}catch(e){}
    toast('💾 บันทึกการตั้งค่าแล้ว');
  };
  window.qtAdminViewUser=function(id){
    const admin=typeof qtAdminOnly==='function'?qtAdminOnly():null; if(!admin)return;
    const users=typeof dbGet==='function'?dbGet('qt_users',[]):[]; const u=users.find(x=>x.id===id); if(!u){toast('ไม่พบผู้ใช้');return;}
    const role={customer:'👤 ลูกค้า',shop:'🏪 ร้านค้า',rider:'🛵 ไรเดอร์',technician:'🔧 ช่าง',admin:'🛡️ Admin'}[u.type]||u.type||'-';
    const status=typeof accountStatusLabel==='function'?accountStatusLabel(u.status):u.status||'-';
    const text=['ข้อมูลบัญชี',`ชื่อ: ${u.name||'-'}`,`โทรศัพท์: ${u.phone||'-'}`,`ประเภท: ${role}`,`สถานะ: ${status}`,`ID: ${u.id||'-'}`,`สมัครเมื่อ: ${u.createdAt?new Date(u.createdAt).toLocaleString('th-TH'):'-'}`];
    if(u.type==='admin') text.push('สิทธิ์: Admin ไม่สามารถระงับหรือลบผ่านระบบนี้');
    else if(u.suspendedAt) text.push(`ระงับเมื่อ: ${new Date(u.suspendedAt).toLocaleString('th-TH')}`,`เหตุผล: ${u.suspendedReason||'-'}`);
    alert(text.join('\n'));

  window.qtAdminRefreshAuditLog=function(){

async function qgLoadAdminCash(day){
 const el=document.getElementById('qg-admin-cash-results');
 try{
   const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');

   const live=rows.filter(x=>x.order_status!=='cancelled');
   const issues=live.filter(x=>['picked_up','in_progress','completed'].includes(x.order_status)&&(
     x.rider_advance==null||x.merchant_receipt==null||Number(x.rider_advance)!==Number(x.subtotal)||
     Number(x.merchant_receipt||0)!==Number(x.subtotal)||
     (x.order_status==='completed'&&x.customer_payment_status!=='paid')));
   const body=`<p>ออเดอร์ ${rows.length} • ตรวจสอบเพิ่มเติม ${issues.length}</p>

     <p>เงินสดที่ร้านยืนยันรับ: <b>฿${money(total('merchant_receipt'))}</b></p>

     +rows.map(x=>`<div style="padding:12px 0;border-top:1px solid #e5e7eb"><b>${escapeHtml(x.order_number||'')}</b> · ${escapeHtml(x.shop_name||'ร้านค้า')}<br><small>สถานะ ${escapeHtml(x.order_status||'-')} • ไรเดอร์ ${escapeHtml(x.rider_name||'-')}</small><br><small>ค่าสินค้า ฿${money(x.subtotal)} • ไรเดอร์สำรอง ฿${money(x.rider_advance)} • ร้านยืนยัน ฿${money(x.merchant_receipt)}</small><br><small>ลูกค้าชำระ ${escapeHtml(x.customer_payment_status||'-')} • GP ฿${money(x.gp_amount)} (${escapeHtml(x.gp_status||'-')})</small>${issues.includes(x)?'<br><strong style="color:#b91c1c">ต้องตรวจสอบยอดหรือสถานะ</strong>':''}</div>`).join('');
   if(el)el.innerHTML=body;
 }catch(e){if(el)el.textContent='โหลดข้อมูลไม่สำเร็จ: '+e.message;}
}

 window.renderAdminSupportInbox=function(){
   if(currentUser()?.type!=='admin')return navigate('login');
   layout('ข้อความร้านค้า','<div class="qg-admin-support"><h2>ข้อความจากร้านค้า</h2><button class="btn-secondary" type="button" onclick="navigate(\'admin\')">← กลับหน้าแอดมิน</button><section class="card"><h3>ร้านที่ติดต่อมา</h3><div id="qg-support-shops" class="qg-support-list">กำลังโหลด...</div></section><section class="card"><h3 id="qg-support-title">เลือกข้อความร้านค้า</h3><div id="qg-support-messages" class="qg-support-messages"></div><form id="qg-support-form" onsubmit="return qgAdminReply(event)" hidden><textarea id="qg-support-reply" maxlength="2000" required placeholder="พิมพ์คำตอบให้ร้าน"></textarea><button class="btn-primary btn-block" type="submit">ส่งข้อความ</button></form></section></div>');
   qgLoadAdminSupport();
 };
 window.qgSelectAdminSupport=function(id){selected=id;qgLoadAdminSupport()};
 window.qgLoadAdminSupport=async function(){
   if(loading)return;const inbox=document.getElementById('qg-support-shops'),body=document.getElementById('qg-support-messages');if(!inbox||!body)return;
   loading=true;
   try{const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
     const rows=await qtSupabaseTable('shop_support_messages?select=id,shop_user_id,sender_user_id,body,slip_path,created_at&order=created_at.asc',{accessToken:token});
     const ids=[...new Set(rows.map(m=>m.shop_user_id))];
     const profiles=ids.length?await qtSupabaseTable('shop_profiles?select=user_id,shop_name&user_id=in.('+ids.join(',')+')',{accessToken:token}):[];
     const names=new Map((profiles||[]).map(x=>[x.user_id,x.shop_name]));
     if(!ids.includes(selected))selected=ids[0]||null;
     inbox.innerHTML=ids.length?ids.map(id=>'<button type="button" class="'+(selected===id?'active':'')+'" onclick="qgSelectAdminSupport(\''+escapeHtml(id)+'\')">'+escapeHtml(names.get(id)||'ร้านค้า')+' · '+rows.filter(m=>m.shop_user_id===id).length+' ข้อความ</button>').join(''):'ยังไม่มีข้อความจากร้านค้า';
     document.getElementById('qg-support-title').textContent=selected?'สนทนากับ '+(names.get(selected)||'ร้านค้า'):'เลือกข้อความร้านค้า';
     document.getElementById('qg-support-form').hidden=!selected;
     body.innerHTML=rows.filter(m=>m.shop_user_id===selected).map(m=>'<div class="qg-support-bubble '+(m.sender_user_id===currentUser().id?'mine':'')+'">'+escapeHtml(m.body)+(m.slip_path?'<button class="btn-secondary btn-block" type="button" data-slip="'+escapeHtml(m.slip_path)+'" onclick="qgOpenAdminGpSlip(this.dataset.slip)">ดูสลิป GP</button>':'')+'<small style="display:block;color:#728579">'+new Date(m.created_at).toLocaleString('th-TH')+'</small></div>').join('')||'ยังไม่มีข้อความ';
   }catch(e){body.textContent='โหลดข้อความไม่สำเร็จ: '+(e.message||e)}
   finally{loading=false}
 };
 window.qgAdminReply=function(event){
   event.preventDefault();const input=document.getElementById('qg-support-reply'),button=event.target.querySelector('button'),body=input?.value.trim(),id=selected;if(!id||!body)return false;
   button.disabled=true;(async()=>{try{const token=await qtGetAccessToken();await qtSupabaseTable('shop_support_messages',{method:'POST',accessToken:token,body:{shop_user_id:id,sender_user_id:currentUser().id,body}});input.value='';await qgLoadAdminSupport()}catch(e){toast('ส่งข้อความไม่สำเร็จ: '+(e.message||e))}finally{button.disabled=false}})();return false;
 };
 setInterval(()=>{if(location.hash==='#admin-support')qgLoadAdminSupport()},20000);
})();
</script>
<script id="qg-v22-admin-operations">
(function(){
 const adminPages=new Set(['admin','admin-governance','admin-orders','admin-gp','admin-cash','admin-support','admin-gp-rates','notifications','admin-market']);
 window.qtRouteRender=function(){const page=(location.hash.replace('#','')||'login').split('/')[0],u=currentUser();
   if(!u){if(page!=='login'&&location.hash!=='#login'){location.hash='#login';return}renderLogin();return}
   if(u.type!=='admin'||u.status!=='approved'){document.getElementById('app').innerHTML='<main class="qg-v23-admin-denied"><h1>เฉพาะบัญชีผู้ดูแล QueueGo</h1><p>มีบัญชีบทบาทอื่นค้างอยู่ในแท็บนี้</p><button type="button" onclick="qgAdminSwitchAccount()">เข้าสู่ระบบผู้ดูแล</button></main>';return}
   if(!adminPages.has(page)){location.hash='#admin';return}
   switch(page){case'admin-market':return renderAdminMarket();case'admin':return renderAdminDashboard(u);case'admin-governance':return renderAdminGovernance();case'admin-orders':return renderAdminOrderCenter(u);case'admin-gp':return renderAdminGpSettlement();case'admin-cash':return renderAdminCash();case'admin-support':return renderAdminSupportInbox();case'admin-gp-rates':return renderAdminGpRates();case'notifications':return renderNotifications()}
 };
 window.qgAdminSwitchAccount=function(){clearSession();qtResetCache();location.hash='#login';router()};
 window.renderLogin=function(){document.title='เข้าสู่ระบบ Admin - QueueGo';document.getElementById('app').innerHTML='<main class="qg-v23-admin-login"><div class="qg-v23-admin-card"><div class="qg-v23-admin-mark">Q</div><h1>QueueGo</h1><p>เข้าสู่ระบบผู้ดูแล</p><form onsubmit="return handleLogin(event)"><label>เบอร์โทรศัพท์หรืออีเมล<input id="login-phone" required autocomplete="username" inputmode="email"></label><label>รหัสผ่าน<input id="login-password" required type="password" autocomplete="current-password"></label><button type="submit">เข้าสู่ระบบ</button></form></div></main>'};
 window.handleLogin=async function(e){e.preventDefault();const button=e.submitter||e.target.querySelector('button'),login=document.getElementById('login-phone').value.trim(),password=document.getElementById('login-password').value;if(button.disabled)return false;button.disabled=true;try{
   const auth=await qtSupabaseAuth('token?grant_type=password',{email:login.includes('@')?login.toLowerCase():qtAuthEmailFromPhone(login),password});if(!auth.access_token||!auth.user?.id)throw Error('ไม่สามารถรับเซสชันจากระบบได้');const p=await qtLoadOwnSupabaseUser(auth.access_token,auth.user.id);
   if(!p||p.role!=='admin'||p.status!=='active')throw Error('บัญชีนี้ไม่มีสิทธิ์ผู้ดูแลที่ใช้งานได้');
   const user=qtUserFromRow(p);QT_DB_CACHE.qt_users=[user];qtMarkClean('qt_users');setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:auth.access_token,refreshToken:auth.refresh_token||null,expiresAt:auth.expires_at||Math.floor(qtJwtExpiryMs(auth.access_token)/1000)||null,role:'admin'});
   navigate('admin');setTimeout(()=>qtBackgroundHydrate({light:false}),0);
 }catch(err){toast('เข้าสู่ระบบ Admin ไม่สำเร็จ: '+err.message)}finally{button.disabled=false}return false};
 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const token=()=>qtGetAccessToken();
 const req=async(path,method='GET',body=null)=>{const t=await token();if(!t)throw Error('กรุณาเข้าสู่ระบบ');return qtSupabaseTable(path,{method,accessToken:t,body})};
 window.qgAdminRequest=req;
 const active=()=>currentUser()?.type==='admin';
 const money=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});


 const states={pending:'รอร้าน',accepted:'รับแล้ว',preparing:'กำลังเตรียม',ready:'รอไรเดอร์',assigned:'ไรเดอร์รับงาน',picked_up:'รับสินค้าแล้ว',in_progress:'กำลังส่ง',completed:'สำเร็จ',cancelled:'ยกเลิก'};
 window.qgAdminOrderFilter='all';
 window.renderAdminOrderCenter=function(){if(!active())return navigate('login');layout('ศูนย์ออเดอร์','<div class="qg-v22-admin-orders"><h2>ออเดอร์จริง</h2><div id="qg-v22-order-filters"></div><div id="qg-v22-order-list">กำลังโหลดจากฐานข้อมูล...</div></div>');qgLoadAdminOrders()};
 window.qgLoadAdminOrders=async function(){const list=document.getElementById('qg-v22-order-list'),tabs=document.getElementById('qg-v22-order-filters');if(!list)return;
   try{const rows=await req('orders?select=id,order_number,status,subtotal,delivery_fee,gp_amount,total_amount,customer_id,shop_id,rider_id,created_at&order=created_at.desc&limit=500');if(!list.isConnected)return;
     tabs.innerHTML='<button type="button" data-status="all">ทั้งหมด '+rows.length+'</button>'+Object.entries(states).map(([key,label])=>'<button type="button" data-status="'+key+'">'+label+' '+rows.filter(o=>o.status===key).length+'</button>').join('');
     tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{qgAdminOrderFilter=b.dataset.status;paint()});
     function paint(){tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.status===qgAdminOrderFilter));const shown=rows.filter(o=>qgAdminOrderFilter==='all'||o.status===qgAdminOrderFilter);
       list.innerHTML=shown.map(o=>'<article><strong>'+safe(o.order_number)+'</strong><span>'+safe(states[o.status]||o.status)+'</span><p>สินค้า '+money(o.subtotal)+' · ค่าส่ง '+money(o.delivery_fee)+' · GP '+money(o.gp_amount)+' · รวม '+money(o.total_amount)+'</p><small>'+new Date(o.created_at).toLocaleString('th-TH')+'</small><div><button type="button" data-id="'+safe(o.id)+'" data-op="trace">ตรวจเส้นทางเงิน</button><button type="button" data-id="'+safe(o.id)+'" data-op="delete">ลบพร้อมเก็บหลักฐาน</button></div></article>').join('')||'<p>ไม่มีออเดอร์สถานะนี้</p>';
       list.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>b.dataset.op==='trace'?qgAdminTrace(b.dataset.id):qgAdminDeleteReviewed(b.dataset.id));}
     paint();
   }catch(e){list.textContent='โหลดออเดอร์ไม่สำเร็จ: '+e.message}
 };
 window.qgAdminDeleteReviewed=async function(id){if(!active()||!confirm('ลบออเดอร์นี้โดยเก็บภาพรวมการเงินและหลักฐานไว้ในคลังตรวจสอบ?'))return;try{await qtDeleteOrderFromDatabase(id);await qgLoadAdminOrders();toast('ลบออเดอร์และเก็บหลักฐานแล้ว')}catch(e){toast('ลบออเดอร์ไม่สำเร็จ: '+e.message)}};
 window.qgAdminTrace=async function(id){if(!active())return;const box=document.createElement('section');box.className='qg-v22-admin-modal';box.innerHTML='<div class="qg-v22-admin-sheet"><button type="button" class="qg-close">✕</button><h2>เส้นทางออเดอร์และเงินสด</h2><div class="qg-content">กำลังโหลด...</div></div>';document.body.appendChild(box);box.querySelector('.qg-close').onclick=()=>box.remove();box.onclick=e=>{if(e.target===box)box.remove()};
   try{const x=await req('rpc/qg_admin_order_trace','POST',{p_order_id:id}),o=x.order||x.archived?.order||{},pay=x.payment||x.archived?.payments?.[0],advance=x.rider_cash||x.archived?.cash_advance,receipt=x.merchant_receipt||x.archived?.merchant_receipt,delivery=x.delivery||x.archived?.deliveries?.[0],proof=x.proof||x.archived?.proof;
     box.querySelector('.qg-content').innerHTML='<p><b>'+safe(o.order_number||id)+'</b> · '+safe(states[o.status]||o.status||'ข้อมูลในคลัง')+'</p><div class="qg-v22-trace-grid">'+[['ลูกค้า',o.customer_id],['ร้าน',o.shop_id],['ไรเดอร์',o.rider_id],['ค่าสินค้า',money(o.subtotal)],['ค่าส่ง',money(o.delivery_fee)],['GP',money(o.gp_amount)],['ยอดรวม',money(o.total_amount)],['ไรเดอร์จ่ายร้าน',advance?money(advance.amount)+' · '+new Date(advance.paid_at).toLocaleString('th-TH'):'ยังไม่บันทึก'],['ร้านยืนยันรับ',receipt?money(receipt.amount)+' · '+new Date(receipt.received_at).toLocaleString('th-TH'):'ยังไม่ยืนยัน'],['ลูกค้าจ่ายไรเดอร์',pay?.status==='paid'?money(pay.amount)+' · '+new Date(pay.paid_at).toLocaleString('th-TH'):'ยังไม่บันทึก'],['ส่งมอบ',delivery?.delivered_at?new Date(delivery.delivered_at).toLocaleString('th-TH'):'ยังไม่ส่งสำเร็จ'],['ยืนยัน PIN',proof?.otp_verified?'ยืนยันแล้ว':'ยังไม่มีหลักฐาน']].map(([label,value])=>'<div><small>'+label+'</small><b>'+safe(value||'-')+'</b></div>').join('')+'</div>'+(proof?.photo_path?'<button type="button" data-evidence="'+safe(proof.photo_path)+'" onclick="qgAdminOpenEvidence(this.dataset.evidence)">ดูรูปส่งมอบ</button>':'')+'<h3>Audit Trail</h3>'+(x.audit||[]).map(a=>'<p>'+new Date(a.created_at).toLocaleString('th-TH')+' · '+safe(a.action)+' · '+safe(a.user_id||'ระบบ')+'</p>').join('');
   }catch(e){box.querySelector('.qg-content').textContent='ตรวจสอบไม่สำเร็จ: '+e.message}
 };
 window.qgAdminOpenEvidence=async function(path){try{const t=await token(),r=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/sign/qg-evidence/'+path,{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const d=await r.json();if(!r.ok)throw Error(d.message);window.open(QT_SUPABASE_CONFIG.URL+'/storage/v1'+d.signedURL,'_blank','noopener')}catch(e){toast('เปิดหลักฐานไม่สำเร็จ: '+e.message)}};
 const category={missing_item:'สินค้าไม่ครบ',wrong_item:'สินค้าไม่ตรง',damaged_food:'อาหารเสียหาย',rider:'ไรเดอร์',merchant:'ร้านค้า',payment:'ชำระเงิน',cash:'เงินสด',gp:'GP',other:'อื่น ๆ'};
 window.qgAdminTickets=function(){if(!active())return;const box=document.createElement('section');box.className='qg-v22-admin-modal';box.id='qg-v22-admin-tickets';box.innerHTML='<div class="qg-v22-admin-sheet"><button type="button" class="qg-close">✕</button><h2>เรื่องร้องเรียน</h2><div class="qg-content">กำลังโหลด...</div></div>';document.body.appendChild(box);box.querySelector('.qg-close').onclick=()=>box.remove();box.onclick=e=>{if(e.target===box)box.remove()};qgAdminLoadTickets()};
 window.qgAdminLoadTickets=async function(){const body=document.querySelector('#qg-v22-admin-tickets .qg-content');if(!body)return;try{const tickets=await req('qg_support_tickets?select=id,user_id,role,order_id,original_order_id,category,details,status,admin_id,admin_note,evidence_path,created_at&order=created_at.desc&limit=200');if(!body.isConnected)return;
   body.innerHTML=tickets.length?tickets.map(t=>'<article><b>'+safe(category[t.category]||t.category)+'</b><span>'+safe(t.status)+'</span><small>'+safe(t.role)+' · '+new Date(t.created_at).toLocaleString('th-TH')+' · '+safe(t.user_id)+'</small><p>'+safe(t.details)+'</p>'+(t.order_id||t.original_order_id?'<button type="button" data-order="'+safe(t.order_id||t.original_order_id)+'" onclick="qgAdminTrace(this.dataset.order)">ตรวจออเดอร์</button>':'')+(t.evidence_path?'<button type="button" data-path="'+safe(t.evidence_path)+'" onclick="qgAdminOpenEvidence(this.dataset.path)">ดูหลักฐาน</button>':'')+'<div><select data-ticket="'+safe(t.id)+'"><option value="OPEN">OPEN</option><option value="IN_REVIEW">IN_REVIEW</option><option value="WAITING_USER">WAITING_USER</option><option value="RESOLVED">RESOLVED</option><option value="REJECTED">REJECTED</option><option value="CLOSED">CLOSED</option></select><input data-note="'+safe(t.id)+'" placeholder="บันทึกผลการตรวจสอบ" maxlength="2000"><button type="button" data-action="'+safe(t.id)+'">บันทึกสถานะ</button></div></article>').join(''):'ยังไม่มีเรื่องร้องเรียน';
   for(const t of tickets){const sel=body.querySelector('select[data-ticket="'+t.id+'"]');if(sel)sel.value=t.status;const btn=body.querySelector('button[data-action="'+t.id+'"]');if(btn)btn.onclick=async()=>{btn.disabled=true;try{await req('rpc/qg_admin_ticket_action','POST',{p_ticket_id:t.id,p_status:sel.value,p_note:body.querySelector('input[data-note="'+t.id+'"]').value||null,p_admin_id:null});await qgAdminLoadTickets()}catch(e){toast('บันทึก Ticket ไม่สำเร็จ: '+e.message);btn.disabled=false}}}
 }catch(e){body.textContent='โหลดเรื่องร้องเรียนไม่สำเร็จ: '+e.message}};
})();
</script>
<style id="qg-v22-admin-operations-style">.qg-v22-admin-live{padding:14px;background:#fff;border:1px solid #dceae3;border-radius:16px;margin:12px 0}.qg-v22-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:7px}.qg-v22-admin-grid button{border:1px solid #dceae3;border-radius:11px;background:#f6fbf8;padding:9px;text-align:left;color:#174936}.qg-v22-admin-grid b{display:block;font-size:18px}.qg-v22-admin-orders{max-width:800px;margin:auto}.qg-v22-admin-orders #qg-v22-order-filters{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.qg-v22-admin-orders #qg-v22-order-filters button{border:1px solid #dceae3;background:#fff;padding:7px;border-radius:9px}.qg-v22-admin-orders #qg-v22-order-filters .active{background:#ddf8ec;color:#065a42}.qg-v22-admin-orders article,.qg-v22-admin-sheet article{border:1px solid #deeee5;border-radius:14px;padding:12px;margin:9px 0;background:#fff;overflow-wrap:anywhere}.qg-v22-admin-orders article span,.qg-v22-admin-sheet article span{float:right;color:#087c59}.qg-v22-admin-orders article p{margin:8px 0}.qg-v22-admin-orders article small,.qg-v22-admin-sheet article small{display:block;color:#78897f}.qg-v22-admin-orders article button,.qg-v22-admin-sheet button:not(.qg-close){margin:6px 5px 0 0;padding:8px;border:1px solid #cce6d8;border-radius:9px;background:#eaf9f0;color:#146b4e}.qg-v22-admin-modal{position:fixed;inset:0;z-index:100000;background:#102a2aa0;display:grid;place-items:center;padding:12px}.qg-v22-admin-sheet{width:min(100%,640px);max-height:92dvh;overflow:auto;border-radius:18px;background:#fff;padding:17px;color:#193d32}.qg-v22-admin-sheet .qg-close{float:right;border:0;background:#edf7f1;border-radius:9px;padding:9px}.qg-v22-trace-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.qg-v22-trace-grid>div{background:#f6faf7;border:1px solid #e0eee4;border-radius:10px;padding:9px;overflow-wrap:anywhere}.qg-v22-trace-grid b{display:block;font-size:12px}.qg-v22-admin-sheet input,.qg-v22-admin-sheet select{max-width:100%;padding:8px;border:1px solid #d5e8dc;border-radius:8px}
</style>

body:has(.qg-v23-admin-login),body:has(.qg-v23-admin-denied){padding:0}

.qg-v23-admin-login button,.qg-v23-admin-denied button{width:100%;border:0;border-radius:12px;background:#d91232;color:white;padding:14px;font:inherit;font-weight:700;cursor:pointer}
.qg-v23-admin-login button:disabled{opacity:.55}
.qg-v23-admin-denied{flex-direction:column}.qg-v23-admin-denied button{max-width:320px}

<style id="qg-admin-control-restore-style">
.qg-approval-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.qg-approval-tabs button{min-height:42px;border:1px solid #f0c9d2;border-radius:12px;background:#fff;color:#a90f2e;font:inherit;font-weight:700}.qg-approval-tabs button.active{background:#df1235;color:#fff;border-color:#df1235}.qg-approval-card[hidden],#qg-approval-filter-empty[hidden]{display:none!important}
.qt-admin-home-actions button:nth-child(-n+4){border-color:#f0d3da;background:#fff9fa}.qt-admin-home-actions button:nth-child(-n+4) span{color:#a7092b}.qt-admin-home-actions b{color:#d00e32}

<script id="qg-admin-control-restore">
(function(){
  const allowed=new Set(['qt-sec-overview','qt-sec-approval','qt-sec-security','qt-sec-delivery','qt-sec-shops']);
  window.qgAdminApprovalRole=function(role){
    if(!['shop','rider','all'].includes(role))role='all';
    window.QG_ADMIN_APPROVAL_ROLE=role;
    document.querySelectorAll('[data-approval-filter]').forEach(b=>b.classList.toggle('active',b.dataset.approvalFilter===role));
    let count=0;
    document.querySelectorAll('.qg-approval-card').forEach(card=>{const show=role==='all'||card.dataset.approvalRole===role;card.hidden=!show;if(show)count++});
    const empty=document.getElementById('qg-approval-filter-empty');if(empty)empty.hidden=count>0;
  };
  let controlRefresh=null;
  function refreshControls(){
    if(controlRefresh)return controlRefresh;
    const note=document.getElementById('qg-admin-refresh-note');if(note)note.textContent='กำลังอัปเดตข้อมูลจากฐานข้อมูล…';
    controlRefresh=qtHydrateDatabase({light:false}).then(()=>{
      if(location.hash!=='#admin-governance')return;
      const field=document.activeElement;
      if(field&&/^(INPUT|TEXTAREA|SELECT)$/.test(field.tagName)){const n=document.getElementById('qg-admin-refresh-note');if(n)n.textContent='ข้อมูลใหม่พร้อมแล้ว กดรีเฟรชเมื่อกรอกข้อมูลเสร็จ';return}
      const section=sessionStorage.getItem('qt_admin_active_tab')||'qt-sec-overview';
      renderAdminGovernance();qtAdminTab(section);
      if(section==='qt-sec-approval')qgAdminApprovalRole(window.QG_ADMIN_APPROVAL_ROLE||'all');
      const updated=document.getElementById('qg-admin-refresh-note');if(updated)updated.textContent='อัปเดตข้อมูลล่าสุดจากฐานข้อมูลแล้ว';
    }).catch(e=>{const n=document.getElementById('qg-admin-refresh-note');if(n)n.textContent='อัปเดตข้อมูลไม่สำเร็จ: '+e.message;else toast('อัปเดตข้อมูลไม่สำเร็จ: '+e.message)}).finally(()=>{controlRefresh=null});
    return controlRefresh;
  }
  window.qgAdminOpenControl=function(section,role){
    if(!allowed.has(section)||currentUser()?.type!=='admin')return;
    try{sessionStorage.setItem('qt_admin_active_tab',section)}catch(e){}
    if(section==='qt-sec-approval')window.QG_ADMIN_APPROVAL_ROLE=role||'all';
    if(location.hash!=='#admin-governance')navigate('admin-governance');else renderAdminGovernance();
    setTimeout(()=>{
      qtAdminTab(section);
      if(section==='qt-sec-approval')qgAdminApprovalRole(role||window.QG_ADMIN_APPROVAL_ROLE||'all');
      if(section==='qt-sec-security'&&role)qtSecurityRole(role);
      refreshControls();
    },0);
  };




  const busy=new Set();
  async function accountAction(action,id){
    const admin=currentUser();if(!admin||admin.type!=='admin'||busy.has(id))return;
    const transitions={approve:{from:['pending','rejected'],to:'active'},reject:{from:['pending'],to:'rejected'},suspend:{from:['active'],to:'suspended'},restore:{from:['suspended'],to:'active'}};
    const transition=transitions[action];if(!transition)return;
    let reason=null;
    if(action==='suspend'){reason=prompt('เหตุผลระงับบัญชี:');if(reason===null)return;reason=reason.trim()||'ตามการตรวจสอบของ Admin'}
    busy.add(id);
    try{
      const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบ Admin ใหม่');
      const rows=await qtSupabaseTable('users?select=id,role,status&id=eq.'+encodeURIComponent(id)+'&limit=1',{accessToken:token});
      const target=rows?.[0];if(!target||target.role==='admin'||!['shop','rider','customer'].includes(target.role))throw Error('ไม่พบบัญชีที่จัดการได้');
      if(!transition.from.includes(target.status))throw Error('สถานะบัญชีเปลี่ยนไปแล้ว กรุณารีเฟรช');
      const path='users?id=eq.'+encodeURIComponent(id)+'&status=eq.'+encodeURIComponent(target.status)+'&role=eq.'+encodeURIComponent(target.role)+'&select=id,role,status';
      const saved=await qtSupabaseTable(path,{method:'PATCH',accessToken:token,body:{status:transition.to,updated_at:new Date().toISOString(),...(action==='suspend'?{suspension_reason:reason}:{})}});
      if(!Array.isArray(saved)||saved.length!==1)throw Error('ไม่ได้บันทึกสถานะ กรุณารีเฟรช');
      await qtHydrateDatabase({light:false});
      toast(({approve:'อนุมัติ',reject:'ไม่อนุมัติ',suspend:'ระงับ',restore:'ปลดระงับ'})[action]+'บัญชีแล้ว');
      if(location.hash==='#admin-governance'){renderAdminGovernance();setTimeout(()=>qtAdminTab(action==='approve'||action==='reject'?'qt-sec-approval':'qt-sec-security'),0)}
      else renderAdminDashboard(currentUser());
    }catch(e){toast('บันทึกสถานะไม่สำเร็จ: '+e.message)}finally{busy.delete(id)}
  }
  window.adminApproveUser=id=>accountAction('approve',id);
  window.adminRejectUser=id=>accountAction('reject',id);
  window.adminSecurityAction=(action,id)=>accountAction(action,id);
  window.adminSuspendUser=id=>accountAction('suspend',id);
  window.adminUnsuspendUser=id=>accountAction('restore',id);
})();
</script>
