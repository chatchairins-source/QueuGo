<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QueueGo - ผู้ใช้บริการ</title>
<style>
:root{--red:#ef3340;--rd:#d91f2d;--green:#18b77a;--gs:#eafaf3;--ink:#17191d;--mu:#73777f;--ln:#eceef1;--bg:#f7f7f8;--sh:0 8px 28px rgba(20,24,30,.07)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Prompt",system-ui,sans-serif}
button,input{font:inherit}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.05);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px}
.top>div{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px;border:0;background:none;color:var(--ink);cursor:pointer}.brand span{color:var(--red)}
.acts{display:flex;gap:8px}
.ic{width:40px;height:40px;border:0;border-radius:13px;background:#f3f4f6;color:#24272d;display:grid;place-items:center;cursor:pointer;position:relative}
.ic svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
main{width:100%;max-width:720px;margin:auto;padding:0 14px 118px}
@media(max-width:420px){main{padding-left:12px;padding-right:12px}}
.sec{margin-top:20px}.st{display:flex;justify-content:space-between;align-items:center;margin:0 2px 11px}.st h2{font-size:18px;letter-spacing:-.25px}
.lk{border:0;background:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer}
.loc{display:flex;align-items:center;gap:10px;padding:13px 2px 10px}
.pin{width:34px;height:34px;border-radius:11px;background:#fff0f1;color:var(--red);display:grid;place-items:center}.pin svg{width:19px}
.loc small{display:block;color:var(--mu);font-size:11px}.loc b{font-size:13px}
.srch{height:48px;border-radius:15px;background:#fff;border:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 14px;color:#9a9ea5;cursor:pointer;box-shadow:0 4px 16px rgba(20,24,30,.035)}
.srch svg{width:20px;stroke:#3f434a}
.promo{margin-top:13px;min-height:148px;border-radius:20px;overflow:hidden;position:relative;background:linear-gradient(135deg,#ef3340,#ff7a45);box-shadow:var(--sh);color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:center}
.promo small{font-size:11px;font-weight:700;opacity:.9}.promo strong{font-size:24px;line-height:1.1;margin:4px 0}.promo span{font-size:12px}
.cats{display:flex;gap:13px;overflow-x:auto;padding:2px 2px 5px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 64px;text-align:center;border:0;background:none;padding:0;cursor:pointer;color:#3a3d42}
.cat i{width:54px;height:54px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:auto;border:1px solid var(--ln);box-shadow:0 4px 12px rgba(20,24,30,.04)}
.cat svg{width:25px;stroke:var(--red)}.cat b{display:block;font-size:10px;margin-top:6px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:10px}
.sc{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(20,24,30,.035);transition:transform .15s}
.sc:active{transform:scale(.992)}
.ph{width:92px;height:92px;border-radius:14px;object-fit:cover;background:#f0f1f2;flex:none;display:grid;place-items:center;color:#c3c6cb;font-size:30px;font-weight:800;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
@media(max-width:420px){.ph{width:82px;height:82px}}
.si{min-width:0;flex:1}.sn{font-size:15px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{display:flex;flex-wrap:wrap;gap:6px;color:var(--mu);font-size:11px;margin-top:6px}
.pill{display:inline-flex;align-items:center;font-size:10px;font-weight:700;color:#0a9660;background:var(--gs);padding:4px 7px;border-radius:999px;margin-top:7px}.pill.off{color:#777;background:#f1f1f2}
.cover{position:relative;height:245px;margin:0 -14px;background:#ddd;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38),transparent 40%,rgba(0,0,0,.1))}
.cover .ca{position:absolute;top:12px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between}
@media(max-width:420px){.cover{height:220px;margin:0 -12px}}
.intro{background:#fff;border-radius:22px 22px 0 0;margin:-22px -14px 0;position:relative;z-index:3;padding:20px 16px 12px}
@media(max-width:420px){.intro{margin:-22px -12px 0}}
.intro h1{font-size:24px;font-weight:800;line-height:1.15}.intro p{display:flex;gap:10px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin-top:8px}
.mi{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);min-width:0;background:#fff;margin:0 -14px;padding-left:14px;padding-right:14px}
.mi .ph{width:92px;height:82px}
.mc{min-width:0;flex:1}.mc b{display:block;font-size:14px}.mc p{font-size:11px;color:var(--mu);margin:5px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;font-size:14px}
.plus{width:36px;height:36px;border:0;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;align-self:center;cursor:pointer;box-shadow:0 5px 12px rgba(239,51,64,.2);flex:none}
.plus:disabled{background:#c9ccd1;box-shadow:none}.plus svg{width:19px;stroke:#fff}
.fcart{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 28px));z-index:260;background:var(--red);color:#fff;border-radius:17px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(239,51,64,.25);cursor:pointer}
.fcart b{font-size:14px}.fcart span{font-size:12px}
.pt{display:flex;align-items:center;gap:10px;padding:10px 0 16px}.pt h1{font-size:22px}
.back{width:38px;height:38px;border:0;border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer}.back svg{width:20px}
.ci{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--ln)}.ci .ph{width:72px;height:64px;border-radius:12px}
.qty{display:flex;align-items:center;gap:9px;margin-top:8px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:16px}.qty strong{min-width:18px;text-align:center}
.sum{background:#fff;border-radius:18px;padding:15px;margin-top:15px;border:1px solid var(--ln)}
.sr{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.tot{display:flex;justify-content:space-between;padding-top:11px;margin-top:8px;border-top:1px solid var(--ln);font-size:17px;font-weight:800}
.prim{width:100%;min-height:52px;border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(239,51,64,.18);margin-top:14px}
.prim:disabled{opacity:.5}
.oc{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:15px;cursor:pointer}
.oh{display:flex;justify-content:space-between;gap:8px}.on{font-weight:800;font-size:16px}
.sp{font-size:10px;font-weight:800;background:#f2f3f5;padding:6px 8px;border-radius:999px;height:fit-content}
.oc p{margin:6px 0;color:var(--mu);font-size:12px}
.pl{background:#fff;border-radius:18px;border:1px solid var(--ln);overflow:hidden;margin-top:6px}
.pw{display:flex;align-items:center;gap:12px;width:100%;padding:15px;border:0;border-bottom:1px solid var(--ln);background:#fff;text-align:left;cursor:pointer;color:var(--ink)}
.pw:last-child{border-bottom:0}.pw .i{width:38px;height:38px;border-radius:12px;background:#f5f5f6;display:grid;place-items:center}.pw svg{width:19px}.pw b{font-size:14px}
.pf{display:flex;align-items:center;gap:13px;padding:18px 0 20px}.av{width:70px;height:70px;border-radius:23px;background:#e9eaec;display:grid;place-items:center;font-size:26px;font-weight:800;color:#9a9ea5}
.pf h1{font-size:21px}.pf p{margin:3px 0;color:var(--mu);font-size:12px}
.acc{display:inline-flex;background:var(--gs);color:#0b9660;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;margin-top:5px}
.in{width:100%;height:52px;border:1px solid var(--ln);border-radius:16px;background:#fff;padding:0 15px;outline:none;margin-bottom:10px}
.in:focus{border-color:var(--red)}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px;margin-top:18px}
.empty{text-align:center;color:var(--mu);padding:35px 15px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:280;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #e9eaec}
.nav a{color:#8a8d93;text-decoration:none;text-align:center;font-size:10px;font-weight:700;padding:3px 0}.nav a.on{color:var(--red)}
.nav .ni{width:24px;height:24px;margin:auto;display:grid;place-items:center;position:relative}.nav svg{width:20px;height:20px}
#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#17191d;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;display:none;z-index:999;max-width:90vw}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script>
'use strict';
/* ===== 1) Connection (same Supabase project and endpoints as the old app) ===== */
const CFG={URL:'https://pkypiqhlrmzocysgeqew.supabase.co',KEY:'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'};
const hdr=t=>{const h={apikey:CFG.KEY,'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;return h};
async function auth(path,body){
  const r=await fetch(CFG.URL+'/auth/v1/'+path,{method:'POST',headers:hdr(),body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'AUTH_ERROR');
  return d;
}
async function db(path,o={}){
  const m=(o.method||'GET').toUpperCase(),h=hdr(o.token===undefined?await token():o.token);
  if(m!=='GET')h.Prefer='return=representation';
  const r=await fetch(CFG.URL+'/rest/v1/'+path,{method:m,headers:h,body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((d&&(d.message||d.hint))||'DB_ERROR_'+r.status);
  return d;
}
/* ===== 2) Session (same storage key and fields, so existing logins keep working) ===== */
const SKEY='qg_customer_session_v1';
const S={get(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}},
  set(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}},
  clear(){try{localStorage.removeItem(SKEY)}catch(e){}}};
let refreshing=null;
async function token(force){
  const s=S.get();if(!s||!s.accessToken)return '';
  if(!(force||(s.expiresAt&&s.expiresAt-Date.now()<60000))||!s.refreshToken)return s.accessToken;
  refreshing=refreshing||(async()=>{
    try{
      const d=await auth('token?grant_type=refresh_token',{refresh_token:s.refreshToken});
      const n={...s,accessToken:d.access_token,refreshToken:d.refresh_token||s.refreshToken,expiresAt:Date.now()+(d.expires_in||3600)*1000};
      S.set(n);return n.accessToken;
    }catch(e){return s.accessToken}finally{refreshing=null}
  })();
  return refreshing;
}
const emailOf=p=>String(p||'').replace(/\D/g,'')+'@auth.queuetech.local';
async function login(v,pw){
  const d=await auth('token?grant_type=password',{email:v.includes('@')?v:emailOf(v),password:pw});
  const rows=await db('users?select=*&auth_user_id=eq.'+d.user.id,{token:d.access_token});
  const me=Array.isArray(rows)&&rows[0]||null;
  if((me?.role||d.user?.user_metadata?.role||'customer')!=='customer')throw new Error('บัญชีนี้เป็นบัญชีของส่วนอื่น กรุณาใช้แอปของบัญชีนั้น');
  S.set({role:'customer',userId:me?.id||d.user.id,authUserId:d.user.id,name:me?.name||'',phone:me?.phone||'',
    accessToken:d.access_token,refreshToken:d.refresh_token,expiresAt:Date.now()+(d.expires_in||3600)*1000});
}
async function register({name,phone,password,lat,lng}){
  await auth('signup',{email:emailOf(phone),password,data:{name,phone,role:'customer',latitude:lat,longitude:lng}});
  await login(phone,password);
}
/* ===== 3) Helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH');
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)};
const P={home:'<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4v-9Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',orders:'<path d="M7 3h10v18l-2-1.5-3 1.5-3-1.5L7 21V3Z"/><path d="M10 8h4M10 12h4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
  back:'<path d="M15 5 8 12l7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3M21 5v14a2 2 0 0 1-2 2h-5"/>',
  utensils:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3v18M14 3v7h6"/>',drink:'<path d="M7 3h10l-1 18H8L7 3Z"/><path d="M8 7h8"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>'};
const ico=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]||P.grid}</svg>`;
const ini=n=>esc(String(n||'?').trim().charAt(0));
const photo=(src,name)=>`<div class="ph">${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}${src?'':ini(name)}</div>`;
const CATS={food:'อาหาร',cafe:'เครื่องดื่ม',grocery:'ของใช้',other:'อื่นๆ'};
const CICON={food:'utensils',cafe:'drink',grocery:'bag',other:'grid'};
/* cart lives in memory only */
let cart={shopId:null,items:[]},shops=null,q='',cat='all';
const cartN=()=>cart.items.reduce((a,i)=>a+i.qty,0);
const cartTotal=()=>cart.items.reduce((a,i)=>a+i.price*i.qty,0);
/* ===== 4) Data (same tables) ===== */
async function loadShops(){
  if(shops)return shops;
  const [list,st]=await Promise.all([
    db('shop_profiles?select=id,shop_name,status,public_category,public_logo,public_cover,public_open_time,public_close_time,public_description,address,latitude,longitude,delivery_enabled'),
    db('shop_open_states?select=shop_id,is_open,resume_at').catch(()=>[])]);
  const m=new Map((st||[]).map(s=>[String(s.shop_id),s]));
  shops=(list||[]).filter(s=>!s.status||s.status==='active'||s.status==='approved')
    .map(s=>({...s,open:m.has(String(s.id))?m.get(String(s.id)).is_open!==false:true}));
  return shops;
}
const loadMenu=id=>db('products?select=id,shop_id,name,description,price,delivery_price,image,available,delivery_available&shop_id=eq.'+encodeURIComponent(id));
/* ===== 5) Layout ===== */
const authed=()=>!!S.get();
function layout(inner,tab){
  const u=S.get();
  $('root').innerHTML=`<header class="top"><div><button class="brand" onclick="go('home')">Queue<span>Go</span></button>
<div class="acts">${u?`<button class="ic" aria-label="ตะกร้า" onclick="go('cart')">${ico('bag')}${cartN()?`<b class="badge">${cartN()>99?'99+':cartN()}</b>`:''}</button>
<button class="ic" aria-label="โปรไฟล์" onclick="go('profile')">${ico('user')}</button>`:''}</div></div></header>
<main>${inner}</main>${u?nav(tab):''}`;
}
const nav=t=>`<nav class="nav">${[['home','home','หน้าหลัก'],['search','search','ค้นหา'],['cart','bag','ตะกร้า'],['orders','orders','ออเดอร์']].map(([k,i,l])=>
  `<a href="#${k}" class="${t===k?'on':''}"><div class="ni">${ico(i)}${k==='cart'&&cartN()?`<b class="badge" style="top:-5px;right:-8px">${cartN()}</b>`:''}</div>${l}</a>`).join('')}</nav>`;
const go=h=>{location.hash=h};
const shopCard=s=>`<div class="sc" onclick="go('shop/${esc(s.id)}')">${photo(s.public_logo||s.public_cover,s.shop_name)}
<div class="si"><div class="sn">${esc(s.shop_name||'ร้านค้า')}</div>
<div class="sm"><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.public_open_time?`<span>${esc(s.public_open_time)}–${esc(s.public_close_time||'')}</span>`:''}</div>
<span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div></div>`;
/* ===== 6) Views ===== */
const V={};
V.login=()=>layout(`<div class="card"><h1 style="font-size:24px;margin-bottom:4px">เข้าสู่ระบบ</h1><p class="sm" style="margin:0 0 16px">ยินดีต้อนรับสู่ QueueGo</p>
<input class="in" id="lp" placeholder="เบอร์โทรหรืออีเมล" inputmode="tel" autocomplete="username"><input class="in" id="lw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
<button class="prim" id="lb" style="margin-top:4px">เข้าสู่ระบบ</button>
<p class="empty" style="padding:16px 0 0">ยังไม่มีบัญชี? <a href="#register" style="color:var(--red);font-weight:700">สมัครสมาชิก</a></p></div>`);
V.register=()=>layout(`<div class="card"><h1 style="font-size:24px;margin-bottom:16px">สมัครสมาชิก</h1>
<input class="in" id="rn" placeholder="ชื่อ-นามสกุล"><input class="in" id="rp" placeholder="เบอร์โทร" inputmode="tel"><input class="in" id="rw" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)">
<p class="sm" style="margin:0 0 12px">ต้องอนุญาตตำแหน่งที่ตั้งเพื่อสมัครสมาชิก</p>
<button class="prim" id="rb" style="margin-top:0">สมัครและเข้าสู่ระบบ</button>
<p class="empty" style="padding:16px 0 0"><a href="#login" style="color:var(--red);font-weight:700">มีบัญชีแล้ว</a></p></div>`);
V.home=async()=>{
  const u=S.get(),list=await loadShops();
  const c=[...new Set(list.map(s=>s.public_category).filter(Boolean))];
  layout(`<div class="loc"><div class="pin">${ico('pin')}</div><div><small>ส่งไปที่</small><b>ตำแหน่งปัจจุบันของคุณ</b></div></div>
<div class="srch" onclick="go('search')">${ico('search')}<span>ค้นหาร้านอาหารหรือเมนู</span></div>
<div class="promo"><small>QueueGo</small><strong>สั่งง่าย ส่งไว</strong><span>เลือกร้านใกล้คุณ แล้วสั่งได้เลย</span></div>
${c.length?`<section class="sec"><div class="cats">${c.map(k=>`<button class="cat" onclick="cat='${esc(k)}';go('search')"><i>${ico(CICON[k]||'grid',25)}</i><b>${esc(CATS[k]||k)}</b></button>`).join('')}</div></section>`:''}
<section class="sec"><div class="st"><h2>ร้านใกล้คุณ</h2><button class="lk" onclick="go('search')">ดูทั้งหมด</button></div>
<div class="list">${list.length?list.map(shopCard).join(''):'<p class="empty">ยังไม่มีร้านค้า</p>'}</div></section>`,'home');
};
V.search=async()=>{
  const list=await loadShops();
  const draw=()=>{const k=q.toLowerCase();return list.filter(s=>(cat==='all'||s.public_category===cat)&&(!k||String(s.shop_name||'').toLowerCase().includes(k)))};
  layout(`<div style="padding-top:12px"><input class="in" id="sq" placeholder="ค้นหาร้านค้า" value="${esc(q)}" style="margin-bottom:0">
<div class="cats" style="padding:12px 0 4px">${['all',...Object.keys(CATS)].map(k=>`<button class="cat" style="flex:none;width:auto" onclick="cat='${k}';V.search()"><b style="margin:0;padding:8px 13px;border-radius:99px;font-size:11px;border:1px solid ${cat===k?'var(--red)':'#ddd'};background:${cat===k?'var(--red)':'#fff'};color:${cat===k?'#fff':'#333'}">${k==='all'?'ทั้งหมด':CATS[k]}</b></button>`).join('')}</div>
<div class="list" id="sr" style="margin-top:8px">${draw().map(shopCard).join('')||'<p class="empty">ไม่พบร้านค้า</p>'}</div></div>`,'search');
  $('sq').oninput=e=>{q=e.target.value.trim();$('sr').innerHTML=draw().map(shopCard).join('')||'<p class="empty">ไม่พบร้านค้า</p>'};
};
V.shop=async id=>{
  const s=(await loadShops()).find(x=>String(x.id)===String(id));
  if(!s)return layout('<p class="empty">ไม่พบร้านค้า</p>','home');
  const items=((await loadMenu(id))||[]).filter(p=>p.available!==false);
  layout(`<div class="cover">${s.public_cover?`<img src="${esc(s.public_cover)}" alt="" onerror="this.remove()">`:''}
<div class="ca"><button class="ic" onclick="history.back()" aria-label="กลับ">${ico('back')}</button></div></div>
<div class="intro"><h1>${esc(s.shop_name)}</h1><p><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.address?`<span>${esc(s.address)}</span>`:''}</p>
<span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div>
<div style="margin-top:6px">${items.length?items.map(p=>`<div class="mi">${photo(p.image,p.name)}<div class="mc"><b>${esc(p.name)}</b><p>${esc(p.description||'')}</p><div class="pr">${baht(p.price)}</div></div>
<button class="plus" ${s.open?'':'disabled'} aria-label="เพิ่ม" onclick="add('${esc(id)}','${esc(p.id)}')">${ico('plus',19)}</button></div>`).join(''):'<p class="empty">ยังไม่มีเมนู</p>'}</div>
${cart.shopId==id&&cartN()?`<div class="fcart" onclick="go('cart')"><b>ดูตะกร้า · ${cartN()} รายการ</b><span>${baht(cartTotal())}</span></div>`:''}`,'home');
  window._menu=items;
};
V.cart=()=>{
  layout(`<div class="pt"><button class="back" onclick="history.back()">${ico('back')}</button><h1>ตะกร้าสินค้า</h1></div>`+
  (cart.items.length?cart.items.map((i,x)=>`<div class="ci">${photo(i.image,i.name)}<div class="mc"><b>${esc(i.name)}</b><div class="pr" style="margin-top:3px">${baht(i.price)}</div>
<div class="qty"><button onclick="chg(${x},-1)">−</button><strong>${i.qty}</strong><button onclick="chg(${x},1)">+</button></div></div></div>`).join('')+
  `<div class="sum"><div class="sr"><span>ค่าอาหาร</span><span>${baht(cartTotal())}</span></div><div class="tot"><span>รวม</span><span>${baht(cartTotal())}</span></div></div>
<button class="prim" onclick="toast('หน้าชำระเงินจะเพิ่มในเฟสถัดไป')">ไปชำระเงิน</button>`:'<p class="empty">ตะกร้าว่าง</p>'),'cart');
};
V.orders=async()=>{
  const u=S.get();layout('<p class="empty">กำลังโหลด...</p>','orders');
  const rows=await db('orders?select=*&customer_id=eq.'+encodeURIComponent(u.userId)+'&order=created_at.desc&limit=30');
  layout(`<div class="pt"><h1>ออเดอร์ของฉัน</h1></div><div class="list">${(rows||[]).length?rows.map(o=>`<div class="oc"><div class="oh"><span class="on">#${esc(o.order_number||String(o.id).slice(0,6))}</span><span class="sp">${esc(o.status||'')}</span></div>
<p>${new Date(o.created_at).toLocaleString('th-TH')}</p><b>${baht(o.total??o.total_amount??o.subtotal)}</b></div>`).join(''):'<p class="empty">ยังไม่มีออเดอร์</p>'}</div>`,'orders');
};
V.profile=()=>{
  const u=S.get()||{};
  layout(`<div class="pf"><div class="av">${ini(u.name)}</div><div><h1>${esc(u.name||'ลูกค้า')}</h1><p>${esc(u.phone||'')}</p><span class="acc">บัญชีลูกค้า</span></div></div>
<div class="pl"><button class="pw" onclick="go('orders')"><span class="i">${ico('orders')}</span><b>ออเดอร์ของฉัน</b></button>
<button class="pw" onclick="S.clear();cart={shopId:null,items:[]};go('login')"><span class="i">${ico('logout')}</span><b>ออกจากระบบ</b></button></div>`,'');
};
/* ===== 7) Cart actions ===== */
window.add=(sid,pid)=>{
  const p=(window._menu||[]).find(x=>String(x.id)===String(pid));if(!p)return;
  if(cart.items.length&&String(cart.shopId)!==String(sid)){if(!confirm('ตะกร้ามีสินค้าจากร้านอื่น ล้างตะกร้าเพื่อสั่งร้านนี้?'))return;cart.items=[]}
  cart.shopId=sid;const f=cart.items.find(i=>i.id===p.id);
  f?f.qty++:cart.items.push({id:p.id,name:p.name,price:Number(p.price),image:p.image||'',qty:1});
  toast('เพิ่มลงตะกร้าแล้ว');route();
};
window.chg=(x,d)=>{cart.items[x].qty+=d;if(cart.items[x].qty<1)cart.items.splice(x,1);route()};
/* ===== 8) Router ===== */
async function route(){
  const [pg,param]=(location.hash.slice(1)||'home').split('/');
  const ok=authed();
  if(!ok&&pg!=='login'&&pg!=='register')return go('login');
  if(ok&&(pg==='login'||pg==='register'))return go('home');
  if(!V[pg])return go('home');
  try{await V[pg](param);bind(pg)}
  catch(e){layout(`<div class="card"><b>โหลดข้อมูลไม่สำเร็จ</b><p class="sm" style="margin:6px 0 12px">${esc(e.message)}</p><button class="prim" onclick="shops=null;route()">ลองอีกครั้ง</button></div>`,'')}
}
function bind(pg){
  if(pg==='login')$('lb').onclick=async e=>{const b=e.target;b.disabled=true;try{await login($('lp').value.trim(),$('lw').value);go('home')}catch(x){toast(x.message)}finally{b.disabled=false}};
  if(pg==='register')$('rb').onclick=async e=>{
    const b=e.target,name=$('rn').value.trim(),phone=$('rp').value.trim(),password=$('rw').value;
    if(!name||phone.replace(/\D/g,'').length<9||password.length<6)return toast('กรอกข้อมูลให้ครบ');
    b.disabled=true;
    try{
      const pos=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000}):no());
      await register({name,phone,password,lat:pos.coords.latitude,lng:pos.coords.longitude});go('home');
    }catch(x){toast(x&&x.message?x.message:'ต้องอนุญาตตำแหน่งที่ตั้งเพื่อสมัคร')}finally{b.disabled=false}
  };
}
addEventListener('hashchange',route);
route();
</script>
</body>
