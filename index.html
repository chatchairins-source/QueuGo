<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QueueGo - ผู้ใช้บริการ</title>
<style>
/* CUSTOMER COMPACT DENSITY — show more useful content per viewport without changing order flow. */
:root{--red:#e6002d;--rd:#b20b29;--green:#18b77a;--gs:#eafaf3;--ink:#17191d;--mu:#73777f;--ln:#eceef1;--bg:#f7f7f8;--sh:0 8px 28px rgba(20,24,30,.07)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Prompt",system-ui,sans-serif}
button,input,textarea{font:inherit}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.05);padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px}
.top>div{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:9px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px;border:0;background:none;cursor:pointer}.brand-queue{color:var(--ink)}.brand-go{color:var(--red)}
.acts{display:flex;gap:8px}
.ic{width:42px;height:42px;border:0;border-radius:12px;background:#f3f4f6;color:#24272d;display:grid;place-items:center;cursor:pointer;position:relative}
.ic svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
main{width:100%;max-width:720px;margin:auto;padding:0 12px 92px}
@media(max-width:420px){main{padding-left:10px;padding-right:10px}}
.sec{margin-top:14px}.st{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}.st h2{font-size:17px;letter-spacing:-.25px}
.lk{border:0;background:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer}
.loc{display:flex;align-items:center;gap:8px;padding:8px 2px 7px}
.pin{width:32px;height:32px;border-radius:10px;background:#fff0f1;color:var(--red);display:grid;place-items:center}.pin svg{width:19px}
.loc small{display:block;color:var(--mu);font-size:11px}.loc b{font-size:13px}
.srch{height:44px;border-radius:14px;background:#fff;border:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 14px;color:#9a9ea5;cursor:pointer;box-shadow:0 4px 16px rgba(20,24,30,.035)}
.srch svg{width:20px;stroke:#3f434a}.srch input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}.srch input::placeholder{color:#9a9ea5}
.promo{margin-top:9px;aspect-ratio:2.05/1;border-radius:18px;overflow:hidden;position:relative;background:#f2f3f5;box-shadow:var(--sh);padding:0}
.promo .qg-home-banner-track{position:relative;width:100%;height:100%}
.promo .qg-home-banner-slide{position:absolute;inset:0;opacity:0;transition:opacity .4s ease;pointer-events:none;background:linear-gradient(135deg,#f3f4f6,#e5e7eb)}
.promo .qg-home-banner-slide.active{opacity:1;pointer-events:auto}
.promo .qg-home-banner-slide[data-link]{cursor:pointer}
.promo .qg-home-banner-slide img{display:block;width:100%;height:100%;object-fit:cover}
.promo .qg-home-banner-dots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:6px;z-index:3}
.promo .qg-home-banner-dot{width:7px;height:7px;border:0;border-radius:999px;padding:0;background:rgba(255,255,255,.62);box-shadow:0 1px 4px rgba(0,0,0,.22)}
.promo .qg-home-banner-dot.active{width:20px;background:#fff}
.promo small{font-size:11px;font-weight:700;opacity:.9}.promo strong{font-size:24px;line-height:1.1;margin:4px 0}.promo span{font-size:12px}
.cats{display:flex;gap:9px;overflow-x:auto;padding:1px 2px 3px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 58px;text-align:center;border:0;background:none;padding:0;cursor:pointer;color:#3a3d42}
.cat i{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:auto;border:1px solid var(--ln);box-shadow:0 4px 12px rgba(20,24,30,.04)}
.cat svg{width:22px;stroke:var(--red)}.cat b{display:block;font-size:9.5px;margin-top:4px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:7px}
.sc{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:8px;display:flex;gap:9px;align-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(20,24,30,.035);transition:transform .15s}
.sc:active{transform:scale(.992)}
.ph{width:78px;height:78px;border-radius:13px;object-fit:cover;background:#f0f1f2;flex:none;display:grid;place-items:center;color:#c3c6cb;font-size:30px;font-weight:800;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
@media(max-width:420px){.ph{width:72px;height:72px}}
.si{min-width:0;flex:1}.sn{font-size:15px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{display:flex;flex-wrap:wrap;gap:5px;color:var(--mu);font-size:10.5px;margin-top:4px}
.pill{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;color:#0a9660;background:var(--gs);padding:3px 6px;border-radius:999px;margin-top:5px}.pill.off{color:#777;background:#f1f1f2}
.cover{position:relative;height:195px;margin:0 -12px;background:#ddd;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38),transparent 40%,rgba(0,0,0,.1))}
.cover .ca{position:absolute;top:12px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between}
@media(max-width:420px){.cover{height:178px;margin:0 -10px}}
.intro{background:#fff;border-radius:20px 20px 0 0;margin:-18px -12px 0;position:relative;z-index:3;padding:14px 12px 9px}
@media(max-width:420px){.intro{margin:-18px -10px 0}}
.intro h1{font-size:21px;font-weight:800;line-height:1.15}.intro p{display:flex;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:11px;margin-top:5px}
.mi{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--ln);min-width:0;background:#fff;margin:0 -12px;padding-left:12px;padding-right:12px}
.mi .ph{width:72px;height:66px}
.mc{min-width:0;flex:1}.mc b{display:block;font-size:14px}.mc p{font-size:10px;color:var(--mu);margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;font-size:14px}
.plus{width:36px;height:36px;border:0;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;align-self:center;cursor:pointer;box-shadow:0 5px 12px rgba(239,51,64,.2);flex:none}
.plus:disabled{background:#c9ccd1;box-shadow:none}.plus svg{width:19px;stroke:#fff}
.fcart{position:fixed;left:50%;bottom:calc(62px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 20px));z-index:260;background:var(--red);color:#fff;border-radius:15px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(239,51,64,.25);cursor:pointer}
.fcart b{font-size:14px}.fcart span{font-size:12px}
.pt{display:flex;align-items:center;gap:8px;padding:7px 0 10px}.pt h1{font-size:20px}
.back{width:38px;height:38px;border:0;border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer}.back svg{width:20px}
.ci{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--ln)}.ci .ph{width:62px;height:56px;border-radius:12px}
.qty{display:flex;align-items:center;gap:8px;margin-top:5px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:16px}.qty strong{min-width:18px;text-align:center}
.sum{background:#fff;border-radius:16px;padding:11px 12px;margin-top:10px;border:1px solid var(--ln)}
.sr{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.tot{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--l
