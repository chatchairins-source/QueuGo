/* ---------- 11. ORDER CHAT ---------- */
function chatKey(orderId){ return 'qt_order_chat_'+orderId; }
function isOrderParticipant(order,user){
  return !!user && (user.id===order.customerId || user.id===order.riderId);
}
function chatIsClosed(order){
  return ['completed','cancelled'].includes(order.status);
}
function cleanupExpiredChats(){
  const now=Date.now();
  Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&k.endsWith('_deleteAt')).forEach(k=>{
    const deleteAt=Number(QT_DB_CACHE[k]||0);
    if(deleteAt&&now>=deleteAt){ delete QT_DB_CACHE[k.replace(/_deleteAt$/,'')]; delete QT_DB_CACHE[k]; }
  });
}
function getOrderChat(order){ cleanupExpiredChats(); return dbGet(chatKey(order.id),[]); }
function formatChatTime(ts){ return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function renderOrderChat(order,user){
  /* V5.33: the customer sees the chat box on the status page even before a rider accepts, so it is clear where the chat will appear */
  if(!order.riderId && user && user.id===order.customerId && !chatIsClosed(order)) return `<section class="order-chat"><h3>💬 แชทระหว่างลูกค้ากับไรเดอร์</h3><div class="chat-empty">แชทจะเปิดให้ใช้งานเมื่อไรเดอร์รับงานแล้ว</div></section>`;
  if(!order.riderId || !isOrderParticipant(order,user)) return '';
  const closed=chatIsClosed(order); const messages=getOrderChat(order);
  const body=messages.length ? messages.map(m=>`<div class="chat-bubble ${m.senderId===user.id?'mine':'theirs'}"><div>${escapeHtml(m.text)}</div><div class="chat-meta">${escapeHtml(m.senderName||'ผู้ใช้งาน')} • ${formatChatTime(m.createdAt)}</div></div>`).join('') : '<div class="chat-empty">ยังไม่มีข้อความ เริ่มพูดคุยกันได้เลย</div>';
  return `<section class="order-chat"><h3>💬 แชทระหว่างลูกค้ากับไรเดอร์</h3><div id="chat-messages-${order.id}" class="chat-messages">${body}</div>${closed?'<div class="chat-closed">ออเดอร์จบแล้ว ระบบจะล้างประวัติแชทอัตโนมัติภายใน 20 นาที</div>':`<form class="chat-compose" onsubmit="return sendOrderChat(event,'${order.id}')"><input id="chat-input-${order.id}" maxlength="500" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button class="btn-primary" type="submit">ส่ง</button></form>`}</section>`;
}
/* escapeHtml() now lives in the qt-v532-helpers script */
function sendOrderChat(event,orderId){
  event.preventDefault(); const user=currentUser(); const order=dbGet('qt_orders',[]).find(o=>o.id===orderId);
  if(!user||!order||!isOrderParticipant(order,user)||chatIsClosed(order)){toast('แชทนี้ปิดแล้ว');return false;}
  const input=document.getElementById('chat-input-'+orderId); const message=(input?.value||'').trim(); if(!message)return false;
  const messages=getOrderChat(order); messages.push({id:uid(),senderId:user.id,senderName:user.name,text:message,createdAt:Date.now()}); dbSet(chatKey(orderId),messages); input.value=''; renderOrderChatArea(orderId); return false;
}
function renderOrderChatArea(orderId){ const order=dbGet('qt_orders',[]).find(o=>o.id===orderId), user=currentUser(); const host=document.querySelector('.order-chat'); if(!order||!host||!user)return; const fresh=document.createElement('div'); fresh.innerHTML=renderOrderChat(order,user); host.replaceWith(fresh.firstElementChild); const box=document.getElementById('chat-messages-'+orderId); if(box)box.scrollTop=box.scrollHeight; }
function markChatForDeletion(order){ if(!['completed','cancelled'].includes(order.status))return; const key=chatKey(order.id), messages=getOrderChat(order); if(!messages.length)return; dbSet(key,messages); QT_DB_CACHE[key+'_deleteAt']=Date.now()+20*60*1000; }
setInterval(cleanupExpiredChats,30000);

function qtAbbrevName(name){
  const parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return 'ลูกค้า';
  if(parts.length===1) return parts[0];
  return parts[0]+' '+parts[1].charAt(0)+'.';
}
function qtMyReviewForOrder(orderId,userId){
  return dbGet('qt_reviews',[]).find(r=>r.orderId===orderId && r.customerId===userId);
}
function qtShopReviews(shopId){
  return dbGet('qt_reviews',[]).filter(r=>r.shopId===shopId).sort((a,b)=>b.updatedAt-a.updatedAt);
}
function qtShopRatingSummary(shopId){
  const list=qtShopReviews(shopId);
  if(!list.length) return {count:0,avg:0};
  const avg=list.reduce((s,r)=>s+Number(r.rating||0),0)/list.length;
  return {count:list.length,avg};
}
function qtStarsHtml(rating){
  const full=Math.round(rating);
  return '★'.repeat(full)+'☆'.repeat(Math.max(0,5-full));
}
window.__qtReviewDraftRating = window.__qtReviewDraftRating || {};
function qtReviewFormHtml(orderId, rating, comment){

async function submitReview(orderId){

/*
  V5.44 Batch 6:
  - Removed the old simulated rider movement.
  - The customer map must never invent a rider GPS position.
  - If a real last-known rider location exists, show it.
  - If no real location exists yet, show only pickup/delivery points.
  This remains a prototype until cross-device Realtime/API is enabled.
*/
function initTrackingMap(order){
  if(typeof L==='undefined' || !order || !order.pickup || !order.delivery ||
     order.pickup.lat==null || order.pickup.lng==null ||
     order.delivery.lat==null || order.delivery.lng==null) return;

  const map = L.map('tracking-map').setView([order.pickup.lat, order.pickup.lng], 14);
  tileLayer(map);
  registerMap(map);

  L.marker([order.pickup.lat, order.pickup.lng]).addTo(map).bindPopup('🏪 ร้านค้า: '+escapeHtml(order.shopName||'ร้านค้า'));
  L.marker([order.delivery.lat, order.delivery.lng]).addTo(map).bindPopup('👤 จุดส่ง: '+escapeHtml(order.customerName||'ลูกค้า'));

  const riderIcon = L.divIcon({html:'🛵', className:'emoji-icon'});
  let riderMarker = null;
  const riderCanBeShown = ['picked_up','delivering','arrived'].includes(order.status);
  if(riderCanBeShown){
    const latest=LiveTracking.getLatestLocation(order.id);
    if(latest && Number.isFinite(Number(latest.lat)) && Number.isFinite(Number(latest.lng))){
      riderMarker=L.marker([latest.lat,latest.lng],{icon:riderIcon}).addTo(map).bindPopup('🛵 ไรเดอร์ — ตำแหน่งล่าสุด');
    }
  }

  map.fitBounds([[order.pickup.lat,order.pickup.lng],[order.delivery.lat,order.delivery.lng]],{padding:[30,30]});

  const refresh=setInterval(()=>{
    const current=dbGet('qt_orders',[]).find(x=>x.id===order.id) || order;
    if(!['picked_up','delivering','arrived'].includes(current.status)){
      if(riderMarker){ try{map.removeLayer(riderMarker);}catch(e){} riderMarker=null; }
      return;
    }
    const latest=LiveTracking.getLatestLocation(order.id);
    if(!latest || !Number.isFinite(Number(latest.lat)) || !Number.isFinite(Number(latest.lng))) return;
    const point=[Number(latest.lat),Number(latest.lng)];
    if(riderMarker) riderMarker.setLatLng(point);
    else riderMarker=L.marker(point,{icon:riderIcon}).addTo(map).bindPopup('🛵 ไรเดอร์ — ตำแหน่งล่าสุด');
  },3000);
  activeIntervals.push(refresh);
}

<script id="qt-real-time-v1">
/* QueueTech Real-time v1
   - Uses Supabase Realtime (WebSocket) instead of page refresh/polling.
   - Rehydrates only after database events; the page itself is never refreshed.
   - If Realtime is unavailable, the existing background sync remains as fallback.
   - FIX: previously this called qtHydrateDatabase() directly, with no coordination
     with the 8s poll loop (qtSyncTick) or qtBackgroundHydrate. Since any change to
     any of 16 tables (including notifications, which are created on almost every
     status update by anyone) fired this immediately, it could run a second full
     hydrate WHILE the poll loop's hydrate was still in flight, racing writes into
     QT_DB_CACHE, and it always force-re-rendered the page even when nothing the
     viewer cared about had changed — this is what looked like the page "loading
     back and forth". It now shares QT_SYNC's busy flag with the poll loop (so only
     one hydrate ever runs at a time), debounces bursts of events into one hydrate,
     and only re-renders when the signature actually changed, same as qtSyncTick.
*/
(function(){
  let client=null, channel=null, retry=0, debounceTimer=null, pendingReason=null;
  const TABLES=['users','shop_profiles','rider_profiles','products','orders','order_items','deliveries','payments','notifications','order_chat_messages','reviews'];

  function scheduleRefresh(reason){
    pendingReason=reason;
    if(debounceTimer) return; /* a refresh is already queued for the current burst of events */
    debounceTimer=setTimeout(()=>{ debounceTimer=null; refreshFromRealtime(pendingReason); },600);
  }

  async function refreshFromRealtime(reason){
    if(QT_SYNC.busy || QT_DB_HYDRATING){ scheduleRefresh(reason); return; } /* poll loop or another hydrate is mid-flight: don't run a second one, try again shortly */
    QT_SYNC.busy=true; QT_SYNC.dirty={};
    try{
      const before=qtSyncSignature();
      if(typeof qtHydrateDatabase==='function') await qtHydrateDatabase({light:false});
      Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
      const after=qtSyncSignature();
      if(typeof qtSyncRerender==='function') qtSyncRerender(before,after); /* only re-renders the page if data actually changed */
      window.dispatchEvent(new CustomEvent('qt:realtime-update',{detail:{reason}}));
    }catch(e){ console.warn('[QueueTech Realtime] hydrate failed:',e); }
    finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
  }

  function subscribe(){
    if(!client) return;
    if(channel){ try{client.removeChannel(channel);}catch(e){} }
    channel=client.channel('qt-live-data-v1');
    TABLES.forEach(table=>{
      channel.on('postgres_changes',{event:'*',schema:'public',table},payload=>{
        scheduleRefresh(table+':'+payload.eventType);
      });
    });
    channel.subscribe(status=>{
      window.QT_REALTIME_STATUS=status;
      document.documentElement.dataset.qtRealtime=String(status||'').toLowerCase();
      if(status==='SUBSCRIBED'){
        retry=0;
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status:'SUBSCRIBED'}}));
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status}}));
        retry=Math.min(retry+1,6);
        setTimeout(()=>{ try{subscribe();}catch(e){} }, Math.min(30000,1000*Math.pow(2,retry)));
      }
    });
  }

  function loadClient(){
    if(window.supabase?.createClient){
      try{ client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}}); subscribe(); return; }catch(e){console.warn('[QueueTech Realtime] init failed',e);}
    }
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    sc.async=true;
    sc.onload=()=>{
      try{
        client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}});
        subscribe();
      }catch(e){console.warn('[QueueTech Realtime] client init failed',e);}
    };
    sc.onerror=()=>console.warn('[QueueTech Realtime] CDN unavailable; fallback sync remains active');
    document.head.appendChild(sc);
  }

  window.addEventListener('online',()=>{ if(client) subscribe(); });
  window.addEventListener('hashchange',()=>{ if(client && window.QT_REALTIME_STATUS!=='SUBSCRIBED') subscribe(); });
  window.QT_REALTIME_FORCE_REFRESH=()=>refreshFromRealtime('manual');
  setTimeout(loadClient,800);
})();
</script>
