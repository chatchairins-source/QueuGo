<!DOCTYPE html>
<!-- QueueGo Customer UI V1.0 — based on QueueTech V5.37 security/sync/auth logic (XSS escaping, rider registration via Supabase Auth, approval status mapping, polling sync, real deletes) -->
<html lang="th">
<head>
<meta charset="UTF-8">
<title>QueueGo - ผู้ใช้บริการ</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--primary-dark:#1d4ed8;--accent:#0ea5e9;--danger:#dc2626;--bg:#f3f4f6;--radius:12px;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Prompt',system-ui,sans-serif;background:var(--bg);color:#111827;padding-bottom:70px;}
.qt-banner{background:#fef3c7;color:#92400e;text-align:center;padding:6px 10px;font-size:12px;font-weight:600;}
.qt-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.06);position:sticky;top:0;z-index:50;}
.qt-logo{font-weight:700;font-size:18px;color:var(--primary-dark);cursor:pointer;}
.qt-logo span{color:var(--accent);}
.qt-auth-links a{color:var(--primary-dark);text-decoration:none;font-size:14px;margin-left:8px;}
.qt-user-chip{font-size:13px;background:#e5e7eb;padding:6px 10px;border-radius:20px;cursor:pointer;}
.qt-main{padding:16px;max-width:640px;margin:0 auto;}
.qt-bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e5e7eb;z-index:150;padding-bottom:env(safe-area-inset-bottom);}
.qt-bottomnav a{flex:1;text-align:center;padding:8px 2px;text-decoration:none;color:#374151;font-size:11px;position:relative;}
.qt-bottomnav a.active{color:var(--primary-dark);font-weight:700;}
.qt-bottomnav a span{display:block;font-size:18px;}
.bn-badge{position:absolute;top:2px;right:18%;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;min-width:16px;line-height:15px;}.cart-count-badge{position:absolute;top:2px;right:18%;background:#1d4ed8;color:#fff;border-radius:10px;font-size:10px;padding:0 5px;min-width:16px;line-height:15px;}
h1,h2,h3{color:#111827;}
.hero{text-align:center;padding:16px 0;}
.grid-menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.menu-card{background:#fff;border-radius:var(--radius);padding:16px 8px;text-align:center;font-size:28px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.menu-card div{font-size:12px;margin-top:6px;color:#374151;}
.menu-card.danger{background:#fef2f2;color:#dc2626;}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:12px 16px;border-radius:10px;font-size:15px;cursor:pointer;}
.btn-secondary{background:#e5e7eb;color:#111827;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;}
.btn-danger{background:var(--danger);color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;}
.btn-block{display:block;width:100%;margin:8px 0;text-align:center;text-decoration:none;}
form label{display:block;margin-top:10px;font-size:13px;font-weight:600;color:#374151;}
form input, form select, form textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;margin-top:4px;font-size:14px;font-family:inherit;}
.map-box{height:280px;border-radius:12px;overflow:hidden;margin:10px 0;border:1px solid #d1d5db;}
.coord-display{font-size:13px;color:#374151;margin:6px 0;}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;}
.tab{padding:8px 12px;border-radius:20px;border:1px solid #d1d5db;background:#fff;cursor:pointer;font-size:13px;}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.demo-accounts{background:#eff6ff;padding:10px;border-radius:8px;font-size:12px;margin-top:12px;color:#1e3a8a;line-height:1.6;}
.shop-list{display:flex;flex-direction:column;gap:10px;}
.shop-card{background:#fff;display:flex;gap:10px;padding:10px;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;align-items:center;}
.shop-logo{width:56px;height:56px;min-width:56px;max-width:56px;aspect-ratio:1/1;border-radius:8px;object-fit:cover;display:block;background:transparent;border:0;padding:0;box-shadow:none;}
.shop-info{flex:1;font-size:13px;}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0;}
.product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.product-card.disabled{opacity:.5;}
.product-img{width:100%;height:100px;object-fit:cover;}
.product-info{padding:8px;font-size:13px;}
.product-info button{margin-top:6px;font-size:12px;width:100%;padding:6px;border-radius:8px;border:none;background:var(--primary);color:#fff;}
.row-btns{display:flex;gap:6px;margin-top:6px;}
.row-btns button, .row-btns a{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:12px;text-decoration:none;border:none;cursor:pointer;background:#e5e7eb;color:#111827;}
.row-btns .btn-primary{background:var(--primary);color:#fff;}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:11px;background:#e5e7eb;margin-top:4px;}
.badge-green{background:#d1fae5;color:#047857;}
.badge-gray{background:#e5e7eb;color:#374151;}
.badge-yellow{background:#fef3c7;color:#92400e;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.cart-item{display:flex;gap:8px;align-items:center;background:#fff;padding:8px;border-radius:10px;margin-bottom:8px;}
.cart-item-img{width:48px;height:48px;object-fit:cover;border-radius:8px;}
.cart-item-info{flex:1;font-size:13px;}
.cart-item-info button{width:26px;height:26px;border-radius:6px;border:1px solid #d1d5db;background:#fff;cursor:pointer;}
.cart-total{font-size:16px;text-align:right;margin:10px 0;font-weight:700;}
.order-summary{background:#fff;padding:10px;border-radius:10px;font-size:13px;margin:10px 0;}
.order-card{background:#fff;padding:12px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:8px;cursor:pointer;font-size:13px;}
.order-detail-card{background:#fff;padding:12px;border-radius:10px;font-size:14px;margin:10px 0;line-height:1.7;}
.status-timeline{display:flex;flex-direction:column;gap:6px;margin:10px 0;}
.timeline-step{padding:6px 10px;border-radius:8px;background:#f3f4f6;color:#9ca3af;font-size:13px;}
.timeline-step.done{background:#d1fae5;color:#047857;}
.timeline-step.current{background:var(--primary);color:#fff;font-weight:700;}
.stat-cards{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap;}
.stat-card{flex:1;background:#fff;padding:10px;border-radius:10px;text-align:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-width:100px;}
.status-toggle{background:#fff;padding:10px;border-radius:10px;margin:8px 0;font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
.checkbox-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{background:#f3f4f6;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer;}
.chip input{width:auto;margin-right:4px;}
.tech-card{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;font-size:13px;}
.promo-card{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:10px;margin-bottom:8px;font-size:13px;}
.promo-banner{background:#fffbeb;border:1px solid #fde68a;padding:10px;border-radius:10px;margin:10px 0;font-size:13px;}
.ad-tag{background:#f59e0b;color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;margin-right:6px;font-weight:700;}
.ad-tag-sm{background:#f59e0b;color:#fff;font-size:9px;padding:1px 5px;border-radius:6px;margin-left:4px;}
.bid-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;overflow:hidden;}
.bid-table th, .bid-table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;}
.bid-table tr.top-bid{background:#fffbeb;font-weight:700;}
.module-card{background:#fff;padding:10px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap;}
.shop-header{height:140px;background-size:cover;background-position:center;background-color:#ddd;border-radius:12px;display:flex;align-items:flex-end;padding:8px;}
.shop-logo-lg{width:76px;height:76px;min-width:76px;max-width:76px;aspect-ratio:1/1;border-radius:10px;object-fit:cover;display:block;border:0;background:transparent;padding:0;box-shadow:none;}
.shop-summary{text-align:center;}
.warn-text{color:#b91c1c;font-size:12px;background:#fef2f2;padding:8px;border-radius:8px;}
.inline-form{background:#fff;padding:12px;border-radius:10px;margin:10px 0;}
.emoji-icon{font-size:22px;}
.customer-order-lock{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:12px;border-radius:12px;margin:10px 0;line-height:1.6;font-size:13px;}.qt-toast{position:fixed;bottom:80px;left:50%;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:300;max-width:80%;text-align:center;}
.qt-toast.show{opacity:1;transform:translate(-50%,0);}
#notif-toast-box{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:90%;max-width:400px;}
.notif-toast{background:#1e293b;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;}
.notif-panel{background:#fff;border-radius:var(--radius);padding:8px;}
.notif-item{padding:10px;border-bottom:1px solid #f1f5f9;font-size:14px;cursor:pointer;}
.notif-item.unread{background:#f0f9ff;font-weight:600;}
.notif-item small{display:block;color:#94a3b8;font-weight:400;margin-top:2px;}
@media(min-width:700px){.qt-main{padding:24px;}}


/* Customer order tracking UI */
.qt-track-hero{background:#fff;border-radius:20px;padding:18px;margin:10px 0 12px;box-shadow:0 4px 16px rgba(15,23,42,.07);border:1px solid var(--line)}
.qt-track-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.qt-track-number{font-size:18px;font-weight:700;color:var(--text)}
.qt-track-sub{font-size:12px;color:var(--muted);margin-top:3px}
.qt-track-status{font-size:12px;font-weight:700;background:#eff6ff;color:#1d4ed8;padding:7px 10px;border-radius:999px;white-space:nowrap}
.qt-track-progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:18px 0 4px}
.qt-track-progress-item{text-align:center;position:relative;font-size:10px;color:#94a3b8}
.qt-track-progress-item:before{content:'';display:block;width:18px;height:18px;border-radius:50%;background:#e2e8f0;margin:0 auto 5px;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.qt-track-progress-item.done{color:#047857;font-weight:600}
.qt-track-progress-item.done:before{background:#10b981;box-shadow:0 0 0 1px #10b981}
.qt-track-progress-item.current{color:#1d4ed8;font-weight:700}
.qt-track-progress-item.current:before{background:#2563eb;box-shadow:0 0 0 3px #dbeafe}
.qt-track-map-card{background:#fff;border-radius:20px;padding:12px;margin:12px 0;box-shadow:0 4px 16px rgba(15,23,42,.07);border:1px solid var(--line)}
.qt-track-map-card h3{margin:2px 4px 8px;font-size:15px}
.qt-track-map-card .map-box{height:300px;margin:0;border-radius:14px}
.qt-track-rider{background:#fff;border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 4px 16px rgba(15,23,42,.07);border:1px solid var(--line)}
.qt-track-rider-head{display:flex;align-items:center;gap:12px}
.qt-track-rider .rider-profile-photo{width:58px;height:58px;border-radius:50%}
.qt-track-rider-info{flex:1;min-width:0}
.qt-track-rider-info b{font-size:16px}
.qt-track-rider-meta{font-size:12px;color:var(--muted);margin-top:2px}
.qt-track-section{background:#fff;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 4px 16px rgba(15,23,42,.07);border:1px solid var(--line)}
.qt-track-section h3{font-size:15px;margin:0 0 10px}
.qt-track-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.qt-track-row:last-child{border-bottom:0}
.qt-track-row span:first-child{color:var(--muted)}
@media(max-width:380px){.qt-track-progress-item{font-size:9px}.qt-track-status{font-size:11px;padding:6px 8px}}

/* ===== QueueTech Modern UI Refresh v2 ===== */
:root{
  --primary:#1d4ed8;--primary-dark:#1e40af;--accent:#0ea5e9;
  --danger:#dc2626;--bg:#f6f8fb;--surface:#fff;--text:#172033;
  --muted:#64748b;--line:#e2e8f0;--radius:18px;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 0% 0%,rgba(59,130,246,.10),transparent 28rem),
    radial-gradient(circle at 100% 10%,rgba(56,189,248,.10),transparent 24rem),
    var(--bg);color:var(--text);letter-spacing:.05px;
}
.qt-banner{background:#172033;color:#e2e8f0;padding:8px 14px;font-size:11px;letter-spacing:.15px}
.qt-header{
  padding:14px 18px;background:rgba(255,255,255,.88);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(226,232,240,.8);box-shadow:0 4px 20px rgba(15,23,42,.04)
}
.qt-logo{font-size:20px;letter-spacing:-.4px;color:var(--primary-dark)}
.qt-logo span{color:var(--accent)}
.qt-auth-links a{font-weight:600;color:var(--primary-dark)}
.qt-user-chip{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe;padding:8px 12px;font-weight:600}
.qt-main{max-width:720px;padding:22px 16px 90px}
h1,h2,h3{color:var(--text);letter-spacing:-.4px}
h1{font-size:clamp(25px,6vw,36px);line-height:1.2}
h2{font-size:24px;margin:10px 0 16px}
h3{font-size:18px;margin:20px 0 10px}
.hero{
  position:relative;overflow:hidden;text-align:left;margin:4px 0 22px;
  padding:28px 24px;border-radius:24px;color:#fff;
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 55%,#3b82f6 100%);
  box-shadow:0 14px 30px rgba(37,99,235,.20)
}
.hero:after{content:"";position:absolute;width:180px;height:180px;border:28px solid rgba(255,255,255,.10);border-radius:50%;right:-55px;top:-65px}
.hero h1,.hero p{position:relative;z-index:1;color:#fff}
.hero p{opacity:.88;margin:8px 0 0}
.grid-menu{gap:12px;margin:18px 0 26px}
.menu-card{
  min-height:112px;display:flex;flex-direction:column;justify-content:center;
  border:1px solid rgba(226,232,240,.9);border-radius:18px;padding:14px 8px;
  background:rgba(255,255,255,.92);box-shadow:0 6px 18px rgba(15,23,42,.05);
  transition:transform .2s,box-shadow .2s,border-color .2s
}
.menu-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(15,23,42,.10);border-color:#bfdbfe}
.menu-card div{font-weight:600;color:#334155}
.menu-card.danger{background:linear-gradient(145deg,#fff1f2,#fff);border-color:#fecdd3;color:#dc2626}
.btn-primary,.btn-secondary,.btn-danger{
  min-height:44px;border-radius:12px;font-family:inherit;font-weight:700;
  transition:transform .15s,box-shadow .15s,filter .15s
}
.btn-primary{background:linear-gradient(135deg,#1d4ed8,#2563eb);box-shadow:0 6px 14px rgba(37,99,235,.18)}
.btn-primary:hover,.btn-secondary:hover,.btn-danger:hover{transform:translateY(-1px);filter:brightness(1.03)}
.btn-secondary{background:#f1f5f9;color:#334155;border:1px solid #e2e8f0}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444)}
form,.inline-form,.order-detail-card,.order-summary,.notif-panel{
  background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 8px 24px rgba(15,23,42,.045)
}
form label{color:#475569;margin-top:14px}
form input,form select,form textarea{
  padding:12px 13px;border:1px solid #dbe3ec;border-radius:11px;background:#fbfdff;
  color:var(--text);outline:none;transition:border .15s,box-shadow .15s
}
form input:focus,form select:focus,form textarea:focus{
  border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13);background:#fff
}
.map-box{height:300px;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px rgba(15,23,42,.06)}
.tabs{gap:8px}
.tab{border:1px solid #dbe3ec;background:#fff;color:#475569;border-radius:999px;padding:9px 14px;font-weight:600}
.tab.active{background:#1d4ed8;border-color:#1d4ed8;box-shadow:0 5px 12px rgba(29,78,216,.16)}
.demo-accounts{border:1px solid #bfdbfe;border-radius:14px;background:#eff6ff;color:#1e40af}
.shop-list{gap:12px}
.shop-card,.order-card,.tech-card,.module-card,.status-toggle,.stat-card,.cart-item,.product-card{
  border:1px solid var(--line);box-shadow:0 7px 20px rgba(15,23,42,.045)
}
.shop-card{padding:13px;border-radius:16px;transition:transform .18s,box-shadow .18s}
.shop-card:hover,.order-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(15,23,42,.09)}
.shop-logo{width:64px;height:64px;min-width:64px;max-width:64px;aspect-ratio:1/1;border-radius:10px;object-fit:cover;display:block;background:transparent;border:0;padding:0;box-shadow:none}
.shop-info{color:#64748b}
.shop-info b,.product-info b{color:var(--text);font-size:14px}
.product-grid{gap:14px}
.product-card{border-radius:16px;background:#fff}
.product-img{height:135px;background:#f1f5f9}
.product-info{padding:12px}
.product-info button{border-radius:10px;padding:9px;background:var(--primary);color:#fff;font-weight:700}
.row-btns{gap:8px}
.row-btns button,.row-btns a{border-radius:10px;padding:9px;font-weight:600}
.badge{padding:5px 9px;font-weight:600}
.stat-cards{gap:10px}
.stat-card{border-radius:16px;padding:14px;background:linear-gradient(145deg,#fff,#f8fafc)}
.stat-card b{display:block;font-size:24px;color:#1d4ed8;margin-top:4px}
.status-toggle{border-radius:16px;padding:14px}
.shop-header{height:110px;border-radius:20px;box-shadow:0 10px 24px rgba(15,23,42,.08);background-size:cover;background-position:center;background-color:#e7ebee;padding:0;position:relative}
.shop-header-avatar{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);line-height:0}
.shop-logo-lg{width:60px;height:60px;min-width:60px;max-width:60px;aspect-ratio:1/1;border-radius:50%;object-fit:cover;display:block;border:3px solid #fff;background:#f1f5f9;box-shadow:0 4px 12px rgba(15,23,42,.16)}
.shop-summary{padding:0;text-align:center;margin-top:34px}
.shop-summary p{margin:4px 0}
.menu-list{display:flex;flex-direction:column;gap:10px;margin:10px 0 20px}
.menu-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #eef1ee;border-radius:16px;padding:10px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
.menu-row.disabled{opacity:.55}
.menu-row-img{width:64px;height:64px;min-width:64px;border-radius:12px;object-fit:cover;background:#f1f5f9}
.menu-row-info{flex:1;min-width:0}
.menu-row-info b{display:block;font-size:14px;color:#1d3026;margin-bottom:2px}
.menu-row-desc{font-size:12px;color:#7a8780;line-height:1.35;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.menu-row-price{font-size:13px;font-weight:700;color:#0aa568}
.menu-row-add{width:34px;height:34px;min-width:34px;border-radius:50%;border:none;background:var(--primary,#2563eb);color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.menu-list-recommended .menu-row{border:1px solid #fde68a;background:linear-gradient(180deg,#fffbeb,#fff)}
.promo-banner,.promo-card{border-radius:16px;border:1px solid #fde68a;box-shadow:0 5px 14px rgba(245,158,11,.06)}
.warn-text{border:1px solid #fecaca;border-radius:12px}
.qt-bottomnav{
  background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid rgba(226,232,240,.9);box-shadow:0 -6px 20px rgba(15,23,42,.06);
  padding-top:5px
}

<script id="qt-v532-helpers">
/* V5.32 helpers — defined first so every later script can use them */
function escapeHtml(value){ return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function qtCleanText(v){ return String(v==null?'':v).replace(/[<>]/g,'').replace(/\s+/g,' ').trim(); }
function qtCssUrl(u){ try{ return encodeURI(String(u||'')).replace(/'/g,'%27').replace(/"/g,'%22').replace(/\(/g,'%28').replace(/\)/g,'%29'); }catch(e){ return ''; } }
/* Sync state: in-flight writes, per-row "last persisted" hashes, polling bookkeeping */
const QT_SYNC={pending:0,lastWrite:0,busy:false,dirty:{},hash:{},profileMaps:null,tick:0,lastErrorToast:0,timer:null};
function qtTrackPersist(p){
  QT_SYNC.pending++; QT_SYNC.lastWrite=Date.now();
  return Promise.resolve(p).finally(()=>{ QT_SYNC.pending=Math.max(0,QT_SYNC.pending-1); QT_SYNC.lastWrite=Date.now(); });
}
function qtSyncFailed(key,err){
  console.warn('Supabase sync failed:',key,err);
  /* Notifications are auxiliary. A notification RLS failure must never make an
     order, cancellation, assignment, payment, or other business action look
     like it failed. The notification remains in the current session and will
     be retried by the normal sync cycle after the DB policy is corrected. */
  if(key==='qt_notifications'){ console.warn('QueueTech notification sync failed; auth/session may need refresh.', {hasSession:!!qtSessionRead(), hasAccessToken:!!qtAccessToken(), hasRefreshToken:!!qtSessionRead()?.refreshToken}); return; }
  if(Date.now()-QT_SYNC.lastErrorToast<15000) return;
  QT_SYNC.lastErrorToast=Date.now();
  try{ toast('บันทึกข้อมูลขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ('+String((err&&err.message)||'unknown').slice(0,80)+')'); }catch(e){}
}
/* notifications: in-app objects use {body, link}; the table has {message, type, reference_id} */
function qtNotifDbParts(n){
  const m=String(n.link||'').match(/^(order|technician-job)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {type:m[1]==='order'?'order':'quotation',ref:m[2]};
  return {type:['order','quotation','delivery','payment','complaint','system'].includes(n.type)?n.type:'system',ref:(n.referenceId&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(n.referenceId))?n.referenceId:null};
}
function qtNotifLinkFromRow(n){ if(!n.reference_id) return undefined; if(n.type==='order') return 'order/'+n.reference_id; if(n.type==='quotation') return 'technician-job/'+n.reference_id; return undefined; }
/* never send the password (or other secrets) to the database inside metadata */
function qtUserMetadata(u){
  const m=Object.assign({},u);
  delete m.password;
  /* Batch 3: account status/identity stay in users columns; profile metadata is
     only for rider/shop/technician profile details and documents. */
  delete m.status;
  delete m.applicationStatus;
  delete m.authUserId;
  delete m.type;
  delete m.id;
  return m;
}
</script>

<script id="qt-supabase-client">
/* QueueTech Supabase connection — public publishable key only */
window.QT_SUPABASE_CONFIG = {
  URL: 'https://pkypiqhlrmzocysgeqew.supabase.co',
  KEY: 'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
/* Flip this to true only AFTER running the migration below in Supabase, otherwise every
   order insert will fail with "column customer_verification_photo does not exist":
   ALTER TABLE public.orders ADD COLUMN customer_verification_photo text; */
window.QT_HAS_VERIFICATION_PHOTO_COLUMN = false;
/* Flip this to true only AFTER creating the "reviews" table below in Supabase, otherwise every
   review save will fail with "relation \"public.reviews\" does not exist":
   CREATE TABLE public.reviews (
     id uuid PRIMARY KEY,
     order_id uuid REFERENCES public.orders(id) UNIQUE,
     shop_id uuid REFERENCES public.shop_profiles(id),
     customer_id uuid REFERENCES auth.users(id),
     customer_name text,
     rating smallint NOT NULL CHECK (rating BETWEEN 1 AND 5),
     comment text,
     created_at timestamptz DEFAULT now(),
     updated_at timestamptz DEFAULT now()
   );
   -- order_id is UNIQUE to enforce "1 review per order" at the database level too.
   Until this table exists, reviews are kept in-memory for the current session only
   (they still work end-to-end in this browser tab, they just won't sync/persist). */
window.QT_HAS_REVIEWS_TABLE = false;
function qtSupabaseHeaders(accessToken){
  const h={apikey:QT_SUPABASE_CONFIG.KEY,'Content-Type':'application/json'};
  if(accessToken) h.Authorization='Bearer '+accessToken;
  return h;
}
async function qtSupabaseAuth(path, body){
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/'+path,{method:'POST',headers:qtSupabaseHeaders(),body:JSON.stringify(body)});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error_description||data.msg||data.message||'AUTH_ERROR');
  return data;
}
async function qtSupabaseTable(path, options={}){
  const headers=qtSupabaseHeaders(options.accessToken);
  const isNotif=String(path).startsWith('notifications');
  const rep=isNotif ? 'return=minimal' : 'return=representation';
  if(['POST','PATCH','PUT'].includes(String(options.method||'GET').toUpperCase())){
    headers.Prefer=String(path).includes('on_conflict=') && String(options.method||'').toUpperCase()==='POST'
      ? rep+',resolution=merge-duplicates' : rep;
  }
  const r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):undefined});
  const data=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((data&&data.message)||((data&&data.hint)?data.hint:'DB_ERROR_'+r.status));
  return data;
}
function qtAuthEmailFromPhone(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  return digits+'@auth.queuetech.local';
}
async function qtCreateSupabaseUser({name,phone,password,email}){
  const cleanEmail=String(email||'').trim().toLowerCase();
  const cleanPhone=String(phone||'').trim();
  const authEmail=cleanEmail || qtAuthEmailFromPhone(cleanPhone);
  const auth=await qtSupabaseAuth('signup',{
    email:authEmail,
    password,
    data:{name,phone:cleanPhone||null,role:'customer'}
  });
  let session=auth.session;
  if(!auth.user) throw new Error('สร้างบัญชี Auth ไม่สำเร็จ');
  if(!session || !session.access_token){
    if(cleanEmail){
      return {auth,session:null,profile:null,needsEmailConfirmation:true,authEmail};
    }
    try{
      session=await qtSupabaseAuth('token?grant_type=password',{email:authEmail,password});
    }catch(loginErr){
      throw new Error('AUTH_CONFIRMATION_REQUIRED');
    }
  }
  /* V5.37 FIX:
     The users table flow already uses auth_user_id as the conflict identity
     elsewhere in QueueTech. Use that same database-backed identity here.
     Do not use phone as the conflict target because the earlier V5.32 target
     was not backed by a matching UNIQUE/EXCLUSION constraint. */
  const row={
    auth_user_id:auth.user.id,
    role:'customer',
    name,
    phone:cleanPhone||null,
    status:'active'
  };
  const rows=await qtSupabaseTable('users?select=id,auth_user_id,role,name,phone,status,created_at&on_conflict=auth_user_id',{method:'POST',accessToken:session.access_token,body:row});
  const profile=Array.isArray(rows)?rows[0]:rows;
  if(!profile) throw new Error('สร้างข้อมูลผู้ใช้ในฐานข้อมูลไม่สำเร็จ');
  return {auth,session,profile,needsEmailConfirmation:false,authEmail};
}
async function qtLoadOwnSupabaseUser(accessToken, authUserId){
  const rows=await qtSupabaseTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(authUserId),{accessToken});
  return Array.isArray(rows)?rows[0]:null;
}

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* QueueGo Customer-only extraction: shared Supabase schema/IDs are preserved.
   Shop/Rider management is not included; customer reads shared shop/rider data for storefront and delivery tracking. */
/* =========================================================================
   QueueGo Customer App — Index5 Customer-only build
   Source: current QueueGo Index5 working file.
   Shop / Rider / Admin / Technician management UI is separated out.
   Shared Supabase database/auth/order contract is preserved.
   No database migration, table rename, or schema change is performed here.
   ========================================================================= */

/* ---------- Supabase-backed application data layer ----------
   Business data is kept in memory and persisted to Supabase.
   LocalStorage is NOT used for users/orders/technician jobs/quotes/notifications/audit/finance.
   The authentication session is persisted in localStorage (sessionStorage is fallback only). */
const QT_DB_CACHE = Object.create(null);
const QT_DB_KEYS = new Set(['qt_users','qt_orders','qt_notifications','qt_promotions','qt_products','qt_reviews']);
const QT_DB_READY = {value:false};
function dbGet(key, def){
  if(Object.prototype.hasOwnProperty.call(QT_DB_CACHE,key)) return QT_DB_CACHE[key];
  if(String(key).startsWith('qt_cart_')){
    try{
      const raw=localStorage.getItem(key) || sessionStorage.getItem(key);
      if(raw!==null){
        const parsed=JSON.parse(raw);
        QT_DB_CACHE[key]=parsed;
        return parsed;
      }
    }catch(e){}
  }
  return def!==undefined ? def : [];
}
function dbSet(key, val){
  QT_DB_CACHE[key]=val;
  if(String(key).startsWith('qt_cart_')){
    try{ localStorage.setItem(key,JSON.stringify(val)); }catch(e){ try{ sessionStorage.setItem(key,JSON.stringify(val)); }catch(_){} }
    try{ updateCartCountUI(); }catch(e){}
    return;
  }
  if(QT_SYNC.busy) QT_SYNC.dirty[key]=val; /* a poll is in flight: re-apply this local write after it finishes */
  if(QT_DB_KEYS.has(key)) qtTrackPersist(qtPersistKey(key,val)).catch(err=>qtSyncFailed(key,err));
  else if(String(key).startsWith('qt_order_chat_') && !String(key).endsWith('_deleteAt')) qtTrackPersist(qtPersistChat(String(key).replace('qt_order_chat_',''),val)).catch(err=>qtSyncFailed(key,err));
  else if(!String(key).endsWith('_deleteAt')) console.warn('[QueueTech] dbSet("'+key+'") is not in QT_DB_KEYS and has no sync handler — this write stays local-only and will NOT sync to Supabase or other devices. Add "'+key+'" to QT_DB_KEYS in the code if this data should be shared.');
}

async function qtPersistChat(orderId,messages){
  const token=await qtGetAccessToken(); if(!token||!qtUuidLike(orderId)) return;
  const rows=Array.isArray(messages)?messages:[];
  for(const m of rows){ if(!qtUuidLike(m.id)||!qtUuidLike(m.senderId)) continue; await qtSupabaseTable('order_chat_messages?on_conflict=id',{method:'POST',accessToken:token,body:{id:m.id,order_id:orderId,sender_id:m.senderId,message:m.text||'',created_at:qtIso(m.createdAt)}}); }
}
function uid(){ return (window.crypto&&crypto.randomUUID) ? crypto.randomUUID() : ('00000000-0000-4000-8000-'+Math.random().toString(16).slice(2,14).padEnd(12,'0')); }

/* QueueGo auth session: persist only the authentication session locally so closing/reopening
   the web page does not sign the user out. Business data remains Supabase-backed. */
const QT_SESSION_STORAGE_KEY='qt_session';
function qtSessionRead(){
  try{
    const raw=localStorage.getItem(QT_SESSION_STORAGE_KEY) || sessionStorage.getItem(QT_SESSION_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function qtSessionWrite(s){
  try{ localStorage.setItem(QT_SESSION_STORAGE_KEY,JSON.stringify(s)); }catch(e){
    try{ sessionStorage.setItem(QT_SESSION_STORAGE_KEY,JSON.stringify(s)); }catch(_){}
  }
}
function qtSessionClear(){
  try{ localStorage.removeItem(QT_SESSION_STORAGE_KEY); }catch(e){}
  try{ sessionStorage.removeItem(QT_SESSION_STORAGE_KEY); }catch(e){}
}
function qtAccessToken(){ return qtSessionRead()?.accessToken || ''; }
function qtJwtExpiryMs(token){
  try{
    const part=String(token||'').split('.')[1];
    if(!part) return 0;
    const b64=part.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((part.length+3)%4);
    const payload=JSON.parse(atob(b64));
    return Number(payload.exp||0)*1000;
  }catch(e){ return 0; }
}
let QT_AUTH_REFRESH_PROMISE=null;
async function qtGetAccessToken(forceRefresh=false){
  const s=qtSessionRead();
  if(!s?.accessToken) return '';
  const exp=Number(s.expiresAt||0)||qtJwtExpiryMs(s.accessToken);
  const needsRefresh=forceRefresh || (exp>0 && exp-Date.now()<60000);
  if(!needsRefresh || !s.refreshToken) return s.accessToken;
  if(QT_AUTH_REFRESH_PROMISE) return QT_AUTH_REFRESH_PROMISE;
  QT_AUTH_REFRESH_PROMISE=(async()=>{
    try{
      const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',headers:qtSupabaseHeaders(),
        body:JSON.stringify({refresh_token:s.refreshToken})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok || !data.access_token) throw new Error(data.error_description||data.msg||data.message||'SESSION_REFRESH_FAILED');
      const next={...s,accessToken:data.access_token,refreshToken:data.refresh_token||s.refreshToken,expiresAt:data.expires_at||Math.floor(qtJwtExpiryMs(data.access_token)/1000)||null};
      qtSessionWrite(next);
      return next.accessToken;
    }finally{ QT_AUTH_REFRESH_PROMISE=null; }
  })();
  return QT_AUTH_REFRESH_PROMISE;
}
function qtIso(ts){ return new Date(ts||Date.now()).toISOString(); }
function qtUuidLike(id){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(id||'')); }

function qtOrderStatusToDb(s){
  const m={pending_shop:'pending',shop_accepted:'accepted',preparing:'preparing',waiting_rider:'ready',rider_to_shop:'assigned',picked_up:'picked_up',delivering:'in_progress',arrived:'in_progress',delivered:'completed',completed:'completed',cancelled:'cancelled'};

/* V5.33 performance: hydrate runs in the background — it must never block first paint or login.
   QT_DB_HYDRATING guards against overlapping loads (login + initial load + sync loop). */
let QT_DB_HYDRATING=false, QT_DB_HYDRATE_QUEUED=null, QT_DB_FULL_TRIED=false;
async function qtBackgroundHydrate(opts){
  opts=opts||{light:false};
  if(!qtAccessToken()){ QT_DB_READY.value=true; return; }
  if(QT_DB_HYDRATING){ /* already loading: remember one follow-up run instead of running two loads at once */
    if(!QT_DB_HYDRATE_QUEUED || !opts.light) QT_DB_HYDRATE_QUEUED=opts;
    return;
  }
  if(QT_SYNC.busy){ setTimeout(()=>qtBackgroundHydrate(opts),1000); return; } /* a sync poll is in flight; try again shortly */
  const token=await qtGetAccessToken();
  if(!token){ QT_DB_READY.value=true; return; }
  QT_DB_HYDRATING=true; QT_SYNC.busy=true; QT_SYNC.dirty={}; /* busy also pauses the sync loop and records local writes made meanwhile */
  let ok=false;
  try{
    await qtHydrateDatabase(opts);
    ok=true;
  }catch(err){
    console.error('Background hydrate failed:',err);
  }finally{
    if(!opts.light) QT_DB_FULL_TRIED=true;
    if(qtAccessToken()===token) Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; }); /* keep local writes made during the load */
    QT_SYNC.dirty={}; QT_SYNC.busy=false; QT_DB_HYDRATING=false;
  }
  const now=qtAccessToken();
  if(!now){ qtResetCache(); QT_DB_HYDRATE_QUEUED=null; return; } /* logged out while loading */
  if(now!==token) QT_DB_HYDRATE_QUEUED={light:false}; /* another account signed in while loading: load again for it */
  else if(ok) qtRerenderAfterHydrate();
  const q=QT_DB_HYDRATE_QUEUED; QT_DB_HYDRATE_QUEUED=null;
  if(q) setTimeout(()=>qtBackgroundHydrate(q),0);
}

  if(typing){ if(tries<6) setTimeout(()=>qtRerenderAfterHydrate(tries+1),1500); return; }

function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ---------- Central Notification Engine ----------
   General notifications: vibration once.
   Important notifications: vibration pattern once.
   Action-required notifications:
   - Rider new job: voice + repeating vibration until Accept
   - Customer rider arrival: voice + repeating vibration until Acknowledge
   Shop/Admin/Technician: visual + vibration only; no voice.
*/
const QT_NOTIFY_VIBRATION = {
  normal: [180],
  important: [260,120,260],
  critical: [500,160,500,160,900]
};
const qtNotificationVibrationTimers = {};

function qtVibrate(pattern){
  try{
    if(navigator && typeof navigator.vibrate === 'function'){
      navigator.vibrate(pattern);
      return true;
    }
  }catch(e){}
  return false;
}
function qtNotificationPriority(n){
  if(!n) return 'normal';
  const t=String(n.type||'').toLowerCase();
  if(['rider_arrived','rider_job','rider_job_offer'].includes(t)) return 'critical';
  if(['new_order','order_update','dispatch','support','approval','admin_alert'].includes(t)) return 'important';
  if(String(n.title||'').includes('มีงานจัดส่งใหม่') || String(n.title||'').includes('ไรเดอร์ของคุณมาถึงแล้ว')) return 'critical';
  return 'normal';
}
function qtStartNotificationVibration(n){
  if(!n || n.read || n.dismissed) return;
  const key=String(n.id||uid());
  qtStopNotificationVibration(key);
  const priority=qtNotificationPriority(n);
  if(priority==='critical'){
    const run=()=>qtVibrate(QT_NOTIFY_VIBRATION.critical);
    run();
    qtNotificationVibrationTimers[key]=setInterval(run,2200);
  }else{
    qtVibrate(priority==='important' ? QT_NOTIFY_VIBRATION.important : QT_NOTIFY_VIBRATION.normal);
  }
}
function qtStopNotificationVibration(key){
  if(key && qtNotificationVibrationTimers[key]){
    clearInterval(qtNotificationVibrationTimers[key]);
    delete qtNotificationVibrationTimers[key];
  }
  try{ if(navigator && typeof navigator.vibrate==='function') navigator.vibrate(0); }catch(e){}
}
function qtHandleNewNotification(n){
  const cur=currentUser();
  if(!cur || !n || n.userId!==cur.id) return;
  qtStartNotificationVibration(n);
  showLiveToast((n.title||'การแจ้งเตือน')+': '+(n.body||n.message||''), n.link);
}

function pushNotification(userId, title, body, link, type, referenceId){
  let all = dbGet('qt_notifications',[]);
  const now=Date.now();
  const safeLink=link||undefined;
  const inferred=qtNotifDbParts({link:safeLink,type,referenceId});
  /* Batch 5: prevent duplicate notifications caused by overlapping polling/monitors.
     The same user + title + body + link within a short window is one event. */
  const duplicate=all.find(n=>
    n.userId===userId &&
    String(n.title||'')===String(title||'') &&
    String(n.body||n.message||'')===String(body||'') &&
    String(n.link||'')===String(safeLink||'') &&
    now-Number(n.createdAt||0)<4000
  );
  if(duplicate){
    if(!duplicate.read) qtHandleNewNotification(duplicate);
    return duplicate;
  }
  const n={
    id:uid(),
    userId,
    title:title||'การแจ้งเตือน',
    body:body||'',
    link:safeLink,
    type:inferred.type,
    referenceId:referenceId || inferred.ref || null,
    read:false,
    createdAt:now
  };
  all.push(n);
  dbSet('qt_notifications', all);
  qtHandleNewNotification(n);
  return n;
}

  tileLayer(map);

        onChange(latitude,longitude);

      }, err=> toast('ไม่สามารถขอตำแหน่ง GPS ได้: '+err.message));

  const user = currentUser();

  if(overlay) overlay.classList.add('show');

  try{

function acknowledgeRiderArrival(){
  const orderId = qtArrivalCurrentOrderId;
  if(orderId){
    const user=currentUser();
    if(user){
      const list=dbGet('qt_notifications',[]);
      let changed=false;
      list.forEach(n=>{
        if(n.userId===user.id && n.orderId===orderId && n.type==='rider_arrived' && !n.read){
          n.read=true; n.readAt=Date.now(); changed=true;
        }
      });
      if(changed) dbSet('qt_notifications',list);
    }
  }
  qtArrivalSpeechActive = false;
  clearTimeout(qtArrivalSpeechTimer);
  qtStopNotificationVibration('ntf_arrived_'+orderId);
  if('speechSynthesis' in window){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  const overlay = document.getElementById('qtArrivalAlert');
  if(overlay) overlay.classList.remove('show');

  if(orderId){
    try{
      sessionStorage.setItem(qtArrivalAlertKey(orderId), JSON.stringify({
        active:false, acknowledged:true, acknowledgedAt:Date.now()
      }));
    }catch(e){}
    const orders = dbGet('qt_orders',[]);
    const idx = orders.findIndex(o=>o.id===orderId);
    if(idx>=0){
      orders[idx].customerArrivalAcknowledgedAt = Date.now();
      dbSet('qt_orders',orders);
    }
  }
  qtArrivalCurrentOrderId = null;
}

function checkCustomerRiderArrivalAlert(){
  const user = currentUser();
  if(!user || user.type!=='customer') return;

  const orders = dbGet('qt_orders',[]);
  const arrived = orders
    .filter(o=>o.customerId===user.id && o.status==='arrived')
    .sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))[0];

  if(!arrived) return;
  if(arrived.customerArrivalAcknowledgedAt) return;

  let saved = null;
  try{ saved = JSON.parse(sessionStorage.getItem(qtArrivalAlertKey(arrived.id)) || 'null'); }catch(e){}
  if(saved && saved.acknowledged) return;

  if(qtArrivalCurrentOrderId!==arrived.id || !qtArrivalSpeechActive){
    startRiderArrivalAlertRobust(arrived.id);
  }
}

function checkCustomerRiderArrivalAlertRobust(){

  ).sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0))[0];

  let saved=null;
  try{saved=JSON.parse(sessionStorage.getItem(qtArrivalAlertKey(arrived.id))||'null');}catch(e){}

/* ---------- V5.32 polling sync (there was no way for one device to see another's changes) ---------- */
function qtSyncHash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return h; }
function qtSyncSignature(){
  const me=currentUser();
  const main=qtSyncHash(JSON.stringify([me&&me.status,dbGet('qt_orders',[]),dbGet('qt_notifications',[]),dbGet('qt_products',[]),dbGet('qt_users',[]).filter(u=>u._profileOnly&&(u.type==='shop'||u.type==='rider'))]));
  const chat=qtSyncHash(JSON.stringify(Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&!k.endsWith('_deleteAt')).sort().map(k=>[k,(QT_DB_CACHE[k]||[]).length])));
  return {main,chat};
}

function qtSyncRerender(before,after){
  const user=currentUser(); if(!user||user.type!=='customer') return;
  const parts=(location.hash.replace('#','')||'home').split('/'); const name=parts[0],param=parts[1];
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
  if(name==='order' && before.main===after.main && after.chat!==before.chat){ try{renderOrderChatArea(param);}catch(e){} return; }
  if(before.main===after.main) return;
  const safe=['home','dashboard','profile','search','shop-view','cart','checkout','orders','order','order-chat','notifications'];
  if(!safe.includes(name)) return;
  const typed=[].slice.call(document.querySelectorAll('#app textarea,#app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typed) return;
  const y=window.scrollY; try{router();}catch(e){console.warn(e);} window.scrollTo(0,y);
}

async function qtSyncTick(force){
  if(QT_SYNC.busy||QT_DB_HYDRATING||!qtAccessToken()) return;
  if(document.hidden&&!force) return;
  if(QT_SYNC.pending>0||Date.now()-QT_SYNC.lastWrite<1800) return;
  const user=currentUser(); if(!user||user.type!=='customer') return;
  QT_SYNC.busy=true;QT_SYNC.dirty={};
  try{
    QT_SYNC.tick++;
    const before=qtSyncSignature();
    const seen=new Set(dbGet('qt_notifications',[]).map(n=>n.id));
    await qtHydrateDatabase({light:(QT_SYNC.tick%4)!==0});
    if(!qtAccessToken()){qtResetCache();return;}
    Object.keys(QT_SYNC.dirty).forEach(k=>{QT_DB_CACHE[k]=QT_SYNC.dirty[k];});
    dbGet('qt_notifications',[]).forEach(n=>{if(n.userId===user.id&&!n.read&&!seen.has(n.id)){try{qtHandleNewNotification(n);}catch(e){}}});
    const after=qtSyncSignature();
    if(after.main!==before.main||after.chat!==before.chat) qtSyncRerender(before,after);
  }catch(e){console.warn('QueueGo customer sync tick failed',e);}finally{QT_SYNC.dirty={};QT_SYNC.busy=false;}
}

async function qtRefreshActiveOrderFast(){
  /* Active customer tracking gets a short fallback refresh so the page does not
     depend on the normal 8s/60s sync cycle. Supabase Realtime remains primary. */
  if(document.hidden || QT_SYNC.busy || QT_DB_HYDRATING || !qtAccessToken()) return;
  const parts=(location.hash.replace('#','')||'').split('/');
  if(!['order','order-chat'].includes(parts[0]) || !parts[1]) return;
  const user=currentUser();
  if(!user || user.type!=='customer') return;
  try{
    const token=await qtGetAccessToken();
    if(!token) return;
    const rows=await qtSupabaseTable('orders?select=*&id=eq.'+encodeURIComponent(parts[1])+'&limit=1',{accessToken:token});
    if(!Array.isArray(rows)||!rows[0]) return;
    const row=rows[0];
    if(row.customer_id!==user.id) return;
    const incoming=qtOrderFromRow(row);
    const map=QT_SYNC.profileMaps||{};
    incoming.shopId=map.shopById?.get(row.shop_id)||incoming.shopId;
    incoming.riderId=map.riderById?.get(row.rider_id)||incoming.riderId;
    const old=dbGet('qt_orders',[]).find(o=>o.id===incoming.id);
    const changed=!old || JSON.stringify([
      old.status,old.riderId,old.shopId,old.deliveryLat,old.deliveryLng,
      old.updatedAt,old.total,old.deliveryFee
    ])!==JSON.stringify([
      incoming.status,incoming.riderId,incoming.shopId,incoming.deliveryLat,incoming.deliveryLng,
      incoming.updatedAt,incoming.total,incoming.deliveryFee
    ]);
    if(!changed) return;
    const orders=dbGet('qt_orders',[]).slice();
    const idx=orders.findIndex(o=>o.id===incoming.id);
    if(idx>=0){
      incoming.items=orders[idx].items||[];
      incoming.shopName=orders[idx].shopName;
      incoming.customerName=orders[idx].customerName;
      incoming.riderName=orders[idx].riderName;
      incoming.riderProfileId=incoming.riderProfileId||orders[idx].riderProfileId;
      incoming.pickup=Object.assign({},orders[idx].pickup||{},incoming.pickup||{});
      incoming.delivery=Object.assign({},orders[idx].delivery||{},incoming.delivery||{});
      orders[idx]=Object.assign({},orders[idx],incoming);
    }else orders.push(incoming);
    QT_DB_CACHE.qt_orders=orders;
    qtSyncRerender(
      {main:'active-order-before',chat:'active-order-chat'},
      {main:'active-order-'+Date.now(),chat:'active-order-chat'}
    );
  }catch(e){ console.warn('[QueueTech Active Tracking] refresh failed:',e); }
}
function qtStartSyncLoop(){
  if(QT_SYNC.timer) return;
  QT_SYNC.timer=setInterval(()=>qtSyncTick(),8000);
  /* Customer order tracking fallback: check the current order every 3 seconds.
     This is only a lightweight single-order query; it does not replace Realtime. */
  if(!window.QT_ACTIVE_ORDER_TIMER){
    window.QT_ACTIVE_ORDER_TIMER=setInterval(qtRefreshActiveOrderFast,3000);
  }
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ qtSyncTick(); qtRefreshActiveOrderFast(); } });
}
window.addEventListener('DOMContentLoaded', async ()=>{
  /* Render immediately, then restore the auth session and load the public storefront. */
  const hadSession=!!qtAccessToken();

});

async function qtReverseGeocodeCustomer(lat,lng){
  try{
    const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1&accept-language=th`;
    const r=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!r.ok) return '';
    const j=await r.json();
    const a=j.address||{};
    const parts=[a.house_number,a.road,a.suburb||a.neighbourhood,a.village||a.town||a.city,a.state].filter(Boolean);
    return parts.join(' ') || j.display_name || '';
  }catch(e){ return ''; }
}
async function qtSaveCustomerLocation(lat,lng,address){
  const users=dbGet('qt_users',[]); const user=currentUser();
  if(!user || user.type!=='customer') return false;
  const idx=users.findIndex(u=>u.id===user.id); if(idx<0) return false;
  users[idx].lat=Number(lat); users[idx].lng=Number(lng);
  if(address) users[idx].address=qtCleanText(address);
  QT_DB_CACHE.qt_users=users;
  try{
    const token=await qtGetAccessToken();
    if(token){
      await qtSupabaseTable('users?id=eq.'+encodeURIComponent(user.id),{method:'PATCH',accessToken:token,body:qtUserToRow(users[idx],true)});
    }
    qtMarkClean('qt_users');
    return true;
  }catch(e){
    console.warn('[QueueGo] customer location save failed',e);
    return false;
  }
}
function qtAutoCaptureCustomerLocation(){
  const user=currentUser();
  if(!user || user.type!=='customer' || !navigator.geolocation) return;
  if(sessionStorage.getItem('qg_customer_gps_captured')==='1') return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const address=await qtReverseGeocodeCustomer(lat,lng);
    await qtSaveCustomerLocation(lat,lng,address||'');
    sessionStorage.setItem('qg_customer_gps_captured','1');
    const el=document.getElementById('qg-customer-location-text');
    if(el) el.textContent=address || `พิกัด ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

/* ---------- หน้าแรก: ดึงร้านจริงจาก DB มาขึ้นหน้าแรกตามหมวดต่าง ๆ (ร้านใหม่ขึ้นอัตโนมัติ ไม่ต้องแก้ HTML) ---------- */
function qtShopOrderCounts(){
  const orders=dbGet('qt_orders',[]);
  const map={};
  (Array.isArray(orders)?orders:[]).forEach(o=>{ if(o&&o.shopId) map[o.shopId]=(map[o.shopId]||0)+1; });
  return map;
}
function isShopOpenNow(s){
  if(!s.openTime || !s.closeTime) return true; // ไม่ได้ตั้งเวลาไว้ ถือว่าเปิดรับออเดอร์ได้เสมอ
  const now=new Date(); const cur=now.getHours()*60+now.getMinutes();
  const om=String(s.openTime).split(':').map(Number), cm=String(s.closeTime).split(':').map(Number);
  if(om.some(Number.isNaN)||cm.some(Number.isNaN)) return true;
  const open=om[0]*60+om[1], close=cm[0]*60+cm[1];
  return close>open ? (cur>=open&&cur<close) : (cur>=open||cur<close);
}
function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
function qgShopStrip(id, list){
  const el=document.getElementById(id);
  if(!el) return;
  el.innerHTML = list.length ? list.map(shopCard).join('') : '<div class="qg-empty-hint">ยังไม่มีร้านในหมวดนี้</div>';
}
async function renderHomeShopSections(){
  let shops = dbGet('qt_users',[]).filter(u=>u.type==='shop' && u.shopName);
  if(!shops.length){ await qtEnsurePublicShopsLoaded(); shops = dbGet('qt_users',[]).filter(u=>u.type==='shop' && u.shopName); }
  const openSec=document.getElementById('home-sec-open');
  const catBox=document.getElementById('home-categories');
  if(!shops.length){
    qgShopStrip('home-recommended', []);
    qgShopStrip('home-popular', []);
    qgShopStrip('home-discovery', []);
    if(openSec) openSec.style.display='none';
    if(catBox) catBox.innerHTML='';
    return;
  }
  const orderCounts=qtShopOrderCounts();
  const withMeta=shops.map(s=>Object.assign({},s,{_orders:orderCounts[s.id]||0,_open:isShopOpenNow(s)}));

  const complete=withMeta.filter(s=>(s.profileImage||s.profile_image||s.profilePhoto||s.avatarUrl||s.cover||s.logo) && s.address);
  const recommended=(complete.length?complete:withMeta).slice().sort((a,b)=>(b._open-a._open)||(b._orders-a._orders)).slice(0,8);
  qgShopStrip('home-recommended', recommended);

  const withOrders=withMeta.filter(s=>s._orders>0);
  const popular=(withOrders.length?withOrders:withMeta).slice().sort((a,b)=>b._orders-a._orders).slice(0,8);
  qgShopStrip('home-popular', popular);

  const openNow=withMeta.filter(s=>s._open).slice(0,8);
  if(openSec) openSec.style.display = openNow.length ? '' : 'none';
  qgShopStrip('home-open', openNow);

  qgShopStrip('home-discovery', shuffleArray(withMeta.slice()).slice(0,8));

  const cats=['food','cafe','grocery','other'];
  if(catBox){
    catBox.innerHTML = cats.map(c=>{
      const list=withMeta.filter(s=>s.category===c).slice(0,6);
      if(!list.length) return '';
      return `<section class="qg-section"><div class="qg-section-head"><h2>${categoryLabel(c)}</h2><button onclick="navigate('search/${c}')">ดูทั้งหมด ›</button></div><div class="qg-shop-strip">${list.map(shopCard).join('')}</div></section>`;
    }).join('');
  }
}

/* กล้องยืนยันตัวตนหน้า Checkout: เปิดค้างไว้ ตรวจจับใบหน้าแล้วบันทึกภาพอัตโนมัติ
   ปุ่มเลื่อนยืนยันจะถูกล็อกจนกว่าจะพบใบหน้าอย่างน้อยหนึ่งครั้ง */
let qtCheckoutCamStream=null, qtCheckoutCamTimer=null;
async function qtStartCheckoutFaceCam(){
  const video=document.getElementById('co-verify-video');
  const canvas=document.getElementById('co-verify-canvas');
  const statusEl=document.getElementById('co-verify-status');
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(statusEl) statusEl.textContent='อุปกรณ์นี้ไม่รองรับการเปิดกล้องผ่านเบราว์เซอร์';
    return;
  }
  try{
    qtCheckoutCamStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
    video.srcObject=qtCheckoutCamStream;
  }catch(err){
    console.error('[QueueTech] checkout camera failed:',err);
    if(statusEl) statusEl.textContent='ไม่สามารถเข้าถึงกล้องได้ กรุณาอนุญาตการใช้กล้องแล้วลองใหม่';
    return;
  }
  const ctx=canvas.getContext('2d');
  let confirmedOnce=false;
  qtCheckoutCamTimer=setInterval(()=>{
    if(!video.videoWidth) return;
    const w=video.videoWidth, h=video.videoHeight, size=Math.min(w,h);
    const sx=(w-size)/2, sy=(h-size)/2;
    canvas.width=64; canvas.height=64;
    ctx.drawImage(video, sx, sy, size, size, 0, 0, 64, 64);
    let skin=0, total=0;
    let sample;
    try{ sample=ctx.getImageData(12,8,40,48).data; }catch(e){ return; }
    for(let i=0;i<sample.length;i+=4){
      const r=sample[i], g=sample[i+1], b=sample[i+2];
      total++;
      const max=Math.max(r,g,b), min=Math.min(r,g,b);
      if(r>90 && g>40 && b>20 && (max-min)>15 && Math.abs(r-g)>12 && r>g && r>b) skin++;
    }
    const faceLike = total>0 && (skin/total) > 0.14;
    const slide=document.getElementById('checkout-confirm-slide');
    if(faceLike){
      const maxOut=900;
      const outCanvas=document.createElement('canvas');
      outCanvas.width=maxOut; outCanvas.height=maxOut;
      outCanvas.getContext('2d').drawImage(video, sx, sy, size, size, 0, 0, maxOut, maxOut);
      window.QT_CAM_CAPTURES=window.QT_CAM_CAPTURES||{};
      window.QT_CAM_CAPTURES['co-verify-photo']=outCanvas.toDataURL('image/jpeg',0.85);
      confirmedOnce=true;
      if(statusEl){ statusEl.textContent='✅ พบใบหน้า — บันทึกภาพยืนยันแล้ว'; statusEl.classList.add('qt-livecam-ok'); }
      if(slide) slide.classList.remove('qt-slide-locked');
    } else if(!confirmedOnce){
      if(statusEl){ statusEl.textContent='🔍 กรุณาหันหน้าเข้ากล้องให้อยู่ในกรอบ'; statusEl.classList.remove('qt-livecam-ok'); }
      if(slide) slide.classList.add('qt-slide-locked');
    }
  }, 500);
}
function qtStopCheckoutFaceCam(){
  if(qtCheckoutCamTimer){ clearInterval(qtCheckoutCamTimer); qtCheckoutCamTimer=null; }
  if(qtCheckoutCamStream){ qtCheckoutCamStream.getTracks().forEach(t=>t.stop()); qtCheckoutCamStream=null; }
}

async function handleRegister(e){
  e.preventDefault();
  const type='customer';
  const mode=document.getElementById('reg-contact-mode')?.value||'phone';
  const name=qtCleanText(document.getElementById('reg-name').value);
  const phone=document.getElementById('reg-phone')?.value.trim().replace(/[-\s]/g,'')||'';
  const email=document.getElementById('reg-email')?.value.trim().toLowerCase()||'';
  const password=document.getElementById('reg-password').value;
  const passwordConfirm=document.getElementById('reg-password-confirm')?.value||'';
  if(password.length<6){toast('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');return false;}
  if(password!==passwordConfirm){toast('รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน');return false;}
  if(!name){toast('กรุณากรอกชื่อ');return false;}
  if(mode==='phone'&&!/^0[0-9]{9}$/.test(phone)){toast('กรุณากรอกเบอร์โทรศัพท์ 10 หลัก เช่น 0812345678');return false;}
  if(mode==='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){toast('กรุณากรอกอีเมลให้ถูกต้อง');return false;}
  const submitBtn=e.submitter||null;if(submitBtn)submitBtn.disabled=true;
  try{
    const result=await qtCreateSupabaseUser({name,phone:mode==='phone'?phone:'',password,email:mode==='email'?email:''});
    if(result.needsEmailConfirmation){ await renderRegistrationSuccess(null,{needsEmailConfirmation:true,email}); return false; }
    const p=result.profile;
    const user={id:p.id,authUserId:p.auth_user_id,type:'customer',name:p.name||name,phone:p.phone||phone,email:mode==='email'?email:'',status:p.status==='suspended'?'suspended':'approved',createdAt:new Date(p.created_at||Date.now()).getTime(),supabase:true};
    QT_DB_CACHE.qt_users=[user]; qtMarkClean('qt_users');
    setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:result.session.access_token,refreshToken:result.session.refresh_token||null,expiresAt:result.session.expires_at||Math.floor(qtJwtExpiryMs(result.session.access_token)/1000)||null,role:'customer'});
    await renderRegistrationSuccess(user);
    setTimeout(()=>qtBackgroundHydrate({light:false}),0);
  }catch(err){ console.error('QueueGo Customer registration error',err); qtRegisterErrorToast(err); }
  finally{if(submitBtn)submitBtn.disabled=false;}
  return false;
}

async function handleLogin(e){
  e.preventDefault();
  const loginValue=document.getElementById('login-phone').value.trim();
  const password=document.getElementById('login-password').value;
  if(!password){toast('กรุณากรอกรหัสผ่าน');return false;}
  const submitBtn=e.submitter||(e.target?.querySelector?.('button[type=submit]'))||null;
  if(submitBtn?.disabled) return false;
  const label=submitBtn?.textContent||''; if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='กำลังเข้าสู่ระบบ...';}
  try{
    const authEmail=loginValue.includes('@')?loginValue:qtAuthEmailFromPhone(loginValue);
    const auth=await qtSupabaseAuth('token?grant_type=password',{email:authEmail,password});
    let p=await qtLoadOwnSupabaseUser(auth.access_token,auth.user.id);
    if(!p){
      const meta=auth.user?.user_metadata||{};
      const role=String(meta.role||'customer');
      if(role!=='customer'){
        clearSession();
        toast('บัญชีนี้เป็นบัญชีของส่วนอื่น กรุณาใช้แอปของบัญชีนั้น');
        return false;
      }
      try{
        const rows=await qtSupabaseTable('users?select=id,auth_user_id,role,name,phone,status,created_at&on_conflict=auth_user_id',{method:'POST',accessToken:auth.access_token,body:{auth_user_id:auth.user.id,role:'customer',name:qtCleanText(meta.name||'ผู้ใช้'),phone:String(meta.phone||'').trim()||null,status:'active'}});
        p=Array.isArray(rows)?rows[0]:rows;
      }catch(createErr){ throw new Error('เข้าสู่ระบบสำเร็จ แต่ยังสร้างข้อมูลสมาชิกในฐานข้อมูลไม่ได้: '+createErr.message); }
    }
    if(String(p.role||'customer')!=='customer'){
      clearSession();
      toast('บัญชีนี้เป็นบัญชีของส่วนอื่น กรุณาใช้แอปของบัญชีนั้น');
      return false;
    }
    const user=qtUserFromRow(p);
    QT_DB_CACHE.qt_users=[user];qtMarkClean('qt_users');
    qtMigrateGuestCartToUser(user.id);
    setSession({userId:user.id,authUserId:p.auth_user_id,accessToken:auth.access_token,refreshToken:auth.refresh_token||null,expiresAt:auth.expires_at||Math.floor(qtJwtExpiryMs(auth.access_token)/1000)||null,role:'customer'});
    if(user.status==='suspended'){toast('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อ QueueGo');clearSession();qtResetCache();return false;}
    try{sessionStorage.removeItem('qg_customer_gps_captured');}catch(e){}
    let afterLogin=''; try{afterLogin=sessionStorage.getItem('qg_after_login')||'';sessionStorage.removeItem('qg_after_login');}catch(e){}
    navigate(afterLogin==='checkout'?'checkout':'home');
    setTimeout(()=>qtBackgroundHydrate({light:false}),0);
  }catch(err){
    console.error('QueueGo Customer login failed',err);
    toast(err && err.name==='TypeError' ? 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' : 'เบอร์โทรหรือรหัสผ่านไม่ถูกต้อง หรือยังไม่ได้เปิดใช้งานบัญชี Supabase');

function renderSearch(presetCategory){
  layout('ค้นหาร้าน/บริการ', `
    <h2>🔎 ค้นหาร้าน/บริการ</h2>
    <div class="qg-search-tools">
      <input id="search-keyword" placeholder="ค้นหาชื่อร้าน...">
      <select id="search-category">
        <option value="">ทุกหมวดหมู่</option>
        <option value="food">🍜 ร้านอาหาร</option>
        <option value="grocery">🛒 ของชำ</option>
        <option value="cafe">☕ คาเฟ่</option>
        <option value="other">📦 อื่นๆ</option>
      </select>
      <div id="search-location-status" class="search-location-status qg-search-location-auto">📍 ใช้ตำแหน่งของลูกค้าอัตโนมัติ</div>
    </div>
    <div id="promote-banner"></div>
    <div id="search-results" class="shop-list qg-shop-strip"></div>
  `);

  /* Search no longer has a map. Use the customer's saved delivery coordinates first,
     otherwise request the device GPS silently for distance ordering. Changing location
     is done from the delivery-address section on Home. */
  const user=currentUser();
  const savedLat=Number(user?.lat), savedLng=Number(user?.lng);
  if(Number.isFinite(savedLat)&&Number.isFinite(savedLng)){
    window.__searchLoc={lat:savedLat,lng:savedLng};
    updateSearchLocationStatus(true);
  }else if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      window.__searchLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};
      updateSearchLocationStatus(true);
      runSearch();
    },()=>{
      window.__searchLoc=window.__searchLoc||{lat:13.7563,lng:100.5018};
      updateSearchLocationStatus(false);
      runSearch();
    },{enableHighAccuracy:true,maximumAge:30000,timeout:10000});
  }else{
    window.__searchLoc=window.__searchLoc||{lat:13.7563,lng:100.5018};
    updateSearchLocationStatus(false);
  }

  const validCats=['food','grocery','cafe','other'];
  if(presetCategory && validCats.includes(presetCategory)){
    document.getElementById('search-category').value=presetCategory;
  }
  document.getElementById('search-keyword').addEventListener('input',runSearch);
  document.getElementById('search-category').addEventListener('change',runSearch);
  runSearch().catch(e=>console.warn('[QueueGo] initial shop search failed:',e));
}
function updateSearchLocationStatus(isGps){
  const el=document.getElementById('search-location-status');

  el.innerHTML=isGps
    ? '📍 <b>ใช้ตำแหน่งลูกค้าอัตโนมัติ</b> • เปลี่ยนได้ที่อยู่จัดส่ง'

}
function getMyLocationForSearch(){
  if(!navigator.geolocation){toast('ไม่รองรับ GPS');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    window.__searchLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};

function isPromoted(shopId){ return dbGet('qt_promotions',[]).some(p=>p.shopId===shopId && p.status==='active'); }
async function qtEnsurePublicShopsLoaded(){
  /* Guests use the same public Supabase read path; no auth token is required. */
  try{
    const token=await qtGetAccessToken();
    const authOpts=token?{accessToken:token}:{};
    const rows=await qtSupabaseTable('shop_profiles?select=*',authOpts);
    if(!Array.isArray(rows)) return false;
    const current=dbGet('qt_users',[]).filter(u=>u.type!=='shop');
    const shops=rows.filter(x=>x && String(x.status||'').toLowerCase()==='active').map(x=>{
      const meta=(x.metadata&&typeof x.metadata==='object')?x.metadata:{};
      return Object.assign({},meta,{id:x.user_id,type:'shop',status:'approved',shopName:x.shop_name,name:meta.name||x.shop_name,phone:x.phone,address:x.address,profileImage:x.profile_image||x.profile_photo||x.avatar_url||x.photo_url||x.image||meta.profileImage||meta.profile_image||meta.avatarUrl||meta.avatar_url||meta.cover||meta.logo||'',lat:x.latitude,lng:x.longitude,supabase:true,_profileOnly:true});
    });
    QT_DB_CACHE.qt_users=current.concat(shops);
    return shops.length>0;
  }catch(e){
    console.warn('[QueueTech] public shop load failed:',e);
    return false;
  }
}
async function runSearch(){
  const kw = (document.getElementById('search-keyword')?.value||'').toLowerCase();
  const cat = document.getElementById('search-category')?.value||'';
  const loc = window.__searchLoc || {lat:13.7563,lng:100.5018};
  let shops = dbGet('qt_users',[]).filter(u=>u.type==='shop' && u.shopName)
    .map(s=>{
      const hasCoords=Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng));
      return {...s, distance:hasCoords ? distanceKm(Number(loc.lat),Number(loc.lng),Number(s.lat),Number(s.lng)) : Infinity, _hasCoords:hasCoords};
    });
  if(!shops.length){
    const loaded=await qtEnsurePublicShopsLoaded();
    if(loaded){
      shops=dbGet('qt_users',[]).filter(u=>u.type==='shop' && u.shopName).map(s=>{
        const hasCoords=Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng));
        return {...s,distance:hasCoords?distanceKm(Number(loc.lat),Number(loc.lng),Number(s.lat),Number(s.lng)):Infinity,_hasCoords:hasCoords};
      });
    }
  }
  if(kw) shops = shops.filter(s=>s.shopName.toLowerCase().includes(kw));
  if(cat) shops = shops.filter(s=>s.category===cat);
  shops.sort((a,b)=> (Number(isPromoted(b.id)) - Number(isPromoted(a.id))) || (a.distance-b.distance));

  const promos = dbGet('qt_promotions',[]).filter(p=>p.status==='active' && (!cat || p.category===cat)).sort((a,b)=>b.bidPrice-a.bidPrice);
  document.getElementById('promote-banner').innerHTML = promos.length ? `
    <div class="promo-banner"><span class="ad-tag">โฆษณา/โปรโมต</span>⭐ ร้านแนะนำ: <b>${escapeHtml(promos[0].shopName)}</b> (พื้นที่: ${escapeHtml(promos[0].area)})</div>` : '';

  document.getElementById('search-results').innerHTML = shops.length ? shops.map(s=>shopCard(s)).join('') : '<p>ไม่พบร้านค้า</p>';
}
function qgShopLogoHtml(s){

/* ---------- Shop-set "recommended menu" flag ----------
   Contract for the shop-side app (built later): to mark a product as
   recommended, write `recommended: true` inside that product row's
   existing `metadata` JSONB column (table: public.products). No new
   column or migration is needed — `metadata` already round-trips to
   every product object here as extra fields (see the `p.metadata||{}`
   spreads above). Example PATCH body when the shop toggles a product:
     { "metadata": { ...existingMetadata, "recommended": true } }
   Up to 3 recommended products are shown at the top of the customer's
   shop page; if none are marked, the first 3 available products are
   shown there instead as a fallback. */
function qtIsRecommended(p){
  const v=p&&p.recommended;
  return v===true || v==='true' || v===1 || v==='1';
}

function qtCartOwnerKey(){
  const user=currentUser();
  return user&&user.type==='customer' ? user.id : 'guest';
}
function qtCartKey(){ return 'qt_cart_'+qtCartOwnerKey(); }
function qtGetCart(){ return dbGet(qtCartKey(),{shopId:null,items:[]}); }
function qtSetCart(cart){ dbSet(qtCartKey(),cart); }
function qtMigrateGuestCartToUser(userId){
  if(!userId) return;
  const guest=dbGet('qt_cart_guest',{shopId:null,items:[]});
  if(!guest?.items?.length) return;
  const mine=dbGet('qt_cart_'+userId,{shopId:guest.shopId||null,items:[]});
  if(!mine.items?.length){ dbSet('qt_cart_'+userId,guest); }
  else if(guest.shopId===mine.shopId){
    for(const gi of guest.items){
      const mi=mine.items.find(x=>x.productId===gi.productId);
      if(mi) mi.qty=Number(mi.qty||0)+Number(gi.qty||0); else mine.items.push(gi);
    }
    dbSet('qt_cart_'+userId,mine);
  }
  try{localStorage.removeItem('qt_cart_guest');}catch(e){} try{sessionStorage.removeItem('qt_cart_guest');}catch(e){}
  delete QT_DB_CACHE.qt_cart_guest;
}

function cartCount(){
  const key=qtCartKey();
  const cart=dbGet(key,{items:[]});
  return (cart.items||[]).reduce((s,i)=>s+Number(i.qty||0),0);
}

function addToCart(productId){
  // Guest users may build a cart. Login is required only when proceeding to checkout.
  const product = dbGet('qt_products',[]).find(p=>p.id===productId);
  if(!product){ toast('ไม่พบสินค้า'); return; }
  let cart = qtGetCart();
  if(cart.shopId && cart.shopId!==product.shopId){
    if(!confirm('ตะกร้าปัจจุบันเป็นของร้านอื่น ต้องการล้างตะกร้าและเริ่มใหม่หรือไม่?')) return;
    cart = {shopId:product.shopId, items:[]};
  }
  cart.shopId = product.shopId;
  const existing = cart.items.find(i=>i.productId===productId);
  if(existing) existing.qty++;
  else cart.items.push({productId, name:product.name, price:product.price, image:product.image, qty:1});
  qtSetCart(cart);
  toast('เพิ่มลงตะกร้าแล้ว');
}
function renderCart(){
  const cart = qtGetCart();
  const shop = cart.shopId ? dbGet('qt_users',[]).find(u=>u.id===cart.shopId) : null;
  const total = cart.items.reduce((s,i)=>s+i.price*i.qty,0);
  layout('ตะกร้าสินค้า', `
    <h2>🛒 ตะกร้าสินค้า</h2>
    ${shop?`<p>ร้าน: <b>${escapeHtml(shop.shopName)}</b></p>`:''}
    ${cart.items.length ? cart.items.map(i=>`
      <div class="cart-item">
        <img src="${escapeHtml(i.image||placeholderImg())}" class="cart-item-img">
        <div class="cart-item-info">
          <b>${escapeHtml(i.name)}</b>
          <div>${escapeHtml(i.price)} บาท x <button onclick="changeQty('${i.productId}',-1)">-</button> ${escapeHtml(i.qty)} <button onclick="changeQty('${i.productId}',1)">+</button></div>
        </div>
        <button class="btn-danger" onclick="removeFromCart('${i.productId}')">ลบ</button>
      </div>`).join('') : '<p>ตะกร้าว่างเปล่า</p>'}
    ${cart.items.length ? `<div class="cart-total">รวม: ${total} บาท</div>
      <button class="btn-primary btn-block" onclick="qtRequireLoginForCheckout()">ดำเนินการสั่งซื้อ →</button>` : ''}
  `);
}
function changeQty(productId, delta){
  const user = currentUser();
  let cart = qtGetCart();
  const item = cart.items.find(i=>i.productId===productId);
  item.qty += delta;
  if(item.qty<=0) cart.items = cart.items.filter(i=>i.productId!==productId);
  qtSetCart(cart);
  updateCartCountUI();
  renderCart();
}
function removeFromCart(productId){
  let cart = qtGetCart();
  cart.items = cart.items.filter(i=>i.productId!==productId);
  qtSetCart(cart);
  updateCartCountUI();
  renderCart();
}

/* ---------- QT Order Number ---------- */
/* Customer-facing order number: QT-001, QT-002, ... (3 digits).
   Numbering is GLOBAL across all shops and resets each calendar day.
   Therefore no two shops can receive the same QT number on the same day.
   The internal id remains unchanged for routing/storage compatibility. */
function qtLocalDateKey(ts){
  const d = new Date(ts || Date.now());
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function nextQTOrderNumber(){
  const orders = dbGet('qt_orders',[]);
  const today = qtLocalDateKey();
  let max = 0;
  orders.forEach(o=>{
    const orderDate = o.orderDate || qtLocalDateKey(o.createdAt);
    if(orderDate !== today) return;
    const m = String(o.orderNumber||'').match(/^QT-(\d{3})$/);
    if(m) max = Math.max(max, Number(m[1]));
  });
  const next = max + 1;
  if(next > 999){
    throw new Error('เลขออเดอร์ของวันนี้ครบ 999 รายการแล้ว');
  }
  return 'QT-' + String(next).padStart(3,'0');
}
function displayOrderNumber(order){
  const raw = String(order?.orderNumber || order?.order_number || '').trim();
  /* รูปแบบใหม่ QT-YYYYMMDD-xxxx (ฝังวันที่เพื่อความ unique ในฐานข้อมูล) -> แสดงเฉพาะ QT-xxxx */
  const dated = raw.match(/^QT-\d{8}-(\d{3,4})$/i);
  if(dated) return 'QT-'+dated[1];
  if(raw) return raw; /* เลขออเดอร์รูปแบบเดิม (เช่น QT-001) ยังแสดงตามเดิมเพื่อความเข้ากันได้กับข้อมูลเก่า */
  return 'QT-'+String(ordersFallbackNumber(order)).padStart(3,'0');
}
function ordersFallbackNumber(order){
  const orders=dbGet('qt_orders',[]);
  const idx=orders.findIndex(o=>o.id===order?.id);
  return idx>=0 ? idx+1 : 1;
}

function qtGenerateOrderNumber(){
  /* ผู้ใช้ต้องการเลขที่แสดงผลรูปแบบ QT-xxxx (สุ่ม 4 หลัก) และสุ่มใหม่ทุกวัน
     แต่ฐานข้อมูลมี unique constraint "orders_order_number_key" แบบ global (ไม่ได้แยกตามวัน)
     จึงต้องเก็บค่าจริงใน order_number แบบฝังวันที่ไว้ด้วย (QT-YYYYMMDD-xxxx) เพื่อไม่ให้ชนกับ
     ออเดอร์ของวันก่อน ๆ ส่วน UI จะตัดมาแสดงเฉพาะ QT-xxxx ผ่าน displayOrderNumber() */
  const orders = dbGet('qt_orders', []);
  const dateKey = qtLocalDateKey().replace(/-/g,'');
  const used = new Set(
    (Array.isArray(orders) ? orders : [])
      .map(o => String(o?.orderNumber || o?.order_number || '').trim().toUpperCase())
      .filter(Boolean)
  );
  for(let i=0;i<200;i++){
    const n = Math.floor(Math.random()*10000).toString().padStart(4,'0');
    const candidate = `QT-${dateKey}-${n}`;
    if(!used.has(candidate)) return candidate;
  }
  /* กรณีที่แทบเป็นไปไม่ได้ (สุ่มชนกันครบ 200 ครั้ง): ต่อท้ายด้วยเลขจาก timestamp เพื่อลดโอกาสชนกับ
     unique constraint ให้เหลือน้อยที่สุด ระบบ retry ใน confirmOrder() จะสุ่มใหม่อีกครั้งถ้ายังชนอยู่ */
  return `QT-${dateKey}-${Date.now().toString().slice(-4)}`;
}

async function confirmOrder(){
  const user=currentUser();
  if(!user){navigate('login');return;}
  const existingActive=getCustomerActiveOrder(user.id);
  if(existingActive){toast('มีออเดอร์ที่กำลังดำเนินการอยู่ ไม่สามารถสั่งซ้ำได้');navigate('order/'+existingActive.id);return;}
  const cart=dbGet('qt_cart_'+user.id,{items:[]});
  if(!cart.items.length){toast('ตะกร้าว่างเปล่า');navigate('cart');return;}
  const shop=dbGet('qt_users',[]).find(u=>u.id===cart.shopId);
  if(!shop){toast('ไม่พบข้อมูลร้านค้า กรุณากลับไปเลือกสินค้าใหม่');return;}
  /* บังคับถ่ายรูปยืนยันตัวตนสดผ่านกล้องก่อนบันทึกออเดอร์ เพื่อป้องกัน Order ผี/ออเดอร์ปลอม */
  const verifyPhoto=(window.QT_CAM_CAPTURES&&window.QT_CAM_CAPTURES['co-verify-photo'])||null;
  if(!verifyPhoto){ toast('กรุณาถ่ายรูปยืนยันตัวตนก่อนสั่งซื้อ'); return; }

  /* V5.31 FIX — ร้านต้องมี shop_profiles.id ที่แน่นอนก่อนสร้าง Order.
     ห้ามสร้าง Order ด้วย users.id แล้วหวังว่า mapping จะพร้อมภายหลัง. */
  let shopProfileId=shop.shopProfileId || QT_SYNC.profileMaps?.shopByUserId?.get(shop.id) || null;
  if(!shopProfileId){
    try{
      const token=await qtGetAccessToken();
      const rows=token ? await qtSupabaseTable('shop_profiles?select=id,user_id&user_id=eq.'+encodeURIComponent(shop.id)+'&limit=1',{accessToken:token}) : [];
      if(Array.isArray(rows) && rows[0]?.id){
        shopProfileId=rows[0].id;
        QT_SYNC.profileMaps=QT_SYNC.profileMaps||{};
        QT_SYNC.profileMaps.shopByUserId=QT_SYNC.profileMaps.shopByUserId||new Map();
        QT_SYNC.profileMaps.shopByUserId.set(shop.id,shopProfileId);
      }
    }catch(e){
      console.warn('[QueueTech] resolve shop profile failed:',e);
    }
  }
  if(!shopProfileId){
    toast('ไม่พบข้อมูลโปรไฟล์ร้านค้าในฐานข้อมูล กรุณาบันทึกข้อมูลร้านใหม่ก่อนสั่งซื้อ');
    console.error('[QueueTech] Order blocked: shop_profiles.id missing for user',shop.id);
    return;
  }

  const loc=window.__pickedLoc?window.__pickedLoc():{lat:shop.lat,lng:shop.lng};
  const addressEl=document.getElementById('delivery-address');
  const address=addressEl?addressEl.value.trim():'';
  const subtotal=cart.items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
  const deliveryFee=computeDeliveryFee(distanceKm(shop.lat,shop.lng,loc.lat,loc.lng));
  const gp=gpAmount(subtotal),total=subtotal+deliveryFee;
  const order={
    id:uid(),orderNumber: qtGenerateOrderNumber(),orderDate:qtLocalDateKey(),
    customerId:user.id,customerName:user.name,customerPhone:user.phone,
    shopId:shop.id,shopProfileId:shopProfileId,shopName:shop.shopName,riderId:null,riderName:null,
    items:cart.items.map(i=>Object.assign({},i)),subtotal,deliveryFee,gpAmount:gp,total,
    pickup:{lat:shop.lat,lng:shop.lng,address:shop.address},
    delivery:{lat:loc.lat,lng:loc.lng,address},
    customerVerificationPhoto:verifyPhoto,
    status:'pending_shop',statusLog:[{status:'pending_shop',time:Date.now()}],createdAt:Date.now()
  };
  const orders=dbGet('qt_orders',[]);
  orders.push(order);
  QT_DB_CACHE.qt_orders=orders;

  let saved=false,lastErr=null;
  for(let attempt=1;attempt<=5&&!saved;attempt++){
    try{
      await qtTrackPersist(qtPersistKey('qt_orders',orders));
      saved=true;
    }catch(err){
      lastErr=err;
      const errMsg=String((err&&err.message)||'');
      /* root cause ของ "duplicate key value violates unique constraint orders_order_number_key":
         เลขออเดอร์ที่สุ่มไว้ชนกับ order_number ที่มีอยู่แล้วในฐานข้อมูล (เช่น ของลูกค้า/ร้านอื่นที่
         เครื่องนี้มองไม่เห็นในแคชท้องถิ่น) ห้ามปิด/ลบ constraint — ให้สุ่มเลขออเดอร์ใหม่แล้วลองบันทึกซ้ำแทน */
      if(/order_number|orders_order_number_key/i.test(errMsg)){
        order.orderNumber=qtGenerateOrderNumber();
      }
      if(attempt<5)await new Promise(r=>setTimeout(r,500*attempt));
    }
  }
  if(!saved){
    const msg=String((lastErr&&lastErr.message)||'ไม่ทราบสาเหตุ');
    qtSyncFailed('qt_orders',lastErr||new Error('บันทึกออเดอร์ไม่สำเร็จ'));
    console.error('QueueTech confirmOrder save failed:',lastErr);
    toast('บันทึกออเดอร์ไม่สำเร็จ: '+msg.slice(0,120));
    return;
  }
  dbSet('qt_cart_'+user.id,{shopId:null,items:[]});
  if(window.QT_CAM_CAPTURES) delete window.QT_CAM_CAPTURES['co-verify-photo'];
  pushNotification(shop.id,'📦 มีคำสั่งซื้อใหม่',`กรุณากด “รับงาน” เพื่อเริ่มดำเนินการ • จาก ${user.name} ยอด ฿${total}`,'order/'+order.id);
  toast('สั่งซื้อสำเร็จ! บันทึกออเดอร์แล้ว');
  navigate('order/'+order.id);
}

const ORDER_STATUSES = [
  {key:'pending_shop', label:'รอร้านรับงาน', icon:'⏳'},
  {key:'shop_accepted', label:'ร้านรับงานแล้ว', icon:'✅'},

  {key:'completed', label:'ส่งสำเร็จ', icon:'⚫'},

];
function statusLabel(key){ const s = ORDER_STATUSES.find(x=>x.key===key); return s ? s.icon+' '+s.label : key; }
function statusIndex(key){ return ORDER_STATUSES.findIndex(x=>x.key===key); }

function orderStatusTimelineHTML(o){
  const current=statusIndex(o.status);
  const cancelled=o.status==='cancelled';
  const steps=ORDER_STATUSES.filter(s=>s.key!=='cancelled');
  const log=Array.isArray(o.statusLog)?o.statusLog:[];
  return `<div class="qt-order-progress">
    <div class="qt-order-progress-title">สถานะออเดอร์</div>
    <div class="qt-order-progress-list">${steps.map((st,i)=>{
      const done=!cancelled && current>=i;
      const active=!cancelled && st.key===o.status;
      const entry=[...log].reverse().find(x=>x&&x.status===st.key);
      const when=entry&&entry.time?new Date(entry.time).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';
      return `<div class="qt-order-step ${done?'done':''} ${active?'active':''}">
        <div class="qt-order-step-icon">${done?'✓':st.icon}</div>
        <div class="qt-order-step-text"><b>${st.label}</b>${active?'<span class="qt-order-now">สถานะปัจจุบัน</span>':''}${when?`<small>${when} น.</small>`:''}</div>
      </div>`;
    }).join('')}</div>
    ${cancelled?`<div class="qt-order-cancelled">❌ ออเดอร์ถูกยกเลิก${o.cancelReason?` — ${escapeHtml(o.cancelReason)}`:''}</div>`:''}
  </div>`;
}
