<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QueueGo - ผู้ใช้บริการ</title>
<style>
/* CUSTOMER COMPACT DENSITY — show more useful content per viewport without changing order flow. */
:root{--red:#ef3340;--rd:#d91f2d;--green:#18b77a;--gs:#eafaf3;--ink:#17191d;--mu:#73777f;--ln:#eceef1;--bg:#f7f7f8;--sh:0 8px 28px rgba(20,24,30,.07)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ink);overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Prompt",system-ui,sans-serif}
button,input,textarea{font:inherit}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:0;z-index:300;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(0,0,0,.05);padding:calc(env(safe-area-inset-top,0px) + 6px) 12px 6px}
.top>div{max-width:720px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:9px}
.brand{font-size:18px;font-weight:800;letter-spacing:-.4px;border:0;background:none;color:var(--ink);cursor:pointer}.brand span{color:var(--red)}
.acts{display:flex;gap:8px}
.ic{width:42px;height:42px;border:0;border-radius:12px;background:#f3f4f6;color:#24272d;display:grid;place-items:center;cursor:pointer;position:relative}
.ic svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
main{width:100%;max-width:720px;margin:auto;padding:0 12px 92px}
@media(max-width:420px){main{padding-left:10px;padding-right:10px}}
.sec{margin-top:14px}.st{display:flex;justify-content:space-between;align-items:center;margin:0 2px 8px}.st h2{font-size:17px;letter-spacing:-.25px}
.lk{border:0;background:none;color:var(--red);font-size:13px;font-weight:700;cursor:pointer}
.loc{display:flex;align-items:center;gap:8px;padding:8px 2px 7px}
.pin{width:32px;height:32px;border-radius:10px;background:#fff0f1;color:var(--red);display:grid;place-items:center}.pin svg{width:19px}
.loc small{display:block;color:var(--mu);font-size:11px}.loc b{font-size:13px}
.srch{height:44px;border-radius:14px;background:#fff;border:1px solid var(--ln);display:flex;align-items:center;gap:10px;padding:0 14px;color:#9a9ea5;cursor:pointer;box-shadow:0 4px 16px rgba(20,24,30,.035)}
.srch svg{width:20px;stroke:#3f434a}.srch input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px}.srch input::placeholder{color:#9a9ea5}
.promo{margin-top:9px;aspect-ratio:2.05/1;border-radius:18px;overflow:hidden;position:relative;background:#f2f3f5;box-shadow:var(--sh);padding:0}.promo img{display:block;width:100%;height:100%;object-fit:cover}
.promo small{font-size:11px;font-weight:700;opacity:.9}.promo strong{font-size:24px;line-height:1.1;margin:4px 0}.promo span{font-size:12px}
.cats{display:flex;gap:9px;overflow-x:auto;padding:1px 2px 3px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 58px;text-align:center;border:0;background:none;padding:0;cursor:pointer;color:#3a3d42}
.cat i{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:auto;border:1px solid var(--ln);box-shadow:0 4px 12px rgba(20,24,30,.04)}
.cat svg{width:22px;stroke:var(--red)}.cat b{display:block;font-size:9.5px;margin-top:4px;white-space:nowrap}
.list{display:flex;flex-direction:column;gap:7px}
.sc{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:8px;display:flex;gap:9px;align-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(20,24,30,.035);transition:transform .15s}
.sc:active{transform:scale(.992)}
.ph{width:78px;height:78px;border-radius:13px;object-fit:cover;background:#f0f1f2;flex:none;display:grid;place-items:center;color:#c3c6cb;font-size:30px;font-weight:800;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
@media(max-width:420px){.ph{width:72px;height:72px}}
.si{min-width:0;flex:1}.sn{font-size:15px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{display:flex;flex-wrap:wrap;gap:5px;color:var(--mu);font-size:10.5px;margin-top:4px}
.pill{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;color:#0a9660;background:var(--gs);padding:3px 6px;border-radius:999px;margin-top:5px}.pill.off{color:#777;background:#f1f1f2}
.cover{position:relative;height:195px;margin:0 -12px;background:#ddd;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.38),transparent 40%,rgba(0,0,0,.1))}
.cover .ca{position:absolute;top:12px;left:14px;right:14px;z-index:2;display:flex;justify-content:space-between}
@media(max-width:420px){.cover{height:178px;margin:0 -10px}}
.intro{background:#fff;border-radius:20px 20px 0 0;margin:-18px -12px 0;position:relative;z-index:3;padding:14px 12px 9px}
@media(max-width:420px){.intro{margin:-18px -10px 0}}
.intro h1{font-size:21px;font-weight:800;line-height:1.15}.intro p{display:flex;gap:8px;flex-wrap:wrap;color:var(--mu);font-size:11px;margin-top:5px}
.mi{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--ln);min-width:0;background:#fff;margin:0 -12px;padding-left:12px;padding-right:12px}
.mi .ph{width:72px;height:66px}
.mc{min-width:0;flex:1}.mc b{display:block;font-size:14px}.mc p{font-size:10px;color:var(--mu);margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:800;font-size:14px}
.plus{width:36px;height:36px;border:0;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;align-self:center;cursor:pointer;box-shadow:0 5px 12px rgba(239,51,64,.2);flex:none}
.plus:disabled{background:#c9ccd1;box-shadow:none}.plus svg{width:19px;stroke:#fff}
.fcart{position:fixed;left:50%;bottom:calc(62px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(680px,calc(100% - 20px));z-index:260;background:var(--red);color:#fff;border-radius:15px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(239,51,64,.25);cursor:pointer}
.fcart b{font-size:14px}.fcart span{font-size:12px}
.pt{display:flex;align-items:center;gap:8px;padding:7px 0 10px}.pt h1{font-size:20px}
.back{width:38px;height:38px;border:0;border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer}.back svg{width:20px}
.ci{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--ln)}.ci .ph{width:62px;height:56px;border-radius:12px}
.qty{display:flex;align-items:center;gap:8px;margin-top:5px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:16px}.qty strong{min-width:18px;text-align:center}
.sum{background:#fff;border-radius:16px;padding:11px 12px;margin-top:10px;border:1px solid var(--ln)}
.sr{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.tot{display:flex;justify-content:space-between;padding-top:8px;margin-top:6px;border-top:1px solid var(--ln);font-size:17px;font-weight:800}
.prim{width:100%;min-height:48px;border:0;border-radius:15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 8px 18px rgba(239,51,64,.18);margin-top:10px}
.prim:disabled{opacity:.5}
.oc{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:15px;cursor:pointer}
.oh{display:flex;justify-content:space-between;gap:8px}.on{font-weight:800;font-size:16px}
.sp{font-size:10px;font-weight:800;background:#f2f3f5;padding:6px 8px;border-radius:999px;height:fit-content}
.oc p{margin:6px 0;color:var(--mu);font-size:12px}
.pl{background:#fff;border-radius:18px;border:1px solid var(--ln);overflow:hidden;margin-top:6px}
.pw{display:flex;align-items:center;gap:12px;width:100%;padding:15px;border:0;border-bottom:1px solid var(--ln);background:#fff;text-align:left;cursor:pointer;color:var(--ink)}
.pw:last-child{border-bottom:0}.pw .i{width:38px;height:38px;border-radius:12px;background:#f5f5f6;display:grid;place-items:center}.pw svg{width:19px}.pw b{font-size:14px}
.pf{display:flex;align-items:center;gap:13px;padding:18px 0 20px}.av{width:70px;height:70px;border-radius:23px;background:#e9eaec;display:grid;place-items:center;font-size:26px;font-weight:800;color:#9a9ea5}
.pf h1{font-size:21px}.pf p{margin:3px 0;color:var(--mu);font-size:12px}
.acc{display:inline-flex;background:var(--gs);color:#0b9660;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;margin-top:5px}
.in{width:100%;height:52px;border:1px solid var(--ln);border-radius:16px;background:#fff;padding:0 15px;outline:none;margin-bottom:10px}
.in:focus{border-color:var(--red)}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:13px;margin-top:12px}
.ta{width:100%;min-height:86px;border:1px solid var(--ln);border-radius:16px;background:#fff;padding:13px 15px;outline:none;resize:vertical;margin-top:10px}
.ta:focus{border-color:var(--red)}
.statusflow{display:flex;gap:7px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.statusflow::-webkit-scrollbar{display:none}.statusflow span{flex:none;padding:6px 9px;border-radius:99px;background:#f1f2f4;color:#777;font-size:10px;font-weight:700}.statusflow span.on{background:var(--gs);color:#0a9660}

.qg-order-list-card{padding:12px 12px 11px;border-radius:18px;box-shadow:0 7px 22px rgba(30,24,27,.045)}
.qg-order-list-card .oh{align-items:flex-start}
.qg-order-list-number{font-size:22px!important;letter-spacing:.2px;color:#17191d}
.qg-order-list-status{flex:none;max-width:48%;padding:7px 10px;border-radius:999px;background:#fff0f3;color:var(--red);font-size:9px;font-weight:900;line-height:1.25;text-align:center}
.qg-order-list-status.done{background:#eafaf3;color:#0a9660}
.qg-order-list-status.cancelled{background:#f0f1f3;color:#747981}
.qg-order-list-meta{margin:8px 0 0!important;color:#7f848c!important;font-size:11px!important}
.qg-order-list-date{margin-top:5px!important;color:#9a9ea5!important}
.qg-order-list-progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-top:9px}
.qg-order-list-step{position:relative;min-width:0;padding-top:17px;text-align:center;color:#aaa4a8;font-size:7px;font-weight:800;line-height:1.2}
.qg-order-list-step:before{content:"";position:absolute;top:2px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#dcd8da;border:2px solid #fff;box-shadow:0 0 0 1px #e5e0e2;z-index:2}
.qg-order-list-step:after{content:"";position:absolute;left:-50%;right:50%;top:6px;height:2px;background:#e7e3e5;z-index:1}
.qg-order-list-step:first-child:after{display:none}
.qg-order-list-step.done{color:#25815a}
.qg-order-list-step.done:before{background:#22a56c;box-shadow:0 0 0 1px rgba(34,165,108,.18)}
.qg-order-list-step.done:after{background:#22a56c}
.qg-order-list-step.current{color:var(--red)}
.qg-order-list-step.current:before{background:var(--red);box-shadow:0 0 0 4px rgba(239,51,64,.10)}
.qg-order-list-step.current:after{background:#22a56c}
.qg-order-list-total{display:block;margin-top:8px;font-size:17px;font-weight:900}
@media(max-width:420px){.qg-order-list-card{padding:15px}.qg-order-list-number{font-size:20px!important}.qg-order-list-status{max-width:52%}.qg-order-list-step{font-size:6.5px}}

/* Customer order detail — mobile-first hierarchy, presentation only */
.qg-order-page{padding-bottom:10px}
.qg-order-page .pt{padding:3px 0 8px}
.qg-order-page .pt h1{font-size:19px;letter-spacing:-.2px}
.qg-order-page .back{border:1px solid #ececef;box-shadow:0 4px 14px rgba(28,30,35,.05)}
.qg-order-hero{position:relative;overflow:hidden;margin-top:0;padding:14px;border:0;border-radius:20px;background:linear-gradient(145deg,#fff 0%,#fff7f8 62%,#fff0f2 100%);box-shadow:0 12px 34px rgba(30,24,27,.08)}
.qg-order-hero:after{content:"";position:absolute;width:150px;height:150px;right:-55px;top:-70px;border-radius:50%;background:rgba(230,0,45,.07)}
.qg-order-hero-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.qg-order-kicker{display:block;color:#8d8589;font-size:10px;font-weight:800;letter-spacing:.2px}
.qg-order-status{display:block;margin-top:3px;color:#17191d;font-size:20px;line-height:1.18;font-weight:1000;letter-spacing:-.45px}
.qg-order-time{flex:none;padding:6px 9px;border-radius:999px;background:#fff;color:#8a8387;font-size:9px;font-weight:800;border:1px solid #eee8ea}
.qg-order-progress{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:11px}
.qg-order-step{position:relative;text-align:center;color:#aaa3a7;font-size:7px;font-weight:800;padding-top:17px;line-height:1.25}
.qg-order-step:before{content:"";position:absolute;left:50%;top:4px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#dedadd;border:3px solid #fff;box-shadow:0 0 0 1px #e5dfe2;z-index:2}
.qg-order-step:after{content:"";position:absolute;left:-50%;right:50%;top:9px;height:2px;background:#e8e4e6;z-index:1}
.qg-order-step:first-child:after{display:none}
.qg-order-step.on{color:#2b2729}
.qg-order-step.on:before{background:var(--red);box-shadow:0 0 0 1px rgba(230,0,45,.18)}
.qg-order-step.on:after{background:var(--red)}
.qg-order-place{position:relative;z-index:1;margin-top:10px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.9);border:1px solid #f0e8eb}
.qg-order-place small{display:block;color:#91898d;font-size:9px;font-weight:800}
.qg-order-place b{display:block;margin-top:4px;font-size:13px;line-height:1.45}
.qg-order-place span{display:block;margin-top:5px;color:#716a6e;font-size:10px;line-height:1.45}
.qg-order-hero-actions{position:relative;z-index:1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qg-order-hero-actions .lk{margin:0;min-height:38px;padding:0 12px;border-radius:12px;background:#fff;border:1px solid #eadfe2;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font-size:10px;font-weight:900}
.qg-order-hero-actions .qg-danger{color:#9b1c31}
.qg-order-card{margin-top:8px;border-radius:18px;padding:12px;border:1px solid #ece7e9;background:#fff;box-shadow:0 7px 24px rgba(31,24,27,.045)}
.qg-order-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:7px}
.qg-order-section-head b{font-size:16px;letter-spacing:-.15px}
.qg-order-section-head small{color:#91898d;font-size:9px;font-weight:800}
.qg-order-rider{display:flex;align-items:center;gap:12px}
.qg-order-rider-photo,.qg-order-rider-fallback{width:46px;height:46px;flex:0 0 46px;border-radius:14px;object-fit:cover;background:#fff0f3}
.qg-order-rider-fallback{display:grid;place-items:center;color:var(--red);font-size:19px;font-weight:1000}
.qg-order-rider-copy{min-width:0;flex:1}
.qg-order-rider-copy b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qg-order-rider-copy span{display:block;margin-top:3px;color:#898185;font-size:10px}
.qg-order-rider-actions{display:flex;gap:6px;margin-top:8px}
.qg-order-rider-actions .lk{flex:1;margin:0;min-height:42px;border:1px solid #eadfe2;border-radius:13px;background:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:10px;font-weight:900}
.qg-order-rider-actions .qg-chat{background:var(--red);border-color:var(--red);color:#fff}
.qg-order-map-card{padding:10px}
.qg-order-map-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 7px}
.qg-order-map-head b{font-size:16px}
.qg-live-dot{display:inline-flex;align-items:center;gap:6px;color:#6f686c;font-size:9px;font-weight:800}
.qg-live-dot:before{content:"";width:7px;height:7px;border-radius:50%;background:#20b46d;box-shadow:0 0 0 4px rgba(32,180,109,.1)}
.qg-order-map{height:178px!important;margin-top:0;border-radius:15px;border:0;box-shadow:inset 0 0 0 1px #ece7e9}
.qg-order-location-status{display:flex;align-items:center;gap:6px;margin:7px 2px 0!important;color:#81797d!important;font-size:9px!important;line-height:1.4}
.qg-order-location-status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex:none}
.qg-order-items{padding:5px 0 0}
.qg-order-item-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1edef}
.qg-order-item-row:last-child{border-bottom:0}
.qg-order-item-copy{min-width:0}
.qg-order-item-copy b{display:block;font-size:12px;line-height:1.4}
.qg-order-item-copy small{display:block;margin-top:2px;color:#938b8f;font-size:9px}
.qg-order-item-price{white-space:nowrap;font-size:12px;font-weight:850}
.qg-order-summary{margin-top:7px;padding-top:6px;border-top:1px solid #eee8ea}
.qg-order-summary-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;color:#5f585c;font-size:11px}
.qg-order-saving{margin:7px 0 0;padding:8px 10px;border-radius:12px;background:#effaf5;color:#178456;font-size:9px;font-weight:800}
.qg-order-total{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-top:6px;padding-top:8px;border-top:1px solid #eee8ea}
.qg-order-total span{font-size:13px;font-weight:900}
.qg-order-total strong{color:#17191d;font-size:22px;line-height:1;font-weight:1000}
@media(max-width:420px){.qg-order-hero{padding:12px}.qg-order-status{font-size:19px}.qg-order-step{font-size:6.5px}.qg-order-map{height:160px!important}.qg-order-rider-actions{gap:5px}}

/* Customer review — direct gold star rating */
#customer-review{padding:12px}
#customer-review>h2{margin:0 0 10px;font-size:18px;letter-spacing:-.2px}
.qg-review-form{display:grid;gap:10px}
.qg-review-rating{display:grid;grid-template-columns:88px 1fr;gap:3px 7px;align-items:center}
.qg-review-rating-label{font-size:11px;font-weight:850;color:#242126}
.qg-star-rating{display:flex;align-items:center;gap:3px}
.qg-star-rating button{width:32px;height:32px;padding:0;border:0;background:transparent;color:#d9dde3;font-size:27px;line-height:1;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s ease,color .08s ease}
.qg-star-rating button.on{color:#f4b400}
.qg-star-rating button:active{transform:scale(.9)}
.qg-star-rating button:focus-visible{outline:2px solid #f4b400;outline-offset:2px;border-radius:8px}
.qg-review-rating-note{grid-column:2;min-height:12px;color:#8e878b;font-size:8.5px;font-weight:700}
.qg-review-form .ta{min-height:72px;border-radius:15px;margin-top:0}
.qg-review-form .prim{min-height:48px;border-radius:15px;font-weight:900;margin-top:0}
.qg-review-delete{margin-top:10px!important;color:#8a8387!important}
.qg-review-summary{display:grid;gap:8px}
.qg-review-read-row{display:grid;grid-template-columns:88px 1fr;gap:8px;align-items:center;padding:2px 0}
.qg-review-read-row>span{font-size:11px;font-weight:850;color:#242126}
.qg-review-read-row>div{display:flex;align-items:center;gap:7px;min-width:0}
.qg-review-read-row small{color:#8e878b;font-size:8.5px;font-weight:700}
.qg-review-read-stars{display:inline-flex;gap:2px;line-height:1}
.qg-review-read-stars span{font-size:23px;color:#d9dde3}
.qg-review-read-stars span.on{color:#f4b400}

<script>
'use strict';
/* ===== 1) Connection (same Supabase project and endpoints as the old app) ===== */
const CFG={URL:'https://pkypiqhlrmzocysgeqew.supabase.co',KEY:'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'};
const hdr=t=>{const h={apikey:CFG.KEY,'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;return h};
async function auth(path,body){
  const r=await fetch(CFG.URL+'/auth/v1/'+path,{method:'POST',headers:hdr(),body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const d=await r.json().catch(e=>{if(e?.name==='AbortError'||e?.name==='TimeoutError')throw e;return {}});
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'AUTH_ERROR');
  return d;
}
async function db(path,o={}){
  const m=(o.method||'GET').toUpperCase(),h=hdr(o.token===undefined?await token():o.token);
  if(m!=='GET')h.Prefer='return=representation';
  const r=await fetch(CFG.URL+'/rest/v1/'+path,{method:m,headers:h,body:o.body?JSON.stringify(o.body):undefined,signal:AbortSignal.timeout(15000)});
  const d=await r.json().catch(e=>{if(e?.name==='AbortError'||e?.name==='TimeoutError')throw e;return null});
  if(!r.ok){const error=new Error((d&&(d.message||d.hint))||'DB_ERROR_'+r.status);error.status=r.status;throw error;}
  return d;
}
/* ===== 2) Session (same storage key and fields, so existing logins keep working) ===== */
const SKEY='qg_customer_session_v1';
const S={get(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}},
  set(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}},
  clear(){try{localStorage.removeItem(SKEY)}catch(e){}}};
let refreshing=null;
async function token(force){
  const s=S.get();if(!s||!s.accessToken)return '';
  if(!(force||(s.expiresAt&&s.expiresAt-Date.now()<60000))||!s.refreshToken)return s.accessToken;
  refreshing=refreshing||(async()=>{
    try{
      const d=await auth('token?grant_type=refresh_token',{refresh_token:s.refreshToken});
      if(S.get()?.authUserId!==s.authUserId||S.get()?.refreshToken!==s.refreshToken)return '';
      const n={...s,accessToken:d.access_token,refreshToken:d.refresh_token||s.refreshToken,expiresAt:Date.now()+(d.expires_in||3600)*1000};
      S.set(n);return n.accessToken;
    }catch(e){return S.get()?.authUserId===s.authUserId&&S.get()?.refreshToken===s.refreshToken?s.accessToken:''}finally{refreshing=null}
  })();
  return refreshing;
}
const emailOf=p=>String(p||'').replace(/\D/g,'')+'@auth.queuetech.local';
async function login(v,pw){
  const guestCart=cart,guestMarketCart=marketCart;
  const d=await auth('token?grant_type=password',{email:v.includes('@')?v:emailOf(v),password:pw});
  const rows=await db('users?select=*&auth_user_id=eq.'+d.user.id,{token:d.access_token});
  const me=Array.isArray(rows)&&rows[0]||null;
  if(!me||me.role!=='customer')throw new Error('ไม่พบบัญชีลูกค้าที่ใช้งานได้ กรุณาใช้แอปตามประเภทบัญชีหรือติดต่อฝ่ายช่วยเหลือ');
  if(me.status!=='active')throw new Error('บัญชีนี้ยังไม่พร้อมใช้งาน กรุณาติดต่อฝ่ายช่วยเหลือ');
  S.set({role:'customer',userId:me.id,authUserId:d.user.id,name:me?.name||'',phone:me?.phone||'',email:me.email||d.user.email||'',photo:me.metadata?.profileImage||me.metadata?.profile_image||me.metadata?.avatarUrl||'',
    accessToken:d.access_token,refreshToken:d.refresh_token,expiresAt:Date.now()+(d.expires_in||3600)*1000});
  cart=readCart();if(guestCart.items.length){if(!cart.items.length)cart=guestCart;else if(cart.shopId===guestCart.shopId){for(const item of guestCart.items){const mine=cart.items.find(x=>x.id===item.id);if(mine)mine.qty=Math.min(99,mine.qty+item.qty);else cart.items.push(item)}}else toast('มีตะกร้าคนละร้าน สินค้าก่อนเข้าสู่ระบบยังเก็บไว้');saveCart();if(cart.shopId===guestCart.shopId)localStorage.removeItem('qt_cart_guest')}marketCart=readMarketCart();if(!marketCart.items.length&&guestMarketCart.items.length){marketCart=guestMarketCart;saveMarketCart();localStorage.removeItem('qg_market_cart_guest')}
}
async function register({name,phone,email,password,lat,lng}){
  QueueGoPasswordPolicy.requireStrong(password);
  await auth('signup',{email:email||emailOf(phone),password,data:{name,phone,role:'customer',latitude:lat,longitude:lng}});
  await login(email||phone,password);
}

function marketCategoryKey(raw,name){
  const s=(String(raw||'')+' '+String(name||'')).toLocaleLowerCase('th');
  if(/seafood|fish|ปลา|กุ้ง|ปู|หมึก|หอย/.test(s))return 'seafood';
  if(/meat|pork|chicken|beef|หมู|ไก่|เป็ด|เนื้อ|เครื่องใน/.test(s))return 'meat';
  if(/vegetable|veg|ผัก|เห็ด|หน่อไม้/.test(s))return 'vegetable';
  if(/fruit|ผลไม้/.test(s))return 'fruit';
  if(/egg|tofu|ไข่|เต้าหู้/.test(s))return 'egg_tofu_fresh';
  if(/season|herb|spice|เครื่องปรุง|สมุนไพร|กระเทียม|พริก|หอม|ข่า|ตะไคร้|น้ำปลา|เครื่องแกง/.test(s))return 'seasoning_herb';
  if(/rice|dry|grain|ข้าว|ของแห้ง|ธัญพืช|ถั่ว|เส้น/.test(s))return 'rice_dry';
  if(/processed|ready.?to.?cook|ลูกชิ้น|ไส้กรอก|หมัก|แช่แข็ง|พร้อมปรุง/.test(s))return 'processed_ready_to_cook';
  if(/prepared|ready.?to.?eat|กับข้าว|น้ำพริก|ของทอด|พร้อมทาน/.test(s))return 'prepared_food';
  if(/dessert|bakery|ขนม|ของหวาน/.test(s))return 'dessert';
  if(/local|community|พื้นบ้าน|ชุมชน/.test(s))return 'local';
  return 'other_market';
}

function readCart(){

  try{const saved=JSON.parse(localStorage.getItem(cartKey())||'null');if(!saved||typeof saved.shopId!=='string'||!saved.shopId||!Array.isArray(saved.items))return empty();
    const items=saved.items.filter(i=>i&&typeof i.id==='string'&&i.id&&Number.isInteger(i.qty)&&i.qty>0&&i.qty<=99&&typeof i.price==='number'&&Number.isFinite(i.price)&&i.price>=0).map(i=>({id:i.id,name:typeof i.name==='string'?i.name:'สินค้า',price:i.price,image:typeof i.image==='string'?i.image:'',qty:i.qty}));
    return items.length?{shopId:saved.shopId,items,...(typeof saved.note==='string'?{note:saved.note.slice(0,500)}:{})}:empty();
  }catch(e){return empty()}
}

function cartTotal(){
  const values=cart.items.map(item=>{const m=String(item.price).match(/^(\d+)(?:\.(\d+))?(?:e([+-]?\d+))?$/i);if(!m||!Number.isInteger(item.qty)||item.qty<1)return null;const digits=(m[2]||''),scale=digits.length-Number(m[3]||0);return {units:BigInt(m[1]+digits),scale,qty:BigInt(item.qty)}});
  if(values.some(v=>!v))return NaN;
  const scale=Math.max(2,...values.map(v=>v.scale)),divisor=10n**BigInt(scale-2);
  const total=values.reduce((sum,v)=>sum+v.units*10n**BigInt(scale-v.scale)*v.qty,0n);
  return Number((total+divisor/2n)/divisor)/100;
}

function readMarketCart(){
  const empty=()=>({marketId:null,marketName:'',items:[]});
  try{
    const v=JSON.parse(localStorage.getItem(marketCartKey())||'null');
    if(!v||!Array.isArray(v.items))return empty();
    const items=v.items.filter(i=>i&&i.productId&&i.shopId&&Number.isInteger(i.qty)&&i.qty>0&&i.qty<=99&&Number.isFinite(Number(i.price))&&Number(i.price)>=0)
      .map(i=>({productId:String(i.productId),shopId:String(i.shopId),name:String(i.name||'สินค้า'),shopName:String(i.shopName||'ร้านค้า'),price:Number(i.price),unit:String(i.unit||''),image:String(i.image||''),qty:i.qty,availablePacks:Math.max(1,Number(i.availablePacks||99))}));
    return items.length?{marketId:String(v.marketId||''),marketName:String(v.marketName||''),items}:empty();
  }catch(e){return empty()}
}

  marketRuleRows=Array.isArray(rows)?rows:[];
  return marketRuleRows;

function marketRule(key,fallback,rows=marketRuleRows||[]){
  const now=Date.now();
  const row=rows.filter(r=>r.rule_key===key&&new Date(r.effective_from).getTime()<=now)
    .sort((a,b)=>new Date(b.effective_from)-new Date(a.effective_from)||new Date(b.created_at)-new Date(a.created_at))[0];
  if(!row)return fallback;
  if(typeof fallback==='boolean')return row.value===true||row.value==='true';
  const n=Number(row.value);return Number.isFinite(n)?n:fallback;
}
function marketMultiFee(shopCount){
  if(shopCount<=1)return 0;
  const second=marketRule('pricing.market_second_shop_fee',10),more=marketRule('pricing.market_additional_shop_fee',5);
  return second+Math.max(0,shopCount-2)*more;
}
function marketDeliveryEstimate(distanceKm){
  const base=marketRule('pricing.market_base_fee',30),step=marketRule('pricing.market_distance_step_fee',10);
  return base+Math.max(0,Math.ceil(Number(distanceKm||0)-5))*step;
}
async function loadActiveMarketTrip(){
  const u=S.get();if(!u)return null;

  const parent=(parents||[]).find(x=>!['COMPLETED','CANCELLED'].includes(String(x.status||'').toUpperCase()));
  if(!parent)return null;
  const subs=await db('orders?select=shop_id,rider_id,status&market_order_id=eq.'+encodeURIComponent(parent.id)).catch(()=>[]);
  return {...parent,locked:['IN_PROGRESS','COMPLETED','CANCELLED'].includes(String(parent.status||'').toUpperCase()),shopIds:new Set((subs||[]).filter(o=>o.status!=='cancelled').map(o=>String(o.shop_id))),riderId:(subs||[]).find(o=>o.rider_id)?.rider_id||null};
}
function marketAdd(productId){
  const p=(marketCatalog||[]).find(x=>String(x.product_id)===String(productId));if(!p)return toast('ไม่พบสินค้า');
  const active=window.__activeMarketTrip||null;
  if(active?.locked)return toast('Rider ออกจากตลาดแล้ว ไม่สามารถเพิ่มร้านได้');
  const targetMarket=String(active?.market_id||marketCart.marketId||p.market_id||'');
  if(String(p.market_id)!==targetMarket)return toast('ตะกร้าตลาดสดซื้อข้ามตลาดไม่ได้');
  if(active?.shopIds?.has(String(p.shop_id)))return toast('ร้านนี้อยู่ใน Market Trip แล้ว');
  const shops=new Set([...marketCartShopIds(),...(active?.shopIds||[])]);
  if(shops.size>0&&!shops.has(String(p.shop_id))&&!marketRule('feature.market_multi_shop',true))return toast('ตลาดหลายร้านถูกปิดชั่วคราว');
  if(!marketCart.marketId){marketCart.marketId=String(p.market_id);marketCart.marketName=String(p.market_name||'ตลาดสด')}
  const item=marketCart.items.find(i=>i.productId===String(p.product_id));
  const max=Math.max(1,Math.min(99,Math.floor(Number(p.available_packs||99))));
  if(item){if(item.qty>=max)return toast('จำนวนเกินสต็อกที่พร้อมขาย');item.qty++}
  else marketCart.items.push({productId:String(p.product_id),shopId:String(p.shop_id),name:String(p.name||'สินค้า'),shopName:String(p.shop_name||'ร้านค้า'),price:Number(p.price||0),unit:String(p.unit||''),image:String(p.image||''),qty:1,availablePacks:max});
  saveMarketCart();toast('เพิ่มลงตะกร้าตลาดสดแล้ว');route(true);
}
function marketChg(productId,delta){
  const i=marketCart.items.findIndex(x=>x.productId===String(productId));if(i<0)return;
  const item=marketCart.items[i],next=item.qty+delta;
  if(next<=0)marketCart.items.splice(i,1);
  else if(next<=Math.min(99,item.availablePacks||99))item.qty=next;
  if(!marketCart.items.length){marketCart.marketId=null;marketCart.marketName=''}
  saveMarketCart();route(true);

function deliveryFeeFor(shop,loc){
  const radians=n=>n*Math.PI/180,a=Math.sin(radians(loc.lat-Number(shop.latitude))/2)**2+Math.cos(radians(Number(shop.latitude)))*Math.cos(radians(loc.lat))*Math.sin(radians(loc.lng-Number(shop.longitude))/2)**2;
  const km=6371*2*Math.asin(Math.sqrt(Math.min(1,Math.max(0,a))));
  if(!Number.isFinite(km))throw Error('ไม่พบพิกัดร้าน กรุณาเลือกร้านใหม่');
  return km<=5?30:km<=6?40:km<=7?50:50+Math.ceil(km-7)*10;
}

function qgIsValidCoordinate(latitude,longitude,thailandOnly=false){
  if(latitude===null||latitude===undefined||longitude===null||longitude===undefined||latitude===''||longitude==='') return false;
  const lat=Number(latitude),lng=Number(longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)||(lat===0&&lng===0)||lat < -90||lat > 90||lng < -180||lng > 180) return false;
  return !thailandOnly || (lat>=5&&lat<=21&&lng>=97&&lng<=106);
}
function calculateDistanceKm(customerLat,customerLng,shopLat,shopLng){
  if(!qgIsValidCoordinate(customerLat,customerLng,true)||!qgIsValidCoordinate(shopLat,shopLng,true))return NaN;
  const lat1=Number(customerLat),lon1=Number(customerLng),lat2=Number(shopLat),lon2=Number(shopLng),R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function saveCustomerLocationPicker(){
  const p=window.__customerPickedLocation?.();if(!p)return toast('กรุณาเลือกตำแหน่ง');
  const field=$('customer-address-input'),address=field?.value.trim()||'',u=S.get(),sameActor=()=>S.get()?.userId===u?.userId&&S.get()?.authUserId===u?.authUserId;
  if(!qgIsValidCoordinate(p.lat,p.lng,true))return toast('พิกัดไม่ถูกต้อง');
  try{
    if(u?.userId){
      const accessToken=await token();if(!sameActor()||!field.isConnected)return;
      const rows=await db('users?select=metadata&id=eq.'+encodeURIComponent(u.userId)+'&limit=1',{token:accessToken});if(!sameActor()||!field.isConnected)return;
      const metadata={...((rows?.[0]?.metadata&&typeof rows[0].metadata==='object')?rows[0].metadata:{}),lat:Number(p.lat),lng:Number(p.lng),address};
      await db('users?id=eq.'+encodeURIComponent(u.userId),{method:'PATCH',token:accessToken,body:{metadata,updated_at:new Date().toISOString()}});
    }
    if(!sameActor()||!field.isConnected)return;
    try{localStorage.setItem('qg_customer_delivery_location',JSON.stringify({lat:p.lat,lng:p.lng,address}))}catch(e){console.warn('customer location local cache failed',e)}
    currentPos={lat:p.lat,lng:p.lng,address};toast('บันทึกที่อยู่จัดส่งแล้ว');
    try{go('home')}catch(e){console.warn('customer location post-commit navigation failed',e)}
  }catch(e){toast('บันทึกที่อยู่ไม่สำเร็จ: '+String(e.message||e).slice(0,90))}
}
try{const saved=JSON.parse(localStorage.getItem('qg_customer_delivery_location')||'null');if(saved&&qgIsValidCoordinate(saved.lat,saved.lng,true))currentPos=saved}catch(e){}
/* ===== 5) Layout ===== */
const authed=()=>!!S.get();
function layout(inner,tab){
  customerLocationPicker?.destroy();checkoutPicker?.destroy();customerLocationPicker=checkoutPicker=null;
  window.__customerPickedLocation=window.__checkoutQuote=null;
  const u=S.get(),home=tab==='home';
  $('root').innerHTML=`<header class="top${home?' qg-home-original-top':''}"><div><button class="brand" onclick="go('home')">Queue<span>Go</span></button>
<div class="acts">${u?`<button class="ic" aria-label="ตะกร้า" onclick="go('cart')">${ico('bag')}${cartN()?`<b class="badge">${cartN()>99?'99+':cartN()}</b>`:''}</button>
<button class="ic" aria-label="แจ้งเตือน" onclick="go('notifications')">${ico('bell')}<b id="customer-notification-count" hidden></b></button><button class="ic" aria-label="โปรไฟล์" onclick="go('profile')">${ico('user')}</button>`:'<button class="lk" onclick="go(\'login\')">เข้าสู่ระบบ</button>'}</div></div></header>
<main class="${home?'qg-home-original-main':''}">${inner}</main>${nav(tab)}`;
}
const nav=t=>`<nav class="nav ${t==='home'?'qg-home-original-nav':''}">${[['home','home','หน้าหลัก'],['search','search','ค้นหา'],['cart','bag','ตะกร้า'],['orders','orders','ออเดอร์']].map(([k,i,l])=>
  `<a href="#${k}" class="${t===k?'on':''}"><div class="ni">${ico(i)}${k==='cart'&&cartN()?`<b class="badge" style="top:-5px;right:-8px">${cartN()}</b>`:''}</div>${l}</a>`).join('')}</nav>`;
const go=h=>{location.hash=h};
function openPublicShop(id,category){
  if(String(category||'').toLowerCase()==='laundry'){location.href='laundry/';return}
  go('shop/'+id);
}
const shopCard=s=>`<div class="sc" onclick="openPublicShop('${esc(s.id)}','${esc(s.public_category||'')}')">${photo(s.public_logo||s.public_cover,s.shop_name)}
<div class="si"><div class="sn">${esc(s.shop_name||'ร้านค้า')}</div>
<div class="sm"><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.public_open_time?`<span>${esc(s.public_open_time)}–${esc(s.public_close_time||'')}</span>`:''}</div>
<span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div></div>`;

V.home=async(_,ticket=routeVersion)=>{
  const u=S.get(),raw=await loadShops();
  const list=raw.slice().sort((a,b)=>{
    if(!currentPos)return 0;
    const da=calculateDistanceKm(currentPos.lat,currentPos.lng,a.latitude,a.longitude),dbb=calculateDistanceKm(currentPos.lat,currentPos.lng,b.latitude,b.longitude);
    return (Number.isFinite(da)?da:1e9)-(Number.isFinite(dbb)?dbb:1e9);
  });
  if(ticket!==routeVersion)return;
  const normal=list.filter(s=>{
    const category=String(s.public_category||'').toLowerCase();
    return category!=='grocery'&&!DEDICATED_MARKET_CATS.has(category);
  });
  layout(`<div class="loc" onclick="go('map')" style="cursor:pointer"><div class="pin">${ico('pin')}</div><div><small>ส่งไปที่</small><b>${esc(currentPos?.address||'เลือกที่อยู่จัดส่ง')}</b></div></div>

function globalShopSearch(value){
  q=String(value||'');
  const term=q.trim().toLocaleLowerCase('th');
  let count=0;
  document.querySelectorAll('#global-shop-list .sc').forEach(card=>{
    const hit=!term||String(card.dataset.qgSearch||'').includes(term);
    card.hidden=!hit;
    if(hit)count++;
  });
  const counter=$('global-search-count'),empty=$('global-search-empty');
  if(counter)counter.textContent=count+' ร้าน';
  if(empty)empty.hidden=count>0;
}
V.search=async(_,ticket=routeVersion)=>{
  const list=(await loadShops()).filter(s=>!DEDICATED_MARKET_CATS.has(String(s.public_category||'').toLowerCase()));
  if(ticket!==routeVersion)return;

  if(currentPos&&qgIsValidCoordinate(currentPos.lat,currentPos.lng,true)){
    list.sort((a,b)=>{
      const da=calculateDistanceKm(currentPos.lat,currentPos.lng,a.latitude,a.longitude);
      const dbb=calculateDistanceKm(currentPos.lat,currentPos.lng,b.latitude,b.longitude);
      return (Number.isFinite(da)?da:Infinity)-(Number.isFinite(dbb)?dbb:Infinity);
    });
  }

  layout(`<div class="pt"><button class="back" onclick="history.back()">${ico('back')}</button><h1>ค้นหา</h1></div>
    <div class="srch" style="cursor:text" onclick="$('global-search')?.focus()">
      ${ico('search')}<input id="global-search" value="${esc(q)}" placeholder="ค้นหาร้านจากทุกหมวด" autocomplete="off" oninput="globalShopSearch(this.value)">
    </div>
    <section class="sec">
      <div class="st"><div><h2>ร้านค้าทั้งหมด</h2><p class="sm" style="margin:4px 0 0">ค้นหาอาหาร เครื่องดื่ม ร้านขายของชำ และร้านค้าทั่วไปในที่เดียว</p></div><span class="sm" id="global-search-count">${list.length} ร้าน</span></div>
      <div class="list" id="global-shop-list">${list.map(s=>`<div class="sc" data-qg-search="${esc([s.shop_name,CATS[s.public_category]||'',s.public_description||'',s.address||''].join(' ').toLocaleLowerCase('th'))}" onclick="openPublicShop('${esc(s.id)}','${esc(s.public_category||'')}')">${photo(s.public_logo||s.public_cover,s.shop_name)}
        <div class="si"><div class="sn">${esc(s.shop_name||'ร้านค้า')}</div>
        <div class="sm"><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.public_open_time?`<span>${esc(s.public_open_time)}–${esc(s.public_close_time||'')}</span>`:''}</div>
        <span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div></div>`).join('')}</div>
      <p class="empty" id="global-search-empty" hidden>ไม่พบร้านที่ค้นหา</p>
    </section>`,'search');
  globalShopSearch(q);
};

V.shop=async(id,ticket=routeVersion)=>{
  const s=(await loadShops()).find(x=>String(x.id)===String(id));
  if(!s)return layout('<p class="empty">ไม่พบร้านค้า</p>','home');
  if(String(s.public_category||'').toLowerCase()==='laundry'){location.href='laundry/';return}
  if(DEDICATED_MARKET_CATS.has(String(s.public_category||'').toLowerCase()))return go('market');
  const [menu,ratings,favorites]=await Promise.all([loadMenu(id),QGCustomer.reviews(id),QGCustomer.loadFavorites()]);if(ticket!==routeVersion)return;
  const items=(menu||[]).filter(p=>p.delivery_available!==false),categories=[...new Set(items.map(p=>p.category||p.menu_category).filter(Boolean))];
  layout(`<div class="cover">${s.public_cover?`<img src="${esc(s.public_cover)}" alt="" onerror="this.remove()">`:''}
<div class="ca"><button class="ic" onclick="history.back()" aria-label="กลับ">${ico('back')}</button><button class="ic" onclick="shareShop('${esc(id)}')" aria-label="แชร์ร้าน">↗</button></div></div>
<div class="intro"><h1>${esc(s.shop_name)}</h1>${QGCustomer.favoriteButton('shop',id,favorites.some(f=>f.shop_id===id))}<p><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.address?`<span>${esc(s.address)}</span>`:''}</p>
<span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div>
<div class="menu-filters"><button class="lk" onclick="QGCustomer.filterMenu('')">ทั้งหมด</button>${categories.map(c=>`<button class="lk" data-category="${esc(c)}" onclick="QGCustomer.filterMenu(this.dataset.category)">${esc(c)}</button>`).join('')}</div><div style="margin-top:6px">${items.length?items.map(p=>`<div class="mi" data-menu-category="${esc(p.category||p.menu_category||'')}">${photo(p.image,p.name)}<div class="mc"><b>${esc(p.name)}</b><p>${esc(p.description||'')}</p><div class="pr">${baht(p.delivery_price??p.price)}</div></div>
${QGCustomer.favoriteButton('product',p.id,favorites.some(f=>f.product_id===p.id))}${p.available===false?'<span class="sm">หมด</span>':`<button class="plus" ${s.open?'':'disabled'} aria-label="เพิ่ม" onclick="add('${esc(id)}','${esc(p.id)}')">${ico('plus',19)}</button>`}</div>`).join(''):'<p class="empty">ยังไม่มีเมนู</p>'}</div>
${cart.shopId==id&&cartN()?`<div class="fcart" onclick="go('cart')"><b>ดูตะกร้า · ${cartN()} รายการ</b><span>${baht(cartTotal())}</span></div>`:''}`,'home');
  window._menu=items.filter(p=>p.available!==false);
  const reviewSection=document.createElement('section');reviewSection.className='card';reviewSection.innerHTML='<h2>รีวิวจากลูกค้า</h2>'+QGCustomer.reviewList(ratings);$('root').querySelector('main').appendChild(reviewSection);
};

    <div class="cats" style="padding:8px 0 2px">${['all',...cats].map(k=>`<button class="cat" style="flex:none;width:auto" onclick="marketSetCategory('${esc(k)}')"><b style="margin:0;padding:8px 12px;border-radius:99px;border:1px solid ${marketView.cat===k?'var(--red)':'#ddd'};background:${marketView.cat===k?'var(--red)':'#fff'};color:${marketView.cat===k?'#fff':'#333'}">${k==='all'?'ทั้งหมด':esc(MARKET_CATEGORY_LABELS[k]||'อื่นๆ')}</b></button>`).join('')}</div>
  </section>

  <section class="sec" id="market-products-section"><div class="st"><h2>สินค้าจากร้านในตลาด</h2><span class="sm">${window.__marketVisibleCatalog.length} รายการ</span></div><div id="market-results"></div></section>
  ${marketCartN()?`<div class="fcart" onclick="go('market-cart')"><b>ตะกร้าตลาดสด · ${marketCartN()} รายการ</b><span>${baht(marketCartTotal())}</span></div>`:''}`,'home');

V['market-cart']=async(_,ticket=routeVersion)=>{
  marketCart=readMarketCart();
  const [rules,shops,active]=await Promise.all([loadMarketRules(),loadMarketShops(),loadActiveMarketTrip()]);
  if(ticket!==routeVersion)return;
  window.__activeMarketTrip=active;
  if(!marketCart.items.length)return layout(`<div class="pt"><button class="back" onclick="go('market')">${ico('back')}</button><h1>ตะกร้าตลาดสด</h1></div><p class="empty">ตะกร้าตลาดสดว่าง</p><button class="prim" onclick="go('market')">เลือกสินค้าในตลาด</button>`,'cart');
  const groups=[...new Map(marketCart.items.map(i=>[i.shopId,{shopId:i.shopId,shopName:i.shopName,items:[]}])).values()];
  for(const g of groups)g.items=marketCart.items.filter(i=>i.shopId===g.shopId);
  const firstShop=shops.find(s=>String(s.shop_id)===String(groups[0]?.shopId));
  const distance=currentPos&&firstShop?calculateDistanceKm(firstShop.latitude,firstShop.longitude,currentPos.lat,currentPos.lng):NaN;
  const delivery=Number.isFinite(distance)?marketDeliveryEstimate(distance):null;
  const addMode=!!active&&String(active.market_id)===String(marketCart.marketId)&&!active.locked;
  const combinedShops=new Set([...(active?.shopIds||[]),...marketCartShopIds()]);
  const serviceFee=addMode?null:marketMultiFee(combinedShops.size);
  const blocked=active&&(active.locked||String(active.market_id)!==String(marketCart.marketId));
  layout(`<div class="pt"><button class="back" onclick="go('market')">${ico('back')}</button><h1>ตะกร้าตลาดสด</h1></div>
  <div class="card"><b>${esc(marketCart.marketName||'ตลาดสด')}</b><p class="sm" style="margin:5px 0 0">${addMode?'เพิ่มร้านใหม่เข้า Market Trip เดิม':'1 Market Trip สำหรับลูกค้าคนเดียว · ทุกร้านต้องอยู่ตลาดเดียวกัน'}</p></div>
  ${groups.map(g=>`<section class="card"><h3 style="margin-top:0">${esc(g.shopName)}</h3>${g.items.map(i=>`<div class="ci">${photo(i.image,i.name)}<div class="mc"><b>${esc(i.name)}</b><div class="pr">${baht(i.price)}${i.unit?' / '+esc(i.unit):''}</div><div class="qty"><button onclick="marketChg('${esc(i.productId)}',-1)">−</button><strong>${i.qty}</strong><button onclick="marketChg('${esc(i.productId)}',1)">+</button></div></div></div>`).join('')}</section>`).join('')}
  <div class="sum"><div class="sr"><span>ค่าสินค้า</span><span>${baht(marketCartTotal())}</span></div>
  ${addMode?'<div class="sr"><span>ค่ารับหลายร้าน</span><span>คำนวณจากราคาที่ล็อกไว้ใน Trip เดิม</span></div>':`<div class="sr"><span>ค่ารับหลายร้าน</span><span>${baht(serviceFee||0)}</span></div><div class="sr"><span>ค่ารอบ/จัดส่งโดยประมาณ</span><span>${delivery===null?'เลือกที่อยู่จัดส่ง':baht(delivery)}</span></div>`}
  </div>

  function stop(){generation++;scope='';connected=false;clearTimer();again=false;const oldClient=client,oldChannel=channel;client=channel=null;attaching=null;if(oldChannel)Promise.resolve(oldClient.removeChannel(oldChannel)).catch(()=>{});oldClient?.realtime.disconnect()}
  function loadSDK(){if(window.supabase?.createClient)return Promise.resolve();if(sdk)return sdk;sdk=new Promise((resolve,reject)=>{const script=document.createElement('script');const deadline=setTimeout(()=>finish(Error('Realtime timeout')),10000);function finish(error){clearTimeout(deadline);script.onload=script.onerror=null;if(error){script.remove();reject(error)}else resolve()}script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js';script.onload=()=>finish(window.supabase?.createClient?null:Error('Realtime unavailable'));script.onerror=()=>finish(Error('Realtime unavailable'));document.head.append(script)}).catch(e=>{sdk=null;throw e});return sdk}
  function schedule(delay=connected?60000:15000){clearTimer();const key=scope,g=generation;if(!key)return;timer=setTimeout(async()=>{timer=null;if(!valid(key,g))return;try{const accessToken=await token();if(!valid(key,g))return;if(accessToken&&client)await client.realtime.setAuth(accessToken)}catch(e){}if(!valid(key,g))return;if(!connected){refresh();attach()}schedule()},delay)}
  function refresh(){if(!scope||desired()!==scope)return;if(refreshing){again=true;return refreshing}const key=scope,g=generation;refreshing=Promise.resolve().then(()=>valid(key,g)?route(true):null).finally(()=>{refreshing=null;if(again){again=false;refresh()}});return refreshing}
  function attach(){if(attaching||channel||!scope)return attaching;const key=scope,g=generation;const work=(async()=>{await loadSDK();if(!valid(key,g))return;const accessToken=await token();if(!valid(key,g)||!accessToken)return;const next=window.supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});await next.realtime.setAuth(accessToken);if(!valid(key,g)){next.realtime.disconnect();return}client=next;const customer=S.get().userId;channel=next.channel('customer-orders:'+customer+':'+g);for(const table of ['orders','market_orders','laundry_orders'])for(const event of ['INSERT','UPDATE'])channel.on('postgres_changes',{event,schema:'public',table,filter:'customer_id=eq.'+customer},()=>{if(valid(key,g))refresh()});channel.subscribe(status=>{if(!valid(key,g))return;connected=status==='SUBSCRIBED';if(['CLOSED','CHANNEL_ERROR','TIMED_OUT'].includes(status)){const failed=channel;channel=null;Promise.resolve(next.removeChannel(failed)).catch(()=>{});next.realtime.disconnect();if(client===next)client=null}if(connected)refresh();schedule()})})().catch(()=>{if(valid(key,g))schedule()}).finally(()=>{if(attaching===work)attaching=null});attaching=work;return work}
  function sync(){const key=desired();if(key!==scope){stop();scope=key}if(!key)return;attach();if(!timer)schedule()}
  function resume(){sync();if(scope)refresh();else if(location.hash.slice(1)==='cart'&&readPendingCheckout())reconcilePendingCheckout()}
  document.addEventListener('visibilitychange',resume);addEventListener('online',resume);addEventListener('offline',sync);addEventListener('pagehide',stop);addEventListener('pageshow',resume);addEventListener('storage',event=>{if(event.key===SKEY){cart=readCart();marketCart=readMarketCart();route();resume()}else if(!checkoutBusy&&(event.key===cartKey()||event.key===pendingCheckoutKey())){cart=readCart();route()}else if(!marketCheckoutBusy&&(event.key===marketCartKey()||event.key===marketPendingKey())){marketCart=readMarketCart();route()}});
  return {sync,refresh,stop};
})();

async function route(background=false){
  const [rawPage,param]=(location.hash.slice(1)||'home').split('/');
  const pg=({'shop-view':'shop','dashboard':'profile','order-success':'order'})[rawPage]||rawPage;
  if(background&&pg==='order'&&!(await QGCustomer.needsOrderRefresh(param)))return;
  QGCustomer.leave();QGCustomer.syncNotifications();
  const ticket=++routeVersion,ok=authed();
  if(!ok&&!['home','food','cafe','grocery','market','market-cart','search','shop','cart','map','login','register','promotion'].includes(pg)){if(pg==='checkout')sessionStorage.setItem('qg_customer_after_login','checkout');return go('login')}
  if(ok&&(pg==='login'||pg==='register'))return go('home');
  if(!V[pg])return go('home');
  if(ok&&['cart','orders','order'].includes(pg)&&await reconcilePendingCheckout())return;
  customerOrdersLive.sync();
  const viewKey=(S.get()?.userId||'guest')+':'+pg+'/'+(param||'');
  if(!background&&viewKey!==lastRouteView){lastRouteView=viewKey;layout('<div class="card" role="status" aria-live="polite">กำลังโหลดข้อมูล…</div>',pg==='order'?'orders':pg==='checkout'?'cart':pg)}
  try{await V[pg](param,ticket);if(ticket===routeVersion)bind(pg)}
  catch(e){if(ticket!==routeVersion)return;layout(`<div class="card"><b>โหลดข้อมูลไม่สำเร็จ</b><p class="sm" style="margin:6px 0 12px">${esc(e.message)}</p><button class="prim" onclick="shops=null;route()">ลองอีกครั้ง</button></div>`,'')}
}
function bind(pg){
  if(pg==='login')$('lb').onclick=async e=>{const b=e.target;b.disabled=true;try{await login($('lp').value.trim(),$('lw').value);const destination=sessionStorage.getItem('qg_customer_after_login');sessionStorage.removeItem('qg_customer_after_login');go(destination==='checkout'?'checkout':'home')}catch(x){toast(x.message)}finally{b.disabled=false}};
  if(pg==='register')$('rb').onclick=async e=>{
    const b=e.target,name=$('rn').value.trim(),phone=$('rp').value.trim(),password=$('rw').value;
    const mode=$('register-mode').value,email=mode==='email'?$('register-email').value.trim():'';
    if(!name||(mode==='phone'?phone.replace(/\D/g,'').length<9:!(/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))))return toast('กรอกข้อมูลสมัครสมาชิกให้ครบ');
    if(!QueueGoPasswordPolicy.validate(password))return toast(QueueGoPasswordPolicy.MESSAGE);
    if($('rw-confirm').value!==password)return toast('ยืนยันรหัสผ่านให้ตรงกัน');
    b.disabled=true;
    try{
      const pos=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000}):no());
      await register({name,phone,email,password,lat:pos.coords.latitude,lng:pos.coords.longitude});go('home');
    }catch(x){toast(x&&x.message?x.message:'ต้องอนุญาตตำแหน่งที่ตั้งเพื่อสมัคร')}finally{b.disabled=false}
  };
}
addEventListener('hashchange',()=>route());
