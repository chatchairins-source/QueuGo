<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>QueueTech Food</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
:root{
  --bg:#f2f5f0;--card:#fff;--text:#12160f;--muted:#6d756a;--line:#e3e8e0;
  --accent:#0d3b2c;--accent2:#ff6a3d;--soft:#eaefe6;--ok:#127a41;--warn:#b8720a;--danger:#c92e2e;--star:#dd9c1c;
  --radius:20px;--shadow:0 10px 28px rgba(14,24,17,.08);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e120e;--card:#171b16;--text:#eef1ec;--muted:#9aa398;--line:#262b24;
  --accent:#5fd8a0;--accent2:#ff8f68;--soft:#1d221c;--ok:#43c17e;--warn:#e3a940;--danger:#ef6a6a;--star:#f0bd4a;
  --shadow:0 10px 28px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0e120e;--card:#171b16;--text:#eef1ec;--muted:#9aa398;--line:#262b24;
  --accent:#5fd8a0;--accent2:#ff8f68;--soft:#1d221c;--ok:#43c17e;--warn:#e3a940;--danger:#ef6a6a;--star:#f0bd4a;
  --shadow:0 10px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Thai",sans-serif}
body{min-height:100vh}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}
#app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:88px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
body{background:var(--bg)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.top-actions{display:flex;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:15px;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:18px}
main{padding:8px 16px}.view{display:none}.view.active{display:block}
.hero{padding:14px 2px 8px}.hero h1{margin:0 0 5px;font-size:30px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{margin:10px 0}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#aaa}
.btn{width:100%;padding:14px 16px;border-radius:16px;background:var(--accent);color:#fff;font-weight:750}.btn.secondary{background:var(--soft);color:var(--text)}.btn.danger{background:#fff0f0;color:var(--danger)}.btn.small{padding:10px 12px;width:auto;font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}
.badge{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}.badge.ok{background:#eaf8ef;color:var(--ok)}.badge.warn{background:#fff5df;color:#9b6500}.badge.danger{background:#fff0f0;color:var(--danger)}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.thumb{width:58px;height:58px;border-radius:17px;background:#eef0f3;object-fit:cover;flex:none}.item-main{min-width:0;flex:1}.item-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:13px}
.price{font-weight:800}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:11px;background:var(--soft)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.bottom-inner{max-width:620px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom))}
.nav{background:transparent;padding:7px 4px;color:var(--muted);font-size:11px}.nav.active{color:var(--accent);font-weight:800}.nav .ico{font-size:20px;display:block;margin-bottom:2px}
.search{display:flex;gap:8px;margin:12px 0}.search input{flex:1;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text)}
.shop-card{padding:0;overflow:hidden}.shop-cover{height:112px;background:#e9ebef;object-fit:cover;width:100%}.shop-body{padding:15px}.shop-title{font-size:18px;font-weight:800}
.product-card{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.product-card:last-child{border:0}.product-card img{width:72px;height:72px;border-radius:18px;object-fit:cover;background:#eef0f3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:50;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-width:620px;margin:auto;background:var(--card);color:var(--text);border-radius:28px 28px 0 0;padding:18px;max-height:88vh;overflow:auto}.handle{width:42px;height:5px;border-radius:10px;background:#ddd;margin:0 auto 15px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;background:#111;color:#fff;padding:12px 16px;border-radius:15px;transition:.22s;pointer-events:none;max-width:90%;font-size:13px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.kpi{padding:15px;border-radius:18px;background:var(--soft)}.kpi strong{font-size:24px;display:block}.section-title{font-weight:850;font-size:18px;margin:20px 2px 8px}
.empty{text-align:center;padding:38px 12px;color:var(--muted)}
.auth-wrap{min-height:100vh;display:flex;align-items:center;padding:22px}.auth-card{width:100%;background:var(--card);border-radius:28px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.logo{width:58px;height:58px;border-radius:19px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:23px;margin-bottom:18px}
.link{color:var(--accent);text-decoration:underline;cursor:pointer}.hidden{display:none!important}
.order-status{padding:14px;border-radius:17px;background:#f5f6f8;margin-top:10px}.timeline{display:grid;gap:9px}.step{display:flex;gap:10px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#d7d9de}.dot.on{background:#111}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--soft);color:var(--text);font-size:13px;font-weight:700;white-space:nowrap}.chip.on{background:var(--accent);color:#fff}
.stars{color:var(--star);font-size:12px;letter-spacing:1px}
.fav{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}.fav.on{color:var(--accent2)}
.shop-cover{position:relative}
.price-strike{text-decoration:line-through;color:var(--muted);font-weight:600;font-size:12px;margin-right:6px}
.tag-promo{background:#fff1eb;color:var(--accent2);font-weight:800}
.toggle{display:inline-flex;border-radius:999px;background:var(--soft);padding:4px}.toggle button{padding:8px 16px;border-radius:999px;background:transparent;font-weight:750;font-size:13px;color:var(--muted)}.toggle button.on{background:var(--accent);color:#fff}
.rate-row{display:flex;gap:6px;font-size:26px;justify-content:center;margin:14px 0}.rate-row span{cursor:pointer;color:var(--line)}.rate-row span.on{color:var(--star)}
@media(min-width:700px){body{padding:18px 0}.top{border-radius:20px}.bottom{left:50%;right:auto;transform:translateX(-50%);width:620px;border-radius:22px 22px 0 0}}
</style>
</head>
<body>
<div id="app">
  <div id="authView" class="auth-wrap">
    <div class="auth-card">
      <div class="logo">QT</div>
      <h1 id="authTitle">เข้าสู่ระบบ</h1>
      
      <div id="authForm">
        <div class="field"><label>อีเมล</label><input id="loginEmail" type="email" autocomplete="email"></div>
        <div class="field"><label>รหัสผ่าน</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
        <button class="btn" onclick="login()">เข้าสู่ระบบ</button>
        <p class="muted" style="text-align:center;margin-top:15px">ยังไม่มีบัญชี? <span class="link" onclick="showRegister()">สมัครสมาชิก</span></p>
      </div>
      <div id="registerForm" class="hidden">
        <div class="field"><label>ประเภทบัญชี</label><select id="regRole"><option value="customer">ลูกค้า</option><option value="shop">ร้านค้า</option><option value="rider">ไรเดอร์</option><option value="technician">ช่าง</option></select></div>
        <div class="field"><label>ชื่อ</label><input id="regName"></div>
        <div class="field"><label>เบอร์โทรศัพท์</label><input id="regPhone" inputmode="tel"></div>
        <div class="field"><label>อีเมล</label><input id="regEmail" type="email"></div>
        <div class="field"><label>รหัสผ่าน</label><input id="regPassword" type="password" minlength="6"></div>
        <button class="btn" onclick="register()">สร้างบัญชี</button>
        <p class="muted" style="text-align:center;margin-top:15px"><span class="link" onclick="showLogin()">กลับเข้าสู่ระบบ</span></p>
      </div>
      <div id="authMsg" class="muted" style="margin-top:12px"></div>
    </div>
  </div>

  <div id="mainView" class="hidden">
    <header class="top">
      <div class="brand">QueueTech Food</div>
      <div class="top-actions"><button class="icon-btn" onclick="openCart()">🛒</button><button class="icon-btn" onclick="logout()">↪</button></div>
    </header>
    <main>
      <section id="customerHome" class="view"></section>
      <section id="shopView" class="view"></section>
      <section id="riderView" class="view"></section>
      <section id="technicianView" class="view"></section>
      <section id="adminView" class="view"></section>
      <section id="cartView" class="view"></section>
      <section id="ordersView" class="view"></section>
      <section id="profileView" class="view"></section>
    </main>
    <nav class="bottom">
      <div class="bottom-inner">
        <button class="nav" data-nav="home" onclick="navigate('home')"><span class="ico">⌂</span>หน้าหลัก</button>
        <button class="nav" data-nav="orders" onclick="navigate('orders')"><span class="ico">◷</span>คำสั่งซื้อ</button>
        <button class="nav" data-nav="cart" onclick="openCart()"><span class="ico">🛒</span>ตะกร้า</button>
        <button class="nav" data-nav="profile" onclick="navigate('profile')"><span class="ico">◉</span>บัญชี</button>
      </div>
    </nav>
  </div>
</div>

<div id="shopModal" class="modal" onclick="if(event.target===this)closeModal('shopModal')"><div class="sheet"><div class="handle"></div><div id="shopModalBody"></div></div></div>
<div id="cartModal" class="modal" onclick="if(event.target===this)closeModal('cartModal')"><div class="sheet"><div class="handle"></div><div id="cartModalBody"></div></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const QT = {
  url:'https://pkypiqhlrmzocysgeqew.supabase.co',
  key:'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'
};
const sb = window.supabase.createClient(QT.url,QT.key);
let me=null, cart={shopProfileId:null,items:[]}, currentShop=null, currentOrder=null, shopRatings={}, activeCategory='';
function getFavs(){try{return new Set(JSON.parse(localStorage.getItem('qt_favs')||'[]'))}catch(e){return new Set()}}
function toggleFav(id){const f=getFavs();f.has(id)?f.delete(id):f.add(id);try{localStorage.setItem('qt_favs',JSON.stringify([...f]))}catch(e){}return f}
async function loadRatings(){
  try{const rows=await db('reviews','shop_id,rating');const m={};rows.forEach(r=>{const k=String(r.shop_id);(m[k]=m[k]||[]).push(Number(r.rating)||0)});
    shopRatings={};Object.keys(m).forEach(k=>shopRatings[k]={avg:(m[k].reduce((a,b)=>a+b,0)/m[k].length),n:m[k].length})
  }catch(e){shopRatings={}}
}
function starsHtml(avg){const full=Math.round(avg||0);return '★★★★★☆☆☆☆☆'.slice(5-full,10-full)}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n){return '฿'+Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:2})}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>$('toast').classList.remove('show'),2400)}
function setAuthMsg(s){$('authMsg').textContent=s||''}
function showLogin(){$('authTitle').textContent='เข้าสู่ระบบ';$('authForm').classList.remove('hidden');$('registerForm').classList.add('hidden');setAuthMsg('')}
function showRegister(){$('authTitle').textContent='สมัครสมาชิก';$('authForm').classList.add('hidden');$('registerForm').classList.remove('hidden');setAuthMsg('')}
function openModal(id){$(id).classList.add('open')} function closeModal(id){$(id).classList.remove('open')}
function roleOf(){return me?.role||me?.metadata?.role||'customer'}
function navButtons(active){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.nav===active))}
function hideViews(){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'))}

async function db(table,query=''){
  const {data,error}=await sb.from(table).select(query||'*');
  if(error) throw error; return data||[];
}
async function ownUser(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user) return null;
  const {data,error}=await sb.from('users').select('*').eq('auth_user_id',user.id).limit(1);
  if(error) throw error;
  return data?.[0]||null;
}
async function login(){
  setAuthMsg('กำลังตรวจสอบบัญชี…');
  const email=$('loginEmail').value.trim(),password=$('loginPassword').value;
  try{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    await boot();
  }catch(e){setAuthMsg(e.message||'เข้าสู่ระบบไม่สำเร็จ')}
}
async function register(){
  const role=$('regRole').value,name=$('regName').value.trim(),phone=$('regPhone').value.trim(),email=$('regEmail').value.trim().toLowerCase(),password=$('regPassword').value;
  if(!name||!email||!password) return setAuthMsg('กรอกข้อมูลให้ครบ');
  setAuthMsg('กำลังสร้างบัญชี…');
  try{
    const {data,error}=await sb.auth.signUp({email,password,data:{name,phone,role}});
    if(error) throw error;
    if(!data.user) throw new Error('สร้างบัญชีไม่สำเร็จ');
    if(!data.session){setAuthMsg('บัญชีถูกสร้างแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ');return}
    const {error:pe}=await sb.from('users').upsert({
      auth_user_id:data.user.id,role,name,phone:phone||null,status:role==='customer'?'active':'pending'
    },{onConflict:'auth_user_id'});
    if(pe) throw pe;
    if(role==='shop'){
      const {data:u}=await sb.from('users').select('id').eq('auth_user_id',data.user.id).single();
      if(u) await sb.from('shop_profiles').upsert({user_id:u.id,shop_name:name,phone:phone||null,status:'pending'},{onConflict:'user_id'});
    }
    if(role==='rider'){
      const {data:u}=await sb.from('users').select('id').eq('auth_user_id',data.user.id).single();
      if(u) await sb.from('rider_profiles').upsert({user_id:u.id,rider_name:name,phone:phone||null,status:'pending'},{onConflict:'user_id'});
    }
    if(role==='technician'){
      const {data:u}=await sb.from('users').select('id').eq('auth_user_id',data.user.id).single();
      if(u) await sb.from('technician_profiles').upsert({user_id:u.id,technician_name:name,phone:phone||null,status:'pending'},{onConflict:'user_id'});
    }
    await boot();
  }catch(e){setAuthMsg(e.message||'สมัครสมาชิกไม่สำเร็จ')}
}
async function logout(){await sb.auth.signOut();location.reload()}

async function boot(){
  try{
    me=await ownUser();
    if(!me){await sb.auth.signOut();return}
    $('authView').classList.add('hidden');$('mainView').classList.remove('hidden');
    await navigate('home');
    startRealtime();
  }catch(e){console.error(e)}
}

async function navigate(page){
  hideViews();
  const r=roleOf();
  if(r==='shop'){await renderShop();$('shopView').classList.add('active');navButtons('home');return}
  if(r==='rider'){await renderRider();$('riderView').classList.add('active');navButtons('home');return}
  if(r==='technician'){await renderTechnician();$('technicianView').classList.add('active');navButtons('home');return}
  if(r==='admin'){await renderAdmin();$('adminView').classList.add('active');navButtons('home');return}
  if(page==='orders'){await renderOrders();$('ordersView').classList.add('active');navButtons('orders')}
  else if(page==='cart'){await renderCart();$('cartView').classList.add('active');navButtons('cart')}
  else if(page==='profile'){renderProfile();$('profileView').classList.add('active');navButtons('profile')}
  else {await renderCustomer();$('customerHome').classList.add('active');navButtons('home')}
}

let allShops=[];
async function renderCustomer(){
  const [shops,products]=await Promise.all([db('shop_profiles','id,user_id,shop_name,phone,address,latitude,longitude,status,category'),db('products','id,shop_id,category')]);
  await loadRatings();
  allShops=shops.filter(s=>s.status==='active'||s.status==='approved');
  const cats=[...new Set(allShops.map(s=>s.category).filter(Boolean))];
  $('customerHome').innerHTML=`<div class="hero"><h1>สวัสดี ${esc(me.name||'ลูกค้า')}</h1><p>หิวไหม? เลือกร้านที่ใช่แล้วสั่งได้เลย</p></div>
  <div class="search"><input id="shopSearch" placeholder="ค้นหาร้านหรือเมนู…" oninput="filterShops()"></div>
  ${cats.length?`<div class="chips">${['ทั้งหมด',...cats].map(c=>`<button class="chip ${((c==='ทั้งหมด'&&!activeCategory)||c===activeCategory)?'on':''}" onclick="setCategory('${esc(c==='ทั้งหมด'?'':c)}')">${esc(c)}</button>`).join('')}</div>`:''}
  <div id="shopList"></div>`;
  renderShopList();
}
function setCategory(c){activeCategory=c;renderCustomer()}
function renderShopList(){
  const q=($('shopSearch')?.value||'').toLowerCase();
  const favs=getFavs();
  let list=allShops.filter(s=>(s.shop_name||'').toLowerCase().includes(q));
  if(activeCategory)list=list.filter(s=>s.category===activeCategory);
  list=list.slice().sort((a,b)=>(favs.has(String(b.id))?1:0)-(favs.has(String(a.id))?1:0));
  $('shopList').innerHTML=list.length?list.map(shopCard).join(''):`<div class="empty">ไม่พบร้านที่ตรงกับคำค้นหา ลองคำอื่นดูนะ</div>`;
}
function shopCard(s){
 const r=shopRatings[String(s.id)];const fav=getFavs().has(String(s.id));
 return `<article class="card shop-card">
   <div class="shop-cover"><button class="fav ${fav?'on':''}" onclick="event.stopPropagation();onFav('${esc(s.id)}')">${fav?'♥':'♡'}</button></div>
   <div class="shop-body"><div class="row"><div><div class="shop-title">${esc(s.shop_name||'ร้านค้า')}</div><div class="muted">${esc(s.address||'ไม่ระบุที่อยู่')}</div>${r?`<div class="stars" style="margin-top:5px">${starsHtml(r.avg)} <span class="muted">(${r.n})</span></div>`:''}</div><span class="badge ok">เปิด</span></div>
   <button class="btn" style="margin-top:13px" onclick="openShop('${esc(s.id)}')">ดูเมนู</button></div></article>`
}
function onFav(id){toggleFav(id);renderShopList()}
function filterShops(){renderShopList()}
async function openShop(id){
  const shops=await db('shop_profiles',`id, user_id, shop_name, phone, address, latitude, longitude, status`);
  currentShop=shops.find(x=>String(x.id)===String(id));
  if(!currentShop)return toast('ไม่พบร้านค้า');
  const products=await db('products',`id,shop_id,name,description,price,image,is_available`);
  const items=products.filter(p=>String(p.shop_id)===String(id)&&p.is_available!==false);
  $('shopModalBody').innerHTML=`<div class="row"><div><h2 style="margin:0">${esc(currentShop.shop_name)}</h2><div class="muted">${esc(currentShop.address||'')}</div></div><span class="badge ok">เปิด</span></div>
  <div class="section-title">เมนู</div>${items.length?items.map(p=>productRow(p)).join(''):`<div class="empty">ร้านยังไม่มีเมนูที่พร้อมขาย</div>`}`;

async function addCart(productId){

  const p=rows.find(x=>String(x.id)===String(productId));
  if(!p||p.is_available===false)return toast('เมนูนี้ไม่พร้อมขาย');
  if(cart.shopProfileId&&String(cart.shopProfileId)!==String(p.shop_id)) return toast('ตะกร้าใช้ได้ทีละร้าน กรุณาสั่งซื้อจากร้านเดิมก่อน');
  cart.shopProfileId=p.shop_id;
  const item=cart.items.find(x=>String(x.productId)===String(p.id));
  if(item)item.qty++;else cart.items.push({productId:p.id,name:p.name,price:Number(p.price),image:p.image||'',qty:1});

async function renderCart(){
  if(!cart.items.length){$('cartView').innerHTML='<div class="hero"><h1>ตะกร้า</h1></div><div class="empty">ยังไม่มีสินค้า</div>';return}
  // Re-read prices and availability from the database every time the cart is opened.
  const rows=await db('products','id,shop_id,name,description,price,image,is_available');
  cart.items=cart.items.filter(i=>rows.some(p=>String(p.id)===String(i.productId)&&p.is_available!==false)).map(i=>{const p=rows.find(p=>String(p.id)===String(i.productId));return {...i,name:p.name,price:Number(p.price),image:p.image||''}})

function changeQty(id,d){const i=cart.items.find(x=>String(x.productId)===String(id));if(!i)return;i.qty+=d;if(i.qty<=0)cart.items=cart.items.filter(x=>x!==i);renderCart()}

async function checkout(){
  if(!cart.items.length)return;
  const [products,shops]=await Promise.all([db('products','id,shop_id,name,price,is_available'),db('shop_profiles','id,shop_name,status,address,latitude,longitude')]);
  const shop=shops.find(s=>String(s.id)===String(cart.shopProfileId));

  if(verified.some(x=>!x||String(x.shop_id)!==String(shop.id)))return toast('เมนูบางรายการเปลี่ยนไป กรุณาตรวจสอบตะกร้าอีกครั้ง');

  <div class="row" style="margin-top:14px"><b>รวมค่าอาหาร</b><strong id="ckSubtotal">${money(total)}</strong></div>
  <div class="row" id="ckPromoRow" style="display:none;color:var(--accent2)"><b>ส่วนลด</b><strong id="ckDiscount">-฿0</strong></div>
  <div class="row" style="margin-top:6px;padding-top:10px;border-top:1px solid var(--line)"><b>ยอดชำระ</b><strong id="ckTotal">${money(total)}</strong></div></div>
  <div class="card"><div class="field"><label>โค้ดส่วนลด (ถ้ามี)</label><div class="row" style="gap:8px"><input id="promoCode" placeholder="เช่น SAVE20" style="flex:1"><button class="btn secondary small" onclick="applyPromo(${total})">ใช้โค้ด</button></div><div id="promoMsg" class="muted" style="margin-top:6px"></div></div></div>
  <div class="card"><div class="field"><label>ที่อยู่จัดส่ง</label><textarea id="deliveryAddress" rows="3" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ"></textarea></div><div class="field"><label>หมายเหตุถึงร้าน (ถ้ามี)</label><textarea id="orderNote" rows="2"></textarea></div><button class="btn" onclick="placeOrder(${total})">สั่งเลย · ${money(total)}</button></div>`;
}
async function applyPromo(subtotal){
  const code=($('promoCode').value||'').trim().toUpperCase();
  if(!code)return;
  try{
    const rows=await db('promotions','*');
    const p=rows.find(x=>String(x.code||x.promo_code||'').toUpperCase()===code&&x.active!==false&&x.is_active!==false);
    if(!p){$('promoMsg').textContent='โค้ดนี้ใช้ไม่ได้หรือหมดอายุแล้ว';appliedPromo=null;$('ckPromoRow').style.display='none';$('ckTotal').textContent=money(subtotal);return}
    const dtype=p.discount_type||p.type||'amount', dval=Number(p.discount_value??p.value??p.percent??p.amount??0);
    const discount=(dtype==='percent'||dtype==='percentage')?Math.round(subtotal*dval/100):dval;
    appliedPromo={code:p.code,discount};
    $('ckPromoRow').style.display='flex';$('ckDiscount').textContent='-'+money(discount);$('ckTotal').textContent=money(Math.max(0,subtotal-discount));
    $('promoMsg').textContent='ใช้โค้ด '+esc(p.code)+' สำเร็จ';
    document.querySelector('#cartView .btn:last-child').textContent='สั่งเลย · '+money(Math.max(0,subtotal-discount));
  }catch(e){$('promoMsg').textContent='ยังไม่รองรับโค้ดส่วนลดในระบบนี้'}
}
async function placeOrder(subtotal){
  const address=$('deliveryAddress').value.trim();if(!address)return toast('กรอกที่อยู่จัดส่งก่อนนะ');
  const [products,shops]=await Promise.all([db('products','id,shop_id,name,price,is_available'),db('shop_profiles','id,shop_name,status')]);
  const shop=shops.find(s=>String(s.id)===String(cart.shopProfileId));
  if(!shop||!['active','approved'].includes(shop.status))return toast('ร้านนี้ยังไม่พร้อมรับออเดอร์ตอนนี้');
  const items=cart.items.map(i=>{const p=products.find(x=>String(x.id)===String(i.productId));return p&&p.is_available!==false&&String(p.shop_id)===String(shop.id)?{productId:p.id,name:p.name,price:Number(p.price),qty:i.qty}:null});
  if(items.some(x=>!x))return toast('เมนูบางรายการเปลี่ยนไป กรุณากลับไปตรวจสอบตะกร้า');
  const total=Math.max(0,items.reduce((s,x)=>s+x.price*x.qty,0)-(appliedPromo?.discount||0));
  const orderId='QT-'+Math.floor(1000+Math.random()*9000);
  const base={order_number:orderId,customer_id:me.id,shop_id:shop.id,status:'pending_shop',total_amount:total,delivery_address:address,note:$('orderNote').value.trim()||null};
  let ins=await sb.from('orders').insert(appliedPromo?{...base,promo_code:appliedPromo.code}:base).select('*').single();
  if(ins.error&&appliedPromo) ins=await sb.from('orders').insert(base).select('*').single();
  if(ins.error) return toast(ins.error.message);
  const o=ins.data;
  const rows=items.map(i=>({order_id:o.id,product_id:i.productId,quantity:i.qty,unit_price:i.price}));
  const {error:ie}=await sb.from('order_items').insert(rows);
  if(ie){toast('สร้างคำสั่งซื้อแล้ว');console.error(ie);cart={shopProfileId:null,items:[]};appliedPromo=null;await navigate('orders');return}
  cart={shopProfileId:null,items:[]};appliedPromo=null;toast('ส่งคำสั่งซื้อแล้ว ร้านกำลังจะรับออเดอร์');await navigate('orders')
}

let lastCheckResults=[];
async function runSystemCheck(){
  const box=$('sysCheckBox'); if(box) box.innerHTML='<div class="empty">กำลังตรวจสอบ…</div>';
  const results=[];
  for(const c of SYSTEM_CHECKS){
    let ok=false, cols=null;
    try{
      const sel = c.column ? c.column : '*';
      const {data,error}=await sb.from(c.table).select(sel).limit(1);
      ok = !error;
      if(ok && !c.column && data && data[0]) cols = Object.keys(data[0]);
    }catch(e){ok=false}
    results.push({...c,ok,cols});
  }
  lastCheckResults=results;
  renderSystemCheck();
}
function renderSystemCheck(){
  const box=$('sysCheckBox'); if(!box)return;
  const missing=lastCheckResults.filter(x=>!x.ok);

/* Real-time sync: debounced + single-flight refresh (adapted idea from an
   external prototype's "qt-real-time-v1", rewritten for this file's own
   Supabase/render functions — no external cache/state layer added).
   Bursts of DB events within 500ms collapse into one refresh, and a refresh
   already in flight is never run twice in parallel; a follow-up refresh is
   queued instead of overlapping. */
let __qtRtBusy=false, __qtRtQueued=false, __qtRtTimer=null;
async function qtRealtimeRefresh(){
  if(!me)return;
  const r=roleOf();
  if(r==='customer')await renderOrders();
  else if(r==='shop')await renderShop();
  else if(r==='rider')await renderRider();
  else if(r==='admin')await renderAdmin();
}
function qtScheduleRealtimeRefresh(){
  if(__qtRtTimer)return;
  __qtRtTimer=setTimeout(async()=>{
    __qtRtTimer=null;
    if(__qtRtBusy){__qtRtQueued=true;return}
    __qtRtBusy=true;
    try{await qtRealtimeRefresh()}catch(e){console.error(e)}
    __qtRtBusy=false;
    if(__qtRtQueued){__qtRtQueued=false;qtScheduleRealtimeRefresh()}
  },500);
}
function startRealtime(){
 if(window.__qtRealtime)return; window.__qtRealtime=true;
 try{
  const tables=['orders','order_items','shop_profiles','products','rider_profiles','technician_profiles','users'];
  const ch=sb.channel('qt-food-live');
  tables.forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>qtScheduleRealtimeRefresh()));
  ch.subscribe();
 }catch(e){console.error(e)}
}

sb.auth.onAuthStateChange((_event,_session)=>{if(_event==='SIGNED_OUT'){location.reload()}});
(async()=>{const {data}=await sb.auth.getSession();if(data.session)await boot()})();
</script>
