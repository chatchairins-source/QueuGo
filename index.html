function qtGenerateOrderNumber(){
  /* ผู้ใช้ต้องการเลขที่แสดงผลรูปแบบ QT-xxxx (สุ่ม 4 หลัก) และสุ่มใหม่ทุกวัน
     แต่ฐานข้อมูลมี unique constraint "orders_order_number_key" แบบ global (ไม่ได้แยกตามวัน)
     จึงต้องเก็บค่าจริงใน order_number แบบฝังวันที่ไว้ด้วย (QT-YYYYMMDD-xxxx) เพื่อไม่ให้ชนกับ
     ออเดอร์ของวันก่อน ๆ ส่วน UI จะตัดมาแสดงเฉพาะ QT-xxxx ผ่าน displayOrderNumber() */
  const orders = dbGet('qt_orders', []);
  const dateKey = qtLocalDateKey().replace(/-/g,'');
  const used = new Set(
    (Array.isArray(orders) ? orders : [])
      .map(o => String(o?.orderNumber || o?.order_number || '').trim().toUpperCase())
      .filter(Boolean)
  );
  for(let i=0;i<200;i++){
    const n = Math.floor(Math.random()*10000).toString().padStart(4,'0');
    const candidate = `QT-${dateKey}-${n}`;
    if(!used.has(candidate)) return candidate;
  }
  /* กรณีที่แทบเป็นไปไม่ได้ (สุ่มชนกันครบ 200 ครั้ง): ต่อท้ายด้วยเลขจาก timestamp เพื่อลดโอกาสชนกับ
     unique constraint ให้เหลือน้อยที่สุด ระบบ retry ใน confirmOrder() จะสุ่มใหม่อีกครั้งถ้ายังชนอยู่ */
  return `QT-${dateKey}-${Date.now().toString().slice(-4)}`;
}

async function confirmOrder(){
  const user=currentUser();
  if(!user){navigate('login');return;}
  const existingActive=getCustomerActiveOrder(user.id);
  if(existingActive){toast('มีออเดอร์ที่กำลังดำเนินการอยู่ ไม่สามารถสั่งซ้ำได้');navigate('order/'+existingActive.id);return;}
  const cart=dbGet('qt_cart_'+user.id,{items:[]});
  if(!cart.items.length){toast('ตะกร้าว่างเปล่า');navigate('cart');return;}
  const shop=dbGet('qt_users',[]).find(u=>u.id===cart.shopId);
  if(!shop){qtCheckoutError('ไม่พบข้อมูลร้านค้า กรุณากลับไปเลือกสินค้าใหม่');return;}
  /* บังคับถ่ายรูปยืนยันตัวตนสดผ่านกล้องก่อนบันทึกออเดอร์ เพื่อป้องกัน Order ผี/ออเดอร์ปลอม */
  const verifyPhoto=(window.QT_CAM_CAPTURES&&window.QT_CAM_CAPTURES['co-verify-photo'])||null;
  if(!verifyPhoto){ qtCheckoutError('กรุณาหันหน้าเข้ากล้องเพื่อยืนยันก่อนสั่งซื้อ'); return; }

  /* V5.31 FIX — ร้านต้องมี shop_profiles.id ที่แน่นอนก่อนสร้าง Order.
     ห้ามสร้าง Order ด้วย users.id แล้วหวังว่า mapping จะพร้อมภายหลัง. */
  let shopProfileId=shop.shopProfileId || QT_SYNC.profileMaps?.shopByUserId?.get(shop.id) || null;
  if(!shopProfileId){
    try{
      const token=await qtGetAccessToken();
      const rows=token ? await qtSupabaseTable('shop_profiles?select=id,user_id&user_id=eq.'+encodeURIComponent(shop.id)+'&limit=1',{accessToken:token}) : [];
      if(Array.isArray(rows) && rows[0]?.id){
        shopProfileId=rows[0].id;
        QT_SYNC.profileMaps=QT_SYNC.profileMaps||{};
        QT_SYNC.profileMaps.shopByUserId=QT_SYNC.profileMaps.shopByUserId||new Map();
        QT_SYNC.profileMaps.shopByUserId.set(shop.id,shopProfileId);
      }
    }catch(e){
      console.warn('[QueueTech] resolve shop profile failed:',e);
    }
  }
  if(!shopProfileId){
    qtCheckoutError('ไม่พบข้อมูลโปรไฟล์ร้านค้าในฐานข้อมูล กรุณาติดต่อร้านค้า');
    console.error('[QueueTech] Order blocked: shop_profiles.id missing for user',shop.id);
    return;
  }

  const loc=window.__pickedLoc?window.__pickedLoc():{lat:shop.lat,lng:shop.lng};
  const addressEl=document.getElementById('delivery-address');
  const address=addressEl?addressEl.value.trim():'';
  const subtotal=cart.items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
  const deliveryFee=computeDeliveryFee(distanceKm(shop.lat,shop.lng,loc.lat,loc.lng));
  const gp=gpAmount(subtotal),total=subtotal+deliveryFee;
  const order={
    id:uid(),orderNumber: qtGenerateOrderNumber(),orderDate:qtLocalDateKey(),
    customerId:user.id,customerName:user.name,customerPhone:user.phone,
    shopId:shop.id,shopProfileId:shopProfileId,shopName:shop.shopName,riderId:null,riderName:null,
    items:cart.items.map(i=>Object.assign({},i)),subtotal,deliveryFee,gpAmount:gp,total,
    pickup:{lat:shop.lat,lng:shop.lng,address:shop.address},
    delivery:{lat:loc.lat,lng:loc.lng,address},
    customerVerificationPhoto:verifyPhoto,
    status:'pending_shop',statusLog:[{status:'pending_shop',time:Date.now()}],createdAt:Date.now()
  };
  const orders=dbGet('qt_orders',[]);
  orders.push(order);
  QT_DB_CACHE.qt_orders=orders;

  let saved=false,lastErr=null;
  for(let attempt=1;attempt<=5&&!saved;attempt++){
    try{
      await qtTrackPersist(qtPersistKey('qt_orders',orders));
      saved=true;
    }catch(err){
      lastErr=err;
      const errMsg=String((err&&err.message)||'');
      /* root cause ของ "duplicate key value violates unique constraint orders_order_number_key":
         เลขออเดอร์ที่สุ่มไว้ชนกับ order_number ที่มีอยู่แล้วในฐานข้อมูล (เช่น ของลูกค้า/ร้านอื่นที่
         เครื่องนี้มองไม่เห็นในแคชท้องถิ่น) ห้ามปิด/ลบ constraint — ให้สุ่มเลขออเดอร์ใหม่แล้วลองบันทึกซ้ำแทน */
      if(/order_number|orders_order_number_key/i.test(errMsg)){
        order.orderNumber=qtGenerateOrderNumber();
      }
      if(attempt<5)await new Promise(r=>setTimeout(r,500*attempt));
    }
  }
  /* A network timeout may happen after Supabase accepted the insert. Check the
     order ID before offering a retry so one tap cannot create two orders. */
  let verificationUncertain=false;
  if(!saved){
    try{
      const token=await qtGetAccessToken();
      if(token){
        const rows=await qtSupabaseTable('orders?select=id&id=eq.'+encodeURIComponent(order.id)+'&limit=1',{accessToken:token});
        if(Array.isArray(rows)&&rows.some(row=>row.id===order.id)){
          const items=await qtSupabaseTable('order_items?select=id&order_id=eq.'+encodeURIComponent(order.id),{accessToken:token});
          saved=Array.isArray(items) && items.length>=order.items.length;
          if(!saved) verificationUncertain=true; /* partial write; do not start a second order */
        }
      }else verificationUncertain=true;
    }catch(e){ verificationUncertain=true; console.warn('Could not verify checkout after save failure:',e); }
  }
  if(!saved){
    const idx=orders.findIndex(o=>o.id===order.id);
    if(idx>=0) orders.splice(idx,1);
    QT_DB_CACHE.qt_orders=orders;
    const msg=String((lastErr&&lastErr.message)||'ไม่ทราบสาเหตุ');
    qtSyncFailed('qt_orders',lastErr||new Error('บันทึกออเดอร์ไม่สำเร็จ'));
    console.error('QueueTech confirmOrder save failed:',lastErr);
    window.QT_CHECKOUT_UNCERTAIN=verificationUncertain;
    qtCheckoutError(verificationUncertain
      ? 'ยังตรวจสอบไม่ได้ว่าออเดอร์ถูกบันทึกหรือไม่ กรุณาเช็กรายการคำสั่งซื้อก่อนลองใหม่'
      : 'บันทึกออเดอร์ไม่สำเร็จ: '+msg.slice(0,120));
    return;
  }
  dbSet('qt_cart_'+user.id,{shopId:null,items:[]});
  if(window.QT_CAM_CAPTURES) delete window.QT_CAM_CAPTURES['co-verify-photo'];
  pushNotification(shop.id,'📦 มีคำสั่งซื้อใหม่',`กรุณากด “รับงาน” เพื่อเริ่มดำเนินการ • จาก ${user.name} ยอด ฿${total}`,'order/'+order.id);
  toast('สั่งซื้อสำเร็จ! บันทึกออเดอร์แล้ว');
  navigate('order/'+order.id);
}

const ORDER_STATUSES = [
  {key:'pending_shop', label:'รอร้านรับงาน', icon:'⏳'},
  {key:'shop_accepted', label:'ร้านรับงานแล้ว', icon:'✅'},
  {key:'preparing', label:'กำลังเตรียมสินค้า', icon:'👨‍🍳'},
  {key:'waiting_rider', label:'รอไรเดอร์รับงาน', icon:'🔍'},
  {key:'rider_to_shop', label:'ไรเดอร์กำลังไปร้าน', icon:'🔵'},
  {key:'picked_up', label:'รับสินค้าแล้ว', icon:'📦'},
  {key:'delivering', label:'กำลังไปหาลูกค้า', icon:'🟠'},
  {key:'arrived', label:'ถึงลูกค้าแล้ว', icon:'🟡'},
  {key:'completed', label:'ส่งสำเร็จ', icon:'⚫'},
  {key:'cancelled', label:'ยกเลิก', icon:'❌'},
];
function statusLabel(key){ const s = ORDER_STATUSES.find(x=>x.key===key); return s ? s.icon+' '+s.label : key; }
function statusIndex(key){ return ORDER_STATUSES.findIndex(x=>x.key===key); }

function orderStatusTimelineHTML(o){
  const current=statusIndex(o.status);
  const cancelled=o.status==='cancelled';
  const steps=ORDER_STATUSES.filter(s=>s.key!=='cancelled');
  const log=Array.isArray(o.statusLog)?o.statusLog:[];
  return `<div class="qt-order-progress">
    <div class="qt-order-progress-title">สถานะออเดอร์</div>
    <div class="qt-order-progress-list">${steps.map((st,i)=>{
      const done=!cancelled && current>=i;
      const active=!cancelled && st.key===o.status;
      const entry=[...log].reverse().find(x=>x&&x.status===st.key);
      const when=entry&&entry.time?new Date(entry.time).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}):'';
      return `<div class="qt-order-step ${done?'done':''} ${active?'active':''}">
        <div class="qt-order-step-icon">${done?'✓':st.icon}</div>
        <div class="qt-order-step-text"><b>${st.label}</b>${active?'<span class="qt-order-now">สถานะปัจจุบัน</span>':''}${when?`<small>${when} น.</small>`:''}</div>
      </div>`;
    }).join('')}</div>
    ${cancelled?`<div class="qt-order-cancelled">❌ ออเดอร์ถูกยกเลิก${o.cancelReason?` — ${escapeHtml(o.cancelReason)}`:''}</div>`:''}

}

/* ---------- 11. ORDER CHAT ---------- */
function chatKey(orderId){ return 'qt_order_chat_'+orderId; }
function isOrderParticipant(order,user){
  return !!user && (user.id===order.customerId || user.id===order.riderId);
}
function chatIsClosed(order){
  return ['completed','cancelled'].includes(order.status);
}
function cleanupExpiredChats(){
  const now=Date.now();
  Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&k.endsWith('_deleteAt')).forEach(k=>{
    const deleteAt=Number(QT_DB_CACHE[k]||0);
    if(deleteAt&&now>=deleteAt){ delete QT_DB_CACHE[k.replace(/_deleteAt$/,'')]; delete QT_DB_CACHE[k]; }
  });
}
function getOrderChat(order){ cleanupExpiredChats(); return dbGet(chatKey(order.id),[]); }
function formatChatTime(ts){ return new Date(ts).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function renderOrderChat(order,user){
  /* V5.33: the customer sees the chat box on the status page even before a rider accepts, so it is clear where the chat will appear */
  if(!order.riderId && user && user.id===order.customerId && !chatIsClosed(order)) return `<section class="order-chat"><h3>💬 แชทระหว่างลูกค้ากับไรเดอร์</h3><div class="chat-empty">แชทจะเปิดให้ใช้งานเมื่อไรเดอร์รับงานแล้ว</div></section>`;
  if(!order.riderId || !isOrderParticipant(order,user)) return '';
  const closed=chatIsClosed(order); const messages=getOrderChat(order);
  const body=messages.length ? messages.map(m=>`<div class="chat-bubble ${m.senderId===user.id?'mine':'theirs'}"><div>${escapeHtml(m.text)}</div><div class="chat-meta">${escapeHtml(m.senderName||'ผู้ใช้งาน')} • ${formatChatTime(m.createdAt)}</div></div>`).join('') : '<div class="chat-empty">ยังไม่มีข้อความ เริ่มพูดคุยกันได้เลย</div>';
  return `<section class="order-chat"><h3>💬 แชทระหว่างลูกค้ากับไรเดอร์</h3><div id="chat-messages-${order.id}" class="chat-messages">${body}</div>${closed?'<div class="chat-closed">ออเดอร์จบแล้ว ระบบจะล้างประวัติแชทอัตโนมัติภายใน 20 นาที</div>':`<form class="chat-compose" onsubmit="return sendOrderChat(event,'${order.id}')"><input id="chat-input-${order.id}" maxlength="500" autocomplete="off" placeholder="พิมพ์ข้อความ..." required><button class="btn-primary" type="submit">ส่ง</button></form>`}</section>`;
}
/* escapeHtml() now lives in the qt-v532-helpers script */
function sendOrderChat(event,orderId){
  event.preventDefault(); const user=currentUser(); const order=dbGet('qt_orders',[]).find(o=>o.id===orderId);
  if(!user||!order||!isOrderParticipant(order,user)||chatIsClosed(order)){toast('แชทนี้ปิดแล้ว');return false;}
  const input=document.getElementById('chat-input-'+orderId); const message=(input?.value||'').trim(); if(!message)return false;
  const messages=getOrderChat(order); messages.push({id:uid(),senderId:user.id,senderName:user.name,text:message,createdAt:Date.now()}); dbSet(chatKey(orderId),messages); input.value=''; renderOrderChatArea(orderId); return false;
}
function renderOrderChatArea(orderId){ const order=dbGet('qt_orders',[]).find(o=>o.id===orderId), user=currentUser(); const host=document.querySelector('.order-chat'); if(!order||!host||!user)return; const fresh=document.createElement('div'); fresh.innerHTML=renderOrderChat(order,user); host.replaceWith(fresh.firstElementChild); const box=document.getElementById('chat-messages-'+orderId); if(box)box.scrollTop=box.scrollHeight; }
function markChatForDeletion(order){ if(!['completed','cancelled'].includes(order.status))return; const key=chatKey(order.id), messages=getOrderChat(order); if(!messages.length)return; dbSet(key,messages); QT_DB_CACHE[key+'_deleteAt']=Date.now()+20*60*1000; }
setInterval(cleanupExpiredChats,30000);

function renderOrderChatPage(orderId){
  const user=currentUser();
  const order=dbGet('qt_orders',[]).find(o=>o.id===orderId);
  if(!user||user.type!=='customer'){ navigate('login'); return; }

/* ---------- รีวิว/ให้ดาวร้านค้า ----------
   เงื่อนไข: รีวิวได้เฉพาะออเดอร์ของตัวเองที่สถานะ "completed" เท่านั้น (1 รีวิว/ออเดอร์),
   แก้ไข/ลบรีวิวของตัวเองได้ตลอดเวลา, แสดงชื่อผู้รีวิวแบบย่อ (เช่น "สมชาย ค.") */
function qtAbbrevName(name){
  const parts=String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return 'ลูกค้า';
  if(parts.length===1) return parts[0];
  return parts[0]+' '+parts[1].charAt(0)+'.';
}
function qtMyReviewForOrder(orderId,userId){
  return dbGet('qt_reviews',[]).find(r=>r.orderId===orderId && r.customerId===userId);
}
function qtShopReviews(shopId){
  return dbGet('qt_reviews',[]).filter(r=>r.shopId===shopId).sort((a,b)=>b.updatedAt-a.updatedAt);
}
function qtShopRatingSummary(shopId){
  const list=qtShopReviews(shopId);
  if(!list.length) return {count:0,avg:0};
  const avg=list.reduce((s,r)=>s+Number(r.rating||0),0)/list.length;
  return {count:list.length,avg};
}
function qtStarsHtml(rating){
  const full=Math.round(rating);
  return '★'.repeat(full)+'☆'.repeat(Math.max(0,5-full));
}
window.__qtReviewDraftRating = window.__qtReviewDraftRating || {};
function qtReviewFormHtml(orderId, rating, comment){
  return `<div class="qg-star-input" id="star-input-${orderId}">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=rating?'on':''}" onclick="setReviewStars('${orderId}',${n})">★</span>`).join('')}</div>
    <textarea id="review-comment-${orderId}" placeholder="เล่าประสบการณ์การสั่งซื้อ (ไม่บังคับ)">${escapeHtml(comment||'')}</textarea>
    <button class="btn-primary btn-block" onclick="submitReview('${orderId}')">ส่งรีวิว</button>`;
}
function setReviewStars(orderId, n){
  window.__qtReviewDraftRating[orderId]=n;
  const box=document.getElementById('star-input-'+orderId);
  if(box) Array.from(box.children).forEach(s=>s.classList.toggle('on', Number(s.dataset.n)<=n));
}
function openReviewForm(orderId){
  const user=currentUser();
  const mine=qtMyReviewForOrder(orderId,user?.id);
  const holder=document.getElementById('review-form-'+orderId);
  if(!holder) return;
  window.__qtReviewDraftRating[orderId]=mine?mine.rating:0;

}
function renderOrderReviewBox(order){
  const user=currentUser();

      <div class="row-btns"><button class="btn-secondary" onclick="openReviewForm('${order.id}')">✏️ แก้ไขรีวิว</button><button class="btn-danger" onclick="deleteMyReview('${mine.id}','${order.id}')">🗑️ ลบรีวิว</button></div>
      <div id="review-form-${order.id}"></div>

  }else{

async function submitReview(orderId){
  const user=currentUser();
  const order=dbGet('qt_orders',[]).find(o=>o.id===orderId);
  if(!user||!order){ toast('ไม่พบคำสั่งซื้อ'); return; }
  if(order.customerId!==user.id){ toast('ไม่มีสิทธิ์รีวิวออเดอร์นี้'); return; }
  if(order.status!=='completed'){ toast('รีวิวได้เฉพาะออเดอร์ที่จัดส่งสำเร็จแล้วเท่านั้น'); return; }
  const rating=window.__qtReviewDraftRating[orderId]||0;
  if(!rating){ toast('กรุณาให้คะแนนดาวก่อนส่งรีวิว'); return; }
  const comment=(document.getElementById('review-comment-'+orderId)?.value||'').trim();
  const reviews=dbGet('qt_reviews',[]);
  let mine=reviews.find(r=>r.orderId===orderId && r.customerId===user.id);
  if(mine){ mine.rating=rating; mine.comment=comment; mine.updatedAt=Date.now(); }
  else{ mine={id:uid(),orderId,shopId:order.shopId,customerId:user.id,customerName:user.name||'ลูกค้า',rating,comment,createdAt:Date.now(),updatedAt:Date.now()}; reviews.push(mine); }
  dbSet('qt_reviews',reviews);
  toast('บันทึกรีวิวแล้ว ขอบคุณค่ะ');
  renderOrderReviewBox(order);
}
async function qtDeleteRows(table,filter){
  const token=await qtGetAccessToken();
  if(!token) throw new Error('ยังไม่ได้เข้าสู่ระบบ');
  return qtSupabaseTable(table+'?'+filter,{method:'DELETE',accessToken:token});
}
async function deleteMyReview(reviewId, orderId){
  if(!confirm('ยืนยันลบรีวิวนี้?')) return;
  const user=currentUser();
  let reviews=dbGet('qt_reviews',[]);
  const mine=reviews.find(r=>r.id===reviewId);
  if(!mine || mine.customerId!==user.id){ toast('ไม่มีสิทธิ์ลบรีวิวนี้'); return; }
  reviews=reviews.filter(r=>r.id!==reviewId);
  dbSet('qt_reviews',reviews);
  if(qtUuidLike(reviewId) && window.QT_HAS_REVIEWS_TABLE){
    try{ await qtDeleteRows('reviews','id=eq.'+encodeURIComponent(reviewId)); }catch(e){ console.warn('[QueueTech] delete review failed:',e); }
  }
  toast('ลบรีวิวแล้ว');
  const order=dbGet('qt_orders',[]).find(o=>o.id===orderId);

async function qtEnsureShopReviewsLoaded(shopId){

function requestOrderRefund(orderId){
  const user=currentUser(); if(!user||user.type!=='customer'){toast('เฉพาะลูกค้า');return;}
  let orders=dbGet('qt_orders',[]); const o=orders.find(x=>x.id===orderId);
  if(!o||o.customerId!==user.id){toast('ไม่พบออเดอร์');return;}
  if(o.refundStatus){toast('มีคำขอคืนเงินอยู่แล้ว');return;}
  const reason=prompt('เหตุผลขอคืนเงิน:'); if(reason===null)return;
  o.refundStatus='requested'; o.refundRequestedAt=Date.now(); o.refundReason=reason.trim()||'ลูกค้าขอคืนเงิน'; dbSet('qt_orders',orders);
  pushNotification(user.id,'📨 ส่งคำขอคืนเงินแล้ว','คำขอคืนเงินถูกบันทึกไว้แล้ว','order/'+orderId); toast('ส่งคำขอคืนเงินแล้ว'); renderOrderDetail(orderId);
}

function orderActionButtons(order,user){
  if(!user || user.type!=='customer' || String(order.customerId)!==String(user.id)) return '';
  if(order.status==='pending_shop'){
    return `<button class="btn-block" style="background:var(--danger);color:#fff;border:none;padding:12px;border-radius:10px;font-size:15px;cursor:pointer" onclick="updateOrderStatus('${order.id}','cancelled')">ยกเลิกคำสั่งซื้อ</button>`;
  }
  return '<p>รอการดำเนินการจากร้านค้าและไรเดอร์...</p>';
}

/* Clear the image on completed or cancelled orders, including those with a rider. */
async function qtPurgeVerificationPhotoOnClosed(order){
  if(!order || !['completed','cancelled'].includes(order.status) || !order.customerVerificationPhoto) return;
  order.customerVerificationPhoto=null;
  if(window.QT_HAS_VERIFICATION_PHOTO_COLUMN){
    try{
      const token=await qtGetAccessToken();
      if(token) await qtSupabaseTable('orders?id=eq.'+encodeURIComponent(order.id),{method:'PATCH',accessToken:token,body:{customer_verification_photo:null}});
    }catch(e){ console.warn('[QueueTech] purge verification photo failed:',e); }
  }
}
function updateOrderStatus(orderId,newStatus){
  let orders=dbGet('qt_orders',[]);
  const order=orders.find(o=>o.id===orderId);
  const actor=currentUser();
  if(!order||!actor||actor.type!=='customer'||String(order.customerId)!==String(actor.id)){toast('ไม่มีสิทธิ์ดำเนินการกับออเดอร์นี้');return;}
  if(newStatus!=='cancelled'){renderOrderDetail(orderId);return;}
  if(order.status!=='pending_shop'){toast('ร้านรับออเดอร์แล้ว ไม่สามารถยกเลิกได้');renderOrderDetail(orderId);return;}
  if(!confirm('ยืนยันยกเลิกออเดอร์นี้?')) return;
  order.status='cancelled';
  qtPurgeVerificationPhotoOnClosed(order).catch(e=>console.warn('Verification photo cleanup failed:',e));
  order.statusLog=Array.isArray(order.statusLog)?order.statusLog:[];
  order.statusLog.push({status:'cancelled',time:Date.now()});
  if(chatKey){QT_DB_CACHE[chatKey(order.id)+'_deleteAt']=Date.now()+20*60*1000;}
  order.customerUnlockedAt=Date.now();
  dbSet('qt_orders',orders);
  pushNotification(order.shopId,'❌ ลูกค้ายกเลิกคำสั่งซื้อ','คำสั่งซื้อ '+displayOrderNumber(order)+' ถูกยกเลิก','order/'+order.id);
  pushNotification(actor.id,'ยกเลิกคำสั่งซื้อแล้ว','คำสั่งซื้อ '+displayOrderNumber(order)+' ถูกยกเลิกแล้ว','order/'+order.id);
  renderOrderDetail(orderId);
}







/* ---------- 10. LIVE TRACKING ---------- */
/*
  V5.44 Batch 6:
  - Removed the old simulated rider movement.
  - The customer map must never invent a rider GPS position.
  - If a real last-known rider location exists, show it.
  - If no real location exists yet, show only pickup/delivery points.
  This remains a prototype until cross-device Realtime/API is enabled.
*/
function initTrackingMap(order){
  if(typeof L==='undefined' || !order || !order.pickup || !order.delivery ||
     order.pickup.lat==null || order.pickup.lng==null ||
     order.delivery.lat==null || order.delivery.lng==null) return;

  const map = L.map('tracking-map').setView([order.pickup.lat, order.pickup.lng], 14);
  tileLayer(map);
  registerMap(map);

  L.marker([order.pickup.lat, order.pickup.lng]).addTo(map).bindPopup('🏪 ร้านค้า: '+escapeHtml(order.shopName||'ร้านค้า'));
  L.marker([order.delivery.lat, order.delivery.lng]).addTo(map).bindPopup('👤 จุดส่ง: '+escapeHtml(order.customerName||'ลูกค้า'));

  const riderIcon = L.divIcon({html:'🛵', className:'emoji-icon'});
  let riderMarker = null;
  const riderCanBeShown = ['picked_up','delivering','arrived'].includes(order.status);
  if(riderCanBeShown){
    const latest=LiveTracking.getLatestLocation(order.id);
    if(latest && Number.isFinite(Number(latest.lat)) && Number.isFinite(Number(latest.lng))){
      riderMarker=L.marker([latest.lat,latest.lng],{icon:riderIcon}).addTo(map).bindPopup('🛵 ไรเดอร์ — ตำแหน่งล่าสุด');
    }
  }

  map.fitBounds([[order.pickup.lat,order.pickup.lng],[order.delivery.lat,order.delivery.lng]],{padding:[30,30]});

  const refresh=setInterval(()=>{
    const current=dbGet('qt_orders',[]).find(x=>x.id===order.id) || order;
    if(!['picked_up','delivering','arrived'].includes(current.status)){
      if(riderMarker){ try{map.removeLayer(riderMarker);}catch(e){} riderMarker=null; }
      return;
    }
    const latest=LiveTracking.getLatestLocation(order.id);
    if(!latest || !Number.isFinite(Number(latest.lat)) || !Number.isFinite(Number(latest.lng))) return;
    const point=[Number(latest.lat),Number(latest.lng)];
    if(riderMarker) riderMarker.setLatLng(point);
    else riderMarker=L.marker(point,{icon:riderIcon}).addTo(map).bindPopup('🛵 ไรเดอร์ — ตำแหน่งล่าสุด');
  },3000);
  activeIntervals.push(refresh);
}

/* QueueGo Customer additions — delivery fee + slide confirmation */
const QT_GP_RATE=0.10;
function gpAmount(saleAmount){ return Math.round((Number(saleAmount)||0)*QT_GP_RATE*100)/100; }
function computeDeliveryFee(km){

function qtSlideConfirm(id,label,actionExpr,danger){
  return `<div class="qt-slide-confirm" id="${id}" data-qt-action="${escapeHtml(actionExpr)}"><div class="qt-slide-track ${danger?'qt-slide-danger':''}"><span class="qt-slide-label">${label}</span><div class="qt-slide-thumb">➡️</div></div></div>`;
}
(function qtInitSlideEngine(){
  let dragging=null;
  function startDrag(el,clientX,pointerId){
    const track=el.querySelector('.qt-slide-track'),thumb=el.querySelector('.qt-slide-thumb');
    if(!track||!thumb||el.classList.contains('qt-slide-done')||el.classList.contains('qt-slide-locked')) return;
    const maxX=Math.max(0,track.clientWidth-thumb.clientWidth-6),currentLeft=parseFloat(thumb.style.left||'3'),rect=track.getBoundingClientRect();
    const rawLeft=clientX-rect.left-thumb.clientWidth/2,startLeft=Math.min(Math.max(3,currentLeft),maxX);
    dragging={el,track,thumb,maxX,startX:clientX,thumbStartLeft:startLeft,offsetX:rawLeft-startLeft,action:el.getAttribute('data-qt-action'),pointerId};
    try{track.setPointerCapture?.(pointerId);}catch(e){}
    el.classList.add('qt-sliding');
  }
  function moveDrag(clientX){ if(!dragging)return; const rect=dragging.track.getBoundingClientRect(); let left=clientX-rect.left-dragging.offsetX; left=Math.min(Math.max(3,left),dragging.maxX); dragging.thumb.style.left=left+'px'; }
  function endDrag(){
    if(!dragging)return;
    const {el,thumb,maxX,action}=dragging; const left=parseFloat(thumb.style.left||'3'); el.classList.remove('qt-sliding');
    if(maxX>0&&left>=maxX*0.70){ thumb.style.left=maxX+'px'; el.classList.add('qt-slide-done'); try{(new Function(action))();}catch(e){console.error('slide action failed',e);} }
    else thumb.style.left='3px';
    dragging=null;
  }
  document.addEventListener('pointerdown',e=>{const track=e.target.closest('.qt-slide-track');if(!track)return;const el=track.closest('.qt-slide-confirm');if(!el||el.classList.contains('qt-slide-done')||el.classList.contains('qt-slide-locked'))return;e.preventDefault();startDrag(el,e.clientX,e.pointerId);moveDrag(e.clientX);},{passive:false});
  document.addEventListener('pointermove',e=>{if(dragging&&(dragging.pointerId===undefined||dragging.pointerId===e.pointerId)){e.preventDefault();moveDrag(e.clientX);}},{passive:false});
  document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
})();
</script>

<script id="qt-real-time-v1">
/* QueueTech Real-time v1
   - Uses Supabase Realtime (WebSocket) instead of page refresh/polling.
   - Rehydrates only after database events; the page itself is never refreshed.
   - If Realtime is unavailable, the existing background sync remains as fallback.
   - FIX: previously this called qtHydrateDatabase() directly, with no coordination
     with the 8s poll loop (qtSyncTick) or qtBackgroundHydrate. Since any change to
     any of 16 tables (including notifications, which are created on almost every
     status update by anyone) fired this immediately, it could run a second full
     hydrate WHILE the poll loop's hydrate was still in flight, racing writes into
     QT_DB_CACHE, and it always force-re-rendered the page even when nothing the
     viewer cared about had changed — this is what looked like the page "loading
     back and forth". It now shares QT_SYNC's busy flag with the poll loop (so only
     one hydrate ever runs at a time), debounces bursts of events into one hydrate,
     and only re-renders when the signature actually changed, same as qtSyncTick.
*/
(function(){
  let client=null, channel=null, retry=0, debounceTimer=null, pendingReason=null;
  const TABLES=['users','shop_profiles','rider_profiles','products','orders','order_items','deliveries','payments','notifications','order_chat_messages','reviews'];

  function scheduleRefresh(reason){
    pendingReason=reason;
    if(debounceTimer) return; /* a refresh is already queued for the current burst of events */
    debounceTimer=setTimeout(()=>{ debounceTimer=null; refreshFromRealtime(pendingReason); },600);
  }

  async function refreshFromRealtime(reason){
    if(QT_SYNC.busy || QT_DB_HYDRATING){ scheduleRefresh(reason); return; } /* poll loop or another hydrate is mid-flight: don't run a second one, try again shortly */
    QT_SYNC.busy=true; QT_SYNC.dirty={};
    try{
      const before=qtSyncSignature();
      if(typeof qtHydrateDatabase==='function') await qtHydrateDatabase({light:false});
      Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
      const after=qtSyncSignature();
      if(typeof qtSyncRerender==='function') qtSyncRerender(before,after); /* only re-renders the page if data actually changed */
      window.dispatchEvent(new CustomEvent('qt:realtime-update',{detail:{reason}}));
    }catch(e){ console.warn('[QueueTech Realtime] hydrate failed:',e); }
    finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
  }

  function subscribe(){
    if(!client) return;
    if(channel){ try{client.removeChannel(channel);}catch(e){} }
    channel=client.channel('qt-live-data-v1');
    TABLES.forEach(table=>{
      channel.on('postgres_changes',{event:'*',schema:'public',table},payload=>{
        scheduleRefresh(table+':'+payload.eventType);
      });
    });
    channel.subscribe(status=>{
      window.QT_REALTIME_STATUS=status;
      document.documentElement.dataset.qtRealtime=String(status||'').toLowerCase();
      if(status==='SUBSCRIBED'){
        retry=0;
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status:'SUBSCRIBED'}}));
      }else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        window.dispatchEvent(new CustomEvent('qt:realtime-status',{detail:{status}}));
        retry=Math.min(retry+1,6);
        setTimeout(()=>{ try{subscribe();}catch(e){} }, Math.min(30000,1000*Math.pow(2,retry)));
      }
    });
  }

  function loadClient(){
    if(window.supabase?.createClient){
      try{ client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}}); subscribe(); return; }catch(e){console.warn('[QueueTech Realtime] init failed',e);}
    }
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    sc.async=true;
    sc.onload=()=>{
      try{
        client=window.supabase.createClient(QT_SUPABASE_CONFIG.URL,QT_SUPABASE_CONFIG.KEY,{realtime:{params:{eventsPerSecond:20}}});
        subscribe();
      }catch(e){console.warn('[QueueTech Realtime] client init failed',e);}
    };
    sc.onerror=()=>console.warn('[QueueTech Realtime] CDN unavailable; fallback sync remains active');
    document.head.appendChild(sc);
  }

  window.addEventListener('online',()=>{ if(client) subscribe(); });
  window.addEventListener('hashchange',()=>{ if(client && window.QT_REALTIME_STATUS!=='SUBSCRIBED') subscribe(); });
  window.QT_REALTIME_FORCE_REFRESH=()=>refreshFromRealtime('manual');
  setTimeout(loadClient,800);
})();
</script>

        <button class="qg-profile-row"><span class="i">${qgIcon('bag')}</span><div><b>วิธีการชำระเงิน</b><small>เก็บเงินปลายทาง (COD)</small></div>${qgIcon('chevron')}</button>
        <button class="qg-profile-row" onclick="navigate('promotion')"><span class="i">${qgIcon('ticket')}</span><div><b>คูปอง & โปรโมชั่น</b><small>ดูโปรโมชั่นที่ใช้งานได้</small></div>${qgIcon('chevron')}</button>
        <button class="qg-profile-row"><span class="i">${qgIcon('settings')}</span><div><b>การตั้งค่า</b><small>การแจ้งเตือนและบัญชี</small></div>${qgIcon('chevron')}</button>
        <button class="qg-profile-row"><span class="i">${qgIcon('chat')}</span><div><b>ติดต่อช่วยเหลือ</b><small>ศูนย์ช่วยเหลือ QueueGo</small></div>${qgIcon('chevron')}</button>
        <button class="qg-profile-row" onclick="logout()"><span class="i">${qgIcon('logout')}</span><div><b style="color:#d42a36">ออกจากระบบ</b></div>${qgIcon('chevron')}</button>
      </div></section>`);
  };

  window.renderPromotionPage=function(){
    const promos=dbGet('qt_promotions',[]).filter(p=>p.status==='active');
    const shops=dbGet('qt_users',[]);
    layout('โปรโมชั่น',`<div class="qg-page-title"><button class="qg-back" onclick="history.back()">${qgIcon('back')}</button><h1>โปรโมชั่น</h1></div><div class="qg-promo-list">${promos.length?promos.map(p=>{const s=shops.find(x=>x.id===p.shopId),src=imgForShop(s);return `<article class="qg-promo-card" onclick="navigate('shop-view/${esc(p.shopId)}')">${src?photo(src,''):''}<div class="qg-promo-card-body"><b>${esc(p.shopName||s?.shopName||'โปรโมชั่น')}</b><p>${esc(p.description||p.title||'โปรโมชั่นพิเศษจากร้านที่อนุมัติแล้ว')}</p><span class="qg-open-pill">พร้อมใช้งาน</span></div></article>`}).join(''):'<div class="qg-empty-new">ยังไม่มีโปรโมชั่นที่อนุมัติ</div>'}</div>`);
  };

  window.renderOrderSuccess=function(id){
    const o=dbGet('qt_orders',[]).find(x=>x.id===id),u=currentUser();
    if(!o||!customer(u)||String(o.customerId)!==String(u.id)){navigate('orders');return;}
    layout('สั่งซื้อสำเร็จ',`<section class="qg-success"><div class="qg-success-image-wrap"><img class="qg-success-image" src="${ORDER_SUCCESS_IMAGE}" alt="สั่งซื้อสำเร็จ"></div><h1>สั่งซื้อสำเร็จ!</h1><p>ขอบคุณที่ใช้บริการ QueueGo</p><div class="qg-track-card" style="width:100%;text-align:left;margin-top:12px"><div class="qg-summary-row"><span>เลขที่ออเดอร์</span><b>${esc(displayOrderNumber(o))}</b></div><div class="qg-summary-row"><span>ร้าน</span><b>${esc(o.shopName||'-')}</b></div><div class="qg-summary-row"><span>ยอดรวม</span><b>฿${esc(o.total||0)}</b></div></div><button class="qg-primary" style="margin-top:12px" onclick="navigate('order/${esc(o.id)}')">ดูรายละเอียดออเดอร์</button><button class="qg-secondary" style="width:100%;margin-top:9px" onclick="navigate('home')">กลับหน้าหลัก</button></section>`);
  };

  // Preserve backend/order logic; only change the presentation and add the success handoff.
  if(!window.__qgConfirmWrapped){
    const originalConfirm=window.confirmOrder;
    window.confirmOrder=async function(){
      const u=currentUser(), beforeIds=new Set(dbGet('qt_orders',[]).map(x=>x.id)), cart=u?qtGetCart():null, note=cart?.note||'';
      await originalConfirm();
      const orders=dbGet('qt_orders',[]);
      const created=orders.find(x=>x.customerId===u?.id&&!beforeIds.has(x.id)) || orders.filter(x=>x.customerId===u?.id).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];
      if(created){
        if(note){created.note=note;const arr=orders.map(x=>x.id===created.id?created:x);QT_DB_CACHE.qt_orders=arr;try{const token=await qtGetAccessToken();if(token)await qtSupabaseTable('orders?id=eq.'+encodeURIComponent(created.id),{method:'PATCH',accessToken:token,body:{note}});}catch(e){console.warn('[QueueGo UI] note save failed',e);}}
        navigate('order-success/'+created.id);
      }
    };
    window.__qgConfirmWrapped=true;
  }

  // Refresh the new floating cart without altering the original cart/database logic.
  if(!window.__qgAddWrapped){
    const originalAdd=window.addToCart;
    window.addToCart=function(id){originalAdd(id);setTimeout(()=>{const p=document.querySelector('#qg-menu-list');if(p)renderShopView((dbGet('qt_products',[]).find(x=>x.id===id)||{}).shopId);},0);}
    window.__qgAddWrapped=true;
  }

  // Extend the existing customer router; all existing backend functions remain intact.
  const oldRoute=window.qtRouteRender;
  window.qtRouteRender=function(){
    destroyMaps();qtStopCheckoutFaceCam();
    const hash=location.hash.replace('#','')||'home';const [page,param]=hash.split('/');const u=currentUser();
    if(u&&u.type!=='customer'&&page!=='login'&&page!=='register'){renderQueueGoRoleNotice(u);return;}
    switch(page){
      case 'home':renderHome();break;case 'register':renderRegister();break;case 'login':renderLogin();break;
      case 'dashboard':renderCustomerProfile();break;case 'profile':renderCustomerProfile();break;case 'search':renderSearch(param);break;
      case 'shop-view':renderShopView(param);break;case 'cart':renderCart();break;case 'checkout':renderCheckout();break;
      case 'orders':renderOrders();break;case 'order':renderOrderDetail(param);break;case 'order-success':renderOrderSuccess(param);break;
      case 'order-chat':renderOrderChatPage(param);break;case 'notifications':renderNotifications();break;case 'promotion':renderPromotionPage();break;
      case 'emergency':case 'call-technician':renderTechnicianClosed();break;default:renderHome();
    }
    window.scrollTo(0,0);
  };

  // Modernize authentication screens without touching auth handlers.
  window.renderLogin=function(){layout('เข้าสู่ระบบ',`<section style="padding-top:38px"><div style="text-align:center"><div class="qg-success-icon" style="margin:0 auto 16px;width:64px;height:64px">Q</div><h1 style="font-size:27px;margin:0">ยินดีต้อนรับกลับ</h1><p style="color:var(--qg-muted);font-size:13px">เข้าสู่ระบบเพื่อสั่งอาหารและติดตามออเดอร์</p></div><form onsubmit="return handleLogin(event)" style="background:#fff;border:1px solid var(--qg-line);border-radius:20px;padding:17px;margin-top:20px"><label>เบอร์โทรศัพท์ หรืออีเมล</label><input required id="login-phone" autocomplete="username" placeholder="08xxxxxxxx หรืออีเมล" style="width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px"><label>รหัสผ่าน</label><input required type="password" id="login-password" autocomplete="current-password" placeholder="รหัสผ่าน" style="width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px"><button class="qg-primary" type="submit" style="margin-top:15px">เข้าสู่ระบบ</button></form><p style="text-align:center;font-size:13px;color:var(--qg-muted);margin-top:16px">ยังไม่มีบัญชี? <button class="qg-link-btn" onclick="navigate('register')">สมัครสมาชิก</button></p></section>`);}
  window.renderRegister=function(){layout('สมัครสมาชิก',`<section style="padding-top:25px"><div style="text-align:center"><div class="qg-success-icon" style="margin:0 auto 16px;width:64px;height:64px">Q</div><h1 style="font-size:27px;margin:0">สร้างบัญชีผู้ใช้</h1><p style="color:var(--qg-muted);font-size:13px">เริ่มใช้งาน QueueGo เพื่อค้นหาร้านและสั่งอาหาร</p></div><form onsubmit="return handleRegister(event)" style="background:#fff;border:1px solid var(--qg-line);border-radius:20px;padding:17px;margin-top:18px"><input type="hidden" id="reg-type" value="customer"><input type="hidden" id="reg-contact-mode" value="phone"><label>ช่องทางเข้าสู่ระบบ</label><div class="qg-filter-row" style="overflow:visible"><button type="button" class="qg-filter active" id="reg-mode-phone" onclick="switchRegisterContact('phone')">เบอร์โทรศัพท์</button><button type="button" class="qg-filter" id="reg-mode-email" onclick="switchRegisterContact('email')">อีเมล</button></div><label>ชื่อของคุณ</label><input required id="reg-name" placeholder="ชื่อ-นามสกุล" style="width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px"><label id="reg-phone-label">เบอร์โทรศัพท์</label><input id="reg-phone" inputmode="tel" placeholder="08xxxxxxxx" style="width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px"><label id="reg-email-label" style="display:none">อีเมล</label><input id="reg-email" type="email" style="display:none;width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px" placeholder="example@email.com"><label>รหัสผ่าน</label><input required type="password" id="reg-password" minlength="6" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร" style="width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px"><label>ยืนยันรหัสผ่าน</label><input required type="password" id="reg-password-confirm" minlength="6" autocomplete="new-password" placeholder="กรอกรหัสผ่านอีกครั้ง" style="width:100%;height:50px;border:1px solid #ddd;border-radius:13px;padding:0 13px;margin-top:5px"><button class="qg-primary" type="submit" style="margin-top:15px">สร้างบัญชี</button></form><p style="text-align:center;font-size:13px;color:var(--qg-muted);margin-top:15px">มีบัญชีอยู่แล้ว? <button class="qg-link-btn" onclick="navigate('login')">เข้าสู่ระบบ</button></p></section>`);}
})();
</script>

<script id="queuego-ui-rebuild-v1-js">
(function(){

  const iconPaths={

    share:'<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.3 10.8 7.4-4.4M8.3 13.2l7.4 4.4"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7l1-3h4l1 3"/>',
    phone:'<path d="M7 4h3l1.2 4-2 1.5a14 14 0 0 0 5.3 5.3l1.5-2L20 14v3c0 1.1-.9 2-2 2C10.3 19 5 13.7 5 7c0-1.7.9-3 2-3Z"/>',
    chat:'<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2 1-4A7.5 7.5 0 1 1 20 11.5Z"/>',
    star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

    ticket:'<path d="M4 5h16v4a3 3 0 0 0 0 6v4H4v-4a3 3 0 0 0 0-6V5Z"/><path d="M12 8v8"/>',
    logout:'<path d="M10 17l5-5-5-5M15 12H3M21 5v14a2 2 0 0 1-2 2h-5"/>',
    grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
    bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    utensils:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3v18M14 3v7h6"/>',
    drink:'<path d="M7 3h10l-1 18H8L7 3Z"/><path d="M8 7h8"/>',
    dessert:'<path d="M4 14h16M6 14c0 4 2.4 6 6 6s6-2 6-6"/><path d="M8 10a4 4 0 0 1 8 0"/>'
  };
  window.qgIcon=function(name,size=20){
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name]||iconPaths.grid}</svg>`;
  };
  const imgForShop = s => {
    const own=s?.logo||s?.profileImage||s?.profile_image||s?.profilePhoto||s?.avatarUrl;
    if(own) return own;
    const p=dbGet('qt_products',[]).find(x=>x.shopId===s?.id && x.image);
    return p?.image||'';
  };
  const placeholder='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220"><rect width="100%" height="100%" fill="#f0f1f2"/></svg>');
  const photo=(src,alt='')=>`<img src="${esc(src||placeholder)}" alt="${esc(alt)}" onerror="this.src='${placeholder}'">`;
  const customer=user=>user&&user.type==='customer';
  const activeNav=page=>String(location.hash||'#home').replace(/^#/,'').split('/')[0]===page;

  window.bottomNav=function(){
    const u=currentUser(), count=cartCount();
    if(!customer(u)) return '';
    return `<nav class="qg-bottom-new" aria-label="เมนูหลัก">
      <a href="#home" class="${activeNav('home')?'active':''}"><div class="nav-i">${qgIcon('home')}</div>หน้าหลัก</a>
      <a href="#search" class="${activeNav('search')?'active':''}"><div class="nav-i">${qgIcon('search')}</div>ค้นหา</a>
      <a href="#orders" class="${activeNav('orders')?'active':''}"><div class="nav-i" style="position:relative">${qgIcon('orders')}${count?`<b class="cart-count-badge">${count>99?'99+':count}</b>`:''}</div>ออเดอร์</a>
      <a href="#profile" class="${activeNav('profile')||activeNav('dashboard')?'active':''}"><div class="nav-i">${qgIcon('user')}</div>บัญชี</a>
    </nav>`;
  };

  window.layout=function(title,content){
    document.title=title+' - QueueGo';
    const u=currentUser();
    document.getElementById('app').innerHTML=`<div class="qg-new-shell">
      <header class="qg-new-topbar"><div class="qg-new-topbar-inner">
        <button class="qg-new-brand" style="border:0;background:none;padding:0;cursor:pointer" onclick="navigate('home')">QueueGo</button>
        <div class="qg-new-top-actions">${customer(u)?`<button class="qg-icon" aria-label="แจ้งเตือน" onclick="navigate('notifications')">${qgIcon('bag')}</button><button class="qg-icon" aria-label="บัญชี" onclick="navigate('profile')">${qgIcon('user')}</button>`:`<button class="qg-link-btn" onclick="navigate('login')">เข้าสู่ระบบ</button>`}</div>
      </div></header>
      <main class="qg-new-content">${content}</main>${bottomNav()}<div id="notif-toast-box"></div>
    </div>`;
  };

  function catIcon(c){
    return c==='food'?'utensils':c==='cafe'?'drink':c==='grocery'?'bag':c==='dessert'?'dessert':'grid';
  }
  function catLabel(c){
    const map={food:'อาหาร',grocery:'ของใช้',cafe:'เครื่องดื่ม',other:'อื่นๆ'};
    return map[c]||String(c||'อื่นๆ');
  }
  function shopOpen(s){return typeof isShopOpenNow==='function'?isShopOpenNow(s):true}
  function shopCardV2(s){
    const rs=qtShopRatingSummary(s.id);
    const dist=Number.isFinite(Number(s.distance))?`${Number(s.distance).toFixed(1)} กม.`:'ใกล้คุณ';
    const open=shopOpen(s);
    const delivery=s.deliveryFee!=null?`ค่าส่ง ${s.deliveryFee} บาท`:'ค่าส่งเริ่มต้น 30 บาท';
    return `<article class="qg-shop-card-new" onclick="navigate('shop-view/${esc(s.id)}')">
      ${photo(imgForShop(s),s.shopName)}
      <div class="qg-shop-info-new">
        <div class="qg-shop-name-new">${esc(qgShortShopName(s.shopName))}</div>
        <div class="qg-shop-meta-new"><span>${qgIcon('star',12)} ${rs.count?rs.avg.toFixed(1):'-'}${rs.count?` (${rs.count})`:''}</span><span>${qgIcon('pin',12)} ${dist}</span><span>${qgIcon('clock',12)} 30–45 นาที</span></div>
        <div class="${open?'qg-open-pill':'qg-open-pill qg-closed-pill'}">${open?'เปิดรับออเดอร์':'ปิดชั่วคราว'} • ${delivery}</div>
      </div>
    </article>`;
  }

  window.renderHome=function(){
    const u=currentUser();
    const addr=u&&customer(u)?qtCustomerLocationText(u):'เลือกที่อยู่จัดส่ง';
    const shops=dbGet('qt_users',[]).filter(x=>x.type==='shop'&&x.shopName);
    const promos=dbGet('qt_promotions',[]).filter(x=>x.status==='active');
    const promo=promos[0];
    const promoShop=promo?shops.find(s=>s.id===promo.shopId):null;
    const promoSrc=imgForShop(promoShop||shops[0]);
    layout('หน้าหลัก',`
      <section class="qg-location-new" onclick="${customer(u)?'openCustomerLocationPicker()':''}">
        <div class="qg-location-pin">${qgIcon('pin',18)}</div><div class="qg-location-copy"><small>จัดส่งที่</small><b id="qg-customer-location-text">${esc(addr)}</b></div>${qgIcon('chevron',19)}
      </section>
      <section class="qg-search-new" onclick="navigate('search')">${qgIcon('search')}<span>ค้นหาร้านหรือเมนูที่ต้องการ</span></section>
      ${promo||promoSrc?`<section class="qg-promo-banner" onclick="navigate('${promoShop?'shop-view/'+esc(promoShop.id):'promotion'}')">${promoSrc?photo(promoSrc,''):''
        }<div class="qg-promo-overlay"><small>${promo?'โปรโมชั่นจากร้านที่ได้รับอนุมัติ':'QUEUEGO'}</small><strong>${promo?'ลดพิเศษสำหรับคุณ':'อร่อยได้ทุกวัน ส่งไวถึงบ้าน'}</strong><span>${promo?.description?esc(promo.description):'ดูร้านอาหารและเมนูใกล้คุณ'}</span></div></section>`:''}
      <section class="qg-section-new"><div class="qg-section-title"><h2>หมวดหมู่</h2></div><div id="qg-categories" class="qg-cat-row"></div></section>
      <section class="qg-section-new"><div class="qg-section-title"><h2>ร้านใกล้คุณ</h2><button class="qg-link-btn" onclick="navigate('search')">ดูทั้งหมด</button></div><div id="qg-nearby" class="qg-shop-list-new"><div class="qg-empty-new">กำลังโหลดร้าน...</div></div></section>
    `);
    const cats=[...new Set(shops.map(s=>s.category).filter(Boolean))];
    const catBox=document.getElementById('qg-categories');
    if(catBox){
      const list=cats.length?cats.slice(0,8):['food','cafe','grocery','other'];
      catBox.innerHTML=list.map(c=>`<button class="qg-cat" onclick="navigate('search/${esc(c)}')"><span class="qg-cat-icon">${qgIcon(catIcon(c))}</span><b>${esc(catLabel(c))}</b></button>`).join('');
    }
    const render=async()=>{
      let ss=dbGet('qt_users',[]).filter(x=>x.type==='shop'&&x.shopName);
      if(!ss.length){await qtEnsurePublicShopsLoaded();ss=dbGet('qt_users',[]).filter(x=>x.type==='shop'&&x.shopName);}
      const loc={lat:Number(u?.lat)||13.7563,lng:Number(u?.lng)||100.5018};
      ss=ss.map(s=>({...s,distance:(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)))?distanceKm(loc.lat,loc.lng,Number(s.lat),Number(s.lng)):Infinity}));
      ss.sort((a,b)=>a.distance-b.distance);
      const el=document.getElementById('qg-nearby'); if(el) el.innerHTML=ss.length?ss.slice(0,12).map(shopCardV2).join(''):'<div class="qg-empty-new">ยังไม่มีร้านที่เปิดให้บริการ</div>';
    };
    render().catch(()=>{});
    if(u&&customer(u))setTimeout(qtAutoCaptureCustomerLocation,250);
  };

  window.renderSearch=function(preset){
    layout('ค้นหา',`
      <section class="qg-search-page">
        <div class="qg-page-title"><button class="qg-back" onclick="navigate('home')">${qgIcon('back')}</button><h1>ค้นหา</h1></div>
        <input id="qg-search-v2" class="qg-search-input" placeholder="ค้นหาร้านหรือเมนูที่ต้องการ">
        <div class="qg-filter-row"><button class="qg-filter active" data-filter="">ทั้งหมด</button><button class="qg-filter" data-filter="shop">ร้าน</button><button class="qg-filter" data-filter="menu">อาหาร</button><button class="qg-filter" data-filter="near">ใกล้ที่สุด</button></div>
        <div id="qg-search-results" class="qg-search-result"></div>
      </section>`);
    const input=document.getElementById('qg-search-v2');
    let filter='';
    const run=async()=>{
      let ss=dbGet('qt_users',[]).filter(s=>s.type==='shop'&&s.shopName);
      if(!ss.length){await qtEnsurePublicShopsLoaded();ss=dbGet('qt_users',[]).filter(s=>s.type==='shop'&&s.shopName);}
      const u=currentUser(),loc={lat:Number(u?.lat)||13.7563,lng:Number(u?.lng)||100.5018};
      const kw=(input?.value||'').trim().toLowerCase();
      if(preset&&!kw) ss=ss.filter(s=>!preset||s.category===preset);
      ss=ss.map(s=>({...s,distance:(Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng)))?distanceKm(loc.lat,loc.lng,Number(s.lat),Number(s.lng)):Infinity}));
      if(kw) ss=ss.filter(s=>s.shopName.toLowerCase().includes(kw)||String(s.description||'').toLowerCase().includes(kw));
      if(filter==='near') ss.sort((a,b)=>a.distance-b.distance);
      const products=dbGet('qt_products',[]).filter(p=>p.available!==false);
      let menu=[];
      if(kw||filter==='menu') menu=products.filter(p=>String(p.name||'').toLowerCase().includes(kw)).slice(0,20);
      const el=document.getElementById('qg-search-results'); if(!el)return;
      let html='';
      if(filter!=='menu') html+=ss.length?`<div class="qg-shop-list-new">${ss.slice(0,20).map(shopCardV2).join('')}</div>`:'<div class="qg-empty-new">ไม่พบร้าน</div>';
      if(menu.length) html+=`<div class="qg-section-new"><div class="qg-section-title"><h2>เมนูอาหาร</h2></div>${menu.map(p=>{const s=ss.find(x=>x.id===p.shopId)||dbGet('qt_users',[]).find(x=>x.id===p.shopId);return `<div class="qg-menu-result" onclick="navigate('shop-view/${esc(p.shopId)}')">${photo(p.image,p.name)}<div><b>${esc(p.name)}</b><small>${esc(s?.shopName||'ร้านค้า')} • ฿${esc(p.price)}</small></div></div>`}).join('')}</div>`;
      el.innerHTML=html||'<div class="qg-empty-new">ลองค้นหาชื่อร้านหรือเมนู</div>';
    };
    document.querySelectorAll('.qg-filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.qg-filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter||'';run();});
    input.addEventListener('input',run);run();
  };

  window.renderShopView=function(shopId){
    const shop=dbGet('qt_users',[]).find(s=>String(s.id)===String(shopId));
    if(!shop){toast('ไม่พบร้านค้า');navigate('search');return;}
    const products=dbGet('qt_products',[]).filter(p=>String(p.shopId)===String(shopId));
    const {count,avg}=qtShopRatingSummary(shopId);
    const cover=shop.cover||shop.banner||imgForShop(shop);
    const cats=[...new Set(products.map(p=>p.category||p.menuCategory).filter(Boolean))];
    layout(shop.shopName,`
      <section class="qg-cover">${cover?photo(cover,shop.shopName):''}
        <div class="qg-cover-actions"><button class="qg-icon" onclick="navigate('search')">${qgIcon('back')}</button><div class="right"><button class="qg-icon">${qgIcon('heart')}</button><button class="qg-icon">${qgIcon('share')}</button></div></div>
      </section>
      <section class="qg-shop-intro"><h1 class="qg-shop-title">${esc(shop.shopName)}</h1>
        <div class="qg-shop-meta-line"><span>${qgIcon('star',13)} ${count?avg.toFixed(1):'-'}${count?` (${count})`:''}</span><span>${qgIcon('pin',13)} ${Number.isFinite(Number(shop.lat))?'ใกล้คุณ':'-'}</span><span>${qgIcon('clock',13)} 30–45 นาที</span></div>
        <div class="${shopOpen(shop)?'qg-open-pill':'qg-open-pill qg-closed-pill'}">${shopOpen(shop)?'เปิด':'ปิด'} • ค่าส่งเริ่มต้น 30 บาท</div>
      </section>
      <div class="qg-menu-tabs" id="qg-menu-tabs"><button class="qg-menu-tab active" data-cat="">ทั้งหมด</button>${cats.map(c=>`<button class="qg-menu-tab" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
      <div id="qg-menu-list" class="qg-menu-list-new"></div>
      <div id="qg-shop-reviews" style="margin-top:16px"></div>
    `);
    const renderMenu=cat=>{
      const list=cat?products.filter(p=>(p.category||p.menuCategory)===cat):products;
      document.getElementById('qg-menu-list').innerHTML=list.length?list.map(p=>`<article class="qg-menu-item-new">
        ${photo(p.image,p.name)}<div class="qg-menu-item-copy"><b>${esc(p.name)}</b><p>${esc(p.description||'')}</p><span class="qg-menu-price">฿${esc(p.price)}</span></div>
        ${p.available!==false?`<button class="qg-plus" aria-label="เพิ่ม ${esc(p.name)}" onclick="event.stopPropagation();addToCart('${esc(p.id)}')">${qgIcon('plus')}</button>`:`<span class="qg-price-note">หมด</span>`}
      </article>`).join(''):'<div class="qg-empty-new">ร้านยังไม่มีเมนู</div>';
      updateCartCountUI();
      let fc=document.getElementById('qg-floating-cart'); if(fc)fc.remove();
      if(cartCount()>0){
        const c=qtGetCart(), total=(c.items||[]).reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
        document.body.insertAdjacentHTML('beforeend',`<div id="qg-floating-cart" class="qg-floating-cart" onclick="navigate('cart')"><span>ตะกร้า (${cartCount()})</span><b>฿${total}</b></div>`);
      }
    };
    document.querySelectorAll('.qg-menu-tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.qg-menu-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderMenu(b.dataset.cat||'');});
    renderMenu('');
    renderShopReviewsBox(shopId);
    qtEnsureShopReviewsLoaded(shopId).then(()=>renderShopReviewsBox(shopId));
  };

  window.renderCart=function(){
    const cart=qtGetCart(),shop=cart.shopId?dbGet('qt_users',[]).find(s=>s.id===cart.shopId):null;
    const subtotal=(cart.items||[]).reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);
    layout('ตะกร้า',`<section class="qg-cart-page">
      <div class="qg-page-title"><button class="qg-back" onclick="history.back()">${qgIcon('back')}</button><h1>ตะกร้าสินค้า</h1></div>
      ${shop?`<div style="font-size:12px;color:var(--qg-muted);margin-bottom:8px">${esc(shop.shopName)}</div>`:''}

      ${cart.items?.length?`<div class="qg-checkout-card"><b style="font-size:14px">หมายเหตุถึงร้าน</b><textarea id="qg-cart-note" style="width:100%;min-height:78px;margin-top:8px;border:1px solid var(--qg-line);border-radius:13px;padding:10px;resize:vertical" maxlength="100" placeholder="เช่น ไม่เผ็ด, ไม่ใส่ผัก">${esc(cart.note||'')}</textarea></div>

  window.renderCheckout=function(){
    const u=currentUser();if(!u){navigate('login');return;}

    if(!shop||!cart.items?.length){toast('ตะกร้าว่าง');navigate('cart');return;}

    layout('ยืนยันคำสั่งซื้อ',`<section>
      <div class="qg-page-title"><button class="qg-back" onclick="navigate('cart')">${qgIcon('back')}</button><h1>ยืนยันคำสั่งซื้อ</h1></div>
      <section class="qg-checkout-card"><div class="qg-checkout-head"><b>ที่อยู่จัดส่ง</b><button class="qg-link-btn" onclick="openCustomerLocationPicker()">เปลี่ยน</button></div><div style="font-size:12px;margin-bottom:9px">${esc(qtCustomerLocationText(u))}</div><div id="pin-map" class="map-box qg-checkout-map"></div><div class="coord-display" style="display:none">Lat: <span id="disp-lat">-</span>, Lng: <span id="disp-lng">-</span></div><textarea id="delivery-address" style="width:100%;min-height:58px;margin-top:9px;border:1px solid var(--qg-line);border-radius:13px;padding:10px" placeholder="รายละเอียดที่อยู่">${esc(u.address||'')}</textarea></section>
      <section class="qg-checkout-card"><div class="qg-checkout-head"><b>รายการอาหาร</b></div>${cart.items.map(i=>`<div style="display:flex;justify-content:space-between;font-size:12px;padding:6px 0"><span>${esc(i.name)} × ${esc(i.qty)}</span><b>฿${Number(i.price||0)*Number(i.qty||0)}</b></div>`).join('')}</section>
      <section class="qg-checkout-card"><div class="qg-checkout-head"><b>วิธีชำระเงิน</b></div><div class="qg-payment-row"><span>เก็บเงินปลายทาง (COD)</span>${qgIcon('chevron',18)}</div></section>
      <section class="qg-summary"><div class="qg-summary-row"><span>รวมราคาอาหาร</span><b>฿${subtotal}</b></div><div class="qg-summary-row"><span>ค่าส่ง</span><span id="delivery-fee-display">กำลังคำนวณ...</span></div><div class="qg-summary-total"><span>ยอดรวมทั้งหมด</span><span id="checkout-total-display">฿${subtotal}</span></div></section>
      <details class="qg-camera-mini"><summary>ยืนยันตัวตนก่อนสั่งซื้อ</summary><div class="qg-camera-inner"><div class="qt-livecam-box"><video id="co-verify-video" autoplay playsinline muted></video><div id="co-verify-guide" class="qt-livecam-guide"></div></div><canvas id="co-verify-canvas" style="display:none"></canvas><div id="co-verify-status" class="qt-livecam-status">กำลังเปิดกล้อง...</div></div></details>
      <div id="checkout-error" class="qt-checkout-error" role="alert" hidden></div>
      <button id="checkout-confirm-btn" type="button" hidden disabled onclick="qtSubmitCheckoutOrder()">ยืนยัน</button>
      <div id="checkout-confirm-slide" class="qg-slide-wrap">${qtSlideConfirm('checkout-confirm-slide-inner','เลื่อนเพื่อยืนยันการสั่งซื้อ','qtSubmitCheckoutOrder()')}</div>
    </section>`);
    const hidden=document.getElementById('checkout-confirm-btn');

    const update=()=>{if(!hidden||!slide)return;const inner=slide.querySelector('.qt-slide-confirm');if(!inner)return;inner.classList.toggle('qt-slide-locked',hidden.disabled||qtCheckoutSubmitting||!!window.QT_CHECKOUT_UNCERTAIN);};
    window.QT_CHECKOUT_UNCERTAIN=false;
    const oldSet=window.QT_CAM_CAPTURES;
    qtStartCheckoutFaceCam();
    let picked={lat:Number(u.lat)||13.7563,lng:Number(u.lng)||100.5018};
    window.__checkoutSubtotal=subtotal;window.__checkoutShop=shop;
    const refresh=(lat,lng)=>{const d=distanceKm(shop.lat,shop.lng,lat,lng),fee=computeDeliveryFee(d);window.__checkoutFee=fee;const f=document.getElementById('delivery-fee-display'),t=document.getElementById('checkout-total-display');if(f)f.textContent=`฿${fee} • ${d.toFixed(1)} กม.`;if(t)t.textContent=`฿${subtotal+fee}`;};

    window.__currentPicker=picker;window.__pickedLoc=()=>picked;refresh(picked.lat,picked.lng);
    setTimeout(()=>{try{picker.locate()}catch(e){}},120);
    const timer=setInterval(()=>{update();if(!document.getElementById('checkout-confirm-slide'))clearInterval(timer)},250);

      ${mapAvailable?`<div class="qg-map-card"><div style="font-weight:800;font-size:14px;padding:2px 4px 9px">ตำแหน่งการจัดส่ง</div><div id="tracking-map" class="map-box"></div></div>`:''}
      ${o.status==='pending_shop'&&shop?.phone?`<a class="qg-secondary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:10px" href="tel:${esc(shop.phone)}">โทรหาร้าน</a>`:''}

  // Preserve backend/order logic; only change the presentation and add the success handoff.
  if(!window.__qgConfirmWrapped){
    const originalConfirm=window.confirmOrder;
    window.confirmOrder=async function(){
      const u=currentUser(), beforeIds=new Set(dbGet('qt_orders',[]).map(x=>x.id)), cart=u?qtGetCart():null, note=cart?.note||'';
      await originalConfirm();
      const orders=dbGet('qt_orders',[]);

      if(created){
        if(note){created.note=note;const arr=orders.map(x=>x.id===created.id?created:x);QT_DB_CACHE.qt_orders=arr;try{const token=await qtGetAccessToken();if(token)await qtSupabaseTable('orders?id=eq.'+encodeURIComponent(created.id),{method:'PATCH',accessToken:token,body:{note}});}catch(e){console.warn('[QueueGo UI] note save failed',e);}}
