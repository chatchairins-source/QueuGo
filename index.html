<body>
<div id="root"></div>
<div id="toast"></div>
<script>
'use strict';
/* ===== 1) Connection (same Supabase project and endpoints as the old app) ===== */
const CFG={URL:'https://pkypiqhlrmzocysgeqew.supabase.co',KEY:'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'};
const hdr=t=>{const h={apikey:CFG.KEY,'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;return h};
async function auth(path,body){
  const r=await fetch(CFG.URL+'/auth/v1/'+path,{method:'POST',headers:hdr(),body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'AUTH_ERROR');
  return d;
}
async function db(path,o={}){
  const m=(o.method||'GET').toUpperCase(),h=hdr(o.token===undefined?await token():o.token);
  if(m!=='GET')h.Prefer='return=representation';
  const r=await fetch(CFG.URL+'/rest/v1/'+path,{method:m,headers:h,body:o.body?JSON.stringify(o.body):undefined});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((d&&(d.message||d.hint))||'DB_ERROR_'+r.status);
  return d;
}
/* ===== 2) Session (same storage key and fields, so existing logins keep working) ===== */
const SKEY='qg_customer_session_v1';
const S={get(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}},
  set(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}},
  clear(){try{localStorage.removeItem(SKEY)}catch(e){}}};
let refreshing=null;
async function token(force){
  const s=S.get();if(!s||!s.accessToken)return '';
  if(!(force||(s.expiresAt&&s.expiresAt-Date.now()<60000))||!s.refreshToken)return s.accessToken;
  refreshing=refreshing||(async()=>{
    try{
      const d=await auth('token?grant_type=refresh_token',{refresh_token:s.refreshToken});
      const n={...s,accessToken:d.access_token,refreshToken:d.refresh_token||s.refreshToken,expiresAt:Date.now()+(d.expires_in||3600)*1000};
      S.set(n);return n.accessToken;
    }catch(e){return s.accessToken}finally{refreshing=null}
  })();
  return refreshing;
}
const emailOf=p=>String(p||'').replace(/\D/g,'')+'@auth.queuetech.local';
async function login(v,pw){
  const d=await auth('token?grant_type=password',{email:v.includes('@')?v:emailOf(v),password:pw});
  const rows=await db('users?select=*&auth_user_id=eq.'+d.user.id,{token:d.access_token});
  const me=Array.isArray(rows)&&rows[0]||null;
  if((me?.role||d.user?.user_metadata?.role||'customer')!=='customer')throw new Error('บัญชีนี้เป็นบัญชีของส่วนอื่น กรุณาใช้แอปของบัญชีนั้น');
  S.set({role:'customer',userId:me?.id||d.user.id,authUserId:d.user.id,name:me?.name||'',phone:me?.phone||'',
    accessToken:d.access_token,refreshToken:d.refresh_token,expiresAt:Date.now()+(d.expires_in||3600)*1000});
}
async function register({name,phone,password,lat,lng}){
  await auth('signup',{email:emailOf(phone),password,data:{name,phone,role:'customer',latitude:lat,longitude:lng}});
  await login(phone,password);
}
/* ===== 3) Helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH');
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)};
const P={home:'<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4v-9Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',orders:'<path d="M7 3h10v18l-2-1.5-3 1.5-3-1.5L7 21V3Z"/><path d="M10 8h4M10 12h4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
  back:'<path d="M15 5 8 12l7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3M21 5v14a2 2 0 0 1-2 2h-5"/>',
  utensils:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3v18M14 3v7h6"/>',drink:'<path d="M7 3h10l-1 18H8L7 3Z"/><path d="M8 7h8"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>'};
const ico=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]||P.grid}</svg>`;
const ini=n=>esc(String(n||'?').trim().charAt(0));
const photo=(src,name)=>`<div class="ph">${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}${src?'':ini(name)}</div>`;
const CATS={food:'อาหาร',cafe:'เครื่องดื่ม',grocery:'ของใช้',other:'อื่นๆ'};
const CICON={food:'utensils',cafe:'drink',grocery:'bag',other:'grid'};
/* cart lives in memory only */
let cart={shopId:null,items:[]},shops=null,q='',cat='all';
const cartN=()=>cart.items.reduce((a,i)=>a+i.qty,0);
const cartTotal=()=>cart.items.reduce((a,i)=>a+i.price*i.qty,0);
/* ===== 4) Data (same tables) ===== */
async function loadShops(){
  if(shops)return shops;
  const [list,st]=await Promise.all([
    db('shop_profiles?select=id,shop_name,status,public_category,public_logo,public_cover,public_open_time,public_close_time,public_description,address,latitude,longitude,delivery_enabled'),
    db('shop_open_states?select=shop_id,is_open,resume_at').catch(()=>[])]);
  const m=new Map((st||[]).map(s=>[String(s.shop_id),s]));
  shops=(list||[]).filter(s=>!s.status||s.status==='active'||s.status==='approved')
    .map(s=>({...s,open:m.has(String(s.id))?m.get(String(s.id)).is_open!==false:true}));
  return shops;
}
const loadMenu=id=>db('products?select=id,shop_id,name,description,price,delivery_price,image,available,delivery_available&shop_id=eq.'+encodeURIComponent(id));
const uuid=()=>crypto.randomUUID();
const STATUS_LABEL={pending:'รอร้านรับ',accepted:'ร้านรับแล้ว',preparing:'กำลังเตรียม',ready:'ค้นหาไรเดอร์',assigned:'ไรเดอร์รับงาน',picked_up:'รับสินค้าแล้ว',in_progress:'กำลังจัดส่ง',completed:'ส่งสำเร็จ',cancelled:'ยกเลิก'};
async function loadShopProfile(id){const rows=await db('shop_profiles?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1');return Array.isArray(rows)?rows[0]:null}
async function loadOrderItems(id){return await db('order_items?select=*&order_id=eq.'+encodeURIComponent(id)+'&order=created_at.asc').catch(()=>[])}
async function activeOrder(){
  const u=S.get();if(!u)return null;
  const rows=await db('orders?select=*&customer_id=eq.'+encodeURIComponent(u.userId)+'&status=in.(pending,accepted,preparing,ready,assigned,picked_up,in_progress)&order=created_at.desc&limit=1');
  return Array.isArray(rows)&&rows[0]||null;
}
function orderNo(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return 'QT-'+y+m+day+'-'+Math.floor(Math.random()*10000).toString().padStart(4,'0')}
async function placeOrder(){
  const u=S.get();if(!u)return go('login');
  if(!cart.items.length)return toast('ตะกร้าว่าง');
  const old=await activeOrder();if(old){toast('มีออเดอร์ที่กำลังดำเนินการอยู่');return go('order/'+old.id)}
  const shop=await loadShopProfile(cart.shopId);if(!shop)return toast('ไม่พบข้อมูลร้านค้า');
  const address=($('delivery-address')?.value||'').trim();if(!address)return toast('กรุณาระบุที่อยู่จัดส่ง');
  const id=uuid(),subtotal=cartTotal(),deliveryFee=Number(shop.delivery_fee||0),total=subtotal+deliveryFee;
  const order={id,order_number:orderNo(),customer_id:u.userId,shop_id:shop.id,order_type:'shopping',status:'pending',subtotal,delivery_fee:deliveryFee,total_amount:total,pickup_address:shop.address||null,pickup_latitude:shop.latitude??null,pickup_longitude:shop.longitude??null,delivery_address:address,note:'__QT_ORDER_STATUS__=pending_shop',created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  try{
    await db('orders',{method:'POST',body:order});
    for(const i of cart.items)await db('order_items',{method:'POST',body:{id:uuid(),order_id:id,item_type:'product',item_name:i.name,quantity:i.qty,unit_price:i.price,total_price:i.qty*i.price,created_at:new Date().toISOString()}});

/* ===== Proven QueueGo location-picker core (legacy behavior, clean UI) ===== */
let currentPos=null,customerLocationPicker=null;
function qgIsValidCoordinate(latitude,longitude,thailandOnly=false){
  if(latitude===null||latitude===undefined||longitude===null||longitude===undefined||latitude===''||longitude==='') return false;
  const lat=Number(latitude),lng=Number(longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)||(lat===0&&lng===0)||lat < -90||lat > 90||lng < -180||lng > 180) return false;
  return !thailandOnly || (lat>=5&&lat<=21&&lng>=97&&lng<=106);
}
function tileLayer(map){L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map)}
function initLocationPicker(containerId,lat,lng,onChange){
  const hasInitial=qgIsValidCoordinate(lat,lng,true),viewLat=hasInitial?Number(lat):15,viewLng=hasInitial?Number(lng):101;
  const map=L.map(containerId).setView([viewLat,viewLng],hasInitial?15:6);tileLayer(map);
  let marker=hasInitial?L.marker([viewLat,viewLng],{draggable:true}).addTo(map):null;
  const ensureMarker=point=>{if(marker)marker.setLatLng(point);else{marker=L.marker(point,{draggable:true}).addTo(map);marker.on('dragend',()=>{const p=marker.getLatLng();if(qgIsValidCoordinate(p.lat,p.lng,true))onChange(p.lat,p.lng)})}};
  if(marker)marker.on('dragend',()=>{const p=marker.getLatLng();if(qgIsValidCoordinate(p.lat,p.lng,true))onChange(p.lat,p.lng)});
  map.on('click',e=>{if(!qgIsValidCoordinate(e.latlng.lat,e.latlng.lng,true))return toast('กรุณาเลือกพิกัดที่อยู่ในประเทศไทย');ensureMarker(e.latlng);onChange(e.latlng.lat,e.latlng.lng)});
  if(hasInitial)onChange(viewLat,viewLng);
  return {map,locate(){if(!navigator.geolocation)return toast('เบราว์เซอร์ไม่รองรับ GPS');navigator.geolocation.getCurrentPosition(pos=>{const {latitude,longitude}=pos.coords;if(!qgIsValidCoordinate(latitude,longitude,true))return toast('พิกัด GPS ไม่ถูกต้อง กรุณาลองใหม่');map.setView([latitude,longitude],16);ensureMarker([latitude,longitude]);onChange(latitude,longitude);toast('ใช้ตำแหน่ง GPS ปัจจุบันแล้ว')},err=>toast(err?.code===1?'กรุณาเปิดการเข้าถึงตำแหน่ง':err?.code===3?'รับตำแหน่งไม่ทันเวลา กรุณาลองใหม่':'ไม่สามารถรับตำแหน่ง GPS ได้'),{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}};
}
async function qtReverseGeocodeCustomer(lat,lng){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1&accept-language=th`,{headers:{Accept:'application/json'}});if(!r.ok)return '';const j=await r.json(),a=j.address||{};return [a.house_number,a.road,a.suburb||a.neighbourhood,a.village||a.town||a.city,a.state].filter(Boolean).join(' ')||j.display_name||''}catch(e){return ''}}
async function openCustomerLocationPicker(){
  const u=session();
  layout(`<div class="pt"><button class="back" onclick="history.back()">${ico('back')}</button><h1>เลือกที่อยู่จัดส่ง</h1></div><section class="card"><p class="muted">ปักหมุดตำแหน่งรับสินค้า แล้วระบุรายละเอียดที่อยู่ด้านล่าง</p><div id="customer-location-map" class="mapbox" style="height:300px"></div><button class="prim" style="margin-top:12px" onclick="customerLocationPicker&&customerLocationPicker.locate()">ใช้ตำแหน่ง GPS ปัจจุบัน</button><div class="dist">Lat: <span id="customer-lat">--</span> · Lng: <span id="customer-lng">--</span></div><textarea id="customer-address-input" placeholder="บ้านเลขที่ หมู่บ้าน ซอย ถนน หรือจุดสังเกต" style="width:100%;min-height:82px;margin-top:10px"></textarea><button class="prim" style="margin-top:12px" onclick="saveCustomerLocationPicker()">บันทึกที่อยู่นี้</button></section>`,'home');
  let picked=null;
  customerLocationPicker=initLocationPicker('customer-location-map',currentPos?.lat,currentPos?.lng,async(lat,lng)=>{picked=currentPos={lat,lng};$('customer-lat').textContent=lat.toFixed(6);$('customer-lng').textContent=lng.toFixed(6);const t=await qtReverseGeocodeCustomer(lat,lng);if(t)$('customer-address-input').value=t});
  window.__customerPickedLocation=()=>picked;
  setTimeout(()=>customerLocationPicker.map.invalidateSize(),80);

async function saveCustomerLocationPicker(){
  const p=window.__customerPickedLocation?.();if(!p)return toast('กรุณาเลือกตำแหน่ง');

}

${c.length?`<section class="sec"><div class="cats">${c.map(k=>`<button class="cat" onclick="cat='${esc(k)}';go('search')"><i>${ico(CICON[k]||'grid',25)}</i><b>${esc(CATS[k]||k)}</b></button>`).join('')}<button class="cat" onclick="go('market')"><i>${ico('grid',25)}</i><b>ตลาดสด</b></button><button class="cat" onclick="go('map')"><i>${ico('pin',25)}</i><b>แผนที่</b></button></div></section>`:''}

<section class="sec"><div class="st"><h2>ร้านใกล้คุณ</h2><button class="lk" onclick="go('search')">ดูทั้งหมด</button></div>
<div class="list">${list.length?list.map(shopCard).join(''):'<p class="empty">ยังไม่มีร้านค้า</p>'}</div></section>`,'home');
};
V.search=async()=>{
  const list=await loadShops();
  const draw=()=>{const k=q.toLowerCase();return list.filter(s=>(cat==='all'||s.public_category===cat)&&(!k||String(s.shop_name||'').toLowerCase().includes(k)))};
  layout(`<div style="padding-top:12px"><input class="in" id="sq" placeholder="ค้นหาร้านค้า" value="${esc(q)}" style="margin-bottom:0">
<div class="cats" style="padding:12px 0 4px">${['all',...Object.keys(CATS)].map(k=>`<button class="cat" style="flex:none;width:auto" onclick="cat='${k}';V.search()"><b style="margin:0;padding:8px 13px;border-radius:99px;font-size:11px;border:1px solid ${cat===k?'var(--red)':'#ddd'};background:${cat===k?'var(--red)':'#fff'};color:${cat===k?'#fff':'#333'}">${k==='all'?'ทั้งหมด':CATS[k]}</b></button>`).join('')}</div>
<div class="list" id="sr" style="margin-top:8px">${draw().map(shopCard).join('')||'<p class="empty">ไม่พบร้านค้า</p>'}</div></div>`,'search');
  $('sq').oninput=e=>{q=e.target.value.trim();$('sr').innerHTML=draw().map(shopCard).join('')||'<p class="empty">ไม่พบร้านค้า</p>'};
};
V.shop=async id=>{
  const s=(await loadShops()).find(x=>String(x.id)===String(id));
  if(!s)return layout('<p class="empty">ไม่พบร้านค้า</p>','home');
  const items=((await loadMenu(id))||[]).filter(p=>p.available!==false);
  layout(`<div class="cover">${s.public_cover?`<img src="${esc(s.public_cover)}" alt="" onerror="this.remove()">`:''}
<div class="ca"><button class="ic" onclick="history.back()" aria-label="กลับ">${ico('back')}</button></div></div>
<div class="intro"><h1>${esc(s.shop_name)}</h1><p><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.address?`<span>${esc(s.address)}</span>`:''}</p>
<span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div>
<div style="margin-top:6px">${items.length?items.map(p=>`<div class="mi">${photo(p.image,p.name)}<div class="mc"><b>${esc(p.name)}</b><p>${esc(p.description||'')}</p><div class="pr">${baht(p.price)}</div></div>
<button class="plus" ${s.open?'':'disabled'} aria-label="เพิ่ม" onclick="add('${esc(id)}','${esc(p.id)}')">${ico('plus',19)}</button></div>`).join(''):'<p class="empty">ยังไม่มีเมนู</p>'}</div>
${cart.shopId==id&&cartN()?`<div class="fcart" onclick="go('cart')"><b>ดูตะกร้า · ${cartN()} รายการ</b><span>${baht(cartTotal())}</span></div>`:''}`,'home');
  window._menu=items;
};
V.market=async()=>{
  const list=await loadShops();
  const market=list.filter(s=>{const k=String(s.public_category||'').toLowerCase(),n=String(s.shop_name||'').toLowerCase();return ['grocery','market','fresh','fresh_market'].includes(k)||n.includes('ตลาด')});
  layout(`<div class="marketHero"><h1>QueueGo Market</h1><p>ตลาดสดใกล้คุณ — เลือกร้านแล้วสั่งจากร้านโดยตรง</p><div class="marketActions"><button onclick="go('map')">ดูแผนที่</button><button onclick="go('search')">ค้นหาร้าน</button></div></div><section class="sec"><div class="st"><h2>ร้านในตลาด</h2></div><div class="list">${market.length?market.map(shopCard).join(''):'<p class="empty">ยังไม่มีร้านตลาดที่เปิดให้บริการ</p>'}</div></section>`,'home');
};
V.map=()=>openCustomerLocationPicker();
V.cart=()=>{
  layout(`<div class="pt"><button class="back" onclick="history.back()">${ico('back')}</button><h1>ตะกร้าสินค้า</h1></div>`+
  (cart.items.length?cart.items.map((i,x)=>`<div class="ci">${photo(i.image,i.name)}<div class="mc"><b>${esc(i.name)}</b><div class="pr" style="margin-top:3px">${baht(i.price)}</div>
<div class="qty"><button onclick="chg(${x},-1)">−</button><strong>${i.qty}</strong><button onclick="chg(${x},1)">+</button></div></div></div>`).join('')+
  `<div class="sum"><div class="sr"><span>ค่าอาหาร</span><span>${baht(cartTotal())}</span></div><div class="tot"><span>รวม</span><span>${baht(cartTotal())}</span></div></div>
<button class="prim" onclick="go('checkout')">ไปชำระเงิน</button>`:'<p class="empty">ตะกร้าว่าง</p>'),'cart');
};
V.checkout=async()=>{if(!cart.items.length)return go('cart');const s=await loadShopProfile(cart.shopId);layout(`<div class="pt"><button class="back" onclick="history.back()">${ico('back')}</button><h1>ยืนยันคำสั่งซื้อ</h1></div><div class="card" style="margin-top:0"><b>${esc(s?.shop_name||'ร้านค้า')}</b><p class="sm">ชำระเงินสด • ระบบเดลิเวอรี่ QueueGo</p><textarea class="ta" id="delivery-address" placeholder="ที่อยู่/จุดสังเกตสำหรับจัดส่ง"></textarea></div><div class="sum"><div class="sr"><span>ค่าสินค้า</span><span>${baht(cartTotal())}</span></div><div class="sr"><span>ค่าจัดส่ง</span><span>คำนวณตามร้าน/ระบบ</span></div><div class="tot"><span>ยอดสินค้า</span><span>${baht(cartTotal())}</span></div></div><button class="prim" id="place-order-btn" onclick="this.disabled=true;placeOrder().finally(()=>this.disabled=false)">ยืนยันสั่งซื้อ</button>`,'cart')};
V.order=async id=>{const rows=await db('orders?select=*&id=eq.'+encodeURIComponent(id)+'&limit=1'),o=Array.isArray(rows)&&rows[0];if(!o)return layout('<p class="empty">ไม่พบออเดอร์</p>','orders');const items=await loadOrderItems(id);const flow=['pending','accepted','preparing','ready','assigned','picked_up','in_progress','completed'],idx=flow.indexOf(o.status);layout(`<div class="pt"><button class="back" onclick="go('orders')">${ico('back')}</button><h1>#${esc(o.order_number||String(o.id).slice(0,8))}</h1></div><div class="card" style="margin-top:0"><b>${esc(STATUS_LABEL[o.status]||o.status)}</b><div class="statusflow">${flow.map((x,i)=>`<span class="${i<=idx?'on':''}">${esc(STATUS_LABEL[x])}</span>`).join('')}</div><p class="sm">${esc(o.delivery_address||'')}</p></div><div class="card"><b>รายการสินค้า</b>${(items||[]).map(i=>`<div class="sr"><span>${esc(i.item_name)} × ${i.quantity}</span><span>${baht(i.total_price)}</span></div>`).join('')}<div class="tot"><span>รวม</span><span>${baht(o.total_amount)}</span></div></div>`,'orders')};
V.orders=async()=>{
  const u=S.get();layout('<p class="empty">กำลังโหลด...</p>','orders');
  const rows=await db('orders?select=*&customer_id=eq.'+encodeURIComponent(u.userId)+'&order=created_at.desc&limit=30');
  layout(`<div class="pt"><h1>ออเดอร์ของฉัน</h1></div><div class="list">${(rows||[]).length?rows.map(o=>`<div class="oc" onclick="go('order/${esc(o.id)}')"><div class="oh"><span class="on">#${esc(o.order_number||String(o.id).slice(0,6))}</span><span class="sp">${esc(o.status||'')}</span></div>
<p>${new Date(o.created_at).toLocaleString('th-TH')}</p><b>${baht(o.total??o.total_amount??o.subtotal)}</b></div>`).join(''):'<p class="empty">ยังไม่มีออเดอร์</p>'}</div>`,'orders');
};
V.profile=()=>{
  const u=S.get()||{};
  layout(`<div class="pf"><div class="av">${ini(u.name)}</div><div><h1>${esc(u.name||'ลูกค้า')}</h1><p>${esc(u.phone||'')}</p><span class="acc">บัญชีลูกค้า</span></div></div>
<div class="pl"><button class="pw" onclick="go('orders')"><span class="i">${ico('orders')}</span><b>ออเดอร์ของฉัน</b></button>
<button class="pw" onclick="S.clear();cart={shopId:null,items:[]};go('login')"><span class="i">${ico('logout')}</span><b>ออกจากระบบ</b></button></div>`,'');
};
/* ===== 7) Cart actions ===== */
window.add=(sid,pid)=>{
  const p=(window._menu||[]).find(x=>String(x.id)===String(pid));if(!p)return;
  if(cart.items.length&&String(cart.shopId)!==String(sid)){if(!confirm('ตะกร้ามีสินค้าจากร้านอื่น ล้างตะกร้าเพื่อสั่งร้านนี้?'))return;cart.items=[]}
  cart.shopId=sid;const f=cart.items.find(i=>i.id===p.id);
  f?f.qty++:cart.items.push({id:p.id,name:p.name,price:Number(p.price),image:p.image||'',qty:1});
  toast('เพิ่มลงตะกร้าแล้ว');route();
};
window.chg=(x,d)=>{cart.items[x].qty+=d;if(cart.items[x].qty<1)cart.items.splice(x,1);route()};
/* ===== 8) Router ===== */
async function route(){
  const [pg,param]=(location.hash.slice(1)||'home').split('/');
  const ok=authed();
  if(!ok&&pg!=='login'&&pg!=='register')return go('login');
  if(ok&&(pg==='login'||pg==='register'))return go('home');
  if(!V[pg])return go('home');
  try{await V[pg](param);bind(pg)}
  catch(e){layout(`<div class="card"><b>โหลดข้อมูลไม่สำเร็จ</b><p class="sm" style="margin:6px 0 12px">${esc(e.message)}</p><button class="prim" onclick="shops=null;route()">ลองอีกครั้ง</button></div>`,'')}
}
function bind(pg){
  if(pg==='login')$('lb').onclick=async e=>{const b=e.target;b.disabled=true;try{await login($('lp').value.trim(),$('lw').value);go('home')}catch(x){toast(x.message)}finally{b.disabled=false}};
  if(pg==='register')$('rb').onclick=async e=>{
    const b=e.target,name=$('rn').value.trim(),phone=$('rp').value.trim(),password=$('rw').value;
    if(!name||phone.replace(/\D/g,'').length<9||password.length<6)return toast('กรอกข้อมูลให้ครบ');
    b.disabled=true;
    try{
      const pos=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000}):no());
      await register({name,phone,password,lat:pos.coords.latitude,lng:pos.coords.longitude});go('home');
    }catch(x){toast(x&&x.message?x.message:'ต้องอนุญาตตำแหน่งที่ตั้งเพื่อสมัคร')}finally{b.disabled=false}
  };
}
addEventListener('hashchange',route);
route();
</script>
