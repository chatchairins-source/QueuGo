<body>
<div id="root"></div>

<script>
'use strict';
/* ===== 1) Connection (same Supabase project and endpoints as the old app) ===== */
const CFG={URL:'https://pkypiqhlrmzocysgeqew.supabase.co',KEY:'sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre'};
const hdr=t=>{const h={apikey:CFG.KEY,'Content-Type':'application/json'};if(t)h.Authorization='Bearer '+t;return h};
async function auth(path,body){
  const r=await fetch(CFG.URL+'/auth/v1/'+path,{method:'POST',headers:hdr(),body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
  const d=await r.json().catch(e=>{if(e?.name==='AbortError'||e?.name==='TimeoutError')throw e;return {}});
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'AUTH_ERROR');
  return d;
}
async function db(path,o={}){
  const m=(o.method||'GET').toUpperCase(),h=hdr(o.token===undefined?await token():o.token);
  if(m!=='GET')h.Prefer='return=representation';
  const r=await fetch(CFG.URL+'/rest/v1/'+path,{method:m,headers:h,body:o.body?JSON.stringify(o.body):undefined,signal:AbortSignal.timeout(15000)});
  const d=await r.json().catch(e=>{if(e?.name==='AbortError'||e?.name==='TimeoutError')throw e;return null});
  if(!r.ok){const error=new Error((d&&(d.message||d.hint))||'DB_ERROR_'+r.status);error.status=r.status;throw error;}
  return d;
}
/* ===== 2) Session (same storage key and fields, so existing logins keep working) ===== */
const SKEY='qg_customer_session_v1';
const S={get(){try{return JSON.parse(localStorage.getItem(SKEY))}catch(e){return null}},
  set(s){try{localStorage.setItem(SKEY,JSON.stringify(s))}catch(e){}},
  clear(){try{localStorage.removeItem(SKEY)}catch(e){}}};
let refreshing=null;
async function token(force){
  const s=S.get();if(!s||!s.accessToken)return '';
  if(!(force||(s.expiresAt&&s.expiresAt-Date.now()<60000))||!s.refreshToken)return s.accessToken;
  refreshing=refreshing||(async()=>{
    try{
      const d=await auth('token?grant_type=refresh_token',{refresh_token:s.refreshToken});
      if(S.get()?.authUserId!==s.authUserId||S.get()?.refreshToken!==s.refreshToken)return '';
      const n={...s,accessToken:d.access_token,refreshToken:d.refresh_token||s.refreshToken,expiresAt:Date.now()+(d.expires_in||3600)*1000};
      S.set(n);return n.accessToken;
    }catch(e){return S.get()?.authUserId===s.authUserId&&S.get()?.refreshToken===s.refreshToken?s.accessToken:''}finally{refreshing=null}
  })();
  return refreshing;
}
const emailOf=p=>String(p||'').replace(/\D/g,'')+'@auth.queuetech.local';
async function login(v,pw){
  const guestCart=cart,guestMarketCart=marketCart;
  const d=await auth('token?grant_type=password',{email:v.includes('@')?v:emailOf(v),password:pw});
  const rows=await db('users?select=*&auth_user_id=eq.'+d.user.id,{token:d.access_token});
  const me=Array.isArray(rows)&&rows[0]||null;
  if(!me||me.role!=='customer')throw new Error('ไม่พบบัญชีลูกค้าที่ใช้งานได้ กรุณาใช้แอปตามประเภทบัญชีหรือติดต่อฝ่ายช่วยเหลือ');
  if(me.status!=='active')throw new Error('บัญชีนี้ยังไม่พร้อมใช้งาน กรุณาติดต่อฝ่ายช่วยเหลือ');
  S.set({role:'customer',userId:me.id,authUserId:d.user.id,name:me?.name||'',phone:me?.phone||'',
    accessToken:d.access_token,refreshToken:d.refresh_token,expiresAt:Date.now()+(d.expires_in||3600)*1000});
  cart=readCart();if(!cart.items.length&&guestCart.items.length){cart=guestCart;saveCart();localStorage.removeItem('qt_cart_guest')}marketCart=readMarketCart();if(!marketCart.items.length&&guestMarketCart.items.length){marketCart=guestMarketCart;saveMarketCart();localStorage.removeItem('qg_market_cart_guest')}
}
async function register({name,phone,password,lat,lng}){
  await auth('signup',{email:emailOf(phone),password,data:{name,phone,role:'customer',latitude:lat,longitude:lng}});
  await login(phone,password);
}
/* ===== 3) Helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n||0).toLocaleString('th-TH');
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2400)};
const P={home:'<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4v-9Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',orders:'<path d="M7 3h10v18l-2-1.5-3 1.5-3-1.5L7 21V3Z"/><path d="M10 8h4M10 12h4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
  back:'<path d="M15 5 8 12l7 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3M21 5v14a2 2 0 0 1-2 2h-5"/>',
  utensils:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3v18M14 3v7h6"/>',drink:'<path d="M7 3h10l-1 18H8L7 3Z"/><path d="M8 7h8"/>',basket:'<path d="M4 10h16l-2 10H6L4 10Z"/><path d="m7 10 3-6m7 6-3-6M8 14h8M9 17h6"/>',bottle:'<path d="M9 3h6v4l2 3v10H7V10l2-3V3Z"/><path d="M9 7h6M7 12h10"/>',grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>'};
const ico=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24">${P[n]||P.grid}</svg>`;
const ini=n=>esc(String(n||'?').trim().charAt(0));
const photo=(src,name)=>`<div class="ph">${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}${src?'':ini(name)}</div>`;
const CATS={food:'อาหาร',cafe:'เครื่องดื่ม',grocery:'ร้านขายของชำ',other:'อื่นๆ'};
const CICON={food:'utensils',cafe:'drink',grocery:'bottle',other:'grid'};
const DEDICATED_MARKET_CATS=new Set(['market','fresh','fresh_market','meat','fish','vegetable','fruit']);
const MARKET_CATEGORY_LABELS={
  meat:'เนื้อสัตว์',seafood:'ปลา / อาหารทะเล',vegetable:'ผักสด',fruit:'ผลไม้',
  egg_tofu_fresh:'ไข่ / เต้าหู้ / ของสด',seasoning_herb:'เครื่องปรุง / สมุนไพร',
  rice_dry:'ข้าว / ของแห้ง / ธัญพืช',processed_ready_to_cook:'อาหารแปรรูป / พร้อมปรุง',
  prepared_food:'อาหารทำสำเร็จจากตลาด',dessert:'ขนม / ของหวาน',local:'ของพื้นบ้าน / สินค้าชุมชน',
  other_market:'อื่นๆ ในตลาดสด'
};
function marketCategoryKey(raw,name){
  const s=(String(raw||'')+' '+String(name||'')).toLocaleLowerCase('th');
  if(/seafood|fish|ปลา|กุ้ง|ปู|หมึก|หอย/.test(s))return 'seafood';
  if(/meat|pork|chicken|beef|หมู|ไก่|เป็ด|เนื้อ|เครื่องใน/.test(s))return 'meat';
  if(/vegetable|veg|ผัก|เห็ด|หน่อไม้/.test(s))return 'vegetable';
  if(/fruit|ผลไม้/.test(s))return 'fruit';
  if(/egg|tofu|ไข่|เต้าหู้/.test(s))return 'egg_tofu_fresh';
  if(/season|herb|spice|เครื่องปรุง|สมุนไพร|กระเทียม|พริก|หอม|ข่า|ตะไคร้|น้ำปลา|เครื่องแกง/.test(s))return 'seasoning_herb';
  if(/rice|dry|grain|ข้าว|ของแห้ง|ธัญพืช|ถั่ว|เส้น/.test(s))return 'rice_dry';
  if(/processed|ready.?to.?cook|ลูกชิ้น|ไส้กรอก|หมัก|แช่แข็ง|พร้อมปรุง/.test(s))return 'processed_ready_to_cook';
  if(/prepared|ready.?to.?eat|กับข้าว|น้ำพริก|ของทอด|พร้อมทาน/.test(s))return 'prepared_food';
  if(/dessert|bakery|ขนม|ของหวาน/.test(s))return 'dessert';
  if(/local|community|พื้นบ้าน|ชุมชน/.test(s))return 'local';
  return 'other_market';
}
/* cart persistence restored from the previous working Customer flow */
const cartKey=()=>S.get()?.userId?'qt_cart_'+S.get().userId:'qt_cart_guest';
function readCart(){

  if(values.some(v=>!v))return NaN;

function deliveryFeeFor(shop,loc){
  const radians=n=>n*Math.PI/180,a=Math.sin(radians(loc.lat-Number(shop.latitude))/2)**2+Math.cos(radians(Number(shop.latitude)))*Math.cos(radians(loc.lat))*Math.sin(radians(loc.lng-Number(shop.longitude))/2)**2;
  const km=6371*2*Math.asin(Math.sqrt(Math.min(1,Math.max(0,a))));
  if(!Number.isFinite(km))throw Error('ไม่พบพิกัดร้าน กรุณาเลือกร้านใหม่');
  return km<=5?30:km<=6?40:km<=7?50:50+Math.ceil(km-7)*10;
}

function qgIsValidCoordinate(latitude,longitude,thailandOnly=false){
  if(latitude===null||latitude===undefined||longitude===null||longitude===undefined||latitude===''||longitude==='') return false;
  const lat=Number(latitude),lng=Number(longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)||(lat===0&&lng===0)||lat < -90||lat > 90||lng < -180||lng > 180) return false;
  return !thailandOnly || (lat>=5&&lat<=21&&lng>=97&&lng<=106);
}
function calculateDistanceKm(customerLat,customerLng,shopLat,shopLng){
  if(!qgIsValidCoordinate(customerLat,customerLng,true)||!qgIsValidCoordinate(shopLat,shopLng,true))return NaN;
  const lat1=Number(customerLat),lon1=Number(customerLng),lat2=Number(shopLat),lon2=Number(shopLng),R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

  const host=document.getElementById(containerId),hasInitial=qgIsValidCoordinate(lat,lng,true),viewLat=hasInitial?Number(lat):15,viewLng=hasInitial?Number(lng):101;
  if(!host||typeof longdo==='undefined'){toast('แผนที่ยังไม่พร้อม กรุณาลองใหม่');return {map:null,destroy(){},locate(){toast('แผนที่ยังไม่พร้อม กรุณาลองใหม่')}}}
  const map=customerPickerMap||(customerPickerMap=new longdo.Map({placeholder:host,ui:window.longdo.UiComponent.Mobile}));
  if(map.placeholder().parentNode!==host)host.replaceChildren(map.placeholder());map.pause(false);map.resize();try{map.Ui.LayerSelector.visible(false)}catch(e){}
  map.location({lat:viewLat,lon:viewLng},true);map.zoom(hasInitial?15:6,true);
  let disposed=false,marker=null;
  const setPoint=(plat,plng,notify=true)=>{if(disposed||!qgIsValidCoordinate(plat,plng,true))return false;if(marker)try{map.Overlays.remove(marker)}catch(e){};marker=qgLongdoPin({lat:Number(plat),lon:Number(plng)});map.Overlays.add(marker);if(notify)onChange(Number(plat),Number(plng));return true};
  const syncCenter=()=>{if(disposed)return;const p=map.location();if(p&&qgIsValidCoordinate(p.lat,p.lon,true))setPoint(p.lat,p.lon,true)};
  try{map.Event.bind('drop',syncCenter)}catch(e){}
  if(hasInitial)setPoint(viewLat,viewLng,true);
  return {map,destroy(){if(disposed)return;disposed=true;map.Event.unbind('drop',syncCenter);map.Overlays.clear();map.pause(true);map.placeholder().remove()},locate(){if(disposed)return;if(!navigator.geolocation)return toast('เบราว์เซอร์ไม่รองรับ GPS');navigator.geolocation.getCurrentPosition(pos=>{if(disposed)return;const {latitude,longitude}=pos.coords;if(!qgIsValidCoordinate(latitude,longitude,true))return toast('พิกัด GPS ไม่ถูกต้อง กรุณาลองใหม่');map.location({lat:latitude,lon:longitude},true);map.zoom(16,true);setPoint(latitude,longitude,true);toast('ใช้ตำแหน่ง GPS ปัจจุบันแล้ว')},err=>{if(disposed)return;toast(err?.code===1?'กรุณาเปิดการเข้าถึงตำแหน่ง':err?.code===3?'รับตำแหน่งไม่ทันเวลา กรุณาลองใหม่':'ไม่สามารถรับตำแหน่ง GPS ได้')},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}};
}
async function qtReverseGeocodeCustomer(lat,lng){
  try{const r=await fetch(`https://api.longdo.com/map/services/address?lon=${encodeURIComponent(lng)}&lat=${encodeURIComponent(lat)}&key=347649ca13f49db0d8a599ae35f8de2b`,{signal:AbortSignal.timeout(8000)});if(!r.ok)return '';const a=await r.json();return [a.house_number,a.soi,a.road,a.subdistrict,a.district,a.province,a.postcode].filter(Boolean).join(' ')}catch(e){return ''}
}
async function openCustomerLocationPicker(){
  const u=S.get();
  layout(`<div class="pt"><button class="back" onclick="history.back()">${ico('back')}</button><h1>เลือกที่อยู่จัดส่ง</h1></div><section class="card"><p class="muted">ปักหมุดตำแหน่งรับสินค้า แล้วระบุรายละเอียดที่อยู่ด้านล่าง</p><div id="customer-location-map" class="mapbox" style="height:150px"></div><button style="margin-top:12px;padding:7px 11px;width:auto;border:1px solid #d1d5db;border-radius:9px;background:transparent;color:inherit;font-size:12px;font-weight:600" onclick="customerLocationPicker&&customerLocationPicker.locate()">ใช้ตำแหน่ง GPS ปัจจุบัน</button><div class="dist">Lat: <span id="customer-lat">--</span> · Lng: <span id="customer-lng">--</span></div><textarea id="customer-address-input" placeholder="บ้านเลขที่ หมู่บ้าน ซอย ถนน หรือจุดสังเกต" style="width:100%;min-height:82px;margin-top:10px">${esc(currentPos?.address||'')}</textarea><button class="prim" style="margin-top:12px" onclick="saveCustomerLocationPicker()">บันทึกที่อยู่นี้</button></section>`,'home');
  let picked=null,locationVersion=0,lastAutoAddress=null;
  customerLocationPicker=initLocationPicker('customer-location-map',currentPos?.lat,currentPos?.lng,async(lat,lng)=>{picked={lat,lng};currentPos={...currentPos,lat,lng};$('customer-lat').textContent=lat.toFixed(6);$('customer-lng').textContent=lng.toFixed(6);const version=++locationVersion,field=$('customer-address-input'),previous=field.value;if(previous&&previous!==lastAutoAddress)return;const t=await qtReverseGeocodeCustomer(lat,lng);if(t&&version===locationVersion&&field.isConnected&&field.value===previous){field.value=t;lastAutoAddress=t}});
  window.__customerPickedLocation=()=>picked;
  const picker=customerLocationPicker;setTimeout(()=>{if(customerLocationPicker===picker)picker.map?.resize()},80);
}
async function saveCustomerLocationPicker(){
  const p=window.__customerPickedLocation?.();if(!p)return toast('กรุณาเลือกตำแหน่ง');
  const field=$('customer-address-input'),address=field?.value.trim()||'',u=S.get(),sameActor=()=>S.get()?.userId===u?.userId&&S.get()?.authUserId===u?.authUserId;
  if(!qgIsValidCoordinate(p.lat,p.lng,true))return toast('พิกัดไม่ถูกต้อง');
  try{
    if(u?.userId){
      const accessToken=await token();if(!sameActor()||!field.isConnected)return;
      const rows=await db('users?select=metadata&id=eq.'+encodeURIComponent(u.userId)+'&limit=1',{token:accessToken});if(!sameActor()||!field.isConnected)return;
      const metadata={...((rows?.[0]?.metadata&&typeof rows[0].metadata==='object')?rows[0].metadata:{}),lat:Number(p.lat),lng:Number(p.lng),address};
      await db('users?id=eq.'+encodeURIComponent(u.userId),{method:'PATCH',token:accessToken,body:{metadata,updated_at:new Date().toISOString()}});
    }
    if(!sameActor()||!field.isConnected)return;
    localStorage.setItem('qg_customer_delivery_location',JSON.stringify({lat:p.lat,lng:p.lng,address}));
    currentPos={lat:p.lat,lng:p.lng,address};toast('บันทึกที่อยู่จัดส่งแล้ว');go('home');
  }catch(e){toast('บันทึกที่อยู่ไม่สำเร็จ: '+String(e.message||e).slice(0,90))}
}
try{const saved=JSON.parse(localStorage.getItem('qg_customer_delivery_location')||'null');if(saved&&qgIsValidCoordinate(saved.lat,saved.lng,true))currentPos=saved}catch(e){}

V.search=async(_,ticket=routeVersion)=>{
  const dedicatedMarketCats=new Set(['market','fresh','fresh_market','meat','fish','vegetable','fruit']);
  const list=(await loadShops()).filter(s=>!dedicatedMarketCats.has(String(s.public_category||'').toLowerCase()));if(ticket!==routeVersion)return;
  let menuMatches=[],menuState='',timer=null,inFlight=false,queryVersion=0;
  const matchesCategory=s=>cat==='all'||s.public_category===cat;
  const draw=()=>{const k=q.toLocaleLowerCase('th'),matched=new Set(menuMatches.map(p=>String(p.shop_id)));return list.filter(s=>matchesCategory(s)&&(!k||String(s.shop_name||'').toLocaleLowerCase('th').includes(k)||String(CATS[s.public_category]||'').toLocaleLowerCase('th').includes(k)||matched.has(String(s.id))))};
  layout(`<div style="padding-top:12px"><label for="sq">ค้นหาร้าน เมนู หรือหมวดหมู่</label><input class="in" id="sq" placeholder="ค้นหาร้าน เมนู หรือหมวดหมู่" value="${esc(q)}" style="margin-bottom:0"><button class="lk" id="search-clear">ล้างคำค้นหา</button>
<div class="cats" style="padding:12px 0 4px">${['all',...Object.keys(CATS)].map(k=>`<button class="cat" style="flex:none;width:auto" onclick="cat='${k}';route()"><b style="margin:0;padding:8px 13px;border-radius:99px;font-size:11px;border:1px solid ${cat===k?'var(--red)':'#ddd'};background:${cat===k?'var(--red)':'#fff'};color:${cat===k?'#fff':'#333'}">${k==='all'?'ทั้งหมด':CATS[k]}</b></button>`).join('')}</div><p class="sm" id="search-state" role="status" aria-live="polite"></p><div class="list" id="sr" style="margin-top:8px"></div></div>`,'search');
  const input=$('sq'),results=$('sr'),status=$('search-state');
  const active=()=>ticket===routeVersion&&input.isConnected;
  const render=()=>{if(!active())return;status.textContent=menuState;results.innerHTML=draw().map(shopCard).join('')||(menuState==='กำลังค้นหาเมนู…'?'<p class="empty">กำลังค้นหาร้านและเมนู…</p>':'<p class="empty">ไม่พบร้านหรือเมนูที่ตรงกับคำค้นหา</p>')};
  async function findMenus(){timer=null;if(!active()||q.length<2)return;if(inFlight)return;const version=queryVersion,query=q;inFlight=true;menuState='กำลังค้นหาเมนู…';render();try{
    const literal=query.replace(/[\\%_*]/g,'\\$&');const rows=await db('products?select=id,shop_id,name&available=eq.true&delivery_available=eq.true&name=ilike.'+encodeURIComponent('%'+literal+'%')+'&order=name.asc&limit=30');
    if(!active()||version!==queryVersion)return;menuMatches=Array.isArray(rows)?rows:[];menuState=menuMatches.length?'พบเมนูที่ตรงกันในร้านด้านล่าง':'';
  }catch(e){if(active()&&version===queryVersion)menuState='ค้นหาเมนูไม่สำเร็จ กรุณาลองพิมพ์คำค้นหาอีกครั้ง';}
  finally{inFlight=false;if(active()){if(version!==queryVersion&&q.length>=2){clearTimeout(timer);timer=setTimeout(findMenus,250)}else render()}}}
  function changed(){q=input.value.trim().slice(0,100);queryVersion++;menuMatches=[];menuState=q.length>=2?'กำลังค้นหาเมนู…':q.length===1?'พิมพ์อย่างน้อย 2 ตัวอักษรเพื่อค้นหาเมนู':'';clearTimeout(timer);render();if(q.length>=2)timer=setTimeout(findMenus,250)}
  input.oninput=changed;$('search-clear').onclick=()=>{input.value='';changed();input.focus()};render();if(q.length>=2)timer=setTimeout(findMenus,250);
};
async function shareShop(id){const url=(window.Capacitor?.isNativePlatform?.()?'https://chatchairins-source.github.io/QueuGo/':location.href.split('#')[0])+'#shop/'+encodeURIComponent(id);try{if(navigator.share)await navigator.share({title:'ร้านค้าใน QueueGo',url});else{await navigator.clipboard.writeText(url);toast('คัดลอกลิงก์ร้านแล้ว')}}catch(e){if(e.name!=='AbortError')toast('แชร์ลิงก์ไม่สำเร็จ')}}
V.shop=async(id,ticket=routeVersion)=>{
  const s=(await loadShops()).find(x=>String(x.id)===String(id));
  if(!s)return layout('<p class="empty">ไม่พบร้านค้า</p>','home');
  if(DEDICATED_MARKET_CATS.has(String(s.public_category||'').toLowerCase()))return go('market');
  const items=((await loadMenu(id))||[]).filter(p=>p.available!==false&&p.delivery_available!==false);if(ticket!==routeVersion)return;
  layout(`<div class="cover">${s.public_cover?`<img src="${esc(s.public_cover)}" alt="" onerror="this.remove()">`:''}
<div class="ca"><button class="ic" onclick="history.back()" aria-label="กลับ">${ico('back')}</button><button class="ic" onclick="shareShop('${esc(id)}')" aria-label="แชร์ร้าน">↗</button></div></div>
<div class="intro"><h1>${esc(s.shop_name)}</h1><p><span>${esc(CATS[s.public_category]||'อื่นๆ')}</span>${s.address?`<span>${esc(s.address)}</span>`:''}</p>
<span class="pill ${s.open?'':'off'}">${s.open?'เปิดอยู่':'ปิดอยู่'}</span></div>
<div style="margin-top:6px">${items.length?items.map(p=>`<div class="mi">${photo(p.image,p.name)}<div class="mc"><b>${esc(p.name)}</b><p>${esc(p.description||'')}</p><div class="pr">${baht(p.delivery_price??p.price)}</div></div>
<button class="plus" ${s.open?'':'disabled'} aria-label="เพิ่ม" onclick="add('${esc(id)}','${esc(p.id)}')">${ico('plus',19)}</button></div>`).join(''):'<p class="empty">ยังไม่มีเมนู</p>'}</div>
${cart.shopId==id&&cartN()?`<div class="fcart" onclick="go('cart')"><b>ดูตะกร้า · ${cartN()} รายการ</b><span>${baht(cartTotal())}</span></div>`:''}`,'home');
  window._menu=items;
};
V.market=async(_,ticket=routeVersion)=>{
  const [catalog,rules,active]=await Promise.all([loadMarketCatalog(),loadMarketRules(),loadActiveMarketTrip()]);
  if(ticket!==routeVersion)return;
  window.__activeMarketTrip=active;
  const markets=[...new Map(catalog.map(p=>[String(p.market_id),{id:String(p.market_id),name:String(p.market_name||'ตลาดสด')}])).values()];
  const preferred=active?.market_id||marketCart.marketId||marketView.marketId||markets[0]?.id||null;
  if(preferred&&markets.some(m=>m.id===String(preferred)))marketView.marketId=String(preferred);
  else marketView.marketId=markets[0]?.id||null;
  window.__marketVisibleCatalog=catalog.filter(p=>String(p.market_id)===String(marketView.marketId||''));
  const cats=[...new Set(window.__marketVisibleCatalog.map(p=>marketCategoryKey(p.category,p.name)))];

};
const SUPPORT_CATEGORIES={missing_item:'สินค้าไม่ครบ',wrong_item:'สินค้าไม่ตรงรายการ',damaged_food:'สินค้ามีปัญหา',rider:'ติดต่อเกี่ยวกับไรเดอร์',merchant:'ติดต่อเกี่ยวกับร้าน',payment:'การชำระเงิน',other:'เรื่องอื่น ๆ'};
const SUPPORT_STATUS={OPEN:'รับเรื่องแล้ว',IN_REVIEW:'กำลังตรวจสอบ',WAITING_USER:'รอข้อมูลเพิ่มเติม',RESOLVED:'ดำเนินการแล้ว',REJECTED:'ไม่สามารถดำเนินการได้',CLOSED:'ปิดเรื่องแล้ว'};
const supportPendingKey=()=>S.get()?.userId?'qg_customer_support_pending_'+S.get().userId:null;
function readPendingSupport(){try{return JSON.parse(localStorage.getItem(supportPendingKey())||'null')}catch(e){return null}}
let supportBusy=false;
V.support=async(orderId,ticket=routeVersion)=>{
  const u=S.get(),pending=readPendingSupport();
  const [tickets,orders]=await Promise.all([db('qg_support_tickets?select=id,category,details,status,order_id,created_at,admin_note&user_id=eq.'+encodeURIComponent(u.userId)+'&order=created_at.desc&limit=30'),db('orders?select=id,order_number&customer_id=eq.'+encodeURIComponent(u.userId)+'&order=created_at.desc&limit=30')]);if(ticket!==routeVersion)return;
  const selected=pending?.p_order_id||orderId||'',category=pending?.p_category||'other';
  layout(`<div class="pt"><button class="back" onclick="go('profile')">${ico('back')}</button><h1>ติดต่อฝ่ายช่วยเหลือ</h1></div><section class="card"><form id="support-form"><label for="support-order">ออเดอร์ที่เกี่ยวข้อง</label><select class="in" id="support-order" ${pending?'disabled':''}><option value="">เรื่องทั่วไป</option>${selected&&!(orders||[]).some(o=>String(o.id)===String(selected))?`<option value="${esc(selected)}" selected>ออเดอร์ #${esc(String(selected).slice(0,8))}</option>`:''}${(orders||[]).map(o=>`<option value="${esc(o.id)}" ${String(o.id)===String(selected)?'selected':''}>#${esc(customerOrderNumber(o))}</option>`).join('')}</select><label for="support-category">เรื่องที่ต้องการความช่วยเหลือ</label><select class="in" id="support-category" ${pending?'disabled':''}>${Object.entries(SUPPORT_CATEGORIES).map(([key,label])=>`<option value="${key}" ${key===category?'selected':''}>${label}</option>`).join('')}</select><label for="support-details">รายละเอียด</label><textarea class="ta" id="support-details" minlength="10" maxlength="2000" required ${pending?'disabled':''} placeholder="บอกปัญหาและข้อมูลที่ช่วยให้ทีมงานตรวจสอบได้">${esc(pending?.p_details||'')}</textarea><p class="sm" id="support-feedback" role="status" aria-live="polite">${pending?'กำลังรอตรวจผลคำขอเดิม กรุณากดตรวจผลอีกครั้ง':''}</p><button class="prim" id="support-send">${pending?'ตรวจผลคำขอเดิม':'ส่งเรื่องให้ทีมงาน'}</button></form></section><section class="card"><div class="sr"><b>เรื่องที่ส่งแล้ว</b><button class="lk" onclick="route()">โหลดสถานะล่าสุด</button></div>${(tickets||[]).length?tickets.map(t=>`<article><p><b>${esc(SUPPORT_CATEGORIES[t.category]||'เรื่องที่แจ้ง')} • ${esc(SUPPORT_STATUS[t.status]||'กำลังดำเนินการ')}</b></p><small>${new Date(t.created_at).toLocaleString('th-TH')}</small><p>${esc(t.details)}</p>${t.admin_note?`<p><b>คำตอบจากทีมงาน</b><br>${esc(t.admin_note)}</p>`:''}</article>`).join(''):'<p class="empty">ยังไม่มีเรื่องที่ส่ง</p>'}</section>`,'');
  $('support-form').onsubmit=submitSupport;
};
async function submitSupport(event){
  event.preventDefault();if(supportBusy)return;const u=S.get();if(!u)return go('login');
  const form=event.currentTarget,key=supportPendingKey(),sameActor=()=>S.get()?.userId===u.userId&&S.get()?.authUserId===u.authUserId,feedback=$('support-feedback'),button=$('support-send');
  let pending=readPendingSupport();if(!pending){const details=$('support-details').value.trim(),category=$('support-category').value;if(details.length<10||details.length>2000||!SUPPORT_CATEGORIES[category]){feedback.textContent='กรุณาเลือกระเภทเรื่องและระบุรายละเอียด 10–2,000 ตัวอักษร';return}pending={p_ticket_id:uuid(),p_order_id:$('support-order').value||null,p_category:category,p_details:details,p_evidence_path:null};}
  supportBusy=true;button.disabled=true;feedback.textContent='กำลังตรวจสอบและส่งเรื่อง…';
  try{localStorage.setItem(key,JSON.stringify(pending));for(const field of form.querySelectorAll('input,select,textarea'))field.disabled=true;
    const accessToken=await token();if(!sameActor())return;
    const previous=await db('qg_support_tickets?select=id&id=eq.'+encodeURIComponent(pending.p_ticket_id)+'&user_id=eq.'+encodeURIComponent(u.userId)+'&limit=1',{token:accessToken});if(!sameActor())return;
    const id=previous?.[0]?.id||await db('rpc/qg_create_ticket',{method:'POST',token:accessToken,body:pending});if(id!==pending.p_ticket_id)throw Error('Unconfirmed ticket');localStorage.removeItem(key);
    if(!sameActor()||!form.isConnected)return;toast('ส่งเรื่องให้ทีมงานแล้ว');route();
  }catch(e){if(e.status>=400&&e.status<500&&![408,429].includes(e.status)){localStorage.removeItem(key);if(sameActor()&&form.isConnected)for(const field of form.querySelectorAll('input,select,textarea'))field.disabled=false}if(sameActor()&&form.isConnected)feedback.textContent=e.status?'ส่งเรื่องไม่สำเร็จ กรุณาตรวจข้อมูลและลองอีกครั้ง':'ยังไม่ได้รับผลยืนยัน กรุณาตรวจผลคำขอเดิมอีกครั้ง ระบบจะไม่ส่งเรื่องซ้ำ';}
  finally{supportBusy=false;if(sameActor()&&form.isConnected){button.disabled=false;button.textContent=readPendingSupport()?'ตรวจผลคำขอเดิม':'ส่งเรื่องให้ทีมงาน'}}
}
V.profile=()=>{
  const u=S.get()||{};
  layout(`<div class="pf"><div class="av">${ini(u.name)}</div><div><h1>${esc(u.name||'ลูกค้า')}</h1><p>${esc(u.phone||'')}</p><span class="acc">บัญชีลูกค้า</span></div></div>
<div class="pl"><button class="pw" onclick="go('orders')"><span class="i">${ico('orders')}</span><b>ออเดอร์ของฉัน</b></button>
<button class="pw" onclick="go('support')"><span class="i">${ico('orders')}</span><b>ติดต่อฝ่ายช่วยเหลือ</b></button>
<button class="pw" onclick="S.clear();cart=readCart();go('login')"><span class="i">${ico('logout')}</span><b>ออกจากระบบ</b></button></div>`,'');
};
/* ===== 7) Cart actions ===== */
window.add=(sid,pid)=>{
  if(checkoutBusy||readPendingCheckout())return toast('กรุณายืนยันผลคำสั่งซื้อเดิมในหน้าชำระเงินก่อนแก้ตะกร้า');
  const p=(window._menu||[]).find(x=>String(x.id)===String(pid));if(!p)return;const price=Number(p.delivery_price??p.price);if(!Number.isFinite(price)||price<0)return toast('รายการนี้ยังไม่พร้อมสั่ง');
  if(cart.items.length&&String(cart.shopId)!==String(sid)){if(!confirm('ตะกร้ามีสินค้าจากร้านอื่น ล้างตะกร้าเพื่อสั่งร้านนี้?'))return;cart={shopId:sid,items:[]}}
  cart.shopId=sid;const f=cart.items.find(i=>i.id===p.id);
  if(f?.qty>=99)return toast('เพิ่มได้สูงสุด 99 ชิ้นต่อรายการ');
  f?f.qty++:cart.items.push({id:p.id,name:p.name,price,image:p.image||'',qty:1});
  saveCart();toast('เพิ่มลงตะกร้าแล้ว');route();
};
window.chg=(x,d)=>{if(checkoutBusy||readPendingCheckout())return toast('กรุณายืนยันผลคำสั่งซื้อเดิมก่อนแก้ตะกร้า');if(!Number.isInteger(x)||!cart.items[x]||![1,-1].includes(d))return;if(cart.items[x].qty+d>99)return toast('เพิ่มได้สูงสุด 99 ชิ้นต่อรายการ');cart.items[x].qty+=d;if(cart.items[x].qty<1)cart.items.splice(x,1);if(!cart.items.length)cart.shopId=null;saveCart();route()};
window.setCheckoutNote=value=>{if(checkoutBusy||readPendingCheckout())return;cart.note=String(value).slice(0,500);saveCart()};
/* ===== 8) Router ===== */
let routeVersion=0,lastRouteView='';
/* Customer orders: one scoped connection and one coalesced refresh path. */
const customerOrdersLive=(()=>{
  let scope='',generation=0,client=null,channel=null,attaching=null,sdk=null,timer=null,refreshing=null,again=false,connected=false;
  const desired=()=>{const u=S.get(),view=location.hash.slice(1)||'home';return u?.userId&&/^(orders|order\/[^/]+|market-order\/[^/]+|laundry-order\/[^/]+)$/.test(view)&&!document.hidden&&navigator.onLine!==false?u.userId+':'+u.authUserId+':'+view:''};
  const valid=(key,g)=>scope===key&&generation===g&&desired()===key;
  function clearTimer(){clearTimeout(timer);timer=null}
  function stop(){generation++;scope='';connected=false;clearTimer();again=false;const oldClient=client,oldChannel=channel;client=channel=null;attaching=null;if(oldChannel)Promise.resolve(oldClient.removeChannel(oldChannel)).catch(()=>{});oldClient?.realtime.disconnect()}
  function loadSDK(){if(window.supabase?.createClient)return Promise.resolve();if(sdk)return sdk;sdk=new Promise((resolve,reject)=>{const script=document.createElement('script');const deadline=setTimeout(()=>finish(Error('Realtime timeout')),10000);function finish(error){clearTimeout(deadline);script.onload=script.onerror=null;if(error){script.remove();reject(error)}else resolve()}script.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js';script.onload=()=>finish(window.supabase?.createClient?null:Error('Realtime unavailable'));script.onerror=()=>finish(Error('Realtime unavailable'));document.head.append(script)}).catch(e=>{sdk=null;throw e});return sdk}
  function schedule(delay=connected?60000:15000){clearTimer();const key=scope,g=generation;if(!key)return;timer=setTimeout(async()=>{timer=null;if(!valid(key,g))return;try{const accessToken=await token();if(!valid(key,g))return;if(accessToken&&client)await client.realtime.setAuth(accessToken)}catch(e){}if(!valid(key,g))return;if(!connected){refresh();attach()}schedule()},delay)}
  function refresh(){if(!scope||desired()!==scope)return;if(refreshing){again=true;return refreshing}const key=scope,g=generation;refreshing=Promise.resolve().then(()=>valid(key,g)?route(true):null).finally(()=>{refreshing=null;if(again){again=false;refresh()}});return refreshing}
  function attach(){if(attaching||channel||!scope)return attaching;const key=scope,g=generation;const work=(async()=>{await loadSDK();if(!valid(key,g))return;const accessToken=await token();if(!valid(key,g)||!accessToken)return;const next=window.supabase.createClient(CFG.URL,CFG.KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});await next.realtime.setAuth(accessToken);if(!valid(key,g)){next.realtime.disconnect();return}client=next;const customer=S.get().userId;channel=next.channel('customer-orders:'+customer+':'+g);for(const table of ['orders','market_orders','laundry_orders'])for(const event of ['INSERT','UPDATE'])channel.on('postgres_changes',{event,schema:'public',table,filter:'customer_id=eq.'+customer},()=>{if(valid(key,g))refresh()});channel.subscribe(status=>{if(!valid(key,g))return;connected=status==='SUBSCRIBED';if(['CLOSED','CHANNEL_ERROR','TIMED_OUT'].includes(status)){const failed=channel;channel=null;Promise.resolve(next.removeChannel(failed)).catch(()=>{});next.realtime.disconnect();if(client===next)client=null}if(connected)refresh();schedule()})})().catch(()=>{if(valid(key,g))schedule()}).finally(()=>{if(attaching===work)attaching=null});attaching=work;return work}
  function sync(){const key=desired();if(key!==scope){stop();scope=key}if(!key)return;attach();if(!timer)schedule()}
  function resume(){sync();if(scope)refresh()}
  document.addEventListener('visibilitychange',resume);addEventListener('online',resume);addEventListener('offline',sync);addEventListener('pagehide',stop);addEventListener('pageshow',resume);addEventListener('storage',event=>{if(event.key===SKEY){cart=readCart();marketCart=readMarketCart();route();resume()}else if(!checkoutBusy&&(event.key===cartKey()||event.key===pendingCheckoutKey())){cart=readCart();route()}else if(!marketCheckoutBusy&&(event.key===marketCartKey()||event.key===marketPendingKey())){marketCart=readMarketCart();route()}});
  return {sync,refresh,stop};
})();

async function route(background=false){
  const [pg,param]=(location.hash.slice(1)||'home').split('/');
  const ticket=++routeVersion,ok=authed();
  if(!ok&&!['home','market','market-cart','search','shop','cart','map','login','register'].includes(pg))return go('login');
  if(ok&&(pg==='login'||pg==='register'))return go('home');
  if(!V[pg])return go('home');
  if(ok&&['cart','orders','order'].includes(pg)&&await reconcilePendingCheckout())return;
  customerOrdersLive.sync();
  const viewKey=(S.get()?.userId||'guest')+':'+pg+'/'+(param||'');
  if(!background&&viewKey!==lastRouteView){lastRouteView=viewKey;layout('<div class="card" role="status" aria-live="polite">กำลังโหลดข้อมูล…</div>',pg==='order'?'orders':pg==='checkout'?'cart':pg)}
  try{await V[pg](param,ticket);if(ticket===routeVersion)bind(pg)}
  catch(e){if(ticket!==routeVersion)return;layout(`<div class="card"><b>โหลดข้อมูลไม่สำเร็จ</b><p class="sm" style="margin:6px 0 12px">${esc(e.message)}</p><button class="prim" onclick="shops=null;route()">ลองอีกครั้ง</button></div>`,'')}
}
function bind(pg){
  if(pg==='login')$('lb').onclick=async e=>{const b=e.target;b.disabled=true;try{await login($('lp').value.trim(),$('lw').value);go('home')}catch(x){toast(x.message)}finally{b.disabled=false}};
  if(pg==='register')$('rb').onclick=async e=>{
    const b=e.target,name=$('rn').value.trim(),phone=$('rp').value.trim(),password=$('rw').value;
    if(!name||phone.replace(/\D/g,'').length<9||password.length<6)return toast('กรอกข้อมูลให้ครบ');
    b.disabled=true;
    try{
      const pos=await new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true,timeout:15000}):no());
      await register({name,phone,password,lat:pos.coords.latitude,lng:pos.coords.longitude});go('home');
    }catch(x){toast(x&&x.message?x.message:'ต้องอนุญาตตำแหน่งที่ตั้งเพื่อสมัคร')}finally{b.disabled=false}
  };
}
addEventListener('hashchange',()=>route());
route();
