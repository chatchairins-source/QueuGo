<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <meta name="theme-color" content="#e9e7e3">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>QueueGo Map — Buriram</title>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9e7e3}
    #map{position:fixed;inset:0;width:100vw;height:100dvh;background:#e9e7e3}
    .maplibregl-map,.maplibregl-canvas-container,.maplibregl-canvas{width:100%;height:100%;touch-action:none}
    .maplibregl-ctrl-attrib{font:9px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
</head>
<body>
  <div id="map" aria-label="แผนที่ QueueGo บุรีรัมย์"></div>

  <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>
  <script>
    (function(){
      "use strict";

      const BURIRAM_CENTER=[103.1029,14.9930];

      const map=new maplibregl.Map({
        container:"map",
        style:{
          version:8,
          sources:{
            osm:{
              type:"raster",
              tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize:256,
              attribution:"© OpenStreetMap contributors"
            }
          },
          layers:[
            {id:"background",type:"background",paint:{"background-color":"#e9e7e3"}},
            {id:"osm",type:"raster",source:"osm"}
          ]
        },
        center:BURIRAM_CENTER,
        zoom:12.2,
        minZoom:6,
        maxZoom:19,
        dragRotate:false,
        pitchWithRotate:false,
        attributionControl:false
      });

      map.touchZoomRotate.disableRotation();
      map.addControl(new maplibregl.AttributionControl({compact:true}),"bottom-right");

      window.QueueGoMapLab={
        get map(){return map},
        ready:false
      };

      map.on("load",function(){
        window.QueueGoMapLab.ready=true;
      });
    })();
  </script>
</body>
</html>
