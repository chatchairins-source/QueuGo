name: QueueGo CI Auto Recovery

# Only the trusted main copy of this workflow can run for workflow_run.
# Untrusted PR code is never checked out or executed with write permissions.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/queuego-ci-autorecovery.yml'
      - 'ops/ci/queuego_autorecovery.py'
      - 'tests/test_queuego_ci_autorecovery.py'
  workflow_run:
    workflows:
      - QueueGo Native Android Pilot
      - QueueGo Export Tested Country APKs
      - QueueGo Native POS CI
      - QueueGo Installed Country Offline Runtime
      - QueueGo Rider Android Authenticated Review
      - QueueGo RC Tests
      - QueueGo Map Engine Buriram
      - Customer P0 Android runtime matrix
      - Native Merchant Grocery verification
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Existing GitHub Actions workflow-run ID to triage'
        required: true
        type: string
      dry_run:
        description: 'Inspect and classify only; no retries or issue writes'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# Serializes incoming events and hourly catch-up, avoiding duplicate retries.
concurrency:
  group: queuego-ci-auto-recovery-serial
  cancel-in-progress: false

jobs:
  validate-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test CI recovery without privileged write token
        run: |
          python3 -m py_compile ops/ci/queuego_autorecovery.py
          python3 tests/test_queuego_ci_autorecovery.py

  triage-and-recover:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       contains(fromJSON('["failure","timed_out","success"]'), github.event.workflow_run.conclusion))
    permissions:
      contents: read
      actions: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate fail-closed CI recovery policy
        run: |
          python3 -m py_compile ops/ci/queuego_autorecovery.py
          python3 tests/test_queuego_ci_autorecovery.py
      - name: Recover only proven transient failures and file code-breakage issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QG_SOURCE_RUN_ID: ${{ inputs.run_id }}
          QG_RECOVERY_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python3 ops/ci/queuego_autorecovery.py
