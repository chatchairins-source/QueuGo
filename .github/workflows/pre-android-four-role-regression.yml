name: Pre Android Four Role Regression

on:
  push:
    branches:
      - work/pre-android-four-role-cleanup-20261004

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
