name: QueueGo Rider Android Authenticated Review

on:
  workflow_dispatch:
  push:
    branches:
      - work-native-rider-auth-review-20261024

permissions:
  contents: read

jobs:
  credential-check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check review secrets without printing their values
        id: check
        env:
          QG_RIDER_REVIEW_PHONE: ${{ secrets.QG_RIDER_REVIEW_PHONE }}
          QG_RIDER_REVIEW_PASSWORD: ${{ secrets.QG_RIDER_REVIEW_PASSWORD }}
        run: |
          mkdir -p artifacts/rider-authenticated-review
          if [ -n "$QG_RIDER_REVIEW_PHONE" ] && [ -n "$QG_RIDER_REVIEW_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            printf '{"status":"ready","screenshots":"pending"}\n' > artifacts/rider-authenticated-review/status.json
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            printf '{"status":"skipped","reason":"Repository Actions secrets QG_RIDER_REVIEW_PHONE and QG_RIDER_REVIEW_PASSWORD are not configured"}\n' > artifacts/rider-authenticated-review/status.json
            echo "::warning::Authenticated Rider capture skipped; configure the two repository Actions secrets"
          fi
      - name: Save review readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-rider-authenticated-review-status
          path: artifacts/rider-authenticated-review/status.json
          retention-days: 7

  capture:
    needs: credential-check
    if: needs.credential-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and test image
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "emulator" "platform-tools" \
            "system-images;android-30;default;x86_64" >/dev/null
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Build actual Rider debug APK
        run: gradle -p native-android :rider:assembleDebug --no-build-cache --stacktrace
      - name: Boot Android Emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/queuego-rider-review-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n queuego_rider_review -k "system-images;android-30;default;x86_64" \
            --device pixel_4 -p "$ANDROID_AVD_HOME/queuego_rider_review" <<< "no"
          "$ANDROID_HOME/platform-tools/adb" start-server
          nohup "$ANDROID_HOME/emulator/emulator" -avd queuego_rider_review -port 5554 \
            -accel on -no-window -no-snapshot -no-audio -gpu swiftshader \
            -memory 2048 -cores 2 > "$RUNNER_TEMP/queuego-rider-review-emulator.log" 2>&1 &
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" -s emulator-5554 wait-for-device
          for attempt in $(seq 1 90); do
            if [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then exit 0; fi
            sleep 5
          done
          cat "$RUNNER_TEMP/queuego-rider-review-emulator.log"
          exit 1
      - name: Enable runner-only Android acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Capture authenticated Rider views on Android Emulator
        env:
          QG_DEBUG_MAP_ARCHIVE: '1'
          QG_RIDER_REVIEW_PHONE: ${{ secrets.QG_RIDER_REVIEW_PHONE }}
          QG_RIDER_REVIEW_PASSWORD: ${{ secrets.QG_RIDER_REVIEW_PASSWORD }}
        run: python3 native-android/qa/capture-rider-authenticated-review.py
      - name: Save authenticated Rider screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-rider-authenticated-screens
          path: |
            artifacts/rider-authenticated-review/*.png
            artifacts/rider-authenticated-review/metadata.json
          if-no-files-found: warn
          retention-days: 7
