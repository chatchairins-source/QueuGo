name: QueueGo Rider Android Authenticated Review

on:
  workflow_dispatch:
  push:
    branches:
      - work-native-rider-auth-review-20261024
      - work-native-web-parity-20261026
      - work-native-pos-tax-foundation-20261029
      - work-native-rider-nav-unified-offline-20261030
      - work-native-all-role-visual-capture-20261101
      - work-rider-profile-safe-visual-capture-20261101
      - work-native-ride-visual-capture-20261101
      - work-rider-profile-nav-clearance-20261101
      - work-native-visual-evidence-integrity-20261101
      - work-qa-true-png-signature-20261101

# All runs reuse the same existing review account. Production enforces one
# active session, so parallel workers must never displace each other's login.
concurrency:
  group: queuego-authenticated-review-accounts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  credential-check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      rider_ready: ${{ steps.check.outputs.rider_ready }}
      merchant_ready: ${{ steps.check.outputs.merchant_ready }}
      customer_ready: ${{ steps.check.outputs.customer_ready }}
    steps:
      - name: Check review secrets without printing their values
        id: check
        env:
          QG_RIDER_REVIEW_PHONE: ${{ secrets.QG_RIDER_REVIEW_PHONE }}
          QG_RIDER_REVIEW_PASSWORD: ${{ secrets.QG_RIDER_REVIEW_PASSWORD }}
          QG_MERCHANT_REVIEW_PHONE: ${{ secrets.QG_MERCHANT_REVIEW_PHONE }}
          QG_MERCHANT_REVIEW_PASSWORD: ${{ secrets.QG_MERCHANT_REVIEW_PASSWORD }}
          QG_CUSTOMER_REVIEW_PHONE: ${{ secrets.QG_CUSTOMER_REVIEW_PHONE }}
          QG_CUSTOMER_REVIEW_PASSWORD: ${{ secrets.QG_CUSTOMER_REVIEW_PASSWORD }}
          REVIEW_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          roles = {}
          for role in ("RIDER", "MERCHANT", "CUSTOMER"):
              names = [f"QG_{role}_REVIEW_PHONE", f"QG_{role}_REVIEW_PASSWORD"]
              missing = [name for name in names if not os.environ.get(name)]
              roles[role.lower()] = {"ready": not missing, "missing_secret_names": missing}
              print(role + "_review_credentials=" + ("present" if not missing else "missing"))
              if missing:
                  print(role + "_missing_secret_names=" + ",".join(missing))
          merchant_only = "[merchant-visual-review]" in os.environ.get("REVIEW_COMMIT_MESSAGE", "")
          all_roles = (os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
              or os.environ.get("GITHUB_REF_NAME") in (
                  "work-native-all-role-visual-capture-20261101",
                  "work-native-ride-visual-capture-20261101")
              or "[all-role-visual-review]" in os.environ.get("REVIEW_COMMIT_MESSAGE", ""))
          ready = (any(role["ready"] for role in roles.values()) if all_roles
              else roles["merchant" if merchant_only else "rider"]["ready"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("ready=" + str(ready).lower() + "\n")
              for role, state in roles.items():
                  output.write(role + "_ready=" + str(state["ready"]).lower() + "\n")
          capture_requested = (os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
              or os.environ.get("GITHUB_REF_NAME") in ("work-native-rider-auth-review-20261024",
                  "work-native-all-role-visual-capture-20261101",
                  "work-rider-profile-safe-visual-capture-20261101",
                  "work-native-ride-visual-capture-20261101",
                  "work-rider-profile-nav-clearance-20261101",
                  "work-native-visual-evidence-integrity-20261101",
                  "work-qa-true-png-signature-20261101") or merchant_only)
          report = {"status": "ready" if ready else "skipped",
              "scope": "credential presence only; not authenticated visual acceptance",
              "roles": roles, "capture_requested": capture_requested,
              "screenshots": "pending" if ready and capture_requested else "not_run"}
          target = Path("artifacts/rider-authenticated-review/status.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Save review readiness
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-rider-authenticated-review-status
          path: artifacts/rider-authenticated-review/status.json
          retention-days: 7

  capture:
    needs: credential-check
    if: needs.credential-check.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'work-native-rider-auth-review-20261024' || github.ref_name == 'work-rider-profile-safe-visual-capture-20261101' || github.ref_name == 'work-native-ride-visual-capture-20261101' || github.ref_name == 'work-rider-profile-nav-clearance-20261101' || github.ref_name == 'work-native-visual-evidence-integrity-20261101' || github.ref_name == 'work-qa-true-png-signature-20261101' || github.ref_name == 'work-native-all-role-visual-capture-20261101' || (github.ref_name == 'work-native-web-parity-20261026' && contains(github.event.head_commit.message, '[authenticated-review]')) || ((github.ref_name == 'work-native-pos-tax-foundation-20261029' || github.ref_name == 'work-native-rider-nav-unified-offline-20261030') && contains(github.event.head_commit.message, '[merchant-visual-review]')))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK and test image
        run: |
          set -euo pipefail
          # sdkmanager can close stdin after license acceptance; keep its exit status authoritative.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "emulator" "platform-tools" \
            "system-images;android-30;default;x86_64" >/dev/null
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare native Firebase configs
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${QG_FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::warning::Firebase config secret is absent; native Rider APK will build without physical background-push certification"
            exit 0
          fi
          umask 077
          tmp="$(mktemp)"
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$tmp"
          QG_FIREBASE_CONFIG="$tmp" python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          p=Path(os.environ['QG_FIREBASE_CONFIG'])
          data=json.loads(p.read_text())
          packages={
              c.get('client_info',{}).get('android_client_info',{}).get('package_name')
              for c in (data.get('client') or [])
          }
          targets={
              'com.queuego.customer': Path('native-android/customer/google-services.json'),
              'com.queuego.merchant': Path('native-android/merchant/google-services.json'),
              'com.queuego.rider': Path('native-android/rider/google-services.json'),
          }
          if 'com.queuego.rider' not in packages:
              raise SystemExit('::error::Firebase config has no com.queuego.rider Android client')
          for package,target in targets.items():
              if package in packages:
                  shutil.copyfile(p,target)
                  os.chmod(target,0o600)
                  print(f'Native Firebase config: {package} valid')
              else:
                  print(f'::warning::Firebase config has no {package} Android client; that app will build without physical background-push certification')
          PY
          rm -f "$tmp"
      - name: Customer screenshot hierarchy and fail-closed gate self-test
        run: python3 native-android/qa/capture-customer-authenticated-review.py --self-test
      - name: Rider safe profile tap regression self-test
        run: python3 native-android/qa/capture-rider-authenticated-review.py --self-test
      - name: Build actual Rider, Merchant and Customer debug APKs
        run: gradle -p native-android :rider:assembleDebug :merchant:assembleDebug :customer:assembleDebug --no-build-cache --stacktrace
      - name: Enable runner-only Android acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Boot Android Emulator
        id: boot_emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/queuego-rider-review-avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n queuego_rider_review -k "system-images;android-30;default;x86_64" \
            --device pixel_4 -p "$ANDROID_AVD_HOME/queuego_rider_review" <<< "no"
          "$ANDROID_HOME/platform-tools/adb" start-server
          adb="$ANDROID_HOME/platform-tools/adb"
          nohup "$ANDROID_HOME/emulator/emulator" -avd queuego_rider_review -port 5554 \
            -accel on -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader \
            -memory 2048 -cores 2 > "$RUNNER_TEMP/queuego-rider-review-emulator.log" 2>&1 &
          timeout 90s "$adb" -s emulator-5554 wait-for-device
          review_framework_ready() {
            [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = "1" ] &&
            [ "$("$adb" -s emulator-5554 shell service check activity | tr -d '\r')" = "Service activity: found" ] &&
            [ "$("$adb" -s emulator-5554 shell service check window | tr -d '\r')" = "Service window: found" ] &&
            [ "$("$adb" -s emulator-5554 shell service check package | tr -d '\r')" = "Service package: found" ]
          }
          stable_samples=0
          for attempt in $(seq 1 90); do
            if review_framework_ready; then
              stable_samples=$((stable_samples + 1))
              if [ "$stable_samples" -ge 3 ]; then exit 0; fi
            else
              stable_samples=0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/queuego-rider-review-emulator.log"
          exit 1
      - name: Capture authenticated Rider views on Android Emulator
        if: ${{ needs.credential-check.outputs.rider_ready == 'true' && !contains(github.event.head_commit.message, '[merchant-visual-review]') }}
        env:
          QG_DEBUG_MAP_ARCHIVE: '1'
          QG_RIDER_REVIEW_PHONE: ${{ secrets.QG_RIDER_REVIEW_PHONE }}
          QG_RIDER_REVIEW_PASSWORD: ${{ secrets.QG_RIDER_REVIEW_PASSWORD }}
        run: python3 native-android/qa/capture-rider-authenticated-review.py
      - name: Capture authenticated Merchant views on Android Emulator
        if: always() && steps.boot_emulator.outcome == 'success' && needs.credential-check.outputs.merchant_ready == 'true'
        env:
          QG_MERCHANT_REVIEW_PHONE: ${{ secrets.QG_MERCHANT_REVIEW_PHONE }}
          QG_MERCHANT_REVIEW_PASSWORD: ${{ secrets.QG_MERCHANT_REVIEW_PASSWORD }}
          QG_MERCHANT_VISUAL_PARITY: ${{ contains(github.event.head_commit.message, '[merchant-visual-review]') && '1' || '0' }}
        run: python3 native-android/qa/capture-merchant-authenticated-review.py
      - name: Capture authenticated Customer views on Android Emulator
        if: always() && steps.boot_emulator.outcome == 'success' && needs.credential-check.outputs.customer_ready == 'true' && (github.event_name == 'workflow_dispatch' || github.ref_name == 'work-native-all-role-visual-capture-20261101' || github.ref_name == 'work-native-ride-visual-capture-20261101')
        env:
          QG_CUSTOMER_REVIEW_PHONE: ${{ secrets.QG_CUSTOMER_REVIEW_PHONE }}
          QG_CUSTOMER_REVIEW_PASSWORD: ${{ secrets.QG_CUSTOMER_REVIEW_PASSWORD }}
        run: python3 native-android/qa/capture-customer-authenticated-review.py
      - name: Set up Web visual review dependencies
        if: always() && contains(github.event.head_commit.message, '[merchant-visual-review]')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Thai glyphs for the Production Web oracle
        if: always() && contains(github.event.head_commit.message, '[merchant-visual-review]')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-core
          fc-match 'Noto Sans Thai'
      - name: Capture actual Production Merchant Web views
        if: always() && contains(github.event.head_commit.message, '[merchant-visual-review]')
        env:
          QG_MERCHANT_REVIEW_PHONE: ${{ secrets.QG_MERCHANT_REVIEW_PHONE }}
          QG_MERCHANT_REVIEW_PASSWORD: ${{ secrets.QG_MERCHANT_REVIEW_PASSWORD }}
        run: |
          npm ci --no-audit --no-fund
          node tests/merchant-visual-review-policy.cjs
          node native-android/qa/capture-merchant-web-review.cjs
      - name: Save Production Web screenshots
        if: always() && contains(github.event.head_commit.message, '[merchant-visual-review]')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-merchant-production-web-screens
          path: artifacts/merchant-web-review/
          if-no-files-found: warn
          retention-days: 7
      - name: Build verified screenshot review galleries
        if: always()
        run: python3 native-android/qa/build-android-screenshot-index.py
      - name: Save authenticated Merchant screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-merchant-authenticated-screens
          path: |
            artifacts/merchant-authenticated-review/*.png
            artifacts/merchant-authenticated-review/metadata.json
            artifacts/merchant-authenticated-review/index.html
            artifacts/merchant-authenticated-review/index.json
            artifacts/merchant-authenticated-review/hierarchy-status.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save authenticated Customer screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-customer-authenticated-screens
          path: |
            artifacts/customer-authenticated-review/*.png
            artifacts/customer-authenticated-review/metadata.json
            artifacts/customer-authenticated-review/index.html
            artifacts/customer-authenticated-review/index.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save authenticated Rider screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-rider-authenticated-screens
          path: |
            artifacts/rider-authenticated-review/*.png
            artifacts/rider-authenticated-review/metadata.json
            artifacts/rider-authenticated-review/index.html
            artifacts/rider-authenticated-review/index.json
          if-no-files-found: warn
          retention-days: 7
