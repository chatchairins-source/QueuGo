name: QueueGo P0 Cash Terminal Helper Review
on:
  pull_request:
    branches: [work-native-reconcile-main-20261114]
    paths:
      - ops/p0/terminal-cash-dependents-review-only.sql
      - tests/backend/terminal-cash-dependents-runtime.cjs
      - tests/fixtures/cash-cancel-prod-snapshot-20261120.sql
      - tests/fixtures/cash-order-guard-prod-snapshot-20261121.sql
      - tests/fixtures/cash-dependent-guards-prod-snapshot-20261121.sql
      - .github/workflows/p0-cash-terminal-helper.yml
permissions:
  contents: read
jobs:
  isolated-cash-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: qg_cash_helper_test_ci
          POSTGRES_PASSWORD: isolated-cash-helper-only
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qg_cash_helper_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify captured cash cancellation and guarded terminal cleanup
        run: node tests/backend/terminal-cash-dependents-runtime.cjs
      - name: Verify payment-writer concurrency on disposable PostgreSQL17.6
        env:
          QG_CASH_HELPER_TEST_DATABASE_URL: postgres://postgres:isolated-cash-helper-only@127.0.0.1:55440/qg_cash_helper_test_ci
        run: node tests/backend/terminal-cash-dependents-runtime.cjs
