name: QueueGo Appetize APK Sets

on:
  push:
    branches:
      - work-native-appetize-apks-20261011
    paths:
      - '.github/workflows/build-appetize-apks.yml'
      - 'native-android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Download verified Longdo Android SDK
        run: |
          mkdir -p native-android/rider/libs
          curl -fsSL "https://api.longdo.com/map-android-SDK/LongdoMapAndroidSDK_v0.1.8.aar" -o native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar
          echo "0918c23673ba6c7a349746f005525aca2ff3470f8e2966d5d2a4cb633ae5980c  native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar" | sha256sum -c -
      - name: Build debug app bundles
        run: gradle -p native-android :customer:bundleDebug :merchant:bundleDebug :rider:bundleDebug --no-build-cache --stacktrace
      - name: Download bundletool
        run: |
          curl -fsSL "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o bundletool.jar
          java -jar bundletool.jar version
      - name: Create debug signing key
        run: |
          keytool -genkeypair -v             -keystore appetize-debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -dname "CN=Android Debug,O=Android,C=US"             -keyalg RSA -keysize 2048 -validity 10000
      - name: Build universal APK Set archives
        run: |
          mkdir -p artifacts/appetize
          java -jar bundletool.jar build-apks             --bundle=native-android/customer/build/outputs/bundle/debug/customer-debug.aab             --output=artifacts/appetize/QueueGo-Customer-Pilot.apks             --mode=universal             --ks=appetize-debug.keystore --ks-pass=pass:android             --ks-key-alias=androiddebugkey --key-pass=pass:android
          java -jar bundletool.jar build-apks             --bundle=native-android/merchant/build/outputs/bundle/debug/merchant-debug.aab             --output=artifacts/appetize/QueueGo-Merchant-Pilot.apks             --mode=universal             --ks=appetize-debug.keystore --ks-pass=pass:android             --ks-key-alias=androiddebugkey --key-pass=pass:android
          java -jar bundletool.jar build-apks             --bundle=native-android/rider/build/outputs/bundle/debug/rider-debug.aab             --output=artifacts/appetize/QueueGo-Rider-Pilot.apks             --mode=universal             --ks=appetize-debug.keystore --ks-pass=pass:android             --ks-key-alias=androiddebugkey --key-pass=pass:android
          unzip -l artifacts/appetize/QueueGo-Customer-Pilot.apks | head -30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-appetize-apks
          path: artifacts/appetize/*.apks
          if-no-files-found: error
          retention-days: 14
