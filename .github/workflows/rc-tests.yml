name: QueueGo RC Tests

on:
  push:
    branches:
      - queuego-market-bundle-laundry-rc
      - main
      - ci-native-merchant-grocery-catalog-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android build platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Compile Merchant Native Kotlin
        run: gradle -p native-android :merchant:compileDebugKotlin --no-build-cache --stacktrace
