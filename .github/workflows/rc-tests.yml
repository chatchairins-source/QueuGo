name: QueueGo RC Tests

on:
  push:
    branches:
      - queuego-market-bundle-laundry-rc
      - main
      - work-native-voice-privacy-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
