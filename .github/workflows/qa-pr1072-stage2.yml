name: PR1072 exact source full suite and diagnostic diff audit
on:
  push:
    branches: [qa/pr1072-stage2-dfd3f650]
permissions:
  contents: read
concurrency:
  group: customer-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  picker-runtime:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api: [35]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dfd3f65065ada660ac2a1099e2ccca4b4c737d7b
          fetch-depth: 0
      - name: Verify PR diff, source tree and merge conflict status
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "dfd3f65065ada660ac2a1099e2ccca4b4c737d7b"
          base=db3662283cf2dc10f0019941191aad52647f3a70
          git diff --no-ext-diff --no-color "$base"...HEAD > "$RUNNER_TEMP/pr.diff"
          if grep -Ein '^\\+.*(MAPDIAG|mapSurface)' "$RUNNER_TEMP/pr.diff"; then exit 1; fi
          if git grep -InE 'MAPDIAG|mapSurface' HEAD -- .; then exit 1; fi
          git merge-tree --write-tree "$base" HEAD
          echo "PASS full PR diff and source tree free of diagnostic markers; clean merge simulation"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
          cache-read-only: ${{ github.event_name == 'pull_request' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/work-native-reconcile-main-20261114') }}
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$ANDROID_HOME/platforms/android-36/android.jar" ] &&
             [ -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            echo "Android 36 platform and build tools are already installed"
            exit 0
          fi
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=10s 180s bash -c \
              'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null'; then
              test -f "$ANDROID_HOME/platforms/android-36/android.jar"
              test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
              exit 0
            fi
            echo "::warning::Android SDK installation attempt $attempt timed out or failed"
          done
          echo "::error::Android SDK installation failed after two bounded attempts"
          exit 1
      - name: Fail-closed Customer Android Maven recovery regression
        run: node tests/native-customer-p0-maven-recovery.cjs
      - name: Require real geographic pixels before reporting Customer map ready
        run: node tests/native-customer-map-ready.cjs
      - name: Customer JVM and real UI harness builds
        shell: bash
        run: |
          set -euo pipefail
          python3 native-android/qa/gradle_maven_recovery.py \
            --log artifacts/customer-p0/gradle-first-attempt.log -- \
            gradle -p native-android :customer:testDebugUnitTest :customer:assembleDebug :customer:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Android acceleration
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
      - name: Thirty actual picker cycles and early GL background
        env:
          QG_P0_API: ${{ matrix.api }}
        run: python3 native-android/qa/run-customer-p0.py
      - name: Preserve failures and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: customer-p0-api-${{ matrix.api }}
          path: |
            artifacts/customer-p0/
            native-android/customer/build/reports/tests/
            native-android/customer/build/outputs/androidTest-results/
          if-no-files-found: warn
