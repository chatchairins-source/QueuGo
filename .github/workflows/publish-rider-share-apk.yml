name: Publish Rider Share APK

on:
  push:
    branches:
      - work-native-credit-live-enablement-20261016
    paths:
      - .github/workflows/publish-rider-share-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "38859123459"
      RELEASE_TAG: "rider-test-20261016-online-fix-latest"
      RELEASE_TARGET: "9df7e8c1751f31dbaf0710f5d0b947f9be749dbe"
      ASSET_NAME: "QueueGo-Rider-Test-20261016-Online-Fix.apk"
    steps:
      - name: Download exact passed Native Pilot artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name queuego-native-pilot-apks \
            --dir dist

      - name: Select Rider APK only
        run: |
          set -euo pipefail
          APK="$(find dist -type f -iname '*rider*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$ASSET_NAME"
          sha256sum "$ASSET_NAME"

      - name: Publish shareable prerelease asset
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ASSET_NAME" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$ASSET_NAME" \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_TARGET" \
              --title "QueueGo Rider Test — Online Fix 2026-10-16" \
              --notes "Direct Rider APK for owner real-device testing. Source Native Pilot run 38859123459 at 9df7e8c, including Rider Production-schema online compatibility. Test prerelease; not a certified Play Store release." \
              --prerelease
          fi
