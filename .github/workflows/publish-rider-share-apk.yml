name: Publish Rider Share APK

on:
  push:
    branches:
      - work-native-credit-live-enablement-20261016
    paths:
      - .github/workflows/publish-rider-share-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "38862619268"
      RELEASE_TAG: "android-test-all-20261016-online-fix1"
      ASSET_NAME: "QueueGo-Rider-Test-Latest-cc3e37.apk"
    steps:
      - name: Download exact passed Native Pilot artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name queuego-native-pilot-apks \
            --dir dist

      - name: Select Rider APK only
        run: |
          set -euo pipefail
          APK="$(find dist -type f -iname '*rider*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$ASSET_NAME"
          sha256sum "$ASSET_NAME"

      - name: Upload Rider APK to existing shareable release
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null
          gh release upload "$RELEASE_TAG" "$ASSET_NAME" \
            --repo "${{ github.repository }}" \
            --clobber
