name: QueueGo Android RC Verification

on:
  push:
    branches:
      - work/pre-android-release-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: customer
            appid: com.queuego.customer
            appname: QueueGo
            source: .
          - role: merchant
            appid: com.queuego.merchant
            appname: QueueGo Merchant
            source: merchant
          - role: rider
            appid: com.queuego.rider
            appname: QueueGo Rider
            source: rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android-build
          npm install --no-audit --no-fund
          rm -rf www android
          mkdir -p www
          if [ "${{ matrix.role }}" = "customer" ]; then
            cp ../index.html www/index.html
            cp ../table-order.css ../table-order.js ../table-order.html www/
          elif [ "${{ matrix.role }}" = "merchant" ]; then
            cp ../merchant/* www/
            cp ../role-realtime.js www/
            python3 -c "from pathlib import Path; p=Path('www/index.html'); p.write_text(p.read_text().replace('../role-realtime.js','role-realtime.js'))"
            cp ../table-order.html ../table-order.css ../table-order.js www/
          else
            cp ../rider/index.html www/index.html
          fi
          node -e "let c=require('./capacitor.config.json');c.appId='${{ matrix.appid }}';c.appName='${{ matrix.appname }}';require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android

      - name: Configure Android runtime
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          root=Path('android-build/android')
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.VIBRATE',
          ]
          missing=[p for p in perms if p not in s]
          if missing:
            block='\n'.join(f'    <uses-permission android:name="{p}" />' for p in missing)
            s=s.replace('<application',block+'\n    <application',1)
          # File/image selection uses the Android system picker. Do not request camera,
          # broad storage, media-library, microphone, contacts, or background location.
          forbidden=[
            'android.permission.CAMERA','android.permission.RECORD_AUDIO',
            'android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.READ_MEDIA_IMAGES','android.permission.ACCESS_BACKGROUND_LOCATION'
          ]
          if any(p in s for p in forbidden):
            raise RuntimeError('Unexpected sensitive Android permission found')
          if os.environ['QG_ROLE']=='merchant' and 'usesCleartextTraffic=' not in s:
            # Only Merchant may call a user-configured RFC1918/local HTTP print bridge.
            s=s.replace('<application','<application android:usesCleartextTraffic="true"',1)
          manifest.write_text(s)

          # Google Play requires API 36 for new/updated phone apps after 2026-08-31.
          variables=root/'variables.gradle'
          v=variables.read_text()
          for key in ('compileSdkVersion','targetSdkVersion'):
            v,n=re.subn(rf'({key}\s*=\s*)\d+',rf'\g<1>36',v,count=1)
            if n!=1: raise RuntimeError(f'{key} not found')
          variables.write_text(v)

          # Native Android Back: follow WebView/history first; exit only at the root.
          activity=next((root/'app/src/main/java').rglob('MainActivity.java'))
          old=activity.read_text()
          package=re.search(r'package\s+([^;]+);',old)
          if not package: raise RuntimeError('MainActivity package not found')
          mixed=''
          if os.environ['QG_ROLE']=='merchant':
            mixed='''\n        // Local print bridge compatibility. JS restricts cleartext URLs to private/local hosts.\n        getBridge().getWebView().getSettings().setMixedContentMode(android.webkit.WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);'''
          activity.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);{mixed}
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {{
                      @Override
                      public void handleOnBackPressed() {{
                          if (getBridge() != null && getBridge().getWebView().canGoBack()) {{
                              getBridge().getWebView().goBack();
                          }} else {{
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }}
                      }}
                  }});
              }}
          }}
          ''')
          PY

      - name: Verify Android release config
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          grep -q 'targetSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'compileSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'ACCESS_FINE_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -Eq 'CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|ACCESS_BACKGROUND_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          if [ "$QG_ROLE" != "merchant" ]; then
            ! grep -q 'usesCleartextTraffic="true"' android-build/android/app/src/main/AndroidManifest.xml
          fi

      - name: Create QueueGo Q launcher icon
        shell: bash
        run: |
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          from pathlib import Path
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          base=Path('android-build/android/app/src/main/res')
          for folder,n in sizes.items():
              d=base/folder; d.mkdir(parents=True,exist_ok=True)
              im=Image.new('RGBA',(n,n),(255,255,255,255))
              dr=ImageDraw.Draw(im)
              red=(231,9,43,255)
              w=max(4,round(n*0.14))
              box=(round(n*0.20),round(n*0.17),round(n*0.72),round(n*0.69))
              dr.ellipse(box,outline=red,width=w)
              dr.line((round(n*0.56),round(n*0.56),round(n*0.80),round(n*0.80)),fill=red,width=w)
              im.save(d/'ic_launcher.png')
              im.save(d/'ic_launcher_round.png')
          PY

      - name: Configure release signing
        shell: bash
        env:
          QG_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
          QG_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
          QG_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
          QG_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$QG_KEYSTORE_B64"
          test -n "$QG_STORE_PASSWORD"
          test -n "$QG_KEY_ALIAS"
          test -n "$QG_KEY_PASSWORD"
          echo "$QG_KEYSTORE_B64" | base64 --decode > android-build/android/queuego-release.jks
          cat >> android-build/android/gradle.properties <<EOF
          QG_STORE_FILE=../queuego-release.jks
          QG_STORE_PASSWORD=$QG_STORE_PASSWORD
          QG_KEY_ALIAS=$QG_KEY_ALIAS
          QG_KEY_PASSWORD=$QG_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-build/android/app/build.gradle')
          s=p.read_text()
          marker='android {'
          signing="""android {
              signingConfigs {
                  release {
                      storeFile file(project.property("QG_STORE_FILE"))
                      storePassword project.property("QG_STORE_PASSWORD")
                      keyAlias project.property("QG_KEY_ALIAS")
                      keyPassword project.property("QG_KEY_PASSWORD")
                  }
              }
          """
          s=s.replace(marker,signing,1)
          s,count=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1)
          if count!=1: raise RuntimeError('Release build type not found')
          p.write_text(s)
          PY

      - name: Build signed AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-build/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../../QueueGo-${{ matrix.role }}-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "../../QueueGo-${{ matrix.role }}-release.apk"
          cd ../..
          sha256sum "QueueGo-${{ matrix.role }}-release.aab" "QueueGo-${{ matrix.role }}-release.apk" > "QueueGo-${{ matrix.role }}-SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: QueueGo-${{ matrix.role }}-android-release
          path: |
            QueueGo-${{ matrix.role }}-release.aab
            QueueGo-${{ matrix.role }}-release.apk
            QueueGo-${{ matrix.role }}-SHA256.txt
          if-no-files-found: error
