name: QueueGo Approved Icon Android RC

on:
  push:
    branches:
      - work/approved-queuego-icon-20261004

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: customer
            appid: com.queuego.customer
            appname: QueueGo
            source: .
          - role: merchant
            appid: com.queuego.merchant
            appname: QueueGo Merchant
            source: merchant
          - role: rider
            appid: com.queuego.rider
            appname: QueueGo Rider
            source: rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android-build
          npm install --no-audit --no-fund
          rm -rf www android
          mkdir -p www
          if [ "${{ matrix.role }}" = "customer" ]; then
            cp ../index.html www/index.html
            cp ../table-order.css ../table-order.js ../table-order.html www/
          elif [ "${{ matrix.role }}" = "merchant" ]; then
            cp ../merchant/* www/
            cp ../role-realtime.js www/
            python3 -c "from pathlib import Path; p=Path('www/index.html'); p.write_text(p.read_text().replace('../role-realtime.js','role-realtime.js'))"
            cp ../table-order.html ../table-order.css ../table-order.js www/
          else
            cp ../rider/index.html www/index.html
          fi
          node -e "let c=require('./capacitor.config.json');c.appId='${{ matrix.appid }}';c.appName='${{ matrix.appname }}';require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android

      - name: Configure Android runtime
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          root=Path('android-build/android')
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.VIBRATE',
          ]
          missing=[p for p in perms if p not in s]
          if missing:
            block='\n'.join(f'    <uses-permission android:name="{p}" />' for p in missing)
            s=s.replace('<application',block+'\n    <application',1)
          # File/image selection uses the Android system picker. Do not request camera,
          # broad storage, media-library, microphone, contacts, or background location.
          forbidden=[
            'android.permission.CAMERA','android.permission.RECORD_AUDIO',
            'android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.READ_MEDIA_IMAGES','android.permission.ACCESS_BACKGROUND_LOCATION'
          ]
          if any(p in s for p in forbidden):
            raise RuntimeError('Unexpected sensitive Android permission found')
          if 'usesCleartextTraffic="true"' in s:
            raise RuntimeError('Cleartext Android traffic must stay disabled')
          manifest.write_text(s)

          # Google Play requires API 36 for new/updated phone apps after 2026-08-31.
          variables=root/'variables.gradle'
          v=variables.read_text()
          for key in ('compileSdkVersion','targetSdkVersion'):
            v,n=re.subn(rf'({key}\s*=\s*)\d+',rf'\g<1>36',v,count=1)
            if n!=1: raise RuntimeError(f'{key} not found')
          variables.write_text(v)

          # Native Android Back: follow WebView/history first; exit only at the root.
          activity=next((root/'app/src/main/java').rglob('MainActivity.java'))
          old=activity.read_text()
          package=re.search(r'package\s+([^;]+);',old)
          if not package: raise RuntimeError('MainActivity package not found')
          activity.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {{
                      @Override
                      public void handleOnBackPressed() {{
                          if (getBridge() != null && getBridge().getWebView().canGoBack()) {{
                              getBridge().getWebView().goBack();
                          }} else {{
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }}
                      }}
                  }});
              }}
          }}
          ''')
          PY

      - name: Verify Android release config
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          grep -q 'targetSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'compileSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'ACCESS_FINE_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -Eq 'CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|ACCESS_BACKGROUND_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -q 'usesCleartextTraffic="true"' android-build/android/app/src/main/AndroidManifest.xml

      - name: Install approved QueueGo launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          dwebp android-build/branding/queuego-approved-icon.webp -o /tmp/queuego-approved-icon.png >/dev/null
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src_path=Path('/tmp/queuego-approved-icon.png')
          if not src_path.exists():
              raise RuntimeError('Approved QueueGo icon decode failed')

          src=Image.open(src_path).convert('RGBA')
          if src.width != src.height or src.width < 512:
              raise RuntimeError(f'Approved QueueGo icon must be square and at least 512px, got {src.size}')

          base=Path('android-build/android/app/src/main/res')
          sizes={
              'mipmap-mdpi':48,
              'mipmap-hdpi':72,
              'mipmap-xhdpi':96,
              'mipmap-xxhdpi':144,
              'mipmap-xxxhdpi':192,
          }

          for folder,n in sizes.items():
              d=base/folder
              d.mkdir(parents=True,exist_ok=True)
              for old in d.glob('ic_launcher*'):
                  old.unlink()
              icon=src.resize((n,n),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              # Adaptive foreground keeps the exact approved artwork; Android supplies the outer mask.
              icon.save(d/'ic_launcher_foreground.png',optimize=True)

          values=base/'values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="ic_launcher_background">#0B0F14</color></resources>\n'
          )

          adaptive=base/'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True,exist_ok=True)
          xml=(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/ic_launcher_background"/>\n'
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          PY

      - name: Build approved-icon Android RC
        shell: bash
        run: |
          set -euo pipefail
          cd android-build/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab "../../QueueGo-${{ matrix.role }}-approved-icon-RC-UNSIGNED.aab"
          cp app/build/outputs/apk/debug/app-debug.apk "../../QueueGo-${{ matrix.role }}-approved-icon-RC.apk"
          cd ../..
          sha256sum "QueueGo-${{ matrix.role }}-approved-icon-RC-UNSIGNED.aab" "QueueGo-${{ matrix.role }}-approved-icon-RC.apk" > "QueueGo-${{ matrix.role }}-approved-icon-RC.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: QueueGo-${{ matrix.role }}-approved-icon-android-rc
          path: |
            QueueGo-${{ matrix.role }}-approved-icon-RC-UNSIGNED.aab
            QueueGo-${{ matrix.role }}-approved-icon-RC.apk
            QueueGo-${{ matrix.role }}-approved-icon-RC.sha256
          if-no-files-found: error
