name: Publish QueueGo Rider Test APK

on:
  push:
    branches:
      - work-native-map-display-20261012
    paths:
      - .github/workflows/publish-rider-test-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download exact PASS artifact from Native Pilot 1355
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/chatchairins-source/QueuGo/actions/artifacts/11705982990/zip"             -o /tmp/native-apks.zip
          mkdir -p /tmp/native-apks
          unzip -q /tmp/native-apks.zip -d /tmp/native-apks
          RIDER_APK="$(find /tmp/native-apks -type f -name 'rider-debug.apk' -print -quit)"
          test -n "${RIDER_APK}"
          cp "${RIDER_APK}" /tmp/QueueGo-Rider-test-9f675d07.apk
          sha256sum /tmp/QueueGo-Rider-test-9f675d07.apk

      - name: Publish APK to isolated download branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin queuego-test-downloads
          git worktree add /tmp/queuego-downloads origin/queuego-test-downloads
          cp /tmp/QueueGo-Rider-test-9f675d07.apk /tmp/queuego-downloads/QueueGo-Rider-test-9f675d07.apk
          cd /tmp/queuego-downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QueueGo-Rider-test-9f675d07.apk
          if git diff --cached --quiet; then
            echo "APK already published"
          else
            git commit -m "chore(download): publish Rider test APK 9f675d07"
            git push origin HEAD:queuego-test-downloads
          fi
