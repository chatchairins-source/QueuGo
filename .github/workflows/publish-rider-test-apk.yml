name: Publish QueueGo Rider Work APK

on:
  push:
    branches:
      - work-native-map-display-20261012
      - work-native-rider-authenticated-20261012
    paths:
      - .github/workflows/publish-rider-test-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'

      - name: Install Android platform and verified Longdo SDK
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          sdk_status=${PIPESTATUS[1]}
          set -o pipefail
          test "${sdk_status}" -eq 0
          mkdir -p native-android/rider/libs
          curl -fsSL "https://api.longdo.com/map-android-SDK/LongdoMapAndroidSDK_v0.1.8.aar" -o native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar
          echo "0918c23673ba6c7a349746f005525aca2ff3470f8e2966d5d2a4cb633ae5980c  native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar" | sha256sum -c -

      - name: Build Rider APK from current Work branch
        run: |
          set -euo pipefail
          gradle -p native-android :rider:assembleDebug --stacktrace
          cp native-android/rider/build/outputs/apk/debug/rider-debug.apk /tmp/QueueGo-Rider-Work-latest.apk
          sha256sum /tmp/QueueGo-Rider-Work-latest.apk

      - name: Publish APK to isolated download branch
        run: |
          set -euo pipefail
          git fetch origin queuego-test-downloads
          git worktree add /tmp/queuego-downloads origin/queuego-test-downloads
          cp /tmp/QueueGo-Rider-Work-latest.apk /tmp/queuego-downloads/QueueGo-Rider-Work-latest.apk
          cd /tmp/queuego-downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add QueueGo-Rider-Work-latest.apk
          git commit -m "chore(download): publish latest Work Rider APK" || true
          git push origin HEAD:queuego-test-downloads
