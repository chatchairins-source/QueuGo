name: QueueGo P0 Financial Preflight Runtime
on:
  push:
    branches:
      - 'fix/backend-p0-preflight-runtime-fixture-20261121'
    paths:
      - 'ops/p0/dispatch-terminalization-preflight-readonly-20261120.sql'
      - 'tests/backend/dispatch-financial-preflight-runtime.cjs'
      - '.github/workflows/p0-financial-preflight-runtime.yml'
      - 'package-lock.json'
      - 'package.json'
  pull_request:
    branches:
      - 'fix/backend-p0-preflight-time-gate-20261120'
    paths:
      - 'ops/p0/dispatch-terminalization-preflight-readonly-20261120.sql'
      - 'tests/backend/dispatch-financial-preflight-runtime.cjs'
      - '.github/workflows/p0-financial-preflight-runtime.yml'
      - 'package-lock.json'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p0-financial-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pglite-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute actual financial preflight SQL on disposable PGlite
        run: |
          set -euo pipefail
          node tests/backend/dispatch-financial-preflight-runtime.cjs
      - name: Confirm no production connection or deployment step
        run: |
          set -euo pipefail
          test -f ops/p0/dispatch-terminalization-preflight-readonly-20261120.sql
          # Match only executable shell command lines, not this grep expression itself.
          ! grep -Eq '^[[:space:]]*(supabase[[:space:]]+(db[[:space:]]+push|migration[[:space:]]+up|link)([[:space:]]|$)|psql[[:space:]].*prod)' .github/workflows/p0-financial-preflight-runtime.yml
