name: QueueGo Rider Claim Deadline P0 Isolated
on:
  pull_request:
    branches: [work-native-reconcile-main-20261114]
    paths:
      - ops/p0/rider-claim-deadline-review-only.sql
      - tests/fixtures/rider-claims-production-20261121.sql
      - tests/backend/rider-claim-deadline-runtime.sql
      - .github/workflows/p0-rider-claim-deadline.yml
permissions:
  contents: read
jobs:
  rider-claim-deadline:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: qg_rider_claim_deadline_ci
          POSTGRES_PASSWORD: isolated-claim-only
        ports:
          - 55446:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qg_rider_claim_deadline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify original Production claim functions against proposed 15/30 minute timeout
        env:
          PGPASSWORD: isolated-claim-only
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55446 -U postgres -d qg_rider_claim_deadline_ci -f tests/backend/rider-claim-deadline-runtime.sql
