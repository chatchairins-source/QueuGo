name: Backend QR catalog POS eligibility

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261114023000_qg_table_catalog_pos_eligibility.sql'
      - 'tests/backend-qr-catalog-pos-eligibility.cjs'
      - '.github/workflows/backend-qr-catalog-pos-eligibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr-catalog-pos-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate regression test syntax
        run: node --check tests/backend-qr-catalog-pos-eligibility.cjs
      - name: Verify catalog and checkout eligibility contract
        run: node tests/backend-qr-catalog-pos-eligibility.cjs
