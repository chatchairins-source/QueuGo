name: QueueGo Installed Country Offline Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [work-native-pos-tax-foundation-20261029, work-native-rider-nav-unified-offline-20261030, work-native-bangkok-label-collision-probe-20261101]
    paths:
      - native-android/rider-navigation-map/src/androidTest/**
      - native-android/rider-maplibre-osm/src/main/java/com/queuego/ridermaplibreosm/ShortbreadVillageStyle.kt
      - native-android/qa/test_offline_label_pixel_gate.py
      - native-android/qa/run-rider-navigation-map-runtime.py
      - .github/workflows/native-country-offline-runtime.yml
  push:
    branches: [work-native-rider-nav-unified-offline-20261030]
    paths:
      - native-android/rider-navigation-map/src/androidTest/**
      - native-android/rider-maplibre-osm/src/main/java/com/queuego/ridermaplibreosm/ShortbreadVillageStyle.kt
      - native-android/qa/test_offline_label_pixel_gate.py
      - native-android/qa/run-rider-navigation-map-runtime.py
      - .github/workflows/native-country-offline-runtime.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: queuego-country-runtime-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  installed-country-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preflight real offline label framebuffer acceptance contract
        run: python3 -m unittest discover -s native-android/qa -p 'test_offline_label_pixel_gate.py' -v
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
      - name: Reuse the actual country data from the verified predecessor APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 41029740374 --repo "$GITHUB_REPOSITORY" --name queuego-native-pilot-apks --dir "$RUNNER_TEMP/queuego-reference-apks"
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, shutil, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          candidates = list((root / 'queuego-reference-apks').rglob('customer-debug.apk'))
          assert len(candidates) == 1, 'Expected exactly one predecessor Customer APK'
          assets = root / 'queuego-offline-assets'
          target = assets / 'maps'
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(candidates[0]) as archive:
              manifest = json.loads(archive.read('assets/maps/thailand-shortbread.json'))
              assert manifest['source_url'] == 'https://download.geofabrik.de/asia/thailand-261029.osm.pbf'
              for name in ('thailand-shortbread.pmtiles', 'thailand-shortbread.json'):
                  with archive.open('assets/maps/' + name) as source, (target / name).open('wb') as output:
                      shutil.copyfileobj(source, output, 1024 * 1024)
          spec = importlib.util.spec_from_file_location('country_assets', 'native-android/qa/prepare-thailand-map-assets.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          actual = module.inspect_archive(target / 'thailand-shortbread.pmtiles')
          assert actual['sha256'] == manifest['sha256'] and actual['bytes'] == manifest['bytes']
          print(json.dumps(actual))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('QG_OFFLINE_MAP_ASSETS=' + str(assets) + '\n')
          shutil.rmtree(root / 'queuego-reference-apks')
          PY
      - name: Install Android build platform
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - name: Enable actual Android acceleration
        run: |
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Execute country rendering and existing gesture/lifecycle tests without network
        env:
          QG_NAV_RUNTIME_OFFLINE: '1'
        run: python3 native-android/qa/run-rider-navigation-map-runtime.py
      - name: Save real country screenshots, connectivity and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queuego-installed-country-runtime
          path: |
            artifacts/rider-navigation-map-runtime/
            native-android/rider-navigation-map/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
