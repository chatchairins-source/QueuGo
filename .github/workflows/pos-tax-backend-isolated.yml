name: QueueGo POS Tax Backend Isolated
on:
  pull_request:
    branches:
      - 'work-native-**'
    paths:
      - 'QueueGo-POS-Tax-Foundation-Migration.sql'
      - 'QueueGo-POS-Tax-Checkout-Integration-Migration.sql'
      - 'tests/pos-tax-backend-isolated.cjs'
      - 'tests/fixtures/pos-order-guards-prod-20261122.json'
      - 'tests/fixtures/pos-payment-prod-20261122.json'
      - 'ops/p0/pos-payment-finite-review-only.sql'
      - '.github/workflows/pos-tax-backend-isolated.yml'
  push:
    branches:
      - 'test/pos-tax-backend-isolated-20261120'
      - 'work-native-reconcile-main-20261114'
    paths:
      - 'QueueGo-POS-Tax-Foundation-Migration.sql'
      - 'QueueGo-POS-Tax-Checkout-Integration-Migration.sql'
      - 'tests/pos-tax-backend-isolated.cjs'
      - 'tests/fixtures/pos-order-guards-prod-20261122.json'
      - 'tests/fixtures/pos-payment-prod-20261122.json'
      - 'ops/p0/pos-payment-finite-review-only.sql'
      - '.github/workflows/pos-tax-backend-isolated.yml'
permissions:
  contents: read
jobs:
  isolated-pos-tax:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: qg_pos_test_ci
          POSTGRES_PASSWORD: isolated-pos-tax-only
        ports:
          - 55448:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qg_pos_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked PostgreSQL test dependency
        run: npm ci --no-audit --no-fund
      - name: Verify VAT calculations, role isolation and captured POS order guards
        run: |
          set -euo pipefail
          mkdir -p artifacts/pos-tax
          node tests/pos-tax-backend-isolated.cjs | tee artifacts/pos-tax/pglite.json
      - name: Verify the same payment and tax acceptance on disposable PostgreSQL
        env:
          QG_POS_TEST_DATABASE_URL: postgresql://postgres:isolated-pos-tax-only@127.0.0.1:55448/qg_pos_test_ci
        run: |
          set -euo pipefail
          node tests/pos-tax-backend-isolated.cjs | tee artifacts/pos-tax/postgres.json
      - name: Retain isolated acceptance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pos-tax-payment-isolated
          path: artifacts/pos-tax/
          if-no-files-found: warn
