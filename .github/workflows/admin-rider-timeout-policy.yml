name: QueueGo Admin Rider Timeout Policy
on:
  pull_request:
    branches: [work-native-reconcile-main-20261114]
    paths:
      - admin/index.html
      - tests/admin-rider-timeout-policy.cjs
      - .github/workflows/admin-rider-timeout-policy.yml
permissions:
  contents: read
jobs:
  admin-timeout-15-30:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify 15/30 minute only Admin save contract
        run: node tests/admin-rider-timeout-policy.cjs
