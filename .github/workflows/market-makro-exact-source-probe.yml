name: Market Makro exact source probe

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ops/market/probe-makro-exact-source-images.cjs'
      - '.github/workflows/market-makro-exact-source-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact Makro Market product IDs
        run: node ops/market/probe-makro-exact-source-images.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-makro-exact-source-images
          path: artifacts/market-makro-exact/market-makro-exact-source-images.json
          if-no-files-found: error
          compression-level: 9
