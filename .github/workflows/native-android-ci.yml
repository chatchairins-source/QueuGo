name: QueueGo Native Android CI

on:
  push:
    branches: ["work/native-android-*"]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Reject wrapped-web implementations
        run: |
          if grep -R -n -E 'android\.webkit\.WebView|Capacitor|Cordova|TrustedWebActivity' native-android/*/src 2>/dev/null; then
            echo "Wrapped-web Android implementation is forbidden."
            exit 1
          fi
      - name: Customer native catalog gate
        run: node native-android/tests/customer-catalog.cjs
      - name: Native push transport gate
        run: |
          grep -q 'subscribe-native' native-android/core-push/src/main/java/com/queuetech/queuego/core/push/NativePushRepository.kt
          grep -q 'unsubscribe-native' native-android/core-push/src/main/java/com/queuetech/queuego/core/push/NativePushRepository.kt
          grep -q 'queuego-push' native-android/core-push/src/main/java/com/queuetech/queuego/core/push/NativePushRepository.kt
          grep -q '/functions/v1/' native-android/core-network/src/main/java/com/queuetech/queuego/core/network/QueueGoApi.kt

      - name: Rider native delivery flow gate
        run: |
          RIDER="native-android/rider-app/src/main/java/com/queuetech/queuego/rider"
          grep -q 'qg_get_my_rider_offer' "$RIDER/RiderRepository.kt"
          grep -q 'qg_rider_mark_arrival' "$RIDER/RiderRepository.kt"
          grep -q 'qg_pickup_with_photo' "$RIDER/RiderRepository.kt"
          grep -q 'qg_complete_with_photo' "$RIDER/RiderRepository.kt"
          grep -q 'qg_market_pickup_with_photo' "$RIDER/RiderRepository.kt"
          grep -q 'market_pickup_route_summary' "$RIDER/RiderRepository.kt"
          grep -q 'market_rider_group_action' "$RIDER/RiderRepository.kt"
          grep -q 'ActivityResultContracts.TakePicture' "$RIDER/RiderHomeScreen.kt"
          grep -q 'ตรวจรายการและถ่ายรูป' "$RIDER/RiderHomeScreen.kt"
          grep -q 'ตรวจส่งมอบและถ่ายรูป' "$RIDER/RiderHomeScreen.kt"
          grep -q 'รับงาน · \$leftSeconds วิ' "$RIDER/RiderHomeScreen.kt"
          if grep -R -n 'android.webkit.WebView' native-android/rider-app/src; then
            echo "Rider Native must not contain WebView"
            exit 1
          fi

      - name: Gradle help
        run: gradle -p native-android help
      - name: Build native debug apps
        run: gradle -p native-android :customer-app:assembleDebug :merchant-app:assembleDebug :rider-app:assembleDebug
      - name: Unit tests
        run: gradle -p native-android testDebugUnitTest

      - name: Upload native debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: queuego-native-debug-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            native-android/customer-app/build/outputs/apk/debug/customer-app-debug.apk
            native-android/merchant-app/build/outputs/apk/debug/merchant-app-debug.apk
            native-android/rider-app/build/outputs/apk/debug/rider-app-debug.apk
