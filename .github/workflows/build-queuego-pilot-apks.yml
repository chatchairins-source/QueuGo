name: QueueGo Android Pilot Test APK

on:
  workflow_dispatch:

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Pilot APK prerequisites
        shell: bash
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          if(!fs.existsSync('queuego-native-push.js')){
            console.error('::error::Native Android push client is missing.');
            process.exit(1);
          }
          const pkg=JSON.parse(fs.readFileSync('android-build/package.json','utf8'));
          if(pkg.dependencies?.['@capacitor/push-notifications']!=='8.0.0'){
            console.error('::error::Capacitor 8 push plugin is missing.');
            process.exit(1);
          }
          NODE
          test -n "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" || {
            echo "::error::Firebase google-services.json secret is missing."
            exit 1
          }

  build:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: customer
            appid: com.queuego.customer
            appname: QueueGo
            source: .
          - role: merchant
            appid: com.queuego.merchant
            appname: QueueGo Merchant
            source: merchant
          - role: rider
            appid: com.queuego.rider
            appname: QueueGo Rider
            source: rider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web bundle
        shell: bash
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          QG_APP_ID: ${{ matrix.appid }}
        run: |
          set -euo pipefail
          cd android-build
          npm install --no-audit --no-fund
          rm -rf www android
          mkdir -p www
          mkdir -p www/docs
          cp ../docs/privacy.html ../docs/account-deletion.html ../docs/community-guidelines.html www/docs/
          if [ "${{ matrix.role }}" = "customer" ]; then
            cp ../index.html www/index.html
            cp ../customer-features.js ../customer-features.css ../customer-laundry.js ../account-deletion.js ../queuego-ugc.js ../queuego-native-push.js ../queuego-push.js ../queuego-push-sw.js www/
            cp ../table-order.css ../table-order.js ../table-order.html www/
          elif [ "${{ matrix.role }}" = "merchant" ]; then
            cp ../merchant/* www/
            cp ../role-realtime.js ../account-deletion.js ../queuego-native-push.js ../queuego-push.js ../queuego-push-sw.js www/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          s=s.replace('../role-realtime.js','role-realtime.js')
          s=s.replace('../account-deletion.js','account-deletion.js')
          s=s.replace('../queuego-ugc.js','queuego-ugc.js')
          s=s.replace('../queuego-native-push.js','queuego-native-push.js')
          s=s.replace('../queuego-push.js','queuego-push.js')
          p.write_text(s)
          PY
            cp ../table-order.html ../table-order.css ../table-order.js www/
          else
            cp ../rider/index.html www/index.html
            cp ../account-deletion.js ../queuego-native-push.js ../queuego-push.js ../queuego-push-sw.js www/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          s=s.replace('../account-deletion.js','account-deletion.js')
          s=s.replace('../queuego-push.js','queuego-push.js')
          p.write_text(s)
          PY
          fi
          node -e "let c=require('./capacitor.config.json');c.appId='${{ matrix.appid }}';c.appName='${{ matrix.appname }}';require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap add android
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle || { echo "::error::Generated Android project is not compileSdk 36"; exit 1; }
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle || { echo "::error::Generated Android project is not targetSdk 36"; exit 1; }
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('android/app/google-services.json')
          data=json.loads(p.read_text())
          clients=data.get('client') or []
          if not data.get('project_info') or not clients:
              raise RuntimeError('Invalid Firebase google-services.json')
          packages={
              c.get('client_info',{}).get('android_client_info',{}).get('package_name')
              for c in clients
          }
          expected=os.environ['QG_APP_ID']
          if expected not in packages:
              raise RuntimeError(f'Firebase config has no Android client for {expected}')
          PY
          npx cap sync android

      - name: Configure Android runtime
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          root=Path('android-build/android')
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.VIBRATE',
          ]
          missing=[p for p in perms if p not in s]
          if missing:
            block='\n'.join(f'    <uses-permission android:name="{p}" />' for p in missing)
            s=s.replace('<application',block+'\n    <application',1)
          # File/image selection uses the Android system picker. Do not request camera,
          # broad storage, media-library, microphone, contacts, or background location.
          forbidden=[
            'android.permission.CAMERA','android.permission.RECORD_AUDIO',
            'android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.READ_MEDIA_IMAGES','android.permission.ACCESS_BACKGROUND_LOCATION'
          ]
          if any(p in s for p in forbidden):
            raise RuntimeError('Unexpected sensitive Android permission found')
          if 'usesCleartextTraffic="true"' in s:
            raise RuntimeError('Cleartext Android traffic must stay disabled')
          manifest.write_text(s)

          # Google Play requires API 36 for new/updated phone apps after 2026-08-31.
          variables=root/'variables.gradle'
          v=variables.read_text()
          for key in ('compileSdkVersion','targetSdkVersion'):
            v,n=re.subn(rf'({key}\s*=\s*)\d+',rf'\g<1>36',v,count=1)
            if n!=1: raise RuntimeError(f'{key} not found')
          variables.write_text(v)

          # Native Android Back: follow WebView/history first; exit only at the root.
          activity=next((root/'app/src/main/java').rglob('MainActivity.java'))
          old=activity.read_text()
          package=re.search(r'package\s+([^;]+);',old)
          if not package: raise RuntimeError('MainActivity package not found')
          activity.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {{
                      @Override
                      public void handleOnBackPressed() {{
                          if (getBridge() != null && getBridge().getWebView().canGoBack()) {{
                              getBridge().getWebView().goBack();
                          }} else {{
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }}
                      }}
                  }});
              }}
          }}
          ''')
          PY

      - name: Verify Android release config
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          grep -q 'targetSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'compileSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'ACCESS_FINE_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -Eq 'CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|ACCESS_BACKGROUND_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -q 'usesCleartextTraffic="true"' android-build/android/app/src/main/AndroidManifest.xml

      - name: Install approved QueueGo launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src_path=Path('android-build/branding/queuego-approved-icon.webp')
          if not src_path.exists():
              raise RuntimeError('Approved QueueGo icon source is missing')

          src=Image.open(src_path).convert('RGBA')
          if src.width != src.height or src.width < 512:
              raise RuntimeError(f'Approved QueueGo icon must be square and at least 512px, got {src.size}')

          play=src.resize((512,512),Image.Resampling.LANCZOS)
          play.save(Path('QueueGo-${{ matrix.role }}-play-icon-512.png'),optimize=True)

          base=Path('android-build/android/app/src/main/res')
          sizes={
              'mipmap-mdpi':48,
              'mipmap-hdpi':72,
              'mipmap-xhdpi':96,
              'mipmap-xxhdpi':144,
              'mipmap-xxxhdpi':192,
          }

          for folder,n in sizes.items():
              d=base/folder
              d.mkdir(parents=True,exist_ok=True)
              for old in d.glob('ic_launcher*'):
                  old.unlink()
              icon=src.resize((n,n),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              # Adaptive foreground keeps the exact approved artwork; Android supplies the outer mask.
              icon.save(d/'ic_launcher_foreground.png',optimize=True)

          values=base/'values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="ic_launcher_background">#0B0F14</color></resources>\n'
          )

          adaptive=base/'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True,exist_ok=True)
          xml=(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/ic_launcher_background"/>\n'
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          PY

      - name: Build Pilot test APK
        shell: bash
        run: |
          set -euo pipefail
          cd android-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../../QueueGo-${{ matrix.role }}-pilot-test.apk"
          cd ../..
          sha256sum "QueueGo-${{ matrix.role }}-pilot-test.apk" > "QueueGo-${{ matrix.role }}-pilot-test-SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: QueueGo-${{ matrix.role }}-pilot-test-apk
          path: |
            QueueGo-${{ matrix.role }}-pilot-test.apk
            QueueGo-${{ matrix.role }}-pilot-test-SHA256.txt
            QueueGo-${{ matrix.role }}-play-icon-512.png
          if-no-files-found: error
          retention-days: 7
