name: QueueGo Native Android Pilot

on:
  workflow_dispatch:
  push:
    branches:
      - queuego-native-android-v1
    paths:
      - 'native-android/**'
      - 'tests/native-android-source.cjs'
      - '.github/workflows/build-native-rider-pilot.yml'

permissions:
  contents: write

concurrency:
  group: queuego-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Download verified Longdo Android SDK
        run: |
          mkdir -p native-android/rider/libs
          curl -fsSL "https://api.longdo.com/map-android-SDK/LongdoMapAndroidSDK_v0.1.8.aar" -o native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar
          echo "52d98e8deaaef4400f2623eebb212daa  native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar" | md5sum -c -
      - name: Prepare native Rider Firebase config
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${QG_FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::warning::Firebase config secret is absent; native Rider APK will build without physical background-push certification"
            exit 0
          fi
          umask 077
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > native-android/rider/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('native-android/rider/google-services.json')
          data=json.loads(p.read_text())
          packages={
              c.get('client_info',{}).get('android_client_info',{}).get('package_name')
              for c in (data.get('client') or [])
          }
          if 'com.queuego.rider' not in packages:
              raise SystemExit('::error::Firebase config has no com.queuego.rider Android client')
          print('Native Rider Firebase config: valid')
          PY
      - name: Install regression dependencies
        run: npm ci
      - name: Full QueueGo regression
        run: npm test
      - name: Source integrity
        run: node tests/native-android-source.cjs
      - name: Verify launcher asset family
        run: node tests/native-launcher-assets.cjs
      - name: Verify Production category banner assets
        run: node tests/native-category-assets.cjs
      - name: Tracking coordinate and terminal-state unit tests
        run: gradle -p native-android :shared:testDebugUnitTest :customer:testDebugUnitTest :rider:testDebugUnitTest --no-build-cache --stacktrace
      - name: Build three native APKs
        run: gradle -p native-android :customer:assembleDebug :merchant:assembleDebug :rider:assembleDebug --no-build-cache --stacktrace
      - name: Reject WebView
        run: |
          if grep -R -E 'android\.webkit\.WebView|<WebView\b|loadUrl\(' native-android; then
            echo "WebView is forbidden in QueueGo native apps"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: queuego-native-pilot-apks
          path: |
            native-android/customer/build/outputs/apk/debug/customer-debug.apk
            native-android/merchant/build/outputs/apk/debug/merchant-debug.apk
            native-android/rider/build/outputs/apk/debug/rider-debug.apk
          if-no-files-found: error
      - name: Enable runner-only access to Android acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
          fi
      - name: Capture actual Rider launch on accelerated Android
        timeout-minutes: 12
        run: python3 native-android/qa/capture-rider-launch.py
      - name: Save real Android launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queuego-rider-native-launch-evidence
          path: artifacts/native-rider-launch/
          if-no-files-found: warn
          retention-days: 14
      # Explicit owner-requested sharing only; ordinary builds stay internal.
      # Public test APKs do not certify visual parity, E2E or Play readiness.
      - name: Publish owner-requested shareable test APKs
        if: success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[share-test-apks]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          test_tag="native-test-${short_sha}"
          latest_sha="$(git ls-remote origin refs/heads/queuego-native-android-v1 | cut -f1)"
          test "$latest_sha" = "$GITHUB_SHA"
          mkdir -p artifacts/shareable-native
          for role in customer merchant rider; do
            case "$role" in
              customer) label=Customer ;;
              merchant) label=Merchant ;;
              rider) label=Rider ;;
            esac
            cp "native-android/${role}/build/outputs/apk/debug/${role}-debug.apk" \
              "artifacts/shareable-native/QueueGo-${label}-${short_sha}.apk"
          done
          cp artifacts/native-rider-launch/matrix-metadata.json artifacts/shareable-native/android-launch-matrix.json
          (cd artifacts/shareable-native && sha256sum *.apk > SHA256SUMS.txt)
          cat > artifacts/shareable-native/release-notes.md <<'NOTES'
          Owner-requested downloadable DEBUG test APKs for Customer, Merchant and Rider.

          This is NOT a Play Store release or a Full Gate pass. Customer/Merchant authentication UI still differs from Production. Matched visual parity, authenticated food/Market/Laundry E2E, physical Samsung/lifecycle/background notifications, release signing and AAB gates remain open.

          CI checks regression, JVM tests, source/assets, three native builds, source WebView rejection and actual emulator fresh-session login at phone/small-phone/tablet sizes. Rider registration step one is opened without submitting an account. The attached launch matrix and SHA256SUMS identify the exact APK bytes.
          NOTES
          printf '\nSource commit: %s\nCI evidence: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> artifacts/shareable-native/release-notes.md
          if gh release view "$test_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${test_tag}" --jq '.object.sha')"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "$test_tag" artifacts/shareable-native/*.apk \
              artifacts/shareable-native/SHA256SUMS.txt artifacts/shareable-native/android-launch-matrix.json \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$test_tag" artifacts/shareable-native/*.apk \
              artifacts/shareable-native/SHA256SUMS.txt artifacts/shareable-native/android-launch-matrix.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "QueueGo Native Android test ${short_sha}" \
              --notes-file artifacts/shareable-native/release-notes.md
          fi
