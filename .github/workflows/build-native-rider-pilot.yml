  publish-rider-road-test:
    if: ${{ github.ref == 'refs/heads/work-native-rider-map-follow-stability-20261016' && github.event_name == 'push' }}
    needs: [native-pilot, map-display-only, navigation-map-runtime, maplibre-osm-runtime, continuous-dispatch-races, passenger-ride-races, credit-races]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Publish the exact tested Rider artifact for physical road testing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --name queuego-native-pilot-apks --dir pilot-apks
          mapfile -t rider_apks < <(find pilot-apks -type f -name rider-debug.apk)
          test "${#rider_apks[@]}" -eq 1
          asset="QueueGo-Rider-RoadTest-${GITHUB_SHA:0:8}.apk"
          tag="rider-road-test-${GITHUB_SHA:0:8}"
          cp "${rider_apks[0]}" "$asset"
          unzip -t "$asset" >/dev/null
          sha256sum "$asset" > SHA256SUMS.txt
          printf 'Source HEAD: %s\nPilot run: %s\nAll seven automated gates passed. Physical road test remains pending. Test APK only.\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" SHA256SUMS.txt SOURCE.txt --clobber
          else
            gh release create "$tag" "$asset" SHA256SUMS.txt SOURCE.txt --target "$GITHUB_SHA" --prerelease --title "QueueGo Rider road test ${GITHUB_SHA:0:8}" --notes-file SOURCE.txt
          fi
          echo "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset" >> "$GITHUB_STEP_SUMMARY"
