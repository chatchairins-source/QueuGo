name: QueueGo Native Android Pilot

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      bundle_country:
        type: boolean
        default: false
    secrets:
      QG_FIREBASE_GOOGLE_SERVICES_JSON_B64:
        required: false
  pull_request:
    branches:
      - 'work-native-**'
  push:
    branches:
      - queuego-native-android-v1
      - 'work-native-**'
      - 'fix/native-**'
      - 'work-rider-**'
      - work-native-release-integration-20261010
      - work-native-release-preflight-20261010
      - work-native-voice-background-20261010
      - work-native-voice-call-v1-20261010
      - work-native-voice-controller-v1-20261010
      - work-native-voice-turn-client-v1-20261010
      - work-native-voice-integration-v1-20261010
      - work-native-voice-release-candidate-v1-20261010
      - work-native-voice-push-release-candidate-v1-20261010
      - work-native-customer-logout-integration-20261010
      - work-native-customer-location-integration-v2-20261010
      - work-native-printer-ticket-parity-20261010
      - work-native-order-number-parity-20261010
      - work-native-printer-durable-history-20261010
      - work-native-merchant-printer-20261010
      - work-native-merchant-login-parity-20261010
      - work-native-verified-integration-20261010
      - work-native-rpc-null-contract-20261010
      - work-native-pos-edit-idempotency-20261010
    paths:
      - CHECKLIST.md
      - docs/PROJECT-MEMORY.md
      # Full regression consumes shared Web sources; validate their exact HEAD too.
      - 'admin/**'
      - 'merchant/**'
      - 'rider/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'native-android/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/native-android-source.cjs'
      - 'tests/native-pos-edit-idempotency.cjs'
      - 'tests/native-voice-call-contract.cjs'
      - 'tests/native-voice-turn-edge.cjs'
      - 'tests/native-voice-ui-contract.cjs'
      - 'tests/native-voice-background.cjs'
      - 'tests/native-backend-migration-sync.cjs'
      - 'supabase/functions/queuego-push/**'
      - 'supabase/functions/queuego-credit*/**'
      - 'supabase/migrations/*credit*.sql'
      - 'supabase/migrations/*rider*.sql'
      - 'supabase/migrations/*legacy_gp*.sql'
      - 'supabase/migrations/*passenger_ride*.sql'
      - 'supabase/migrations/*express*.sql'
      - 'tests/express*.cjs'
      - 'tests/fixtures/express*.cjs'
      - 'supabase/functions/queuego-express-quote/**'
      # Route Bundle Phase 2 full regression consumes these exact SQL/Edge sources.
      - 'supabase/functions/queuego-route-bundle-matrix/**'
      - 'supabase/migrations/*route_bundle*.sql'
      - 'queuego-credit.js'
      - 'queuego-credit.css'
      - 'ops/native-push-session-binding-proposal-*.sql'
      - 'tests/native-push-session-binding.cjs'
      - 'tests/native-release-gate.cjs'
      - 'tests/native-release-workflow.cjs'
      - '.github/workflows/build-native-release.yml'
      - 'tests/play-store-readiness.cjs'
      - 'tests/security-auth-definer-review.cjs'
      - 'docs/security-auth-definer-review.json'
      - 'docs/security-anon-definer-allowlist.json'
      - 'docs/play-closed-beta-readiness.md'
      - 'docs/play-store-listing-draft.md'
      - 'docs/play-app-access-content-rating.md'
      - 'docs/pilot-recovery-manifest.json'
      - 'docs/privacy.html'
      - 'docs/account-deletion.html'
      - '.github/workflows/release-secret-readiness.yml'
      - 'tests/background-push.cjs'
      - 'tests/native-customer-merchant-push.cjs'
      - 'ops/native-voice-call-schema-proposal-*.sql'
      - 'supabase/migrations/*native_push_session_binding*.sql'
      - 'supabase/migrations/*native_voice_call_backend*.sql'
      - 'supabase/functions/queuego-turn/**'
      - 'supabase/migrations/*pos_edit_bill_idempotency.sql'
      - 'ops/pos-edit-idempotency-schema-baseline-*.sql'
      - '.github/workflows/build-native-rider-pilot.yml'

permissions:
  contents: read

concurrency:
  group: queuego-native-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

# Pilot APKs use the already deployed QueueGo Map endpoint used by the Customer
# Web map. Production release builds still require an explicit validated URL.
env:
  QG_MAP_SERVICE_BASE_URL: ${{ vars.QG_MAP_SERVICE_BASE_URL || 'https://queuego-map-buriram.onrender.com' }}

jobs:
  native-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare native Firebase configs
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${QG_FIREBASE_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::warning::Firebase config secret is absent; native Rider APK will build without physical background-push certification"
            exit 0
          fi
          umask 077
          tmp="$(mktemp)"
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$tmp"
          QG_FIREBASE_CONFIG="$tmp" python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          p=Path(os.environ['QG_FIREBASE_CONFIG'])
          data=json.loads(p.read_text())
          packages={
              c.get('client_info',{}).get('android_client_info',{}).get('package_name')
              for c in (data.get('client') or [])
          }
          targets={
              'com.queuego.customer': Path('native-android/customer/google-services.json'),
              'com.queuego.merchant': Path('native-android/merchant/google-services.json'),
              'com.queuego.rider': Path('native-android/rider/google-services.json'),
          }
          if 'com.queuego.rider' not in packages:
              raise SystemExit('::error::Firebase config has no com.queuego.rider Android client')
          for package,target in targets.items():
              if package in packages:
                  shutil.copyfile(p,target)
                  os.chmod(target,0o600)
                  print(f'Native Firebase config: {package} valid')
              else:
                  print(f'::warning::Firebase config has no {package} Android client; that app will build without physical background-push certification')
          PY
          rm -f "$tmp"
      - name: Install regression dependencies
        run: npm ci
      - name: Full QueueGo regression
        run: npm test
      - name: Native POS edit idempotency SQL contracts
        run: node tests/native-pos-edit-idempotency.cjs
      - name: Native Customer Merchant push contracts
        run: node tests/native-customer-merchant-push.cjs
      - name: Native push session binding contracts
        run: node tests/native-push-session-binding.cjs
      - name: Native release packaging guard
        run: node tests/native-release-gate.cjs
      - name: Native voice call SQL contracts
        run: node tests/native-voice-call-contract.cjs
      - name: Native voice TURN edge contracts
        run: node tests/native-voice-turn-edge.cjs
      - name: Native voice UI contracts
        run: node tests/native-voice-ui-contract.cjs
      - name: Native voice background lifecycle contracts
        run: node tests/native-voice-background.cjs
      - name: Native backend migration mirror
        run: node tests/native-backend-migration-sync.cjs
      - name: Native Production RPC contract preflight (read-only generator)
        run: |
          python3 native-android/qa/test-native-rpc-production-preflight.py
          python3 native-android/qa/native-rpc-production-preflight.py --sql > "$RUNNER_TEMP/queuego-native-rpc-readonly.sql"
          grep -q 'pg_catalog.pg_proc' "$RUNNER_TEMP/queuego-native-rpc-readonly.sql"
          echo "Production RPC live check remains a separate Release Gate; no database credentials used here."
      - name: Emulator APK transport recovery regression (no device required)
        run: python3 -m unittest discover -s native-android/qa -p 'test_adb_install_recovery.py' -v
      - name: Authenticated Rider screenshot hierarchy freshness regression
        run: python3 -m unittest discover -s native-android/qa -p 'test_authenticated_review_hierarchy.py' -v
      - name: Source integrity
        run: node tests/native-android-source.cjs
      - name: Verify launcher asset family
        run: node tests/native-launcher-assets.cjs
      - name: Verify Production category banner assets
        run: node tests/native-category-assets.cjs
      - name: Build and bundle pinned nationwide offline map
        if: ${{ inputs.bundle_country || startsWith(github.ref_name, 'work-native-rider-nav-unified-offline-') || startsWith(github.head_ref, 'work-native-rider-nav-unified-offline-') }}
        env:
          QG_MAP_DATA_DIR: ${{ runner.temp }}/queuego-country-map
          QG_THAILAND_PBF_URL: https://download.geofabrik.de/asia/thailand-261029.osm.pbf
        run: |
          set -euo pipefail
          mkdir -p "$QG_MAP_DATA_DIR"
          curl --fail --location --retry 2 "$QG_THAILAND_PBF_URL" -o "$QG_MAP_DATA_DIR/thailand-latest.osm.pbf"
          echo "0f26968be9675bbdadaab232d19cafb4464e6535a73afe5eee4afd94b43825c6  $QG_MAP_DATA_DIR/thailand-latest.osm.pbf" | sha256sum -c -
          bash native-android/qa/build-thailand-shortbread-pmtiles.sh
          archive="$QG_MAP_DATA_DIR/thailand-shortbread.pmtiles"
          python3 native-android/qa/prepare-thailand-map-assets.py "$archive" "$RUNNER_TEMP/queuego-offline-assets" \
            --expected-sha256 "$(sha256sum "$archive" | cut -d ' ' -f 1)" \
            --source-url "$QG_THAILAND_PBF_URL" --source-date 2026-10-29
          echo "QG_OFFLINE_MAP_ASSETS=$RUNNER_TEMP/queuego-offline-assets" >> "$GITHUB_ENV"
      - name: Tracking coordinate and terminal-state unit tests
        run: gradle -p native-android :shared:testDebugUnitTest :merchant:testDebugUnitTest :customer:testDebugUnitTest :rider:testDebugUnitTest :rider-navigation-map:testDebugUnitTest :rider-maplibre-osm:testDebugUnitTest --no-build-cache --stacktrace
      - name: Build three native APKs
        run: gradle -p native-android :customer:assembleDebug :merchant:assembleDebug :rider:assembleDebug :rider:assembleDebugAndroidTest --no-build-cache --stacktrace
      - name: Verify Android 16 KB page-size packaging
        run: |
          python3 native-android/qa/verify-16kb-page-size.py \
            native-android/customer/build/outputs/apk/debug/customer-debug.apk \
            native-android/merchant/build/outputs/apk/debug/merchant-debug.apk \
            native-android/rider/build/outputs/apk/debug/rider-debug.apk
      - name: Reject WebView
        run: |
          if grep -R -E 'android\.webkit\.WebView|<WebView\b|loadUrl\(' native-android; then
            echo "WebView is forbidden in QueueGo native apps"
            exit 1
          fi
      - name: Verify installed Thailand APK assets
        if: ${{ env.QG_OFFLINE_MAP_ASSETS != '' }}
        run: |
          python3 native-android/qa/verify-bundled-thailand-apks.py --source-sha "$(git rev-parse HEAD)" \
            native-android/customer/build/outputs/apk/debug/customer-debug.apk \
            native-android/merchant/build/outputs/apk/debug/merchant-debug.apk \
            native-android/rider/build/outputs/apk/debug/rider-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-native-pilot-apks
          path: |
            native-android/customer/build/outputs/apk/debug/customer-debug.apk
            native-android/merchant/build/outputs/apk/debug/merchant-debug.apk
            native-android/rider/build/outputs/apk/debug/rider-debug.apk
          if-no-files-found: error
      - name: Enable runner-only access to Android acceleration
        run: |
          set -euo pipefail
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
          fi
      - name: Capture native launch, map and voice service lifecycle on Android
        env:
          # Exercise the pinned real map archive in debug CI.
          QG_DEBUG_MAP_ARCHIVE: '1'
        timeout-minutes: 12
        run: python3 native-android/qa/capture-rider-launch.py
      - name: Save real Android launch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: queuego-rider-native-launch-evidence
          path: artifacts/native-rider-launch/
          if-no-files-found: warn
          retention-days: 14
      - name: Test installed country archive and camera without internet
        if: ${{ env.QG_OFFLINE_MAP_ASSETS != '' }}
        timeout-minutes: 20
        env:
          QG_NAV_RUNTIME_OFFLINE: '1'
        run: python3 native-android/qa/run-rider-navigation-map-runtime.py
      - name: Save nationwide offline evidence
        if: ${{ always() && env.QG_OFFLINE_MAP_ASSETS != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queuego-thailand-offline-evidence
          path: |
            artifacts/rider-navigation-map-runtime/
            native-android/rider-navigation-map/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
      - name: Export freshly built role APKs after runtime gates
        if: ${{ env.QG_OFFLINE_MAP_ASSETS != '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/role-export
          python3 native-android/qa/verify-bundled-thailand-apks.py --source-sha "$(git rev-parse HEAD)" \
            native-android/customer/build/outputs/apk/debug/customer-debug.apk \
            native-android/merchant/build/outputs/apk/debug/merchant-debug.apk \
            native-android/rider/build/outputs/apk/debug/rider-debug.apk > artifacts/role-export/APK-MANIFEST.json
          for role in customer merchant rider; do
            mkdir -p "artifacts/role-export/$role"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
              "native-android/$role/build/outputs/apk/debug/$role-debug.apk" > "artifacts/role-export/$role/APK-SIGNATURE.txt"
          done
          python3 native-android/qa/export-role-apks.py artifacts/role-export/APK-MANIFEST.json artifacts/role-export
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ env.QG_OFFLINE_MAP_ASSETS != '' }}
        with:
          name: queuego-tested-customer-apk
          path: artifacts/role-export/customer/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ env.QG_OFFLINE_MAP_ASSETS != '' }}
        with:
          name: queuego-tested-merchant-apk
          path: artifacts/role-export/merchant/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ env.QG_OFFLINE_MAP_ASSETS != '' }}
        with:
          name: queuego-tested-rider-apk
          path: artifacts/role-export/rider/
          compression-level: 0
          if-no-files-found: error
      # Mission 2026-10-10: incomplete builds and evidence remain internal.
      # Public APK/AAB delivery requires the full three-role Release Gate.

  rpc-catalog-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: queuego_rpc_catalog_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queuego_rpc_catalog_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test actual RPC catalog semantics on isolated PostgreSQL
        env:
          QG_TEST_PG_URL: postgresql://postgres:isolated-ci-test@127.0.0.1:5432/queuego_rpc_catalog_gate
        run: node tests/native-rpc-catalog-postgres.cjs

  continuous-dispatch-races:
    if: ${{ github.ref == 'refs/heads/work-native-rider-nav-unified-offline-20261030' || github.head_ref == 'work-native-rider-nav-unified-offline-20261030' || github.ref == 'refs/heads/queuego-native-android-v1' || github.ref == 'refs/heads/work-native-rider-map-follow-stability-20261016' || startsWith(github.ref, 'refs/heads/work-native-credit-') || startsWith(github.ref, 'refs/heads/work-native-rider-continuous-dispatch-') || startsWith(github.ref, 'refs/heads/work-native-ride-passenger-') || startsWith(github.ref, 'refs/heads/work-native-rider-queuego-route-authority-') || startsWith(github.ref, 'refs/heads/work-native-ride-entry-recovery-') || startsWith(github.ref, 'refs/heads/work-native-express-') || startsWith(github.ref, 'refs/heads/work-native-release-unified-') || startsWith(github.ref, 'refs/heads/work-native-route-bundle-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: queuego_dispatch_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queuego_dispatch_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Independent PostgreSQL dispatch and promotion races
        env:
          QG_TEST_PG_URL: postgresql://postgres:isolated-ci-test@127.0.0.1:5432/queuego_dispatch_gate
        run: node tests/rider-continuous-dispatch-races.cjs

  route-bundle-stack-races:
    if: ${{ github.ref == 'refs/heads/work-native-rider-nav-unified-offline-20261030' || github.head_ref == 'work-native-rider-nav-unified-offline-20261030' || github.ref == 'refs/heads/queuego-native-android-v1' || github.ref == 'refs/heads/work-native-rider-map-follow-stability-20261016' || startsWith(github.ref, 'refs/heads/work-native-credit-') || startsWith(github.ref, 'refs/heads/work-native-rider-continuous-dispatch-') || startsWith(github.ref, 'refs/heads/work-native-ride-passenger-') || startsWith(github.ref, 'refs/heads/work-native-rider-queuego-route-authority-') || startsWith(github.ref, 'refs/heads/work-native-ride-entry-recovery-') || startsWith(github.ref, 'refs/heads/work-native-express-') || startsWith(github.ref, 'refs/heads/work-native-release-unified-') || startsWith(github.ref, 'refs/heads/work-native-route-bundle-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: queuego_bundle_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queuego_bundle_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Independent PostgreSQL 3–5 Order Route Bundle races
        env:
          QG_TEST_PG_URL: postgresql://postgres:isolated-ci-test@127.0.0.1:5432/queuego_bundle_gate
        run: node tests/route-bundle-stack-races.cjs

  passenger-ride-races:
    if: ${{ github.ref == 'refs/heads/work-native-rider-nav-unified-offline-20261030' || github.head_ref == 'work-native-rider-nav-unified-offline-20261030' || github.ref == 'refs/heads/queuego-native-android-v1' || github.ref == 'refs/heads/work-native-rider-map-follow-stability-20261016' || startsWith(github.ref, 'refs/heads/work-native-ride-passenger-') || startsWith(github.ref, 'refs/heads/work-native-credit-') || startsWith(github.ref, 'refs/heads/work-native-rider-continuous-dispatch-') || startsWith(github.ref, 'refs/heads/work-native-rider-queuego-route-authority-') || startsWith(github.ref, 'refs/heads/work-native-ride-entry-recovery-') || startsWith(github.ref, 'refs/heads/work-native-express-') || startsWith(github.ref, 'refs/heads/work-native-release-unified-') || startsWith(github.ref, 'refs/heads/work-native-route-bundle-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test
          POSTGRES_DB: queuego_passenger_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d queuego_passenger_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Independent PostgreSQL Passenger Ride races
        env:
          QG_TEST_PG_URL: postgresql://postgres:isolated-ci-test@127.0.0.1:5432/queuego_passenger_gate
