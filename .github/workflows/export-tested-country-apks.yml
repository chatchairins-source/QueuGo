name: QueueGo Export Tested Country APKs

on:
  workflow_dispatch:
  pull_request:
    branches: ['work-native-**']
    paths:
      - .github/workflows/export-tested-country-apks.yml
      - .github/workflows/build-native-rider-pilot.yml
      - native-android/qa/export-role-apks.py
      - native-android/qa/prepare-thailand-map-assets.py
      - 'native-android/**/src/main/**'
      - 'native-android/**/src/androidTest/**'
      - 'native-android/**/src/test/**'
      - 'native-android/**/build.gradle.kts'
      - 'native-android/settings.gradle.kts'
      - 'native-android/gradle.properties'
      - 'native-android/gradle/wrapper/**'
      - tests/native-country-runtime-pr-gate.cjs
  push:
    branches: ['work-native-**', 'fix/native-country-export-**']
    paths:
      - .github/workflows/export-tested-country-apks.yml
      - .github/workflows/build-native-rider-pilot.yml
      - native-android/qa/export-role-apks.py
      - native-android/qa/prepare-thailand-map-assets.py
      - 'native-android/**/src/main/**'
      - 'native-android/**/src/androidTest/**'
      - 'native-android/**/src/test/**'
      - 'native-android/**/build.gradle.kts'
      - 'native-android/settings.gradle.kts'
      - 'native-android/gradle.properties'
      - 'native-android/gradle/wrapper/**'
      - tests/native-country-runtime-pr-gate.cjs

permissions:
  # The called pilot contains a separate, branch-gated legacy publisher that
  # declares contents: write. GitHub validates reusable-job permissions at
  # startup even when that publisher is skipped on country-export branches.
  # Keep the caller permission compatible until the publisher is extracted.
  contents: write
  actions: read

# Reuse the current checkout's complete build/test pipeline. Never redistribute
# binaries from a hard-coded predecessor run or substitute a historical SHA.
jobs:
  export-tested-role-apks:
    uses: ./.github/workflows/build-native-rider-pilot.yml
    with:
      bundle_country: true
    secrets:
      QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
