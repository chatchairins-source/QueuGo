name: Rider MapLibre reviewed source compatibility build
on:
  push:
    branches: ['work-rider-maplibre-4625-*']
    paths: ['native-android/qa/maplibre-swiftshader/**', '.github/workflows/rider-maplibre-compat.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rider-maplibre-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        abi: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install exact official SDK source toolchain
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' 'ndk;28.2.13676358' 'cmake;3.31.0'
      - name: Compile pinned upstream source with reviewed shader fix
        run: bash native-android/qa/maplibre-swiftshader/build-sdk.sh '${{ matrix.abi }}'
      - name: Retain dependency candidate and exact provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maplibre-uniform4625-${{ matrix.abi }}-${{ github.sha }}
          path: ${{ runner.temp }}/maplibre-compat-output/
          if-no-files-found: error
          retention-days: 30
