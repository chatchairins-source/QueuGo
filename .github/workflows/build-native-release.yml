name: QueueGo Native Android Certified Release

on:
  workflow_dispatch:
    inputs:
      certification_run_id:
        description: Successful evidence workflow run on this exact HEAD containing queuego-native-release-certification
        required: true
        type: string
      version_name:
        description: Release versionName in x.y.z form
        required: true
        type: string
      customer_version_code:
        description: Customer release versionCode
        required: true
        type: string
      merchant_version_code:
        description: Merchant release versionCode
        required: true
        type: string
      rider_version_code:
        description: Rider release versionCode
        required: true
        type: string
      customer_play_max_version_code:
        description: Highest Customer versionCode currently observed in Play Console
        required: true
        type: string
      merchant_play_max_version_code:
        description: Highest Merchant versionCode currently observed in Play Console
        required: true
        type: string
      rider_play_max_version_code:
        description: Highest Rider versionCode currently observed in Play Console
        required: true
        type: string
      signing_certificate_sha256:
        description: Certified upload/signing certificate SHA-256 fingerprint
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: queuego-native-certified-release
  cancel-in-progress: false

jobs:
  certified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QG_NATIVE_VERSION_NAME: ${{ inputs.version_name }}
      QG_CUSTOMER_VERSION_CODE: ${{ inputs.customer_version_code }}
      QG_MERCHANT_VERSION_CODE: ${{ inputs.merchant_version_code }}
      QG_RIDER_VERSION_CODE: ${{ inputs.rider_version_code }}
      QG_CUSTOMER_PLAY_MAX_VERSION_CODE: ${{ inputs.customer_play_max_version_code }}
      QG_MERCHANT_PLAY_MAX_VERSION_CODE: ${{ inputs.merchant_play_max_version_code }}
      QG_RIDER_PLAY_MAX_VERSION_CODE: ${{ inputs.rider_play_max_version_code }}
      QG_ANDROID_SIGNING_CERT_SHA256: ${{ inputs.signing_certificate_sha256 }}
      QG_NATIVE_CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Require Native Source of Truth branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/queuego-native-android-v1" ]; then
            echo "::error::Certified release may run only from queuego-native-android-v1"
            exit 1
          fi

      - name: Validate certified release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re

          version = os.environ.get("QG_NATIVE_VERSION_NAME", "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("::error::version_name must be x.y.z")

          for role in ("CUSTOMER", "MERCHANT", "RIDER"):
              release_raw = os.environ.get(f"QG_{role}_VERSION_CODE", "")
              play_raw = os.environ.get(f"QG_{role}_PLAY_MAX_VERSION_CODE", "")
              if not release_raw.isdigit() or not play_raw.isdigit():
                  raise SystemExit(f"::error::{role} versionCode inputs must be non-negative integers")
              release_code, play_max = int(release_raw), int(play_raw)
              if release_code <= 0 or release_code > 2100000000:
                  raise SystemExit(f"::error::{role} release versionCode is out of range")
              if release_code <= play_max:
                  raise SystemExit(f"::error::{role} release versionCode must exceed observed Play maximum")

          cert = re.sub(r"[^0-9a-fA-F]", "", os.environ.get("QG_ANDROID_SIGNING_CERT_SHA256", ""))
          if not re.fullmatch(r"[0-9a-fA-F]{64}", cert):
              raise SystemExit("::error::signing_certificate_sha256 must be a 32-byte SHA-256 fingerprint")
          PY

      - name: Require external release secrets
        shell: bash
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          QG_ANDROID_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
          QG_ANDROID_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
          QG_ANDROID_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
          QG_ANDROID_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in             QG_FIREBASE_GOOGLE_SERVICES_JSON_B64             QG_ANDROID_KEYSTORE_B64             QG_ANDROID_STORE_PASSWORD             QG_ANDROID_KEY_ALIAS             QG_ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing certified release secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Download exact-HEAD certification evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
        run: |
          set -euo pipefail
          case "$CERTIFICATION_RUN_ID" in
            ''|*[!0-9]*) echo "::error::certification_run_id must be numeric"; exit 1 ;;
          esac
          meta="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CERTIFICATION_RUN_ID")"
          run_head="$(jq -r '.head_sha // empty' <<<"$meta")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"$meta")"
          run_path="$(jq -r '.path // empty' <<<"$meta")"
          run_event="$(jq -r '.event // empty' <<<"$meta")"
          run_branch="$(jq -r '.head_branch // empty' <<<"$meta")"
          if [ "$run_head" != "$GITHUB_SHA" ]; then
            echo "::error::Certification artifact must come from exact release HEAD"
            exit 1
          fi
          if [ "$run_conclusion" != "success" ]; then
            echo "::error::Certification workflow run is not successful"
            exit 1
          fi
          if [ "$run_path" != ".github/workflows/native-release-certification.yml" ]; then
            echo "::error::Certification run must come from the trusted Native certification workflow"
            exit 1
          fi
          if [ "$run_event" != "workflow_dispatch" ] || [ "$run_branch" != "queuego-native-android-v1" ]; then
            echo "::error::Certification run must be manually dispatched from Native Source of Truth"
            exit 1
          fi
          evidence_dir="$RUNNER_TEMP/queuego-native-release-certification"
          mkdir -p "$evidence_dir"
          gh run download "$CERTIFICATION_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name queuego-native-release-certification             --dir "$evidence_dir"
          report="$evidence_dir/native-release-evidence.json"
          certification_metadata="$evidence_dir/certified-release-metadata.json"
          if [ ! -s "$report" ]; then
            echo "::error::native-release-evidence.json missing from certification artifact"
            exit 1
          fi
          if [ ! -s "$certification_metadata" ]; then
            echo "::error::certified-release-metadata.json missing from certification artifact"
            exit 1
          fi
          QG_CERTIFICATION_METADATA="$certification_metadata" python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          data = json.loads(Path(os.environ["QG_CERTIFICATION_METADATA"]).read_text())
          expected = {
              "result": "PASS",
              "source_sha": os.environ["GITHUB_SHA"],
              "certification_run_id": os.environ["QG_NATIVE_CERTIFICATION_RUN_ID"],
              "certification_workflow": ".github/workflows/native-release-certification.yml",
              "version_name": os.environ["QG_NATIVE_VERSION_NAME"],
              "customer_version_code": int(os.environ["QG_CUSTOMER_VERSION_CODE"]),
              "merchant_version_code": int(os.environ["QG_MERCHANT_VERSION_CODE"]),
              "rider_version_code": int(os.environ["QG_RIDER_VERSION_CODE"]),
              "customer_play_max_version_code": int(os.environ["QG_CUSTOMER_PLAY_MAX_VERSION_CODE"]),
              "merchant_play_max_version_code": int(os.environ["QG_MERCHANT_PLAY_MAX_VERSION_CODE"]),
              "rider_play_max_version_code": int(os.environ["QG_RIDER_PLAY_MAX_VERSION_CODE"]),
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"::error::Certification metadata mismatch: {key}")
          expected_cert = re.sub(r"[^0-9a-fA-F]", "", os.environ["QG_ANDROID_SIGNING_CERT_SHA256"]).lower()
          if data.get("signing_certificate_sha256") != expected_cert:
              raise SystemExit("::error::Certification signing fingerprint does not match release input")
          if not re.fullmatch(r"[0-9a-f]{64}", str(data.get("evidence_bundle_sha256", ""))):
              raise SystemExit("::error::Certification evidence bundle SHA-256 is malformed")
          PY
          echo "QG_NATIVE_RELEASE_EVIDENCE=$report" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download verified Longdo Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-android/rider/libs
          curl -fsSL "https://api.longdo.com/map-android-SDK/LongdoMapAndroidSDK_v0.1.8.aar"             -o native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar
          echo "0918c23673ba6c7a349746f005525aca2ff3470f8e2966d5d2a4cb633ae5980c  native-android/rider/libs/LongdoMapAndroidSDK_v0.1.8.aar" | sha256sum -c -

      - name: Download verified Android bundletool
        shell: bash
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          curl -fsSL "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" -o "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum -c -
          echo "QG_BUNDLETOOL_JAR=$bundletool" >> "$GITHUB_ENV"
          echo "QG_BUNDLETOOL_SHA256=a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29" >> "$GITHUB_ENV"

      - name: Prepare certified Firebase and signing inputs
        shell: bash
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          QG_ANDROID_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          firebase="$RUNNER_TEMP/queuego-google-services.json"
          keystore="$RUNNER_TEMP/queuego-release.keystore"
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$firebase"
          printf '%s' "$QG_ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$firebase"
          test -s "$keystore"
          QG_FIREBASE_CONFIG="$firebase" python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path

          source = Path(os.environ["QG_FIREBASE_CONFIG"])
          data = json.loads(source.read_text())
          if not data.get("project_info", {}).get("project_id"):
              raise SystemExit("::error::Firebase config is missing project_id")
          required = {
              "com.queuego.customer": Path("native-android/customer/google-services.json"),
              "com.queuego.merchant": Path("native-android/merchant/google-services.json"),
              "com.queuego.rider": Path("native-android/rider/google-services.json"),
          }
          clients = data.get("client") or []
          for package, target in required.items():
              matches = [
                  client for client in clients
                  if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
              ]
              if len(matches) != 1:
                  raise SystemExit(f"::error::Firebase config requires exactly one Android client for {package}")
              if not matches[0].get("client_info", {}).get("mobilesdk_app_id"):
                  raise SystemExit(f"::error::Firebase client is incomplete for {package}")
              shutil.copyfile(source, target)
              target.chmod(0o600)
          PY
          chmod 600 "$keystore"
          echo "QG_ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Install regression dependencies
        run: npm ci --no-audit --no-fund

      - name: Full QueueGo regression before release
        run: npm test

      - name: Native release source contracts
        run: |
          node tests/native-release-gate.cjs
          node tests/native-customer-merchant-push.cjs
          node tests/native-push-session-binding.cjs
          node tests/native-voice-call-contract.cjs
          node tests/native-voice-turn-edge.cjs
          node tests/native-voice-ui-contract.cjs
          node tests/native-voice-background.cjs
          node tests/native-backend-migration-sync.cjs
          node tests/native-android-source.cjs

      - name: Native unit tests before release
        run: gradle -p native-android :shared:testDebugUnitTest :customer:testDebugUnitTest :merchant:testDebugUnitTest :rider:testDebugUnitTest --no-build-cache --stacktrace

      - name: Verify Native release assets
        run: |
          node tests/native-launcher-assets.cjs
          node tests/native-category-assets.cjs

      - name: Reject WebView before release packaging
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'android\.webkit\.WebView|<WebView\b|loadUrl\(' native-android; then
            echo "::error::WebView is forbidden in QueueGo Native release apps"
            exit 1
          fi

      - name: Verify certified release gate before packaging
        env:
          QG_ANDROID_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
          QG_ANDROID_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
          QG_ANDROID_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
        run: python3 native-android/qa/verify-native-release-gate.py

      - name: Build signed Native APK and AAB for all roles
        env:
          QG_ANDROID_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
          QG_ANDROID_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
          QG_ANDROID_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p native-android             :customer:assembleRelease :customer:bundleRelease             :merchant:assembleRelease :merchant:bundleRelease             :rider:assembleRelease :rider:bundleRelease             --no-build-cache --stacktrace

      - name: Verify signed Native release artifacts
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/native-release-artifacts.json"
          QG_NATIVE_RELEASE_ARTIFACT_EVIDENCE="$evidence"             python3 native-android/qa/verify-native-release-artifacts.py
          release_dir="$RUNNER_TEMP/queuego-native-certified-release"
          mkdir -p "$release_dir"
          cp native-android/customer/build/outputs/apk/release/customer-release.apk "$release_dir/"
          cp native-android/customer/build/outputs/bundle/release/customer-release.aab "$release_dir/"
          cp native-android/merchant/build/outputs/apk/release/merchant-release.apk "$release_dir/"
          cp native-android/merchant/build/outputs/bundle/release/merchant-release.aab "$release_dir/"
          cp native-android/rider/build/outputs/apk/release/rider-release.apk "$release_dir/"
          cp native-android/rider/build/outputs/bundle/release/rider-release.aab "$release_dir/"
          cp "$evidence" "$release_dir/"

      - name: Retain certified release artifacts internally
        uses: actions/upload-artifact@v4
        with:
          name: queuego-native-certified-release-${{ inputs.version_name }}
          path: ${{ runner.temp }}/queuego-native-certified-release/
          if-no-files-found: error
          retention-days: 14

      - name: Remove decoded credentials and evidence
        if: always()
        shell: bash
        run: |
          rm -f native-android/customer/google-services.json
          rm -f native-android/merchant/google-services.json
          rm -f native-android/rider/google-services.json
          rm -f "$RUNNER_TEMP/queuego-google-services.json"
          rm -f "$RUNNER_TEMP/queuego-release.keystore"
          rm -f "$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          rm -rf "$RUNNER_TEMP/queuego-native-release-certification"
