name: QueueGo P0 No Rider Auto-Cancel Isolated
on:
  pull_request:
    branches: [fix/p0-terminal-cash-dependents-20261120]
    paths:
      - ops/p0/no-rider-timeout-cash-review-only.sql
      - tests/backend/no-rider-timeout-cash-races.cjs
      - tests/backend/no-rider-timeout-cash-postgres.sql
      - tests/fixtures/order-transition-v22-prod-20261121.sql
      - ops/p0/v22-null-role-cash-review-only.sql
      - .github/workflows/p0-no-rider-timeout-cash.yml
permissions:
  contents: read
jobs:
  no-rider-timeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_DB: qg_cash_helper_test_ci
          POSTGRES_PASSWORD: isolated-cash-helper-only
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qg_cash_helper_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve existing cash-helper baseline and money guard regression
        env:
          QG_CASH_HELPER_TEST_DATABASE_URL: postgres://postgres:isolated-cash-helper-only@127.0.0.1:55440/qg_cash_helper_test_ci
        run: node tests/backend/terminal-cash-dependents-runtime.cjs
      - name: Exercise real cash guards with no-Rider 15/30m cancellation on disposable PostgreSQL
        env:
          PGPASSWORD: isolated-cash-helper-only
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55440 -U postgres -d qg_cash_helper_test_ci -f tests/backend/no-rider-timeout-cash-postgres.sql
      - name: Verify claim-vs-timeout and payment-writer races on disposable PostgreSQL
        env:
          QG_CASH_HELPER_TEST_DATABASE_URL: postgres://postgres:isolated-cash-helper-only@127.0.0.1:55440/qg_cash_helper_test_ci
        run: node tests/backend/no-rider-timeout-cash-races.cjs
