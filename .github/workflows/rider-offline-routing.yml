name: Rider in-process Thailand routing
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/rider-android-authenticated-review.yml'
      - 'native-android/qa/fetch-rider-offline-candidate.py'
      - 'native-android/rider-navigation-map/**'
      - 'native-android/rider/**'
      - 'native-android/qa/run-rider-offline-routing.py'
      - 'native-android/qa/run-rider-fused-gps.py'
      - 'native-android/qa/maplibre-swiftshader/**'
      - 'native-android/build.gradle.kts'
      - 'native-android/settings.gradle.kts'
      - 'ops/maps/**'
      - '.github/workflows/rider-offline-routing.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: rider-offline-routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.6.0'
      - name: Prepare audited source-built MapLibre component
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          inputs="$RUNNER_TEMP/maplibre-compat-inputs"
          repository="$RUNNER_TEMP/maplibre-compat-repository"
          mkdir -p "$inputs"
          timeout 180s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13484815852/zip" > "$inputs/x86_64.zip"
          timeout 180s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13485115419/zip" > "$inputs/arm64-v8a.zip"
          base='https://repo.maven.apache.org/maven2/org/maplibre/gl/android-sdk-opengl/13.7.1/android-sdk-opengl-13.7.1'
          curl --fail --location --retry 2 --max-time 180 "$base.aar" -o "$inputs/baseline.aar"
          curl --fail --location --retry 2 --max-time 60 "$base.pom" -o "$inputs/baseline.pom"
          python3 native-android/qa/maplibre-swiftshader/prepare-repository.py prepare \
            --baseline-aar "$inputs/baseline.aar" --baseline-pom "$inputs/baseline.pom" \
            --x86-zip "$inputs/x86_64.zip" --arm64-zip "$inputs/arm64-v8a.zip" --repository "$repository"
          echo "QG_MAPLIBRE_COMPAT_REPOSITORY=$repository" >> "$GITHUB_ENV"
      - name: Restore immutable routing graph data
        id: routing_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/routing-assets
          key: thailand261104-valhalla391-admin-${{ hashFiles('ops/maps/build_engine_graph.py', 'ops/maps/offline_package.py', 'ops/maps/sources/thailand-261104.manifest.json') }}
      - name: Build or verify the real pinned Thailand motorcycle graph
        env:
          ROUTING_CACHE_HIT: ${{ steps.routing_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 -m pip install osmium==4.3.1 pyvalhalla==3.9.1
          if [ "$ROUTING_CACHE_HIT" != 'true' ]; then
            mkdir -p "$RUNNER_TEMP/routing-source"
            source="$RUNNER_TEMP/routing-source/thailand.osm.pbf"
            curl --fail --location --retry 2 https://download.geofabrik.de/asia/thailand-261104.osm.pbf -o "$source"
            echo "eed0526676882ba1b94c0f9b0dd49ed25b7495150af4040822157203f2ba3457  $source" | sha256sum -c -
            cp ops/maps/sources/thailand-261104.manifest.json "$RUNNER_TEMP/routing-source/thailand.osm.manifest.json"
            python3 ops/maps/build_engine_graph.py valhalla "$source" "$RUNNER_TEMP/routing-graph" --admin-pbf "$source"
            python3 ops/maps/offline_package.py android-routing --graph "$RUNNER_TEMP/routing-graph" \
              --source-manifest ops/maps/sources/thailand-261104.manifest.json --destination "$RUNNER_TEMP/routing-assets"
          fi
          echo "QG_OFFLINE_ROUTING_ASSETS=$RUNNER_TEMP/routing-assets" >> "$GITHUB_ENV"
          python3 ops/maps/probe_android_routing.py --assets "$RUNNER_TEMP/routing-assets" --output artifacts/rider-offline-routing/country-linux-probes.json
          rm -rf "$RUNNER_TEMP/routing-graph" "$RUNNER_TEMP/routing-source"
      - name: Save the verified graph before downstream visual gates
        if: steps.routing_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/routing-assets
          key: ${{ steps.routing_cache.outputs.cache-primary-key }}
      - name: Restore the pinned national rendering data
        id: map_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/country-map-assets
          key: thailand261029-rendering-a2a6985556e6ba26-${{ hashFiles('native-android/qa/prepare-verified-country-map-assets.py', 'native-android/qa/prepare-thailand-map-assets.py') }}
      - name: Bundle verified nationwide rendering data with explicit snapshot provenance
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_CACHE_HIT: ${{ steps.map_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          expected='a2a6985556e6ba26ef4509ba3605266ae6aa1d541bc6d772b076eac1f7a0e9b0'
          source_url='https://download.geofabrik.de/asia/thailand-261029.osm.pbf'
          if [ "$MAP_CACHE_HIT" != 'true' ]; then
            reference="$RUNNER_TEMP/country-reference.zip"
            timeout 600s gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12965729022/zip" > "$reference"
            python3 native-android/qa/prepare-verified-country-map-assets.py \
              --reference-zip "$reference" --expected-zip-sha256 "$expected" \
              --expected-source-url "$source_url" --assets-root "$RUNNER_TEMP/country-map-assets"
            rm -f "$reference"
          else
            python3 native-android/qa/prepare-verified-country-map-assets.py \
              --expected-zip-sha256 "$expected" --expected-source-url "$source_url" \
              --assets-root "$RUNNER_TEMP/country-map-assets"
          fi
          echo "QG_OFFLINE_MAP_ASSETS=$RUNNER_TEMP/country-map-assets" >> "$GITHUB_ENV"
      - name: Save verified national rendering data
        if: steps.map_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/country-map-assets
          key: ${{ steps.map_cache.outputs.cache-primary-key }}
      - name: Prepare Rider Firebase configuration when available
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          encoded = os.environ.get('QG_FIREBASE_GOOGLE_SERVICES_JSON_B64', '')
          if not encoded:
              print('::warning::Firebase configuration absent; push acceptance remains blocked')
          else:
              raw = base64.b64decode(''.join(encoded.split()), validate=True)
              data = json.loads(raw)
              packages = {c.get('client_info', {}).get('android_client_info', {}).get('package_name') for c in data.get('client', [])}
              assert 'com.queuego.rider' in packages, 'Firebase has no Rider client'
              target = Path('native-android/rider/google-services.json')
              target.write_bytes(raw)
              target.chmod(0o600)
              print('Rider Firebase client configured; this is not push-delivery certification')
          PY
      - name: Install Android build and runtime tools
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'emulator' 'system-images;android-30;default;x86_64'
      - name: Exact-source JVM tests and Rider Debug APK
        run: |
          gradle -p native-android :rider-navigation-map:testDebugUnitTest :rider-maplibre-osm:testDebugUnitTest :rider:testDebugUnitTest :rider:assembleDebug :rider:assembleDebugAndroidTest --no-daemon --stacktrace
          mkdir -p artifacts/rider-offline-routing
          git rev-parse HEAD > artifacts/rider-offline-routing/build-commit.txt
          stat -c %s native-android/rider/build/outputs/apk/debug/rider-debug.apk > artifacts/rider-offline-routing/apk-size-bytes.txt
          sha256sum native-android/rider/build/outputs/apk/debug/rider-debug.apk > artifacts/rider-offline-routing/apk.sha256
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs native-android/rider/build/outputs/apk/debug/rider-debug.apk > artifacts/rider-offline-routing/apk-signature.txt
          python3 native-android/qa/maplibre-swiftshader/prepare-repository.py verify-apk \
            --repository "$QG_MAPLIBRE_COMPAT_REPOSITORY" --apk native-android/rider/build/outputs/apk/debug/rider-debug.apk
          cp "$QG_MAPLIBRE_COMPAT_REPOSITORY/component.json" artifacts/rider-offline-routing/maplibre-component.json
          cp "$QG_OFFLINE_ROUTING_ASSETS/routing/manifest.json" artifacts/rider-offline-routing/graph-manifest.json
          cp "$QG_OFFLINE_MAP_ASSETS/maps/thailand-shortbread.json" artifacts/rider-offline-routing/rendering-manifest.json
          cp "$QG_OFFLINE_MAP_ASSETS/maps/thailand-shortbread-recovery.json" artifacts/rider-offline-routing/rendering-recovery.json
      - name: Enable Android acceleration
        run: |
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
      - name: Run actual installed Rider offline routing and cold process restart
        run: python3 native-android/qa/run-rider-offline-routing.py
      - name: Run actual offline country rendering and GPS-camera instrumentation
        env:
          QG_NAV_RUNTIME_OFFLINE: '1'
        run: |
          python3 native-android/qa/run-rider-navigation-map-runtime.py
          # The module instrumentation must not replace the APK that routing tested.
          sha256sum -c artifacts/rider-offline-routing/apk.sha256
      - name: Compare unchanged renderer with ANGLE software graphics
        env:
          QG_NAV_RUNTIME_OFFLINE: '1'
          QG_NAV_RUNTIME_GPU: swangle
        run: |
          # Real alternative Android Emulator graphics driver; no product style/text changes.
          python3 native-android/qa/run-rider-navigation-map-runtime.py
          sha256sum -c artifacts/rider-offline-routing/apk.sha256
      - name: Verify real Fused GPS on Google APIs emulator using the same Rider APK
        run: |
          python3 native-android/qa/run-rider-fused-gps.py
          sha256sum -c artifacts/rider-offline-routing/apk.sha256
      - name: Split the exact installed internal candidate for verified transfer
        id: candidate_parts
        run: |
          set -euo pipefail
          mkdir -p artifacts/rider-candidate-parts
          sha256sum -c artifacts/rider-offline-routing/apk.sha256
          split --bytes=400M --numeric-suffixes=0 --suffix-length=2 native-android/rider/build/outputs/apk/debug/rider-debug.apk artifacts/rider-candidate-parts/rider-debug.apk.part
          count=$(find artifacts/rider-candidate-parts -name 'rider-debug.apk.part*' -type f | wc -l)
          test "$count" -ge 1 && test "$count" -le 3
          echo "count=$count" >> "$GITHUB_OUTPUT"
          cd artifacts/rider-candidate-parts
          sha256sum rider-debug.apk.part* > parts.sha256
          cp ../rider-offline-routing/apk.sha256 whole-apk.sha256
          cp ../rider-offline-routing/build-commit.txt build-commit.txt
          cp "$GITHUB_WORKSPACE/native-android/rider/build/outputs/apk/androidTest/debug/rider-debug-androidTest.apk" .
          sha256sum rider-debug-androidTest.apk > instrumentation-apk.sha256
      - name: Retain internal candidate part 00 and exact manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rider-unreleased-country-part00-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/rider-candidate-parts/rider-debug.apk.part00
            artifacts/rider-candidate-parts/parts.sha256
            artifacts/rider-candidate-parts/whole-apk.sha256
            artifacts/rider-candidate-parts/build-commit.txt
            artifacts/rider-candidate-parts/rider-debug-androidTest.apk
            artifacts/rider-candidate-parts/instrumentation-apk.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain internal candidate part 01
        if: success() && steps.candidate_parts.outputs.count != '' && fromJSON(steps.candidate_parts.outputs.count) > 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rider-unreleased-country-part01-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/rider-candidate-parts/rider-debug.apk.part01
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain internal candidate part 02
        if: success() && steps.candidate_parts.outputs.count != '' && fromJSON(steps.candidate_parts.outputs.count) > 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rider-unreleased-country-part02-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/rider-candidate-parts/rider-debug.apk.part02
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Retain exact-source internal QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rider-offline-routing-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/rider-offline-routing/
            artifacts/rider-navigation-map-runtime/
            artifacts/rider-navigation-map-runtime-swangle/
            artifacts/rider-fused-gps/
            native-android/rider-navigation-map/build/outputs/androidTest-results/connected/
            native-android/rider-navigation-map/build/test-results/
            native-android/rider-maplibre-osm/build/test-results/
            native-android/rider/build/test-results/
          if-no-files-found: warn
      # Retained pixels must still be visually reviewed, particularly Issue #750 labels.
      # Neither routing nor country-rendering instrumentation certifies authentication/release.
      # No owner APK publication and no Production deployment are performed here.
