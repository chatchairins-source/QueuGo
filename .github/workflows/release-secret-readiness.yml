name: QueueGo Release Secret Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
      QG_ANDROID_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
      QG_ANDROID_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
      QG_ANDROID_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
      QG_ANDROID_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
      QG_SUPABASE_URL: ${{ vars.QG_SUPABASE_URL }}
      QG_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.QG_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check required secret presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 \
            QG_ANDROID_KEYSTORE_B64 \
            QG_ANDROID_STORE_PASSWORD \
            QG_ANDROID_KEY_ALIAS \
            QG_ANDROID_KEY_PASSWORD \
            QG_SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            else
              echo "$name=present"
            fi
          done
          if [ -z "${QG_SUPABASE_URL:-}" ]; then
            echo "::error::Missing required release variable: QG_SUPABASE_URL"
            missing=1
          else
            echo "QG_SUPABASE_URL=present"
          fi
          exit "$missing"

      - name: Validate release evidence Storage access
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          base=os.environ.get("QG_SUPABASE_URL","").rstrip("/")
          parsed=urlparse(base)
          if parsed.scheme!="https" or parsed.path not in ("","/") or parsed.query or parsed.fragment:
              raise SystemExit("::error::QG_SUPABASE_URL must be a bare HTTPS Supabase project origin")
          if base!="https://pkypiqhlrmzocysgeqew.supabase.co":
              raise SystemExit("::error::QG_SUPABASE_URL must match QueueGo Production project pkypiqhlrmzocysgeqew")
          PY
          bucket_response="$(mktemp)"
          bucket_code="$(curl --silent --show-error --proto '=https' --tlsv1.2 --output "$bucket_response" --write-out '%{http_code}' \
            "${QG_SUPABASE_URL%/}/storage/v1/bucket/queuego-native-release-evidence" \
            -H "Authorization: Bearer $QG_SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $QG_SUPABASE_SERVICE_ROLE_KEY")"
          if [ "$bucket_code" != "200" ]; then
            echo "::error::Production release evidence bucket is unavailable (HTTP $bucket_code)"
            rm -f "$bucket_response"
            exit 1
          fi
          python3 - "$bucket_response" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          if data.get("id") != "queuego-native-release-evidence" or data.get("name") != "queuego-native-release-evidence":
              raise SystemExit("::error::Unexpected release evidence bucket identity")
          if data.get("public") is not False:
              raise SystemExit("::error::Release evidence bucket must remain private")
          PY
          rm -f "$bucket_response"
          response="$(mktemp)"
          code="$(curl --silent --show-error --proto '=https' --tlsv1.2 --output "$response" --write-out '%{http_code}' \
            -X POST "${QG_SUPABASE_URL%/}/storage/v1/object/list/queuego-native-release-evidence" \
            -H "Authorization: Bearer $QG_SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $QG_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"limit":1,"offset":0,"sortBy":{"column":"name","order":"asc"}}')"
          if [ "$code" != "200" ]; then
            echo "::error::Private release evidence bucket is unavailable or service-role access failed (HTTP $code)"
            rm -f "$response"
            exit 1
          fi
          python3 - "$response" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          if not isinstance(data,list):
              raise SystemExit("::error::Unexpected Supabase Storage list response")
          print("Private release evidence bucket: reachable with server-side service role")
          PY
          rm -f "$response"

      - name: Validate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > /tmp/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('/tmp/google-services.json')
          data=json.loads(path.read_text())
          if not data.get('project_info'):
              raise SystemExit('::error::Firebase google-services.json is missing project_info')

          project_id=data.get('project_info',{}).get('project_id')
          if not project_id:
              raise SystemExit('::error::Firebase google-services.json is missing project_id')

          clients=data.get('client') or []
          required=(
              'com.queuego.customer',
              'com.queuego.merchant',
              'com.queuego.rider',
          )
          for package in required:
              matches=[
                  client for client in clients
                  if client.get('client_info',{}).get('android_client_info',{}).get('package_name') == package
              ]
              if len(matches) != 1:
                  raise SystemExit(f'::error::Firebase config requires exactly one Android client for {package}')
              app_id=matches[0].get('client_info',{}).get('mobilesdk_app_id')
              if not app_id:
                  raise SystemExit(f'::error::Firebase client is incomplete for {package}: mobilesdk_app_id missing')

          print('Firebase Android config: one complete client for each QueueGo package in one project')
          PY

      - name: Validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QG_ANDROID_KEYSTORE_B64" | base64 --decode > /tmp/queuego-release.jks
          test -s /tmp/queuego-release.jks || {
            echo "::error::Decoded Android keystore is empty"
            exit 1
          }

          listing="$(keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore /tmp/queuego-release.jks \
            -storepass:env QG_ANDROID_STORE_PASSWORD \
            -alias "$QG_ANDROID_KEY_ALIAS")"
          fingerprint="$(printf '%s\n' "$listing" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)"
          if [ -z "$fingerprint" ]; then
            echo "::error::Android signing certificate SHA-256 fingerprint unavailable"
            exit 1
          fi

          rm -f /tmp/queuego-signing-validation.p12
          QG_VALIDATION_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export QG_VALIDATION_PASSWORD
          keytool -importkeystore \
            -srckeystore /tmp/queuego-release.jks \
            -srcstorepass:env QG_ANDROID_STORE_PASSWORD \
            -srcalias "$QG_ANDROID_KEY_ALIAS" \
            -srckeypass:env QG_ANDROID_KEY_PASSWORD \
            -destkeystore /tmp/queuego-signing-validation.p12 \
            -deststoretype PKCS12 \
            -deststorepass:env QG_VALIDATION_PASSWORD \
            -destkeypass:env QG_VALIDATION_PASSWORD \
            -noprompt >/dev/null

          echo "Android release keystore: store password, alias and key password are valid"
          echo "Android signing certificate SHA-256: $fingerprint"
          {
            echo "### Android signing identity"
            echo ""
            echo "QG_ANDROID_SIGNING_CERT_SHA256=$fingerprint"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/google-services.json /tmp/queuego-release.jks /tmp/queuego-signing-validation.p12
