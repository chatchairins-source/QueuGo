name: QueueGo Release Secret Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
      QG_ANDROID_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
      QG_ANDROID_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
      QG_ANDROID_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
      QG_ANDROID_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
      QG_ANDROID_EXPECTED_CERT_SHA256: ${{ vars.QG_ANDROID_EXPECTED_CERT_SHA256 }}

    steps:
      - name: Check required secret presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 \
            QG_ANDROID_KEYSTORE_B64 \
            QG_ANDROID_STORE_PASSWORD \
            QG_ANDROID_KEY_ALIAS \
            QG_ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            else
              echo "$name=present"
            fi
          done
          if [ -z "${QG_ANDROID_EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::Missing required release variable: QG_ANDROID_EXPECTED_CERT_SHA256"
            missing=1
          else
            echo "QG_ANDROID_EXPECTED_CERT_SHA256=present"
          fi
          exit "$missing"

      - name: Validate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > /tmp/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('/tmp/google-services.json')
          data=json.loads(path.read_text())
          if not data.get('project_info'):
              raise SystemExit('::error::Firebase google-services.json is missing project_info')

          project_id=data.get('project_info',{}).get('project_id')
          if not project_id:
              raise SystemExit('::error::Firebase google-services.json is missing project_id')

          clients=data.get('client') or []
          required=(
              'com.queuego.customer',
              'com.queuego.merchant',
              'com.queuego.rider',
          )
          for package in required:
              matches=[
                  client for client in clients
                  if client.get('client_info',{}).get('android_client_info',{}).get('package_name') == package
              ]
              if len(matches) != 1:
                  raise SystemExit(f'::error::Firebase config requires exactly one Android client for {package}')
              app_id=matches[0].get('client_info',{}).get('mobilesdk_app_id')
              if not app_id:
                  raise SystemExit(f'::error::Firebase client is incomplete for {package}: mobilesdk_app_id missing')

          print('Firebase Android config: one complete client for each QueueGo package in one project')
          PY

      - name: Validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QG_ANDROID_KEYSTORE_B64" | base64 --decode > /tmp/queuego-release.jks
          test -s /tmp/queuego-release.jks || {
            echo "::error::Decoded Android keystore is empty"
            exit 1
          }

          keytool -J-Duser.language=en -J-Duser.country=US -list -v \
            -keystore /tmp/queuego-release.jks \
            -storepass:env QG_ANDROID_STORE_PASSWORD \
            -alias "$QG_ANDROID_KEY_ALIAS" > /tmp/queuego-keystore-list.txt
          grep -q 'PrivateKeyEntry' /tmp/queuego-keystore-list.txt || {
            echo "::error::Android release alias is not a PrivateKeyEntry"
            exit 1
          }
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          expected=re.sub(r'[^0-9a-fA-F]','',os.environ.get('QG_ANDROID_EXPECTED_CERT_SHA256','')).lower()
          if not re.fullmatch(r'[0-9a-f]{64}', expected):
              raise SystemExit('::error::QG_ANDROID_EXPECTED_CERT_SHA256 must be a 64-hex SHA-256 fingerprint')
          listing=Path('/tmp/queuego-keystore-list.txt').read_text()
          match=re.search(r'SHA256:\s*([0-9a-fA-F:]+)',listing)
          if not match:
              raise SystemExit('::error::Android release certificate SHA-256 fingerprint is unavailable')
          actual=re.sub(r'[^0-9a-fA-F]','',match.group(1)).lower()
          if actual != expected:
              raise SystemExit('::error::Android release certificate does not match QG_ANDROID_EXPECTED_CERT_SHA256')
          print('Android release certificate fingerprint: certified match')
          PY

          rm -f /tmp/queuego-signing-validation.p12
          export QG_VALIDATION_PASSWORD
          QG_VALIDATION_PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          keytool -importkeystore \
            -srckeystore /tmp/queuego-release.jks \
            -srcstorepass:env QG_ANDROID_STORE_PASSWORD \
            -srcalias "$QG_ANDROID_KEY_ALIAS" \
            -srckeypass:env QG_ANDROID_KEY_PASSWORD \
            -destkeystore /tmp/queuego-signing-validation.p12 \
            -deststoretype PKCS12 \
            -deststorepass:env QG_VALIDATION_PASSWORD \
            -destkeypass:env QG_VALIDATION_PASSWORD \
            -noprompt >/dev/null

          echo "Android release keystore: PrivateKeyEntry, store password, alias and key password are valid"

      - name: Clean temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/google-services.json /tmp/queuego-release.jks /tmp/queuego-signing-validation.p12 /tmp/queuego-keystore-list.txt
