name: QueueGo Release Secret Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - work-native-closed-beta-integration-v1-20261010
    paths:
      - '.github/workflows/release-secret-readiness.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
      QG_ANDROID_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
      QG_ANDROID_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
      QG_ANDROID_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
      QG_ANDROID_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check required secret presence
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 \
            QG_ANDROID_KEYSTORE_B64 \
            QG_ANDROID_STORE_PASSWORD \
            QG_ANDROID_KEY_ALIAS \
            QG_ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            else
              echo "$name=present"
            fi
          done
          exit "$missing"

      - name: Validate Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > /tmp/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('/tmp/google-services.json')
          data=json.loads(path.read_text())
          if not data.get('project_info'):
              raise SystemExit('::error::Firebase google-services.json is missing project_info')

          packages={
              c.get('client_info',{}).get('android_client_info',{}).get('package_name')
              for c in (data.get('client') or [])
          }
          required={
              'com.queuego.customer',
              'com.queuego.merchant',
              'com.queuego.rider',
          }
          missing=sorted(required-packages)
          if missing:
              raise SystemExit('::error::Firebase config is missing Android clients: '+', '.join(missing))
          print('Firebase Android config: valid for all three QueueGo packages')
          PY

      - name: Validate Android release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$QG_ANDROID_KEYSTORE_B64" | base64 --decode > /tmp/queuego-release.jks
          test -s /tmp/queuego-release.jks || {
            echo "::error::Decoded Android keystore is empty"
            exit 1
          }

          keytool -list \
            -keystore /tmp/queuego-release.jks \
            -storepass "$QG_ANDROID_STORE_PASSWORD" \
            -alias "$QG_ANDROID_KEY_ALIAS" >/dev/null

          rm -f /tmp/queuego-signing-validation.p12
          keytool -importkeystore \
            -srckeystore /tmp/queuego-release.jks \
            -srcstorepass "$QG_ANDROID_STORE_PASSWORD" \
            -srcalias "$QG_ANDROID_KEY_ALIAS" \
            -srckeypass "$QG_ANDROID_KEY_PASSWORD" \
            -destkeystore /tmp/queuego-signing-validation.p12 \
            -deststoretype PKCS12 \
            -deststorepass QueueGoValidationOnly123! \
            -destkeypass QueueGoValidationOnly123! \
            -noprompt >/dev/null

          echo "Android release keystore: store password, alias and key password are valid"

      - name: Clean temporary credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/google-services.json /tmp/queuego-release.jks /tmp/queuego-signing-validation.p12
