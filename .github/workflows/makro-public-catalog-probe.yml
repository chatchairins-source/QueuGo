name: Makro public catalog probe

on:
  push:
    branches:
      - work-grocery-makro-full-catalog-20261015
    paths:
      - 'ops/grocery/probe-makro.cjs'
      - 'ops/grocery/probe-makro-browser.cjs'
      - 'ops/grocery/sync-makro-dry-branded.cjs'
      - '.github/workflows/makro-public-catalog-probe.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ops/grocery/probe-makro.cjs'
      - 'ops/grocery/probe-makro-browser.cjs'
      - 'ops/grocery/sync-makro-dry-branded.cjs'
      - '.github/workflows/makro-public-catalog-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project tooling
        run: npm ci --ignore-scripts
      - name: Probe Makro PRO public dry-grocery page
        run: node ops/grocery/probe-makro.cjs
      - name: Capture Makro live catalog request
        run: node ops/grocery/probe-makro-browser.cjs
      - name: Build branded dry Makro catalog
        run: node ops/grocery/sync-makro-dry-branded.cjs
      - name: Commit generated Makro catalog
        if: github.event_name == 'push'
        run: |
          git config user.name "queuego-catalog-bot"
          git config user.email "queuego-catalog-bot@users.noreply.github.com"
          git add catalog/makro-dry-branded-20261015.json
          if git diff --cached --quiet; then
            echo "No catalog change"
          else
            git commit -m "Catalog: sync Makro branded dry assortment"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: makro-public-catalog-probe
          path: |
            artifacts/makro-probe
            artifacts/makro-browser-probe
            catalog/makro-dry-branded-20261015.json
          if-no-files-found: warn
