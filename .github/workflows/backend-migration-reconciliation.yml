name: Backend migration reconciliation

on:
  pull_request:
    paths:
      - 'scripts/reconcile-supabase-migrations.cjs'
      - 'tests/backend-migration-reconciliation.cjs'
      - '.github/workflows/backend-migration-reconciliation.yml'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-reconciliation-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check scripts/reconcile-supabase-migrations.cjs
          node --check tests/backend-migration-reconciliation.cjs
      - name: Read-only migration history regression
        run: node tests/backend-migration-reconciliation.cjs
