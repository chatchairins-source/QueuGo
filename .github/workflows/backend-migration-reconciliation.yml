name: Backend Migration Reconciliation Tests

on:
  pull_request:
    paths:
      - 'scripts/reconcile_migration_versions.py'
      - 'scripts/verify_migration_sql_digests.py'
      - 'scripts/test_reconcile_migration_versions.py'
      - 'scripts/test_verify_migration_sql_digests.py'
      - '.github/workflows/backend-migration-reconciliation.yml'
  push:
    branches:
      - 'audit/backend-migration-reconcile-20261117'
    paths:
      - 'scripts/reconcile_migration_versions.py'
      - 'scripts/verify_migration_sql_digests.py'
      - 'scripts/test_reconcile_migration_versions.py'
      - 'scripts/test_verify_migration_sql_digests.py'
      - '.github/workflows/backend-migration-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run synthetic reconciliation regression tests
        run: python3 -m unittest discover -s scripts -p 'test_reconcile_migration_versions.py' -v
      - name: Run digest fail-closed regression tests
        run: python3 -m unittest discover -s scripts -p 'test_verify_migration_sql_digests.py' -v
      - name: Run CLI self-test
        run: python3 scripts/reconcile_migration_versions.py --self-test
      - name: Run SQL digest content-parity synthetic tests
        run: python3 scripts/verify_migration_sql_digests.py --self-test
