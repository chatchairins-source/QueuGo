name: QueueGo Android Release

on:
  workflow_dispatch:

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Block historical Capacitor Android release
        run: |
          echo "::error::Historical Capacitor/WebView Android release is disabled. Use QueueGo Native Android Closed Beta from queuego-native-android-v1."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Closed Beta hard gates
        shell: bash
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('docs/pilot-recovery-manifest.json','utf8'));
          const gates=manifest?.release_gates||{};
          for(const gate of ['account_deletion_privacy','service_area','core_e2e_production','ugc_chat_safety','security_audit']){
            if(gates[gate]!=='PASS'){
              console.error('::error::Release gate '+gate+' is not PASS.');
              process.exit(1);
            }
          }
          const authGate=gates.security_platform_auth;
          if(!['PASS','PASS_FREE_PLAN_CONTROLS'].includes(authGate)){
            console.error('::error::Security platform Auth gate is neither PASS nor PASS_FREE_PLAN_CONTROLS.');
            process.exit(1);
          }
          if(authGate==='PASS_FREE_PLAN_CONTROLS'){
            const security=manifest?.security||{};
            if(security.leaked_password_protection_enabled!==false
              || security.leaked_password_protection_plan_requirement!=='PRO_OR_ABOVE'
              || Number(security.signup_password_minimum_characters||0)<12
              || security.signup_password_complexity!=='UPPER_LOWER_NUMBER_SYMBOL'
              || security.signup_password_policy_shared_runtime!=='queuego-password-policy.js'){
              console.error('::error::Free-plan Auth compensating controls are not fully certified.');
              process.exit(1);
            }
          }
          if(manifest?.supabase?.restore_drill_certified!==true){
            console.error('::error::Backup/Restore gate is not certified. Do not build Closed Beta.');
            process.exit(1);
          }
          if(manifest?.notifications?.physical_background_notification_certified!==true){
            console.error('::error::Physical Android background notification is not certified.');
            process.exit(1);
          }
          if(!fs.existsSync('queuego-native-push.js')){
            console.error('::error::Native Android background push is not implemented/certified.');
            process.exit(1);
          }
          const pkg=JSON.parse(fs.readFileSync('android-build/package.json','utf8'));
          if(!pkg.dependencies?.['@capacitor/push-notifications']){
            console.error('::error::Capacitor native push plugin is missing.');
            process.exit(1);
          }
          NODE
          test -n "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" || {
            echo "::error::Firebase google-services.json secret is missing."
            exit 1
          }

  build:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: customer
            appid: com.queuego.customer
            appname: QueueGo
            source: .
          - role: merchant
            appid: com.queuego.merchant
            appname: QueueGo Merchant
            source: merchant
          - role: rider
            appid: com.queuego.rider
            appname: QueueGo Rider
            source: rider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web bundle
        shell: bash
        env:
          QG_FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.QG_FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
          QG_APP_ID: ${{ matrix.appid }}
        run: |
          set -euo pipefail
          cd android-build
          npm install --no-audit --no-fund
          rm -rf www android
          mkdir -p www
          mkdir -p www/docs
          cp ../docs/privacy.html ../docs/account-deletion.html ../docs/community-guidelines.html www/docs/
          if [ "${{ matrix.role }}" = "customer" ]; then
            cp ../index.html www/index.html
            cp ../customer-features.js ../customer-features.css ../customer-laundry.js ../queuego-order-number.js ../queuego-password-policy.js ../account-deletion.js ../queuego-ugc.js ../queuego-native-push.js ../queuego-push.js ../queuego-push-sw.js www/
            cp ../table-order.css ../table-order.js ../table-order.html www/
          elif [ "${{ matrix.role }}" = "merchant" ]; then
            cp ../merchant/* www/
            cp ../role-realtime.js ../queuego-order-number.js ../queuego-password-policy.js ../account-deletion.js ../queuego-ugc.js ../queuego-native-push.js ../queuego-push.js ../queuego-push-sw.js www/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          s=s.replace('../role-realtime.js','role-realtime.js')
          s=s.replace('../queuego-order-number.js','queuego-order-number.js')
          s=s.replace('../queuego-password-policy.js','queuego-password-policy.js')
          s=s.replace('../account-deletion.js','account-deletion.js')
          s=s.replace('../queuego-ugc.js','queuego-ugc.js')
          s=s.replace('../queuego-native-push.js','queuego-native-push.js')
          s=s.replace('../queuego-push.js','queuego-push.js')
          p.write_text(s)
          PY
            cp ../table-order.html ../table-order.css ../table-order.js www/
          else
            cp ../rider/index.html www/index.html
            cp ../queuego-order-number.js ../queuego-password-policy.js ../account-deletion.js ../queuego-ugc.js ../queuego-native-push.js ../queuego-push.js ../queuego-push-sw.js www/
            python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html')
          s=p.read_text()
          s=s.replace('../queuego-order-number.js','queuego-order-number.js')
          s=s.replace('../queuego-password-policy.js','queuego-password-policy.js')
          s=s.replace('../account-deletion.js','account-deletion.js')
          s=s.replace('../queuego-ugc.js','queuego-ugc.js')
          s=s.replace('../queuego-native-push.js','queuego-native-push.js')
          s=s.replace('../queuego-push.js','queuego-push.js')
          p.write_text(s)
          PY
          fi
          node -e "let c=require('./capacitor.config.json');c.appId='${{ matrix.appid }}';c.appName='${{ matrix.appname }}';require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap add android
          grep -Eq 'compileSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle || { echo "::error::Generated Android project is not compileSdk 36"; exit 1; }
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle || { echo "::error::Generated Android project is not targetSdk 36"; exit 1; }
          printf '%s' "$QG_FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('android/app/google-services.json')
          data=json.loads(p.read_text())
          clients=data.get('client') or []
          if not data.get('project_info') or not clients:
              raise RuntimeError('Invalid Firebase google-services.json')
          packages={
              c.get('client_info',{}).get('android_client_info',{}).get('package_name')
              for c in clients
          }
          expected=os.environ['QG_APP_ID']
          if expected not in packages:
              raise RuntimeError(f'Firebase config has no Android client for {expected}')
          PY
          npx cap sync android

      - name: Configure Android runtime
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
          QG_VERSION_CODE: ${{ github.run_number }}
          QG_VERSION_NAME: 1.0.0-beta.${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          root=Path('android-build/android')
          manifest=root/'app/src/main/AndroidManifest.xml'
          s=manifest.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.VIBRATE',
          ]
          missing=[p for p in perms if p not in s]
          if missing:
            block='\n'.join(f'    <uses-permission android:name="{p}" />' for p in missing)
            s=s.replace('<application',block+'\n    <application',1)
          # File/image selection uses the Android system picker. Do not request camera,
          # broad storage, media-library, microphone, contacts, or background location.
          forbidden=[
            'android.permission.CAMERA','android.permission.RECORD_AUDIO',
            'android.permission.READ_EXTERNAL_STORAGE','android.permission.WRITE_EXTERNAL_STORAGE',
            'android.permission.READ_MEDIA_IMAGES','android.permission.ACCESS_BACKGROUND_LOCATION'
          ]
          if any(p in s for p in forbidden):
            raise RuntimeError('Unexpected sensitive Android permission found')
          if 'usesCleartextTraffic="true"' in s:
            raise RuntimeError('Cleartext Android traffic must stay disabled')
          manifest.write_text(s)

          # Google Play requires API 36 for new/updated phone apps after 2026-08-31.
          variables=root/'variables.gradle'
          v=variables.read_text()
          for key in ('compileSdkVersion','targetSdkVersion'):
            v,n=re.subn(rf'({key}\s*=\s*)\d+',rf'\g<1>36',v,count=1)
            if n!=1: raise RuntimeError(f'{key} not found')
          variables.write_text(v)

          # Deterministic Play versioning: each new workflow dispatch gets a higher versionCode.
          app_gradle=root/'app/build.gradle'
          g=app_gradle.read_text()
          version_code=int(os.environ['QG_VERSION_CODE'])
          version_name=os.environ['QG_VERSION_NAME']
          if version_code<1 or version_code>2100000000:
            raise RuntimeError('Android versionCode outside Play-supported range')
          g,n=re.subn(r'(\bversionCode\s+)\d+',rf'\g<1>{version_code}',g,count=1)
          if n!=1: raise RuntimeError('versionCode not found')
          g,n=re.subn(r'(\bversionName\s+)["\'][^"\']+["\']',lambda m:f'{m.group(1)}"{version_name}"',g,count=1)
          if n!=1: raise RuntimeError('versionName not found')
          app_gradle.write_text(g)

          # Native Android Back: follow WebView/history first; exit only at the root.
          activity=next((root/'app/src/main/java').rglob('MainActivity.java'))
          old=activity.read_text()
          package=re.search(r'package\s+([^;]+);',old)
          if not package: raise RuntimeError('MainActivity package not found')
          activity.write_text(f'''package {package.group(1)};

          import android.os.Bundle;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {{
                      @Override
                      public void handleOnBackPressed() {{
                          if (getBridge() != null && getBridge().getWebView().canGoBack()) {{
                              getBridge().getWebView().goBack();
                          }} else {{
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }}
                      }}
                  }});
              }}
          }}
          ''')
          PY

      - name: Verify Android release config
        shell: bash
        env:
          QG_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          grep -q 'targetSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'compileSdkVersion = 36' android-build/android/variables.gradle
          grep -q 'ACCESS_FINE_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          grep -q 'POST_NOTIFICATIONS' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -Eq 'CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|ACCESS_BACKGROUND_LOCATION' android-build/android/app/src/main/AndroidManifest.xml
          ! grep -q 'usesCleartextTraffic="true"' android-build/android/app/src/main/AndroidManifest.xml

      - name: Install approved QueueGo launcher icon
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          src_path=Path('android-build/branding/queuego-approved-icon.webp')
          if not src_path.exists():
              raise RuntimeError('Approved QueueGo icon source is missing')

          src=Image.open(src_path).convert('RGBA')
          if src.width != src.height or src.width < 512:
              raise RuntimeError(f'Approved QueueGo icon must be square and at least 512px, got {src.size}')

          play=src.resize((512,512),Image.Resampling.LANCZOS)
          play.save(Path('QueueGo-${{ matrix.role }}-play-icon-512.png'),optimize=True)

          base=Path('android-build/android/app/src/main/res')
          sizes={
              'mipmap-mdpi':48,
              'mipmap-hdpi':72,
              'mipmap-xhdpi':96,
              'mipmap-xxhdpi':144,
              'mipmap-xxxhdpi':192,
          }

          for folder,n in sizes.items():
              d=base/folder
              d.mkdir(parents=True,exist_ok=True)
              for old in d.glob('ic_launcher*'):
                  old.unlink()
              icon=src.resize((n,n),Image.Resampling.LANCZOS)
              icon.save(d/'ic_launcher.png',optimize=True)
              icon.save(d/'ic_launcher_round.png',optimize=True)
              # Adaptive foreground keeps the exact approved artwork; Android supplies the outer mask.
              icon.save(d/'ic_launcher_foreground.png',optimize=True)

          values=base/'values'
          values.mkdir(parents=True,exist_ok=True)
          (values/'ic_launcher_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources><color name="ic_launcher_background">#0B0F14</color></resources>\n'
          )

          adaptive=base/'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True,exist_ok=True)
          xml=(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <background android:drawable="@color/ic_launcher_background"/>\n'
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          (adaptive/'ic_launcher.xml').write_text(xml)
          (adaptive/'ic_launcher_round.xml').write_text(xml)
          PY

      - name: Configure release signing
        shell: bash
        env:
          QG_KEYSTORE_B64: ${{ secrets.QG_ANDROID_KEYSTORE_B64 }}
          QG_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
          QG_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
          QG_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$QG_KEYSTORE_B64"
          test -n "$QG_STORE_PASSWORD"
          test -n "$QG_KEY_ALIAS"
          test -n "$QG_KEY_PASSWORD"
          echo "$QG_KEYSTORE_B64" | base64 --decode > android-build/android/queuego-release.jks
          test -s android-build/android/queuego-release.jks
          keytool -list \
            -keystore android-build/android/queuego-release.jks \
            -storepass "$QG_STORE_PASSWORD" \
            -alias "$QG_KEY_ALIAS" >/dev/null
          rm -f /tmp/queuego-signing-validation.p12
          keytool -importkeystore \
            -srckeystore android-build/android/queuego-release.jks \
            -srcstorepass "$QG_STORE_PASSWORD" \
            -srcalias "$QG_KEY_ALIAS" \
            -srckeypass "$QG_KEY_PASSWORD" \
            -destkeystore /tmp/queuego-signing-validation.p12 \
            -deststoretype PKCS12 \
            -deststorepass QueueGoValidationOnly123! \
            -destkeypass QueueGoValidationOnly123! \
            -noprompt >/dev/null
          rm -f /tmp/queuego-signing-validation.p12
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android-build/android/app/build.gradle')
          s=p.read_text()
          marker='android {'
          signing="""android {
              signingConfigs {
                  release {
                      storeFile file(project.property("QG_STORE_FILE"))
                      storePassword project.property("QG_STORE_PASSWORD")
                      keyAlias project.property("QG_KEY_ALIAS")
                      keyPassword project.property("QG_KEY_PASSWORD")
                  }
              }
          """
          s=s.replace(marker,signing,1)
          s,count=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1)
          if count!=1: raise RuntimeError('Release build type not found')
          p.write_text(s)
          PY

      - name: Build signed AAB and APK
        shell: bash
        env:
          QG_APP_ID: ${{ matrix.appid }}
          QG_VERSION_CODE: ${{ github.run_number }}
          QG_VERSION_NAME: 1.0.0-beta.${{ github.run_number }}
          QG_GIT_SHA: ${{ github.sha }}
          QG_RUN_ID: ${{ github.run_id }}
          ORG_GRADLE_PROJECT_QG_STORE_FILE: ../queuego-release.jks
          ORG_GRADLE_PROJECT_QG_STORE_PASSWORD: ${{ secrets.QG_ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_QG_KEY_ALIAS: ${{ secrets.QG_ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_QG_KEY_PASSWORD: ${{ secrets.QG_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android-build/android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

          APK=app/build/outputs/apk/release/app-release.apk
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$AAPT"
          test -x "$APKSIGNER"

          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='$QG_APP_ID' versionCode='$QG_VERSION_CODE' versionName='$QG_VERSION_NAME'"
          if echo "$BADGING" | grep -q 'application-debuggable'; then
            echo "::error::Release APK must not be debuggable"
            exit 1
          fi
          CERT_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$CERT_INFO" | grep -q 'Signer #1 certificate SHA-256 digest:'
          CERT_SHA256="$(echo "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          test -n "$CERT_SHA256"
          jarsigner -verify -strict "$AAB" >/dev/null

          cp "$AAB" "../../QueueGo-${{ matrix.role }}-release.aab"
          cp "$APK" "../../QueueGo-${{ matrix.role }}-release.apk"
          cd ../..
          sha256sum "QueueGo-${{ matrix.role }}-release.aab" "QueueGo-${{ matrix.role }}-release.apk" > "QueueGo-${{ matrix.role }}-SHA256.txt"
          {
            echo "role=${{ matrix.role }}"
            echo "application_id=$QG_APP_ID"
            echo "version_code=$QG_VERSION_CODE"
            echo "version_name=$QG_VERSION_NAME"
            echo "git_sha=$QG_GIT_SHA"
            echo "github_run_id=$QG_RUN_ID"
            echo "signer_certificate_sha256=$CERT_SHA256"
            cat "QueueGo-${{ matrix.role }}-SHA256.txt"
          } > "QueueGo-${{ matrix.role }}-release-evidence.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QueueGo-${{ matrix.role }}-android-release
          path: |
            QueueGo-${{ matrix.role }}-release.aab
            QueueGo-${{ matrix.role }}-release.apk
            QueueGo-${{ matrix.role }}-SHA256.txt
            QueueGo-${{ matrix.role }}-release-evidence.txt
            QueueGo-${{ matrix.role }}-play-icon-512.png
          if-no-files-found: error
