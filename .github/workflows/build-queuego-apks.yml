name: QueueGo Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: customer
            appid: com.queuego.customer
            appname: QueueGo
            source: .
          - role: merchant
            appid: com.queuego.merchant
            appname: QueueGo Merchant
            source: merchant
          - role: rider
            appid: com.queuego.rider
            appname: QueueGo Rider
            source: rider
          - role: admin
            appid: com.queuego.admin
            appname: QueueGo Admin
            source: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web bundle
        shell: bash
        run: |
          set -euo pipefail
          cd android-build
          npm install --no-audit --no-fund
          rm -rf www android
          mkdir -p www
          if [ "${{ matrix.role }}" = "customer" ]; then
            cp ../index.html www/index.html
            cp ../market.css ../market.js ../table-order.css ../table-order.js ../table-order.html www/ 2>/dev/null || true
          elif [ "${{ matrix.role }}" = "merchant" ]; then
            cp ../merchant/* www/
          elif [ "${{ matrix.role }}" = "admin" ]; then
            cp ../admin/* www/
          else
            cp ../rider/index.html www/index.html
          fi
          node -e "let c=require('./capacitor.config.json');c.appId='${{ matrix.appid }}';c.appName='${{ matrix.appname }}';require('fs').writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
          npx cap add android
          npx cap sync android
      - name: Add native runtime permission bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, textwrap
          cfg=json.loads(Path('android-build/capacitor.config.json').read_text())
          pkg=cfg['appId']
          java_dir=Path('android-build/android/app/src/main/java')/Path(*pkg.split('.'))
          java_dir.mkdir(parents=True,exist_ok=True)
          src=textwrap.dedent(f"""\
          package {pkg};

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {{
            private static final int QG_PERMISSION_REQUEST = 4201;
            @Override
            public void onCreate(Bundle savedInstanceState) {{
              super.onCreate(savedInstanceState);
              if (bridge != null && bridge.getWebView() != null) {{
                bridge.getWebView().getSettings().setGeolocationEnabled(true);
              }}
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {{
                List<String> wanted = new ArrayList<>();
                addIfMissing(wanted, Manifest.permission.ACCESS_COARSE_LOCATION);
                addIfMissing(wanted, Manifest.permission.ACCESS_FINE_LOCATION);
                addIfMissing(wanted, Manifest.permission.CAMERA);
                addIfMissing(wanted, Manifest.permission.RECORD_AUDIO);
                if (Build.VERSION.SDK_INT >= 33) {{
                  addIfMissing(wanted, Manifest.permission.POST_NOTIFICATIONS);
                  addIfMissing(wanted, Manifest.permission.READ_MEDIA_IMAGES);
                  addIfMissing(wanted, Manifest.permission.READ_MEDIA_VIDEO);
                }}
                if (Build.VERSION.SDK_INT >= 31) {{
                  addIfMissing(wanted, Manifest.permission.BLUETOOTH_SCAN);
                  addIfMissing(wanted, Manifest.permission.BLUETOOTH_CONNECT);
                }}
                if (!wanted.isEmpty()) requestPermissions(wanted.toArray(new String[0]), QG_PERMISSION_REQUEST);
              }}
            }}
            private void addIfMissing(List<String> list, String permission) {{
              if (checkSelfPermission(permission) != PackageManager.PERMISSION_GRANTED) list.add(permission);
            }}
          }}
          """)
          (java_dir/'MainActivity.java').write_text(src)
          PY
      - name: Add Android permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-build/android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms=[
            'android.permission.INTERNET',
            'android.permission.ACCESS_NETWORK_STATE',
            'android.permission.ACCESS_WIFI_STATE',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.CAMERA',
            'android.permission.RECORD_AUDIO',
            'android.permission.POST_NOTIFICATIONS',
            'android.permission.READ_MEDIA_IMAGES',
            'android.permission.READ_MEDIA_VIDEO',
            'android.permission.VIBRATE',
            'android.permission.WAKE_LOCK',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.BLUETOOTH',
            'android.permission.BLUETOOTH_CONNECT',
            'android.permission.BLUETOOTH_SCAN'
          ]
          block='\n'.join(f'    <uses-permission android:name="{x}" />' for x in perms)
          s=s.replace('<application',block+'\n    <application',1)
          p.write_text(s)
          PY
      - name: Create QueueGo Q launcher icon
        shell: bash
        run: |
          python3 -m pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          base=Path('android-build/android/app/src/main/res')
          for folder,n in sizes.items():
              d=base/folder; d.mkdir(parents=True,exist_ok=True)
              im=Image.new('RGBA',(n,n),(255,255,255,255))
              dr=ImageDraw.Draw(im)
              red=(231,9,43,255)
              w=max(4,round(n*0.14))
              box=(round(n*0.20),round(n*0.17),round(n*0.72),round(n*0.69))
              dr.ellipse(box,outline=red,width=w)
              dr.line((round(n*0.56),round(n*0.56),round(n*0.80),round(n*0.80)),fill=red,width=w)
              im.save(d/'ic_launcher.png')
              im.save(d/'ic_launcher_round.png')
          PY
      - name: Build debug APK
        shell: bash
        run: |
          cd android-build/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "../../QueueGo-${{ matrix.role }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: QueueGo-${{ matrix.role }}-debug-apk
          path: QueueGo-${{ matrix.role }}-debug.apk
          if-no-files-found: error
