<style id="qt-shop-base-v16">
:root{--primary:#20bc8b;--primary-dark:#14946e;--bg:#f5fffb;--radius:12px}
html,body{min-width:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Thonburi",sans-serif;background:var(--bg);color:#17392e}
.qt-toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,12px);opacity:0;z-index:9000;max-width:90%;padding:10px 15px;border-radius:13px;background:#17392e;color:#fff;font-size:13px;text-align:center;box-shadow:0 8px 24px rgba(23,57,46,.18);transition:opacity .2s,transform .2s}
.qt-toast.show{opacity:1;transform:translate(-50%,0)}
#notif-toast-box{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:9000;display:grid;place-items:center;pointer-events:none}
.notif-toast{width:min(560px,100%);min-height:50px;padding:9px 11px;border-radius:15px;background:rgba(255,255,255,.98);color:#17392e;border:1px solid #dceee6;box-shadow:0 9px 28px rgba(23,57,46,.15);font-size:12px;line-height:1.4;display:grid;grid-template-columns:30px minmax(0,1fr);align-items:center;gap:9px;pointer-events:auto;cursor:default}
.notif-toast[data-link]{cursor:pointer}
.notif-toast-icon{width:30px;height:30px;border-radius:10px;background:#eaf9f3;color:#13805f;display:grid;place-items:center}
.notif-toast-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.notif-toast-copy{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.map-box{height:220px;border:1px solid #dceee6;border-radius:12px;overflow:hidden;margin:10px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px}.badge-green{background:#e5fbf2;color:#13805f}.badge-yellow{background:#fff7df;color:#a16b00}.badge-gray{background:#f0f4f2;color:#667d72}
#qt-net-status{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:8999;max-width:calc(100vw - 24px);padding:10px 14px;border-radius:12px;background:#9b1c2c;color:#fff;font-size:13px;line-height:1.4;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.18)}#qt-net-status.show{display:block}#qt-net-status.checking{background:#875c00}</style>
