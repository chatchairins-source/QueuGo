<script id="qt-v532-helpers">
/* V5.32 helpers — defined first so every later script can use them */
function escapeHtml(value){ return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
function qtCleanText(v){ return String(v==null?'':v).replace(/[<>]/g,'').replace(/\s+/g,' ').trim(); }

/* Sync state: in-flight writes, per-row "last persisted" hashes, polling bookkeeping */
const QT_SYNC={pending:0,lastWrite:0,busy:false,dirty:{},hash:{},profileMaps:null,tick:0,lastErrorToast:0,timer:null};
function qtTrackPersist(p){
  QT_SYNC.pending++; QT_SYNC.lastWrite=Date.now();
  return Promise.resolve(p).finally(()=>{ QT_SYNC.pending=Math.max(0,QT_SYNC.pending-1); QT_SYNC.lastWrite=Date.now(); });
}
function qtSyncFailed(key,err){
  console.warn('Supabase sync failed:',key,err);
  /* Notifications are auxiliary. A notification RLS failure must never make an
     order, cancellation, assignment, payment, or other business action look
     like it failed. The notification remains in the current session and will
     be retried by the normal sync cycle after the DB policy is corrected. */
  if(key==='qt_notifications'){ console.warn('QueueGo notification sync failed; auth/session may need refresh.', {hasSession:!!qtSessionRead(), hasAccessToken:!!qtAccessToken(), hasRefreshToken:!!qtSessionRead()?.refreshToken}); return; }
  if(Date.now()-QT_SYNC.lastErrorToast<15000) return;
  QT_SYNC.lastErrorToast=Date.now();
  try{ toast('บันทึกข้อมูลขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ('+String((err&&err.message)||'unknown').slice(0,80)+')'); }catch(e){}
}
/* notifications: in-app objects use {body, link}; the table has {message, type, reference_id} */
function qtNotifDbParts(n){
  const m=String(n.link||'').match(/^(?:shop-order|order)\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i);
  if(m) return {type:'order',ref:m[1]};
  return {type:['order','quotation','delivery','payment','complaint','system'].includes(n.type)?n.type:'system',ref:(n.referenceId&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(n.referenceId))?n.referenceId:null};
}
function qtNotifLinkFromRow(n){ if(!n.reference_id) return undefined; if(n.type==='order') return 'shop-order/'+n.reference_id; return undefined; }
/* never send the password (or other secrets) to the database inside metadata */
function qtUserMetadata(u){
  const m=Object.assign({},u);
  delete m.password;
  delete m.status;
  delete m.applicationStatus;
  delete m.authUserId;
  delete m.type;
  delete m.id;
  /* Shop modules have their own database table; never duplicate them in users.metadata. */
  delete m.modules;
  return m;
}

async function qtSupabaseAuth(path, body){
  let r;try{r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/'+path,{method:'POST',headers:qtSupabaseHeaders(),body:JSON.stringify(body),signal:AbortSignal.timeout(15000)})}catch(e){if(typeof qtConnectionNotice==='function')qtConnectionNotice('unstable');throw e}if(typeof qtConnectionNotice==='function')qtConnectionNotice('online');
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return ({})});
  if(!r.ok) throw new Error(data.error_description||data.msg||data.message||'AUTH_ERROR');
  return data;
}

async function qtSupabaseTable(path, options={}){
  const headers=qtSupabaseHeaders(options.accessToken);
  const isNotif=String(path).startsWith('notifications');
  const rep=isNotif ? 'return=minimal' : 'return=representation';
  if(['POST','PATCH','PUT'].includes(String(options.method||'GET').toUpperCase())){
    headers.Prefer=String(path).includes('on_conflict=') && String(options.method||'').toUpperCase()==='POST'
      ? rep+',resolution=merge-duplicates' : rep;
  }
  let r;try{r=await fetch(QT_SUPABASE_CONFIG.URL+'/rest/v1/'+path,{method:options.method||'GET',headers,body:options.body?JSON.stringify(options.body):undefined,signal:AbortSignal.timeout(15000)})}catch(e){if(typeof qtConnectionNotice==='function')qtConnectionNotice('unstable');throw e}if(typeof qtConnectionNotice==='function')qtConnectionNotice('online');
  const data=await r.json().catch(e=>{if(e.name==='AbortError'||e.name==='TimeoutError')throw e;return null});
  if(!r.ok) throw new Error((data&&data.message)||((data&&data.hint)?data.hint:'DB_ERROR_'+r.status));
  return data;
}
function qtAuthEmailFromPhone(phone){
  const digits=String(phone||'').replace(/\D/g,'');
  return digits+'@auth.queuetech.local';
}
async function qtCreateSupabaseUser({type,name,phone,password,email,shopName,category,marketRegistration=null}){
  const cleanEmail=String(email||'').trim().toLowerCase();
  const cleanPhone=String(phone||'').trim();
  const authEmail=cleanEmail || qtAuthEmailFromPhone(cleanPhone);
  const auth=await qtSupabaseAuth('signup',{
    email:authEmail,
    password,
    data:{name,phone:cleanPhone||null,role:'shop',shop_name:shopName,category}
  });
  let session=auth.session;
  if(!auth.user) throw new Error('สร้างบัญชี Auth ไม่สำเร็จ');
  if(!session || !session.access_token){
    if(cleanEmail){
      return {auth,session:null,profile:null,needsEmailConfirmation:true,authEmail};
    }
    try{
      session=await qtSupabaseAuth('token?grant_type=password',{email:authEmail,password});
    }catch(loginErr){
      throw new Error('AUTH_CONFIRMATION_REQUIRED');
    }
  }
  /* V5.37 FIX:
     The users table flow already uses auth_user_id as the conflict identity
     elsewhere in QueueGo. Use that same database-backed identity here.
     Do not use phone as the conflict target because the earlier V5.32 target
     was not backed by a matching UNIQUE/EXCLUSION constraint. */
  const row={
    auth_user_id:auth.user.id,
    role:'shop',
    name,
    phone:cleanPhone||null,
    status:'pending',
    metadata:{shopName,category}
  };
  const rows=await qtSupabaseTable('users?select=*&on_conflict=auth_user_id',{method:'POST',accessToken:session.access_token,body:row});
  const profile=Array.isArray(rows)?rows[0]:rows;
  if(!profile) throw new Error('สร้างข้อมูลผู้ใช้ในฐานข้อมูลไม่สำเร็จ');
  const shopBody={user_id:profile.id,shop_name:shopName,status:'pending',metadata:{shopName,category}};
  if(marketRegistration&&Number.isFinite(Number(marketRegistration.lat))&&Number.isFinite(Number(marketRegistration.lng))){
    shopBody.latitude=Number(marketRegistration.lat);
    shopBody.longitude=Number(marketRegistration.lng);
  }
  const shops=await qtSupabaseTable('shop_profiles?select=id,shop_name,public_category,status,latitude,longitude,market_suggested_id,market_suggested_distance_km,market_membership_status&on_conflict=user_id',{
    method:'POST',accessToken:session.access_token,body:shopBody
  });
  if(!Array.isArray(shops)||shops.length!==1||shops[0].shop_name!==shopName||shops[0].public_category!==category||shops[0].status!=='pending'){
    throw new Error('สร้างบัญชีแล้ว แต่บันทึกข้อมูลร้านไม่สำเร็จ กรุณาเข้าสู่ระบบและแก้ข้อมูลร้าน');
  }
  if(marketRegistration?.marketId){
    try{
      await qtSupabaseTable('rpc/queuego_submit_market_membership',{
        method:'POST',accessToken:session.access_token,
        body:{
          p_market_id:marketRegistration.marketId,
          p_stall_no:marketRegistration.stallNo||null,
          p_zone:marketRegistration.zone||null,
          p_confirmed:true,
          p_proof_path:null
        }
      });
    }catch(e){
      throw new Error('สร้างบัญชีแล้ว แต่ส่งคำขอเข้าตลาดไม่สำเร็จ: '+String(e.message||e));
    }
  }else if(marketRegistration?.request?.name){
    try{
      await qtSupabaseTable('rpc/queuego_request_market',{
        method:'POST',accessToken:session.access_token,
        body:{
          p_name:marketRegistration.request.name,
          p_province:marketRegistration.request.province,
          p_district:marketRegistration.request.district||null,
          p_subdistrict:marketRegistration.request.subdistrict||null,
          p_address:marketRegistration.request.address||null,
          p_lat:Number(marketRegistration.lat),
          p_lng:Number(marketRegistration.lng),
          p_note:marketRegistration.request.note||null
        }
      });
    }catch(e){
      throw new Error('สร้างบัญชีแล้ว แต่ส่งคำขอเพิ่มตลาดไม่สำเร็จ: '+String(e.message||e));
    }
  }
  return {auth,session,profile,shop:shops[0],needsEmailConfirmation:false,authEmail};
}
async function qtLoadOwnSupabaseUser(accessToken, authUserId){
  const rows=await qtSupabaseTable('users?select=*&auth_user_id=eq.'+encodeURIComponent(authUserId),{accessToken});
  return Array.isArray(rows)?rows[0]:null;
}

<script>
/* =========================================================================
   QueueGo Merchant — application data layer
   Notification RLS resilience: notification sync failures are non-blocking.
   Based on V5.50 search-location build.
   ========================================================================= */
/* =========================================================================
   QueueGo Merchant — Supabase and Leaflet integration.
   Account session uses device storage with server-side authorization.
   ========================================================================= */

/* ---------- Supabase-backed application data layer ----------
   Business data is kept in memory and persisted to Supabase.
   Business data is held in memory and synchronized with Supabase.
   sessionStorage is used only for the current browser session token. */
const QT_DB_CACHE = Object.create(null);
const QT_DB_KEYS = new Set(['qt_users','qt_orders','qt_notifications','qt_audit_log','qt_promotions','qt_products','qt_settlements']);
const QT_SHOP_MODULE_STATUSES = ['disabled','trial','enabled'];
const QT_DB_READY = {value:false};
function dbGet(key, def){
  if(Object.prototype.hasOwnProperty.call(QT_DB_CACHE,key)) return QT_DB_CACHE[key];
  return def!==undefined ? def : [];
}
function dbSet(key, val){
  QT_DB_CACHE[key]=val;
  if(QT_SYNC.busy) QT_SYNC.dirty[key]=val; /* a poll is in flight: re-apply this local write after it finishes */
  if(QT_DB_KEYS.has(key)) qtTrackPersist(qtPersistKey(key,val)).catch(err=>qtSyncFailed(key,err));
  else if(String(key).startsWith('qt_order_chat_') && !String(key).endsWith('_deleteAt')) qtTrackPersist(qtPersistChat(String(key).replace('qt_order_chat_',''),val)).catch(err=>qtSyncFailed(key,err));
  else if(!String(key).endsWith('_deleteAt')) console.warn('[QueueGo] dbSet("'+key+'") is not in QT_DB_KEYS and has no sync handler — this write stays local-only and will NOT sync to Supabase or other devices. Add "'+key+'" to QT_DB_KEYS in the code if this data should be shared.');
}

async function qtPersistChat(orderId,messages){
  const token=await qtGetAccessToken();if(!token||!qtUuidLike(orderId))return;
  const rows=Array.isArray(messages)?messages:[];
  const saved=await qtSupabaseTable('order_chat_messages?select=id&order_id=eq.'+encodeURIComponent(orderId),{accessToken:token});
  const known=new Set((saved||[]).map(m=>String(m.id)));
  for(const m of rows){
    if(!qtUuidLike(m.id)||!qtUuidLike(m.senderId)||known.has(String(m.id)))continue;
    await qtSupabaseTable('order_chat_messages',{method:'POST',accessToken:token,body:{id:m.id,order_id:orderId,sender_id:m.senderId,message:m.text||'',created_at:qtIso(m.createdAt)}});
    known.add(String(m.id));
  }
}

function uid(){ return (window.crypto&&crypto.randomUUID) ? crypto.randomUUID() : ('00000000-0000-4000-8000-'+Math.random().toString(16).slice(2,14).padEnd(12,'0')); }

const QT_SHOP_SESSION_KEY='qg_merchant_session_v1';
function qtSessionRead(){ try{let raw=localStorage.getItem(QT_SHOP_SESSION_KEY)||sessionStorage.getItem(QT_SHOP_SESSION_KEY);if(!raw){const legacy=localStorage.getItem('qt_session')||sessionStorage.getItem('qt_session');if(legacy){const old=JSON.parse(legacy);if(old?.role==='shop'){raw=legacy;localStorage.setItem(QT_SHOP_SESSION_KEY,legacy);localStorage.removeItem('qt_session');sessionStorage.removeItem('qt_session')}}}return JSON.parse(raw||'null')}catch(e){return null} }
function qtSessionWrite(s){ try{localStorage.setItem(QT_SHOP_SESSION_KEY,JSON.stringify(s));sessionStorage.removeItem(QT_SHOP_SESSION_KEY)}catch(e){try{sessionStorage.setItem(QT_SHOP_SESSION_KEY,JSON.stringify(s))}catch(_){}} }
function qtSessionClear(){ try{localStorage.removeItem(QT_SHOP_SESSION_KEY);sessionStorage.removeItem(QT_SHOP_SESSION_KEY)}catch(e){} }
function qtAccessToken(){ return qtSessionRead()?.accessToken || ''; }
function qtJwtExpiryMs(token){
  try{
    const part=String(token||'').split('.')[1];
    if(!part) return 0;
    const b64=part.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((part.length+3)%4);
    const payload=JSON.parse(atob(b64));
    return Number(payload.exp||0)*1000;
  }catch(e){ return 0; }
}
let QT_AUTH_REFRESH_PROMISE=null;
async function qtGetAccessToken(forceRefresh=false){
  const s=qtSessionRead();
  if(!s?.accessToken) return '';
  /* Supabase expires_at is Unix seconds, while Date.now() is milliseconds.
     Normalize once here. The old comparison treated every token as expired and
     repeatedly hit /auth/v1/token until Auth returned 429, which stalled data pages. */
  const rawExp=Number(s.expiresAt||0);
  const exp=rawExp ? (rawExp < 100000000000 ? rawExp*1000 : rawExp) : qtJwtExpiryMs(s.accessToken);
  const needsRefresh=forceRefresh || (exp>0 && exp-Date.now()<60000);
  if(!needsRefresh || !s.refreshToken) return s.accessToken;
  if(QT_AUTH_REFRESH_PROMISE) return QT_AUTH_REFRESH_PROMISE;
  QT_AUTH_REFRESH_PROMISE=(async()=>{
    try{
      const r=await fetch(QT_SUPABASE_CONFIG.URL+'/auth/v1/token?grant_type=refresh_token',{
        method:'POST',headers:qtSupabaseHeaders(),
        body:JSON.stringify({refresh_token:s.refreshToken})
      });
      const data=await r.json().catch(()=>({}));
      if(!r.ok || !data.access_token) throw new Error(data.error_description||data.msg||data.message||'SESSION_REFRESH_FAILED');
      const next={...s,accessToken:data.access_token,refreshToken:data.refresh_token||s.refreshToken,expiresAt:data.expires_at ? Number(data.expires_at)*1000 : (qtJwtExpiryMs(data.access_token)||null)};
      qtSessionWrite(next);
      return next.accessToken;
    }finally{ QT_AUTH_REFRESH_PROMISE=null; }
  })();
  return QT_AUTH_REFRESH_PROMISE;
}
function qtIso(ts){ return new Date(ts||Date.now()).toISOString(); }
function qtUuidLike(id){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(id||'')); }

function qtOrderStatusToDb(s){
  const m={pending_shop:'pending',shop_accepted:'accepted',preparing:'preparing',waiting_rider:'ready',rider_to_shop:'assigned',picked_up:'picked_up',delivering:'in_progress',arrived:'in_progress',delivered:'completed',completed:'completed',cancelled:'cancelled'};
  return m[s]||(['pending','accepted','preparing','ready','assigned','picked_up','in_progress','completed','cancelled'].includes(s)?s:'pending');
}
function qtOrderStatusFromDb(s, note=''){ const noted=(note||'').match(/__QT_ORDER_STATUS__=([^\n]+)/)?.[1]; const raw=noted||s; const map={pending:'pending_shop',accepted:'shop_accepted',searching_rider:'searching_rider',rider_assigned:'rider_to_shop',ready:'waiting_rider',assigned:'rider_to_shop',picked_up:'picked_up',in_progress:'delivering',completed:'completed'}; return map[raw]||raw; }


function qtUserToRow(u, includeStatus=true){
  const meta=qtUserMetadata(u);
  const row={id:qtUuidLike(u.id)?u.id:undefined,auth_user_id:u.authUserId||null,role:u.type,name:u.name||'',phone:u.phone||'',
    metadata:meta,created_at:qtIso(u.createdAt),updated_at:qtIso(Date.now())};
  /* the column is the source of truth: pending stays pending until an admin approves ('active') */
  if(includeStatus) row.status = u.status==='suspended' ? 'suspended'
    : u.status==='deleted' ? 'deleted'
    : (u.type==='admin'||u.status==='approved') ? 'active' : 'pending';
  return row;
}
function qtUserFromRow(r){
  const meta=(r.metadata&&typeof r.metadata==='object'&&!Array.isArray(r.metadata))?r.metadata:{};
  const u=Object.assign({createdAt:new Date(r.created_at).getTime(),supabase:true},meta);

  /*
   * V5.40 BATCH 2 — Account status comes ONLY from users.status.
   *
   * Before this fix, an old metadata.status='pending' or 'rejected' could
   * override a real users.status='active'. That could make an already
   * approved shop appear pending again after refresh/background hydrate.
   */
  let status;

/* V5.33 performance: hydrate runs in the background — it must never block first paint or login.
   QT_DB_HYDRATING guards against overlapping loads (login + initial load + sync loop). */
let QT_DB_HYDRATING=false, QT_DB_HYDRATE_QUEUED=null, QT_DB_FULL_TRIED=false;
async function qtBackgroundHydrate(opts){
  opts=opts||{light:false};
  if(!qtAccessToken()){ QT_DB_READY.value=true; return; }
  if(QT_DB_HYDRATING){ /* already loading: remember one follow-up run instead of running two loads at once */
    if(!QT_DB_HYDRATE_QUEUED || !opts.light) QT_DB_HYDRATE_QUEUED=opts;
    return;
  }
  if(QT_SYNC.busy){ setTimeout(()=>qtBackgroundHydrate(opts),1000); return; } /* a sync poll is in flight; try again shortly */
  const token=await qtGetAccessToken();
  if(!token){ QT_DB_READY.value=true; return; }
  QT_DB_HYDRATING=true; QT_SYNC.busy=true; QT_SYNC.dirty={}; /* busy also pauses the sync loop and records local writes made meanwhile */
  let ok=false;
  try{
    await qtHydrateDatabase(opts);
    ok=true;
  }catch(err){
    console.error('Background hydrate failed:',err);
    try{ if(qtSessionRead()?.role==='admin') toast('โหลดข้อมูลสมาชิกจากฐานข้อมูลไม่สำเร็จ'); }catch(e){}
  }finally{
    if(!opts.light) QT_DB_FULL_TRIED=true;
    if(qtAccessToken()===token) Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; }); /* keep local writes made during the load */
    QT_SYNC.dirty={}; QT_SYNC.busy=false; QT_DB_HYDRATING=false;
  }
  const now=qtAccessToken();
  if(!now){ qtResetCache(); QT_DB_HYDRATE_QUEUED=null; return; } /* logged out while loading */
  if(now!==token) QT_DB_HYDRATE_QUEUED={light:false}; /* another account signed in while loading: load again for it */
  else if(ok) qtRerenderAfterHydrate();
  const q=QT_DB_HYDRATE_QUEUED; QT_DB_HYDRATE_QUEUED=null;
  if(q) setTimeout(()=>qtBackgroundHydrate(q),0);
}
/* After the background load lands, refresh the page the person is looking at (never while they are typing). */
function qtRerenderAfterHydrate(tries){
  tries=tries||0;
  if(!currentUser()) return;
  const name=(location.hash.replace('#','')||'home').split('/')[0];
  if(name==='login'||name==='shop-register') return; /* these pages do not depend on loaded data */
  const a=document.activeElement;
  const typing=(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) ||
    [].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typing){ if(tries<6) setTimeout(()=>qtRerenderAfterHydrate(tries+1),1500); return; }
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}

function qgShopCoordinateProblem(latitude,longitude){
  if(latitude===null||latitude===undefined||longitude===null||longitude===undefined||latitude===''||longitude==='') return 'missing';
  const lat=Number(latitude),lng=Number(longitude);
  if(!Number.isFinite(lat)||!Number.isFinite(lng)) return 'not_finite';
  if(lat===0&&lng===0) return 'zero';
  if(lat>=97&&lat<=106&&lng>=5&&lng<=21) return 'swapped';
  if(lat < -90 || lat > 90 || lng < -180 || lng > 180) return 'out_of_range';
  if(!(lat>=5&&lat<=21&&lng>=97&&lng<=106)) return 'outside_thailand';
  return '';
}

function qtSyncHash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return h; }
function qtSyncSignature(){
  const me=currentUser();
  const main=qtSyncHash(JSON.stringify([me&&me.status,dbGet('qt_orders',[]),dbGet('qt_products',[]),dbGet('qt_notifications',[])]));
  const chat=qtSyncHash(JSON.stringify(Object.keys(QT_DB_CACHE).filter(k=>k.startsWith('qt_order_chat_')&&!k.endsWith('_deleteAt')).sort().map(k=>[k,(QT_DB_CACHE[k]||[]).length])));
  return {main,chat};
}
function qtSyncRerender(before,after){
  const user=currentUser(); if(!user) return;
  const parts=(location.hash.replace('#','')||'home').split('/'); const name=parts[0], param=parts[1];
  if(name==='approval-pending' && isApproved(user)){ toast('บัญชีของคุณได้รับการอนุมัติแล้ว'); navigate('dashboard'); return; }
  const a=document.activeElement;
  if(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; /* never interrupt typing */
  if(before.main===after.main) return;
  const safe=['dashboard','shop-orders','shop-order','shop-products','notifications','shop-settlement'];
  if(!safe.includes(name)) return;
  const typed=[].slice.call(document.querySelectorAll('#app textarea, #app input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])')).some(el=>String(el.value||'').trim());
  if(typed) return;
  const y=window.scrollY; try{ router(); }catch(e){ console.warn(e); } window.scrollTo(0,y);
}
async function qtSyncTick(force){
  if(['pos','pos-staff-join'].includes(location.hash.slice(1).split('/')[0]))return;
  if(QT_SYNC.busy || QT_DB_HYDRATING) return;
  if(document.hidden && !force) return;
  if(!qtAccessToken()) return;
  if(QT_SYNC.pending>0 || Date.now()-QT_SYNC.lastWrite<2500) return; /* let our own writes land first */
  QT_SYNC.busy=true; QT_SYNC.dirty={};
  try{
    QT_SYNC.tick++;
    const me=currentUser();
    const full=(QT_SYNC.tick%8===0)||(me&&!isApproved(me))||!QT_DB_FULL_TRIED; /* light poll every 8s, full refresh about once a minute */
    const before=qtSyncSignature();
    const seenNotifs=new Set(dbGet('qt_notifications',[]).map(n=>n.id));
    await qtHydrateDatabase({light:!full});
    if(!qtAccessToken()){ qtResetCache(); return; } /* logged out while fetching */
    Object.keys(QT_SYNC.dirty).forEach(k=>{ QT_DB_CACHE[k]=QT_SYNC.dirty[k]; });
    if(me){ dbGet('qt_notifications',[]).forEach(n=>{ if(n.userId===me.id && !n.read && !seenNotifs.has(n.id)){ try{ qtHandleNewNotification(n); }catch(e){} } }); }
    if(typeof qgCheckMerchantOrders==='function')qgCheckMerchantOrders();
    const after=qtSyncSignature();
    if(after.main!==before.main||after.chat!==before.chat) qtSyncRerender(before,after);
  }catch(e){ console.warn('sync tick failed',e); }
  finally{ QT_SYNC.dirty={}; QT_SYNC.busy=false; }
}
function qtStartSyncLoop(){
  if(QT_SYNC.timer) return;
  QT_SYNC.timer=setInterval(()=>qtSyncTick(),8000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) qtSyncTick(); });
}
window.addEventListener('DOMContentLoaded', ()=>{
  /* Merchant boot must NEVER wait for network/session refresh before first paint.
     Render immediately; restore the signed-in shop asynchronously afterwards. */
  const hadSession=!!qtAccessToken();
  router();
  qtStartSyncLoop();
  if(hadSession){
    setTimeout(async ()=>{
      await qtRestoreOwnUser();
      try{ router(); }catch(e){ console.warn('merchant restore rerender failed',e); }
      qtBackgroundHydrate({light:false});
    },0);
  }else{
    setTimeout(()=>{ qtBackgroundHydrate({light:false}); },0);
  }
});

/* ---------- QT Order Number ---------- */
/* Order number display: QT-001, QT-002, ... (3 digits).
   Numbering is GLOBAL across all shops and resets each calendar day.
   Therefore no two shops can receive the same QT number on the same day.
   The internal id remains unchanged for routing/storage compatibility. */
function qtLocalDateKey(ts){
  const d = new Date(ts || Date.now());
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function displayOrderNumber(order){
  const raw=String(order?.orderNumber||order?.order_number||'').trim();
  const seq=raw.match(/(\d{4})$/);
  if(seq)return 'QT-'+seq[1];
  const id=String(order?.id||'').replace(/[^a-z0-9]/gi,'').slice(-4).toUpperCase();
  return 'QT-'+id.padStart(4,'0');
}

async function cycleModule(moduleKey){
  const user=currentUser();
  if(!user||user.type!=='shop'){toast('ไม่มีสิทธิ์');return;}
  if(!QT_SHOP_MODULE_CATALOG.some(x=>x.key===moduleKey)){toast('ไม่พบโมดูล');return;}
  try{
    const rows=await qtLoadShopModules(user.id);
    const existing=rows.find(x=>x.module_key===moduleKey);
    const current=existing?.status||'disabled';
    const next=QT_SHOP_MODULE_STATUSES[(QT_SHOP_MODULE_STATUSES.indexOf(current)+1)%QT_SHOP_MODULE_STATUSES.length];
    const now=new Date().toISOString();
    const body={status:next,updated_at:now};
    if(!existing){
      body.shop_user_id=user.id;
      body.module_key=moduleKey;
      body.started_at=next==='disabled'?null:now;
      body.expires_at=null;
      await qtSupabaseTable('shop_modules?on_conflict=shop_user_id,module_key',{
        method:'POST',accessToken:await qtGetAccessToken(),body
      });
    }else{
      if(next!=='disabled'&&!existing.started_at)body.started_at=now;
      if(next==='disabled')body.expires_at=null;
      await qtSupabaseTable('shop_modules?id=eq.'+encodeURIComponent(existing.id),{
        method:'PATCH',accessToken:await qtGetAccessToken(),body
      });
    }
    toast(`โมดูล "${qtShopModuleLabel(moduleKey)}" → ${qtShopModuleStatusLabel(next)}`);
    await renderShopModules();
  }catch(err){
    console.error('shop_modules save failed',err);
    toast('บันทึกโมดูลไม่สำเร็จ: '+String(err.message||err).slice(0,120));
  }
}

<script id="qt-shop-new-order-realtime-v1">
(function(){
  const SEEN_KEY='qt_shop_seen_pending_orders_v1';
  let audioCtx=null;
  let initialized=false;

  function shopUserSafe(){
    try{
      const u=typeof shopUser==='function'?shopUser():null;
      if(u && u.type==='shop') return u;
    }catch(e){}
    try{
      const u=typeof currentUser==='function'?currentUser():null;
      if(u && u.type==='shop') return u;
    }catch(e){}
    return null;
  }

  function readSeen(){
    try{
      const x=JSON.parse(sessionStorage.getItem(SEEN_KEY)||'[]');
      return new Set(Array.isArray(x)?x.map(String):[]);
    }catch(e){ return new Set(); }
  }
  function saveSeen(set){
    try{
      const a=[...set].slice(-300);
      sessionStorage.setItem(SEEN_KEY,JSON.stringify(a));
    }catch(e){}
  }

  function unlockShopAudio(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        if(!audioCtx) audioCtx=new AC();
        if(audioCtx.state==='suspended') audioCtx.resume();
      }
    }catch(e){}
  }
  document.addEventListener('click',unlockShopAudio,{passive:true});
  document.addEventListener('touchend',unlockShopAudio,{passive:true});
  document.addEventListener('pointerup',unlockShopAudio,{passive:true});

  function beep(){
    try{
      unlockShopAudio();
      if(!audioCtx) return;
      const now=audioCtx.currentTime;
      [0,0.22,0.44].forEach((offset,i)=>{
        const osc=audioCtx.createOscillator();
        const gain=audioCtx.createGain();
        osc.type='sine';
        osc.frequency.value=i===1?1046:880;
        gain.gain.setValueAtTime(0.0001,now+offset);
        gain.gain.exponentialRampToValueAtTime(0.28,now+offset+0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.18);
        osc.connect(gain);gain.connect(audioCtx.destination);
        osc.start(now+offset);osc.stop(now+offset+0.2);
      });
    }catch(e){}
  }

  function speak(){
    try{
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance('มีออเดอร์ใหม่เข้ามาค่ะ กรุณาตรวจสอบออเดอร์ใหม่');
      u.lang='th-TH';u.rate=.95;u.pitch=1;u.volume=1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function stopSound(){
    try{window.speechSynthesis.cancel();}catch(e){}
  }

  function showAlert(order){
    // Shop build V6: แจ้งออเดอร์ใหม่ด้วยเสียงเท่านั้น ไม่มี popup/ปุ่มบังคับกดรับทราบ
    stopSound();
    beep();
    speak();
    // อัปเดต badge/รายการออเดอร์จากข้อมูลเดิม โดยไม่เปลี่ยนฐานข้อมูลหรือสถานะออเดอร์
    try{ window.dispatchEvent(new CustomEvent('qt:shop-new-order-sound',{detail:{orderId:order.id}})); }catch(e){}
  }

  function pendingShopOrders(u){
    try{
      const all=typeof dbGet==='function'?dbGet('qt_orders',[]):[];
      return (Array.isArray(all)?all:[])
        .filter(o=>String(o.shopId)===String(u.id) && o.status==='pending_shop')
        .sort((a,b)=>(Number(a.createdAt)||0)-(Number(b.createdAt)||0));
    }catch(e){return [];}
  }

  window.qgCheckMerchantOrders=checkForNewOrders;
  function checkForNewOrders(scopedOrders){
    const u=shopUserSafe();
    if(!u) return;
    const orders=Array.isArray(scopedOrders)?scopedOrders:pendingShopOrders(u);
    const seen=readSeen();

    // ครั้งแรก: จำออเดอร์ที่มีอยู่แล้ว ไม่ยิงเสียงย้อนหลัง
    if(!initialized){
      orders.forEach(o=>seen.add(String(o.id)));
      saveSeen(seen);
      initialized=true;
      return;
    }

    for(const order of orders){
      if(!seen.has(String(order.id))){
        seen.add(String(order.id));
        saveSeen(seen);
        showAlert(order);
        break;
      }
    }
  }

  function boot(){
    setTimeout(()=>{
      checkForNewOrders();
      // หน้ารับออเดอร์ตรวจสอบ/ซิงก์ทุก 1 นาที

    },1200);
  }

  window.addEventListener('qt:realtime-update',()=>{
    // Supabase Realtime เข้ามาก่อน 1 นาทีได้ทันที
    checkForNewOrders();
  });
  window.addEventListener('hashchange',()=>{
    setTimeout(checkForNewOrders,250);
  });
  window.addEventListener('storage',ev=>{
    if(ev.key==='qt_orders') setTimeout(checkForNewOrders,50);
  });

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>

window.qtSupportSelectShop=function(id){qtSupportSelectedShop=id;qtSupportRefresh()};
window.qtSupportRefresh=async function(){
  if(qtSupportLoading)return;
  const u=currentUser(),box=document.getElementById('qt-support-messages');if(!u||!box)return;
  qtSupportLoading=true;
  try{
    const token=await qtGetAccessToken();if(!token)throw new Error('กรุณาเข้าสู่ระบบอีกครั้ง');
    let rows=await qtSupabaseTable('shop_support_messages?select=id,shop_user_id,sender_user_id,body,slip_path,created_at'+(u.type==='shop'?'&shop_user_id=eq.'+encodeURIComponent(u.id):'')+'&order=created_at.asc',{accessToken:token});

    if(u.type==='admin'){

async function qgmCatalogFetch(){if(qgmCatalogFetching)return;const u=shopUser(),pid=profileId(u);if(!u||!pid)return;qgmCatalogFetching=true;try{const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');const rows=await qtSupabaseTable('products?select=*&shop_id=eq.'+encodeURIComponent(pid)+'&order=created_at.desc',{accessToken:token});if(!Array.isArray(rows))throw Error('ไม่พบข้อมูลสินค้า');const mapped=rows.map(p=>Object.assign({},p.metadata||{},{id:p.id,shopId:u.id,shopProfileId:pid,name:p.name,description:p.description,price:Number(p.price||0),image:p.image||'',category:p.category??p.metadata?.category??'',stock:Number(p.stock??p.metadata?.stock??0),variants:p.variants??p.metadata?.variants??[],available:p.available!==false,posAvailable:p.pos_available!==false,deliveryAvailable:p.delivery_available!==false,posPrice:p.pos_price,deliveryPrice:p.delivery_price}));const others=dbGet('qt_products',[]).filter(p=>String(p.shopProfileId)!==String(pid)&&String(p.shopId)!==String(u.id));QT_DB_CACHE.qt_products=others.concat(mapped);qtMarkClean('qt_products');qgmCatalogPaint()}catch(err){console.error('Catalog load:',err);const el=document.getElementById('qgm-catalog-status');if(el)el.textContent='โหลดสินค้าล่าสุดไม่สำเร็จ: '+(err.message||err)}finally{qgmCatalogFetching=false}}

window.renderShopProfileModern=function(){const u=shopUser();if(!u)return navigate('login');const cover=u.cover||u.coverImage,logo=u.logo||u.avatar,hasCover=cover&&cover!==logo;layout('ข้อมูลร้านค้า',`<div class="qgm-profile-cover ${hasCover?'has-photo':''}">${hasCover?`<img src="${esc(img(cover))}" alt="ภาพหน้าร้าน">`:''}<button class="qgm-camera" type="button" aria-label="เปลี่ยนภาพร้าน" onclick="navigate('shop-setup')">${svg('camera')}</button></div><div class="qgm-profile-name"><div class="qgm-profile-identity"><img src="${esc(img(logo))}" alt=""><div><h2>${esc(u.shopName||u.name||'ร้านค้า')}</h2><small>${esc(categoryLabel(u.category)||'ร้านค้า')}</small></div></div><span class="qgm-status" id="qgm-profile-open-state">● กำลังตรวจสอบสถานะร้าน</span></div><section class="qgm-card qgm-info"><div class="qgm-detail-row">${svg('box')}<span>${esc(categoryLabel(u.category)||'ร้านค้า')}</span></div><div class="qgm-detail-row">${svg('phone')}<span>${esc(u.phone||'-')}</span></div><div class="qgm-detail-row">${svg('pin')}<span>${esc(u.address||'-')}</span></div><div class="qgm-detail-row">${svg('clock')}<span>เปิดบริการ ${esc(u.openTime||'06:00')} - ${esc(u.closeTime||'22:00')} น.</span></div></section><button class="qgm-outline" type="button" onclick="navigate('shop-setup')">แก้ไขข้อมูลร้าน</button><button class="qgm-primary" type="button" onclick="navigate('shop-products')">จัดการเมนูสินค้า</button><button class="qgm-logout" type="button" onclick="qtMerchantLogout()">ออกจากระบบ</button>`,'shop-profile',{back:true})

function route(){const hash=location.hash.replace('#','')||'dashboard',[page,param]=hash.split('/'),u=currentUser();if(qtSessionRead()?.role==='admin'||u?.type==='admin'){qgPosDisconnect();clearSession();renderShopLogin();const note=document.getElementById('qgm-login-role-error');if(note){note.textContent='บัญชีนี้เป็นบัญชีแอดมิน ไม่มีสิทธิ์เข้าหน้าร้านค้า กรุณาใช้บัญชีร้านค้า';note.hidden=false}return}if(page==='pos'||page==='pos-staff-join')return qgPosRoute();if(qtSessionRead()?.role==='pos_staff'){location.hash='#pos';return}qgPosDisconnect();if(page==='login'||!u){if(page==='shop-register'&&typeof renderShopRegister==='function')return renderShopRegister();return renderShopLogin()}if(u.type!=='shop'){clearSession();return renderShopLogin()}if(u.status!=='approved'&&!['shop-setup','approval-pending'].includes(page)&&typeof renderShopPending==='function')return renderShopPending();switch(page){case'approval-pending':return renderShopPending();case'home':case'dashboard':return renderShopDashboardModern(u);case'market-stock':return qgMarketReload();case'shop-laundry':return typeof qgRenderLaundryMerchant==='function'?qgRenderLaundryMerchant():toast('โมดูลฝากซักยังโหลดไม่เสร็จ กรุณาลองใหม่');case'shop-orders':return renderShopOrdersModern();case'shop-order':return renderShopOrderModern(param);case'shop-products':return renderShopProductsModern();case'shop-catalog':return renderShopCatalog();case'shop-product':return renderShopProductEditor(param||'new');case'shop-promote':return renderShopPromote();case'shop-promote-create':return renderShopPromoteCreate();case'shop-profile':return renderShopProfileModern();case'shop-setup':return renderShopSetup();case'shop-settlement':return renderShopSettlement();case'shop-revenue':return qgmRenderRevenue();case'shop-hours':return qgmRenderHours();case'shop-modules':return renderShopModules();case'shop-media':return renderMerchantMedia();case'shop-support':return renderShopSupport();case'notifications':return renderNotifications();default:return renderShopDashboardModern(u)}}

window.qtShopRoute=route;

<script id="qg-shop-settings-route-fix-v17">
window.renderShopModules=async function(){
  const user=currentUser();
  if(!user||user.type!=='shop'){navigate('login');return;}
  if(typeof window.qtShopLayout!=='function'){toast('ไม่สามารถเปิดหน้าตั้งค่าได้');return;}
  window.qtShopLayout('ตั้งค่า',
    '<div class="qgm-page-title-row">'+
      '<button type="button" class="qgm-iconbtn" aria-label="กลับ" onclick="navigate(\'dashboard\')">←</button>'+
      '<div><h2 style="margin:0">ตั้งค่าร้านค้า</h2><small style="color:#8b9098">จัดการโมดูลและทางลัดการตั้งค่าร้าน</small></div>'+
    '</div>'+
    '<section class="qgm-card qgm-settings-links">'+
      '<button type="button" class="qgm-settings-link" onclick="navigate(\'shop-setup\')"><span>ข้อมูลและตำแหน่งร้าน</span><b>›</b></button>'+
      '<button type="button" class="qgm-settings-link" onclick="navigate(\'shop-hours\')"><span>เวลาทำการและวันหยุด</span><b>›</b></button>'+
      '<button type="button" class="qgm-settings-link" onclick="navigate(\'shop-laundry\')"><span>ฝากซัก · บริการ ราคา และ Rider</span><b>›</b></button>'+
    '</section>'+
    '<div class="qgm-section-heading"><h2>โมดูลร้านค้า</h2></div>'+
    '<section id="qt-shop-modules-list" class="qgm-settings-modules"><div class="qgm-card" style="padding:16px">กำลังโหลดข้อมูล...</div></section>',
    'shop-profile'
  );
  try{
    const rows=await qtLoadShopModules(user.id);
    if(!currentUser()||String(currentUser().id)!==String(user.id)||location.hash.replace('#','')!=='shop-modules')return;
    const byKey=new Map((rows||[]).map(r=>[r.module_key,r]));
    const list=document.getElementById('qt-shop-modules-list');
    if(!list)return;
    list.innerHTML=QT_SHOP_MODULE_CATALOG.map(m=>{
      const r=byKey.get(m.key),status=r?.status||'disabled';
      const label=status==='enabled'?'เปิดใช้งาน':status==='trial'?'ทดลองใช้':'ปิดใช้งาน';
      const nextLabel=status==='enabled'?'ปิดใช้งาน':status==='trial'?'เปิดใช้งานเต็มรูปแบบ':'เปิดใช้งาน';
      return '<div class="qgm-card qgm-setting-module"><div><b>'+escapeHtml(m.label)+'</b><small>'+escapeHtml(label)+'</small></div><button type="button" class="qgm-outline" onclick="cycleModule(\''+m.key+'\')">'+escapeHtml(nextLabel)+'</button></div>';
    }).join('');
  }catch(err){
    console.error('shop settings load failed',err);
    const list=document.getElementById('qt-shop-modules-list');
    if(list)list.innerHTML='<div class="qgm-card" style="padding:16px">โหลดการตั้งค่าไม่สำเร็จ กรุณาลองใหม่</div>';
    toast('โหลดการตั้งค่าไม่สำเร็จ: '+String(err?.message||err).slice(0,100));
  }
};
</script>

/* QueueGo v09 approved merchant screen system */
body.qgm-app{background:#f8f9fb}
.qgm-shell{max-width:620px;margin:0 auto;overflow-x:clip}
.qgm-top{background:#fff!important;color:#17191d!important;border-bottom:1px solid #eef0f2;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;min-height:58px}
.qgm-brand{display:flex;align-items:center;gap:6px;font-size:21px;font-weight:800;color:#17191d}
.qgm-brand-mark{width:30px;height:30px;color:#e7092b;display:block}.qgm-brand-mark svg{width:100%;height:100%}.qgm-wordmark span{color:#e7092b}
.qgm-title{font-size:19px}.qgm-header-spacer{width:40px;flex:none}
.qgm-content{min-width:0;padding:14px 16px calc(var(--qg-nav-h) + env(safe-area-inset-bottom) + 26px)}
.qgm-bottom{width:min(100%,620px);left:50%;right:auto;transform:translateX(-50%);height:calc(72px + env(safe-area-inset-bottom));padding:6px 7px env(safe-area-inset-bottom);gap:0}
.qgm-bottom button{min-width:0;min-height:50px;font-size:10px;gap:2px;color:#8f97a2;border-radius:12px}
.qgm-bottom .qgm-tab-icon{width:42px;height:34px;border-radius:12px;display:grid;place-items:center}
.qgm-bottom svg{width:23px;height:23px;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.qgm-bottom button.active{color:#e7092b}.qgm-bottom button.active .qgm-tab-icon{background:#ffedf0}.qgm-bottom button.active svg{stroke-width:2.1}
.qgm-section-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 1px 10px}.qgm-section-heading h2{font-size:17px;margin:0;letter-spacing:-.2px}.qgm-section-heading small{color:#8b929c;font-size:11px}.qgm-section-heading button{border:0;background:transparent;color:#e7092b;font-size:12px;font-weight:700}
.qgm-home-store{border-radius:18px;overflow:hidden;background:#fff;border:1px solid #eceef1}.qgm-store-identity{display:flex;align-items:center;gap:11px;padding:11px}.qgm-store-identity .qgm-avatar{width:48px;height:48px;flex:none}.qgm-store-identity div{min-width:0;flex:1}.qgm-store-identity b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qgm-store-identity small{font-size:11px}.qgm-store-identity button{border:0;background:transparent;color:#8b929c;transform:rotate(180deg)}
.qgm-home-cover,.qgm-profile-cover{background:#2e231e var(--qgm-photo) center 42%/cover no-repeat;position:relative;overflow:hidden}
.qgm-home-cover{height:160px;margin:0 10px 10px;border-radius:13px}.qgm-home-cover:after{content:'';position:absolute;inset:30% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55))}.qgm-home-cover>img,.qgm-profile-cover>img{width:100%;height:100%;object-fit:cover}.qgm-home-cover>div{position:absolute;left:14px;right:14px;bottom:14px;z-index:1;color:#fff}.qgm-home-cover b{font-size:18px;display:block}.qgm-home-cover small{font-size:11px}
.qgm-stats{gap:9px}.qgm-stat{min-height:87px;flex-direction:column;align-items:flex-start;justify-content:center;padding:11px;gap:5px}.qgm-stat .qgm-stat-icon{width:30px;height:30px;border-radius:9px}.qgm-stat .qgm-stat-icon svg{width:17px;height:17px}.qgm-stat b{font-size:20px;line-height:1}.qgm-stat small{font-size:10px;display:block;margin-top:3px}
.qgm-recent-row{width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:9px 10px;margin-bottom:7px;border-radius:13px}.qgm-recent-row>span:nth-child(2){min-width:0;flex:1}.qgm-recent-row b{display:block;font-size:12px}.qgm-recent-row small{display:block;font-size:10px;color:#8b929c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qgm-recent-row strong{color:#e7092b;font-size:12px}.qgm-recent-symbol{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#fff0f3;color:#e7092b}.qgm-recent-symbol svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.qgm-recent-empty{padding:18px;text-align:center;color:#8b929c}
.qgm-menu-grid{gap:9px}.qgm-menu{min-width:0;overflow:hidden;padding:13px 5px 11px;min-height:85px}.qgm-menu .ico{width:36px;height:36px}.qgm-menu span:last-child{white-space:normal;line-height:1.25;font-size:10px}
.qgm-tabs{max-width:100%;margin:3px 0 13px}.qgm-tabs button{font-size:11px;padding:9px 12px}
.qgm-search{min-width:0;width:100%;margin-bottom:14px}.qgm-search input{min-width:0;flex:1}
.qgm-order{width:100%;min-width:0;max-width:100%;box-sizing:border-box;display:grid;grid-template-columns:56px minmax(0,1fr) auto;text-align:left;padding:10px;gap:9px;border-radius:16px}.qgm-order img,.qgm-order-thumb{width:56px;height:56px;border-radius:11px}.qgm-order-thumb{display:grid;place-items:center;background:#fff0f3;color:#e7092b}.qgm-order-thumb svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.7;fill:none}.qgm-order-main b{color:#191c21;font-size:13px}.qgm-order-side{min-width:60px}.qgm-order-side small{font-size:9px}.qgm-status{white-space:nowrap}
.qgm-product{width:100%;min-width:0;grid-template-columns:62px minmax(0,1fr) auto}.qgm-product b{font-size:13px}.qgm-product strong{color:#e7092b}
.qgm-profile-cover{height:160px;border-radius:17px}.qgm-profile-name{align-items:center;gap:8px}.qgm-profile-identity{display:flex;align-items:center;gap:10px;min-width:0}.qgm-profile-identity img{width:42px;height:42px;object-fit:cover;border-radius:12px;background:#fff}.qgm-profile-identity h2{font-size:15px;margin:0}.qgm-profile-identity small{font-size:10px;color:#8b929c}.qgm-profile-name .qgm-status{font-size:10px;flex:none}
.qgm-logout{display:block;width:100%;min-height:48px;margin:22px 0 8px;border:1px solid #eed1d7;border-radius:12px;background:#fff;color:#d10a2a;font-weight:750}
@media(max-width:360px){.qgm-content{padding-left:12px;padding-right:12px}.qgm-order{grid-template-columns:48px minmax(0,1fr) auto;gap:7px}.qgm-order img,.qgm-order-thumb{width:48px;height:48px}.qgm-order-side{min-width:55px}.qgm-menu span:last-child{font-size:9px}}

<script id="qg-v10-media">
const QT_MEDIA_BUCKET='merchant-media';
async function qtPrepareMerchantImage(file){
  if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw new Error('รองรับ JPG, PNG หรือ WebP เท่านั้น');
  if(file.size>12*1024*1024)throw new Error('รูปต้นฉบับต้องไม่เกิน 12 MB');
  const objectUrl=URL.createObjectURL(file);
  try{
    const image=new Image();image.src=objectUrl;await image.decode();
    const scale=Math.min(1,1600/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',.82));
    if(!blob||blob.type!=='image/webp')blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.8));
    if(!blob||blob.size>3145728)throw new Error('รูปหลังปรับขนาดยังใหญ่เกิน 3 MB');
    return blob;
  }finally{URL.revokeObjectURL(objectUrl)}
}
async function qtUploadMerchantImage(file,kind){
  const session=qtSessionRead(),token=await qtGetAccessToken();
  if(!session?.authUserId||!token)throw new Error('กรุณาเข้าสู่ระบบใหม่');
  const blob=await qtPrepareMerchantImage(file),extension=blob.type==='image/webp'?'webp':'jpg';
  const path=session.authUserId+'/'+String(kind||'image').replace(/[^a-z0-9-]/gi,'')+'-'+uid()+'.'+extension;
  const response=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/'+QT_MEDIA_BUCKET+'/'+path,{
    method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token,'Content-Type':blob.type,'cache-control':'3600'},body:blob
  });
  if(!response.ok){const err=await response.json().catch(()=>({}));throw new Error(err.message||err.error||'Storage HTTP '+response.status)}
  return QT_SUPABASE_CONFIG.URL+'/storage/v1/object/public/'+QT_MEDIA_BUCKET+'/'+path;
}
window.qgmPreviewUpload=function(input,target){const file=input.files?.[0],preview=document.getElementById(target);if(!file||!preview)return;const url=URL.createObjectURL(file);preview.src=url;preview.onload=()=>URL.revokeObjectURL(url)};
window.renderMerchantMedia=async function(){
  const u=currentUser();if(!u||u.type!=='shop')return navigate('login');
  qtShopLayout('คลังรูปภาพ',`<section class="qgm-media-head"><span class="qgm-media-hero">${qgmMediaIcon()}</span><div><h2>คลังรูปภาพร้าน</h2><p>รูปหน้าร้าน โลโก้ และรูปสินค้า</p></div></section><label class="qgm-upload-action qgm-media-pick">${qgmMediaIcon()} เพิ่มรูปจากเครื่อง<input type="file" accept="image/jpeg,image/png,image/webp" onchange="qgmAddMedia(this)"></label><div id="qgm-media-grid" class="qgm-media-grid"><p>กำลังโหลดรูป...</p></div>`,'shop-profile');
  try{const s=qtSessionRead(),token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
    const response=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/list/'+QT_MEDIA_BUCKET,{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({prefix:s.authUserId+'/',limit:100,offset:0,sortBy:{column:'created_at',order:'desc'}})});
    const rows=await response.json();if(!response.ok)throw Error(rows.message||'โหลดคลังรูปไม่สำเร็จ');
    const grid=document.getElementById('qgm-media-grid');if(!grid)return;
    grid.innerHTML=rows.length?rows.filter(x=>x.name&&!x.name.startsWith('.')).map(x=>{const url=QT_SUPABASE_CONFIG.URL+'/storage/v1/object/public/'+QT_MEDIA_BUCKET+'/'+s.authUserId+'/'+encodeURIComponent(x.name);return `<button class="qgm-media-item" type="button" onclick="qgmCopyMedia('${url}')"><img src="${url}" loading="lazy" alt="รูปที่อัปโหลด"><small>${escapeHtml(x.name.split('-')[0])}</small></button>`}).join(''):'<div class="qgm-media-empty">ยังไม่มีรูปในคลัง</div>';
  }catch(e){const grid=document.getElementById('qgm-media-grid');if(grid)grid.textContent='โหลดคลังรูปไม่สำเร็จ: '+(e.message||e)}
};
function qgmMediaIcon(){return '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8" cy="9" r="1.5"/><path d="m5 17 5-5 3 3 2-2 4 4"/></svg>'}
window.qgmAddMedia=async function(input){const file=input.files?.[0];if(!file)return;input.disabled=true;try{await qtUploadMerchantImage(file,'gallery');toast('เก็บรูปในคลังแล้ว');renderMerchantMedia()}catch(e){toast('อัปโหลดไม่สำเร็จ: '+(e.message||e))}finally{input.disabled=false}};

window.renderShopSetup=function(){
  window.qgmShopLocation=null;
  const u=currentUser();if(!u||u.type!=='shop')return navigate('login');
  qtShopLayout('แก้ไขข้อมูลร้าน',`<form id="qgm-shop-form" class="qgm-card qgm-form-card" onsubmit="return qgmSaveShopSetup(event)"><div class="qgm-field"><label>ชื่อร้าน</label><input id="qgs-name" required value="${escapeHtml(u.shopName||'')}"></div><div class="qgm-field"><label>ชื่อผู้ติดต่อ</label><input id="qgs-contact" required value="${escapeHtml(u.name||'')}"></div><div class="qgm-field"><label>เบอร์โทรศัพท์</label><input id="qgs-phone" value="${escapeHtml(u.phone||'')}"></div><div class="qgm-field"><label>หมวดหมู่</label><select id="qgs-category">${[['food','ร้านอาหาร'],['grocery','ของชำ/สะดวกซื้อ'],['cafe','คาเฟ่/เครื่องดื่ม'],['other','อื่นๆ'],['market','ตลาดสด'],['meat','เนื้อสัตว์'],['fish','ปลา/อาหารทะเล'],['vegetable','ผัก'],['fruit','ผลไม้']].map(([k,v])=>`<option value="${k}" ${u.category===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="qgm-field"><label>ที่อยู่ร้าน</label><textarea id="qgs-address" rows="2">${escapeHtml(u.address||'')}</textarea></div><section class="qgm-location"><b>ปักพิกัดร้าน</b><p>เลื่อนแผนที่ให้หมุดอยู่ตรงหน้าร้าน แล้วกดบันทึก</p><div id="qgs-map" class="map-box"></div><button type="button" class="qgm-outline" onclick="qgmLocateShop()">ใช้ตำแหน่ง GPS ปัจจุบัน</button><small id="qgs-coordinates"></small></section><div class="qgm-inline"><div class="qgm-field"><label>เปิด</label><input id="qgs-open" type="time" value="${escapeHtml(u.openTime||'06:00')}"></div><div class="qgm-field"><label>ปิด</label><input id="qgs-close" type="time" value="${escapeHtml(u.closeTime||'22:00')}"></div></div><div class="qgm-field"><label>รายละเอียด</label><textarea id="qgs-desc" rows="2">${escapeHtml(u.description||'')}</textarea></div><div class="qgm-image-fields"><label class="qgm-field"><span>โลโก้ร้าน</span><img id="qgs-logo-preview" src="${escapeHtml(qtShopImageSrc(u.logo||''))}" alt="ตัวอย่างโลโก้"><span class="qgm-upload-action">${qgmMediaIcon()} เลือกรูป<input id="qgs-logo" type="file" accept="image/jpeg,image/png,image/webp" onchange="qgmPreviewUpload(this,'qgs-logo-preview')"></span></label><label class="qgm-field"><span>ภาพหน้าร้าน</span><img id="qgs-cover-preview" src="${escapeHtml(qtShopImageSrc(u.cover||''))}" alt="ตัวอย่างภาพหน้าร้าน"><span class="qgm-upload-action">${qgmMediaIcon()} เลือกรูป<input id="qgs-cover" type="file" accept="image/jpeg,image/png,image/webp" onchange="qgmPreviewUpload(this,'qgs-cover-preview')"></span></label></div><button class="qgm-primary" type="submit">บันทึกข้อมูลร้าน</button></form>`,'shop-profile');
 const mapHost=document.getElementById('qgs-map');
 setTimeout(()=>{
  if(!mapHost?.isConnected)return;
  try{
   const latitude=Number(u.lat),longitude=Number(u.lng),valid=qgIsValidShopCoordinate(latitude,longitude);
   let initial=true;
   const picked=initLocationPicker('qgs-map',valid?latitude:null,valid?longitude:null,(lat,lng)=>{
    const line=document.getElementById('qgs-coordinates');
    if(initial){
      initial=false;
      if(line)line.textContent=valid?'พิกัดปัจจุบัน: '+lat.toFixed(6)+', '+lng.toFixed(6):'ยังไม่ได้ปักพิกัดร้าน';
      return;
    }
    window.qgmShopLocation={lat,lng};
    if(line)line.textContent='พิกัดใหม่: '+lat.toFixed(6)+', '+lng.toFixed(6);
   });
   window.__currentPicker=picked;
  }catch(err){
   const map=document.getElementById('qgs-map');if(map)map.textContent='แผนที่โหลดไม่สำเร็จ กรุณากดใช้ตำแหน่ง GPS ปัจจุบัน';
  }
 },50);
};
window.qgmLocateShop=function(){
 if(window.__currentPicker?.map)return window.__currentPicker.locate();
 if(!navigator.geolocation)return toast('เบราว์เซอร์ไม่รองรับ GPS');
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude,lng=pos.coords.longitude;if(!qgIsValidShopCoordinate(lat,lng)){toast('พิกัด GPS ไม่ถูกต้อง กรุณาตรวจสอบและลองใหม่');return;}window.qgmShopLocation={lat,lng};
  const line=document.getElementById('qgs-coordinates');if(line)line.textContent='พิกัด: '+lat.toFixed(6)+', '+lng.toFixed(6);
  toast('ใช้ตำแหน่ง GPS ปัจจุบันแล้ว');
 },err=>toast('ไม่สามารถขอตำแหน่ง GPS ได้: '+err.message),{enableHighAccuracy:true,timeout:15000});
};
window.qgmSaveShopSetup=async function(e){e.preventDefault();const button=e.submitter,u=currentUser();if(!u)return false;if(button)button.disabled=true;
 try{const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
 const next={...u,shopName:document.getElementById('qgs-name').value.trim(),name:document.getElementById('qgs-contact').value.trim(),phone:document.getElementById('qgs-phone').value.trim(),category:document.getElementById('qgs-category').value,address:document.getElementById('qgs-address').value.trim(),openTime:document.getElementById('qgs-open').value,closeTime:document.getElementById('qgs-close').value,description:document.getElementById('qgs-desc').value.trim()};
 const logo=document.getElementById('qgs-logo').files[0],cover=document.getElementById('qgs-cover').files[0];if(logo)next.logo=await qtUploadMerchantImage(logo,'logo');if(cover)next.cover=await qtUploadMerchantImage(cover,'cover');
 const profile=await qtSupabaseTable('shop_profiles?select=id&user_id=eq.'+encodeURIComponent(u.id)+'&limit=1',{accessToken:token});
 const selected=window.qgmShopLocation;
 if(selected){
  if(!qgIsValidShopCoordinate(selected.lat,selected.lng)){const why=qgShopCoordinateProblem(selected.lat,selected.lng);throw Error(why==='swapped'?'พิกัดร้านไม่ถูกต้อง: latitude/longitude อาจสลับกัน':'พิกัดร้านไม่ถูกต้อง กรุณาปักตำแหน่งร้านใหม่');}
  next.lat=selected.lat;next.lng=selected.lng;
 }
  const body={shop_name:next.shopName,phone:next.phone,address:next.address,public_category:next.category,metadata:qtUserMetadata(next)};
 if(selected){body.latitude=next.lat;body.longitude=next.lng;}
 const savedProfile=profile?.[0]?.id?await qtSupabaseTable('shop_profiles?id=eq.'+encodeURIComponent(profile[0].id),{method:'PATCH',accessToken:token,body}):await qtSupabaseTable('shop_profiles',{method:'POST',accessToken:token,body:{...body,user_id:u.id,status:'pending'}});
 if(!Array.isArray(savedProfile)||!savedProfile.length)throw Error('ฐานข้อมูลไม่ยืนยันข้อมูลร้าน');
 const savedUser=await qtSupabaseTable('users?id=eq.'+encodeURIComponent(u.id),{method:'PATCH',accessToken:token,body:{name:next.name,phone:next.phone,metadata:qtUserMetadata(next)}});
 if(!Array.isArray(savedUser)||!savedUser.length)throw Error('ฐานข้อมูลไม่ยืนยันข้อมูลผู้ใช้');
 Object.assign(u,next);qtMarkClean('qt_users');toast('บันทึกข้อมูลร้านแล้ว');navigate('shop-profile');
 }catch(err){console.error(err);toast('บันทึกไม่สำเร็จ: '+(err.message||err))}finally{if(button)button.disabled=false}return false;
};
</script>

<script id="qgm-cash-gp-v13">
(function(){


async function qgmGetShopPid(u,token){
 let pid=qtCurrentShopProfileId(u);if(pid)return pid;
 const rows=await qtSupabaseTable('shop_profiles?select=id&user_id=eq.'+encodeURIComponent(u.id)+'&limit=1',{accessToken:token});
 pid=rows?.[0]?.id||null;if(pid)u.shopProfileId=pid;return pid;
}
window.qgmGetShopPid=qgmGetShopPid;
window.qgmLoadShopOpen=qgmLoadShopOpen;
async function qgmLoadShopOpen(){
 const u=currentUser(),toggle=document.getElementById('qgm-shop-open-toggle'),label=document.getElementById('qgm-shop-open-label');
 if(!u||!toggle)return;
 try{
  const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
  const pid=await qgmGetShopPid(u,token);if(!pid)throw Error('ไม่พบข้อมูลร้าน');
  const [rows,flags]=await Promise.all([qtSupabaseTable('shop_open_states?select=is_open,resume_at&shop_id=eq.'+encodeURIComponent(pid),{accessToken:token}),qtSupabaseTable('shop_profiles?select=delivery_enabled&id=eq.'+encodeURIComponent(pid),{accessToken:token})]);
  toggle.checked=flags[0]?.delivery_enabled===true && (rows.length?(rows[0].is_open!==false||Boolean(rows[0].resume_at&&new Date(rows[0].resume_at).getTime()<=Date.now())):true);
  label.textContent=toggle.checked?'● เปิดร้านอยู่':'● ปิดร้านอยู่';
  label.style.color=toggle.checked?'#17a779':'#8b929c';
 }catch(e){toggle.disabled=true;label.textContent='ตรวจสอบสถานะร้านไม่ได้';}
}
window.qgmSetShopOpen=async function(toggle){
 const u=currentUser(),label=document.getElementById('qgm-shop-open-label'),desired=toggle.checked;
 toggle.disabled=true;
 try{
  const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบอีกครั้ง');
  const pid=await qgmGetShopPid(u,token);if(!pid)throw Error('ไม่พบข้อมูลร้าน');
  const flags=desired?await qtSupabaseTable('shop_profiles?select=delivery_enabled&id=eq.'+encodeURIComponent(pid),{accessToken:token}):[];
  if(desired&&flags[0]?.delivery_enabled===false)await qtSupabaseTable('rpc/pos_enable_delivery',{method:'POST',accessToken:token,body:{}});
  else await qtSupabaseTable('shop_open_states?on_conflict=shop_id',{method:'POST',accessToken:token,body:{shop_id:pid,is_open:desired,resume_at:null,updated_at:new Date().toISOString()}});
  label.textContent=desired?'● เปิดร้านอยู่':'● ปิดร้านอยู่';label.style.color=desired?'#17a779':'#8b929c';
 }catch(e){toggle.checked=!desired;toast('เปลี่ยนสถานะร้านไม่สำเร็จ: '+(e.message||e))}
 finally{toggle.disabled=false}
};
// Read the exact daily GP from orders. A settlement is written only when the slip is submitted.
window.qgmSubmitGpSlip=async function(date,input){
 const file=input.files?.[0],u=currentUser();if(!file||!u)return;
 if(file.size>5242880){toast('สลิปต้องไม่เกิน 5 MB');input.value='';return}
 const types={'image/png':'png','image/jpeg':'jpg','image/webp':'webp','application/pdf':'pdf'};
 if(!types[file.type]){toast('รองรับ JPG, PNG, WebP หรือ PDF');input.value='';return}
 input.disabled=true;
 try{
  const token=await qtGetAccessToken(),session=qtSessionRead();if(!token||!session?.authUserId)throw Error('กรุณาเข้าสู่ระบบอีกครั้ง');
  const path=session.authUserId+'/'+date.replace(/[^0-9-]/g,'')+'-'+crypto.randomUUID()+'.'+types[file.type];
  const response=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/gp-slips/'+path,{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token,'Content-Type':file.type},body:file});
  if(!response.ok){const err=await response.json().catch(()=>({}));throw Error(err.message||'อัปโหลดสลิปไม่สำเร็จ')}
  await qtSupabaseTable('rpc/report_shop_gp',{method:'POST',accessToken:token,body:{p_date:date,p_slip_path:path}});
  await qtHydrateDatabase({light:false});toast('ส่งสลิปและแจ้งโอนให้แอดมินแล้ว');
  if(location.hash==='#shop-revenue'&&typeof qgmLoadRevenue==='function')qgmLoadRevenue(date);else window.renderShopSettlement();
 }catch(e){toast('แจ้งโอนไม่สำเร็จ: '+(e.message||e))}
 finally{input.disabled=false;input.value=''}
};
window.qgmOpenGpSlip=async function(event,link){
 event.preventDefault();
 try{
  const token=await qtGetAccessToken(),path=link.dataset.gpSlip;
  const res=await fetch(QT_SUPABASE_CONFIG.URL+'/storage/v1/object/sign/gp-slips/'+path,{method:'POST',headers:{apikey:QT_SUPABASE_CONFIG.KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});
  const data=await res.json();if(!res.ok||!data.signedURL)throw Error(data.message||'เปิดสลิปไม่สำเร็จ');
  window.open(QT_SUPABASE_CONFIG.URL+'/storage/v1'+data.signedURL,'_blank','noopener');
 }catch(e){toast(e.message||'เปิดสลิปไม่สำเร็จ')}
};
})();
</script>

<script id="qgm-v15-business">
(function(){


window.qgmPauseShop=async function(minutes){
 const u=currentUser();if(!u)return;
 if(![30,60,1440].includes(minutes))return;
 try{
  const token=await qtGetAccessToken();if(!token)throw Error('กรุณาเข้าสู่ระบบใหม่');
  const pid=await qgmGetShopPid(u,token);if(!pid)throw Error('ไม่พบข้อมูลร้าน');
  await qtSupabaseTable('shop_open_states?on_conflict=shop_id',{method:'POST',accessToken:token,body:{shop_id:pid,is_open:false,resume_at:new Date(Date.now()+minutes*60000).toISOString(),updated_at:new Date().toISOString()}});
  toast('พักรับออเดอร์แล้ว');renderShopDashboardModern(u);
 }catch(e){toast('พักร้านไม่สำเร็จ: '+(e.message||e))}
};


window.qgmRenderRevenue=async function(){
 const u=currentUser();if(!u||u.type!=='shop')return navigate('login');
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 qtShopLayout('รายได้ทั้งหมด',`<div class="qt-shop-page-title"><button class="qt-shop-back" onclick="navigate('dashboard')">←</button><h2>รายได้ทั้งหมด</h2></div>
 <p class="qgm-report-status">เงินสดค่าสินค้า: ไรเดอร์จ่ายร้านตอนรับสินค้า แล้วเก็บจากลูกค้าเอง · GP คือค่าบริการร้าน</p>
 <section class="qgm-report"><label for="qgm-revenue-date"><b>เลือกวันที่</b></label><input id="qgm-revenue-date" class="qgm-report-date" type="date" max="${today}" value="${today}" onchange="qgmLoadRevenue(this.value)">
