<script id="qg-v22-ticket-client">
(function(){
 const rider=typeof S!=='undefined'&&typeof sbTable==='function';

 const token=()=>rider?getAccessToken():qtGetAccessToken();
 const request=async(path,method='GET',body=null)=>{const t=await token();if(!t)throw Error('กรุณาเข้าสู่ระบบ');return rider?sbTable(path,{method,token:t,body}):qtSupabaseTable(path,{method,accessToken:t,body})};
 const config=()=>rider?{url:SB.URL,key:SB.KEY}:{url:QT_SUPABASE_CONFIG.URL,key:QT_SUPABASE_CONFIG.KEY};
 const authSub=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub}catch(e){return null}};
 const names={missing_item:'สินค้าไม่ครบ',wrong_item:'สินค้าไม่ตรง',damaged_food:'อาหารเสียหาย',rider:'ปัญหาไรเดอร์',merchant:'ปัญหาร้านค้า',payment:'การชำระเงิน',cash:'เงินสด',gp:'GP',other:'อื่น ๆ'};
 async function upload(file){if(!file)return null;
   if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('หลักฐานต้องเป็น JPG, PNG หรือ WebP ขนาดไม่เกิน 5 MB');
   const t=await token(),uid=authSub(t),c=config();if(!uid)throw Error('เซสชันไม่ถูกต้อง');
   const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type],path=uid+'/'+crypto.randomUUID()+'.'+ext;
   const response=await fetch(c.url+'/storage/v1/object/qg-evidence/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':file.type,'x-upsert':'false'},body:file});
   if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.message||'อัปโหลดหลักฐานไม่สำเร็จ')}
   return path;
 }
 window.qgOpenEvidence=async function(path){try{const t=await token(),c=config();const response=await fetch(c.url+'/storage/v1/object/sign/qg-evidence/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({expiresIn:300})});const data=await response.json();if(!response.ok)throw Error(data.message||'เปิดหลักฐานไม่สำเร็จ');window.open(c.url+'/storage/v1'+data.signedURL,'_blank','noopener')}catch(e){alert(e.message)}};
 window.qgOpenTicketPanel=function(orderId=''){
   if(!(rider?S.user:currentUser())){if(!rider)navigate('login');else alert('กรุณาเข้าสู่ระบบ');return}

   panel.innerHTML='<div class="qg-v22-dialog"><header><b>ติดต่อฝ่ายดูแล</b><button type="button" id="qg-ticket-close" aria-label="ปิด">✕</button></header><p>แจ้งปัญหาและติดตามสถานะจากระบบ</p><form id="qg-ticket-form"><label>ออเดอร์ที่เกี่ยวข้อง (ถ้ามี)<select name="order"><option value="">ไม่ระบุออเดอร์</option></select></label><label>ประเภทปัญหา<select name="category"></select></label><label>รายละเอียด<textarea name="details" minlength="10" maxlength="2000" required placeholder="อธิบายปัญหาอย่างน้อย 10 ตัวอักษร"></textarea></label><label>รูปหลักฐาน (ถ้ามี)<input name="evidence" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="submit">ส่งเรื่อง</button></form><h3>เรื่องที่แจ้งไว้</h3><div id="qg-ticket-list">กำลังโหลด...</div></div>';
   document.body.appendChild(panel);panel.querySelector('#qg-ticket-close').onclick=()=>panel.remove();panel.onclick=e=>{if(e.target===panel)panel.remove()};
   panel.querySelector('[name=category]').innerHTML=Object.entries(names).map(([key,label])=>'<option value="'+key+'">'+label+'</option>').join('');
   request('orders?select=id,order_number&order_type=eq.shopping&order=created_at.desc&limit=50').then(rows=>{if(!panel.isConnected)return;const select=panel.querySelector('[name=order]');select.insertAdjacentHTML('beforeend',(rows||[]).map(o=>'<option value="'+escText(o.id)+'">'+escText(displayOrderNumber(o))+'</option>').join(''));if(orderId)select.value=orderId}).catch(e=>{panel.querySelector('#qg-ticket-list').textContent='โหลดออเดอร์ไม่สำเร็จ: '+e.message});
   qgLoadTickets();
   panel.querySelector('#qg-ticket-form').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button[type=submit]');button.disabled=true;try{const path=await upload(form.evidence.files[0]),details=form.details.value.trim();await request('rpc/qg_create_ticket','POST',{p_ticket_id:crypto.randomUUID(),p_order_id:form.order.value||null,p_category:form.category.value,p_details:details,p_evidence_path:path});form.reset();await qgLoadTickets();alert('ส่งเรื่องให้ฝ่ายดูแลแล้ว')}catch(err){alert('ส่งเรื่องไม่สำเร็จ: '+err.message)}finally{button.disabled=false}};
 };
 window.qgLoadTickets=async function(){const box=document.getElementById('qg-ticket-list');if(!box)return;try{const rows=await request('qg_support_tickets?select=id,category,details,status,order_id,created_at,admin_note,evidence_path&order=created_at.desc&limit=50');if(!box.isConnected)return;box.innerHTML=rows?.length?rows.map(t=>'<article><b>'+escText(names[t.category]||t.category)+'</b><span>'+escText(t.status)+'</span><p>'+escText(t.details)+'</p><small>'+new Date(t.created_at).toLocaleString('th-TH')+(t.admin_note?' · ฝ่ายดูแล: '+escText(t.admin_note):'')+'</small>'+(t.evidence_path?'<button type="button" data-path="'+escText(t.evidence_path)+'" onclick="qgOpenEvidence(this.dataset.path)">ดูหลักฐาน</button>':'')+'</article>').join(''):'ยังไม่มีเรื่องที่แจ้ง'}catch(e){box.textContent='โหลดเรื่องที่แจ้งไม่สำเร็จ: '+e.message}};
})();

<script id="qg-v22-merchant-operations">
(function(){




 const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const cash=n=>'฿'+Number(n||0).toLocaleString('th-TH');
 window.qgOpenKitchen=function(){const u=shopUser();if(!qgmKitchenEnabledFor(u)){toast('โหมดครัวใช้สำหรับร้านอาหารและร้านเครื่องดื่ม/คาเฟ่เท่านั้น');return}document.getElementById('qg-v22-kitchen')?.remove();const box=document.createElement('section');box.id='qg-v22-kitchen';box.className='qg-v22-overlay';box.innerHTML='<div class="qg-v22-dialog"><header><b>โหมดครัว</b><button type="button" onclick="document.getElementById(\'qg-v22-kitchen\').remove()">✕</button></header><p>ออเดอร์ปัจจุบันจากฐานข้อมูล</p><button type="button" onclick="qgLoadKitchen()">↻ รีเฟรช</button><div id="qg-v22-kitchen-list">กำลังโหลด...</div></div>';document.body.appendChild(box);qgLoadKitchen()};
 window.qgLoadKitchen=async function(){const el=document.getElementById('qg-v22-kitchen-list');if(!el)return;try{const token=await qtGetAccessToken(),rows=await qtSupabaseTable('rpc/get_my_shop_orders',{method:'POST',accessToken:token,body:{}});if(!el.isConnected)return;const status={pending:'NEW',accepted:'ACCEPTED',searching_rider:'SEARCHING RIDER',rider_assigned:'RIDER ASSIGNED · PREPARE',preparing:'PREPARING',ready:'READY',assigned:'RIDER PICKUP',picked_up:'RIDER PICKUP'};
   el.innerHTML=(rows||[]).filter(o=>status[o.status]).map(o=>'<article><strong>'+displayOrderNumber(o)+'</strong><span>'+status[o.status]+'</span><small>'+new Date(o.created_at).toLocaleTimeString('th-TH')+'</small><p>'+(o.items||[]).map(i=>safe(i.item_name)+' × '+Number(i.quantity)).join(' · ')+'</p><b>'+cash(o.subtotal)+'</b><div>'+(o.status==='pending'?'<button onclick="qgKitchenAction(this,this.dataset.id,\'accepted\')" data-id="'+safe(o.id)+'">รับออเดอร์</button>':o.status==='rider_assigned'?'<button onclick="qgKitchenAction(this,this.dataset.id,\'preparing\')" data-id="'+safe(o.id)+'">เริ่มเตรียม</button>':o.status==='preparing'?'<button onclick="qgKitchenAction(this,this.dataset.id,\'ready\')" data-id="'+safe(o.id)+'">พร้อมให้ไรเดอร์รับ</button>':'')+(o.status==='assigned'?'<small>ไรเดอร์กำลังมารับ</small>':'')+'</div></article>').join('')||'<p>ไม่มีออเดอร์ในครัวขณะนี้</p>';
 }catch(e){el.textContent='โหลดออเดอร์ครัวไม่สำเร็จ: '+e.message}};
 window.qgKitchenAction=async function(button,id,action){
 if(typeof qgmMerchantActionOnce!=='function')return toast('ระบบอัปเดตออเดอร์ยังไม่พร้อม');
 qgmSetOrderActionBusy(button,true,action==='accepted'?'กำลังรับ...':action==='preparing'?'กำลังเตรียม...':'กำลังพร้อมส่ง...');
 let result;
 try{
  result=await qgmMerchantActionOnce(id,action,null);
 }catch(e){
  if(e?.qgUncertain){
   qgmSetOrderActionBusy(button,true,'กำลังตรวจสอบสถานะ...');
   try{
    await new Promise(r=>setTimeout(r,700));
    result=await qgmMerchantActionOnce(id,action,null);
    qgmApplyMerchantActionResult(id,result);
    toast(action==='accepted'?'รับออเดอร์แล้ว':action==='preparing'?'เริ่มเตรียมสินค้าแล้ว':'พร้อมให้ไรเดอร์รับแล้ว');

    Promise.resolve().then(()=>qtBackgroundHydrate({light:false})).catch(refreshErr=>console.warn('merchant hydrate after kitchen recovery failed',refreshErr));
   }catch(retryErr){
    qgmSetOrderActionBusy(button,false);
    if(!retryErr?.qgUncertain)toast('อัปเดตออเดอร์ไม่สำเร็จ: '+(retryErr.message||retryErr));
    else Promise.resolve().then(()=>{qgLoadKitchen();return qtBackgroundHydrate({light:false})}).catch(()=>{});
   }
   return;
  }
  qgmSetOrderActionBusy(button,false);
  toast('อัปเดตออเดอร์ไม่สำเร็จ: '+(e.message||e));
  return;
 }
 qgmApplyMerchantActionResult(id,result);
 toast(action==='accepted'?'รับออเดอร์แล้ว':action==='preparing'?'เริ่มเตรียมสินค้าแล้ว':'พร้อมให้ไรเดอร์รับแล้ว');
 Promise.resolve().then(()=>qgLoadKitchen()).catch(e=>console.warn('merchant kitchen refresh failed',e));
 Promise.resolve().then(()=>qtBackgroundHydrate({light:false})).catch(e=>console.warn('merchant hydrate after kitchen action failed',e));

 window.qgLoadMerchantAnalytics=async function(days){const el=document.getElementById('qg-v22-analytics-result');if(!el)return;el.textContent='กำลังโหลด...';try{const token=await qtGetAccessToken(),r=await qtSupabaseTable('rpc/qg_merchant_analytics',{method:'POST',accessToken:token,body:{p_days:days}});if(!el.isConnected)return;const items=(r.top_items||[]).map(x=>'<p>'+safe(x.name)+' · '+Number(x.quantity)+' ชิ้น</p>').join('');el.innerHTML='<div class="qg-v22-analytics-grid">'+[['ยอดขาย',cash(r.sales)],['จำนวนออเดอร์',r.orders],['มูลค่าเฉลี่ย',cash(r.average_order_value)],['ยกเลิก',r.cancelled+' ('+r.cancellation_rate+'%)'],['เตรียมสินค้าเฉลี่ย',r.avg_prep_minutes===null?'ยังไม่มีข้อมูล':r.avg_prep_minutes+' นาที']].map(([a,b])=>'<div><small>'+a+'</small><b>'+b+'</b></div>').join('')+'</div><h3>เมนูขายดี</h3>'+(items||'<p>ยังไม่มีข้อมูล</p>')}catch(e){el.textContent='โหลดสถิติไม่สำเร็จ: '+e.message}};
