<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ฝากซัก | QueueGo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Thai",sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;padding:18px 18px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:14px}.back{border:0;background:#f2f3f5;width:42px;height:42px;border-radius:14px;font-size:25px}.title{font-size:23px;font-weight:800}.wrap{padding:18px;max-width:680px;margin:auto}.hero{background:#e6002d;color:#fff;border-radius:24px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;opacity:.9}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 5px 22px #0000000b}.shop{display:flex;align-items:center;gap:14px;cursor:pointer}.washer{width:54px;height:54px;border-radius:17px;background:#fff0f2;color:#e6002d;padding:12px}.washer svg{width:100%;height:100%}.shop .name{font-weight:800;font-size:18px}.muted{color:#777;font-size:14px;margin-top:4px;line-height:1.45}.arrow{margin-left:auto;font-size:27px;color:#999}.empty{text-align:center;color:#777;padding:35px 10px}.services label{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid #eee;padding:15px;border-radius:15px;margin:9px 0}.services span{color:#555}.location,.qtybox{border:1px solid #eee;border-radius:16px;padding:15px;margin:14px 0}.primary{width:100%;border:0;border-radius:16px;background:#e6002d;color:#fff;padding:16px;font-size:17px;font-weight:800}.primary:disabled{opacity:.55}.in{width:100%;border:1px solid #e5e7eb;border-radius:14px;padding:13px;font:inherit;resize:vertical;margin-top:7px}.fee{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #eee;padding:10px 0;font-size:14px}.fee.total{font-size:17px;font-weight:800}.hidden{display:none}.notice{background:#fff8e6;border:1px solid #ffe1a6;border-radius:16px;padding:14px;color:#744b00;line-height:1.5}.hint{font-size:12px;color:#777;line-height:1.5}
</style></head><body>
<header class="top"><button class="back" onclick="history.length>1?history.back():location.href='../'">‹</button><div class="title">ฝากซัก</div></header>
<main class="wrap">
<section id="list"><div class="hero"><h1>ฝากซัก</h1><p>เลือกร้านและบริการ ร้านยืนยันก่อน แล้ว Rider ไปรับผ้าถึงที่และส่งคืนเมื่อเสร็จ</p></div><div id="shops" class="empty">กำลังโหลดร้านซัก...</div></section>
<section id="order" class="hidden"><div class="card"><h2 id="shopName">ร้านซัก</h2><div id="services" class="services"></div><div id="quantity" class="qtybox hidden"></div><div id="fees"></div><h3>จุดรับผ้า</h3><div id="location" class="location">ใช้ที่อยู่จัดส่งของบัญชี QueueGo</div><label for="note"><b>หมายเหตุ</b></label><textarea id="note" class="in" maxlength="500" rows="3" placeholder="เช่น โทรก่อนถึง / มีผ้าสีตก"></textarea><button id="confirm" class="primary">ส่งคำขอฝากซัก</button><p class="muted">ราคาและค่ารับส่งจะถูกบันทึกกับออเดอร์ทันที ร้านเปลี่ยนราคาในภายหลังจะไม่ย้อนมาเปลี่ยนออเดอร์นี้</p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://pkypiqhlrmzocysgeqew.supabase.co';
const KEY='sb_publishable_Vn2Il4jp-iBtzNsGRNY8Lg_Tpvk2Vre';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const washer='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M4 7.5h16"/><circle cx="12" cy="14.5" r="4.5"/><circle cx="8" cy="5" r=".65" fill="currentColor" stroke="none"/><circle cx="11" cy="5" r=".65" fill="currentColor" stroke="none"/></svg>';
let hub=null,service=null,services=[],customer=null,settingsByHub=new Map(),sending=false;
const pendingKey=()=>customer?.id?'qg_laundry_pending_'+customer.id:null;
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uuid(){return crypto.randomUUID()}
function feeText(n){const v=Number(n||0);return v.toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2})+' บาท'}
function unitLabel(t){return ({per_kg:'กก.',per_item:'ชิ้น',per_set:'ชุด',fixed:'เหมาจ่าย'})[t]||''}
function deliveryFee(cfg){return cfg?.delivery_fee_mode==='round_trip'?Number(cfg.round_trip_fee||0):Number(cfg.base_pickup_fee||0)+Number(cfg.return_fee||0)}
function quantityValue(){const el=document.getElementById('qty-input');if(!el||el.value==='')return null;const n=Number(el.value);return Number.isFinite(n)&&n>0?n:null}
function renderQuote(){
  if(!hub||!service)return;
  const cfg=settingsByHub.get(String(hub.id))||{},delivery=deliveryFee(cfg),qty=quantityValue(),min=Number(cfg.minimum_order||0),unit=Number(service.price||0);
  let svc=null;
  if(service.pricing_type==='fixed')svc=Math.max(unit,min);
  else if(qty!=null)svc=Math.max(unit*qty,min);
  const fees=document.getElementById('fees');
  const feeRows=cfg.delivery_fee_mode==='round_trip'
    ?'<div class="fee"><span>ค่ารับ-ส่งรวม</span><b>'+feeText(cfg.round_trip_fee)+'</b></div>'
    :'<div class="fee"><span>ค่ารับผ้า</span><b>'+feeText(cfg.base_pickup_fee)+'</b></div><div class="fee"><span>ค่าส่งคืน</span><b>'+feeText(cfg.return_fee)+'</b></div>';
  fees.innerHTML=feeRows+'<div class="fee"><span>ค่าบริการ'+(svc==null?' (สรุปตามจำนวนจริง)':'')+'</span><b>'+(svc==null?'รอร้านสรุป':feeText(svc))+'</b></div><div class="fee total"><span>ยอดประมาณ</span><span>'+(svc==null?'รอสรุปจำนวนจริง':feeText(svc+delivery))+'</span></div>';
}
function renderQuantity(){
  const box=document.getElementById('quantity');if(!service)return;
  if(service.pricing_type==='fixed'){box.classList.add('hidden');box.innerHTML='';renderQuote();return}
  const label=service.pricing_type==='per_kg'?'น้ำหนักโดยประมาณ (กก.)':service.pricing_type==='per_item'?'จำนวนชิ้นโดยประมาณ':'จำนวนชุดโดยประมาณ';
  box.classList.remove('hidden');box.innerHTML='<label for="qty-input"><b>'+label+'</b></label><input id="qty-input" class="in" type="number" min="0.01" max="1000" step="'+(service.pricing_type==='per_kg'?'0.1':'1')+'" placeholder="ไม่แน่ใจสามารถเว้นว่างได้"><p class="hint">ใช้เพื่อประมาณราคาเท่านั้น ร้านจะชั่ง/นับจำนวนจริงก่อนสรุปยอด</p>';
  document.getElementById('qty-input').oninput=renderQuote;renderQuote();
}
async function boot(){
  const {data:{session}}=await db.auth.getSession();if(!session){location.href='../#login';return}
  const {data:u,error:uerr}=await db.from('users').select('id,name,phone,metadata,role,status').eq('auth_user_id',session.user.id).maybeSingle();
  if(uerr||!u||u.role!=='customer'||u.status!=='active'){location.href='../#login';return}
  customer=u;
  const {data:enabled,error:ferr}=await db.rpc('queuego_feature_enabled',{p_feature:'laundry'});
  const el=document.getElementById('shops');
  if(ferr){el.innerHTML='<div class="notice">โหลดสถานะฝากซักไม่สำเร็จ กรุณาลองใหม่</div>';return}
  if(enabled!==true){el.innerHTML='<div class="notice"><b>ฝากซักอยู่ในโหมดปิดทดสอบ</b><br>ระบบจะเปิดใช้งานเมื่อผ่าน Regression และ Admin เปิดสวิตช์</div>';return}
  const [{data:h,error:he},{data:st,error:se}]=await Promise.all([
    db.from('laundry_hubs').select('id,name,shop_id').eq('active',true),
    db.from('laundry_shop_settings').select('hub_id,enabled,accepts_pickup,accepts_return,minimum_order,base_pickup_fee,return_fee,round_trip_fee,delivery_fee_mode,currency').eq('enabled',true).eq('accepts_pickup',true).eq('accepts_return',true)
  ]);
  if(he||se){el.innerHTML='โหลดร้านซักไม่สำเร็จ';return}
  (st||[]).forEach(x=>settingsByHub.set(String(x.hub_id),x));
  const hubs=(h||[]).filter(x=>settingsByHub.has(String(x.id)));
  if(!hubs.length){el.innerHTML='ยังไม่มีร้านซักเปิดให้บริการ';return}
  el.className='';el.innerHTML=hubs.map(x=>'<button type="button" class="card shop" data-id="'+safe(x.id)+'" style="width:100%;border:0;text-align:left"><div class="washer">'+washer+'</div><div><div class="name">'+safe(x.name)+'</div><div class="muted">Rider รับผ้าและส่งคืนถึงที่</div></div><div class="arrow">›</div></button>').join('');
  el.querySelectorAll('.shop').forEach(b=>b.onclick=()=>openShop(hubs.find(x=>String(x.id)===String(b.dataset.id))));
}
async function openShop(h){
  hub=h;service=null;services=[];
  document.getElementById('list').classList.add('hidden');document.getElementById('order').classList.remove('hidden');document.getElementById('shopName').textContent=h.name;
  const {data:s,error}=await db.from('laundry_services').select('id,code,name,price,pricing_type,description,estimated_minutes').eq('hub_id',h.id).eq('active',true).order('sort_order');
  const box=document.getElementById('services');
  if(error||!s?.length){box.innerHTML='<div class="notice">ร้านนี้ยังไม่มีบริการที่เปิดขาย</div>';document.getElementById('confirm').disabled=true;return}
  services=s;service=s[0];document.getElementById('confirm').disabled=false;
  box.innerHTML=s.map((x,i)=>'<label><input type="radio" name="svc" value="'+safe(x.id)+'" '+(i===0?'checked':'')+'><span><b>'+safe(x.name)+'</b><small class="muted" style="display:block">'+safe(x.description||'')+(x.estimated_minutes?' · ประมาณ '+Number(x.estimated_minutes)+' นาที':'')+'</small></span><span>'+feeText(x.price)+(x.pricing_type!=='fixed'?' / '+unitLabel(x.pricing_type):'')+'</span></label>').join('');
  document.querySelectorAll('[name=svc]').forEach(x=>x.onchange=()=>{service=services.find(v=>String(v.id)===String(x.value))||services[0];renderQuantity()});
  const m=customer.metadata||{};document.getElementById('location').textContent=m.address||m.delivery_address||m.location_address||'ยังไม่มีพิกัดจัดส่งที่บันทึกไว้';
  renderQuantity();
}
document.getElementById('confirm').onclick=async()=>{
  if(sending)return;
  const {data:{session}}=await db.auth.getSession();if(!session)return location.href='../#login';
  if(!hub||!service)return alert('กรุณาเลือกบริการ');
  const m=customer.metadata||{},lat=Number(m.lat??m.latitude),lng=Number(m.lng??m.longitude),addr=String(m.address||m.delivery_address||m.location_address||'').trim();
  if(!Number.isFinite(lat)||!Number.isFinite(lng)||!addr){alert('กรุณาปักพิกัดจัดส่งใน QueueGo ก่อน');location.href='../#profile';return}
  const qty=quantityValue(),key=pendingKey();let req=null;try{req=JSON.parse(localStorage.getItem(key)||'null')}catch(e){}
  if(!req||req.hub_id!==hub.id||req.service_id!==service.id||String(req.qty??'')!==String(qty??'')){req={request_id:uuid(),hub_id:hub.id,service_id:service.id,qty};localStorage.setItem(key,JSON.stringify(req))}
  sending=true;const btn=document.getElementById('confirm');btn.disabled=true;btn.textContent='กำลังส่งคำขอ...';
  try{
    const {data,error}=await db.rpc('queuego_place_laundry_order_v2',{
      p_request_id:req.request_id,p_hub_id:hub.id,p_service_id:service.id,
      p_pickup_address:addr,p_pickup_latitude:lat,p_pickup_longitude:lng,
      p_estimated_quantity:qty,p_note:String(document.getElementById('note').value||'').trim().slice(0,500)||null
    });
    if(error)throw error;
    localStorage.removeItem(key);
    alert('ส่งคำขอฝากซักแล้ว '+(data?.order_number||'')+' รอร้านกดรับคำขอ');
    location.href='../#orders';
  }catch(e){
    const msg=String(e?.message||e);
    if(/disabled|unavailable|invalid|active customer|Rider unavailable|OUTSIDE_SERVICE_AREA|DELIVERY_DISTANCE_EXCEEDED/i.test(msg))try{localStorage.removeItem(key)}catch(_){}
    const areaMessage=/OUTSIDE_SERVICE_AREA/.test(msg)?'ตำแหน่งรับผ้าอยู่นอกพื้นที่ให้บริการ QueueGo Pilot':/DELIVERY_DISTANCE_EXCEEDED/.test(msg)?'ร้านซักและจุดรับผ้าอยู่ห่างเกินขอบเขตที่ QueueGo Pilot ให้บริการ':'';
    alert(areaMessage||('ส่งคำขอไม่สำเร็จ: '+msg.slice(0,140)));
  }finally{sending=false;if(btn.isConnected){btn.disabled=false;btn.textContent='ส่งคำขอฝากซัก'}}
};
boot();
</script></body></html>
