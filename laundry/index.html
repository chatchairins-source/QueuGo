<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>ฝากซัก | QueueGo</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17181a;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Noto Sans Thai",sans-serif}.top{position:sticky;top:0;background:#fff;padding:18px 18px 14px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:14px}.back{border:0;background:#f2f3f5;width:42px;height:42px;border-radius:14px;font-size:25px}.title{font-size:23px;font-weight:800}.wrap{padding:18px;max-width:680px;margin:auto}.hero{background:#e6002d;color:#fff;border-radius:24px;padding:22px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:25px}.hero p{margin:0;opacity:.9}.card{background:#fff;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 5px 22px #0000000b}.shop{display:flex;align-items:center;gap:14px;cursor:pointer}.washer{width:54px;height:54px;border-radius:17px;background:#fff0f2;color:#e6002d;padding:12px}.washer svg{width:100%;height:100%}.shop .name{font-weight:800;font-size:18px}.muted{color:#777;font-size:14px;margin-top:4px}.arrow{margin-left:auto;font-size:27px;color:#999}.empty{text-align:center;color:#777;padding:35px 10px}.services label{display:flex;align-items:center;gap:10px;border:1px solid #eee;padding:15px;border-radius:15px;margin:9px 0}.services span{margin-left:auto}.location{border:1px solid #eee;border-radius:16px;padding:15px;margin:14px 0}.primary{width:100%;border:0;border-radius:16px;background:#e6002d;color:#fff;padding:16px;font-size:17px;font-weight:800}.hidden{display:none}</style></head><body><header class="top"><button class="back" onclick="history.length>1?history.back():location.href='../'">‹</button><div class="title">ฝากซัก</div></header><main class="wrap"><section id="list"><div class="hero"><h1>ฝากซัก</h1><p>เลือกบริการ แล้วให้ Rider ไปรับผ้าถึงที่</p></div><div id="shops" class="empty">กำลังโหลดร้านซัก...</div></section><section id="order" class="hidden"><div class="card"><h2 id="shopName">ร้านซัก</h2><div id="services" class="services"></div><h3>จุดรับผ้า</h3><div id="location" class="location">ใช้ที่อยู่จัดส่งของบัญชี QueueGo</div><button id="confirm" class="primary">ยืนยันเรียก Rider รับผ้า</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://pkypiqhlrmzocysgeqew.supabase.co';
const KEY='sb_publishable_Ty2Hs1PRYrm5R2g-WbscEw_5TM1N3YR';
const db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const washer='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2.5" width="16" height="19" rx="2.5"/><path d="M4 7.5h16"/><circle cx="12" cy="14.5" r="4.5"/><circle cx="8" cy="5" r=".65" fill="currentColor" stroke="none"/><circle cx="11" cy="5" r=".65" fill="currentColor" stroke="none"/></svg>';
let hub=null,service='wash',customer=null;
async function boot(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='../#login';return}const {data:u}=await db.from('users').select('id,name,phone,metadata').eq('auth_user_id',session.user.id).maybeSingle();customer=u;if(!u){location.href='../#login';return}const {data:h}=await db.from('laundry_hubs').select('id,name,shop_id').eq('active',true);const el=document.getElementById('shops');if(!h?.length){el.innerHTML='ยังไม่มีร้านซักเปิดให้บริการ';return}el.className='';el.innerHTML=h.map(x=>'<div class="card shop" data-id="'+x.id+'"><div class="washer">'+washer+'</div><div><div class="name">'+safe(x.name)+'</div><div class="muted">บริการรับ-ส่งผ้าถึงที่</div></div><div class="arrow">›</div></div>').join('');el.querySelectorAll('.shop').forEach(b=>b.onclick=()=>openShop(h.find(x=>x.id===b.dataset.id)))}
async function openShop(h){hub=h;document.getElementById('list').classList.add('hidden');document.getElementById('order').classList.remove('hidden');document.getElementById('shopName').textContent=h.name;const {data:s}=await db.from('laundry_services').select('code,name,price,pricing_type').eq('hub_id',h.id).eq('active',true).order('sort_order');service=s?.[0]?.code||'wash';document.getElementById('services').innerHTML=(s||[]).map((x,i)=>'<label><input type="radio" name="svc" value="'+safe(x.code)+'" '+(i===0?'checked':'')+'><b>'+safe(x.name)+'</b><span>'+(Number(x.price)>0?Number(x.price)+' บาท':'')+'</span></label>').join('');document.querySelectorAll('[name=svc]').forEach(x=>x.onchange=()=>service=x.value);const m=customer.metadata||{};document.getElementById('location').textContent=m.address||m.delivery_address||m.location_address||'ใช้พิกัดจัดส่งที่บันทึกใน QueueGo'}
document.getElementById('confirm').onclick=async()=>{const {data:{session}}=await db.auth.getSession();if(!session)return location.href='../#login';const m=customer.metadata||{},lat=Number(m.lat??m.latitude),lng=Number(m.lng??m.longitude),addr=m.address||m.delivery_address||m.location_address||'';if(!Number.isFinite(lat)||!Number.isFinite(lng)){alert('กรุณาปักพิกัดจัดส่งใน QueueGo ก่อน');location.href='../#profile';return}const {data:o,error}=await db.from('laundry_orders').insert({customer_id:customer.id,hub_id:hub.id,service_type:service,pickup_address:addr,pickup_latitude:lat,pickup_longitude:lng}).select('order_number').single();if(error)return alert('สร้างรายการไม่สำเร็จ');alert('เรียก Rider รับผ้าแล้ว '+o.order_number);location.href='../#orders'};
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}boot();
</script></body></html>
